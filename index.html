    // Fonction utilitaire pour formater la durée en secondes
    const formatDuration=(seconds)=>{
      if(!seconds||seconds<=0)return'-';
      const h=Math.floor(seconds/3600);
      const m=Math.floor((seconds%3600)/60);
      if(h>0)return`${h}h ${m}min`;
      return`${m}min`;
    };
    
    // Fonction utilitaire pour parser les URLs Vimeo (y compris vidéos privées avec hash)
    // Formats supportés:
    // - https://vimeo.com/123456789
    // - https://vimeo.com/123456789/abcdef1234 (vidéo privée)
    // - https://player.vimeo.com/video/123456789?h=abcdef1234
    // - 123456789 (ID seul)
    // - 123456789/abcdef1234 (ID + hash)
    const parseVimeoUrl=(input)=>{
      if(!input)return{id:'',hash:''};
      const str=String(input).trim();
      
      // Format: player.vimeo.com/video/ID?h=HASH
      let match=str.match(/player\.vimeo\.com\/video\/(\d+)\?h=([a-zA-Z0-9]+)/);
      if(match)return{id:match[1],hash:match[2]};
      
      // Format: vimeo.com/ID/HASH
      match=str.match(/vimeo\.com\/(\d+)\/([a-zA-Z0-9]+)/);
      if(match)return{id:match[1],hash:match[2]};
      
      // Format: vimeo.com/ID (sans hash)
      match=str.match(/vimeo\.com\/(\d+)/);
      if(match)return{id:match[1],hash:''};
      
      // Format: ID/HASH (sans domaine)
      match=str.match(/^(\d+)\/([a-zA-Z0-9]+)$/);
      if(match)return{id:match[1],hash:match[2]};
      
      // Format: ID seul
      match=str.match(/^(\d+)$/);
      if(match)return{id:match[1],hash:''};
      
      return{id:str,hash:''};
    };
    
    // Construire l'URL d'embed Vimeo avec hash si présent
    const buildVimeoEmbedUrl=(vimeoId,vimeoHash,options={})=>{
      if(!vimeoId)return'';
      let url=`https://player.vimeo.com/video/${vimeoId}`;
      const params=[];
      if(vimeoHash)params.push(`h=${vimeoHash}`);
      if(options.background)params.push('background=1','muted=1','autoplay=1');
      else if(options.autoplay)params.push('autoplay=1');
      if(options.preview)params.push('controls=1','fullscreen=0','pip=0','quality=360p','dnt=1');
      if(params.length>0)url+=`?${params.join('&')}`;
      return url;
    };
    
    // Formater le temps en format lisible (3600 → "1h 0min", 90 → "1min 30s")
    const formatTime=(seconds)=>{

      const s=seconds%60;

      if(m>0)return `${m}min ${s}s`;

    };
    
    // Formater le temps en format compact (90 → "1:30")
    const formatTimeCompact=(seconds)=>{

    // Labels et couleurs SCORM
    const SCORM_STATUS_LABELS={

    // Auth Context avec mode "Vue comme"
    const AuthContext=createContext(null);
    function AuthProvider({children}){

      const[profile,setProfile]=useState(null);
      const[center,setCenter]=useState(null);
      const[permissions,setPermissions]=useState({});
      const[loading,setLoading]=useState(true);
      const[sessionError,setSessionError]=useState(false);
      
      // Mode "Vue comme" pour Super Admin
      const[viewAs,setViewAs]=useState(null);
      
      // Refs pour éviter les boucles infinies et appels multiples
      const isRefreshingRef=useRef(false);
      const lastRefreshRef=useRef(0);
      const initializedRef=useRef(false); // IMPORTANT: empêche INITIAL_SESSION multiple
      const profileRef=useRef(null); // Ref pour le profil actuel
      const userRef=useRef(null); // Ref pour l'utilisateur actuel
      const isLoadingProfileRef=useRef(false); // Empêche les appels parallèles à loadProfile

      // Mettre à jour les refs quand les états changent
      useEffect(()=>{profileRef.current=profile;},[profile]);
      useEffect(()=>{userRef.current=user;},[user]);

      // loadProfile sans dépendance sur profile (utilise profileRef)
      const loadProfile=useCallback(async(userId)=>{
        // Éviter les appels parallèles
        if(isLoadingProfileRef.current){
          console.log('loadProfile déjà en cours, ignoré');
          return profileRef.current;
        }
        isLoadingProfileRef.current=true;
        
        try{
          const{data,error:err}=await supabase.from('profiles').select('*,centers(*)').eq('id',userId).single();
          // Ignorer les erreurs AbortError (requête annulée)
          if(err){
            if(err.message?.includes('AbortError')||err.code==='PGRST301'){
              isLoadingProfileRef.current=false;
              return profileRef.current; // Retourner le profil existant
            }
            throw err;
          }
          setProfile(data);
          setCenter(data?.centers);
          const{data:perms}=await supabase.from('role_permissions').select('permissions').eq('role',data?.role).single();
          setPermissions(perms?.permissions||{});
          isLoadingProfileRef.current=false;
          return data;
        }catch(e){
          isLoadingProfileRef.current=false;
          // Ignorer AbortError
          if(e.message?.includes('AbortError')||e.name==='AbortError'){
            console.log('Requête profile annulée (AbortError) - ignorée');
            return profileRef.current;
          }
          console.error('Erreur loadProfile:',e);
          return null;
        }
      },[]); // PAS DE DÉPENDANCE ICI - utilise profileRef à la place

      // Fonction pour vérifier et rafraîchir la session (avec protection contre les appels multiples)
      const checkAndRefreshSession=useCallback(async(force=false)=>{
        // Éviter les appels multiples rapprochés (debounce 2 secondes)
        const now=Date.now();
        if(!force&&(isRefreshingRef.current||(now-lastRefreshRef.current)<2000)){
          console.log('Check session ignoré (déjà en cours ou trop récent)');
          return null;
        }
        
        isRefreshingRef.current=true;
        lastRefreshRef.current=now;
        
        try{
          const{data:{session},error}=await supabase.auth.getSession();
          if(error){
            // Ignorer AbortError
            if(error.message?.includes('AbortError')){
              isRefreshingRef.current=false;
              return null;
            }
            console.error('Erreur getSession:',error);
            if(error.message?.includes('refresh_token')||error.message?.includes('invalid')||error.message?.includes('expired')){
              console.warn('Session invalide, déconnexion...');
              setSessionError(true);
              await supabase.auth.signOut();
              isRefreshingRef.current=false;
              return null;
            }
          }
          if(session?.user){
            // Tenter de rafraîchir le token si proche de l'expiration
            const expiresAt=session.expires_at;
            const nowSec=Math.floor(Date.now()/1000);
            const timeUntilExpiry=expiresAt-nowSec;
            
            // Si le token expire dans moins de 5 minutes, le rafraîchir
            if(timeUntilExpiry<300){
              console.log('Token proche expiration, rafraîchissement...');
              const{data:refreshData,error:refreshError}=await supabase.auth.refreshSession();
              if(refreshError){
                if(!refreshError.message?.includes('AbortError')){
                  console.error('Erreur refresh:',refreshError);
                  setSessionError(true);
                }
                isRefreshingRef.current=false;
                return null;
              }
              isRefreshingRef.current=false;
              return refreshData.session;
            }
            setSessionError(false);
            isRefreshingRef.current=false;
            return session;
          }
          isRefreshingRef.current=false;
          return null;
        }catch(e){
          if(!e.message?.includes('AbortError')){
            console.error('Erreur checkSession:',e);
          }
          isRefreshingRef.current=false;
          return null;
        }
      },[]);

      useEffect(()=>{
        let mounted=true;
        
        // Éviter la double initialisation (React StrictMode)
        if(initializedRef.current){
          console.log('AuthProvider déjà initialisé, skip');
          return;
        }
        initializedRef.current=true;
        
        // Timeout de sécurité : si le chargement prend plus de 10s, on arrête
        const timeout=setTimeout(()=>{
          if(mounted&&loading){
            console.warn('Auth timeout - forçage fin de chargement');
            setLoading(false);
          }
        },10000);
        
        const init=async()=>{
          try{
            const session=await checkAndRefreshSession(true); // Force le premier check
            if(mounted&&session?.user){
              setUser(session.user);
              await loadProfile(session.user.id);
            }
          }catch(e){
            if(!e.message?.includes('AbortError')){
              console.error('Erreur init auth:',e);
            }
          }finally{
            clearTimeout(timeout);
            if(mounted)setLoading(false);
          }
        };
        init();
        
        // Flag pour ne traiter INITIAL_SESSION qu'une seule fois
        let initialSessionHandled=false;
        
        // Listener pour les changements d'état auth
        const{data:{subscription}}=supabase.auth.onAuthStateChange(async(event,session)=>{
          if(!mounted)return;
          console.log('Auth event:',event);
          
          if(event==='SIGNED_IN'&&session?.user){
            setUser(session.user);
            setSessionError(false);
            // Ne recharger le profil que si c'est un nouvel utilisateur
            if(!profileRef.current||profileRef.current.id!==session.user.id){
              await loadProfile(session.user.id);
            }
          }
          else if(event==='SIGNED_OUT'){
            setUser(null);
            setProfile(null);
            setCenter(null);
            setPermissions({});
            setViewAs(null);
          }
          else if(event==='TOKEN_REFRESHED'){
            console.log('Token rafraîchi avec succès');
            setSessionError(false);
            if(session?.user){
              setUser(session.user);
            }
          }
          else if(event==='INITIAL_SESSION'){
            // IMPORTANT: Ne traiter qu'une seule fois pour éviter la boucle infinie
            if(initialSessionHandled){
              console.log('INITIAL_SESSION déjà traité, ignoré');
              return;
            }
            initialSessionHandled=true;
            
            // Session restaurée depuis le storage
            if(session?.user){
              setUser(session.user);
              setSessionError(false);
              // Ne charger que si pas déjà chargé
              if(!profileRef.current||profileRef.current.id!==session.user.id){
                await loadProfile(session.user.id);
              }
            }
          }
        });
        
        // Listener pour la visibilité de l'onglet (avec délai pour éviter les conflits)
        let visibilityTimeout=null;
        const handleVisibilityChange=()=>{
          if(document.visibilityState==='visible'&&mounted){
            // Délai de 500ms pour laisser Supabase gérer d'abord
            if(visibilityTimeout)clearTimeout(visibilityTimeout);
            visibilityTimeout=setTimeout(async()=>{
              console.log('Onglet redevenu visible, vérification session...');
              const session=await checkAndRefreshSession();
              if(!session&&userRef.current){
                // Avait un user mais plus de session valide
                console.warn('Session perdue, déconnexion...');
                setUser(null);
                setProfile(null);
                setCenter(null);
                setPermissions({});
                setViewAs(null);
                setSessionError(true);
              }
            },500);
          }
        };
        
        document.addEventListener('visibilitychange',handleVisibilityChange);
        
        // Heartbeat toutes les 4 minutes pour garder la session active
        const heartbeatInterval=setInterval(async()=>{
          if(document.visibilityState==='visible'&&userRef.current){
            console.log('Heartbeat session...');
            await checkAndRefreshSession();
          }
        },4*60*1000);
        
        return()=>{
          mounted=false;
          clearTimeout(timeout);
          if(visibilityTimeout)clearTimeout(visibilityTimeout);
          clearInterval(heartbeatInterval);
          document.removeEventListener('visibilitychange',handleVisibilityChange);
          subscription.unsubscribe();
        };
      },[]); // IMPORTANT: pas de dépendances pour éviter de recréer le listener

      const signIn=async(email,password)=>{
        try{
          setSessionError(false);
          const{error:err}=await supabase.auth.signInWithPassword({email,password});
          if(err)throw err;
          return{success:true};
        }catch(e){return{success:false,error:e.message};}
      };
      const signOut=async()=>{setViewAs(null);await supabase.auth.signOut();};

      // Fonctions adaptées au mode "Vue comme"
      const realIsSuperAdmin=profile?.role==='super_admin';
      const realRole=profile?.role;
      
      // Vérifier une permission
      const can=(perm)=>realIsSuperAdmin||permissions[perm]===true;
      
      // Vérifier si l'utilisateur peut agir sur un centre spécifique
      const canForCenter=(perm,centerId)=>{
        if(realIsSuperAdmin)return true;
        if(!can(perm))return false;
        // Admin centre et formateur: seulement leur propre centre
        if(realRole==='center_admin'||realRole==='trainer'){
          return center?.id===centerId;
        }
        return true;
      };
      
      // Vérifier les rôles que l'utilisateur peut assigner
      const canAssignRole=(targetRole)=>{
        if(realIsSuperAdmin)return true;
        if(!can('assign_roles'))return false;
        // Admin centre: peut assigner apprenant et formateur seulement
        if(realRole==='center_admin'){
          return['learner','trainer'].includes(targetRole);
        }
        // Formateur: peut créer des apprenants seulement
        if(realRole==='trainer'){
          return targetRole==='learner';
        }
        return false;
      };
      
      // Rôle effectif
      const effectiveRole=viewAs?.role||profile?.role;
      const effectiveCenter=viewAs?{id:viewAs.center_id,name:viewAs.center_name}:center;
      
      const isSuperAdmin=!viewAs&&realIsSuperAdmin;
      const isCenterAdmin=viewAs?(viewAs.role==='center_admin'||viewAs.role==='trainer'):(profile?.role==='center_admin'||profile?.role==='trainer');
      const isLearner=viewAs?viewAs.role==='learner':profile?.role==='learner';
      
      // Fonction pour changer de vue
      const switchView=(role,centerId,centerName)=>{
        if(!realIsSuperAdmin)return;
        if(role===null)setViewAs(null);
        else setViewAs({role,center_id:centerId,center_name:centerName});
      };
      const exitViewAs=()=>setViewAs(null);

      const value={
        user,profile,
        center:effectiveCenter,
        loading,signIn,signOut,
        isAuth:!!user,
        isSuperAdmin,
        realIsSuperAdmin,
        realRole,
        isCenterAdmin,
        isLearner,
        effectiveRole,
        role:effectiveRole||'learner',
        can,canForCenter,canAssignRole,permissions,
        viewAs,switchView,exitViewAs,
        sessionError,
        checkSession:checkAndRefreshSession,
        reload:async()=>{if(user)await loadProfile(user.id);}
      };
      return<AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
    }
    const useAuth=()=>useContext(AuthContext);

    function useLicenseInfo(){
      const{center,isSuperAdmin}=useAuth();
      const[licensedIds,setLicensedIds]=useState({videos:[],scorm:[],quizzes:[],courses:[],paths:[],hasFullCatalog:false,hasAnyLicense:false});
      const[licenseLoading,setLicenseLoading]=useState(false);
      
      const loadLicenses=useCallback(async()=>{
        if(isSuperAdmin||!center?.id){setLicensedIds({videos:[],scorm:[],quizzes:[],courses:[],paths:[],hasFullCatalog:isSuperAdmin,hasAnyLicense:isSuperAdmin});return;}
        setLicenseLoading(true);
        try{
          const today=new Date().toISOString().split('T')[0];
          // Load licenses - try with content_packs join, fallback without
          let licenses=[];
          const{data:licData,error:licErr}=await supabase.from('center_licenses').select('*,content_packs(pack_type)').eq('center_id',center.id).eq('status','active').lte('start_date',today).gte('end_date',today);
          if(licErr){
            console.warn('License query with join failed, trying without:',licErr);
            const{data:licFallback}=await supabase.from('center_licenses').select('*').eq('center_id',center.id).eq('status','active').lte('start_date',today).gte('end_date',today);
            licenses=licFallback||[];
          }else{
            licenses=licData||[];
          }
          
          console.log('[LicenseInfo] Active licenses:',licenses.length,licenses.map(l=>({id:l.id?.slice(0,8),type:l.license_type,pack:l.pack_id?.slice(0,8)})));
          
          const info={videos:[],scorm:[],quizzes:[],courses:[],paths:[],hasFullCatalog:false,hasAnyLicense:licenses.length>0};
          
          // Check full catalog
          info.hasFullCatalog=licenses.some(l=>
            l.license_type==='full_catalog'
            ||l.content_packs?.pack_type==='full_catalog'
            ||(l.license_type==='resource_volume'&&l.full_catalog===true)
          );
          
          if(!info.hasFullCatalog){
            // 1. Load content_pack_items for ALL licenses with pack_id (bundle, content_pack, etc.)
            const packIds=licenses.filter(l=>l.pack_id).map(l=>l.pack_id);
            if(packIds.length>0){
              const{data:items,error:itemsErr}=await supabase.from('content_pack_items').select('content_type,content_id').in('pack_id',packIds);
              if(itemsErr)console.warn('Pack items load error:',itemsErr);
              console.log('[LicenseInfo] Pack items loaded:',items?.length||0);
              (items||[]).forEach(i=>{
                const key=i.content_type==='video'?'videos':i.content_type==='scorm'?'scorm':i.content_type==='quiz'?'quizzes':i.content_type==='course'?'courses':i.content_type==='path'?'paths':null;
                if(key&&!info[key].includes(i.content_id))info[key].push(i.content_id);
              });
            }
            
            // 2. Load license_resources for resource_volume licenses
            const volumeLicIds=licenses.filter(l=>l.license_type==='resource_volume').map(l=>l.id);
            if(volumeLicIds.length>0){
              try{
                const{data:resources,error:resErr}=await supabase.from('license_resources').select('content_type,content_id').in('license_id',volumeLicIds);
                if(!resErr&&resources){
                  console.log('[LicenseInfo] Volume resources:',resources.length);
                  resources.forEach(r=>{
                    const key=r.content_type==='video'?'videos':r.content_type==='scorm'?'scorm':r.content_type==='quiz'?'quizzes':null;
                    if(key&&!info[key].includes(r.content_id))info[key].push(r.content_id);
                  });
                }
              }catch(e){console.warn('license_resources table not available:',e);}
            }
          }
          
          console.log('[LicenseInfo] Result:',{v:info.videos.length,s:info.scorm.length,q:info.quizzes.length,c:info.courses.length,p:info.paths.length,full:info.hasFullCatalog});
          setLicensedIds(info);
        }catch(e){console.error('License load error:',e);}
        setLicenseLoading(false);
      },[center?.id,isSuperAdmin]);
      
      useEffect(()=>{loadLicenses();},[loadLicenses]);
      
      const isLicensed=useCallback((type,id)=>{
        if(isSuperAdmin||licensedIds.hasFullCatalog)return true;
        const key=type==='video'?'videos':type==='scorm'?'scorm':type==='quiz'?'quizzes':type==='course'?'courses':type==='path'?'paths':type+'s';
        return licensedIds[key]?.includes(id)||false;
      },[isSuperAdmin,licensedIds]);
      
      return{licensedIds,licenseLoading,isLicensed,reloadLicenses:loadLicenses};
    }

    // Fonction pour parser le temps SCORM
    const parseScormTime=(timeStr)=>{
      if(!timeStr)return 0;
      // Format SCORM 1.2: HH:MM:SS ou HHHH:MM:SS.SS
      if(timeStr.includes(':')){
        const parts=timeStr.split(':');
        const h=parseInt(parts[0])||0;
        const m=parseInt(parts[1])||0;
        const s=parseFloat(parts[2])||0;
        return h*3600+m*60+Math.round(s);
      }
      // Format SCORM 2004: PT1H30M45S
      if(timeStr.startsWith('PT')){
        let seconds=0;
        const hMatch=timeStr.match(/(\d+)H/);
        const mMatch=timeStr.match(/(\d+)M/);
        const sMatch=timeStr.match(/(\d+(?:\.\d+)?)S/);
        if(hMatch)seconds+=parseInt(hMatch[1])*3600;
        if(mMatch)seconds+=parseInt(mMatch[1])*60;
        if(sMatch)seconds+=Math.round(parseFloat(sMatch[1]));
        return seconds;
      }
      return 0;
    };

        if(!email.trim()){
          setMsg({type:'error',text:'Veuillez entrer votre adresse email'});setLoading(false);return;
        }
        
        try{
          const{error}=await supabase.auth.resetPasswordForEmail(email.toLowerCase().trim(),{
            redirectTo:window.location.origin
          });
          
          if(error){
            setMsg({type:'error',text:error.message});
          }else{
            setMsg({type:'success',text:'📧 Si cette adresse existe, un email de réinitialisation a été envoyé. Vérifiez votre boîte de réception (et les spams).'});
          }
        }catch(err){
          setMsg({type:'error',text:'Erreur: '+err.message});
        }
        setLoading(false);
      };
      
      const handleRegister=async e=>{
        e.preventDefault();setLoading(true);setMsg(null);
        
        // Validations
        if(!firstName.trim()||!lastName.trim()){
          setMsg({type:'error',text:'Prénom et nom requis'});setLoading(false);return;
        }
        if(password.length<6){
          setMsg({type:'error',text:'Le mot de passe doit contenir au moins 6 caractères'});setLoading(false);return;
        }
        if(password!==confirmPassword){
          setMsg({type:'error',text:'Les mots de passe ne correspondent pas'});setLoading(false);return;
        }
        if(!centerCode.trim()){
          setMsg({type:'error',text:'Le code d\'inscription est requis'});setLoading(false);return;
        }
        
        try{
          const codeInput=centerCode.toUpperCase().trim();
          let centerId=null;
          let centerName='';
          let sessionToJoin=null;
          
          // 1. D'abord chercher si c'est un code de SESSION
          const{data:session}=await supabase.from('training_sessions')
            .select('id,name,code,center_id,status,content_type,content_id,auto_enroll,max_participants,centers(name)')
            .eq('code',codeInput)
            .in('status',['planned','open','in_progress'])
            .single();
          
          if(session){
            // Vérifier le nombre max de participants
            if(session.max_participants){
              const{count}=await supabase.from('session_participants').select('id',{count:'exact'}).eq('session_id',session.id);
              if(count>=session.max_participants){
                setMsg({type:'error',text:'Cette session est complète. Contactez votre centre de formation.'});
                setLoading(false);return;
              }
            }
            centerId=session.center_id;
            centerName=session.centers?.name||'Formation';
            sessionToJoin=session;
          }else{
            // 2. Sinon, chercher si c'est un code de CENTRE
            const{data:center,error:centerErr}=await supabase.from('centers').select('id,name').eq('registration_code',codeInput).single();
            if(centerErr||!center){
              setMsg({type:'error',text:'Code invalide. Vérifiez auprès de votre centre de formation.'});setLoading(false);return;
            }
            centerId=center.id;
            centerName=center.name;
          }
          
          // Créer le compte utilisateur
          const{data:authData,error:authErr}=await supabase.auth.signUp({
            email:email.toLowerCase().trim(),
            password,
            options:{
              data:{
                first_name:firstName.trim(),
                last_name:lastName.trim(),
                role:'learner',
                center_id:centerId
              }
            }
          });
          
          if(authErr){
            if(authErr.message.includes('already registered'))setMsg({type:'error',text:'Cet email est déjà utilisé'});
            else setMsg({type:'error',text:authErr.message});
            setLoading(false);return;
          }
          
          // Créer/mettre à jour le profil
          if(authData.user){
            await supabase.from('profiles').upsert({
              id:authData.user.id,
              email:email.toLowerCase().trim(),
              first_name:firstName.trim(),
              last_name:lastName.trim(),
              role:'learner',
              center_id:centerId
            });
            
            // Si c'est un code de session, inscrire l'apprenant à la session
            if(sessionToJoin){
              await supabase.from('session_participants').insert({
                session_id:sessionToJoin.id,
                learner_id:authData.user.id,
                status:'enrolled'
              });
              // Note: Le trigger auto_enroll_session_participant créera l'enrollment au cours/parcours
            }
            
            // Envoyer email de bienvenue
            sendEmail({
              template_code:'welcome',
              to_email:email.toLowerCase().trim(),
              to_user_id:authData.user.id,
              variables:{
                first_name:firstName.trim(),
                last_name:lastName.trim(),
                center_name:centerName,
                session_name:sessionToJoin?.name||null
              }
            });
          }
          
          const successMsg=sessionToJoin
            ?`✅ Compte créé ! Vous êtes inscrit à la session "${sessionToJoin.name}". Vous pouvez maintenant vous connecter.`
            :`✅ Compte créé ! Bienvenue chez ${centerName}. Vous pouvez maintenant vous connecter.`;
          
          setMsg({type:'success',text:successMsg});
          // Reset form et basculer sur login
          setFirstName('');setLastName('');setPassword('');setConfirmPassword('');setCenterCode('');
          setTimeout(()=>setActiveTab('login'),2000);
          
        }catch(err){
          setMsg({type:'error',text:'Erreur: '+err.message});
        }
        setLoading(false);
      };

      return(<div className="min-h-screen bg-gray-900 flex items-center justify-center p-4">
        <div className="w-full max-w-md">
          <div className="text-center mb-8">
            <div className="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-2xl mb-4">
              <Icon name="GraduationCap" size={32} className="text-white"/>
            </div>
            <h1 className="text-2xl font-bold text-white">Course Builder Pro</h1>
            <p className="text-gray-400 mt-1">Plateforme de formation</p>
          </div>
          
          <Card className="p-6">
            {/* Onglets - sauf pour mot de passe oublié */}
            {activeTab!=='forgot'&&(
              <div className="flex gap-1 p-1 bg-gray-700 rounded-lg mb-6">
                <button onClick={()=>{setActiveTab('login');setMsg(null);}} className={`flex-1 px-4 py-2 rounded-md text-sm font-medium transition-all ${activeTab==='login'?'bg-indigo-600 text-white':'text-gray-400 hover:text-white'}`}>
                  Se connecter
                </button>
                <button onClick={()=>{setActiveTab('register');setMsg(null);}} className={`flex-1 px-4 py-2 rounded-md text-sm font-medium transition-all ${activeTab==='register'?'bg-indigo-600 text-white':'text-gray-400 hover:text-white'}`}>
                  S'inscrire
                </button>
              </div>
            )}
            
            {/* Titre pour mot de passe oublié */}
            {activeTab==='forgot'&&(
              <div className="text-center mb-6">
                <Icon name="KeyRound" size={32} className="mx-auto text-indigo-400 mb-2"/>
                <h2 className="text-lg font-semibold">Mot de passe oublié</h2>
                <p className="text-sm text-gray-400">Entrez votre email pour recevoir un lien de réinitialisation</p>
              </div>
            )}
            
            {msg&&<Alert type={msg.type} className="mb-4">{msg.text}</Alert>}
            
            {/* Formulaire Connexion */}
            {activeTab==='login'&&(
              <form onSubmit={handleLogin} className="space-y-4">
                <Input label="Email" type="email" icon="Mail" value={email} onChange={e=>setEmail(e.target.value)} required/>
                <Input label="Mot de passe" type="password" icon="Lock" value={password} onChange={e=>setPassword(e.target.value)} required/>
                <Button type="submit" className="w-full" loading={loading}>Se connecter</Button>
                <div className="text-center">
                  <button type="button" onClick={()=>{setActiveTab('forgot');setMsg(null);}} className="text-sm text-indigo-400 hover:text-indigo-300">
                    Mot de passe oublié ?
                  </button>
                </div>
              </form>
            )}
            
            {/* Formulaire Mot de passe oublié */}
            {activeTab==='forgot'&&(
              <form onSubmit={handleForgotPassword} className="space-y-4">
                <Input label="Votre adresse email" type="email" icon="Mail" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="exemple@email.com"/>
                <Button type="submit" className="w-full" loading={loading} icon="Send">Envoyer le lien</Button>
                <div className="text-center">
                  <button type="button" onClick={()=>{setActiveTab('login');setMsg(null);}} className="text-sm text-gray-400 hover:text-white">
                    ← Retour à la connexion
                  </button>
                </div>
              </form>
            )}
            
            {/* Formulaire Inscription */}
            {activeTab==='register'&&(
              <form onSubmit={handleRegister} className="space-y-4">
                <div className="grid grid-cols-2 gap-3">
                  <Input label="Prénom" icon="User" value={firstName} onChange={e=>setFirstName(e.target.value)} required/>
                  <Input label="Nom" value={lastName} onChange={e=>setLastName(e.target.value)} required/>
                </div>
                <Input label="Email" type="email" icon="Mail" value={email} onChange={e=>setEmail(e.target.value)} required/>
                <Input label="Mot de passe" type="password" icon="Lock" value={password} onChange={e=>setPassword(e.target.value)} required placeholder="Min. 6 caractères"/>
                <Input label="Confirmer le mot de passe" type="password" icon="Lock" value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)} required/>
                <div>
                  <label className="block text-sm font-medium text-gray-300 mb-1">Code d'inscription *</label>
                  <div className="relative">
                    <Icon name="KeyRound" size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"/>
                    <input 
                      type="text" 
                      value={centerCode} 
                      onChange={e=>setCenterCode(e.target.value.toUpperCase())} 
                      className="w-full pl-10 pr-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white font-mono tracking-wider uppercase" 
                      placeholder="CODE123"
                      maxLength={20}
                      required
                    />
                  </div>
                  <p className="text-xs text-gray-500 mt-1">Code fourni par votre centre ou pour votre session de formation</p>
                </div>
                <Button type="submit" className="w-full" loading={loading}>Créer mon compte</Button>
              </form>
            )}
          </Card>
          
          <p className="text-center text-gray-500 text-xs mt-4">v{APP_VERSION}</p>
        </div>
      </div>);
    }

    // Layout
    function AppLayout(){
      const{profile,signOut,center,can,isSuperAdmin,realIsSuperAdmin,viewAs,switchView,exitViewAs,effectiveRole,isLearner,isCenterAdmin,sessionError,checkSession}=useAuth();
      const[sidebarOpen,setSidebarOpen]=useState(false);
      const[page,setPage]=useState('my-courses');
      window.__setPage=setPage; // expose for cross-component navigation
      const[notifications,setNotifications]=useState([]);
      const[showNotifs,setShowNotifs]=useState(false);
      const[showViewAs,setShowViewAs]=useState(false);
      const[centers,setCenters]=useState([]);
      const[selectedCenter,setSelectedCenter]=useState('');
      const[selectedRole,setSelectedRole]=useState('center_admin');
      const[isMobile,setIsMobile]=useState(window.innerWidth<1024);
      const[reconnecting,setReconnecting]=useState(false);
      
      // Fonction pour tenter de reconnecter
      const handleReconnect=async()=>{
        setReconnecting(true);
        const session=await checkSession();
        if(!session){
          // Session vraiment perdue, forcer déconnexion
          await signOut();
        }
        setReconnecting(false);
      };
      
      // Écouter les changements de taille de fenêtre
      useEffect(()=>{
        const handleResize=()=>{
          const mobile=window.innerWidth<1024;
          setIsMobile(mobile);
          // Fermer le menu sur mobile, ouvrir sur desktop
          if(!mobile)setSidebarOpen(true);
          else setSidebarOpen(false);
        };
        handleResize(); // Initial
        window.addEventListener('resize',handleResize);
        return()=>window.removeEventListener('resize',handleResize);
      },[]);
      
      // Définir la page initiale selon le rôle
      useEffect(()=>{
        if(profile?.role==='learner')setPage('my-training');
        else setPage('pilotage');
      },[profile?.role]);
      
      // Écouter les changements de hash pour la navigation
      useEffect(()=>{
        const handleHashChange=()=>{
          let hash=window.location.hash.replace('#','');
          // Redirections pour les anciennes pages vers les nouvelles
          const redirects={
            'dashboard':'pilotage',
            'scorm-tracking':'pilotage',
            'analytics':'pilotage',
            'categories':'parametres',
            'badges':'parametres',
            'emails':'parametres',
            'permissions':'parametres',
            'centers':'licences',
            'licenses':'licences',
            'videos':'contenus',
            'playlists':'contenus',
            'paths':'contenus',
            'quizzes':'contenus',
            'enrollments':'sessions',
            'my-courses':'my-training',
            'my-paths':'my-training',
            'my-badges':'rewards',
            'my-certificates':'rewards',
            'leaderboard':'rewards'
          };
          if(redirects[hash])hash=redirects[hash];
          if(hash)setPage(hash);
        };
        // Vérifier le hash initial
        handleHashChange();
        window.addEventListener('hashchange',handleHashChange);
        return()=>window.removeEventListener('hashchange',handleHashChange);
      },[]);
      
      // Charger les centres pour le mode "Vue comme"
      useEffect(()=>{
        if(realIsSuperAdmin){
          supabase.from('centers').select('id,name').order('name').then(({data})=>setCenters(data||[]));
        }
      },[realIsSuperAdmin]);
      
      // Reset page quand on change de vue
      useEffect(()=>{
        if(viewAs){
          if(viewAs.role==='learner')setPage('my-training');
          else setPage('pilotage');
        }
      },[viewAs]);
      
      // Charger les notifications
      useEffect(()=>{
        const loadNotifications=async()=>{
          const{data}=await supabase.from('notifications').select('*').eq('user_id',profile?.id).order('created_at',{ascending:false}).limit(20);
          setNotifications(data||[]);
        };
        if(profile?.id)loadNotifications();
        
        const channel=supabase.channel('notifications').on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`user_id=eq.${profile?.id}`},(payload)=>{
          setNotifications(prev=>[payload.new,...prev]);
        }).subscribe();
        
        return()=>{supabase.removeChannel(channel);};
      },[profile?.id]);
      
      const markAsRead=async(id)=>{
        await supabase.from('notifications').update({is_read:true}).eq('id',id);
        setNotifications(prev=>prev.map(n=>n.id===id?{...n,is_read:true}:n));
      };
      
      const markAllAsRead=async()=>{
        await supabase.from('notifications').update({is_read:true}).eq('user_id',profile?.id).eq('is_read',false);
        setNotifications(prev=>prev.map(n=>({...n,is_read:true})));
      };
      
      const handleSwitchView=()=>{
        if(!selectedCenter)return;
        const c=centers.find(c=>c.id===selectedCenter);
        switchView(selectedRole,selectedCenter,c?.name);
        setShowViewAs(false);
      };
      
      const unreadCount=notifications.filter(n=>!n.is_read).length;
      
      // Menu adapté au rôle effectif (réel ou simulé)
      const showAsLearner=viewAs?.role==='learner'||(profile?.role==='learner'&&!viewAs);
      const showAsTrainer=viewAs?.role==='trainer'||(profile?.role==='trainer'&&!viewAs);
      const showAsCenterAdmin=viewAs?.role==='center_admin'||(profile?.role==='center_admin'&&!viewAs);
      const showAsAdmin=showAsCenterAdmin||showAsTrainer||(!viewAs&&isSuperAdmin);
      const showAsSuperAdmin=!viewAs&&isSuperAdmin;
      
      // Fonction pour vérifier les permissions dans le contexte actuel (mode simulation ou réel)
      const canInContext=(perm)=>{
        if(viewAs){
          const rolePerms=DEFAULT_PERMISSIONS[viewAs.role]||{};
          return rolePerms[perm]||false;
        }
        return can(perm);
      };
      
      const menu=[
        {id:'pilotage',label:'Pilotage',icon:'LayoutDashboard',show:!showAsLearner},
        {id:'sessions',label:'Sessions',icon:'Calendar',show:!showAsLearner&&!showAsTrainer&&(canInContext('manage_courses')||canInContext('view_analytics')||canInContext('manage_enrollments'))},
        {id:'mes-sessions',label:'Mes sessions',icon:'Calendar',show:showAsTrainer},
        {id:'contenus',label:'Contenus',icon:'Library',show:!showAsLearner&&!showAsTrainer&&(canInContext('manage_videos')||canInContext('view_videos')||canInContext('manage_playlists'))},
        {id:'mes-contenus',label:'Mes contenus',icon:'BookOpen',show:showAsTrainer},
        {id:'users',label:'Utilisateurs',icon:'Users',show:!showAsLearner&&!showAsTrainer&&(canInContext('create_users')||canInContext('edit_users'))},
        {id:'licences',label:'Licences',icon:'Key',show:showAsSuperAdmin||showAsCenterAdmin},
        {id:'parametres',label:'Paramètres',icon:'Settings',show:showAsSuperAdmin||showAsCenterAdmin},
        {id:'my-training',label:'Ma formation',icon:'GraduationCap',show:showAsLearner},
        {id:'my-progress',label:'Mon suivi',icon:'BarChart3',show:showAsLearner},
        {id:'rewards',label:'Récompenses',icon:'Trophy',show:showAsLearner},
      ].filter(i=>i.show);

      return(<div className="min-h-screen bg-gray-900 text-white flex">
        {/* Bandeau Session Expirée */}
        {sessionError&&<div className="fixed top-0 left-0 right-0 z-50 bg-red-600 text-white px-4 py-2 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <Icon name="AlertTriangle" size={18}/>
            <span className="text-sm font-medium">Votre session a expiré ou a été interrompue.</span>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={handleReconnect} disabled={reconnecting} className="flex items-center gap-1 px-3 py-1 bg-white/20 hover:bg-white/30 rounded text-sm disabled:opacity-50">
              {reconnecting?<><Icon name="Loader2" size={14} className="animate-spin"/>Reconnexion...</>:<><Icon name="RefreshCw" size={14}/>Reconnecter</>}
            </button>
            <button onClick={signOut} className="flex items-center gap-1 px-3 py-1 bg-white/20 hover:bg-white/30 rounded text-sm"><Icon name="LogOut" size={14}/>Se déconnecter</button>
          </div>
        </div>}
        
        {/* Bandeau Vue comme */}
        {viewAs&&!sessionError&&<div className={`fixed top-0 left-0 right-0 z-50 bg-orange-600 text-white px-4 py-2 flex items-center justify-between`}>
          <div className="flex items-center gap-2">
            <Icon name="Eye" size={18}/>
            <span className="text-sm font-medium">Vue comme: <strong>{ROLE_LABELS[viewAs.role]}</strong> du centre <strong>{viewAs.center_name}</strong></span>
          </div>
          <button onClick={exitViewAs} className="flex items-center gap-1 px-3 py-1 bg-white/20 hover:bg-white/30 rounded text-sm"><Icon name="X" size={16}/>Quitter</button>
        </div>}
        
        {/* Overlay mobile */}
        {sidebarOpen&&isMobile&&<div className="fixed inset-0 bg-black/60 z-30 backdrop-blur-sm" onClick={()=>setSidebarOpen(false)}/>}
        
        {/* Sidebar */}
        <aside className={`fixed lg:static inset-y-0 left-0 z-40 w-64 bg-gray-800 border-r border-gray-700 transform transition-transform duration-300 ease-in-out ${sidebarOpen||!isMobile?'translate-x-0':'-translate-x-full'} ${viewAs||sessionError?'pt-10':''}`}>
          <div className="h-full flex flex-col">
            {/* Header avec bouton fermer sur mobile */}
            <div className="p-4 border-b border-gray-700">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center"><Icon name="GraduationCap" size={24}/></div>
                <div className="flex-1 min-w-0">
                  <h1 className="font-bold truncate">Course Builder</h1>
                  {center&&<p className="text-xs text-gray-400 truncate">{center.name}</p>}
                </div>
                {isMobile&&<button onClick={()=>setSidebarOpen(false)} className="p-1 hover:bg-gray-700 rounded-lg lg:hidden"><Icon name="X" size={20}/></button>}
              </div>
            </div>
            <nav className="flex-1 overflow-y-auto p-3 space-y-1">{menu.map(item=>(<button key={item.id} onClick={()=>{setPage(item.id);if(isMobile)setSidebarOpen(false);}} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left transition ${page===item.id?'bg-indigo-600':'text-gray-300 hover:bg-gray-700'}`}><Icon name={item.icon} size={20}/><span>{item.label}</span></button>))}</nav>
            <div className="p-4 border-t border-gray-700"><div className="flex items-center gap-3 mb-3"><div className={`w-10 h-10 rounded-full flex items-center justify-center ${viewAs?ROLE_COLORS[viewAs.role]:'bg-gray-700'}`}><Icon name="User" size={20}/></div><div className="flex-1 min-w-0"><p className="font-medium truncate">{profile?.first_name} {profile?.last_name}</p><RoleBadge role={viewAs?.role||profile?.role}/></div></div><Button variant="ghost" className="w-full" icon="LogOut" onClick={signOut}>Déconnexion</Button></div>
          </div>
        </aside>
        
        <main className={`flex-1 min-h-screen ${viewAs||sessionError?'pt-10':''}`}>
          <header className="bg-gray-800 border-b border-gray-700 p-4 flex items-center gap-4">
            <button onClick={()=>setSidebarOpen(!sidebarOpen)} className="lg:hidden p-2 hover:bg-gray-700 rounded-lg"><Icon name="Menu" size={24}/></button>
            <h1 className="font-semibold flex-1">{menu.find(i=>i.id===page)?.label||'Dashboard'}</h1>
            
            {/* Bouton Vue comme pour Super Admin */}
            {realIsSuperAdmin&&<div className="relative">
              <button onClick={()=>setShowViewAs(!showViewAs)} className={`p-2 rounded-lg flex items-center gap-2 ${viewAs?'bg-orange-600 hover:bg-orange-700':'hover:bg-gray-700'}`}>
                <Icon name="Eye" size={20}/>
                <span className="hidden sm:inline text-sm">{viewAs?'Changer':'Vue comme'}</span>
              </button>
              {showViewAs&&<div className="absolute right-0 mt-2 w-72 bg-gray-800 border border-gray-700 rounded-xl shadow-xl p-4 z-50">
                <h3 className="font-semibold mb-3">Voir l'application comme...</h3>
                <div className="space-y-3">
                  <Select label="Centre" value={selectedCenter} onChange={e=>setSelectedCenter(e.target.value)} options={[{value:'',label:'Sélectionner un centre...'},...centers.map(c=>({value:c.id,label:c.name}))]}/>
                  <Select label="Rôle" value={selectedRole} onChange={e=>setSelectedRole(e.target.value)} options={[{value:'center_admin',label:'Admin Centre'},{value:'trainer',label:'Formateur'},{value:'learner',label:'Apprenant'}]}/>
                  <div className="flex gap-2">
                    <Button className="flex-1" onClick={handleSwitchView} disabled={!selectedCenter}>Appliquer</Button>
                    {viewAs&&<Button variant="secondary" onClick={()=>{exitViewAs();setShowViewAs(false);}}>Retour</Button>}
                  </div>
                </div>
              </div>}
            </div>}
            
            <div className="relative">
              <button onClick={()=>setShowNotifs(!showNotifs)} className="p-2 hover:bg-gray-700 rounded-lg relative">
                <Icon name="Bell" size={20}/>
                {unreadCount>0&&<span className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full text-xs flex items-center justify-center">{unreadCount>9?'9+':unreadCount}</span>}
              </button>
              {showNotifs&&(
                <div className="absolute right-0 top-full mt-2 w-80 bg-gray-800 border border-gray-700 rounded-xl shadow-xl z-50 animate-fade-in">
                  <div className="p-3 border-b border-gray-700 flex items-center justify-between">
                    <h3 className="font-semibold">Notifications</h3>
                    {unreadCount>0&&<button onClick={markAllAsRead} className="text-xs text-indigo-400 hover:underline">Tout marquer lu</button>}
                  </div>
                  <div className="max-h-80 overflow-y-auto">
                    {notifications.length===0?<p className="p-4 text-gray-500 text-sm text-center">Aucune notification</p>:(
                      notifications.slice(0,10).map(n=>(
                        <div key={n.id} onClick={()=>{markAsRead(n.id);if(n.link)setPage(n.link);setShowNotifs(false);}} className={`p-3 border-b border-gray-700 hover:bg-gray-700/50 cursor-pointer ${!n.is_read?'bg-indigo-600/10':''}`}>
                          <div className="flex items-start gap-3">
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center ${n.type==='success'?'bg-green-500/20 text-green-400':n.type==='certificate'?'bg-yellow-500/20 text-yellow-400':'bg-indigo-500/20 text-indigo-400'}`}>
                              <Icon name={n.type==='certificate'?'Award':n.type==='success'?'CheckCircle':'Info'} size={16}/>
                            </div>
                            <div className="flex-1 min-w-0">
                              <p className="font-medium text-sm">{n.title}</p>
                              {n.message&&<p className="text-xs text-gray-400 truncate">{n.message}</p>}
                              <p className="text-xs text-gray-500 mt-1">{new Date(n.created_at).toLocaleString('fr-FR')}</p>
                            </div>
                            {!n.is_read&&<div className="w-2 h-2 bg-indigo-500 rounded-full"/>}
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              )}
            </div>
          </header>
          <div className="p-4 lg:p-6">
            {page==='pilotage'&&<PilotagePage/>}
            {page==='sessions'&&<SessionsPage/>}
            {page==='mes-sessions'&&<TrainerSessionsPage/>}
            {page==='contenus'&&<ContenusPage/>}
            {page==='mes-contenus'&&<TrainerContenusPage/>}
            {page==='users'&&<UsersPage/>}
            {page==='licences'&&<LicencesPage/>}
            {page==='parametres'&&<ParametresPage/>}
            {page==='my-training'&&<MyTrainingPage/>}
            {page==='my-progress'&&<MyProgressPage/>}
            {page==='rewards'&&<RewardsPage/>}
          </div>
        </main>
      </div>);
    }

        <Tabs tabs={[

        <div className="mt-6">
          {activeTab==='overview'&&<AdminDashboardPage/>}
