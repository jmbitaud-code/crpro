    const DEFAULT_PERMISSIONS={

      center_admin:{
        create_users:true,edit_users:true,delete_users:true,import_users:true,assign_roles:true,

    };
    
    // Fonction utilitaire pour formater la durée en secondes
    const formatDuration=(seconds)=>{
      if(!seconds||seconds<=0)return'-';
      const h=Math.floor(seconds/3600);
      const m=Math.floor((seconds%3600)/60);
      if(h>0)return`${h}h ${m}min`;
      return`${m}min`;
    };
    
    // Fonction utilitaire pour parser les URLs Vimeo (y compris vidéos privées avec hash)
    // Formats supportés:
    // - https://vimeo.com/123456789
    // - https://vimeo.com/123456789/abcdef1234 (vidéo privée)
    // - https://player.vimeo.com/video/123456789?h=abcdef1234
    // - 123456789 (ID seul)
    // - 123456789/abcdef1234 (ID + hash)
    const parseVimeoUrl=(input)=>{
      if(!input)return{id:'',hash:''};
      const str=String(input).trim();
      
      // Format: player.vimeo.com/video/ID?h=HASH
      let match=str.match(/player\.vimeo\.com\/video\/(\d+)\?h=([a-zA-Z0-9]+)/);
      if(match)return{id:match[1],hash:match[2]};
      
      // Format: vimeo.com/ID/HASH
      match=str.match(/vimeo\.com\/(\d+)\/([a-zA-Z0-9]+)/);
      if(match)return{id:match[1],hash:match[2]};
      
      // Format: vimeo.com/ID (sans hash)
      match=str.match(/vimeo\.com\/(\d+)/);
      if(match)return{id:match[1],hash:''};
      
      // Format: ID/HASH (sans domaine)
      match=str.match(/^(\d+)\/([a-zA-Z0-9]+)$/);
      if(match)return{id:match[1],hash:match[2]};
      
      // Format: ID seul
      match=str.match(/^(\d+)$/);
      if(match)return{id:match[1],hash:''};
      
      return{id:str,hash:''};
    };
    
    // Construire l'URL d'embed Vimeo avec hash si présent
    const buildVimeoEmbedUrl=(vimeoId,vimeoHash,options={})=>{
      if(!vimeoId)return'';
      let url=`https://player.vimeo.com/video/${vimeoId}`;
      const params=[];
      if(vimeoHash)params.push(`h=${vimeoHash}`);
      if(options.background)params.push('background=1');
      if(options.autoplay)params.push('autoplay=1');
      if(params.length>0)url+=`?${params.join('&')}`;
      return url;
    };
    
    // Labels et couleurs SCORM
    const SCORM_STATUS_LABELS={
      'not attempted':'Non commencé',
      'incomplete':'En cours',
      'completed':'Terminé',
      'passed':'Réussi',
      'failed':'Échoué',
      'unknown':'Inconnu'
    };
    const SCORM_STATUS_COLORS={
      'not attempted':'bg-gray-500',
      'incomplete':'bg-yellow-500',
      'completed':'bg-green-500',
      'passed':'bg-green-500',
      'failed':'bg-red-500',
      'unknown':'bg-gray-500'
    };

    // Auth Context avec mode "Vue comme"
    const AuthContext=createContext(null);
    function AuthProvider({children}){
      const[user,setUser]=useState(null);
      const[profile,setProfile]=useState(null);
      const[center,setCenter]=useState(null);
      const[permissions,setPermissions]=useState({});
      const[loading,setLoading]=useState(true);
      const[sessionError,setSessionError]=useState(false);
      
      // Mode "Vue comme" pour Super Admin
      const[viewAs,setViewAs]=useState(null);
      
      // Refs pour éviter les boucles infinies et appels multiples
      const isRefreshingRef=useRef(false);
      const lastRefreshRef=useRef(0);
      const initializedRef=useRef(false); // IMPORTANT: empêche INITIAL_SESSION multiple
      const profileRef=useRef(null); // Ref pour le profil actuel
      const userRef=useRef(null); // Ref pour l'utilisateur actuel
      const isLoadingProfileRef=useRef(false); // Empêche les appels parallèles à loadProfile

      // Mettre à jour les refs quand les états changent
      useEffect(()=>{profileRef.current=profile;},[profile]);
      useEffect(()=>{userRef.current=user;},[user]);

      // loadProfile sans dépendance sur profile (utilise profileRef)
      const loadProfile=useCallback(async(userId)=>{
        // Éviter les appels parallèles
        if(isLoadingProfileRef.current){
          console.log('loadProfile déjà en cours, ignoré');
          return profileRef.current;
        }
        isLoadingProfileRef.current=true;
        
        try{
          const{data,error:err}=await supabase.from('profiles').select('*,centers(*)').eq('id',userId).single();
          // Ignorer les erreurs AbortError (requête annulée)
          if(err){
            if(err.message?.includes('AbortError')||err.code==='PGRST301'){
              isLoadingProfileRef.current=false;
              return profileRef.current; // Retourner le profil existant
            }
            throw err;
          }
          setProfile(data);
          setCenter(data?.centers);
          const{data:perms}=await supabase.from('role_permissions').select('permissions').eq('role',data?.role).single();
          setPermissions(perms?.permissions||{});
          isLoadingProfileRef.current=false;
          return data;
        }catch(e){
          isLoadingProfileRef.current=false;
          // Ignorer AbortError
          if(e.message?.includes('AbortError')||e.name==='AbortError'){
            console.log('Requête profile annulée (AbortError) - ignorée');
            return profileRef.current;
          }
          console.error('Erreur loadProfile:',e);
          return null;
        }
      },[]); // PAS DE DÉPENDANCE ICI - utilise profileRef à la place

      // Fonction pour vérifier et rafraîchir la session (avec protection contre les appels multiples)
      const checkAndRefreshSession=useCallback(async(force=false)=>{
        // Éviter les appels multiples rapprochés (debounce 2 secondes)
        const now=Date.now();
        if(!force&&(isRefreshingRef.current||(now-lastRefreshRef.current)<2000)){
          console.log('Check session ignoré (déjà en cours ou trop récent)');
          return null;
        }
        
        isRefreshingRef.current=true;
        lastRefreshRef.current=now;
        
        try{
          const{data:{session},error}=await supabase.auth.getSession();
          if(error){
            // Ignorer AbortError
            if(error.message?.includes('AbortError')){
              isRefreshingRef.current=false;
              return null;
            }
            console.error('Erreur getSession:',error);
            if(error.message?.includes('refresh_token')||error.message?.includes('invalid')||error.message?.includes('expired')){
              console.warn('Session invalide, déconnexion...');
              setSessionError(true);
              await supabase.auth.signOut();
              isRefreshingRef.current=false;
              return null;
            }
          }
          if(session?.user){
            // Tenter de rafraîchir le token si proche de l'expiration
            const expiresAt=session.expires_at;
            const nowSec=Math.floor(Date.now()/1000);
            const timeUntilExpiry=expiresAt-nowSec;
            
            // Si le token expire dans moins de 5 minutes, le rafraîchir
            if(timeUntilExpiry<300){
              console.log('Token proche expiration, rafraîchissement...');
              const{data:refreshData,error:refreshError}=await supabase.auth.refreshSession();
              if(refreshError){
                if(!refreshError.message?.includes('AbortError')){
                  console.error('Erreur refresh:',refreshError);
                  setSessionError(true);
                }
                isRefreshingRef.current=false;
                return null;
              }
              isRefreshingRef.current=false;
              return refreshData.session;
            }
            setSessionError(false);
            isRefreshingRef.current=false;
            return session;
          }
          isRefreshingRef.current=false;
          return null;
        }catch(e){
          if(!e.message?.includes('AbortError')){
            console.error('Erreur checkSession:',e);
          }
          isRefreshingRef.current=false;
          return null;
        }
      },[]);

      useEffect(()=>{
        let mounted=true;
        
        // Éviter la double initialisation (React StrictMode)
        if(initializedRef.current){
          console.log('AuthProvider déjà initialisé, skip');
          return;
        }
        initializedRef.current=true;
        
        // Timeout de sécurité : si le chargement prend plus de 10s, on arrête
        const timeout=setTimeout(()=>{
          if(mounted&&loading){
            console.warn('Auth timeout - forçage fin de chargement');
            setLoading(false);
          }
        },10000);
        
        const init=async()=>{
          try{
            const session=await checkAndRefreshSession(true); // Force le premier check
            if(mounted&&session?.user){
              setUser(session.user);
              await loadProfile(session.user.id);
            }
          }catch(e){
            if(!e.message?.includes('AbortError')){
              console.error('Erreur init auth:',e);
            }
          }finally{
            clearTimeout(timeout);
            if(mounted)setLoading(false);
          }
        };
        init();
        
        // Flag pour ne traiter INITIAL_SESSION qu'une seule fois
        let initialSessionHandled=false;
        
        // Listener pour les changements d'état auth
        const{data:{subscription}}=supabase.auth.onAuthStateChange(async(event,session)=>{
          if(!mounted)return;
          console.log('Auth event:',event);
          
          if(event==='SIGNED_IN'&&session?.user){
            setUser(session.user);
            setSessionError(false);
            // Ne recharger le profil que si c'est un nouvel utilisateur
            if(!profileRef.current||profileRef.current.id!==session.user.id){
              await loadProfile(session.user.id);
            }
          }
          else if(event==='SIGNED_OUT'){
            setUser(null);
            setProfile(null);
            setCenter(null);
            setPermissions({});
            setViewAs(null);
          }
          else if(event==='TOKEN_REFRESHED'){
            console.log('Token rafraîchi avec succès');
            setSessionError(false);
            if(session?.user){
              setUser(session.user);
            }
          }
          else if(event==='INITIAL_SESSION'){
            // IMPORTANT: Ne traiter qu'une seule fois pour éviter la boucle infinie
            if(initialSessionHandled){
              console.log('INITIAL_SESSION déjà traité, ignoré');
              return;
            }
            initialSessionHandled=true;
            
            // Session restaurée depuis le storage
            if(session?.user){
              setUser(session.user);
              setSessionError(false);
              // Ne charger que si pas déjà chargé
              if(!profileRef.current||profileRef.current.id!==session.user.id){
                await loadProfile(session.user.id);
              }
            }
          }
        });
        
        // Listener pour la visibilité de l'onglet (avec délai pour éviter les conflits)
        let visibilityTimeout=null;
        const handleVisibilityChange=()=>{
          if(document.visibilityState==='visible'&&mounted){
            // Délai de 500ms pour laisser Supabase gérer d'abord
            if(visibilityTimeout)clearTimeout(visibilityTimeout);
            visibilityTimeout=setTimeout(async()=>{
              console.log('Onglet redevenu visible, vérification session...');
              const session=await checkAndRefreshSession();
              if(!session&&userRef.current){
                // Avait un user mais plus de session valide
                console.warn('Session perdue, déconnexion...');
                setUser(null);
                setProfile(null);
                setCenter(null);
                setPermissions({});
                setViewAs(null);
                setSessionError(true);
              }
            },500);
          }
        };
        
        document.addEventListener('visibilitychange',handleVisibilityChange);
        
        // Heartbeat toutes les 4 minutes pour garder la session active
        const heartbeatInterval=setInterval(async()=>{
          if(document.visibilityState==='visible'&&userRef.current){
            console.log('Heartbeat session...');
            await checkAndRefreshSession();
          }
        },4*60*1000);
        
        return()=>{
          mounted=false;
          clearTimeout(timeout);
          if(visibilityTimeout)clearTimeout(visibilityTimeout);
          clearInterval(heartbeatInterval);
          document.removeEventListener('visibilitychange',handleVisibilityChange);
          subscription.unsubscribe();
        };
      },[]); // IMPORTANT: pas de dépendances pour éviter de recréer le listener

      const signIn=async(email,password)=>{
        try{
          setSessionError(false);
          const{error:err}=await supabase.auth.signInWithPassword({email,password});
          if(err)throw err;
          return{success:true};
        }catch(e){return{success:false,error:e.message};}
      };
      const signOut=async()=>{setViewAs(null);await supabase.auth.signOut();};

      // Fonctions adaptées au mode "Vue comme"
      const realIsSuperAdmin=profile?.role==='super_admin';
      const realRole=profile?.role;
      
      // Vérifier une permission
      const can=(perm)=>realIsSuperAdmin||permissions[perm]===true;
      
      // Vérifier si l'utilisateur peut agir sur un centre spécifique
      const canForCenter=(perm,centerId)=>{
        if(realIsSuperAdmin)return true;
        if(!can(perm))return false;
        // Admin centre et formateur: seulement leur propre centre
        if(realRole==='center_admin'||realRole==='trainer'){
          return center?.id===centerId;
        }
        return true;
      };
      
      // Vérifier les rôles que l'utilisateur peut assigner
      const canAssignRole=(targetRole)=>{
        if(realIsSuperAdmin)return true;
        if(!can('assign_roles'))return false;
        // Admin centre: peut assigner apprenant et formateur seulement
        if(realRole==='center_admin'){
          return['learner','trainer'].includes(targetRole);
        }
        // Formateur: peut créer des apprenants seulement
        if(realRole==='trainer'){
          return targetRole==='learner';
        }
        return false;
      };
      
      // Rôle effectif
      const effectiveRole=viewAs?.role||profile?.role;
      const effectiveCenter=viewAs?{id:viewAs.center_id,name:viewAs.center_name}:center;
      
      const isSuperAdmin=!viewAs&&realIsSuperAdmin;
      const isCenterAdmin=viewAs?(viewAs.role==='center_admin'||viewAs.role==='trainer'):(profile?.role==='center_admin'||profile?.role==='trainer');
      const isLearner=viewAs?viewAs.role==='learner':profile?.role==='learner';
      
      // Fonction pour changer de vue
      const switchView=(role,centerId,centerName)=>{
        if(!realIsSuperAdmin)return;
        if(role===null)setViewAs(null);
        else setViewAs({role,center_id:centerId,center_name:centerName});
      };
      const exitViewAs=()=>setViewAs(null);

      const value={
        user,profile,
        center:effectiveCenter,
        loading,signIn,signOut,
        isAuth:!!user,
        isSuperAdmin,
        realIsSuperAdmin,
        realRole,
        isCenterAdmin,
        isLearner,
        effectiveRole,
        role:effectiveRole||'learner',
        can,canForCenter,canAssignRole,permissions,
        viewAs,switchView,exitViewAs,
        sessionError,
        checkSession:checkAndRefreshSession,
        reload:async()=>{if(user)await loadProfile(user.id);}
      };
      return<AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
    }

    const Modal=({isOpen,onClose,title,children,size='md'})=>{if(!isOpen)return null;const s={sm:'max-w-md',md:'max-w-lg',lg:'max-w-2xl',xl:'max-w-4xl',full:'max-w-6xl'};return(<div className="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in"><div className="absolute inset-0 bg-black/70" onClick={onClose}/><div className={`relative bg-gray-800 rounded-xl w-full ${s[size]} max-h-[90vh] overflow-auto`}><div className="sticky top-0 bg-gray-800 p-4 border-b border-gray-700 flex items-center justify-between z-10"><h2 className="text-lg font-semibold">{title}</h2><button onClick={onClose} className="p-2 hover:bg-gray-700 rounded-lg"><Icon name="X" size={20}/></button></div><div className="p-4">{children}</div></div></div>);};

    // Score Badge pour SCORM
    const ScoreBadge=({score,showLabel=true})=>{
      if(score===null||score===undefined)return<span className="text-gray-500 text-sm">—</span>;
      // Détecter si le score est en format 0-1 ou 0-100
      let percent;
      if(score>1){
        // Score déjà en pourcentage (ex: 90)
        percent=Math.round(score);
      }else{
        // Score en format décimal (ex: 0.9)
        percent=Math.round(score*100);
      }
      const color=percent>=70?'text-green-400':percent>=50?'text-yellow-400':'text-red-400';
      return<span className={`font-semibold ${color}`}>{percent}%</span>;
    };
    
    // Fonction pour parser le temps SCORM
    const parseScormTime=(timeStr)=>{
      if(!timeStr)return 0;
      // Format SCORM 1.2: HH:MM:SS ou HHHH:MM:SS.SS
      if(timeStr.includes(':')){
        const parts=timeStr.split(':');
        const h=parseInt(parts[0])||0;
        const m=parseInt(parts[1])||0;
        const s=parseFloat(parts[2])||0;
        return h*3600+m*60+Math.round(s);
      }
      // Format SCORM 2004: PT1H30M45S
      if(timeStr.startsWith('PT')){
        let seconds=0;
        const hMatch=timeStr.match(/(\d+)H/);
        const mMatch=timeStr.match(/(\d+)M/);
        const sMatch=timeStr.match(/(\d+(?:\.\d+)?)S/);
        if(hMatch)seconds+=parseInt(hMatch[1])*3600;
        if(mMatch)seconds+=parseInt(mMatch[1])*60;
        if(sMatch)seconds+=Math.round(parseFloat(sMatch[1]));
        return seconds;
      }
      return 0;
    };

    const Alert=({type='info',children})=>{const colors={info:'bg-blue-500/20 text-blue-300',success:'bg-green-500/20 text-green-300',warning:'bg-yellow-500/20 text-yellow-300',error:'bg-red-500/20 text-red-300'};return<div className={`p-4 rounded-lg ${colors[type]}`}>{children}</div>;};
    const ProgressBar=({percent,size='md',showLabel=true})=>{const h={sm:'h-2',md:'h-3',lg:'h-4'};return<div className="w-full"><div className={`w-full bg-gray-700 rounded-full ${h[size]}`}><div className={`bg-indigo-600 rounded-full ${h[size]} progress-bar`} style={{width:`${Math.min(100,Math.max(0,percent))}%`}}/></div>{showLabel&&<p className="text-sm text-gray-400 mt-1">{Math.round(percent)}% complété</p>}</div>;};

    // Login
    function LoginPage(){
      const{signIn}=useAuth();
      const[activeTab,setActiveTab]=useState('login'); // login, register, forgot
      const[email,setEmail]=useState('');
      const[password,setPassword]=useState('');
      const[confirmPassword,setConfirmPassword]=useState('');
      const[firstName,setFirstName]=useState('');
      const[lastName,setLastName]=useState('');
      const[centerCode,setCenterCode]=useState('');
      const[loading,setLoading]=useState(false);
      const[msg,setMsg]=useState(null);

      const handleLogin=async e=>{
        e.preventDefault();setLoading(true);setMsg(null);
        const r=await signIn(email,password);
        if(!r.success)setMsg({type:'error',text:r.error});
        setLoading(false);
      };
      
      const handleForgotPassword=async e=>{
        e.preventDefault();setLoading(true);setMsg(null);
        
        if(!email.trim()){
          setMsg({type:'error',text:'Veuillez entrer votre adresse email'});setLoading(false);return;
        }
        
        try{
          const{error}=await supabase.auth.resetPasswordForEmail(email.toLowerCase().trim(),{
            redirectTo:window.location.origin
          });
          
          if(error){
            setMsg({type:'error',text:error.message});
          }else{
            setMsg({type:'success',text:'📧 Si cette adresse existe, un email de réinitialisation a été envoyé. Vérifiez votre boîte de réception (et les spams).'});
          }
        }catch(err){
          setMsg({type:'error',text:'Erreur: '+err.message});
        }
        setLoading(false);
      };
      
      const handleRegister=async e=>{
        e.preventDefault();setLoading(true);setMsg(null);
        
        // Validations
        if(!firstName.trim()||!lastName.trim()){
          setMsg({type:'error',text:'Prénom et nom requis'});setLoading(false);return;
        }
        if(password.length<6){
          setMsg({type:'error',text:'Le mot de passe doit contenir au moins 6 caractères'});setLoading(false);return;
        }
        if(password!==confirmPassword){
          setMsg({type:'error',text:'Les mots de passe ne correspondent pas'});setLoading(false);return;
        }
        if(!centerCode.trim()){
          setMsg({type:'error',text:'Le code centre est requis'});setLoading(false);return;
        }
        
        try{
          // Vérifier le code centre
          const{data:center,error:centerErr}=await supabase.from('centers').select('id,name').eq('registration_code',centerCode.toUpperCase().trim()).single();
          if(centerErr||!center){
            setMsg({type:'error',text:'Code centre invalide. Vérifiez auprès de votre centre de formation.'});setLoading(false);return;
          }
          
          // Créer le compte utilisateur
          const{data:authData,error:authErr}=await supabase.auth.signUp({
            email:email.toLowerCase().trim(),
            password,
            options:{
              data:{
                first_name:firstName.trim(),
                last_name:lastName.trim(),
                role:'learner',
                center_id:center.id
              }
            }
          });
          
          if(authErr){
            if(authErr.message.includes('already registered'))setMsg({type:'error',text:'Cet email est déjà utilisé'});
            else setMsg({type:'error',text:authErr.message});
            setLoading(false);return;
          }
          
          // Créer/mettre à jour le profil
          if(authData.user){
            await supabase.from('profiles').upsert({
              id:authData.user.id,
              email:email.toLowerCase().trim(),
              first_name:firstName.trim(),
              last_name:lastName.trim(),
              role:'learner',
              center_id:center.id
            });
            
            // Envoyer email de bienvenue
            sendEmail({
              template_code:'welcome',
              to_email:email.toLowerCase().trim(),
              to_user_id:authData.user.id,
              variables:{
                first_name:firstName.trim(),
                last_name:lastName.trim(),
                center_name:center.name
              }
            });
          }
          
          setMsg({type:'success',text:`✅ Compte créé ! Bienvenue chez ${center.name}. Vous pouvez maintenant vous connecter.`});
          // Reset form et basculer sur login
          setFirstName('');setLastName('');setPassword('');setConfirmPassword('');setCenterCode('');
          setTimeout(()=>setActiveTab('login'),2000);
          
        }catch(err){
          setMsg({type:'error',text:'Erreur: '+err.message});
        }
        setLoading(false);
      };

      return(<div className="min-h-screen bg-gray-900 flex items-center justify-center p-4">
        <div className="w-full max-w-md">
          <div className="text-center mb-8">
            <div className="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-2xl mb-4">
              <Icon name="GraduationCap" size={32} className="text-white"/>
            </div>
            <h1 className="text-2xl font-bold text-white">Course Builder Pro</h1>
            <p className="text-gray-400 mt-1">Plateforme de formation</p>
          </div>
          
          <Card className="p-6">
            {/* Onglets - sauf pour mot de passe oublié */}
            {activeTab!=='forgot'&&(
              <div className="flex gap-1 p-1 bg-gray-700 rounded-lg mb-6">
                <button onClick={()=>{setActiveTab('login');setMsg(null);}} className={`flex-1 px-4 py-2 rounded-md text-sm font-medium transition-all ${activeTab==='login'?'bg-indigo-600 text-white':'text-gray-400 hover:text-white'}`}>
                  Se connecter
                </button>
                <button onClick={()=>{setActiveTab('register');setMsg(null);}} className={`flex-1 px-4 py-2 rounded-md text-sm font-medium transition-all ${activeTab==='register'?'bg-indigo-600 text-white':'text-gray-400 hover:text-white'}`}>
                  S'inscrire
                </button>
              </div>
            )}
            
            {/* Titre pour mot de passe oublié */}
            {activeTab==='forgot'&&(
              <div className="text-center mb-6">
                <Icon name="KeyRound" size={32} className="mx-auto text-indigo-400 mb-2"/>
                <h2 className="text-lg font-semibold">Mot de passe oublié</h2>
                <p className="text-sm text-gray-400">Entrez votre email pour recevoir un lien de réinitialisation</p>
              </div>
            )}
            
            {msg&&<Alert type={msg.type} className="mb-4">{msg.text}</Alert>}
            
            {/* Formulaire Connexion */}
            {activeTab==='login'&&(
              <form onSubmit={handleLogin} className="space-y-4">
                <Input label="Email" type="email" icon="Mail" value={email} onChange={e=>setEmail(e.target.value)} required/>
                <Input label="Mot de passe" type="password" icon="Lock" value={password} onChange={e=>setPassword(e.target.value)} required/>
                <Button type="submit" className="w-full" loading={loading}>Se connecter</Button>
                <div className="text-center">
                  <button type="button" onClick={()=>{setActiveTab('forgot');setMsg(null);}} className="text-sm text-indigo-400 hover:text-indigo-300">
                    Mot de passe oublié ?
                  </button>
                </div>
              </form>
            )}
            
            {/* Formulaire Mot de passe oublié */}
            {activeTab==='forgot'&&(
              <form onSubmit={handleForgotPassword} className="space-y-4">
                <Input label="Votre adresse email" type="email" icon="Mail" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="exemple@email.com"/>
                <Button type="submit" className="w-full" loading={loading} icon="Send">Envoyer le lien</Button>
                <div className="text-center">
                  <button type="button" onClick={()=>{setActiveTab('login');setMsg(null);}} className="text-sm text-gray-400 hover:text-white">
                    ← Retour à la connexion
                  </button>
                </div>
              </form>
            )}
            
            {/* Formulaire Inscription */}
            {activeTab==='register'&&(
              <form onSubmit={handleRegister} className="space-y-4">
                <div className="grid grid-cols-2 gap-3">
                  <Input label="Prénom" icon="User" value={firstName} onChange={e=>setFirstName(e.target.value)} required/>
                  <Input label="Nom" value={lastName} onChange={e=>setLastName(e.target.value)} required/>
                </div>
                <Input label="Email" type="email" icon="Mail" value={email} onChange={e=>setEmail(e.target.value)} required/>
                <Input label="Mot de passe" type="password" icon="Lock" value={password} onChange={e=>setPassword(e.target.value)} required placeholder="Min. 6 caractères"/>
                <Input label="Confirmer le mot de passe" type="password" icon="Lock" value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)} required/>
                <div>
                  <label className="block text-sm font-medium text-gray-300 mb-1">Code centre *</label>
                  <div className="relative">
                    <Icon name="Building2" size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"/>
                    <input 
                      type="text" 
                      value={centerCode} 
                      onChange={e=>setCenterCode(e.target.value.toUpperCase())} 
                      className="w-full pl-10 pr-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white font-mono tracking-wider uppercase" 
                      placeholder="XXXXXX"
                      maxLength={10}
                      required
                    />
                  </div>
                  <p className="text-xs text-gray-500 mt-1">Demandez ce code à votre centre de formation</p>
                </div>
                <Button type="submit" className="w-full" loading={loading}>Créer mon compte</Button>
              </form>
            )}
          </Card>
          
          <p className="text-center text-gray-500 text-xs mt-4">v{APP_VERSION}</p>
        </div>
      </div>);
    }

    // Layout
    function AppLayout(){
      const{profile,signOut,center,can,isSuperAdmin,realIsSuperAdmin,viewAs,switchView,exitViewAs,effectiveRole,isLearner,isCenterAdmin,sessionError,checkSession}=useAuth();
      const[sidebarOpen,setSidebarOpen]=useState(false);
      const[page,setPage]=useState('my-courses');
      const[notifications,setNotifications]=useState([]);
      const[showNotifs,setShowNotifs]=useState(false);
      const[showViewAs,setShowViewAs]=useState(false);
      const[centers,setCenters]=useState([]);
      const[selectedCenter,setSelectedCenter]=useState('');
      const[selectedRole,setSelectedRole]=useState('center_admin');
      const[isMobile,setIsMobile]=useState(window.innerWidth<1024);
      const[reconnecting,setReconnecting]=useState(false);
      
      // Fonction pour tenter de reconnecter
      const handleReconnect=async()=>{
        setReconnecting(true);
        const session=await checkSession();
        if(!session){
          // Session vraiment perdue, forcer déconnexion
          await signOut();
        }
        setReconnecting(false);
      };
      
      // Écouter les changements de taille de fenêtre
      useEffect(()=>{
        const handleResize=()=>{
          const mobile=window.innerWidth<1024;
          setIsMobile(mobile);
          // Fermer le menu sur mobile, ouvrir sur desktop
          if(!mobile)setSidebarOpen(true);
          else setSidebarOpen(false);
        };
        handleResize(); // Initial
        window.addEventListener('resize',handleResize);
        return()=>window.removeEventListener('resize',handleResize);
      },[]);
      
      // Définir la page initiale selon le rôle
      useEffect(()=>{
        if(profile?.role==='learner')setPage('my-courses');
        else setPage('dashboard');
      },[profile?.role]);
      
      // Écouter les changements de hash pour la navigation
      useEffect(()=>{
        const handleHashChange=()=>{
          const hash=window.location.hash.replace('#','');
          if(hash)setPage(hash);
        };
        // Vérifier le hash initial
        handleHashChange();
        window.addEventListener('hashchange',handleHashChange);
        return()=>window.removeEventListener('hashchange',handleHashChange);
      },[]);
      
      // Charger les centres pour le mode "Vue comme"
      useEffect(()=>{
        if(realIsSuperAdmin){
          supabase.from('centers').select('id,name').order('name').then(({data})=>setCenters(data||[]));
        }
      },[realIsSuperAdmin]);
      
      // Reset page quand on change de vue
      useEffect(()=>{
        if(viewAs){
          if(viewAs.role==='learner')setPage('my-courses');
          else setPage('dashboard');
        }
      },[viewAs]);
      
      // Charger les notifications
      useEffect(()=>{
        const loadNotifications=async()=>{
          const{data}=await supabase.from('notifications').select('*').eq('user_id',profile?.id).order('created_at',{ascending:false}).limit(20);
          setNotifications(data||[]);
        };
        if(profile?.id)loadNotifications();
        
        const channel=supabase.channel('notifications').on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`user_id=eq.${profile?.id}`},(payload)=>{
          setNotifications(prev=>[payload.new,...prev]);
        }).subscribe();
        
        return()=>{supabase.removeChannel(channel);};
      },[profile?.id]);
      
      const markAsRead=async(id)=>{
        await supabase.from('notifications').update({is_read:true}).eq('id',id);
        setNotifications(prev=>prev.map(n=>n.id===id?{...n,is_read:true}:n));
      };
      
      const markAllAsRead=async()=>{
        await supabase.from('notifications').update({is_read:true}).eq('user_id',profile?.id).eq('is_read',false);
        setNotifications(prev=>prev.map(n=>({...n,is_read:true})));
      };
      
      const handleSwitchView=()=>{
        if(!selectedCenter)return;
        const c=centers.find(c=>c.id===selectedCenter);
        switchView(selectedRole,selectedCenter,c?.name);
        setShowViewAs(false);
      };
      
      const unreadCount=notifications.filter(n=>!n.is_read).length;

      const showAsCenterAdmin=viewAs?.role==='center_admin'||(profile?.role==='center_admin'&&!viewAs);
      const showAsAdmin=showAsCenterAdmin||showAsTrainer||(!viewAs&&isSuperAdmin);
      const showAsSuperAdmin=!viewAs&&isSuperAdmin;
      
      // Fonction pour vérifier les permissions dans le contexte actuel (mode simulation ou réel)
      const canInContext=(perm)=>{
        if(viewAs){
          const rolePerms=DEFAULT_PERMISSIONS[viewAs.role]||{};
          return rolePerms[perm]||false;
        }
        return can(perm);
      };
      
      const menu=[
        {id:'dashboard',label:'Tableau de bord',icon:'LayoutDashboard',show:!showAsLearner},
        {id:'scorm-tracking',label:'Suivi formation',icon:'BarChart3',show:!showAsLearner&&(canInContext('view_analytics')||canInContext('view_learner_progress'))},
        {id:'analytics',label:'Statistiques',icon:'PieChart',show:!showAsLearner&&canInContext('view_analytics')},
        {id:'categories',label:'Catégories',icon:'FolderTree',show:showAsAdmin},
        {id:'licenses',label:'Licences',icon:'Key',show:showAsSuperAdmin||showAsCenterAdmin},
        {id:'centers',label:'Centres',icon:'Building2',show:showAsSuperAdmin},
        {id:'users',label:'Utilisateurs',icon:'Users',show:!showAsLearner&&(canInContext('create_users')||canInContext('edit_users'))},
        {id:'videos',label:'Bibliothèque',icon:'Film',show:!showAsLearner&&(canInContext('manage_videos')||canInContext('view_videos'))},

        {/* Sidebar */}
        <aside className={`fixed lg:static inset-y-0 left-0 z-40 w-64 bg-gray-800 border-r border-gray-700 transform transition-transform duration-300 ease-in-out ${sidebarOpen||!isMobile?'translate-x-0':'-translate-x-full'} ${viewAs||sessionError?'pt-10':''}`}>
          <div className="h-full flex flex-col">
            {/* Header avec bouton fermer sur mobile */}
            <div className="p-4 border-b border-gray-700">

            <div className="p-4 border-t border-gray-700"><div className="flex items-center gap-3 mb-3"><div className={`w-10 h-10 rounded-full flex items-center justify-center ${viewAs?ROLE_COLORS[viewAs.role]:'bg-gray-700'}`}><Icon name="User" size={20}/></div><div className="flex-1 min-w-0"><p className="font-medium truncate">{profile?.first_name} {profile?.last_name}</p><RoleBadge role={viewAs?.role||profile?.role}/></div></div><Button variant="ghost" className="w-full" icon="LogOut" onClick={signOut}>Déconnexion</Button></div>
          </div>

        <main className={`flex-1 min-h-screen ${viewAs||sessionError?'pt-10':''}`}>

            <h1 className="font-semibold flex-1">{menu.find(i=>i.id===page)?.label||'Dashboard'}</h1>
            
            {/* Bouton Vue comme pour Super Admin */}
            {realIsSuperAdmin&&<div className="relative">
              <button onClick={()=>setShowViewAs(!showViewAs)} className={`p-2 rounded-lg flex items-center gap-2 ${viewAs?'bg-orange-600 hover:bg-orange-700':'hover:bg-gray-700'}`}>

                <span className="hidden sm:inline text-sm">{viewAs?'Changer':'Vue comme'}</span>
              </button>
              {showViewAs&&<div className="absolute right-0 mt-2 w-72 bg-gray-800 border border-gray-700 rounded-xl shadow-xl p-4 z-50">
                <h3 className="font-semibold mb-3">Voir l'application comme...</h3>
                <div className="space-y-3">
                  <Select label="Centre" value={selectedCenter} onChange={e=>setSelectedCenter(e.target.value)} options={[{value:'',label:'Sélectionner un centre...'},...centers.map(c=>({value:c.id,label:c.name}))]}/>
                  <Select label="Rôle" value={selectedRole} onChange={e=>setSelectedRole(e.target.value)} options={[{value:'center_admin',label:'Admin Centre'},{value:'trainer',label:'Formateur'},{value:'learner',label:'Apprenant'}]}/>
                  <div className="flex gap-2">
                    <Button className="flex-1" onClick={handleSwitchView} disabled={!selectedCenter}>Appliquer</Button>
                    {viewAs&&<Button variant="secondary" onClick={()=>{exitViewAs();setShowViewAs(false);}}>Retour</Button>}

            <div className="relative">
              <button onClick={()=>setShowNotifs(!showNotifs)} className="p-2 hover:bg-gray-700 rounded-lg relative">
                <Icon name="Bell" size={20}/>
                {unreadCount>0&&<span className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full text-xs flex items-center justify-center">{unreadCount>9?'9+':unreadCount}</span>}
              </button>
              {showNotifs&&(
                <div className="absolute right-0 top-full mt-2 w-80 bg-gray-800 border border-gray-700 rounded-xl shadow-xl z-50 animate-fade-in">

                    <h3 className="font-semibold">Notifications</h3>
                    {unreadCount>0&&<button onClick={markAllAsRead} className="text-xs text-indigo-400 hover:underline">Tout marquer lu</button>}
                  </div>
                  <div className="max-h-80 overflow-y-auto">
                    {notifications.length===0?<p className="p-4 text-gray-500 text-sm text-center">Aucune notification</p>:(
                      notifications.slice(0,10).map(n=>(
                        <div key={n.id} onClick={()=>{markAsRead(n.id);if(n.link)setPage(n.link);setShowNotifs(false);}} className={`p-3 border-b border-gray-700 hover:bg-gray-700/50 cursor-pointer ${!n.is_read?'bg-indigo-600/10':''}`}>
                          <div className="flex items-start gap-3">
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center ${n.type==='success'?'bg-green-500/20 text-green-400':n.type==='certificate'?'bg-yellow-500/20 text-yellow-400':'bg-indigo-500/20 text-indigo-400'}`}>

                            <div className="flex-1 min-w-0">

              )}
            </div>

          <div className="p-4 lg:p-6">
            {page==='dashboard'&&<AdminDashboardPage/>}

            {page==='my-courses'&&<MyCoursesPage/>}
            {page==='my-progress'&&<MyProgressPage/>}
            {page==='my-paths'&&<MyPathsPage/>}
            {page==='my-badges'&&<MyBadgesPage/>}

          </div>
        </main>
      </div>);

    // ============================================================
    // PAGE: Dashboard Admin (AdminDashboardPage) - v7.5.0
    // ============================================================
    function AdminDashboardPage(){
      const{center,isSuperAdmin,profile,can,realRole}=useAuth();
      const[loading,setLoading]=useState(true);
      const[stats,setStats]=useState({});
      const[recentActivity,setRecentActivity]=useState([]);
      const[alerts,setAlerts]=useState([]);
      const[topLearners,setTopLearners]=useState([]);
      const[centers,setCenters]=useState([]);
      const[quickStats,setQuickStats]=useState({});
      
      const load=useCallback(async()=>{
        const now=new Date();
        const todayStr=now.toISOString().slice(0,10);
        const sevenDaysAgo=new Date(now-7*24*60*60*1000);
        const thirtyDaysAgo=new Date(now-30*24*60*60*1000);
        
        // ========== DONNÉES SELON LE RÔLE ==========
        
        // Charger les centres (Super Admin uniquement)
        let centersData=[];
        if(isSuperAdmin){
          const{data:c}=await supabase.from('centers').select('*');
          centersData=c||[];
          setCenters(centersData);
        }
        
        // Charger les apprenants
        let learnersQuery=supabase.from('profiles').select('id,first_name,last_name,email,created_at,center_id').eq('role','learner');
        if(!isSuperAdmin&&center?.id)learnersQuery=learnersQuery.eq('center_id',center.id);
        const{data:learners}=await learnersQuery;
        const learnerIds=(learners||[]).map(l=>l.id);
        
        // Charger les inscriptions
        let enrollmentsQuery=supabase.from('enrollments').select('*,playlists:playlist_id(title,center_id)');
        if(!isSuperAdmin&&center?.id&&learnerIds.length>0)enrollmentsQuery=enrollmentsQuery.in('learner_id',learnerIds);
        const{data:enrollments}=await enrollmentsQuery;
        const filteredEnrollments=(enrollments||[]).filter(e=>isSuperAdmin||learnerIds.includes(e.learner_id));
        
        // Charger la progression SCORM
        let scormQuery=supabase.from('scorm_progress').select('*');
        if(!isSuperAdmin&&learnerIds.length>0)scormQuery=scormQuery.in('learner_id',learnerIds);
        const{data:scormProgress}=await scormQuery;
        
        // Charger les quiz
        let quizQuery=supabase.from('quiz_attempts').select('*');
        if(!isSuperAdmin&&learnerIds.length>0)quizQuery=quizQuery.in('learner_id',learnerIds);
        const{data:quizAttempts}=await quizQuery;
        
        // Charger les cours
        let coursesQuery=supabase.from('playlists').select('id,title,is_published,is_lms_content');
        if(!isSuperAdmin&&center?.id)coursesQuery=coursesQuery.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        const{data:courses}=await coursesQuery;
        
        // ========== CALCUL DES STATS ==========
        
        const totalLearners=learners?.length||0;
        const newLearnersThisWeek=(learners||[]).filter(l=>new Date(l.created_at)>sevenDaysAgo).length;
        const activeLearners=[...new Set([
          ...filteredEnrollments.map(e=>e.learner_id),
          ...(scormProgress||[]).filter(s=>s.last_accessed_at&&new Date(s.last_accessed_at)>sevenDaysAgo).map(s=>s.learner_id)
        ])].length;
        
        const totalEnrollments=filteredEnrollments.length;
        const completedEnrollments=filteredEnrollments.filter(e=>e.status==='completed').length;
        const inProgressEnrollments=filteredEnrollments.filter(e=>e.status==='in_progress').length;
        const enrollmentsThisWeek=filteredEnrollments.filter(e=>new Date(e.created_at)>sevenDaysAgo).length;
        
        const totalScorm=(scormProgress||[]).length;
        const completedScorm=(scormProgress||[]).filter(s=>s.completion_status==='completed'||s.completion_status==='passed').length;
        const scormThisWeek=(scormProgress||[]).filter(s=>s.last_accessed_at&&new Date(s.last_accessed_at)>sevenDaysAgo).length;
        const avgScormScore=(scormProgress||[]).filter(s=>s.score_scaled).reduce((a,s)=>a+(s.score_scaled>1?s.score_scaled:s.score_scaled*100),0)/Math.max(1,(scormProgress||[]).filter(s=>s.score_scaled).length);
        
        const totalQuiz=(quizAttempts||[]).length;
        const passedQuiz=(quizAttempts||[]).filter(q=>q.passed).length;
        const quizThisWeek=(quizAttempts||[]).filter(q=>new Date(q.created_at)>sevenDaysAgo).length;
        const avgQuizScore=totalQuiz>0?(quizAttempts||[]).reduce((a,q)=>a+(q.score_percent||0),0)/totalQuiz:0;
        
        const totalCourses=(courses||[]).length;
        const publishedCourses=(courses||[]).filter(c=>c.is_published).length;
        
        // Taux de complétion global
        const completionRate=totalEnrollments>0?Math.round((completedEnrollments/totalEnrollments)*100):0;
        
        // Temps total de formation
        const totalTime=filteredEnrollments.reduce((a,e)=>a+(e.time_spent_seconds||0),0);
        
        setStats({
          totalLearners,newLearnersThisWeek,activeLearners,
          totalEnrollments,completedEnrollments,inProgressEnrollments,enrollmentsThisWeek,
          totalScorm,completedScorm,scormThisWeek,avgScormScore,
          totalQuiz,passedQuiz,quizThisWeek,avgQuizScore,
          totalCourses,publishedCourses,
          completionRate,totalTime
        });
        
        // ========== ALERTES ==========
        
        const alertsList=[];
        
        // Apprenants inactifs
        const inactiveLearners=(learners||[]).filter(l=>{
          const hasEnrollment=filteredEnrollments.some(e=>e.learner_id===l.id);
          if(!hasEnrollment)return false;
          const lastActivity=(scormProgress||[]).filter(s=>s.learner_id===l.id).map(s=>s.last_accessed_at).sort().pop();
          return !lastActivity||new Date(lastActivity)<sevenDaysAgo;
        });
        if(inactiveLearners.length>0){
          alertsList.push({type:'warning',icon:'UserX',title:`${inactiveLearners.length} apprenant${inactiveLearners.length>1?'s':''} inactif${inactiveLearners.length>1?'s':''}`,desc:'Aucune activité depuis 7 jours',count:inactiveLearners.length});
        }
        
        // Apprenants en difficulté (score < 50%)
        const learnerScores={};
        (scormProgress||[]).forEach(s=>{
          if(s.score_scaled){
            if(!learnerScores[s.learner_id])learnerScores[s.learner_id]=[];
            learnerScores[s.learner_id].push(s.score_scaled>1?s.score_scaled:s.score_scaled*100);
          }
        });
        const strugglingLearners=Object.entries(learnerScores).filter(([id,scores])=>{
          const avg=scores.reduce((a,b)=>a+b,0)/scores.length;
          return avg<50;
        }).length;
        if(strugglingLearners>0){
          alertsList.push({type:'danger',icon:'AlertTriangle',title:`${strugglingLearners} apprenant${strugglingLearners>1?'s':''} en difficulté`,desc:'Score moyen < 50%',count:strugglingLearners});
        }
        
        // Nouvelles inscriptions
        if(enrollmentsThisWeek>0){
          alertsList.push({type:'info',icon:'UserPlus',title:`${enrollmentsThisWeek} nouvelle${enrollmentsThisWeek>1?'s':''} inscription${enrollmentsThisWeek>1?'s':''}`,desc:'Cette semaine',count:enrollmentsThisWeek});
        }
        
        // Cours presque terminés
        const almostDone=filteredEnrollments.filter(e=>(e.progress_percent||0)>=80&&e.status!=='completed').length;
        if(almostDone>0){
          alertsList.push({type:'success',icon:'TrendingUp',title:`${almostDone} formation${almostDone>1?'s':''} presque terminée${almostDone>1?'s':''}`,desc:'Progression > 80%',count:almostDone});
        }
        
        setAlerts(alertsList);
        
        // ========== TOP APPRENANTS ==========
        
        const learnerStats=(learners||[]).map(l=>{
          const lEnrollments=filteredEnrollments.filter(e=>e.learner_id===l.id);
          const lScorm=(scormProgress||[]).filter(s=>s.learner_id===l.id);
          const lQuiz=(quizAttempts||[]).filter(q=>q.learner_id===l.id);
          const completed=lEnrollments.filter(e=>e.status==='completed').length;
          const total=lEnrollments.length;
          const progress=total>0?Math.round((completed/total)*100):0;
          const scormDone=lScorm.filter(s=>s.completion_status==='completed'||s.completion_status==='passed').length;
          const quizPassed=lQuiz.filter(q=>q.passed).length;
          const lastActivity=[
            ...lEnrollments.map(e=>e.updated_at),
            ...lScorm.map(s=>s.last_accessed_at)
          ].filter(Boolean).sort((a,b)=>new Date(b)-new Date(a))[0];
          
          return{...l,completed,total,progress,scormDone,scormTotal:lScorm.length,quizPassed,quizTotal:lQuiz.length,lastActivity};
        }).filter(l=>l.total>0).sort((a,b)=>b.progress-a.progress);
        
        setTopLearners(learnerStats.slice(0,10));
        
        // ========== ACTIVITÉ RÉCENTE ==========
        
        const activities=[];
        
        // Inscriptions récentes
        filteredEnrollments.filter(e=>new Date(e.created_at)>sevenDaysAgo).forEach(e=>{
          const learner=(learners||[]).find(l=>l.id===e.learner_id);
          activities.push({
            type:'enrollment',
            icon:'UserPlus',
            color:'blue',
            title:`${learner?.first_name||'?'} ${learner?.last_name||'?'}`,
            desc:`inscrit à "${e.playlists?.title||'cours'}"`,
            date:e.created_at
          });
        });
        
        // Cours terminés récemment
        filteredEnrollments.filter(e=>e.status==='completed'&&e.updated_at&&new Date(e.updated_at)>sevenDaysAgo).forEach(e=>{
          const learner=(learners||[]).find(l=>l.id===e.learner_id);
          activities.push({
            type:'completion',
            icon:'CheckCircle',
            color:'green',
            title:`${learner?.first_name||'?'} ${learner?.last_name||'?'}`,
            desc:`a terminé "${e.playlists?.title||'cours'}"`,
            date:e.updated_at
          });
        });
        
        // SCORM réussis
        (scormProgress||[]).filter(s=>s.completion_status==='passed'&&s.last_accessed_at&&new Date(s.last_accessed_at)>sevenDaysAgo).forEach(s=>{
          const learner=(learners||[]).find(l=>l.id===s.learner_id);
          activities.push({
            type:'scorm',
            icon:'Package',
            color:'orange',
            title:`${learner?.first_name||'?'} ${learner?.last_name||'?'}`,
            desc:`SCORM réussi (${Math.round(s.score_scaled>1?s.score_scaled:s.score_scaled*100)}%)`,
            date:s.last_accessed_at
          });
        });
        
        setRecentActivity(activities.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,15));
        
        // ========== STATS PAR CENTRE (Super Admin) ==========
        
        if(isSuperAdmin&&centersData.length>0){
          const centerStats=centersData.map(c=>{
            const cLearners=(learners||[]).filter(l=>l.center_id===c.id).length;
            const cLearnerIds=(learners||[]).filter(l=>l.center_id===c.id).map(l=>l.id);
            const cEnrollments=filteredEnrollments.filter(e=>cLearnerIds.includes(e.learner_id)).length;
            const cCompleted=filteredEnrollments.filter(e=>cLearnerIds.includes(e.learner_id)&&e.status==='completed').length;
            return{...c,learners:cLearners,enrollments:cEnrollments,completed:cCompleted,rate:cEnrollments>0?Math.round((cCompleted/cEnrollments)*100):0};
          }).sort((a,b)=>b.learners-a.learners);
          setQuickStats({centerStats});
        }
        
        setLoading(false);
      },[isSuperAdmin,center?.id]);
      
      useEffect(()=>{load();},[load]);
      
      if(loading)return<Loading/>;
      
      const roleTitle=isSuperAdmin?'Super Administrateur':realRole==='center_admin'?'Administrateur Centre':'Formateur';
      const greeting=new Date().getHours()<12?'Bonjour':new Date().getHours()<18?'Bon après-midi':'Bonsoir';
      
      return<div className="space-y-6">
        {/* Header avec salutation */}
        <div className="flex items-center justify-between">
          <div>
            <h1 className="text-2xl font-bold">{greeting}{profile?.first_name?`, ${profile.first_name}`:''} 👋</h1>
            <p className="text-gray-400">{roleTitle}{center?.name?` • ${center.name}`:isSuperAdmin?' • Tous les centres':''}</p>
          </div>
          <div className="flex items-center gap-3">
            <Button variant="ghost" icon="RefreshCw" onClick={load}>Actualiser</Button>
            {isSuperAdmin&&<Button variant="secondary" icon="Building2" onClick={()=>window.location.hash='centers'}>Gérer les centres</Button>}
          </div>
        </div>
        
        {/* Alertes */}
        {alerts.length>0&&(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            {alerts.map((alert,i)=>(
              <Card key={i} className={`p-4 cursor-pointer hover:scale-[1.02] transition-transform border-l-4 ${
                alert.type==='danger'?'border-l-red-500 bg-red-500/5':
                alert.type==='warning'?'border-l-yellow-500 bg-yellow-500/5':
                alert.type==='success'?'border-l-green-500 bg-green-500/5':
                'border-l-blue-500 bg-blue-500/5'
              }`} onClick={()=>window.location.hash='scorm-tracking'}>
                <div className="flex items-center gap-3">
                  <div className={`w-12 h-12 rounded-xl flex items-center justify-center ${
                    alert.type==='danger'?'bg-red-500/20':
                    alert.type==='warning'?'bg-yellow-500/20':

    function ScormTrackingPage(){
      const{can,center,isSuperAdmin,profile}=useAuth();
      const[loading,setLoading]=useState(true);
      const[activeTab,setActiveTab]=useState('overview');
      const[filter,setFilter]=useState({learner:'all',course:'all',path:'all',search:''});
      const[selectedLearner,setSelectedLearner]=useState(null);
      const[resetting,setResetting]=useState(false);
      
      // Réinitialiser la progression d'un cours pour un apprenant (Super Admin)
      const resetCourseProgress=async(enrollment,learner)=>{
        const confirmMsg=`⚠️ RÉINITIALISER LA PROGRESSION ?\n\nApprenant: ${learner.first_name} ${learner.last_name}\nCours: ${enrollment.playlists?.title}\n\nCette action va remettre à zéro :\n- La progression du cours\n- Les données SCORM associées\n- Les tentatives de quiz\n- La progression vidéo\n\nCette action est irréversible.`;
        if(!confirm(confirmMsg))return;
        
        setResetting(true);
        try{
          await supabase.from('enrollments').update({
            progress_percent:0,status:'not_started',time_spent_seconds:0,completed_at:null,last_activity_at:null
          }).eq('id',enrollment.id);
          try{await supabase.from('scorm_tracking').delete().eq('learner_id',learner.id).eq('enrollment_id',enrollment.id);}catch(e){}
          try{await supabase.from('scorm_progress').delete().eq('learner_id',learner.id).eq('enrollment_id',enrollment.id);}catch(e){}
          try{await supabase.from('quiz_attempts').delete().eq('learner_id',learner.id).eq('enrollment_id',enrollment.id);}catch(e){}
          try{await supabase.from('video_progress').delete().eq('learner_id',learner.id).eq('enrollment_id',enrollment.id);}catch(e){}
          alert('✅ Progression du cours réinitialisée');
          await load();setSelectedLearner(null);
        }catch(err){alert('Erreur: '+err.message);}
        setResetting(false);
      };
      
      // Réinitialiser la progression d'un parcours pour un apprenant (Super Admin)
      const resetPathProgress=async(pathEnrollment,learner)=>{
        const confirmMsg=`⚠️ RÉINITIALISER LE PARCOURS ?\n\nApprenant: ${learner.first_name} ${learner.last_name}\nParcours: ${pathEnrollment.learning_paths?.title}\n\nCette action va remettre à zéro la progression.\n\nCette action est irréversible.`;
        if(!confirm(confirmMsg))return;
        setResetting(true);
        try{
          await supabase.from('path_enrollments').update({progress_percent:0,status:'not_started',completed_at:null}).eq('id',pathEnrollment.id);
          alert('✅ Progression du parcours réinitialisée');
          await load();setSelectedLearner(null);
        }catch(err){alert('Erreur: '+err.message);}
        setResetting(false);
      };
      
      // Réinitialiser TOUTES les données d'un apprenant (Super Admin)
      const resetAllLearnerProgress=async(learner)=>{
        const confirmMsg=`⚠️ ATTENTION - RÉINITIALISATION TOTALE !\n\nApprenant: ${learner.first_name} ${learner.last_name}\n\nCette action va supprimer TOUTES les données de formation.\nL'apprenant devra recommencer depuis le début.\n\nCette action est IRRÉVERSIBLE !`;
        if(!confirm(confirmMsg))return;
        if(!confirm('Êtes-vous vraiment sûr ?'))return;
        setResetting(true);
        try{
          const learnerId=learner.id;
          await supabase.from('enrollments').update({progress_percent:0,status:'not_started',time_spent_seconds:0,completed_at:null,last_activity_at:null}).eq('learner_id',learnerId);
          await supabase.from('path_enrollments').update({progress_percent:0,status:'not_started',completed_at:null}).eq('learner_id',learnerId);
          try{await supabase.from('scorm_tracking').delete().eq('learner_id',learnerId);}catch(e){}
          try{await supabase.from('scorm_progress').delete().eq('learner_id',learnerId);}catch(e){}
          try{await supabase.from('quiz_attempts').delete().eq('learner_id',learnerId);}catch(e){}
          try{await supabase.from('video_progress').delete().eq('learner_id',learnerId);}catch(e){}
          alert('✅ Toutes les données de formation ont été réinitialisées');
          await load();setSelectedLearner(null);
        }catch(err){alert('Erreur: '+err.message);}
        setResetting(false);
      };
      
      // Données
      const[learners,setLearners]=useState([]);
      const[courses,setCourses]=useState([]);
      const[paths,setPaths]=useState([]);
      const[enrollments,setEnrollments]=useState([]);
      const[pathEnrollments,setPathEnrollments]=useState([]);
      const[videoProgress,setVideoProgress]=useState([]);
      const[scormProgress,setScormProgress]=useState([]);
      const[quizAttempts,setQuizAttempts]=useState([]);
      const[modules,setModules]=useState([]);
      
      // Stats globales
      const[stats,setStats]=useState({
        totalLearners:0,activeLearners:0,
        totalEnrollments:0,completedEnrollments:0,
        totalPaths:0,completedPaths:0,
        totalScorm:0,completedScorm:0,passedScorm:0,avgScormScore:0,
        totalQuiz:0,passedQuiz:0,avgQuizScore:0,
        totalWatchTime:0,totalCourseTime:0
      });

      const load=useCallback(async()=>{
        // Charger les apprenants (filtrés par centre)
        let ql=supabase.from('profiles').select('id,first_name,last_name,email,created_at').eq('role','learner');
        if(!isSuperAdmin&&center?.id)ql=ql.eq('center_id',center.id);
        const{data:lrn}=await ql;
        setLearners(lrn||[]);
        const learnerIds=(lrn||[]).map(l=>l.id);
        
        // Charger les cours (filtrés par centre + contenus LMS partagés)
        let qc=supabase.from('playlists').select('id,title,center_id,is_lms_content');
        if(!isSuperAdmin&&center?.id)qc=qc.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        const{data:crs}=await qc;
        setCourses(crs||[]);
        const courseIds=(crs||[]).map(c=>c.id);
        
        // Charger les parcours (filtrés par centre + contenus LMS partagés)
        let qp=supabase.from('learning_paths').select('id,title,center_id,is_lms_content');
        if(!isSuperAdmin&&center?.id)qp=qp.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        const{data:pth}=await qp;
        setPaths(pth||[]);
        
        // Charger les modules SCORM (filtrés par centre + contenus LMS partagés)
        let qm=supabase.from('scorm_modules').select('id,title,category,center_id,is_lms_content');
        if(!isSuperAdmin&&center?.id)qm=qm.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        const{data:mods}=await qm;
        setModules(mods||[]);
        
        // Charger les inscriptions aux cours
        let qe=supabase.from('enrollments').select('*,playlists:playlist_id(title)');
        if(!isSuperAdmin&&center?.id&&learnerIds.length>0){
          qe=qe.in('learner_id',learnerIds);
        }
        const{data:enr}=await qe;
        const filteredEnr=(enr||[]).filter(e=>learnerIds.includes(e.learner_id));
        setEnrollments(filteredEnr);
        
        // Charger les inscriptions aux parcours
        let qpe=supabase.from('path_enrollments').select('*,learning_paths(id,title)');
        if(learnerIds.length>0){
          qpe=qpe.in('learner_id',learnerIds);
        }
        const{data:pathEnr}=await qpe;
        const filteredPathEnr=(pathEnr||[]).filter(pe=>learnerIds.includes(pe.learner_id));
        setPathEnrollments(filteredPathEnr);
        
        // Charger la progression vidéo
        let qv=supabase.from('video_progress').select('*');
        if(learnerIds.length>0){
          qv=qv.in('learner_id',learnerIds);
        }
        const{data:vp}=await qv;
        setVideoProgress(vp||[]);
        
        // Charger la progression SCORM
        let qs=supabase.from('scorm_progress').select('*');
        if(learnerIds.length>0){
          qs=qs.in('learner_id',learnerIds);
        }
        const{data:sp}=await qs;
        setScormProgress(sp||[]);
        
        // Charger les tentatives de quiz
        let qq=supabase.from('quiz_attempts').select('*,quizzes(title,passing_score)');
        if(learnerIds.length>0){
          qq=qq.in('learner_id',learnerIds);
        }
        const{data:qa}=await qq;
        setQuizAttempts(qa||[]);
        
        // Calculer les stats
        const totalLearners=learnerIds.length;
        const activeLearners=[...new Set([
          ...filteredEnr.map(e=>e.learner_id),
          ...filteredPathEnr.map(pe=>pe.learner_id),
          ...(vp||[]).map(v=>v.learner_id),
          ...(sp||[]).map(s=>s.learner_id)
        ])].length;
        
        const totalEnrollments=filteredEnr.length;
        const completedEnrollments=filteredEnr.filter(e=>e.status==='completed').length;
        
        const totalPaths=filteredPathEnr.length;
        const completedPaths=filteredPathEnr.filter(pe=>pe.status==='completed'||pe.progress_percent===100).length;
        
        const totalScorm=(sp||[]).length;
        const completedScorm=(sp||[]).filter(s=>s.completion_status==='completed'||s.completion_status==='passed').length;
        const passedScorm=(sp||[]).filter(s=>s.completion_status==='passed'||s.success_status==='passed').length;
        const scormWithScore=(sp||[]).filter(s=>s.score_scaled!==null&&s.score_scaled!==undefined);
        const avgScormScore=scormWithScore.length>0?scormWithScore.reduce((a,s)=>{
          const score=s.score_scaled||0;
          return a+(score>1?score:score*100);
        },0)/scormWithScore.length:0;
        
        const totalQuiz=(qa||[]).length;
        const passedQuiz=(qa||[]).filter(q=>q.passed).length;
        const avgQuizScore=totalQuiz>0?(qa||[]).reduce((a,q)=>a+(q.score_percent||0),0)/totalQuiz:0;
        
        const totalWatchTime=(vp||[]).reduce((a,v)=>a+(v.watch_time_seconds||0),0);
        const totalCourseTime=filteredEnr.reduce((a,e)=>a+(e.time_spent_seconds||0),0);
        const totalPathTime=filteredPathEnr.reduce((a,pe)=>a+(pe.time_spent_seconds||0),0);
        
        setStats({
          totalLearners,activeLearners,
          totalEnrollments,completedEnrollments,
          totalPaths,completedPaths,
          totalScorm,completedScorm,passedScorm,avgScormScore,
          totalQuiz,passedQuiz,avgQuizScore,
          totalWatchTime,totalCourseTime,totalPathTime
        });
        
        setLoading(false);
      },[isSuperAdmin,center?.id]);

      useEffect(()=>{load();},[load]);

      // Données par apprenant
      const learnerData=useMemo(()=>{
        return learners.map(l=>{
          const lEnrollments=enrollments.filter(e=>e.learner_id===l.id);

          const pathsTotal=lPathEnrollments.length;
          const pathProgress=pathsTotal>0?Math.round(lPathEnrollments.reduce((a,pe)=>a+(pe.progress_percent||0),0)/pathsTotal):0;

          const scormPassed=lScorm.filter(s=>s.completion_status==='passed'||s.success_status==='passed').length;
          const scormScores=lScorm.filter(s=>s.score_scaled!==null).map(s=>s.score_scaled>1?s.score_scaled:s.score_scaled*100);
          const avgScorm=scormScores.length>0?Math.round(scormScores.reduce((a,b)=>a+b,0)/scormScores.length):null;
          
          const quizPassed=lQuiz.filter(q=>q.passed).length;
          const quizScores=lQuiz.map(q=>q.score_percent||0);
          const avgQuiz=quizScores.length>0?Math.round(quizScores.reduce((a,b)=>a+b,0)/quizScores.length):null;
          
          const totalTime=lEnrollments.reduce((a,e)=>a+(e.time_spent_seconds||0),0)+lPathEnrollments.reduce((a,pe)=>a+(pe.time_spent_seconds||0),0);
          const watchTime=lVideos.reduce((a,v)=>a+(v.watch_time_seconds||0),0);
          const scormTime=lScorm.reduce((a,s)=>a+parseScormTime(s.total_time),0);
          const pathTime=lPathEnrollments.reduce((a,pe)=>a+(pe.time_spent_seconds||0),0);

            ...lEnrollments.map(e=>e.updated_at),
            ...lPathEnrollments.map(pe=>pe.updated_at),
