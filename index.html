                  <p className="text-xs text-gray-400">Parcours</p>
                </div>
                <div className="text-center p-3 bg-gray-700/50 rounded-lg">
                  <p className="text-2xl font-bold text-orange-400">{selectedLearner.scormPassed}/{selectedLearner.scormTotal}</p>
                  <p className="text-xs text-gray-400">SCORM</p>
                </div>
                <div className="text-center p-3 bg-gray-700/50 rounded-lg">
                  <p className="text-2xl font-bold text-pink-400">{selectedLearner.quizPassed}/{selectedLearner.quizTotal}</p>
                  <p className="text-xs text-gray-400">Quiz</p>
                </div>
                <div className="text-center p-3 bg-gray-700/50 rounded-lg">
                  <p className="text-2xl font-bold text-cyan-400">{formatDuration(selectedLearner.totalTime)}</p>
                  <p className="text-xs text-gray-400">Temps</p>
                </div>
              </div>
              
              {/* Cours */}
              <div>
                <div className="flex items-center justify-between mb-3">
                  <h4 className="font-semibold">Cours ({selectedLearner.enrollments.length})</h4>
                  {isSuperAdmin&&selectedLearner.enrollments.length>0&&<span className="text-xs text-gray-500">Cliquez sur 🔄 pour réinitialiser</span>}
                </div>
                <div className="space-y-2 max-h-40 overflow-y-auto">
                  {selectedLearner.enrollments.length===0?<p className="text-gray-500 text-sm">Aucun cours</p>:
                  selectedLearner.enrollments.map(e=>(
                    <div key={e.id} className="flex items-center justify-between p-3 bg-gray-700/50 rounded-lg">
                      <div className="flex-1"><p className="font-medium">{e.playlists?.title}</p></div>
                      <div className="flex items-center gap-3">
                        <div className="w-24"><ProgressBar percent={e.progress_percent||0} size="sm" showLabel={false}/></div>
                        <span className="text-sm w-12 text-right">{e.progress_percent||0}%</span>
                        <span className={`px-2 py-1 rounded text-xs ${e.status==='completed'?'bg-green-500/20 text-green-400':e.status==='in_progress'?'bg-yellow-500/20 text-yellow-400':'bg-gray-500/20 text-gray-400'}`}>
                          {e.status==='completed'?'Terminé':e.status==='in_progress'?'En cours':'Non commencé'}
                        </span>
                        {can('reset_progress')&&(e.progress_percent>0||e.status!=='not_started')&&<button onClick={()=>resetCourseProgress(e,selectedLearner)} disabled={resetting} className="p-1 hover:bg-orange-500/20 rounded text-orange-400" title="Réinitialiser ce cours"><Icon name="RotateCcw" size={14}/></button>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
              
              {/* Parcours */}
              {selectedLearner.pathEnrollments.length>0&&(
                <div>
                  <div className="flex items-center justify-between mb-3">
                    <h4 className="font-semibold">Parcours ({selectedLearner.pathEnrollments.length})</h4>
                    {can('reset_progress')&&<span className="text-xs text-gray-500">Cliquez sur 🔄 pour réinitialiser</span>}
                  </div>
                  <div className="space-y-2 max-h-40 overflow-y-auto">
                    {selectedLearner.pathEnrollments.map(pe=>(
                      <div key={pe.id} className="flex items-center justify-between p-3 bg-gray-700/50 rounded-lg">
                        <div className="flex-1"><p className="font-medium">{pe.learning_paths?.title||'Parcours'}</p></div>
                        <div className="flex items-center gap-3">
                          <div className="w-24"><ProgressBar percent={pe.progress_percent||0} size="sm" showLabel={false}/></div>
                          <span className="text-sm w-12 text-right">{pe.progress_percent||0}%</span>
                          <span className={`px-2 py-1 rounded text-xs ${pe.status==='completed'||pe.progress_percent===100?'bg-green-500/20 text-green-400':pe.progress_percent>0?'bg-yellow-500/20 text-yellow-400':'bg-gray-500/20 text-gray-400'}`}>
                            {pe.status==='completed'||pe.progress_percent===100?'Terminé':pe.progress_percent>0?'En cours':'Non commencé'}
                          </span>
                          {can('reset_progress')&&(pe.progress_percent>0||pe.status!=='not_started')&&<button onClick={()=>resetPathProgress(pe,selectedLearner)} disabled={resetting} className="p-1 hover:bg-orange-500/20 rounded text-orange-400" title="Réinitialiser ce parcours"><Icon name="RotateCcw" size={14}/></button>}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              
              {/* SCORM */}
              {selectedLearner.scormProgress.length>0&&(
                <div>
                  <h4 className="font-semibold mb-3">Modules SCORM ({selectedLearner.scormProgress.length})</h4>
                  <div className="space-y-2 max-h-40 overflow-y-auto">
                    {selectedLearner.scormProgress.map(s=>{
                      const m=modules.find(x=>x.id===s.module_id);
                      return(
                        <div key={s.id} className="flex items-center justify-between p-3 bg-gray-700/50 rounded-lg">
                          <p className="font-medium">{m?.title||'Module'}</p>
                          <div className="flex items-center gap-3">
                            <ScoreBadge score={s.score_scaled}/>
                            <ScormStatusBadge status={s.completion_status}/>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
              
              {/* Quiz */}
              {selectedLearner.quizAttempts.length>0&&(
                <div>
                  <h4 className="font-semibold mb-3">Quiz ({selectedLearner.quizAttempts.length})</h4>
                  <div className="space-y-2 max-h-40 overflow-y-auto">
                    {selectedLearner.quizAttempts.map(q=>(
                      <div key={q.id} className="flex items-center justify-between p-3 bg-gray-700/50 rounded-lg">
                        <p className="font-medium">{q.quizzes?.title||'Quiz'}</p>
                        <div className="flex items-center gap-3">
                          <span className={`font-semibold ${q.score_percent>=70?'text-green-400':'text-red-400'}`}>{q.score_percent}%</span>
                          {q.passed?<span className="px-2 py-1 bg-green-500/20 text-green-400 rounded text-xs">Réussi</span>:<span className="px-2 py-1 bg-red-500/20 text-red-400 rounded text-xs">Échoué</span>}
                          {can('grade_quizzes')&&!q.passed&&<button className="p-1 hover:bg-indigo-500/20 rounded text-indigo-400" title="Noter manuellement (bientôt disponible)" disabled><Icon name="Pencil" size={14}/></button>}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              
              {/* Certificats - issue_certificates */}
              {can('issue_certificates')&&selectedLearner.enrollments.some(e=>e.status==='completed')&&(
                <div className="p-3 bg-gray-700/30 rounded-lg">
                  <div className="flex items-center gap-2 text-sm text-gray-400">
                    <Icon name="Award" size={16} className="text-amber-400"/>
                    <span>{selectedLearner.enrollments.filter(e=>e.status==='completed').length} cours terminé(s) — certificats auto-générés</span>
                  </div>
                </div>
              )}
              
              {/* Actions Reset */}
              {can('reset_progress')&&(selectedLearner.enrollments.length>0||selectedLearner.pathEnrollments.length>0)&&(
                <div className="pt-4 border-t border-gray-700">
                  <div className="flex items-center justify-between">
                    <div>
                      <p className="text-sm text-gray-400">Actions administrateur</p>
                      <p className="text-xs text-gray-500">Réinitialisez toutes les données de formation de cet apprenant</p>
                    </div>
                    <Button variant="secondary" icon="RotateCcw" className="text-red-400 border-red-400/30 hover:bg-red-500/20" onClick={()=>resetAllLearnerProgress(selectedLearner)} disabled={resetting}>
                      {resetting?'Réinitialisation...':'Réinitialiser tout'}
                    </Button>
                  </div>
                </div>
              )}
            </div>
          )}
        </Modal>
        
        {/* Onglet Graphiques */}
        {activeTab==='charts'&&<AnalyticsPage/>}
      </div>;
    }
    function AnalyticsPage(){
      const{can,center,isSuperAdmin}=useAuth();
      const[data,setData]=useState({enrollments:[],courses:[],summary:{},learnerStats:[]});
      const[loading,setLoading]=useState(true);
      const[filter,setFilter]=useState({course:'all',period:'all'});
      const[selectedLearner,setSelectedLearner]=useState(null);
      const progressChartRef=useRef(null);
      const statusChartRef=useRef(null);
      const courseChartRef=useRef(null);
      const chartsRef=useRef({});

      const load=useCallback(async()=>{
        const seeAllCenters=isSuperAdmin||can('view_all_analytics');
        // D'abord charger les apprenants du centre pour filtrer correctement
        let learnerQuery=supabase.from('profiles').select('id').eq('role','learner');
        if(!seeAllCenters&&center?.id)learnerQuery=learnerQuery.eq('center_id',center.id);
        const{data:learnerProfiles}=await learnerQuery;
        const centerLearnerIds=(learnerProfiles||[]).map(l=>l.id);
        
        // Charger les inscriptions des apprenants du centre
        let q=supabase.from('enrollments').select(`
          *,
          playlists:playlist_id(id,title,center_id,is_lms_content),
          profiles:learner_id(id,first_name,last_name,email,center_id)
        `);
        if(!isSuperAdmin&&center?.id&&centerLearnerIds.length>0){
          q=q.in('learner_id',centerLearnerIds);
        }
        const{data:enrollments}=await q;
        
        // Filtrer côté client: garder les inscriptions aux cours du centre OU aux cours LMS partagés
        const filteredEnrollments=(!isSuperAdmin&&center?.id)
          ?(enrollments||[]).filter(e=>e.playlists?.center_id===center.id||e.playlists?.is_lms_content===true)
          :(enrollments||[]);
        
        // Charger les cours (centre + LMS partagés)
        let qc=supabase.from('playlists').select('id,title,is_published,center_id,is_lms_content');
        if(!isSuperAdmin&&center?.id)qc=qc.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        const{data:courses}=await qc;
        
        // Charger les sessions de cours pour le temps total
        let qs=supabase.from('course_sessions').select('*');
        if(!isSuperAdmin&&center?.id){
          // Filtrer par les enrollments du centre
          const enrollmentIds=(filteredEnrollments||[]).filter(e=>e.playlists).map(e=>e.id);
          if(enrollmentIds.length>0)qs=qs.in('enrollment_id',enrollmentIds);
        }
        const{data:sessions}=await qs;
        
        // Charger les scores SCORM
        const learnerIds=[...new Set((filteredEnrollments||[]).map(e=>e.learner_id).filter(Boolean))];
        let scormData=[];
        if(learnerIds.length>0){
          const{data:sp}=await supabase.from('scorm_progress').select('*').in('learner_id',learnerIds);
          scormData=sp||[];
        }
        
        // Charger les tentatives de quiz
        let quizData=[];
        if(learnerIds.length>0){
          const{data:qa}=await supabase.from('quiz_attempts').select('*').in('learner_id',learnerIds);
          quizData=qa||[];
        }
        
        // Charger la progression vidéo
        let videoData=[];
        if(learnerIds.length>0){
          const{data:vp}=await supabase.from('video_progress').select('*').in('learner_id',learnerIds);
          videoData=vp||[];
        }

        // Calculer les statistiques par apprenant
        const learnerStats=learnerIds.map(learnerId=>{
          const learnerEnrollments=(filteredEnrollments||[]).filter(e=>e.learner_id===learnerId);
          const profile=learnerEnrollments[0]?.profiles;
          const learnerVideos=videoData.filter(v=>v.learner_id===learnerId);
          const learnerScorm=scormData.filter(s=>s.learner_id===learnerId);
          const learnerQuiz=quizData.filter(q=>q.learner_id===learnerId);
          
          // Temps réel = vidéos + SCORM + quiz
          const videoTime=learnerVideos.reduce((a,v)=>a+(v.watch_time_seconds||0),0);
          const scormTime=learnerScorm.reduce((a,s)=>a+parseScormTime(s.total_time),0);
          const quizTime=learnerQuiz.reduce((a,q)=>a+(q.duration_seconds||0),0);
          const totalTime=videoTime+scormTime+quizTime;
          
          const completedCourses=learnerEnrollments.filter(e=>e.status==='completed').length;
          const avgScormScore=learnerScorm.length>0?learnerScorm.reduce((a,s)=>a+(s.score_scaled>1?s.score_scaled:s.score_scaled*100),0)/learnerScorm.length:null;
          const avgQuizScore=learnerQuiz.length>0?learnerQuiz.reduce((a,q)=>a+(q.score_percent||0),0)/learnerQuiz.length:null;
          const lastActivity=learnerEnrollments.reduce((latest,e)=>{
            const d=new Date(e.updated_at);
            return d>latest?d:latest;
          },new Date(0));
          
          return{
            id:learnerId,
            name:profile?`${profile.first_name} ${profile.last_name}`:'Inconnu',
            email:profile?.email||'',
            totalCourses:learnerEnrollments.length,
            completedCourses,
            totalTime,
            avgProgress:learnerEnrollments.length>0?Math.round(learnerEnrollments.reduce((a,e)=>a+(e.progress_percent||0),0)/learnerEnrollments.length):0,
            avgScormScore,
            avgQuizScore,
            lastActivity:lastActivity.getTime()>0?lastActivity:null,
            enrollments:learnerEnrollments
          };
        }).sort((a,b)=>b.totalTime-a.totalTime);

        // Calculer les statistiques globales
        const validEnrollments=(filteredEnrollments||[]).filter(e=>e.playlists&&e.profiles);
        
        // Temps total réel = toutes les vidéos + tous les SCORM + tous les quiz
        const totalVideoTime=videoData.reduce((a,v)=>a+(v.watch_time_seconds||0),0);
        const totalScormTime=scormData.reduce((a,s)=>a+parseScormTime(s.total_time),0);
        const totalQuizTime=quizData.reduce((a,q)=>a+(q.duration_seconds||0),0);
        const totalTimeAll=totalVideoTime+totalScormTime+totalQuizTime;
        
        const summary={
          total:validEnrollments.length,
          notStarted:validEnrollments.filter(e=>e.status==='not_started').length,
          inProgress:validEnrollments.filter(e=>e.status==='in_progress').length,
          completed:validEnrollments.filter(e=>e.status==='completed').length,
          avgProgress:validEnrollments.length?Math.round(validEnrollments.reduce((a,e)=>a+(e.progress_percent||0),0)/validEnrollments.length):0,
          totalTime:totalTimeAll,
          avgTimePerCourse:validEnrollments.length>0?Math.round(totalTimeAll/validEnrollments.length):0,
          learnersCount:learnerIds.length
        };

        setData({enrollments:validEnrollments,courses:courses||[],summary,learnerStats});
        setLoading(false);
      },[isSuperAdmin,center?.id]);

      useEffect(()=>{load();},[load]);

      // Créer les graphiques
      useEffect(()=>{
        if(loading||!data.enrollments.length)return;

        // Détruire les anciens graphiques
        Object.values(chartsRef.current).forEach(chart=>chart?.destroy());
        chartsRef.current={};

        // Graphique de statut (Doughnut)
        if(statusChartRef.current){
          const ctx=statusChartRef.current.getContext('2d');
          chartsRef.current.status=new Chart(ctx,{
            type:'doughnut',
            data:{
              labels:['Non commencé','En cours','Terminé'],
              datasets:[{
                data:[data.summary.notStarted,data.summary.inProgress,data.summary.completed],
                backgroundColor:['#6b7280','#eab308','#22c55e'],
                borderWidth:0
              }]
            },
            options:{
              responsive:true,
              maintainAspectRatio:false,
              plugins:{legend:{position:'bottom',labels:{color:'#9ca3af'}}}
            }
          });
        }

        // Graphique par cours (Bar)
        if(courseChartRef.current){
          const courseStats=data.courses.map(c=>{
            const courseEnrollments=data.enrollments.filter(e=>e.playlist_id===c.id);
            return{
              title:c.title,
              count:courseEnrollments.length,
              avgProgress:courseEnrollments.length?Math.round(courseEnrollments.reduce((a,e)=>a+(e.progress_percent||0),0)/courseEnrollments.length):0
            };
          });
          
          const ctx=courseChartRef.current.getContext('2d');
          chartsRef.current.course=new Chart(ctx,{
            type:'bar',
            data:{
              labels:courseStats.map(c=>c.title.length>20?c.title.substring(0,20)+'...':c.title),
              datasets:[
                {label:'Inscrits',data:courseStats.map(c=>c.count),backgroundColor:'#6366f1'},
                {label:'Progression moy. %',data:courseStats.map(c=>c.avgProgress),backgroundColor:'#22c55e'}
              ]
            },
            options:{
              responsive:true,
              maintainAspectRatio:false,
              scales:{
                x:{ticks:{color:'#9ca3af'},grid:{color:'#374151'}},
                y:{ticks:{color:'#9ca3af'},grid:{color:'#374151'}}
              },
              plugins:{legend:{labels:{color:'#9ca3af'}}}
            }
          });
        }

        // Graphique de progression (Line)
        if(progressChartRef.current){
          const ranges=['0-25%','26-50%','51-75%','76-100%'];
          const progressData=[
            data.enrollments.filter(e=>(e.progress_percent||0)<=25).length,
            data.enrollments.filter(e=>(e.progress_percent||0)>25&&(e.progress_percent||0)<=50).length,
            data.enrollments.filter(e=>(e.progress_percent||0)>50&&(e.progress_percent||0)<=75).length,
            data.enrollments.filter(e=>(e.progress_percent||0)>75).length
          ];
          
          const ctx=progressChartRef.current.getContext('2d');
          chartsRef.current.progress=new Chart(ctx,{
            type:'bar',
            data:{
              labels:ranges,
              datasets:[{label:'Nombre d\'apprenants',data:progressData,backgroundColor:'#8b5cf6'}]
            },
            options:{
              responsive:true,
              maintainAspectRatio:false,
              scales:{
                x:{ticks:{color:'#9ca3af'},grid:{color:'#374151'}},
                y:{ticks:{color:'#9ca3af'},grid:{color:'#374151'}}
              },
              plugins:{legend:{display:false}}
            }
          });
        }

        return()=>{
          Object.values(chartsRef.current).forEach(chart=>chart?.destroy());
        };
      },[loading,data]);

      // Filtrer les données
      const filteredEnrollments=data.enrollments.filter(e=>{
        if(filter.course!=='all'&&e.playlist_id!==filter.course)return false;
        return true;
      });

      // Export Excel complet
      const exportExcel=()=>{
        // Feuille 1: Détail des inscriptions
        const exportData=filteredEnrollments.map(e=>({
          'Apprenant':e.profiles?.first_name+' '+e.profiles?.last_name,
          'Email':e.profiles?.email,
          'Cours':e.playlists?.title,
          'Progression (%)':e.progress_percent||0,
          'Temps passé':formatTime(e.time_spent_seconds),
          'Temps (secondes)':e.time_spent_seconds||0,
          'Statut':e.status==='not_started'?'Non commencé':e.status==='in_progress'?'En cours':'Terminé',
          'Date inscription':new Date(e.created_at).toLocaleDateString('fr-FR'),
          'Dernière activité':e.updated_at?new Date(e.updated_at).toLocaleDateString('fr-FR'):'-'
        }));
        
        // Feuille 2: Statistiques par apprenant
        const learnerExport=data.learnerStats.map(l=>({
          'Apprenant':l.name,
          'Email':l.email,
          'Cours inscrits':l.totalCourses,
          'Cours terminés':l.completedCourses,
          'Progression moyenne (%)':l.avgProgress,
          'Temps total':formatTime(l.totalTime),
          'Temps total (secondes)':l.totalTime,
          'Score SCORM moyen (%)':l.avgScormScore!==null?Math.round(l.avgScormScore):'-',
          'Score Quiz moyen (%)':l.avgQuizScore!==null?Math.round(l.avgQuizScore):'-',

    // ============================================================
    // PAGE: Sessions Formateur (TrainerSessionsPage) - Lecture seule
    // ============================================================
    function TrainerSessionsPage(){
      const{profile,center}=useAuth();
      const[loading,setLoading]=useState(true);
      const[sessions,setSessions]=useState([]);
      const[selectedSession,setSelectedSession]=useState(null);
      const[participants,setParticipants]=useState([]);
      const[detailModal,setDetailModal]=useState(null);
      
      const statusConfig={planned:{label:'Planifiée',color:'blue',icon:'Clock'},active:{label:'En cours',color:'green',icon:'Play'},completed:{label:'Terminée',color:'gray',icon:'CheckCircle'},cancelled:{label:'Annulée',color:'red',icon:'XCircle'}};
      const locationTypes={online:{label:'En ligne',icon:'Globe'},onsite:{label:'Présentiel',icon:'MapPin'},hybrid:{label:'Hybride',icon:'Monitor'}};
      
      const load=useCallback(async()=>{
        if(!profile?.id)return;
        // Charger les sessions où le formateur est assigné
        const{data:trainerSessions}=await supabase.from('session_trainers').select('session_id,role').eq('trainer_id',profile.id);
        if(!trainerSessions||trainerSessions.length===0){setSessions([]);setLoading(false);return;}
        
        const sessionIds=trainerSessions.map(ts=>ts.session_id);
        
        // Charger les sessions (données de base)
        let sessData=[];
        try{
          const{data}=await supabase.from('training_sessions').select('*').in('id',sessionIds).order('start_date',{ascending:false});
          sessData=data||[];
        }catch(e){sessData=[];}
        
        // Charger les formateurs de ces sessions séparément
        let allTrainers=[];
        try{
          const{data,error}=await supabase.from('session_trainers').select('id,session_id,trainer_id,role,profiles:trainer_id(first_name,last_name)').in('session_id',sessionIds);
          if(!error)allTrainers=data||[];
          else console.warn('[TrainerSessions] trainers query error:',error.message);
        }catch(e){console.warn('[TrainerSessions] trainers catch:',e);}
        
        // Charger les participants séparément
        let allParticipants=[];
        try{
          const{data,error}=await supabase.from('session_participants').select('id,session_id,learner_id,status,profiles:learner_id(first_name,last_name,email)').in('session_id',sessionIds);
          if(!error)allParticipants=data||[];
          else console.warn('[TrainerSessions] participants query error:',error.message);
        }catch(e){console.warn('[TrainerSessions] participants catch:',e);}
        
        console.log('[TrainerSessions] loaded:',{sessions:sessData.length,trainers:allTrainers.length,participants:allParticipants.length});
        
        // Load session_contents
        let allContents=[];
        try{
          const{data:sc}=await supabase.from('session_contents').select('*').in('session_id',sessionIds);
          allContents=sc||[];
        }catch(e){}
        
        // Load content titles
        const[{data:coursesD},{data:pathsD}]=await Promise.all([
          supabase.from('playlists').select('id,title').order('title'),
          supabase.from('learning_paths').select('id,title').order('title')
        ]);
        
        const enriched=sessData.map(s=>{
          const sTrainers=allTrainers.filter(t=>t.session_id===s.id);
          const sParticipants=allParticipants.filter(p=>p.session_id===s.id);
          const sContents=allContents.filter(c=>c.session_id===s.id);
          const contentTitle=s.content_type==='course'
            ?(coursesD||[]).find(c=>c.id===s.content_id)?.title
            :(pathsD||[]).find(p=>p.id===s.content_id)?.title;
          const myRole=trainerSessions.find(ts=>ts.session_id===s.id)?.role||'trainer';
          return{...s,
            session_trainers:sTrainers,
            session_participants:sParticipants,
            session_contents:sContents,
            content_title:contentTitle,
            myRole,
            trainers_count:sTrainers.length,
            participants_count:sParticipants.length
          };
        });
        
        setSessions(enriched);
        setLoading(false);
      },[profile?.id]);
      
      useEffect(()=>{load();},[load]);
      
      const openDetail=(session)=>{
        setSelectedSession(session);
        setParticipants(session.session_participants||[]);
        setDetailModal('detail');
      };
      
      if(loading)return<Loading/>;
      
      return<div>
        <div className="flex items-center justify-between mb-6">
          <div>
            <h1 className="text-2xl font-bold flex items-center gap-2">
              <Icon name="Calendar" size={28}/>Mes sessions
            </h1>
            <p className="text-sm text-gray-400">{sessions.length} session{sessions.length>1?'s':''} assignée{sessions.length>1?'s':''}</p>
          </div>
          <Button variant="ghost" icon="RefreshCw" onClick={load}>Actualiser</Button>
        </div>
        
        {sessions.length===0?(
          <Card className="p-12 text-center">
            <Icon name="Calendar" size={48} className="mx-auto text-gray-600 mb-4"/>
            <h3 className="text-lg font-semibold mb-2">Aucune session assignée</h3>
            <p className="text-gray-400">Vous serez notifié lorsqu'un administrateur vous assignera à une session</p>
          </Card>
        ):(
          <div className="grid gap-4">
            {sessions.map(session=>{
              const st=statusConfig[session.status]||statusConfig.planned;
              return<Card key={session.id} className="p-4 cursor-pointer hover:bg-gray-750 transition" onClick={()=>openDetail(session)}>
                <div className="flex items-start gap-4">
                  <div className="flex-1">
                    <div className="flex items-center gap-2 mb-1">
                      <h3 className="font-semibold text-lg">{session.name}</h3>
                      <span className={`px-2 py-0.5 rounded text-xs bg-${st.color}-500/20 text-${st.color}-400`}>
                        <Icon name={st.icon} size={12} className="inline mr-1"/>{st.label}
                      </span>
                      {session.myRole==='lead'&&<span className="px-2 py-0.5 rounded text-xs bg-amber-500/20 text-amber-400">★ Responsable</span>}
                    </div>
                    
                    {session.content_title&&<p className="text-sm text-gray-400">{session.content_type==='course'?'📚':'🛤️'} {session.content_title}</p>}
                    {session.description&&<p className="text-sm text-gray-500 mt-1">{session.description}</p>}
                    
                    <div className="flex flex-wrap gap-4 mt-2 text-sm">
                      <span className="flex items-center gap-1 text-gray-400">
                        <Icon name="Calendar" size={14}/>
                        {new Date(session.start_date).toLocaleDateString('fr-FR')}
                        {session.end_date&&session.end_date!==session.start_date&&` → ${new Date(session.end_date).toLocaleDateString('fr-FR')}`}
                      </span>
                      {session.start_time&&<span className="flex items-center gap-1 text-gray-400">
                        <Icon name="Clock" size={14}/>{session.start_time.slice(0,5)}{session.end_time&&` - ${session.end_time.slice(0,5)}`}
                      </span>}
                      <span className="flex items-center gap-1 text-gray-400">
                        <Icon name={locationTypes[session.location_type]?.icon||'Globe'} size={14}/>
                        {locationTypes[session.location_type]?.label||'En ligne'}
                        {session.location&&` • ${session.location}`}
                      </span>
                    </div>
                  </div>
                  
                  <div className="flex gap-4 items-center shrink-0">
                    <div className="text-center">
                      <p className="text-xl font-bold text-cyan-400">{session.trainers_count}</p>
                      <p className="text-xs text-gray-500">Formateur{session.trainers_count>1?'s':''}</p>
                    </div>
                    <div className="text-center">
                      <p className="text-xl font-bold text-indigo-400">{session.participants_count}</p>
                      <p className="text-xs text-gray-500">Apprenant{session.participants_count>1?'s':''}</p>
                    </div>
                  </div>
                </div>
                
                {session.code&&<div className="mt-2 pt-2 border-t border-gray-700">
                  <span className="text-xs text-gray-500">Code inscription: </span>
                  <span className="font-mono text-xs text-amber-400">{session.code}</span>
                </div>}
              </Card>;
            })}
          </div>
        )}
        
        {/* Modal Détail Session */}
        <Modal isOpen={detailModal==='detail'} onClose={()=>setDetailModal(null)} title={selectedSession?.name} size="lg">
          {selectedSession&&<div className="space-y-4">
            <div className="grid grid-cols-2 gap-4">
              <div className="p-3 bg-gray-700/50 rounded-lg">
                <p className="text-xs text-gray-500 mb-1">Statut</p>
                <p className="font-medium">{statusConfig[selectedSession.status]?.label||selectedSession.status}</p>
              </div>
              <div className="p-3 bg-gray-700/50 rounded-lg">
                <p className="text-xs text-gray-500 mb-1">Dates</p>
                <p className="font-medium">{new Date(selectedSession.start_date).toLocaleDateString('fr-FR')}{selectedSession.end_date&&selectedSession.end_date!==selectedSession.start_date&&` → ${new Date(selectedSession.end_date).toLocaleDateString('fr-FR')}`}</p>
              </div>
            </div>
            
            {selectedSession.description&&<div className="p-3 bg-gray-700/50 rounded-lg">
              <p className="text-xs text-gray-500 mb-1">Description</p>
              <p className="text-sm">{selectedSession.description}</p>
            </div>}
            
            {/* Participants */}
            <div>
              <h4 className="font-medium mb-2 flex items-center gap-2">
                <Icon name="Users" size={16}/>Participants ({participants.length})
              </h4>
              {participants.length===0?<p className="text-gray-500 text-sm">Aucun participant inscrit</p>:(
                <div className="space-y-1 max-h-60 overflow-y-auto">
                  {participants.map(p=>(
                    <div key={p.id} className="flex items-center gap-3 p-2 bg-gray-700/50 rounded-lg">
                      <div className="w-8 h-8 rounded-full bg-indigo-500/20 flex items-center justify-center text-sm font-bold text-indigo-400">
                        {(p.profiles?.first_name||'?')[0]}
                      </div>
                      <div className="flex-1">
                        <p className="text-sm font-medium">{p.profiles?.first_name} {p.profiles?.last_name}</p>
                        <p className="text-xs text-gray-500">{p.profiles?.email}</p>
                      </div>
                      <span className={`px-2 py-0.5 rounded text-xs ${p.status==='enrolled'?'bg-green-500/20 text-green-400':p.status==='completed'?'bg-blue-500/20 text-blue-400':'bg-gray-500/20 text-gray-400'}`}>
                        {p.status==='enrolled'?'Inscrit':p.status==='completed'?'Terminé':p.status}
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </div>
            
            {/* Contenus */}
            {(selectedSession.session_contents||[]).length>0&&<div>
              <h4 className="font-medium mb-2 flex items-center gap-2">

              <div className="space-y-1">
                {selectedSession.session_contents.map((sc,i)=>{
                  const icons={video:'📹',scorm:'📦',quiz:'❓',course:'📚',path:'🛤️'};
                  return<div key={i} className="flex items-center gap-2 p-2 bg-gray-700/50 rounded-lg">
                    <span>{icons[sc.content_type]||'📄'}</span>
                    <span className="text-sm">{sc.content_type}</span>
                  </div>;
                })}
              </div>
            </div>}
          </div>}
        </Modal>
      </div>;
    }

    // ============================================================
    // PAGE: Contenus Formateur (TrainerContenusPage) - Cours/Parcours des sessions assignées
    // ============================================================
    function TrainerContenusPage(){
      const{profile}=useAuth();
      const user=supabase.auth.getUser?null:null;
      const[loading,setLoading]=useState(true);
      const[courses,setCourses]=useState([]);
      const[paths,setPaths]=useState([]);
      const[activeTab,setActiveTab]=useState('courses');
      // Course viewer state
      const[viewingCourse,setViewingCourse]=useState(null);
      const[courseItems,setCourseItems]=useState([]); // unified: {type,data,position}
      const[currentItem,setCurrentItem]=useState(null);
      const[viewerTab,setViewerTab]=useState('content'); // content, list
      const playerRef=useRef(null);
      const vimeoPlayerRef=useRef(null);
      // Path viewer state
      const[viewingPath,setViewingPath]=useState(null);
      const[pathCourses,setPathCourses]=useState([]);
      
      const load=useCallback(async()=>{
        if(!profile?.id){setLoading(false);return;}
        
        // 1. Get sessions where trainer is assigned
        const{data:trainerSessions}=await supabase.from('session_trainers').select('session_id').eq('trainer_id',profile.id);
        if(!trainerSessions||trainerSessions.length===0){setLoading(false);return;}
        const sessionIds=trainerSessions.map(ts=>ts.session_id);
        
        // 2. Get sessions to find linked courses/paths
        let sessData=[];
        try{
          const{data}=await supabase.from('training_sessions').select('id,name,content_type,content_id,license_id,status,start_date').in('id',sessionIds);
          sessData=data||[];
        }catch(e){}
        
        // 3. Get session_contents for multi-content sessions
        let sessContents=[];
        try{
          const{data}=await supabase.from('session_contents').select('session_id,content_type,content_id').in('session_id',sessionIds);
          sessContents=data||[];
        }catch(e){}
        
        // 4. Collect all unique course and path IDs
        const courseIds=new Set();
        const pathIds=new Set();
        
        sessData.forEach(s=>{
          if(s.content_type==='course'&&s.content_id)courseIds.add(s.content_id);
          if(s.content_type==='path'&&s.content_id)pathIds.add(s.content_id);
        });
        sessContents.forEach(sc=>{
          if(sc.content_type==='course')courseIds.add(sc.content_id);
          if(sc.content_type==='path')pathIds.add(sc.content_id);
        });
        
        // 5. Load course and path details
        if(courseIds.size>0){
          const{data}=await supabase.from('playlists').select('*,playlist_videos(count)').in('id',[...courseIds]);
          const enriched=(data||[]).map(c=>{
            const relatedSessions=sessData.filter(s=>s.content_id===c.id||sessContents.some(sc=>sc.content_id===c.id&&sc.session_id===s.id));
            return{...c,sessions:relatedSessions};
          });
          setCourses(enriched);
        }
        
        if(pathIds.size>0){
          const{data}=await supabase.from('learning_paths').select('*,learning_path_courses(count)').in('id',[...pathIds]);
          const enriched=(data||[]).map(p=>{
            const relatedSessions=sessData.filter(s=>s.content_id===p.id||sessContents.some(sc=>sc.content_id===p.id&&sc.session_id===s.id));
            return{...p,sessions:relatedSessions};
          });
          setPaths(enriched);
        }
        
        setLoading(false);
      },[profile?.id]);
      
      useEffect(()=>{load();},[load]);
      
      // Open course viewer
      const openCourseViewer=async(course)=>{
        setViewingCourse(course);
        setViewerTab('content');
        
        // Load all content types
        const[{data:pvs},{data:ps}]=await Promise.all([
          supabase.from('playlist_videos').select('*,videos(*)').eq('playlist_id',course.id).order('position'),
          supabase.from('playlist_scorm').select('*,scorm_modules(*)').eq('playlist_id',course.id).order('position')
        ]);
        let pq=[];
        try{
          const{data}=await supabase.from('playlist_quizzes').select('*,quizzes(*)').eq('playlist_id',course.id).order('position');
          pq=data||[];
        }catch(e){}
        
        const items=[
          ...(pvs||[]).map(pv=>({type:'video',id:pv.id,position:pv.position,data:pv.videos,raw:pv})),
          ...(ps||[]).map(s=>({type:'scorm',id:s.id,position:s.position,data:s.scorm_modules,raw:s})),
          ...pq.map(q=>({type:'quiz',id:q.id,position:q.position,data:q.quizzes,raw:q}))
        ].sort((a,b)=>(a.position||0)-(b.position||0));
        
        setCourseItems(items);
        if(items.length>0)setCurrentItem(items[0]);
        else setCurrentItem(null);
      };
      
      // Load Vimeo player when a video is selected
      useEffect(()=>{
        if(!currentItem||currentItem.type!=='video'||!currentItem.data?.vimeo_id)return;
        if(vimeoPlayerRef.current){try{vimeoPlayerRef.current.destroy();}catch(e){}}
        if(!playerRef.current)return;
        
        const vimeoId=currentItem.data.vimeo_id||currentItem.data.vimeo_url?.match(/\/(\d+)/)?.[1];
        if(!vimeoId)return;
        
        try{
          vimeoPlayerRef.current=new Vimeo.Player(playerRef.current,{
            id:vimeoId,width:'100%',responsive:true,title:false,byline:false,portrait:false
          });
        }catch(e){console.warn('Vimeo player error:',e);}
        
        return()=>{if(vimeoPlayerRef.current){try{vimeoPlayerRef.current.destroy();}catch(e){}}};
      },[currentItem?.id,currentItem?.type]);
      
      const closeCourseViewer=()=>{
        if(vimeoPlayerRef.current){try{vimeoPlayerRef.current.destroy();}catch(e){}}
        setViewingCourse(null);setCourseItems([]);setCurrentItem(null);

      // Open path viewer

              ):currentItem.type==='quiz'?(

                  </div>

            </div>
            
            {/* Sidebar: content list */}
            <div>
              <Card className="p-4">

                  <Icon name="List" size={18}/>Contenu du cours
                </h3>
                <div className="space-y-1 max-h-[60vh] overflow-y-auto">
                  {courseItems.map((item,i)=>{
                    const isActive=currentItem?.id===item.id;
                    return<button key={item.id} onClick={()=>setCurrentItem(item)} className={`w-full flex items-center gap-3 p-3 rounded-lg text-left transition ${isActive?'bg-indigo-600':'hover:bg-gray-700'}`}>
