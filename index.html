<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Course Builder Pro</title>
  <meta name="description" content="Plateforme de création et diffusion de cours vidéo multi-centres">
  <meta name="theme-color" content="#1f2937">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{gray:{750:'#2d3748',850:'#1a1f2e'}}}}}</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://player.vimeo.com/api/player.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#111827}
    .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
    @keyframes spin{to{transform:rotate(360deg)}}.animate-spin{animation:spin 1s linear infinite}
    @keyframes fade-in{from{opacity:0}to{opacity:1}}.animate-fade-in{animation:fade-in .2s ease-out}
    input,textarea,select,button{font-family:inherit}
    .progress-bar{transition:width 0.3s ease}
    .aspect-video iframe{position:absolute;top:0;left:0;width:100%;height:100%}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const{useState,useEffect,useRef,createContext,useContext,useCallback}=React;

    // ============ CONFIGURATION ============
    const SUPABASE_URL='https://ludepnnsvwvpfbdxweam.supabase.co';
    const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1ZGVwbm5zdnd2cGZiZHh3ZWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNjI4NjgsImV4cCI6MjA4NDYzODg2OH0.SYTPY5l4XwxOK19_p_Dlx3be29i_sxMQD3JLYgqjL2g';
    const APP_VERSION = '3.2.0';
    // =======================================

    const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
    });

    const ROLE_LABELS={super_admin:'Super Admin',center_admin:'Admin Centre',trainer:'Formateur',learner:'Apprenant'};
    const ROLE_COLORS={super_admin:'bg-red-500',center_admin:'bg-purple-500',trainer:'bg-green-500',learner:'bg-gray-500'};
    
    const PERMISSION_LABELS={
      manage_centers:'Gérer les centres',
      manage_users:'Gérer les utilisateurs',
      manage_videos:'Gérer les vidéos',
      manage_playlists:'Gérer les cours',
      manage_enrollments:'Gérer les inscriptions',
      view_analytics:'Voir les statistiques',
      export_reports:'Exporter les rapports',
      manage_permissions:'Gérer les permissions'
    };

    // Auth Context
    const AuthContext=createContext(null);
    function AuthProvider({children}){
      const[user,setUser]=useState(null);
      const[profile,setProfile]=useState(null);
      const[center,setCenter]=useState(null);
      const[permissions,setPermissions]=useState({});
      const[loading,setLoading]=useState(true);

      const loadProfile=useCallback(async(userId)=>{
        try{
          const{data,error:err}=await supabase.from('profiles').select('*,centers(*)').eq('id',userId).single();
          if(err)throw err;
          setProfile(data);
          setCenter(data?.centers);
          // Charger les permissions du rôle
          const{data:perms}=await supabase.from('role_permissions').select('permissions').eq('role',data?.role).single();
          setPermissions(perms?.permissions||{});
          return data;
        }catch(e){console.error('Erreur:',e);return null;}
      },[]);

      useEffect(()=>{
        let mounted=true;
        const init=async()=>{
          try{
            const{data:{session}}=await supabase.auth.getSession();
            if(mounted&&session?.user){setUser(session.user);await loadProfile(session.user.id);}
          }catch(e){console.error(e);}
          finally{if(mounted)setLoading(false);}
        };
        init();
        const{data:{subscription}}=supabase.auth.onAuthStateChange(async(event,session)=>{
          if(!mounted)return;
          if(event==='SIGNED_IN'&&session?.user){setUser(session.user);await loadProfile(session.user.id);}
          else if(event==='SIGNED_OUT'){setUser(null);setProfile(null);setCenter(null);setPermissions({});}
        });
        return()=>{mounted=false;subscription.unsubscribe();};
      },[loadProfile]);

      const signIn=async(email,password)=>{
        try{const{error:err}=await supabase.auth.signInWithPassword({email,password});if(err)throw err;return{success:true};}
        catch(e){return{success:false,error:e.message};}
      };
      const signOut=async()=>{await supabase.auth.signOut();};

      const can=(perm)=>permissions[perm]===true;
      const value={user,profile,center,loading,signIn,signOut,isAuth:!!user,isSuperAdmin:profile?.role==='super_admin',role:profile?.role||'learner',can,permissions,reload:async()=>{if(user)await loadProfile(user.id);}};
      return<AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
    }
    const useAuth=()=>useContext(AuthContext);

    // Icon
    const Icon=({name,size=20,className=''})=>{
      const ref=useRef(null);
      useEffect(()=>{if(ref.current&&lucide.icons[name]){ref.current.innerHTML='';const i=lucide.createElement(lucide.icons[name]);i.setAttribute('width',size);i.setAttribute('height',size);ref.current.appendChild(i);}},[name,size]);
      return<span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{width:size,height:size}}/>;
    };

    // UI Components
    const Button=({children,variant='primary',size='md',icon,loading,disabled,className='',...props})=>{
      const v={primary:'bg-indigo-600 hover:bg-indigo-700',secondary:'bg-gray-700 hover:bg-gray-600',ghost:'hover:bg-gray-700',success:'bg-green-600 hover:bg-green-700',danger:'bg-red-600 hover:bg-red-700'};
      const s={sm:'px-3 py-1.5 text-sm',md:'px-4 py-2',lg:'px-6 py-3'};
      return<button className={`inline-flex items-center justify-center gap-2 rounded-lg font-medium text-white transition disabled:opacity-50 ${v[variant]} ${s[size]} ${className}`} disabled={disabled||loading} {...props}>{loading?<Icon name="Loader2" size={16} className="animate-spin"/>:icon&&<Icon name={icon} size={16}/>}{children}</button>;
    };
    const Input=({label,error,icon,className='',...props})=>(<div className={className}>{label&&<label className="block text-sm font-medium text-gray-300 mb-1">{label}</label>}<div className="relative">{icon&&<div className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><Icon name={icon} size={18}/></div>}<input className={`w-full px-4 py-2.5 bg-gray-700 border rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 ${icon?'pl-10':''} ${error?'border-red-500':'border-gray-600'}`} {...props}/></div>{error&&<p className="text-red-400 text-sm mt-1">{error}</p>}</div>);
    const Select=({label,options,className='',...props})=>(<div className={className}>{label&&<label className="block text-sm font-medium text-gray-300 mb-1">{label}</label>}<select className="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 rounded-lg text-white" {...props}>{options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select></div>);
    const Checkbox=({label,checked,onChange,className=''})=>(<label className={`flex items-center gap-3 cursor-pointer ${className}`}><input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)} className="w-5 h-5 rounded bg-gray-700 border-gray-600 text-indigo-600 focus:ring-indigo-500"/><span className="text-gray-300">{label}</span></label>);
    const Modal=({isOpen,onClose,title,children,size='md'})=>{if(!isOpen)return null;const s={sm:'max-w-md',md:'max-w-lg',lg:'max-w-2xl',xl:'max-w-4xl',full:'max-w-6xl'};return(<div className="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in"><div className="absolute inset-0 bg-black/70" onClick={onClose}/><div className={`relative bg-gray-800 rounded-xl w-full ${s[size]} max-h-[90vh] overflow-auto`}><div className="sticky top-0 bg-gray-800 p-4 border-b border-gray-700 flex items-center justify-between z-10"><h2 className="text-lg font-semibold">{title}</h2><button onClick={onClose} className="p-2 hover:bg-gray-700 rounded-lg"><Icon name="X" size={20}/></button></div><div className="p-4">{children}</div></div></div>);};
    const Card=({children,className='',...props})=><div className={`bg-gray-800 rounded-xl border border-gray-700 ${className}`} {...props}>{children}</div>;
    const RoleBadge=({role})=><span className={`inline-flex px-2 py-1 rounded-full text-xs font-medium ${ROLE_COLORS[role]||'bg-gray-500'} text-white`}>{ROLE_LABELS[role]||role}</span>;
    const Loading=({text})=><div className="flex flex-col items-center justify-center p-8"><div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"/>{text&&<p className="text-gray-400 mt-4">{text}</p>}</div>;
    const Empty=({icon,title,desc,action})=><div className="flex flex-col items-center justify-center p-8 text-center"><div className="text-gray-500 mb-4"><Icon name={icon} size={48}/></div><h3 className="text-lg font-medium text-gray-300">{title}</h3>{desc&&<p className="text-gray-500 mt-1">{desc}</p>}{action&&<div className="mt-4">{action}</div>}</div>;
    const Alert=({type='info',children})=>{const colors={info:'bg-blue-500/20 text-blue-300',success:'bg-green-500/20 text-green-300',warning:'bg-yellow-500/20 text-yellow-300',error:'bg-red-500/20 text-red-300'};return<div className={`p-4 rounded-lg ${colors[type]}`}>{children}</div>;};
    const ProgressBar=({percent,size='md',showLabel=true})=>{const h={sm:'h-2',md:'h-3',lg:'h-4'};return<div className="w-full"><div className={`w-full bg-gray-700 rounded-full ${h[size]}`}><div className={`bg-indigo-600 rounded-full ${h[size]} progress-bar`} style={{width:`${Math.min(100,Math.max(0,percent))}%`}}/></div>{showLabel&&<p className="text-sm text-gray-400 mt-1">{Math.round(percent)}% complété</p>}</div>;};

    // Login
    function LoginPage(){
      const{signIn}=useAuth();
      const[email,setEmail]=useState('');
      const[password,setPassword]=useState('');
      const[loading,setLoading]=useState(false);
      const[msg,setMsg]=useState(null);

      const handleSubmit=async e=>{
        e.preventDefault();setLoading(true);setMsg(null);
        const r=await signIn(email,password);
        if(!r.success)setMsg({type:'error',text:r.error});
        setLoading(false);
      };

      return(<div className="min-h-screen bg-gray-900 flex items-center justify-center p-4"><div className="w-full max-w-md"><div className="text-center mb-8"><div className="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-2xl mb-4"><Icon name="GraduationCap" size={32} className="text-white"/></div><h1 className="text-2xl font-bold text-white">Course Builder Pro</h1><p className="text-gray-400 mt-1">Plateforme de formation vidéo</p></div><Card className="p-6">{msg&&<Alert type={msg.type}>{msg.text}</Alert>}<form onSubmit={handleSubmit} className="space-y-4 mt-4"><Input label="Email" type="email" icon="Mail" value={email} onChange={e=>setEmail(e.target.value)} required/><Input label="Mot de passe" type="password" icon="Lock" value={password} onChange={e=>setPassword(e.target.value)} required/><Button type="submit" className="w-full" loading={loading}>Se connecter</Button></form></Card><p className="text-center text-gray-500 text-xs mt-4">v{APP_VERSION}</p></div></div>);
    }

    // Layout
    function AppLayout(){
      const{profile,signOut,center,can,isSuperAdmin}=useAuth();
      const[sidebarOpen,setSidebarOpen]=useState(window.innerWidth>=1024);
      const[page,setPage]=useState('dashboard');
      const isMobile=window.innerWidth<1024;
      
      const menu=[
        {id:'dashboard',label:'Tableau de bord',icon:'LayoutDashboard',show:true},
        {id:'analytics',label:'Statistiques',icon:'BarChart3',show:can('view_analytics')},
        {id:'centers',label:'Centres',icon:'Building2',show:can('manage_centers')},
        {id:'users',label:'Utilisateurs',icon:'Users',show:can('manage_users')},
        {id:'videos',label:'Bibliothèque',icon:'Film',show:can('manage_videos')},
        {id:'playlists',label:'Cours',icon:'BookOpen',show:can('manage_playlists')||profile?.role==='trainer'},
        {id:'enrollments',label:'Inscriptions',icon:'UserPlus',show:can('manage_enrollments')},
        {id:'permissions',label:'Permissions',icon:'Shield',show:can('manage_permissions')},
        {id:'my-courses',label:'Mes cours',icon:'GraduationCap',show:profile?.role==='learner'},
      ].filter(i=>i.show);

      return(<div className="min-h-screen bg-gray-900 text-white flex">
        <aside className={`fixed lg:static inset-y-0 left-0 z-40 w-64 bg-gray-800 border-r border-gray-700 transform transition-transform ${sidebarOpen?'translate-x-0':'-translate-x-full lg:translate-x-0'}`}>
          <div className="h-full flex flex-col">
            <div className="p-4 border-b border-gray-700"><div className="flex items-center gap-3"><div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center"><Icon name="GraduationCap" size={24}/></div><div className="flex-1 min-w-0"><h1 className="font-bold truncate">Course Builder</h1>{center&&<p className="text-xs text-gray-400 truncate">{center.name}</p>}</div></div></div>
            <nav className="flex-1 overflow-y-auto p-3 space-y-1">{menu.map(item=>(<button key={item.id} onClick={()=>{setPage(item.id);if(isMobile)setSidebarOpen(false);}} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left transition ${page===item.id?'bg-indigo-600':'text-gray-300 hover:bg-gray-700'}`}><Icon name={item.icon} size={20}/><span>{item.label}</span></button>))}</nav>
            <div className="p-4 border-t border-gray-700"><div className="flex items-center gap-3 mb-3"><div className="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center"><Icon name="User" size={20}/></div><div className="flex-1 min-w-0"><p className="font-medium truncate">{profile?.first_name} {profile?.last_name}</p><RoleBadge role={profile?.role}/></div></div><Button variant="ghost" className="w-full" icon="LogOut" onClick={signOut}>Déconnexion</Button></div>
          </div>
        </aside>
        {sidebarOpen&&isMobile&&<div className="fixed inset-0 bg-black/50 z-30" onClick={()=>setSidebarOpen(false)}/>}
        <main className="flex-1 min-h-screen">
          <header className="lg:hidden bg-gray-800 border-b border-gray-700 p-4 flex items-center gap-4"><button onClick={()=>setSidebarOpen(true)} className="p-2 hover:bg-gray-700 rounded-lg"><Icon name="Menu" size={24}/></button><h1 className="font-semibold">{menu.find(i=>i.id===page)?.label}</h1></header>
          <div className="p-4 lg:p-6">
            {page==='dashboard'&&<DashboardPage/>}
            {page==='analytics'&&<AnalyticsPage/>}
            {page==='centers'&&<CentersPage/>}
            {page==='users'&&<UsersPage/>}
            {page==='videos'&&<VideosPage/>}
            {page==='playlists'&&<PlaylistsPage/>}
            {page==='enrollments'&&<EnrollmentsPage/>}
            {page==='permissions'&&<PermissionsPage/>}
            {page==='my-courses'&&<MyCoursesPage/>}
          </div>
        </main>
      </div>);
    }

    // Dashboard
    function DashboardPage(){
      const{isSuperAdmin,can}=useAuth();
      const[stats,setStats]=useState({centers:0,users:0,videos:0,playlists:0,enrollments:0});
      const[loading,setLoading]=useState(true);

      useEffect(()=>{
        const load=async()=>{
          const queries=[
            supabase.from('profiles').select('*',{count:'exact',head:true}),
            supabase.from('videos').select('*',{count:'exact',head:true}),
            supabase.from('playlists').select('*',{count:'exact',head:true}),
            supabase.from('enrollments').select('*',{count:'exact',head:true})
          ];
          const[{count:users},{count:videos},{count:playlists},{count:enrollments}]=await Promise.all(queries);
          let centers=1;
          if(isSuperAdmin){const{count}=await supabase.from('centers').select('*',{count:'exact',head:true});centers=count||0;}
          setStats({centers,users:users||0,videos:videos||0,playlists:playlists||0,enrollments:enrollments||0});
          setLoading(false);
        };
        load();
      },[isSuperAdmin]);

      if(loading)return<Loading text="Chargement..."/>;
      const cards=[];
      if(can('manage_centers'))cards.push({label:'Centres',value:stats.centers,icon:'Building2',color:'text-red-400'});
      if(can('manage_users'))cards.push({label:'Utilisateurs',value:stats.users,icon:'Users',color:'text-blue-400'});
      if(can('manage_videos'))cards.push({label:'Vidéos',value:stats.videos,icon:'Film',color:'text-purple-400'});
      if(can('manage_playlists'))cards.push({label:'Cours',value:stats.playlists,icon:'BookOpen',color:'text-green-400'});
      if(can('manage_enrollments'))cards.push({label:'Inscriptions',value:stats.enrollments,icon:'UserPlus',color:'text-yellow-400'});
      
      return<div><h1 className="text-2xl font-bold mb-6">Tableau de bord</h1><div className="grid grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-4">{cards.map(c=><Card key={c.label} className="p-4"><div className="flex items-center gap-3"><div className={c.color}><Icon name={c.icon} size={24}/></div><div><p className="text-gray-400 text-sm">{c.label}</p><p className="text-2xl font-bold">{c.value}</p></div></div></Card>)}</div></div>;
    }

    // Analytics Page
    function AnalyticsPage(){
      const{can,center,isSuperAdmin}=useAuth();
      const[data,setData]=useState({enrollments:[],courses:[],summary:{}});
      const[loading,setLoading]=useState(true);
      const[filter,setFilter]=useState({course:'all',period:'all'});
      const progressChartRef=useRef(null);
      const statusChartRef=useRef(null);
      const courseChartRef=useRef(null);
      const chartsRef=useRef({});

      const load=useCallback(async()=>{
        // Charger les inscriptions avec détails
        let q=supabase.from('enrollments').select(`
          *,
          playlists:playlist_id(id,title),
          profiles:learner_id(id,first_name,last_name,email)
        `);
        if(!isSuperAdmin&&center?.id){
          q=q.eq('playlists.center_id',center.id);
        }
        const{data:enrollments}=await q;
        
        // Charger les cours
        let qc=supabase.from('playlists').select('id,title,is_published');
        if(!isSuperAdmin&&center?.id)qc=qc.eq('center_id',center.id);
        const{data:courses}=await qc;

        // Calculer les statistiques
        const validEnrollments=(enrollments||[]).filter(e=>e.playlists&&e.profiles);
        const summary={
          total:validEnrollments.length,
          notStarted:validEnrollments.filter(e=>e.status==='not_started').length,
          inProgress:validEnrollments.filter(e=>e.status==='in_progress').length,
          completed:validEnrollments.filter(e=>e.status==='completed').length,
          avgProgress:validEnrollments.length?Math.round(validEnrollments.reduce((a,e)=>a+(e.progress_percent||0),0)/validEnrollments.length):0
        };

        setData({enrollments:validEnrollments,courses:courses||[],summary});
        setLoading(false);
      },[isSuperAdmin,center?.id]);

      useEffect(()=>{load();},[load]);

      // Créer les graphiques
      useEffect(()=>{
        if(loading||!data.enrollments.length)return;

        // Détruire les anciens graphiques
        Object.values(chartsRef.current).forEach(chart=>chart?.destroy());
        chartsRef.current={};

        // Graphique de statut (Doughnut)
        if(statusChartRef.current){
          const ctx=statusChartRef.current.getContext('2d');
          chartsRef.current.status=new Chart(ctx,{
            type:'doughnut',
            data:{
              labels:['Non commencé','En cours','Terminé'],
              datasets:[{
                data:[data.summary.notStarted,data.summary.inProgress,data.summary.completed],
                backgroundColor:['#6b7280','#eab308','#22c55e'],
                borderWidth:0
              }]
            },
            options:{
              responsive:true,
              maintainAspectRatio:false,
              plugins:{legend:{position:'bottom',labels:{color:'#9ca3af'}}}
            }
          });
        }

        // Graphique par cours (Bar)
        if(courseChartRef.current){
          const courseStats=data.courses.map(c=>{
            const courseEnrollments=data.enrollments.filter(e=>e.playlist_id===c.id);
            return{
              title:c.title,
              count:courseEnrollments.length,
              avgProgress:courseEnrollments.length?Math.round(courseEnrollments.reduce((a,e)=>a+(e.progress_percent||0),0)/courseEnrollments.length):0
            };
          });
          
          const ctx=courseChartRef.current.getContext('2d');
          chartsRef.current.course=new Chart(ctx,{
            type:'bar',
            data:{
              labels:courseStats.map(c=>c.title.length>20?c.title.substring(0,20)+'...':c.title),
              datasets:[
                {label:'Inscrits',data:courseStats.map(c=>c.count),backgroundColor:'#6366f1'},
                {label:'Progression moy. %',data:courseStats.map(c=>c.avgProgress),backgroundColor:'#22c55e'}
              ]
            },
            options:{
              responsive:true,
              maintainAspectRatio:false,
              scales:{
                x:{ticks:{color:'#9ca3af'},grid:{color:'#374151'}},
                y:{ticks:{color:'#9ca3af'},grid:{color:'#374151'}}
              },
              plugins:{legend:{labels:{color:'#9ca3af'}}}
            }
          });
        }

        // Graphique de progression (Line)
        if(progressChartRef.current){
          const ranges=['0-25%','26-50%','51-75%','76-100%'];
          const progressData=[
            data.enrollments.filter(e=>(e.progress_percent||0)<=25).length,
            data.enrollments.filter(e=>(e.progress_percent||0)>25&&(e.progress_percent||0)<=50).length,
            data.enrollments.filter(e=>(e.progress_percent||0)>50&&(e.progress_percent||0)<=75).length,
            data.enrollments.filter(e=>(e.progress_percent||0)>75).length
          ];
          
          const ctx=progressChartRef.current.getContext('2d');
          chartsRef.current.progress=new Chart(ctx,{
            type:'bar',
            data:{
              labels:ranges,
              datasets:[{label:'Nombre d\'apprenants',data:progressData,backgroundColor:'#8b5cf6'}]
            },
            options:{
              responsive:true,
              maintainAspectRatio:false,
              scales:{

              },

          <Card className="p-4"><div className="text-gray-400 text-sm">Non commencés</div><div className="text-2xl font-bold text-gray-500">{data.summary.notStarted}</div></Card>
          <Card className="p-4"><div className="text-gray-400 text-sm">En cours</div><div className="text-2xl font-bold text-yellow-500">{data.summary.inProgress}</div></Card>
          <Card className="p-4"><div className="text-gray-400 text-sm">Terminés</div><div className="text-2xl font-bold text-green-500">{data.summary.completed}</div></Card>
          <Card className="p-4"><div className="text-gray-400 text-sm">Progression moy.</div><div className="text-2xl font-bold text-indigo-500">{data.summary.avgProgress}%</div></Card>
        </div>

        {/* Graphiques */}
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
          <Card className="p-4">
            <h3 className="font-semibold mb-4">Répartition par statut</h3>
            <div className="h-64"><canvas ref={statusChartRef}/></div>
          </Card>
          <Card className="p-4 lg:col-span-2">
            <h3 className="font-semibold mb-4">Statistiques par cours</h3>
            <div className="h-64"><canvas ref={courseChartRef}/></div>
          </Card>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
          <Card className="p-4">
            <h3 className="font-semibold mb-4">Distribution des progressions</h3>
            <div className="h-64"><canvas ref={progressChartRef}/></div>
          </Card>
          <Card className="p-4">
            <h3 className="font-semibold mb-4">Taux de complétion</h3>
            <div className="h-64 flex items-center justify-center">
              <div className="text-center">
                <div className="text-6xl font-bold text-green-500">{data.summary.total?Math.round((data.summary.completed/data.summary.total)*100):0}%</div>
                <p className="text-gray-400 mt-2">{data.summary.completed} sur {data.summary.total} terminés</p>
              </div>
            </div>
          </Card>
        </div>

        {/* Tableau détaillé */}
        <Card>
          <div className="p-4 border-b border-gray-700">
            <h3 className="font-semibold">Détail des inscriptions ({filteredEnrollments.length})</h3>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead className="bg-gray-750">
                <tr>
                  <th className="text-left p-4 font-medium text-gray-400">Apprenant</th>
                  <th className="text-left p-4 font-medium text-gray-400">Cours</th>
                  <th className="text-left p-4 font-medium text-gray-400">Progression</th>
                  <th className="text-left p-4 font-medium text-gray-400">Statut</th>
                  <th className="text-left p-4 font-medium text-gray-400">Date</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-700">
                {filteredEnrollments.slice(0,20).map(e=>(
                  <tr key={e.id}>
                    <td className="p-4">
                      <p className="font-medium">{e.profiles?.first_name} {e.profiles?.last_name}</p>
                      <p className="text-sm text-gray-400">{e.profiles?.email}</p>
                    </td>
                    <td className="p-4">{e.playlists?.title}</td>
                    <td className="p-4"><ProgressBar percent={e.progress_percent||0} size="sm" showLabel={true}/></td>
                    <td className="p-4">
                      <span className={`px-2 py-1 rounded text-xs ${e.status==='completed'?'bg-green-500/20 text-green-400':e.status==='in_progress'?'bg-yellow-500/20 text-yellow-400':'bg-gray-500/20 text-gray-400'}`}>
                        {e.status==='not_started'?'Non commencé':e.status==='in_progress'?'En cours':'Terminé'}
                      </span>
                    </td>
                    <td className="p-4 text-gray-400">{new Date(e.created_at).toLocaleDateString('fr-FR')}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            {filteredEnrollments.length>20&&<p className="p-4 text-center text-gray-400">Affichage limité à 20 lignes. Exportez pour voir tout.</p>}
          </div>
        </Card>
      </div>;
    }

    // Users
    function UsersPage(){
      const{profile,center,isSuperAdmin,can}=useAuth();
      const[users,setUsers]=useState([]);
      const[centers,setCenters]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[importModal,setImportModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[search,setSearch]=useState('');
      const[form,setForm]=useState({email:'',first_name:'',last_name:'',role:'learner',center_id:''});
      const[saving,setSaving]=useState(false);
      const[importData,setImportData]=useState([]);
      const[importLoading,setImportLoading]=useState(false);
      const[importResult,setImportResult]=useState(null);
      const fileInputRef=useRef(null);

      const load=useCallback(async()=>{
        let q=supabase.from('profiles').select('*,centers(name)').order('created_at',{ascending:false});
        if(!isSuperAdmin&&center?.id)q=q.eq('center_id',center.id);
        const{data:u}=await q;setUsers(u||[]);
        if(isSuperAdmin){const{data:c}=await supabase.from('centers').select('id,name');setCenters(c||[]);}
        setLoading(false);
      },[isSuperAdmin,center?.id]);
      
      useEffect(()=>{load();},[load]);

      const handleSave=async()=>{
        if(!editing)return;
        setSaving(true);
        await supabase.from('profiles').update({first_name:form.first_name,last_name:form.last_name,role:form.role,center_id:form.center_id||null}).eq('id',editing.id);
        await load();setModal(false);setEditing(null);setSaving(false);
      };

      const handleFileSelect=async(e)=>{
        const file=e.target.files[0];if(!file)return;
        try{
          const data=await file.arrayBuffer();
          const workbook=XLSX.read(data);
          const sheet=workbook.Sheets[workbook.SheetNames[0]];
          const jsonData=XLSX.utils.sheet_to_json(sheet);
          const mapped=jsonData.map((row,i)=>{
            const role=String(row['Rôle']||row['Role']||row['role']||'learner').toLowerCase();
            const validRoles=['learner','trainer','center_admin'];
            return{
              _index:i+1,
              email:String(row['Email']||row['email']||'').toLowerCase().trim(),
              first_name:row['Prénom']||row['Prenom']||row['first_name']||'',
              last_name:row['Nom']||row['last_name']||'',
              role:validRoles.includes(role)?role:'learner',
              password:row['Mot de passe']||row['Password']||row['password']||'',
              center_name:row['Centre']||row['center']||'',
              _valid:!!(row['Email']||row['email'])&&!!(row['Prénom']||row['Prenom']||row['first_name'])&&!!(row['Nom']||row['last_name'])
            };
          });
          setImportData(mapped);setImportResult(null);
        }catch(err){alert('Erreur: '+err.message);}
        e.target.value='';
      };

      const handleImport=async()=>{
        const validData=importData.filter(d=>d._valid);
        if(!validData.length){alert('Aucune donnée valide');return;}
        
        setImportLoading(true);
        try{
          const usersToCreate=validData.map(item=>{
            let targetCenterId=center?.id;
            if(isSuperAdmin&&item.center_name){
              const found=centers.find(c=>c.name.toLowerCase()===item.center_name.toLowerCase());
              if(found)targetCenterId=found.id;
            }
            return{email:item.email,password:item.password||'',first_name:item.first_name,last_name:item.last_name,role:item.role,center_id:targetCenterId};
          });

          const{data:{session}}=await supabase.auth.getSession();
          const response=await fetch(`${SUPABASE_URL}/functions/v1/create-users`,{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token}`},
            body:JSON.stringify({users:usersToCreate})
          });

          const result=await response.json();
          
          if(result.success){
            setImportResult({created:result.created||0,updated:result.updated||0,errors:result.errors||0,results:result.results||[]});
            await load();
          }else{
            setImportResult({created:0,updated:0,errors:validData.length,errorMessage:result.error});
          }
        }catch(err){
          setImportResult({created:0,updated:0,errors:validData.length,errorMessage:err.message});
        }
        setImportLoading(false);
      };

      const downloadTemplate=()=>{
        const template=[{'Email':'paul@email.com','Prénom':'Paul','Nom':'Moreau','Rôle':'learner','Mot de passe':'','Centre':''}];
        const ws=XLSX.utils.json_to_sheet(template);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Utilisateurs');
        XLSX.writeFile(wb,'template_utilisateurs.xlsx');
      };

      const exportResults=()=>{
        if(!importResult?.results)return;
        const data=importResult.results.map(r=>({'Email':r.email,'Statut':r.status==='created'?'Créé':r.status==='updated'?'Mis à jour':'Erreur','Mot de passe':r.password||'','Message':r.message||''}));
        const ws=XLSX.utils.json_to_sheet(data);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Résultats');
        XLSX.writeFile(wb,'resultat_import.xlsx');
      };

      const filtered=users.filter(u=>{if(!search)return true;const s=search.toLowerCase();return u.email?.toLowerCase().includes(s)||u.first_name?.toLowerCase().includes(s)||u.last_name?.toLowerCase().includes(s);});

      if(!can('manage_users'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4"><h1 className="text-2xl font-bold">Utilisateurs</h1><Button variant="secondary" icon="Upload" onClick={()=>setImportModal(true)}>Importer</Button></div>
        <Card className="p-4 mb-6"><Input icon="Search" placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)}/></Card>
        <Card><div className="overflow-x-auto"><table className="w-full"><thead className="bg-gray-750"><tr><th className="text-left p-4 font-medium text-gray-400">Utilisateur</th><th className="text-left p-4 font-medium text-gray-400">Rôle</th>{isSuperAdmin&&<th className="text-left p-4 font-medium text-gray-400">Centre</th>}<th className="text-right p-4"></th></tr></thead><tbody className="divide-y divide-gray-700">{filtered.map(u=><tr key={u.id} className="hover:bg-gray-750/50"><td className="p-4"><div className="flex items-center gap-3"><div className="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center"><Icon name="User" size={18}/></div><div><p className="font-medium">{u.first_name} {u.last_name}</p><p className="text-sm text-gray-400">{u.email}</p></div></div></td><td className="p-4"><RoleBadge role={u.role}/></td>{isSuperAdmin&&<td className="p-4 text-gray-400">{u.centers?.name||'-'}</td>}<td className="p-4 text-right"><Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(u);setForm({email:u.email,first_name:u.first_name||'',last_name:u.last_name||'',role:u.role,center_id:u.center_id||''});setModal(true);}}/></td></tr>)}</tbody></table></div></Card>
        
        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title="Modifier"><div className="space-y-4"><Input label="Email" value={form.email} disabled/><div className="grid grid-cols-2 gap-4"><Input label="Prénom" value={form.first_name} onChange={e=>setForm({...form,first_name:e.target.value})}/><Input label="Nom" value={form.last_name} onChange={e=>setForm({...form,last_name:e.target.value})}/></div><Select label="Rôle" value={form.role} onChange={e=>setForm({...form,role:e.target.value})} options={Object.entries(ROLE_LABELS).filter(([r])=>isSuperAdmin||r!=='super_admin').map(([v,l])=>({value:v,label:l}))}/>{isSuperAdmin&&<Select label="Centre" value={form.center_id} onChange={e=>setForm({...form,center_id:e.target.value})} options={[{value:'',label:'Aucun'},...centers.map(c=>({value:c.id,label:c.name}))]}/>}<div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button><Button onClick={handleSave} loading={saving}>Enregistrer</Button></div></div></Modal>

        <Modal isOpen={importModal} onClose={()=>{setImportModal(false);setImportData([]);setImportResult(null);}} title="Importer des utilisateurs" size="lg">
          <div className="space-y-4">
            <Alert type="info"><p className="font-medium mb-1">✨ Import automatique</p><p className="text-sm">Crée les comptes et assigne les rôles.</p></Alert>
            <div className="bg-gray-700/50 rounded-lg p-4"><p className="text-sm text-gray-400 mb-2">Colonnes : Email*, Prénom*, Nom*, Rôle, Mot de passe, Centre</p><Button variant="ghost" size="sm" icon="Download" onClick={downloadTemplate}>Télécharger le template</Button></div>
            <div className="border-2 border-dashed border-gray-600 rounded-lg p-8 text-center"><input type="file" ref={fileInputRef} onChange={handleFileSelect} accept=".xlsx,.xls,.csv" className="hidden"/><Icon name="Users" size={48} className="mx-auto text-gray-500 mb-4"/><p className="text-gray-400 mb-4">Glissez un fichier Excel ou</p><Button variant="secondary" onClick={()=>fileInputRef.current?.click()}>Parcourir</Button></div>
            {importData.length>0&&!importResult&&(<div><h3 className="font-medium mb-2">Aperçu ({importData.filter(d=>d._valid).length} valides)</h3><div className="max-h-48 overflow-y-auto bg-gray-700/50 rounded-lg"><table className="w-full text-sm"><thead className="bg-gray-700 sticky top-0"><tr><th className="p-2 text-left">Email</th><th className="p-2 text-left">Nom</th><th className="p-2 text-left">Rôle</th></tr></thead><tbody>{importData.filter(d=>d._valid).map((row,i)=>(<tr key={i}><td className="p-2">{row.email}</td><td className="p-2">{row.first_name} {row.last_name}</td><td className="p-2"><RoleBadge role={row.role}/></td></tr>))}</tbody></table></div></div>)}
            {importResult&&(<div className="space-y-3">{importResult.errorMessage?(<Alert type="error"><p className="font-medium">❌ Erreur : {importResult.errorMessage}</p></Alert>):(<Alert type={importResult.errors>0?'warning':'success'}><p className="font-medium">{importResult.created>0&&<span className="text-green-400">✅ {importResult.created} créé(s) </span>}{importResult.updated>0&&<span className="text-blue-400">🔄 {importResult.updated} mis à jour </span>}{importResult.errors>0&&<span className="text-yellow-400">⚠️ {importResult.errors} erreur(s)</span>}</p></Alert>)}{importResult.results?.some(r=>r.password)&&(<div className="bg-indigo-500/20 p-4 rounded-lg"><p className="text-sm text-indigo-300 mb-2">⚠️ Des mots de passe ont été générés.</p><Button variant="secondary" size="sm" icon="Download" onClick={exportResults}>Exporter les résultats</Button></div>)}</div>)}
            <div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>{setImportModal(false);setImportData([]);setImportResult(null);}}>Fermer</Button>{importData.length>0&&!importResult&&(<Button icon="Upload" onClick={handleImport} loading={importLoading} disabled={importData.filter(d=>d._valid).length===0}>Importer {importData.filter(d=>d._valid).length} utilisateur(s)</Button>)}</div>
          </div>
        </Modal>
      </div>;
    }

      const[importResult,setImportResult]=useState(null);
      const[attachments,setAttachments]=useState([]);
      const[chapters,setChapters]=useState([]);
      const[newAttachment,setNewAttachment]=useState({title:'',file_url:''});

        const vimeoId=vimeoMatch?vimeoMatch[1]:form.vimeo_id;
        const tagsArray=form.tags?form.tags.split(',').map(t=>t.trim()).filter(t=>t):null;
