                <Checkbox label="Mode révision" checked={quizForm.allow_review} onChange={v=>setQuizForm({...quizForm,allow_review:v})}/>
              </div>
              
              <div className="flex gap-2">
                <Button variant="secondary" onClick={()=>setQuizModal(false)}>Annuler</Button>
                <Button className="flex-1" onClick={saveQuiz} loading={saving}>Enregistrer</Button>
              </div>
            </div>
            
            {/* Droite : Questions */}
            <div className="space-y-4">
              <div className="flex items-center justify-between">
                <h4 className="font-medium">Questions ({quizQuestions.length})</h4>
                <Button size="sm" variant="secondary" icon="Shuffle" onClick={()=>setShowPickerModal(true)}>Pioche intelligente</Button>
              </div>
              
              {/* Questions du quiz (drag & drop) */}
              <div ref={sortableRef} className="space-y-1 max-h-36 overflow-y-auto p-2 bg-gray-700/30 rounded-lg min-h-[80px]">
                {quizQuestions.length===0?<p className="text-center text-gray-500 py-4 text-sm">Aucune question</p>:(
                  quizQuestions.map((q,i)=>(
                    <div key={q.id||i} className="flex items-center gap-2 p-2 bg-gray-700 rounded text-sm">
                      <Icon name="GripVertical" size={14} className="drag-handle cursor-move text-gray-500"/>
                      <span className="w-6 h-6 bg-indigo-500/20 text-indigo-400 rounded flex items-center justify-center text-xs">{i+1}</span>
                      <span className="flex-1 truncate">{q.question_text}</span>
                      <button onClick={()=>removeFromQuiz(i)} className="p-1 hover:bg-red-500/20 rounded"><Icon name="X" size={12} className="text-red-400"/></button>
                    </div>
                  ))
                )}
              </div>
              
              {/* Sélection depuis banque */}
              <div className="border-t border-gray-600 pt-3">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-sm font-medium">Banque de questions</span>
                  <Button size="sm" onClick={addQuestionsToQuiz} disabled={selectedQuestions.length===0}>Ajouter ({selectedQuestions.length})</Button>
                </div>
                <Input size="sm" icon="Search" placeholder="Rechercher..." className="mb-2"/>
                <div className="space-y-1 max-h-40 overflow-y-auto">
                  {bankQuestions.map(q=>{
                    const inQuiz=quizQuestions.some(qq=>qq.id===q.id||qq.bank_id===q.id);
                    return(
                      <label key={q.id} className={`flex items-center gap-2 p-1.5 rounded text-sm cursor-pointer ${inQuiz?'opacity-40':'hover:bg-gray-700'}`}>
                        <input type="checkbox" checked={selectedQuestions.includes(q.id)} onChange={e=>setSelectedQuestions(e.target.checked?[...selectedQuestions,q.id]:selectedQuestions.filter(id=>id!==q.id))} disabled={inQuiz} className="w-4 h-4"/>
                        <span className="flex-1 truncate">{q.question_text}</span>
                        {q.category_id&&<span className="text-xs text-indigo-400">{getCategoryName(q.category_id)}</span>}
                      </label>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        </Modal>
        
        {/* Modal Pioche intelligente */}
        <Modal isOpen={showPickerModal} onClose={()=>setShowPickerModal(false)} title="Pioche intelligente" size="md">
          <div className="space-y-4">
            <div>
              <label className="block text-sm font-medium mb-2">Mode de sélection</label>
              <div className="flex gap-2">
                <button onClick={()=>setPickerConfig({...pickerConfig,mode:'branch'})} className={`flex-1 p-3 rounded-lg border ${pickerConfig.mode==='branch'?'border-indigo-500 bg-indigo-500/20':'border-gray-600'}`}>
                  <Icon name="GitBranch" size={20} className="mx-auto mb-1"/>
                  <span className="text-sm">Par branche</span>
                </button>
                <button onClick={()=>setPickerConfig({...pickerConfig,mode:'balance'})} className={`flex-1 p-3 rounded-lg border ${pickerConfig.mode==='balance'?'border-indigo-500 bg-indigo-500/20':'border-gray-600'}`}>
                  <Icon name="Scale" size={20} className="mx-auto mb-1"/>
                  <span className="text-sm">Équilibré</span>
                </button>
              </div>
            </div>
            
            {pickerConfig.mode==='branch'&&(
              <div className="grid grid-cols-2 gap-3">
                <Select label="Catégorie" value={pickerConfig.categoryId} onChange={e=>setPickerConfig({...pickerConfig,categoryId:e.target.value,themeId:''})} options={[{value:'',label:'Toutes'},...categories.map(c=>({value:c.id,label:`${c.name} (${countQuestionsForCategory(c.id)})`}))]}/>
                <Select label="Thème" value={pickerConfig.themeId} onChange={e=>setPickerConfig({...pickerConfig,themeId:e.target.value})} options={[{value:'',label:'Tous'},...getThemesForCategory(pickerConfig.categoryId).map(t=>({value:t.id,label:`${t.name} (${countQuestionsForTheme(t.id)})`}))]} disabled={!pickerConfig.categoryId}/>
              </div>
            )}
            
            {pickerConfig.mode==='balance'&&(
              <p className="text-sm text-gray-400">Les questions seront réparties équitablement entre toutes les catégories.</p>
            )}
            
            <Input label="Nombre de questions" type="number" min="1" max="50" value={pickerConfig.count} onChange={e=>setPickerConfig({...pickerConfig,count:parseInt(e.target.value)||10})}/>
            
            <div className="flex gap-2">
              <Button variant="secondary" onClick={()=>setShowPickerModal(false)}>Annuler</Button>
              <Button className="flex-1" icon="Shuffle" onClick={executePicker}>Piocher</Button>
            </div>
          </div>
        </Modal>
        
        {/* Modal Prévisualisation */}
        <Modal isOpen={!!previewQuiz} onClose={()=>setPreviewQuiz(null)} title={`Test: ${previewQuiz?.title}`} size="xl">
          {previewQuiz&&(
            <div className="space-y-4">
              {previewSubmitted&&(
                <div className={`p-4 rounded-lg ${calcScore().pct>=previewQuiz.passing_score?'bg-green-500/20':'bg-red-500/20'}`}>
                  <p className="font-semibold">{calcScore().pct>=previewQuiz.passing_score?'✓ Réussi':'✗ Échoué'} - {calcScore().score}/{calcScore().total} pts ({calcScore().pct}%)</p>
                  <Button size="sm" variant="secondary" className="mt-2" onClick={()=>{setPreviewAnswers({});setPreviewSubmitted(false);}}>Recommencer</Button>
                </div>
              )}
              
              <div className="space-y-3 max-h-96 overflow-y-auto">
                {previewQuiz.questions.map((q,i)=>{
                  const correct=(q.quiz_answers||[]).filter(a=>a.is_correct).map(a=>a.id);
                  const ans=previewAnswers[q.id];
                  const isCorrect=previewSubmitted&&((q.question_type==='single'||q.question_type==='true_false')?correct.includes(ans):(ans||[]).length===correct.length&&correct.every(id=>(ans||[]).includes(id)));
                  
                  return(
                    <div key={q.id} className={`p-4 rounded-lg ${previewSubmitted?(isCorrect?'bg-green-500/10':'bg-red-500/10'):'bg-gray-700'}`}>
                      <div className="flex gap-2 mb-2">
                        <span className="px-2 py-1 bg-indigo-500/20 text-indigo-400 rounded text-sm font-medium">Q{i+1}</span>
                        <span className="flex-1 font-medium">{q.question_text}</span>
                      </div>
                      
                      {(q.question_type==='single'||q.question_type==='true_false')&&(
                        <div className="space-y-2 ml-8">
                          {(q.quiz_answers||[]).map(a=>(
                            <label key={a.id} className={`flex items-center gap-2 p-2 rounded cursor-pointer ${previewSubmitted?(a.is_correct?'bg-green-500/20':ans===a.id?'bg-red-500/20':''):(ans===a.id?'bg-indigo-500/20':'hover:bg-gray-600')}`}>
                              <input type="radio" checked={ans===a.id} onChange={()=>!previewSubmitted&&setPreviewAnswers({...previewAnswers,[q.id]:a.id})} disabled={previewSubmitted}/>
                              <span>{a.answer_text}</span>
                            </label>
                          ))}
                        </div>
                      )}
                      
                      {q.question_type==='multiple'&&(
                        <div className="space-y-2 ml-8">
                          {(q.quiz_answers||[]).map(a=>{
                            const sel=(ans||[]).includes(a.id);
                            return(
                              <label key={a.id} className={`flex items-center gap-2 p-2 rounded cursor-pointer ${previewSubmitted?(a.is_correct?'bg-green-500/20':sel?'bg-red-500/20':''):(sel?'bg-indigo-500/20':'hover:bg-gray-600')}`}>
                                <input type="checkbox" checked={sel} onChange={()=>!previewSubmitted&&setPreviewAnswers({...previewAnswers,[q.id]:sel?(ans||[]).filter(id=>id!==a.id):[...(ans||[]),a.id]})} disabled={previewSubmitted}/>
                                <span>{a.answer_text}</span>
                              </label>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              
              {!previewSubmitted?<Button className="w-full" onClick={()=>setPreviewSubmitted(true)}>Soumettre</Button>:<Button className="w-full" onClick={()=>setPreviewQuiz(null)}>Fermer</Button>}
            </div>
          )}
        </Modal>
      </div>;
    }

    function EnrollmentsPage(){
      const{center,isSuperAdmin,profile,can}=useAuth();
      const[enrollments,setEnrollments]=useState([]);
      const[playlists,setPlaylists]=useState([]);
      const[learners,setLearners]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[bulkModal,setBulkModal]=useState(false);
      const[form,setForm]=useState({playlist_id:'',learner_id:''});
      const[bulkForm,setBulkForm]=useState({playlist_id:'',selectedLearners:[]});
      const[saving,setSaving]=useState(false);
      const[licenseInfo,setLicenseInfo]=useState({hasLicense:true,licensedCourses:[],hasFullCatalog:false,maxLearners:null,usedLearners:0,expiringSoon:false,daysRemaining:null});

      const load=useCallback(async()=>{
        // Charger les licences du centre
        let licInfo={hasLicense:true,licensedCourses:[],hasFullCatalog:false,maxLearners:null,usedLearners:0,expiringSoon:false,daysRemaining:null};
        if(!isSuperAdmin&&center?.id){
          try{
            const today=new Date().toISOString().split('T')[0];
            const{data:licenses}=await supabase.from('center_licenses').select('*,content_packs(pack_type)').eq('center_id',center.id).eq('status','active').lte('start_date',today).gte('end_date',today);
            
            if(!licenses||licenses.length===0){
              licInfo.hasLicense=false;
            }else{
              licInfo.hasFullCatalog=licenses.some(l=>l.license_type==='full_catalog'||l.content_packs?.pack_type==='full_catalog');
              
              // Calculer le max d'apprenants (prendre le plus restrictif si plusieurs licences)
              const maxes=licenses.filter(l=>l.max_learners).map(l=>l.max_learners);
              if(maxes.length>0)licInfo.maxLearners=Math.min(...maxes);
              
              // Compter les apprenants déjà inscrits à des contenus sous licence
              const{data:enrolledLearners}=await supabase.from('enrollments').select('learner_id').eq('center_id',center.id);
              const uniqueLearners=new Set((enrolledLearners||[]).map(e=>e.learner_id));
              licInfo.usedLearners=uniqueLearners.size;
              
              // Vérifier expiration proche
              const nearestEnd=licenses.reduce((min,l)=>l.end_date<min?l.end_date:min,licenses[0].end_date);
              const daysLeft=Math.ceil((new Date(nearestEnd)-new Date())/(1000*60*60*24));
              licInfo.daysRemaining=daysLeft;
              if(daysLeft<=30)licInfo.expiringSoon=true;
              
              // Cours sous licence
              if(!licInfo.hasFullCatalog){
                const packIds=licenses.map(l=>l.pack_id).filter(Boolean);
                if(packIds.length>0){
                  const{data:items}=await supabase.from('content_pack_items').select('content_type,content_id').in('pack_id',packIds);
                  (items||[]).forEach(i=>{if(i.content_type==='course')licInfo.licensedCourses.push(i.content_id);});
                }
              }
            }
          }catch(e){console.log('Erreur licences:',e);}
        }
        setLicenseInfo(licInfo);
        
        // Charger les playlists et apprenants filtrés par centre
        let qp=supabase.from('playlists').select('id,title,is_published,center_id,is_lms_content').order('title');
        let ql=supabase.from('profiles').select('id,first_name,last_name,email,center_id').eq('role','learner');
        if(!isSuperAdmin&&center?.id){
          qp=qp.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
          ql=ql.eq('center_id',center.id);
        }
        const[{data:p},{data:l}]=await Promise.all([qp,ql]);
        setPlaylists(p||[]);
        setLearners(l||[]);
        
        // Charger les inscriptions - filtrer par les playlists ET apprenants du centre
        const playlistIds=(p||[]).map(pl=>pl.id);
        const learnerIds=(l||[]).map(le=>le.id);
        
        let enrollmentsQuery=supabase.from('enrollments')
          .select('*,playlists:playlist_id(title,center_id,is_lms_content),profiles:learner_id(first_name,last_name,email,center_id)')
          .order('created_at',{ascending:false});
        
        const{data:e}=await enrollmentsQuery;
        
        // Si pas super admin, filtrer par les playlists et apprenants du centre
        if(!isSuperAdmin&&center?.id){
          const filtered=(e||[]).filter(enr=>
            playlistIds.includes(enr.playlist_id)&&learnerIds.includes(enr.learner_id)
          );
          setEnrollments(filtered);
        }else{
          setEnrollments(e||[]);
        }
        
        setLoading(false);
      },[isSuperAdmin,center?.id]);
      useEffect(()=>{load();},[load]);
      
      // Vérifier si on peut inscrire à un cours
      const canEnrollToCourse=(playlistId)=>{
        if(isSuperAdmin)return{allowed:true};
        const playlist=playlists.find(p=>p.id===playlistId);
        if(!playlist)return{allowed:false,reason:'Cours introuvable'};
        
        // Cours du centre = toujours OK
        if(!playlist.is_lms_content)return{allowed:true};
        
        // Cours LMS = vérifier licence
        if(!licenseInfo.hasLicense)return{allowed:false,reason:'Aucune licence active'};
        if(!licenseInfo.hasFullCatalog&&!licenseInfo.licensedCourses.includes(playlistId)){
          return{allowed:false,reason:'Cours non inclus dans votre licence'};
        }
        
        // Vérifier quota
        if(licenseInfo.maxLearners&&licenseInfo.usedLearners>=licenseInfo.maxLearners){
          return{allowed:false,reason:`Quota atteint (${licenseInfo.usedLearners}/${licenseInfo.maxLearners} apprenants)`};
        }
        
        return{allowed:true};
      };

      const handleEnroll=async()=>{
        const check=canEnrollToCourse(form.playlist_id);
        if(!check.allowed){alert(check.reason);return;}
        setSaving(true);
        await supabase.from('enrollments').insert({playlist_id:form.playlist_id,learner_id:form.learner_id,enrolled_by:profile?.id});
        
        // Envoyer email de confirmation d'inscription
        const course=playlists.find(p=>p.id===form.playlist_id);
        const learner=learners.find(l=>l.id===form.learner_id);
        if(course&&learner){
          sendEmail({
            template_code:'enrollment_new',
            to_email:learner.email,
            to_user_id:learner.id,
            variables:{
              first_name:learner.first_name,
              course_title:course.title,
              course_description:course.description||'',
              center_name:center?.name||'CRPro'
            }
          });
        }
        
        await load();setModal(false);setForm({playlist_id:'',learner_id:''});setSaving(false);
      };
      
      const handleBulkEnroll=async()=>{
        const check=canEnrollToCourse(bulkForm.playlist_id);
        if(!check.allowed){alert(check.reason);return;}
        
        // Vérifier quota pour inscription en masse
        if(licenseInfo.maxLearners){
          const newTotal=licenseInfo.usedLearners+bulkForm.selectedLearners.length;
          if(newTotal>licenseInfo.maxLearners){
            alert(`Quota dépassé : vous ne pouvez inscrire que ${licenseInfo.maxLearners-licenseInfo.usedLearners} apprenants supplémentaires`);
            return;
          }
        }
        
        setSaving(true);
        const inserts=bulkForm.selectedLearners.map(learnerId=>({playlist_id:bulkForm.playlist_id,learner_id:learnerId,enrolled_by:profile?.id}));
        await supabase.from('enrollments').upsert(inserts,{onConflict:'playlist_id,learner_id'});
        await load();setBulkModal(false);setBulkForm({playlist_id:'',selectedLearners:[]});setSaving(false);
      };
      
      const handleUnenroll=async id=>{if(!confirm('Désinscrire ?'))return;await supabase.from('enrollments').delete().eq('id',id);load();};
      
      // Réinitialiser la progression d'un apprenant sur un cours (Super Admin uniquement)
      const resetEnrollmentProgress=async(enrollment)=>{
        const confirmMsg=`⚠️ RÉINITIALISER LA PROGRESSION ?\n\nApprenant: ${enrollment.profiles?.first_name} ${enrollment.profiles?.last_name}\nCours: ${enrollment.playlists?.title}\n\nCette action va :\n- Remettre la progression à 0%\n- Supprimer le temps passé\n- Supprimer les données SCORM\n- Supprimer les tentatives de quiz\n- Supprimer la progression vidéo\n\nCette action est irréversible.`;
        if(!confirm(confirmMsg))return;
        
        setSaving(true);
        try{
          // 1. Réinitialiser l'inscription
          await supabase.from('enrollments').update({
            progress_percent:0,
            status:'not_started',
            time_spent_seconds:0,
            completed_at:null,
            last_activity_at:null
          }).eq('id',enrollment.id);
          
          // 2. Supprimer les données SCORM associées
          try{
            await supabase.from('scorm_tracking').delete()
              .eq('learner_id',enrollment.learner_id)
              .eq('enrollment_id',enrollment.id);
          }catch(e){console.log('Pas de table scorm_tracking ou erreur:',e);}
          
          // 3. Supprimer les tentatives de quiz associées
          try{
            await supabase.from('quiz_attempts').delete()
              .eq('learner_id',enrollment.learner_id)
              .eq('enrollment_id',enrollment.id);
          }catch(e){console.log('Erreur quiz_attempts:',e);}
          
          // 4. Supprimer la progression vidéo associée
          try{
            await supabase.from('video_progress').delete()
              .eq('learner_id',enrollment.learner_id)
              .eq('enrollment_id',enrollment.id);
          }catch(e){console.log('Erreur video_progress:',e);}
          
          alert('✅ Progression réinitialisée avec succès');
          await load();
        }catch(err){
          console.error('Erreur réinitialisation:',err);
          alert('Erreur: '+err.message);
        }
        setSaving(false);
      };
      
      const toggleLearner=(learnerId)=>{
        setBulkForm(prev=>({
          ...prev,
          selectedLearners:prev.selectedLearners.includes(learnerId)?prev.selectedLearners.filter(id=>id!==learnerId):[...prev.selectedLearners,learnerId]
        }));
      };
      
      const selectAll=()=>{
        const enrolledIds=enrollments.filter(e=>e.playlist_id===bulkForm.playlist_id).map(e=>e.learner_id);
        const available=learners.filter(l=>!enrolledIds.includes(l.id));
        setBulkForm(prev=>({...prev,selectedLearners:available.map(l=>l.id)}));
      };
      
      // Filtrer les cours disponibles pour inscription
      const availableCourses=playlists.filter(p=>{
        if(isSuperAdmin)return true;
        if(!p.is_lms_content)return true; // Cours du centre
        if(licenseInfo.hasFullCatalog)return true;
        return licenseInfo.licensedCourses.includes(p.id);
      });

      if(!can('manage_enrollments'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;
      
      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4"><h1 className="text-2xl font-bold">Inscriptions</h1><div className="flex gap-2"><Button variant="secondary" icon="Users" onClick={()=>setBulkModal(true)}>Inscription en masse</Button><Button icon="UserPlus" onClick={()=>setModal(true)}>Inscrire</Button></div></div>
        
        {/* Alertes licence */}
        {!isSuperAdmin&&!licenseInfo.hasLicense&&(
          <Alert type="error" className="mb-4"><Icon name="AlertTriangle" size={16} className="inline mr-2"/>Aucune licence active. Vous ne pouvez inscrire qu'aux cours de votre centre.</Alert>
        )}
        {!isSuperAdmin&&licenseInfo.expiringSoon&&licenseInfo.daysRemaining!==null&&(
          <Alert type="warning" className="mb-4"><Icon name="Clock" size={16} className="inline mr-2"/>Licence expire dans {licenseInfo.daysRemaining} jours</Alert>
        )}
        {!isSuperAdmin&&licenseInfo.maxLearners&&(
          <Card className="p-4 mb-4 flex items-center justify-between">
            <div><span className="text-gray-400">Quota apprenants :</span><span className={`ml-2 font-bold ${licenseInfo.usedLearners>=licenseInfo.maxLearners?'text-red-400':'text-green-400'}`}>{licenseInfo.usedLearners} / {licenseInfo.maxLearners}</span></div>
            <ProgressBar percent={Math.round(licenseInfo.usedLearners/licenseInfo.maxLearners*100)} size="sm" className="w-32"/>
          </Card>
        )}
        
        {enrollments.length===0?<Empty icon="UserPlus" title="Aucune inscription"/>:<Card><div className="overflow-x-auto"><table className="w-full"><thead className="bg-gray-750"><tr><th className="text-left p-4 font-medium text-gray-400">Apprenant</th><th className="text-left p-4 font-medium text-gray-400">Cours</th><th className="text-left p-4 font-medium text-gray-400">Progression</th><th className="text-left p-4 font-medium text-gray-400">Temps</th><th className="text-left p-4 font-medium text-gray-400">Statut</th><th className="text-left p-4 font-medium text-gray-400">Date</th><th className="text-right p-4">Actions</th></tr></thead><tbody className="divide-y divide-gray-700">{enrollments.map(e=>{const formatT=(s)=>{if(!s)return'-';const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);return h>0?`${h}h ${m}min`:`${m}min`;};return<tr key={e.id}><td className="p-4"><p className="font-medium">{e.profiles?.first_name} {e.profiles?.last_name}</p><p className="text-sm text-gray-400">{e.profiles?.email}</p></td><td className="p-4"><div className="flex items-center gap-2">{e.playlists?.title||'—'}{e.playlists?.is_lms_content&&<span className="px-1.5 py-0.5 bg-indigo-600 rounded text-xs">LMS</span>}</div></td><td className="p-4"><ProgressBar percent={e.progress_percent||0} size="sm" showLabel={true}/></td><td className="p-4 text-blue-400">{formatT(e.time_spent_seconds)}</td><td className="p-4"><span className={`px-2 py-1 rounded text-xs ${e.status==='completed'?'bg-green-500/20 text-green-400':e.status==='in_progress'?'bg-yellow-500/20 text-yellow-400':'bg-gray-500/20 text-gray-400'}`}>{e.status==='not_started'?'Non commencé':e.status==='in_progress'?'En cours':'Terminé'}</span></td><td className="p-4 text-gray-400">{new Date(e.created_at).toLocaleDateString('fr-FR')}</td><td className="p-4 text-right"><div className="flex gap-1 justify-end">{isSuperAdmin&&(e.progress_percent>0||e.status!=='not_started')&&<Button variant="ghost" size="sm" icon="RotateCcw" title="Réinitialiser la progression" className="text-orange-400 hover:bg-orange-500/20" onClick={()=>resetEnrollmentProgress(e)} disabled={saving}/>}<Button variant="ghost" size="sm" icon="Trash2" title="Désinscrire" className="text-red-400 hover:bg-red-500/20" onClick={()=>handleUnenroll(e.id)}/></div></td></tr>})}</tbody></table></div></Card>}
        
        <Modal isOpen={modal} onClose={()=>setModal(false)} title="Inscrire"><div className="space-y-4"><Select label="Cours" value={form.playlist_id} onChange={e=>setForm({...form,playlist_id:e.target.value})} options={[{value:'',label:'Sélectionner...'},...availableCourses.map(p=>({value:p.id,label:`${p.title}${p.is_lms_content?' 📦':''}${p.is_published?'':' (brouillon)'}`}))]}/><Select label="Apprenant" value={form.learner_id} onChange={e=>setForm({...form,learner_id:e.target.value})} options={[{value:'',label:'Sélectionner...'},...learners.map(l=>({value:l.id,label:`${l.first_name} ${l.last_name}`}))]}/><div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button><Button onClick={handleEnroll} loading={saving} disabled={!form.playlist_id||!form.learner_id}>Inscrire</Button></div></div></Modal>
        
        <Modal isOpen={bulkModal} onClose={()=>setBulkModal(false)} title="Inscription en masse" size="lg">
          <div className="space-y-4">
            <Select label="Cours" value={bulkForm.playlist_id} onChange={e=>setBulkForm({...bulkForm,playlist_id:e.target.value,selectedLearners:[]})} options={[{value:'',label:'Sélectionner un cours...'},...availableCourses.map(p=>({value:p.id,label:`${p.title}${p.is_lms_content?' 📦':''}${p.is_published?'':' (brouillon)'}`}))]}/>
            
            {bulkForm.playlist_id&&(
              <div>
                <div className="flex items-center justify-between mb-3">
                  <h4 className="font-medium">Apprenants disponibles</h4>
                  <Button variant="ghost" size="sm" onClick={selectAll}>Tout sélectionner</Button>
                </div>
                <div className="max-h-64 overflow-y-auto bg-gray-700/50 rounded-lg p-2 space-y-1">
                  {learners.filter(l=>!enrollments.find(e=>e.playlist_id===bulkForm.playlist_id&&e.learner_id===l.id)).map(l=>(
                    <Checkbox key={l.id} label={`${l.first_name} ${l.last_name} (${l.email})`} checked={bulkForm.selectedLearners.includes(l.id)} onChange={()=>toggleLearner(l.id)}/>
                  ))}
                  {learners.filter(l=>!enrollments.find(e=>e.playlist_id===bulkForm.playlist_id&&e.learner_id===l.id)).length===0&&<p className="text-gray-500 text-sm text-center py-4">Tous les apprenants sont déjà inscrits</p>}
                </div>
                <p className="text-sm text-gray-400 mt-2">{bulkForm.selectedLearners.length} apprenant(s) sélectionné(s)</p>
              </div>
            )}
            
            <div className="flex justify-end gap-3">
              <Button variant="secondary" onClick={()=>setBulkModal(false)}>Annuler</Button>
              <Button onClick={handleBulkEnroll} loading={saving} disabled={!bulkForm.playlist_id||bulkForm.selectedLearners.length===0}>Inscrire {bulkForm.selectedLearners.length} apprenant(s)</Button>
            </div>
          </div>
        </Modal>
      </div>;
    }

    // ==================== CATALOGUE LMS (Super Admin) ====================
    // ==================== PAGE CATÉGORIES ====================
    function CategoriesPage(){
      const{can,isSuperAdmin}=useAuth();
      const[loading,setLoading]=useState(true);
      const[saving,setSaving]=useState(false);
      
      // Mode lecture seule pour non-super-admins
      const isReadOnly=!isSuperAdmin;
      
      // Données taxonomie
      const[categories,setCategories]=useState([]);
      const[themes,setThemes]=useState([]);
      const[subThemes,setSubThemes]=useState([]);
      
      // Tags prédéfinis
      const[predefinedTags,setPredefinedTags]=useState([]);
      
      // Stats contenus par catégorie
      const[contentStats,setContentStats]=useState({});
      
      // UI
      const[expandedCats,setExpandedCats]=useState({});
      const[expandedThemes,setExpandedThemes]=useState({});
      const[quickAddValue,setQuickAddValue]=useState('');
      const[editModal,setEditModal]=useState(null); // {type:'category'|'theme'|'subtheme', item:{...}}
      const[editForm,setEditForm]=useState({name:'',description:'',color:'#6366f1',tags:[]});
      const[tagInput,setTagInput]=useState('');
      
      // Recherche
      const[searchQuery,setSearchQuery]=useState('');
      const[searchResults,setSearchResults]=useState({categories:[],themes:[],subThemes:[]});
      
      // Modal gestion tags
      const[tagsModal,setTagsModal]=useState(false);
      const[newTagForm,setNewTagForm]=useState({name:'',color:'#6b7280',description:''});
      
      // Import Excel
      const[importModal,setImportModal]=useState(false);
      const[importData,setImportData]=useState(null);
      const[importPreview,setImportPreview]=useState([]);
      const[importing,setImporting]=useState(false);
      const[importStats,setImportStats]=useState(null);
      const[importMode,setImportMode]=useState('merge');
      const fileInputRef=useRef(null);
      
      // Chargement
      const load=useCallback(async()=>{
        try{
          const[{data:cats},{data:ths},{data:sths},{data:tags}]=await Promise.all([
            supabase.from('content_categories').select('*').order('position').order('name'),
            supabase.from('content_themes').select('*').order('position').order('name'),
            supabase.from('content_sub_themes').select('*').order('position').order('name'),
            supabase.from('content_tags').select('*').order('usage_count',{ascending:false}).order('name')
          ]);
          setCategories(cats||[]);
          setThemes(ths||[]);
          setSubThemes(sths||[]);
          setPredefinedTags(tags||[]);
          
          // Compter les contenus par catégorie
          const stats={};
          const[{data:vids},{data:scorm},{data:quiz},{data:cours},{data:paths}]=await Promise.all([
            supabase.from('videos').select('id,category_id'),
            supabase.from('scorm_modules').select('id,category_id'),
            supabase.from('quizzes').select('id,category_id'),
            supabase.from('playlists').select('id,category_id'),
            supabase.from('learning_paths').select('id,category_id')
          ]);
          
          const countByCat=(items)=>{
            const c={};
            (items||[]).forEach(i=>{if(i.category_id){c[i.category_id]=(c[i.category_id]||0)+1;}});
            return c;
          };
          
          stats.videos=countByCat(vids);
          stats.scorm=countByCat(scorm);
          stats.quizzes=countByCat(quiz);
          stats.courses=countByCat(cours);
          stats.paths=countByCat(paths);
          setContentStats(stats);
          
        }catch(e){console.error(e);}
        setLoading(false);
      },[]);
      
      useEffect(()=>{load();},[load]);
      
      // Helpers
      const getThemesForCategory=(catId)=>themes.filter(t=>t.category_id===catId);
      const getSubThemesForTheme=(themeId)=>subThemes.filter(st=>st.theme_id===themeId);
      
      const getContentCount=(catId)=>{
        return (contentStats.videos?.[catId]||0)+
               (contentStats.scorm?.[catId]||0)+
               (contentStats.quizzes?.[catId]||0)+
               (contentStats.courses?.[catId]||0)+
               (contentStats.paths?.[catId]||0);
      };
      
      // ============ RECHERCHE EN TEMPS RÉEL ============
      useEffect(()=>{
        if(!searchQuery.trim()){
          setSearchResults({categories:[],themes:[],subThemes:[]});
          return;
        }
        
        const q=searchQuery.toLowerCase().trim();
        const matchedCatIds=new Set();
        const matchedThemeIds=new Set();
        
        // Chercher dans les catégories
        const matchedCats=categories.filter(c=>{
          const nameMatch=c.name.toLowerCase().includes(q);
          const descMatch=(c.description||'').toLowerCase().includes(q);
          const tagsMatch=(c.tags||[]).some(t=>t.toLowerCase().includes(q));
          return nameMatch||descMatch||tagsMatch;
        });
        matchedCats.forEach(c=>matchedCatIds.add(c.id));
        
        // Chercher dans les thèmes
        const matchedThemes=themes.filter(t=>{
          const nameMatch=t.name.toLowerCase().includes(q);
          const descMatch=(t.description||'').toLowerCase().includes(q);
          const tagsMatch=(t.tags||[]).some(tag=>tag.toLowerCase().includes(q));
          return nameMatch||descMatch||tagsMatch;
        });
        matchedThemes.forEach(t=>{
          matchedThemeIds.add(t.id);
          matchedCatIds.add(t.category_id);
        });
        
        // Chercher dans les sous-thèmes
        const matchedSubThemes=subThemes.filter(st=>{
          const nameMatch=st.name.toLowerCase().includes(q);
          const descMatch=(st.description||'').toLowerCase().includes(q);
          const tagsMatch=(st.tags||[]).some(tag=>tag.toLowerCase().includes(q));
          return nameMatch||descMatch||tagsMatch;
        });
        matchedSubThemes.forEach(st=>{
          matchedThemeIds.add(st.theme_id);
          const theme=themes.find(t=>t.id===st.theme_id);
          if(theme)matchedCatIds.add(theme.category_id);
        });
        
        setSearchResults({
          categories:Array.from(matchedCatIds),
          themes:Array.from(matchedThemeIds),
          subThemes:matchedSubThemes.map(st=>st.id)
        });
        
        // Auto-expansion
        const newExpandedCats={};
        const newExpandedThemes={};
        matchedCatIds.forEach(id=>{newExpandedCats[id]=true;});
        matchedThemeIds.forEach(id=>{newExpandedThemes[id]=true;});
        setExpandedCats(prev=>({...prev,...newExpandedCats}));
        setExpandedThemes(prev=>({...prev,...newExpandedThemes}));
        
      },[searchQuery,categories,themes,subThemes]);
      
      const isHighlighted=(type,id)=>{
        if(!searchQuery.trim())return false;
        if(type==='category')return searchResults.categories.includes(id);
        if(type==='theme')return searchResults.themes.includes(id);
        if(type==='subtheme')return searchResults.subThemes.includes(id);
        return false;
      };
      
      const shouldShowCategory=(cat)=>{
        if(!searchQuery.trim())return true;
        return searchResults.categories.includes(cat.id);
      };
      
      const shouldShowTheme=(theme)=>{
        if(!searchQuery.trim())return true;
        return searchResults.themes.includes(theme.id);
      };
      
      // ============ CRUD CATÉGORIES ============
      const addCategory=async(name)=>{
        if(!name.trim())return;
        setSaving(true);
        await supabase.from('content_categories').insert({name:name.trim(),position:categories.length,color:'#6366f1',tags:[]});
        await load();
        setSaving(false);
      };
      
      const updateItem=async()=>{
        if(!editForm.name.trim()||!editModal)return;
        setSaving(true);
        
        const{type,item}=editModal;
        const updateData={name:editForm.name,description:editForm.description,tags:editForm.tags};
        
        if(type==='category'){
          updateData.color=editForm.color;
          await supabase.from('content_categories').update(updateData).eq('id',item.id);
        }else if(type==='theme'){
          await supabase.from('content_themes').update(updateData).eq('id',item.id);
        }else if(type==='subtheme'){
          await supabase.from('content_sub_themes').update(updateData).eq('id',item.id);
        }
        
        setEditModal(null);
        await load();
        setSaving(false);
      };
      
      const deleteCategory=async(id)=>{
        const count=getContentCount(id);
        if(count>0){
          if(!confirm(`Cette catégorie contient ${count} contenu(s). La supprimer retirera la catégorie de ces contenus. Continuer ?`))return;
        }else if(!confirm('Supprimer cette catégorie ?'))return;
        await supabase.from('content_categories').delete().eq('id',id);
        load();
      };
      
      // CRUD Thèmes
      const addTheme=async(name,categoryId)=>{
        if(!name.trim())return;
        setSaving(true);
        const catThemes=getThemesForCategory(categoryId);
        await supabase.from('content_themes').insert({name:name.trim(),category_id:categoryId,position:catThemes.length,tags:[]});
        await load();
        setSaving(false);
      };
      
      const deleteTheme=async(id)=>{
        if(!confirm('Supprimer ce thème et tous ses sous-thèmes ?'))return;
        await supabase.from('content_themes').delete().eq('id',id);
        load();
      };
      
      // CRUD Sous-thèmes
      const addSubTheme=async(name,themeId)=>{
        if(!name.trim())return;
        setSaving(true);
        const themeSubs=getSubThemesForTheme(themeId);
        await supabase.from('content_sub_themes').insert({name:name.trim(),theme_id:themeId,position:themeSubs.length,tags:[]});
        await load();
        setSaving(false);
      };
      
      const deleteSubTheme=async(id)=>{
        if(!confirm('Supprimer ce sous-thème ?'))return;
        await supabase.from('content_sub_themes').delete().eq('id',id);
        load();
      };
      
      // Ouvrir modal édition
      const openEditModal=(type,item)=>{
        setEditForm({
          name:item.name,
          description:item.description||'',
          color:item.color||'#6366f1',
          tags:item.tags||[]
        });
        setTagInput('');
        setEditModal({type,item});
      };
      
      // ============ GESTION TAGS ============
      const addTagToForm=(tagName)=>{
        if(!tagName.trim())return;
        const tag=tagName.trim();
        if(!editForm.tags.includes(tag)){
          setEditForm({...editForm,tags:[...editForm.tags,tag]});
        }
        setTagInput('');
      };
      
      const removeTagFromForm=(tagName)=>{
        setEditForm({...editForm,tags:editForm.tags.filter(t=>t!==tagName)});
      };
      
      const createPredefinedTag=async()=>{
        if(!newTagForm.name.trim())return;
        setSaving(true);
        await supabase.from('content_tags').insert({name:newTagForm.name.trim(),color:newTagForm.color,description:newTagForm.description});
        setNewTagForm({name:'',color:'#6b7280',description:''});
        await load();
        setSaving(false);
      };
      
      const deletePredefinedTag=async(id)=>{
        if(!confirm('Supprimer ce tag prédéfini ?'))return;
        await supabase.from('content_tags').delete().eq('id',id);
        load();
      };
      
      // ============ EXPORT EXCEL ============
      const exportToExcel=()=>{
        if(!window.XLSX){alert('Bibliothèque Excel non chargée.');return;}
        
        const rows=[];
        categories.forEach(cat=>{
          const catThemes=getThemesForCategory(cat.id);
          if(catThemes.length===0){
            rows.push({
              'Catégorie':cat.name,'Couleur':cat.color||'#6366f1','Description':cat.description||'',
              'Tags Catégorie':(cat.tags||[]).join(', '),'Thème':'','Tags Thème':'','Sous-thème':'','Tags Sous-thème':''
            });
          }else{
            catThemes.forEach(theme=>{
              const themeSubs=getSubThemesForTheme(theme.id);
              if(themeSubs.length===0){
                rows.push({
                  'Catégorie':cat.name,'Couleur':cat.color||'#6366f1','Description':cat.description||'',
                  'Tags Catégorie':(cat.tags||[]).join(', '),'Thème':theme.name,'Tags Thème':(theme.tags||[]).join(', '),'Sous-thème':'','Tags Sous-thème':''
                });
              }else{
                themeSubs.forEach(st=>{
                  rows.push({
                    'Catégorie':cat.name,'Couleur':cat.color||'#6366f1','Description':cat.description||'',
                    'Tags Catégorie':(cat.tags||[]).join(', '),'Thème':theme.name,'Tags Thème':(theme.tags||[]).join(', '),
                    'Sous-thème':st.name,'Tags Sous-thème':(st.tags||[]).join(', ')
                  });
                });
              }
            });
          }
        });
        
        if(rows.length===0)rows.push({'Catégorie':'','Couleur':'#6366f1','Description':'','Tags Catégorie':'','Thème':'','Tags Thème':'','Sous-thème':'','Tags Sous-thème':''});
        
        const ws=XLSX.utils.json_to_sheet(rows);
        ws['!cols']=[{wch:20},{wch:10},{wch:30},{wch:25},{wch:20},{wch:25},{wch:20},{wch:25}];
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Catégories');
        XLSX.writeFile(wb,`categories_export_${new Date().toISOString().split('T')[0]}.xlsx`);
      };
      
      // ============ TEMPLATE EXCEL ============
      const downloadTemplate=()=>{
        if(!window.XLSX){alert('Bibliothèque Excel non chargée.');return;}
        
        const examples=[
          {'Catégorie':'Sécurité routière','Couleur':'#ef4444','Description':'Règles de sécurité','Tags Catégorie':'Obligatoire, Examen','Thème':'Signalisation','Tags Thème':'Théorie','Sous-thème':'Panneaux de danger','Tags Sous-thème':'Débutant'},
          {'Catégorie':'Sécurité routière','Couleur':'#ef4444','Description':'Règles de sécurité','Tags Catégorie':'Obligatoire, Examen','Thème':'Signalisation','Tags Thème':'Théorie','Sous-thème':'Panneaux d\'obligation','Tags Sous-thème':'Débutant'},
          {'Catégorie':'Sécurité routière','Couleur':'#ef4444','Description':'Règles de sécurité','Tags Catégorie':'Obligatoire, Examen','Thème':'Priorités','Tags Thème':'Pratique','Sous-thème':'','Tags Sous-thème':''},
          {'Catégorie':'Code de la route','Couleur':'#3b82f6','Description':'Réglementation','Tags Catégorie':'Obligatoire','Thème':'Vitesse','Tags Thème':'Théorie, Examen','Sous-thème':'En agglomération','Tags Sous-thème':''},
          {'Catégorie':'Éco-conduite','Couleur':'#22c55e','Description':'Conduite économique','Tags Catégorie':'Optionnel, Nouveau','Thème':'','Tags Thème':'','Sous-thème':'','Tags Sous-thème':''},
        ];
        
        const ws=XLSX.utils.json_to_sheet(examples);
        ws['!cols']=[{wch:20},{wch:10},{wch:25},{wch:25},{wch:18},{wch:20},{wch:20},{wch:20}];
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Catégories');
        
        const instr=[
          ['INSTRUCTIONS D\'IMPORT - CRPro LMS'],[''],
          ['Colonnes obligatoires: Catégorie'],
          ['Colonnes optionnelles: Couleur, Description, Tags Catégorie, Thème, Tags Thème, Sous-thème, Tags Sous-thème'],[''],
          ['FORMAT DES TAGS:'],
          ['- Séparez les tags par des virgules: "Tag1, Tag2, Tag3"'],
          ['- Les tags peuvent être existants ou nouveaux (ils seront créés automatiquement)'],[''],
          ['COULEURS (format hexadécimal):'],
          ['Rouge: #ef4444','Orange: #f59e0b','Vert: #22c55e'],
          ['Bleu: #3b82f6','Indigo: #6366f1','Violet: #8b5cf6'],
        ];
        const wsInstr=XLSX.utils.aoa_to_sheet(instr);
        XLSX.utils.book_append_sheet(wb,wsInstr,'Instructions');
        
        XLSX.writeFile(wb,'template_categories_tags.xlsx');
      };
      
      // ============ IMPORT EXCEL ============
      const handleFileSelect=(e)=>{
        const file=e.target.files?.[0];
        if(!file||!window.XLSX)return;
        
        const reader=new FileReader();
        reader.onload=(evt)=>{
          try{
            const data=new Uint8Array(evt.target.result);
            const workbook=XLSX.read(data,{type:'array'});
            let sheetName=workbook.SheetNames.find(n=>n.toLowerCase().includes('catég')||n.toLowerCase().includes('categ'))||workbook.SheetNames[0];
            const json=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{defval:''});
            
            if(!json.length){alert('Fichier vide.');return;}
            
            // Normaliser
            const normalized=json.map(row=>{
              const n={};
              Object.keys(row).forEach(key=>{
                const k=key.toLowerCase().trim();
                if(k.includes('catégorie')||k==='categorie'||k==='category')n.category=String(row[key]).trim();
                else if(k==='couleur'||k==='color')n.color=String(row[key]).trim();
                else if(k==='description')n.description=String(row[key]).trim();
                else if(k==='tags catégorie'||k==='tags categorie'||k==='category tags')n.categoryTags=String(row[key]).trim();
                else if(k==='thème'||k==='theme')n.theme=String(row[key]).trim();
                else if(k==='tags thème'||k==='tags theme'||k==='theme tags')n.themeTags=String(row[key]).trim();
                else if(k.includes('sous-thème')||k.includes('sous_theme')||k==='subtheme')n.subTheme=String(row[key]).trim();
                else if(k.includes('tags sous')||k==='subtheme tags')n.subThemeTags=String(row[key]).trim();
              });
              return n;
            }).filter(r=>r.category);
            
            if(!normalized.length){alert('Aucune catégorie trouvée.');return;}
            
            // Construire structure
            const structure={};
            normalized.forEach(row=>{
              const catName=row.category;
              if(!structure[catName]){
                structure[catName]={
                  name:catName,
                  color:row.color?.startsWith('#')?row.color:'#6366f1',
                  description:row.description||'',
                  tags:row.categoryTags?row.categoryTags.split(',').map(t=>t.trim()).filter(Boolean):[],
                  themes:{}
                };
              }
              if(row.theme){
                if(!structure[catName].themes[row.theme]){
                  structure[catName].themes[row.theme]={
                    name:row.theme,
                    tags:row.themeTags?row.themeTags.split(',').map(t=>t.trim()).filter(Boolean):[],
                    subThemes:{}
                  };
                }
                if(row.subTheme){
                  if(!structure[catName].themes[row.theme].subThemes[row.subTheme]){
                    structure[catName].themes[row.theme].subThemes[row.subTheme]={
                      name:row.subTheme,
                      tags:row.subThemeTags?row.subThemeTags.split(',').map(t=>t.trim()).filter(Boolean):[]
                    };
                  }
                }
              }
            });
            
            const preview=Object.values(structure).map(cat=>({
              ...cat,
              themes:Object.values(cat.themes).map(th=>({
                ...th,
                subThemes:Object.values(th.subThemes)
              }))
            }));
            
            // Collecter tous les tags uniques
            const allTags=new Set();
            preview.forEach(c=>{
              (c.tags||[]).forEach(t=>allTags.add(t));
              c.themes.forEach(th=>{
                (th.tags||[]).forEach(t=>allTags.add(t));
                th.subThemes.forEach(st=>(st.tags||[]).forEach(t=>allTags.add(t)));
              });
            });
            
            setImportData(normalized);
            setImportPreview(preview);
            setImportStats({
              categories:preview.length,
              themes:preview.reduce((s,c)=>s+c.themes.length,0),
              subThemes:preview.reduce((s,c)=>s+c.themes.reduce((s2,t)=>s2+t.subThemes.length,0),0),
              tags:allTags.size
            });
            setImportModal(true);
            
          }catch(err){alert('Erreur: '+err.message);}
        };
        reader.readAsArrayBuffer(file);
        e.target.value='';
      };
      
      const executeImport=async()=>{
        if(!importPreview.length)return;
        setImporting(true);
        
        try{
          // Collecter et créer les tags manquants
          const allTags=new Set();
          importPreview.forEach(c=>{
            (c.tags||[]).forEach(t=>allTags.add(t));
            c.themes.forEach(th=>{
              (th.tags||[]).forEach(t=>allTags.add(t));
              th.subThemes.forEach(st=>(st.tags||[]).forEach(t=>allTags.add(t)));
            });
          });
          
          const existingTagNames=predefinedTags.map(t=>t.name.toLowerCase());
          const newTags=Array.from(allTags).filter(t=>!existingTagNames.includes(t.toLowerCase()));
          
          if(newTags.length>0){
            const colors=['#6b7280','#ef4444','#f59e0b','#22c55e','#3b82f6','#8b5cf6','#ec4899'];
            for(let i=0;i<newTags.length;i++){
              await supabase.from('content_tags').insert({name:newTags[i],color:colors[i%colors.length]}).select();
            }
          }
          
          if(importMode==='replace'){
            await supabase.from('content_sub_themes').delete().neq('id','00000000-0000-0000-0000-000000000000');
            await supabase.from('content_themes').delete().neq('id','00000000-0000-0000-0000-000000000000');
            await supabase.from('content_categories').delete().neq('id','00000000-0000-0000-0000-000000000000');
          }
          
          for(let i=0;i<importPreview.length;i++){
            const cat=importPreview[i];
            let categoryId;
            
            if(importMode==='merge'){
              const{data:existing}=await supabase.from('content_categories').select('id').eq('name',cat.name).single();
              if(existing){
                await supabase.from('content_categories').update({color:cat.color,description:cat.description,tags:cat.tags}).eq('id',existing.id);
                categoryId=existing.id;
              }else{
                const{data:newCat}=await supabase.from('content_categories').insert({name:cat.name,color:cat.color,description:cat.description,position:i,tags:cat.tags}).select().single();
                categoryId=newCat?.id;
              }
            }else{
              const{data:newCat}=await supabase.from('content_categories').insert({name:cat.name,color:cat.color,description:cat.description,position:i,tags:cat.tags}).select().single();
              categoryId=newCat?.id;
            }
            
            if(!categoryId)continue;
            
            for(let j=0;j<cat.themes.length;j++){
              const theme=cat.themes[j];
              let themeId;
              
              if(importMode==='merge'){
                const{data:existing}=await supabase.from('content_themes').select('id').eq('category_id',categoryId).eq('name',theme.name).single();
                if(existing){
                  await supabase.from('content_themes').update({tags:theme.tags}).eq('id',existing.id);
                  themeId=existing.id;
                }else{
                  const{data:newTh}=await supabase.from('content_themes').insert({name:theme.name,category_id:categoryId,position:j,tags:theme.tags}).select().single();
                  themeId=newTh?.id;
                }
              }else{
                const{data:newTh}=await supabase.from('content_themes').insert({name:theme.name,category_id:categoryId,position:j,tags:theme.tags}).select().single();
                themeId=newTh?.id;
              }
              
              if(!themeId)continue;
              
              for(let k=0;k<theme.subThemes.length;k++){
                const st=theme.subThemes[k];
                if(importMode==='merge'){
                  const{data:existing}=await supabase.from('content_sub_themes').select('id').eq('theme_id',themeId).eq('name',st.name).single();
                  if(!existing){
                    await supabase.from('content_sub_themes').insert({name:st.name,theme_id:themeId,position:k,tags:st.tags});
                  }else{
                    await supabase.from('content_sub_themes').update({tags:st.tags}).eq('id',existing.id);
                  }
                }else{
                  await supabase.from('content_sub_themes').insert({name:st.name,theme_id:themeId,position:k,tags:st.tags});
                }
              }
            }
          }
          
          await load();
          setImportModal(false);
          setImportData(null);
          setImportPreview([]);
          setImportStats(null);
          
        }catch(err){alert('Erreur: '+err.message);}
        setImporting(false);
      };
      
      // ============ RENDER ============
      if(!can('manage_videos')&&!isSuperAdmin)return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;
      
      const totalContents=Object.values(contentStats.videos||{}).reduce((a,b)=>a+b,0)+
                         Object.values(contentStats.scorm||{}).reduce((a,b)=>a+b,0)+
                         Object.values(contentStats.quizzes||{}).reduce((a,b)=>a+b,0)+
                         Object.values(contentStats.courses||{}).reduce((a,b)=>a+b,0)+
                         Object.values(contentStats.paths||{}).reduce((a,b)=>a+b,0);
      
      const filteredCategories=searchQuery.trim()?categories.filter(c=>shouldShowCategory(c)):categories;
      
      // Composant Tag
      const TagBadge=({name,color,onRemove,small})=>(
        <span className={`inline-flex items-center gap-1 ${small?'px-1.5 py-0.5 text-xs':'px-2 py-1 text-xs'} rounded-full`} style={{backgroundColor:color||'#6b7280',color:'white'}}>
          {name}
          {onRemove&&<button onClick={onRemove} className="hover:bg-white/20 rounded-full p-0.5"><Icon name="X" size={small?10:12}/></button>}
        </span>
      );
      
      return<div>
        {/* Bandeau lecture seule */}
        {isReadOnly&&(
          <div className="mb-4 p-3 bg-yellow-500/10 border border-yellow-500/30 rounded-lg flex items-center gap-3">
            <Icon name="Eye" size={20} className="text-yellow-400"/>
            <div>
              <p className="text-yellow-400 font-medium">Mode lecture seule</p>
              <p className="text-xs text-gray-400">Seul un Super Administrateur peut modifier les catégories</p>
            </div>
          </div>
        )}
        
        <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6">
          <div>
            <h1 className="text-2xl font-bold">Catégories</h1>
            <p className="text-sm text-gray-400">Organisez vos contenus avec catégories, thèmes, sous-thèmes et tags</p>
          </div>
          <div className="flex flex-wrap gap-2">
            {!isReadOnly&&<Button variant="secondary" icon="Tags" onClick={()=>setTagsModal(true)}>Gérer les tags</Button>}
            <Button variant="secondary" icon="FileSpreadsheet" onClick={downloadTemplate}>Template</Button>
            {!isReadOnly&&<Button variant="secondary" icon="Upload" onClick={()=>fileInputRef.current?.click()}>Importer</Button>}
            <Button variant="secondary" icon="Download" onClick={exportToExcel} disabled={categories.length===0}>Exporter</Button>
            {!isReadOnly&&<input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleFileSelect} className="hidden"/>}
          </div>
        </div>
        
        {/* Stats */}
        <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-6">
          <Card className="p-3 text-center"><p className="text-xl font-bold text-indigo-400">{categories.length}</p><p className="text-xs text-gray-400">Catégories</p></Card>
          <Card className="p-3 text-center"><p className="text-xl font-bold text-purple-400">{themes.length}</p><p className="text-xs text-gray-400">Thèmes</p></Card>
          <Card className="p-3 text-center"><p className="text-xl font-bold text-cyan-400">{subThemes.length}</p><p className="text-xs text-gray-400">Sous-thèmes</p></Card>
          <Card className="p-3 text-center"><p className="text-xl font-bold text-amber-400">{predefinedTags.length}</p><p className="text-xs text-gray-400">Tags</p></Card>
          <Card className="p-3 text-center"><p className="text-xl font-bold text-green-400">{totalContents}</p><p className="text-xs text-gray-400">Contenus</p></Card>
        </div>
        
        {/* Barre de recherche */}
        <Card className="p-4 mb-4">
          <div className="flex gap-3 items-center">
            <div className="relative flex-1">
              <Icon name="Search" size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"/>
              <input 
                type="text" 
                placeholder="Rechercher par nom, description ou tag..." 
                value={searchQuery}
                onChange={e=>setSearchQuery(e.target.value)}
                className="w-full pl-10 pr-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-indigo-500"
              />
              {searchQuery&&(
                <button onClick={()=>setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                  <Icon name="X" size={16}/>
                </button>
              )}
            </div>
            {searchQuery&&(
              <p className="text-sm text-gray-400">
                {filteredCategories.length} catégorie(s) • {searchResults.themes.length} thème(s) • {searchResults.subThemes.length} sous-thème(s)
              </p>
            )}
          </div>
        </Card>
        
        {/* Légende */}
        <div className="flex flex-wrap gap-4 mb-4 text-xs text-gray-400">
          <span className="flex items-center gap-1"><Icon name="ChevronRight" size={14}/> Cliquer pour déplier</span>
          {!isReadOnly&&<span className="flex items-center gap-1"><Icon name="Edit2" size={14} className="text-indigo-400"/> Modifier (nom, couleur, tags)</span>}
          {!isReadOnly&&<span className="flex items-center gap-1"><Icon name="Plus" size={14} className="text-green-400"/> Ajouter thème/sous-thème</span>}
          {!isReadOnly&&<span className="flex items-center gap-1"><Icon name="Tags" size={14} className="text-amber-400"/> Gérer les tags</span>}
        </div>
        
        <Card className="p-6">
          {/* Ajouter catégorie - masqué en lecture seule */}
          {!isReadOnly&&(
            <div className="flex gap-2 mb-6">
              <Input className="flex-1" placeholder="Nouvelle catégorie..." value={quickAddValue} onChange={e=>setQuickAddValue(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&quickAddValue.trim()){addCategory(quickAddValue);setQuickAddValue('');}}}/>
              <Button icon="Plus" onClick={()=>{if(quickAddValue.trim()){addCategory(quickAddValue);setQuickAddValue('');}}} loading={saving}>Ajouter catégorie</Button>
            </div>
          )}
          
          {filteredCategories.length===0?(
            <Empty icon="FolderTree" title={searchQuery?"Aucun résultat":"Aucune catégorie"} desc={searchQuery?"Modifiez votre recherche":"Créez ou importez des catégories."}/>
          ):(
            <div className="space-y-3">
              {filteredCategories.map(cat=>{
                const catThemes=getThemesForCategory(cat.id).filter(t=>shouldShowTheme(t));
                const allCatThemes=getThemesForCategory(cat.id);
                const isExpanded=expandedCats[cat.id];
                const highlighted=isHighlighted('category',cat.id);
                
                return<div key={cat.id} className={`border rounded-lg overflow-hidden ${highlighted?'border-indigo-500 ring-1 ring-indigo-500':'border-gray-700'}`}>
                  <div className="flex items-center gap-3 p-4 bg-gray-800 hover:bg-gray-750">
                    <button onClick={()=>setExpandedCats({...expandedCats,[cat.id]:!isExpanded})} className="p-1 hover:bg-gray-700 rounded">
                      <Icon name={isExpanded?'ChevronDown':'ChevronRight'} size={20} className="text-gray-400"/>
                    </button>
