    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#111827}

    #loading-screen h1{color:white;font-size:24px;font-weight:bold;margin:0 0 8px}
    #loading-screen p{color:#9ca3af;font-size:14px;margin:0 0 24px}
    #loading-screen .spinner{width:32px;height:32px;border:3px solid #374151;border-top-color:#4f46e5;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
    .animate-spin{animation:spin 1s linear infinite}
    @keyframes fade-in{from{opacity:0}to{opacity:1}}.animate-fade-in{animation:fade-in .2s ease-out}
    input,textarea,select,button{font-family:inherit}
    .progress-bar{transition:width 0.3s ease}
    .aspect-video iframe{position:absolute;top:0;left:0;width:100%;height:100%}
  </style>
</head>

  <script type="text/babel">

    // Flatten pour compatibilité

    // Permissions par défaut pour chaque rôle
    const DEFAULT_PERMISSIONS={
      super_admin:Object.keys(PERMISSION_LABELS).reduce((a,k)=>({...a,[k]:true}),{}),
      center_admin:{
        create_users:true,edit_users:true,delete_users:true,import_users:true,assign_roles:true,
        manage_videos:true,view_videos:true,manage_scorm:true,view_scorm:true,
        manage_playlists:true,view_playlists:true,assign_content:true,
        manage_quizzes:true,view_quizzes:true,manage_questions:true,view_questions:true,assign_quizzes:true,
        manage_enrollments:true,manage_paths:true,manage_badges:true,
        view_analytics:true,export_reports:true,
        view_learner_progress:true,grade_quizzes:true,reset_progress:true,issue_certificates:true,
        send_emails:true,send_notifications:true,manage_email_templates:true,
        view_audit_log:true
      },
      trainer:{
        create_users:true,view_videos:true,view_scorm:true,view_playlists:true,assign_content:true,
        view_quizzes:true,view_questions:true,assign_quizzes:true,
        manage_enrollments:true,view_analytics:true,view_learner_progress:true,grade_quizzes:true,

      },
      learner:{}
    };
    
    // Fonction utilitaire pour formater la durée en secondes
    const formatDuration=(seconds)=>{
      if(!seconds||seconds<=0)return'-';
      const h=Math.floor(seconds/3600);
      const m=Math.floor((seconds%3600)/60);
      if(h>0)return`${h}h ${m}min`;
      return`${m}min`;
    };
    
    // Labels et couleurs SCORM
    const SCORM_STATUS_LABELS={
      'not attempted':'Non commencé',
      'incomplete':'En cours',
      'completed':'Terminé',
      'passed':'Réussi',
      'failed':'Échoué',
      'unknown':'Inconnu'
    };
    const SCORM_STATUS_COLORS={
      'not attempted':'bg-gray-500',
      'incomplete':'bg-yellow-500',
      'completed':'bg-green-500',
      'passed':'bg-green-500',
      'failed':'bg-red-500',
      'unknown':'bg-gray-500'
    };

    // Auth Context avec mode "Vue comme"
    const AuthContext=createContext(null);
    function AuthProvider({children}){
      const[user,setUser]=useState(null);
      const[profile,setProfile]=useState(null);
      const[center,setCenter]=useState(null);
      const[permissions,setPermissions]=useState({});
      const[loading,setLoading]=useState(true);
      
      // Mode "Vue comme" pour Super Admin
      const[viewAs,setViewAs]=useState(null);

      const loadProfile=useCallback(async(userId)=>{
        try{
          const{data,error:err}=await supabase.from('profiles').select('*,centers(*)').eq('id',userId).single();
          if(err)throw err;
          setProfile(data);
          setCenter(data?.centers);
          const{data:perms}=await supabase.from('role_permissions').select('permissions').eq('role',data?.role).single();
          setPermissions(perms?.permissions||{});
          return data;
        }catch(e){console.error('Erreur loadProfile:',e);return null;}
      },[]);

      useEffect(()=>{
        let mounted=true;
        
        // Timeout de sécurité : si le chargement prend plus de 10s, on arrête
        const timeout=setTimeout(()=>{
          if(mounted&&loading){
            console.warn('Auth timeout - forçage fin de chargement');
            setLoading(false);
          }
        },10000);
        
        const init=async()=>{
          try{
            const{data:{session},error}=await supabase.auth.getSession();
            if(error){
              console.error('Erreur getSession:',error);
              // Si erreur de session, on nettoie le localStorage
              if(error.message?.includes('refresh_token')||error.message?.includes('invalid')){
                console.warn('Session invalide, nettoyage...');
                await supabase.auth.signOut();
              }
            }
            if(mounted&&session?.user){
              setUser(session.user);
              await loadProfile(session.user.id);
            }
          }catch(e){
            console.error('Erreur init auth:',e);
          }finally{
            clearTimeout(timeout);
            if(mounted)setLoading(false);
          }
        };
        init();
        
        const{data:{subscription}}=supabase.auth.onAuthStateChange(async(event,session)=>{
          if(!mounted)return;
          console.log('Auth event:',event);
          if(event==='SIGNED_IN'&&session?.user){setUser(session.user);await loadProfile(session.user.id);}
          else if(event==='SIGNED_OUT'){setUser(null);setProfile(null);setCenter(null);setPermissions({});setViewAs(null);}
          else if(event==='TOKEN_REFRESHED'){console.log('Token rafraîchi');}
        });
        return()=>{mounted=false;clearTimeout(timeout);subscription.unsubscribe();};
      },[loadProfile]);

      const signIn=async(email,password)=>{
        try{const{error:err}=await supabase.auth.signInWithPassword({email,password});if(err)throw err;return{success:true};}
        catch(e){return{success:false,error:e.message};}
      };
      const signOut=async()=>{setViewAs(null);await supabase.auth.signOut();};

      // Fonctions adaptées au mode "Vue comme"
      const realIsSuperAdmin=profile?.role==='super_admin';
      const realRole=profile?.role;
      
      // Vérifier une permission
      const can=(perm)=>realIsSuperAdmin||permissions[perm]===true;
      
      // Vérifier si l'utilisateur peut agir sur un centre spécifique
      const canForCenter=(perm,centerId)=>{
        if(realIsSuperAdmin)return true;
        if(!can(perm))return false;
        // Admin centre et formateur: seulement leur propre centre
        if(realRole==='center_admin'||realRole==='trainer'){
          return center?.id===centerId;
        }
        return true;
      };
      
      // Vérifier les rôles que l'utilisateur peut assigner
      const canAssignRole=(targetRole)=>{
        if(realIsSuperAdmin)return true;
        if(!can('assign_roles'))return false;
        // Admin centre: peut assigner apprenant et formateur seulement
        if(realRole==='center_admin'){
          return['learner','trainer'].includes(targetRole);
        }
        // Formateur: peut créer des apprenants seulement
        if(realRole==='trainer'){
          return targetRole==='learner';
        }
        return false;
      };
      
      // Rôle effectif
      const effectiveRole=viewAs?.role||profile?.role;
      const effectiveCenter=viewAs?{id:viewAs.center_id,name:viewAs.center_name}:center;
      
      const isSuperAdmin=!viewAs&&realIsSuperAdmin;
      const isCenterAdmin=viewAs?(viewAs.role==='center_admin'||viewAs.role==='trainer'):(profile?.role==='center_admin'||profile?.role==='trainer');
      const isLearner=viewAs?viewAs.role==='learner':profile?.role==='learner';
      
      // Fonction pour changer de vue
      const switchView=(role,centerId,centerName)=>{
        if(!realIsSuperAdmin)return;
        if(role===null)setViewAs(null);
        else setViewAs({role,center_id:centerId,center_name:centerName});
      };
      const exitViewAs=()=>setViewAs(null);

      const value={
        user,profile,
        center:effectiveCenter,
        loading,signIn,signOut,
        isAuth:!!user,
        isSuperAdmin,
        realIsSuperAdmin,
        realRole,
        isCenterAdmin,
        isLearner,
        effectiveRole,
        role:effectiveRole||'learner',
        can,canForCenter,canAssignRole,permissions,
        viewAs,switchView,exitViewAs,
        reload:async()=>{if(user)await loadProfile(user.id);}
      };
      return<AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
    }
    const useAuth=()=>useContext(AuthContext);

    // Icon
    const Icon=({name,size=20,className=''})=>{
      const ref=useRef(null);
      useEffect(()=>{if(ref.current&&lucide.icons[name]){ref.current.innerHTML='';const i=lucide.createElement(lucide.icons[name]);i.setAttribute('width',size);i.setAttribute('height',size);ref.current.appendChild(i);}},[name,size]);
      return<span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{width:size,height:size}}/>;
    };

    // UI Components
    const Button=({children,variant='primary',size='md',icon,loading,disabled,className='',...props})=>{

      const s={sm:'px-3 py-1.5 text-sm',md:'px-4 py-2',lg:'px-6 py-3'};
      return<button className={`inline-flex items-center justify-center gap-2 rounded-lg font-medium text-white transition disabled:opacity-50 ${v[variant]} ${s[size]} ${className}`} disabled={disabled||loading} {...props}>{loading?<Icon name="Loader2" size={16} className="animate-spin"/>:icon&&<Icon name={icon} size={16}/>}{children}</button>;
    };
    const Input=({label,error,icon,className='',...props})=>(<div className={className}>{label&&<label className="block text-sm font-medium text-gray-300 mb-1">{label}</label>}<div className="relative">{icon&&<div className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><Icon name={icon} size={18}/></div>}<input className={`w-full px-4 py-2.5 bg-gray-700 border rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 ${icon?'pl-10':''} ${error?'border-red-500':'border-gray-600'}`} {...props}/></div>{error&&<p className="text-red-400 text-sm mt-1">{error}</p>}</div>);
    const Select=({label,options,className='',...props})=>(<div className={className}>{label&&<label className="block text-sm font-medium text-gray-300 mb-1">{label}</label>}<select className="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 rounded-lg text-white" {...props}>{options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select></div>);
    const Checkbox=({label,checked,onChange,className=''})=>(<label className={`flex items-center gap-3 cursor-pointer ${className}`}><input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)} className="w-5 h-5 rounded bg-gray-700 border-gray-600 text-indigo-600 focus:ring-indigo-500"/><span className="text-gray-300">{label}</span></label>);
    const Modal=({isOpen,onClose,title,children,size='md'})=>{if(!isOpen)return null;const s={sm:'max-w-md',md:'max-w-lg',lg:'max-w-2xl',xl:'max-w-4xl',full:'max-w-6xl'};return(<div className="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in"><div className="absolute inset-0 bg-black/70" onClick={onClose}/><div className={`relative bg-gray-800 rounded-xl w-full ${s[size]} max-h-[90vh] overflow-auto`}><div className="sticky top-0 bg-gray-800 p-4 border-b border-gray-700 flex items-center justify-between z-10"><h2 className="text-lg font-semibold">{title}</h2><button onClick={onClose} className="p-2 hover:bg-gray-700 rounded-lg"><Icon name="X" size={20}/></button></div><div className="p-4">{children}</div></div></div>);};
    const Card=({children,className='',...props})=><div className={`bg-gray-800 rounded-xl border border-gray-700 ${className}`} {...props}>{children}</div>;
    const RoleBadge=({role})=><span className={`inline-flex px-2 py-1 rounded-full text-xs font-medium ${ROLE_COLORS[role]||'bg-gray-500'} text-white`}>{ROLE_LABELS[role]||role}</span>;
    
    // Score Badge pour SCORM
    const ScoreBadge=({score,showLabel=true})=>{
      if(score===null||score===undefined)return<span className="text-gray-500 text-sm">—</span>;
      // Détecter si le score est en format 0-1 ou 0-100
      let percent;
      if(score>1){
        // Score déjà en pourcentage (ex: 90)
        percent=Math.round(score);
      }else{
        // Score en format décimal (ex: 0.9)
        percent=Math.round(score*100);
      }
      const color=percent>=70?'text-green-400':percent>=50?'text-yellow-400':'text-red-400';
      return<span className={`font-semibold ${color}`}>{percent}%</span>;
    };
    
    // Fonction pour parser le temps SCORM
    const parseScormTime=(timeStr)=>{
      if(!timeStr)return 0;
      // Format SCORM 1.2: HH:MM:SS ou HHHH:MM:SS.SS
      if(timeStr.includes(':')){
        const parts=timeStr.split(':');
        const h=parseInt(parts[0])||0;
        const m=parseInt(parts[1])||0;
        const s=parseFloat(parts[2])||0;
        return h*3600+m*60+Math.round(s);
      }
      // Format SCORM 2004: PT1H30M45S
      if(timeStr.startsWith('PT')){
        let seconds=0;
        const hMatch=timeStr.match(/(\d+)H/);
        const mMatch=timeStr.match(/(\d+)M/);
        const sMatch=timeStr.match(/(\d+(?:\.\d+)?)S/);
        if(hMatch)seconds+=parseInt(hMatch[1])*3600;
        if(mMatch)seconds+=parseInt(mMatch[1])*60;
        if(sMatch)seconds+=Math.round(parseFloat(sMatch[1]));
        return seconds;
      }
      return 0;
    };
    
    // Status Badge pour SCORM
    const ScormStatusBadge=({status})=>{
      const label=SCORM_STATUS_LABELS[status]||status||'Inconnu';
      const color=SCORM_STATUS_COLORS[status]||'bg-gray-500';
      return<span className={`px-2 py-0.5 rounded text-xs font-medium ${color}`}>{label}</span>;
    };
    const Loading=({text})=><div className="flex flex-col items-center justify-center p-8"><div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"/>{text&&<p className="text-gray-400 mt-4">{text}</p>}</div>;
    const Empty=({icon,title,desc,action})=><div className="flex flex-col items-center justify-center p-8 text-center"><div className="text-gray-500 mb-4"><Icon name={icon} size={48}/></div><h3 className="text-lg font-medium text-gray-300">{title}</h3>{desc&&<p className="text-gray-500 mt-1">{desc}</p>}{action&&<div className="mt-4">{action}</div>}</div>;
    const Alert=({type='info',children})=>{const colors={info:'bg-blue-500/20 text-blue-300',success:'bg-green-500/20 text-green-300',warning:'bg-yellow-500/20 text-yellow-300',error:'bg-red-500/20 text-red-300'};return<div className={`p-4 rounded-lg ${colors[type]}`}>{children}</div>;};
    const ProgressBar=({percent,size='md',showLabel=true})=>{const h={sm:'h-2',md:'h-3',lg:'h-4'};return<div className="w-full"><div className={`w-full bg-gray-700 rounded-full ${h[size]}`}><div className={`bg-indigo-600 rounded-full ${h[size]} progress-bar`} style={{width:`${Math.min(100,Math.max(0,percent))}%`}}/></div>{showLabel&&<p className="text-sm text-gray-400 mt-1">{Math.round(percent)}% complété</p>}</div>;};

    // Login
    function LoginPage(){
      const{signIn}=useAuth();
      const[email,setEmail]=useState('');
      const[password,setPassword]=useState('');
      const[loading,setLoading]=useState(false);
      const[msg,setMsg]=useState(null);

      const handleSubmit=async e=>{
        e.preventDefault();setLoading(true);setMsg(null);
        const r=await signIn(email,password);
        if(!r.success)setMsg({type:'error',text:r.error});
        setLoading(false);
      };

    // ============================================================
    // PAGE: Suivi SCORM (ScormTrackingPage) - v6.7.1
    // ============================================================
    function ScormTrackingPage(){
      const{can,center,isSuperAdmin,profile}=useAuth();
      const[loading,setLoading]=useState(true);
      const[activeTab,setActiveTab]=useState('overview');
      const[filter,setFilter]=useState({learner:'all',course:'all',path:'all',search:''});
      const[selectedLearner,setSelectedLearner]=useState(null);
      
      // Données
      const[learners,setLearners]=useState([]);
      const[courses,setCourses]=useState([]);
      const[paths,setPaths]=useState([]);
      const[enrollments,setEnrollments]=useState([]);
      const[pathEnrollments,setPathEnrollments]=useState([]);
      const[videoProgress,setVideoProgress]=useState([]);
      const[scormProgress,setScormProgress]=useState([]);
      const[quizAttempts,setQuizAttempts]=useState([]);
      const[modules,setModules]=useState([]);
      
      // Stats globales
      const[stats,setStats]=useState({
        totalLearners:0,activeLearners:0,
        totalEnrollments:0,completedEnrollments:0,
        totalPaths:0,completedPaths:0,
        totalScorm:0,completedScorm:0,passedScorm:0,avgScormScore:0,
        totalQuiz:0,passedQuiz:0,avgQuizScore:0,
        totalWatchTime:0,totalCourseTime:0
      });

      const load=useCallback(async()=>{
        // Charger les apprenants (filtrés par centre)
        let ql=supabase.from('profiles').select('id,first_name,last_name,email,created_at').eq('role','learner');
        if(!isSuperAdmin&&center?.id)ql=ql.eq('center_id',center.id);
        const{data:lrn}=await ql;
        setLearners(lrn||[]);
        const learnerIds=(lrn||[]).map(l=>l.id);
        
        // Charger les cours (filtrés par centre)
        let qc=supabase.from('playlists').select('id,title');
        if(!isSuperAdmin&&center?.id)qc=qc.eq('center_id',center.id);
        const{data:crs}=await qc;
        setCourses(crs||[]);
        const courseIds=(crs||[]).map(c=>c.id);
        
        // Charger les parcours (filtrés par centre)
        let qp=supabase.from('learning_paths').select('id,title');
        if(!isSuperAdmin&&center?.id)qp=qp.eq('center_id',center.id);
        const{data:pth}=await qp;
        setPaths(pth||[]);
        
        // Charger les modules SCORM
        const{data:mods}=await supabase.from('scorm_modules').select('id,title,category');
        setModules(mods||[]);
        
        // Charger les inscriptions aux cours
        let qe=supabase.from('enrollments').select('*,playlists:playlist_id(title)');
        if(!isSuperAdmin&&center?.id&&learnerIds.length>0){
          qe=qe.in('learner_id',learnerIds);
        }
        const{data:enr}=await qe;
        const filteredEnr=(enr||[]).filter(e=>learnerIds.includes(e.learner_id));
        setEnrollments(filteredEnr);
        
        // Charger les inscriptions aux parcours
        let qpe=supabase.from('path_enrollments').select('*,learning_paths(id,title)');
        if(learnerIds.length>0){
          qpe=qpe.in('learner_id',learnerIds);
        }
        const{data:pathEnr}=await qpe;
        const filteredPathEnr=(pathEnr||[]).filter(pe=>learnerIds.includes(pe.learner_id));
        setPathEnrollments(filteredPathEnr);
        
        // Charger la progression vidéo
        let qv=supabase.from('video_progress').select('*');
        if(learnerIds.length>0){
          qv=qv.in('learner_id',learnerIds);
        }
        const{data:vp}=await qv;
        setVideoProgress(vp||[]);
        
        // Charger la progression SCORM
        let qs=supabase.from('scorm_progress').select('*');
        if(learnerIds.length>0){
          qs=qs.in('learner_id',learnerIds);
        }
        const{data:sp}=await qs;
        setScormProgress(sp||[]);
        
        // Charger les tentatives de quiz
        let qq=supabase.from('quiz_attempts').select('*,quizzes(title,passing_score)');
        if(learnerIds.length>0){
          qq=qq.in('learner_id',learnerIds);
        }
        const{data:qa}=await qq;
        setQuizAttempts(qa||[]);
        
        // Calculer les stats
        const totalLearners=learnerIds.length;
        const activeLearners=[...new Set([
          ...filteredEnr.map(e=>e.learner_id),
          ...filteredPathEnr.map(pe=>pe.learner_id),
          ...(vp||[]).map(v=>v.learner_id),
          ...(sp||[]).map(s=>s.learner_id)
        ])].length;
        
        const totalEnrollments=filteredEnr.length;
        const completedEnrollments=filteredEnr.filter(e=>e.status==='completed').length;
        
        const totalPaths=filteredPathEnr.length;
        const completedPaths=filteredPathEnr.filter(pe=>pe.status==='completed'||pe.progress_percent===100).length;
        
        const totalScorm=(sp||[]).length;
        const completedScorm=(sp||[]).filter(s=>s.completion_status==='completed'||s.completion_status==='passed').length;
        const passedScorm=(sp||[]).filter(s=>s.completion_status==='passed'||s.success_status==='passed').length;
        const scormWithScore=(sp||[]).filter(s=>s.score_scaled!==null&&s.score_scaled!==undefined);
        const avgScormScore=scormWithScore.length>0?scormWithScore.reduce((a,s)=>{
          const score=s.score_scaled||0;
          return a+(score>1?score:score*100);
        },0)/scormWithScore.length:0;
        
        const totalQuiz=(qa||[]).length;
        const passedQuiz=(qa||[]).filter(q=>q.passed).length;
        const avgQuizScore=totalQuiz>0?(qa||[]).reduce((a,q)=>a+(q.score_percent||0),0)/totalQuiz:0;
        
        const totalWatchTime=(vp||[]).reduce((a,v)=>a+(v.watch_time_seconds||0),0);
        const totalCourseTime=filteredEnr.reduce((a,e)=>a+(e.time_spent_seconds||0),0);
        const totalPathTime=filteredPathEnr.reduce((a,pe)=>a+(pe.time_spent_seconds||0),0);
        
        setStats({
          totalLearners,activeLearners,
          totalEnrollments,completedEnrollments,
          totalPaths,completedPaths,
          totalScorm,completedScorm,passedScorm,avgScormScore,
          totalQuiz,passedQuiz,avgQuizScore,
          totalWatchTime,totalCourseTime,totalPathTime
        });
        
        setLoading(false);
      },[isSuperAdmin,center?.id]);

      useEffect(()=>{load();},[load]);

      // Données par apprenant
      const learnerData=useMemo(()=>{
        return learners.map(l=>{
          const lEnrollments=enrollments.filter(e=>e.learner_id===l.id);
          const lPathEnrollments=pathEnrollments.filter(pe=>pe.learner_id===l.id);
          const lVideos=videoProgress.filter(v=>v.learner_id===l.id);
          const lScorm=scormProgress.filter(s=>s.learner_id===l.id);
          const lQuiz=quizAttempts.filter(q=>q.learner_id===l.id);
          
          const coursesCompleted=lEnrollments.filter(e=>e.status==='completed').length;
          const coursesTotal=lEnrollments.length;
          const courseProgress=coursesTotal>0?Math.round((coursesCompleted/coursesTotal)*100):0;
          
          const pathsCompleted=lPathEnrollments.filter(pe=>pe.status==='completed'||pe.progress_percent===100).length;
          const pathsTotal=lPathEnrollments.length;
          const pathProgress=pathsTotal>0?Math.round(lPathEnrollments.reduce((a,pe)=>a+(pe.progress_percent||0),0)/pathsTotal):0;
          
          const scormCompleted=lScorm.filter(s=>s.completion_status==='completed'||s.completion_status==='passed').length;
          const scormPassed=lScorm.filter(s=>s.completion_status==='passed'||s.success_status==='passed').length;
          const scormScores=lScorm.filter(s=>s.score_scaled!==null).map(s=>s.score_scaled>1?s.score_scaled:s.score_scaled*100);
          const avgScorm=scormScores.length>0?Math.round(scormScores.reduce((a,b)=>a+b,0)/scormScores.length):null;
          
          const quizPassed=lQuiz.filter(q=>q.passed).length;
          const quizScores=lQuiz.map(q=>q.score_percent||0);
          const avgQuiz=quizScores.length>0?Math.round(quizScores.reduce((a,b)=>a+b,0)/quizScores.length):null;
          
          const totalTime=lEnrollments.reduce((a,e)=>a+(e.time_spent_seconds||0),0)+lPathEnrollments.reduce((a,pe)=>a+(pe.time_spent_seconds||0),0);
          const watchTime=lVideos.reduce((a,v)=>a+(v.watch_time_seconds||0),0);
          const scormTime=lScorm.reduce((a,s)=>a+parseScormTime(s.total_time),0);
          const pathTime=lPathEnrollments.reduce((a,pe)=>a+(pe.time_spent_seconds||0),0);
          
          const lastActivity=[
            ...lEnrollments.map(e=>e.updated_at),
            ...lPathEnrollments.map(pe=>pe.updated_at),
            ...lVideos.map(v=>v.updated_at),
            ...lScorm.map(s=>s.last_accessed_at),
            ...lQuiz.map(q=>q.created_at)
          ].filter(Boolean).sort((a,b)=>new Date(b)-new Date(a))[0];
          
          return{
            ...l,
            coursesTotal,coursesCompleted,courseProgress,
            pathsTotal,pathsCompleted,pathProgress,
            scormTotal:lScorm.length,scormCompleted,scormPassed,avgScorm,
            quizTotal:lQuiz.length,quizPassed,avgQuiz,
            totalTime,watchTime,scormTime,pathTime,
            lastActivity,
            enrollments:lEnrollments,
            pathEnrollments:lPathEnrollments,
            scormProgress:lScorm,
            quizAttempts:lQuiz,
            videoProgress:lVideos
          };
        });
      },[learners,enrollments,pathEnrollments,videoProgress,scormProgress,quizAttempts]);

      // Filtrage
      const filteredLearners=useMemo(()=>{
        return learnerData.filter(l=>{
          if(filter.learner!=='all'&&l.id!==filter.learner)return false;
          if(filter.course!=='all'){
            const hasEnrollment=l.enrollments.some(e=>e.playlist_id===filter.course);
            if(!hasEnrollment)return false;
          }
          if(filter.path!=='all'){
            const hasPath=l.pathEnrollments.some(pe=>pe.path_id===filter.path);
            if(!hasPath)return false;
          }
          if(filter.search){
            const s=filter.search.toLowerCase();
            if(!`${l.first_name} ${l.last_name}`.toLowerCase().includes(s)&&
               !l.email?.toLowerCase().includes(s))return false;
          }
          return true;
        });
      },[learnerData,filter]);

      // Export Excel
      const exportExcel=()=>{
        const wb=XLSX.utils.book_new();
        
        // Feuille 1: Résumé par apprenant
        const summaryData=[['Apprenant','Email','Cours inscrits','Cours terminés','Parcours inscrits','Parcours terminés','Modules SCORM','SCORM réussis','Score SCORM','Quiz passés','Score Quiz','Temps total','Dernière activité']];
        filteredLearners.forEach(l=>{
          summaryData.push([
            l.first_name+' '+l.last_name,
            l.email||'',
            l.coursesTotal,
            l.coursesCompleted,
            l.pathsTotal,
            l.pathsCompleted,
            l.scormTotal,
            l.scormPassed,
            l.avgScorm!==null?l.avgScorm+'%':'',
            l.quizPassed+'/'+l.quizTotal,
            l.avgQuiz!==null?l.avgQuiz+'%':'',
            formatDuration(l.totalTime),
            l.lastActivity?new Date(l.lastActivity).toLocaleDateString('fr-FR'):''
          ]);
        });
        const ws1=XLSX.utils.aoa_to_sheet(summaryData);
        ws1['!cols']=[{wch:25},{wch:30},{wch:12},{wch:14},{wch:14},{wch:16},{wch:14},{wch:14},{wch:12},{wch:12},{wch:12},{wch:15},{wch:15}];
        XLSX.utils.book_append_sheet(wb,ws1,'Resume Apprenants');
        
        // Feuille 2: Détail des cours
        const coursesData=[['Apprenant','Email','Cours','Statut','Progression','Temps passé','Date inscription']];
        enrollments.forEach(e=>{
          const l=learners.find(x=>x.id===e.learner_id);
          coursesData.push([
            l?l.first_name+' '+l.last_name:'',
            l?.email||'',
            e.playlists?.title||'',
            e.status==='completed'?'Terminé':e.status==='in_progress'?'En cours':'Non commencé',
            (e.progress_percent||0)+'%',
            formatDuration(e.time_spent_seconds||0),
            e.created_at?new Date(e.created_at).toLocaleDateString('fr-FR'):''
          ]);
        });
        const ws2=XLSX.utils.aoa_to_sheet(coursesData);
        ws2['!cols']=[{wch:25},{wch:30},{wch:35},{wch:15},{wch:12},{wch:15},{wch:15}];
        XLSX.utils.book_append_sheet(wb,ws2,'Detail Cours');
        
        // Feuille 3: Parcours
        const pathsData=[['Apprenant','Email','Parcours','Statut','Progression','Temps passé','Date début']];
        pathEnrollments.forEach(pe=>{
          const l=learners.find(x=>x.id===pe.learner_id);
          pathsData.push([
            l?l.first_name+' '+l.last_name:'',
            l?.email||'',
            pe.learning_paths?.title||'Parcours',
            pe.status==='completed'||pe.progress_percent===100?'Terminé':pe.progress_percent>0?'En cours':'Non commencé',
            (pe.progress_percent||0)+'%',
            formatDuration(pe.time_spent_seconds||0),
            pe.started_at?new Date(pe.started_at).toLocaleDateString('fr-FR'):''
          ]);
        });
        const ws3=XLSX.utils.aoa_to_sheet(pathsData);
        ws3['!cols']=[{wch:25},{wch:30},{wch:35},{wch:15},{wch:12},{wch:15},{wch:15}];
        XLSX.utils.book_append_sheet(wb,ws3,'Parcours');
        
        // Feuille 4: SCORM
        const scormData=[['Apprenant','Email','Module','Statut','Succès','Score','Temps','Date']];
        scormProgress.forEach(s=>{
          const l=learners.find(x=>x.id===s.learner_id);
          const m=modules.find(x=>x.id===s.module_id);
          const score=s.score_scaled!==null?(s.score_scaled>1?s.score_scaled:Math.round(s.score_scaled*100)):null;
          scormData.push([
            l?l.first_name+' '+l.last_name:'',
            l?.email||'',
            m?.title||'Module '+s.module_id,
            SCORM_STATUS_LABELS[s.completion_status]||s.completion_status||'',
            s.success_status||'',
            score!==null?score+'%':'',
            formatDuration(parseScormTime(s.total_time)),
            s.last_accessed_at?new Date(s.last_accessed_at).toLocaleDateString('fr-FR'):''
          ]);
        });
        const ws4=XLSX.utils.aoa_to_sheet(scormData);
        ws4['!cols']=[{wch:25},{wch:30},{wch:35},{wch:15},{wch:12},{wch:10},{wch:12},{wch:12}];
        XLSX.utils.book_append_sheet(wb,ws4,'SCORM');
        
        // Feuille 5: Quiz
        const quizData=[['Apprenant','Email','Quiz','Score','Réussi','Date']];
        quizAttempts.forEach(q=>{
          const l=learners.find(x=>x.id===q.learner_id);
          quizData.push([
            l?l.first_name+' '+l.last_name:'',
            l?.email||'',
            q.quizzes?.title||'Quiz',
            (q.score_percent||0)+'%',
            q.passed?'Oui':'Non',
            q.created_at?new Date(q.created_at).toLocaleDateString('fr-FR'):''
          ]);
        });
        const ws5=XLSX.utils.aoa_to_sheet(quizData);
        ws5['!cols']=[{wch:25},{wch:30},{wch:35},{wch:10},{wch:10},{wch:12}];
        XLSX.utils.book_append_sheet(wb,ws5,'Quiz');
        
        // Feuille 6: Assiduité
        const assiduiteData=[['Apprenant','Email','Temps formation total','Temps vidéo','Temps SCORM','Temps parcours','Nb cours','Nb parcours','Nb SCORM','Nb Quiz']];
        filteredLearners.forEach(l=>{
          assiduiteData.push([
            l.first_name+' '+l.last_name,
            l.email||'',
            formatDuration(l.totalTime),
            formatDuration(l.watchTime),
            formatDuration(l.scormTime),
            formatDuration(l.pathTime),
            l.coursesTotal,
            l.pathsTotal,
            l.scormTotal,
            l.quizTotal
          ]);
        });
        const ws6=XLSX.utils.aoa_to_sheet(assiduiteData);
        ws6['!cols']=[{wch:25},{wch:30},{wch:18},{wch:15},{wch:15},{wch:15},{wch:10},{wch:12},{wch:10},{wch:10}];
        XLSX.utils.book_append_sheet(wb,ws6,'Assiduite');
        
        // Télécharger
        const filename='suivi-formation-'+new Date().toISOString().slice(0,10)+'.xlsx';
        XLSX.writeFile(wb,filename);
      };

      // Ouvrir le détail d'un apprenant
      const openLearnerDetail=(learner)=>{
        setSelectedLearner(learner);
      };

      if(!can('view_analytics')&&!can('manage_enrollments'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4">
          <div>
            <h1 className="text-2xl font-bold">Suivi de formation</h1>
            <p className="text-sm text-gray-400">{stats.totalLearners} apprenant{stats.totalLearners>1?'s':''} • {stats.totalEnrollments} inscription{stats.totalEnrollments>1?'s':''}</p>
          </div>
          <div className="flex gap-2">
            <Button variant="ghost" icon="RefreshCw" onClick={load}>Actualiser</Button>
            <Button variant="secondary" icon="Download" onClick={exportExcel}>Exporter Excel</Button>
          </div>
        </div>

        {/* Stats globales */}
        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4 mb-6">
          <Card className="p-4 text-center">
            <Icon name="Users" size={24} className="mx-auto text-indigo-400 mb-2"/>
            <p className="text-2xl font-bold">{stats.activeLearners}<span className="text-base text-gray-500">/{stats.totalLearners}</span></p>
            <p className="text-xs text-gray-400">Apprenants actifs</p>
          </Card>
          <Card className="p-4 text-center">
            <Icon name="BookOpen" size={24} className="mx-auto text-blue-400 mb-2"/>
            <p className="text-2xl font-bold">{stats.completedEnrollments}<span className="text-base text-gray-500">/{stats.totalEnrollments}</span></p>
            <p className="text-xs text-gray-400">Cours terminés</p>
          </Card>
          <Card className="p-4 text-center">
            <Icon name="Route" size={24} className="mx-auto text-purple-400 mb-2"/>
            <p className="text-2xl font-bold">{stats.completedPaths}<span className="text-base text-gray-500">/{stats.totalPaths}</span></p>
            <p className="text-xs text-gray-400">Parcours terminés</p>
          </Card>
          <Card className="p-4 text-center">
            <Icon name="Package" size={24} className="mx-auto text-orange-400 mb-2"/>
            <p className="text-2xl font-bold">{stats.passedScorm}<span className="text-base text-gray-500">/{stats.totalScorm}</span></p>
            <p className="text-xs text-gray-400">SCORM réussis</p>
            {stats.avgScormScore>0&&<p className="text-xs text-green-400">Moy: {Math.round(stats.avgScormScore)}%</p>}
          </Card>
          <Card className="p-4 text-center">
            <Icon name="HelpCircle" size={24} className="mx-auto text-pink-400 mb-2"/>
            <p className="text-2xl font-bold">{stats.passedQuiz}<span className="text-base text-gray-500">/{stats.totalQuiz}</span></p>
            <p className="text-xs text-gray-400">Quiz réussis</p>
            {stats.avgQuizScore>0&&<p className="text-xs text-green-400">Moy: {Math.round(stats.avgQuizScore)}%</p>}
          </Card>
          <Card className="p-4 text-center">
            <Icon name="Clock" size={24} className="mx-auto text-cyan-400 mb-2"/>
            <p className="text-2xl font-bold">{formatDuration(stats.totalCourseTime)}</p>
            <p className="text-xs text-gray-400">Temps total</p>
          </Card>
          <Card className="p-4 text-center">
            <Icon name="Play" size={24} className="mx-auto text-green-400 mb-2"/>
            <p className="text-2xl font-bold">{formatDuration(stats.totalWatchTime)}</p>
            <p className="text-xs text-gray-400">Temps vidéo</p>
          </Card>
        </div>

        {/* Onglets */}
        <Tabs tabs={[
          {id:'overview',label:'Vue d\'ensemble',icon:'LayoutDashboard'},
          {id:'learners',label:'Par apprenant',icon:'Users'},
          {id:'courses',label:'Par cours',icon:'BookOpen'},
          {id:'paths',label:'Parcours',icon:'Route'},
          {id:'scorm',label:'SCORM',icon:'Package'},
          {id:'quiz',label:'Quiz',icon:'HelpCircle'}
        ]} active={activeTab} onChange={setActiveTab}/>

        {/* Filtres */}
        <Card className="p-4 mb-6">
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <Input icon="Search" placeholder="Rechercher un apprenant..." value={filter.search} onChange={e=>setFilter({...filter,search:e.target.value})}/>
            <Select value={filter.learner} onChange={e=>setFilter({...filter,learner:e.target.value})} options={[{value:'all',label:'Tous les apprenants'},...learners.map(l=>({value:l.id,label:l.first_name+' '+l.last_name}))]}/>
            <Select value={filter.course} onChange={e=>setFilter({...filter,course:e.target.value})} options={[{value:'all',label:'Tous les cours'},...courses.map(c=>({value:c.id,label:c.title}))]}/>
            <Select value={filter.path} onChange={e=>setFilter({...filter,path:e.target.value})} options={[{value:'all',label:'Tous les parcours'},...paths.map(p=>({value:p.id,label:p.title}))]}/>
          </div>
        </Card>

        {/* Vue d'ensemble */}
        {activeTab==='overview'&&(
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <Card className="p-6">
              <h3 className="font-semibold mb-4">Top apprenants</h3>
              <div className="space-y-3">
                {learnerData.sort((a,b)=>b.courseProgress-a.courseProgress).slice(0,5).map((l,i)=>(
                  <div key={l.id} className="flex items-center gap-3">
                    <span className="w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center text-xs font-bold">{i+1}</span>
                    <div className="flex-1 min-w-0">
                      <p className="font-medium truncate">{l.first_name} {l.last_name}</p>
                      <div className="flex items-center gap-2">
                        <div className="flex-1"><ProgressBar percent={l.courseProgress} size="sm" showLabel={false}/></div>
                        <span className="text-sm text-gray-400">{l.courseProgress}%</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </Card>
            <Card className="p-6">
              <h3 className="font-semibold mb-4">Activité récente</h3>
              <div className="space-y-3">
                {learnerData.filter(l=>l.lastActivity).sort((a,b)=>new Date(b.lastActivity)-new Date(a.lastActivity)).slice(0,5).map(l=>(
                  <div key={l.id} className="flex items-center gap-3 p-2 bg-gray-700/50 rounded-lg">
                    <div className="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center"><Icon name="User" size={18}/></div>
                    <div className="flex-1 min-w-0">
                      <p className="font-medium truncate">{l.first_name} {l.last_name}</p>
                      <p className="text-xs text-gray-400">{l.lastActivity?new Date(l.lastActivity).toLocaleString('fr-FR'):'-'}</p>
                    </div>
                    <span className="text-xs text-gray-500">{formatDuration(l.totalTime)}</span>
                  </div>
                ))}
              </div>
            </Card>
          </div>
        )}

        {/* Par apprenant */}
        {activeTab==='learners'&&(
          <Card>
            <div className="overflow-x-auto">
              <table className="w-full">
                <thead className="bg-gray-750"><tr>
                  <th className="text-left p-4 font-medium text-gray-400">Apprenant</th>
                  <th className="text-left p-4 font-medium text-gray-400">Cours</th>
                  <th className="text-left p-4 font-medium text-gray-400">Parcours</th>
                  <th className="text-left p-4 font-medium text-gray-400">SCORM</th>
                  <th className="text-left p-4 font-medium text-gray-400">Quiz</th>
                  <th className="text-left p-4 font-medium text-gray-400">Temps</th>
                  <th className="text-left p-4 font-medium text-gray-400">Dernière activité</th>
                  <th className="text-right p-4"></th>
                </tr></thead>
                <tbody className="divide-y divide-gray-700">
                  {filteredLearners.length===0?<tr><td colSpan="8" className="p-8 text-center text-gray-500">Aucun apprenant</td></tr>:
                  filteredLearners.map(l=>(
                    <tr key={l.id} className="hover:bg-gray-750/50">
                      <td className="p-4">
                        <p className="font-medium">{l.first_name} {l.last_name}</p>
                        <p className="text-sm text-gray-400">{l.email}</p>
                      </td>
                      <td className="p-4">
                        <div className="flex items-center gap-2">
                          <span className="font-medium">{l.coursesCompleted}/{l.coursesTotal}</span>
                          <div className="w-16"><ProgressBar percent={l.courseProgress} size="sm" showLabel={false}/></div>
                        </div>
                      </td>
                      <td className="p-4">
                        <div className="flex items-center gap-2">
                          <span className={l.pathsTotal>0?'font-medium':'text-gray-500'}>{l.pathsCompleted}/{l.pathsTotal}</span>
                          {l.pathsTotal>0&&<div className="w-12"><ProgressBar percent={l.pathProgress} size="sm" showLabel={false}/></div>}
                        </div>
                      </td>
                      <td className="p-4">
                        <span className={l.scormTotal>0?'':'text-gray-500'}>{l.scormPassed}/{l.scormTotal}</span>
                        {l.avgScorm!==null&&<span className="text-xs text-green-400 ml-2">({l.avgScorm}%)</span>}
                      </td>
                      <td className="p-4">
                        <span className={l.quizTotal>0?'':'text-gray-500'}>{l.quizPassed}/{l.quizTotal}</span>
                        {l.avgQuiz!==null&&<span className="text-xs text-green-400 ml-2">({l.avgQuiz}%)</span>}
                      </td>
                      <td className="p-4 text-blue-400">{formatDuration(l.totalTime)}</td>
                      <td className="p-4 text-gray-400 text-sm">{l.lastActivity?new Date(l.lastActivity).toLocaleDateString('fr-FR'):'-'}</td>
                      <td className="p-4 text-right"><Button variant="ghost" size="sm" icon="Eye" onClick={()=>openLearnerDetail(l)}>Détails</Button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>
        )}

        {/* Par cours */}
        {activeTab==='courses'&&(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {courses.map(c=>{
              const cEnr=enrollments.filter(e=>e.playlist_id===c.id);
              const completed=cEnr.filter(e=>e.status==='completed').length;
              const inProgress=cEnr.filter(e=>e.status==='in_progress').length;
              const avgProgress=cEnr.length>0?Math.round(cEnr.reduce((a,e)=>a+(e.progress_percent||0),0)/cEnr.length):0;
              const totalTime=cEnr.reduce((a,e)=>a+(e.time_spent_seconds||0),0);
              return(
                <Card key={c.id} className="p-4">
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-12 h-12 bg-indigo-500/20 rounded-lg flex items-center justify-center"><Icon name="BookOpen" size={24} className="text-indigo-400"/></div>
                    <div className="flex-1 min-w-0"><h3 className="font-semibold truncate">{c.title}</h3><p className="text-sm text-gray-400">{cEnr.length} inscrit{cEnr.length>1?'s':''}</p></div>
                  </div>
                  <div className="space-y-3">
                    <div className="flex justify-between text-sm"><span className="text-gray-400">Progression moyenne</span><span className="font-medium">{avgProgress}%</span></div>
                    <ProgressBar percent={avgProgress} size="sm" showLabel={false}/>
                    <div className="grid grid-cols-3 gap-2 text-center text-sm">
                      <div className="p-2 bg-green-500/10 rounded"><p className="text-green-400 font-bold">{completed}</p><p className="text-xs text-gray-500">Terminés</p></div>
                      <div className="p-2 bg-yellow-500/10 rounded"><p className="text-yellow-400 font-bold">{inProgress}</p><p className="text-xs text-gray-500">En cours</p></div>
                      <div className="p-2 bg-blue-500/10 rounded"><p className="text-blue-400 font-bold">{formatDuration(totalTime)}</p><p className="text-xs text-gray-500">Temps</p></div>
                    </div>
                  </div>
                </Card>
              );
            })}
          </div>
        )}

        {/* Parcours */}
        {activeTab==='paths'&&(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {paths.length===0?<div className="col-span-full"><Empty icon="Route" title="Aucun parcours"/></div>:
            paths.map(p=>{
              const pEnr=pathEnrollments.filter(pe=>pe.path_id===p.id);
              const completed=pEnr.filter(pe=>pe.status==='completed'||pe.progress_percent===100).length;
              const inProgress=pEnr.filter(pe=>pe.progress_percent>0&&pe.progress_percent<100).length;
              const avgProgress=pEnr.length>0?Math.round(pEnr.reduce((a,pe)=>a+(pe.progress_percent||0),0)/pEnr.length):0;
              const totalTime=pEnr.reduce((a,pe)=>a+(pe.time_spent_seconds||0),0);
              return(
                <Card key={p.id} className="p-4">
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-12 h-12 bg-purple-500/20 rounded-lg flex items-center justify-center"><Icon name="Route" size={24} className="text-purple-400"/></div>
                    <div className="flex-1 min-w-0"><h3 className="font-semibold truncate">{p.title}</h3><p className="text-sm text-gray-400">{pEnr.length} inscrit{pEnr.length>1?'s':''}</p></div>
                  </div>
                  <div className="space-y-3">
                    <div className="flex justify-between text-sm"><span className="text-gray-400">Progression moyenne</span><span className="font-medium">{avgProgress}%</span></div>
                    <ProgressBar percent={avgProgress} size="sm" showLabel={false}/>
                    <div className="grid grid-cols-3 gap-2 text-center text-sm">
                      <div className="p-2 bg-green-500/10 rounded"><p className="text-green-400 font-bold">{completed}</p><p className="text-xs text-gray-500">Terminés</p></div>
                      <div className="p-2 bg-yellow-500/10 rounded"><p className="text-yellow-400 font-bold">{inProgress}</p><p className="text-xs text-gray-500">En cours</p></div>
                      <div className="p-2 bg-blue-500/10 rounded"><p className="text-blue-400 font-bold">{formatDuration(totalTime)}</p><p className="text-xs text-gray-500">Temps</p></div>
                    </div>
                  </div>
                </Card>
              );
            })}
          </div>
        )}

        {/* SCORM */}
        {activeTab==='scorm'&&(
          <Card>
            <div className="overflow-x-auto">
              <table className="w-full">
                <thead className="bg-gray-750"><tr>
                  <th className="text-left p-4 font-medium text-gray-400">Apprenant</th>
                  <th className="text-left p-4 font-medium text-gray-400">Module</th>
                  <th className="text-left p-4 font-medium text-gray-400">Statut</th>
                  <th className="text-left p-4 font-medium text-gray-400">Score</th>
                  <th className="text-left p-4 font-medium text-gray-400">Temps</th>
                  <th className="text-left p-4 font-medium text-gray-400">Date</th>
                </tr></thead>
                <tbody className="divide-y divide-gray-700">
                  {scormProgress.length===0?<tr><td colSpan="6" className="p-8 text-center text-gray-500">Aucune donnée SCORM</td></tr>:
                  scormProgress.slice(0,100).map(s=>{
                    const l=learners.find(x=>x.id===s.learner_id);
                    const m=modules.find(x=>x.id===s.module_id);
                    return(
                      <tr key={s.id} className="hover:bg-gray-750/50">
                        <td className="p-4"><p className="font-medium">{l?l.first_name+' '+l.last_name:'Inconnu'}</p><p className="text-sm text-gray-400">{l?.email}</p></td>
                        <td className="p-4">{m?.title||'Module '+s.module_id}</td>
                        <td className="p-4"><ScormStatusBadge status={s.completion_status}/></td>
                        <td className="p-4"><ScoreBadge score={s.score_scaled}/></td>
                        <td className="p-4 text-blue-400">{formatDuration(parseScormTime(s.total_time))}</td>
                        <td className="p-4 text-gray-400 text-sm">{s.last_accessed_at?new Date(s.last_accessed_at).toLocaleDateString('fr-FR'):'-'}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {scormProgress.length>100&&<p className="p-4 text-center text-gray-500 text-sm">Affichage limité à 100 résultats</p>}
            </div>
          </Card>
        )}

        {/* Quiz */}
        {activeTab==='quiz'&&(
          <Card>
            <div className="overflow-x-auto">
              <table className="w-full">
                <thead className="bg-gray-750"><tr>
                  <th className="text-left p-4 font-medium text-gray-400">Apprenant</th>
                  <th className="text-left p-4 font-medium text-gray-400">Quiz</th>
                  <th className="text-left p-4 font-medium text-gray-400">Score</th>
                  <th className="text-left p-4 font-medium text-gray-400">Résultat</th>
                  <th className="text-left p-4 font-medium text-gray-400">Date</th>
                </tr></thead>
                <tbody className="divide-y divide-gray-700">
                  {quizAttempts.length===0?<tr><td colSpan="5" className="p-8 text-center text-gray-500">Aucune tentative de quiz</td></tr>:
                  quizAttempts.slice(0,100).map(q=>{
                    const l=learners.find(x=>x.id===q.learner_id);
                    return(
                      <tr key={q.id} className="hover:bg-gray-750/50">
                        <td className="p-4"><p className="font-medium">{l?l.first_name+' '+l.last_name:'Inconnu'}</p><p className="text-sm text-gray-400">{l?.email}</p></td>
                        <td className="p-4">{q.quizzes?.title||'Quiz'}</td>
                        <td className="p-4"><span className={`font-semibold ${q.score_percent>=70?'text-green-400':q.score_percent>=50?'text-yellow-400':'text-red-400'}`}>{q.score_percent||0}%</span></td>
                        <td className="p-4">{q.passed?<span className="px-2 py-1 bg-green-500/20 text-green-400 rounded text-xs">Réussi</span>:<span className="px-2 py-1 bg-red-500/20 text-red-400 rounded text-xs">Échoué</span>}</td>
                        <td className="p-4 text-gray-400 text-sm">{q.created_at?new Date(q.created_at).toLocaleDateString('fr-FR'):'-'}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {quizAttempts.length>100&&<p className="p-4 text-center text-gray-500 text-sm">Affichage limité à 100 résultats</p>}
            </div>
          </Card>
        )}

        {/* Modal détail apprenant */}
        <Modal isOpen={!!selectedLearner} onClose={()=>setSelectedLearner(null)} title={selectedLearner?`${selectedLearner.first_name} ${selectedLearner.last_name}`:''} size="xl">
          {selectedLearner&&(
            <div className="space-y-6">
              {/* Stats résumé */}
              <div className="grid grid-cols-5 gap-4">
                <div className="text-center p-3 bg-gray-700/50 rounded-lg">
                  <p className="text-2xl font-bold text-indigo-400">{selectedLearner.coursesCompleted}/{selectedLearner.coursesTotal}</p>
                  <p className="text-xs text-gray-400">Cours</p>
                </div>
                <div className="text-center p-3 bg-gray-700/50 rounded-lg">
                  <p className="text-2xl font-bold text-purple-400">{selectedLearner.pathsCompleted}/{selectedLearner.pathsTotal}</p>
                  <p className="text-xs text-gray-400">Parcours</p>
                </div>
                <div className="text-center p-3 bg-gray-700/50 rounded-lg">
                  <p className="text-2xl font-bold text-orange-400">{selectedLearner.scormPassed}/{selectedLearner.scormTotal}</p>
                  <p className="text-xs text-gray-400">SCORM</p>
                </div>
                <div className="text-center p-3 bg-gray-700/50 rounded-lg">
                  <p className="text-2xl font-bold text-pink-400">{selectedLearner.quizPassed}/{selectedLearner.quizTotal}</p>
                  <p className="text-xs text-gray-400">Quiz</p>
                </div>
                <div className="text-center p-3 bg-gray-700/50 rounded-lg">
                  <p className="text-2xl font-bold text-cyan-400">{formatDuration(selectedLearner.totalTime)}</p>
                  <p className="text-xs text-gray-400">Temps</p>
                </div>
              </div>
              
              {/* Cours */}
              <div>
                <h4 className="font-semibold mb-3">Cours ({selectedLearner.enrollments.length})</h4>
                <div className="space-y-2 max-h-40 overflow-y-auto">
                  {selectedLearner.enrollments.length===0?<p className="text-gray-500 text-sm">Aucun cours</p>:
                  selectedLearner.enrollments.map(e=>(
                    <div key={e.id} className="flex items-center justify-between p-3 bg-gray-700/50 rounded-lg">
                      <div className="flex-1"><p className="font-medium">{e.playlists?.title}</p></div>
                      <div className="flex items-center gap-3">
                        <div className="w-24"><ProgressBar percent={e.progress_percent||0} size="sm" showLabel={false}/></div>
                        <span className="text-sm w-12 text-right">{e.progress_percent||0}%</span>
                        <span className={`px-2 py-1 rounded text-xs ${e.status==='completed'?'bg-green-500/20 text-green-400':e.status==='in_progress'?'bg-yellow-500/20 text-yellow-400':'bg-gray-500/20 text-gray-400'}`}>
                          {e.status==='completed'?'Terminé':e.status==='in_progress'?'En cours':'Non commencé'}
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
              
              {/* Parcours */}
              {selectedLearner.pathEnrollments.length>0&&(
                <div>
                  <h4 className="font-semibold mb-3">Parcours ({selectedLearner.pathEnrollments.length})</h4>
                  <div className="space-y-2 max-h-40 overflow-y-auto">
                    {selectedLearner.pathEnrollments.map(pe=>(
                      <div key={pe.id} className="flex items-center justify-between p-3 bg-gray-700/50 rounded-lg">
                        <div className="flex-1"><p className="font-medium">{pe.learning_paths?.title||'Parcours'}</p></div>
                        <div className="flex items-center gap-3">
                          <div className="w-24"><ProgressBar percent={pe.progress_percent||0} size="sm" showLabel={false}/></div>
                          <span className="text-sm w-12 text-right">{pe.progress_percent||0}%</span>
                          <span className={`px-2 py-1 rounded text-xs ${pe.status==='completed'||pe.progress_percent===100?'bg-green-500/20 text-green-400':pe.progress_percent>0?'bg-yellow-500/20 text-yellow-400':'bg-gray-500/20 text-gray-400'}`}>
                            {pe.status==='completed'||pe.progress_percent===100?'Terminé':pe.progress_percent>0?'En cours':'Non commencé'}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              
              {/* SCORM */}
              {selectedLearner.scormProgress.length>0&&(
                <div>
                  <h4 className="font-semibold mb-3">Modules SCORM ({selectedLearner.scormProgress.length})</h4>
                  <div className="space-y-2 max-h-40 overflow-y-auto">
                    {selectedLearner.scormProgress.map(s=>{
                      const m=modules.find(x=>x.id===s.module_id);
                      return(
                        <div key={s.id} className="flex items-center justify-between p-3 bg-gray-700/50 rounded-lg">
                          <p className="font-medium">{m?.title||'Module'}</p>
                          <div className="flex items-center gap-3">
                            <ScoreBadge score={s.score_scaled}/>
                            <ScormStatusBadge status={s.completion_status}/>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
              
              {/* Quiz */}
              {selectedLearner.quizAttempts.length>0&&(
                <div>
                  <h4 className="font-semibold mb-3">Quiz ({selectedLearner.quizAttempts.length})</h4>
                  <div className="space-y-2 max-h-40 overflow-y-auto">
                    {selectedLearner.quizAttempts.map(q=>(
                      <div key={q.id} className="flex items-center justify-between p-3 bg-gray-700/50 rounded-lg">
                        <p className="font-medium">{q.quizzes?.title||'Quiz'}</p>
                        <div className="flex items-center gap-3">
                          <span className={`font-semibold ${q.score_percent>=70?'text-green-400':'text-red-400'}`}>{q.score_percent}%</span>
                          {q.passed?<span className="px-2 py-1 bg-green-500/20 text-green-400 rounded text-xs">Réussi</span>:<span className="px-2 py-1 bg-red-500/20 text-red-400 rounded text-xs">Échoué</span>}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </Modal>
      </div>;
    }
    function AnalyticsPage(){
      const{can,center,isSuperAdmin}=useAuth();
      const[data,setData]=useState({enrollments:[],courses:[],summary:{},learnerStats:[]});
      const[loading,setLoading]=useState(true);
      const[filter,setFilter]=useState({course:'all',period:'all'});
      const[selectedLearner,setSelectedLearner]=useState(null);
      const progressChartRef=useRef(null);
      const statusChartRef=useRef(null);
      const courseChartRef=useRef(null);
      const chartsRef=useRef({});

      // Fonction pour formater le temps
      const formatTime=(seconds)=>{
        if(!seconds||seconds===0)return'-';
        const h=Math.floor(seconds/3600);
        const m=Math.floor((seconds%3600)/60);
        const s=seconds%60;
        if(h>0)return `${h}h ${m}min`;
        if(m>0)return `${m}min ${s}s`;
        return `${s}s`;
      };

      const load=useCallback(async()=>{
        // Charger les inscriptions avec détails
        let q=supabase.from('enrollments').select(`
          *,
          playlists:playlist_id(id,title,center_id),
          profiles:learner_id(id,first_name,last_name,email)
        `);
        if(!isSuperAdmin&&center?.id){
          q=q.eq('playlists.center_id',center.id);
        }
        const{data:enrollments}=await q;
        
        // Charger les cours
        let qc=supabase.from('playlists').select('id,title,is_published');
        if(!isSuperAdmin&&center?.id)qc=qc.eq('center_id',center.id);
        const{data:courses}=await qc;
        
        // Charger les sessions de cours pour le temps total
        let qs=supabase.from('course_sessions').select('*');
        if(!isSuperAdmin&&center?.id){
          // Filtrer par les enrollments du centre
          const enrollmentIds=(enrollments||[]).filter(e=>e.playlists).map(e=>e.id);
          if(enrollmentIds.length>0)qs=qs.in('enrollment_id',enrollmentIds);
        }
        const{data:sessions}=await qs;
        
        // Charger les scores SCORM
        const learnerIds=[...new Set((enrollments||[]).map(e=>e.learner_id).filter(Boolean))];
        let scormData=[];
        if(learnerIds.length>0){
          const{data:sp}=await supabase.from('scorm_progress').select('*').in('learner_id',learnerIds);
          scormData=sp||[];
        }
        
        // Charger les tentatives de quiz
        let quizData=[];
        if(learnerIds.length>0){
          const{data:qa}=await supabase.from('quiz_attempts').select('*').in('learner_id',learnerIds);
          quizData=qa||[];
        }

        // Calculer les statistiques par apprenant
        const learnerStats=learnerIds.map(learnerId=>{
          const learnerEnrollments=(enrollments||[]).filter(e=>e.learner_id===learnerId);
          const profile=learnerEnrollments[0]?.profiles;
          const totalTime=learnerEnrollments.reduce((a,e)=>a+(e.time_spent_seconds||0),0);
          const completedCourses=learnerEnrollments.filter(e=>e.status==='completed').length;
          const learnerScorm=scormData.filter(s=>s.learner_id===learnerId);
          const learnerQuiz=quizData.filter(q=>q.learner_id===learnerId);
          const avgScormScore=learnerScorm.length>0?learnerScorm.reduce((a,s)=>a+(s.score_scaled||0)*100,0)/learnerScorm.length:null;
          const avgQuizScore=learnerQuiz.length>0?learnerQuiz.reduce((a,q)=>a+(q.score_percent||0),0)/learnerQuiz.length:null;
          const lastActivity=learnerEnrollments.reduce((latest,e)=>{
            const d=new Date(e.updated_at);
            return d>latest?d:latest;
          },new Date(0));
          
          return{
            id:learnerId,
            name:profile?`${profile.first_name} ${profile.last_name}`:'Inconnu',
            email:profile?.email||'',
            totalCourses:learnerEnrollments.length,
            completedCourses,
            totalTime,
            avgProgress:learnerEnrollments.length>0?Math.round(learnerEnrollments.reduce((a,e)=>a+(e.progress_percent||0),0)/learnerEnrollments.length):0,
            avgScormScore,
            avgQuizScore,
            lastActivity:lastActivity.getTime()>0?lastActivity:null,
            enrollments:learnerEnrollments
          };
        }).sort((a,b)=>b.totalTime-a.totalTime);

        // Calculer les statistiques globales
        const validEnrollments=(enrollments||[]).filter(e=>e.playlists&&e.profiles);
        const totalTimeAll=validEnrollments.reduce((a,e)=>a+(e.time_spent_seconds||0),0);
        const summary={
          total:validEnrollments.length,
          notStarted:validEnrollments.filter(e=>e.status==='not_started').length,
          inProgress:validEnrollments.filter(e=>e.status==='in_progress').length,
          completed:validEnrollments.filter(e=>e.status==='completed').length,
          avgProgress:validEnrollments.length?Math.round(validEnrollments.reduce((a,e)=>a+(e.progress_percent||0),0)/validEnrollments.length):0,
          totalTime:totalTimeAll,
          avgTimePerCourse:validEnrollments.length>0?Math.round(totalTimeAll/validEnrollments.length):0,
          learnersCount:learnerIds.length
        };

        setData({enrollments:validEnrollments,courses:courses||[],summary,learnerStats});
        setLoading(false);
      },[isSuperAdmin,center?.id]);

      useEffect(()=>{load();},[load]);

      // Créer les graphiques
      useEffect(()=>{
        if(loading||!data.enrollments.length)return;

        // Détruire les anciens graphiques
        Object.values(chartsRef.current).forEach(chart=>chart?.destroy());
        chartsRef.current={};

        // Graphique de statut (Doughnut)
        if(statusChartRef.current){
          const ctx=statusChartRef.current.getContext('2d');
          chartsRef.current.status=new Chart(ctx,{
            type:'doughnut',
            data:{
              labels:['Non commencé','En cours','Terminé'],
              datasets:[{
                data:[data.summary.notStarted,data.summary.inProgress,data.summary.completed],
                backgroundColor:['#6b7280','#eab308','#22c55e'],
                borderWidth:0
              }]
            },
            options:{
              responsive:true,
              maintainAspectRatio:false,
              plugins:{legend:{position:'bottom',labels:{color:'#9ca3af'}}}
            }
          });
        }

        // Graphique par cours (Bar)
        if(courseChartRef.current){
          const courseStats=data.courses.map(c=>{
            const courseEnrollments=data.enrollments.filter(e=>e.playlist_id===c.id);
            return{
              title:c.title,
              count:courseEnrollments.length,
              avgProgress:courseEnrollments.length?Math.round(courseEnrollments.reduce((a,e)=>a+(e.progress_percent||0),0)/courseEnrollments.length):0
            };
          });
          
          const ctx=courseChartRef.current.getContext('2d');
          chartsRef.current.course=new Chart(ctx,{
            type:'bar',
            data:{
              labels:courseStats.map(c=>c.title.length>20?c.title.substring(0,20)+'...':c.title),
              datasets:[
                {label:'Inscrits',data:courseStats.map(c=>c.count),backgroundColor:'#6366f1'},
                {label:'Progression moy. %',data:courseStats.map(c=>c.avgProgress),backgroundColor:'#22c55e'}
              ]
            },
            options:{
              responsive:true,
              maintainAspectRatio:false,
              scales:{
                x:{ticks:{color:'#9ca3af'},grid:{color:'#374151'}},
                y:{ticks:{color:'#9ca3af'},grid:{color:'#374151'}}
              },
              plugins:{legend:{labels:{color:'#9ca3af'}}}
            }
          });
        }

        // Graphique de progression (Line)
        if(progressChartRef.current){
          const ranges=['0-25%','26-50%','51-75%','76-100%'];
          const progressData=[
            data.enrollments.filter(e=>(e.progress_percent||0)<=25).length,
            data.enrollments.filter(e=>(e.progress_percent||0)>25&&(e.progress_percent||0)<=50).length,
            data.enrollments.filter(e=>(e.progress_percent||0)>50&&(e.progress_percent||0)<=75).length,
            data.enrollments.filter(e=>(e.progress_percent||0)>75).length
          ];
          
          const ctx=progressChartRef.current.getContext('2d');
          chartsRef.current.progress=new Chart(ctx,{
            type:'bar',
            data:{
              labels:ranges,
              datasets:[{label:'Nombre d\'apprenants',data:progressData,backgroundColor:'#8b5cf6'}]
            },
            options:{
              responsive:true,
              maintainAspectRatio:false,
              scales:{
                x:{ticks:{color:'#9ca3af'},grid:{color:'#374151'}},
                y:{ticks:{color:'#9ca3af'},grid:{color:'#374151'}}
              },
              plugins:{legend:{display:false}}
            }
          });
        }

        return()=>{
          Object.values(chartsRef.current).forEach(chart=>chart?.destroy());
        };
      },[loading,data]);

      // Filtrer les données
      const filteredEnrollments=data.enrollments.filter(e=>{
        if(filter.course!=='all'&&e.playlist_id!==filter.course)return false;
        return true;
      });

      // Export Excel complet
      const exportExcel=()=>{
        // Feuille 1: Détail des inscriptions
        const exportData=filteredEnrollments.map(e=>({
          'Apprenant':e.profiles?.first_name+' '+e.profiles?.last_name,
          'Email':e.profiles?.email,
          'Cours':e.playlists?.title,
          'Progression (%)':e.progress_percent||0,
          'Temps passé':formatTime(e.time_spent_seconds),
          'Temps (secondes)':e.time_spent_seconds||0,
          'Statut':e.status==='not_started'?'Non commencé':e.status==='in_progress'?'En cours':'Terminé',
          'Date inscription':new Date(e.created_at).toLocaleDateString('fr-FR'),
          'Dernière activité':e.updated_at?new Date(e.updated_at).toLocaleDateString('fr-FR'):'-'
        }));
        
        // Feuille 2: Statistiques par apprenant
        const learnerExport=data.learnerStats.map(l=>({
          'Apprenant':l.name,
          'Email':l.email,
          'Cours inscrits':l.totalCourses,
          'Cours terminés':l.completedCourses,
          'Progression moyenne (%)':l.avgProgress,
          'Temps total':formatTime(l.totalTime),
          'Temps total (secondes)':l.totalTime,
          'Score SCORM moyen (%)':l.avgScormScore!==null?Math.round(l.avgScormScore):'-',
          'Score Quiz moyen (%)':l.avgQuizScore!==null?Math.round(l.avgQuizScore):'-',
          'Dernière activité':l.lastActivity?new Date(l.lastActivity).toLocaleDateString('fr-FR'):'-'
        }));
        
        // Feuille 3: Résumé global
        const summaryExport=[{
          'Métrique':'Total inscriptions','Valeur':data.summary.total
        },{
          'Métrique':'Apprenants uniques','Valeur':data.summary.learnersCount
        },{
          'Métrique':'Cours terminés','Valeur':data.summary.completed
        },{
          'Métrique':'Taux de complétion (%)','Valeur':data.summary.total?Math.round((data.summary.completed/data.summary.total)*100):0
        },{
          'Métrique':'Progression moyenne (%)','Valeur':data.summary.avgProgress
        },{
          'Métrique':'Temps total passé','Valeur':formatTime(data.summary.totalTime)
        },{
          'Métrique':'Temps moyen par cours','Valeur':formatTime(data.summary.avgTimePerCourse)
        }];
        
        const wb=XLSX.utils.book_new();
        const ws1=XLSX.utils.json_to_sheet(exportData);
        const ws2=XLSX.utils.json_to_sheet(learnerExport);
        const ws3=XLSX.utils.json_to_sheet(summaryExport);
        XLSX.utils.book_append_sheet(wb,ws1,'Inscriptions');
        XLSX.utils.book_append_sheet(wb,ws2,'Par apprenant');
        XLSX.utils.book_append_sheet(wb,ws3,'Résumé');
        XLSX.writeFile(wb,`statistiques_${new Date().toISOString().split('T')[0]}.xlsx`);
      };

      if(!can('view_analytics'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading text="Chargement des statistiques..."/>;

      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4">
          <h1 className="text-2xl font-bold">Statistiques</h1>
          <div className="flex gap-2">
            <Select value={filter.course} onChange={e=>setFilter({...filter,course:e.target.value})} options={[{value:'all',label:'Tous les cours'},...data.courses.map(c=>({value:c.id,label:c.title}))]}/>
            {can('export_reports')&&<Button icon="Download" variant="secondary" onClick={exportExcel}>Exporter Excel</Button>}
          </div>
        </div>

        {/* Cartes résumé */}
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <Card className="p-4"><div className="text-gray-400 text-sm">Apprenants</div><div className="text-2xl font-bold">{data.summary.learnersCount}</div></Card>
          <Card className="p-4"><div className="text-gray-400 text-sm">Inscriptions</div><div className="text-2xl font-bold">{data.summary.total}</div></Card>
          <Card className="p-4"><div className="text-gray-400 text-sm">Terminés</div><div className="text-2xl font-bold text-green-500">{data.summary.completed}</div></Card>
          <Card className="p-4"><div className="text-gray-400 text-sm">Progression moy.</div><div className="text-2xl font-bold text-indigo-500">{data.summary.avgProgress}%</div></Card>
        </div>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <Card className="p-4"><div className="text-gray-400 text-sm">Non commencés</div><div className="text-2xl font-bold text-gray-500">{data.summary.notStarted}</div></Card>
          <Card className="p-4"><div className="text-gray-400 text-sm">En cours</div><div className="text-2xl font-bold text-yellow-500">{data.summary.inProgress}</div></Card>
          <Card className="p-4"><div className="text-gray-400 text-sm flex items-center gap-1"><Icon name="Clock" size={14}/>Temps total</div><div className="text-2xl font-bold text-blue-500">{formatTime(data.summary.totalTime)}</div></Card>
          <Card className="p-4"><div className="text-gray-400 text-sm flex items-center gap-1"><Icon name="Clock" size={14}/>Temps moy./cours</div><div className="text-2xl font-bold text-blue-400">{formatTime(data.summary.avgTimePerCourse)}</div></Card>
        </div>

        {/* Graphiques */}
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
          <Card className="p-4">
            <h3 className="font-semibold mb-4">Répartition par statut</h3>
            <div className="h-64"><canvas ref={statusChartRef}/></div>
          </Card>
          <Card className="p-4 lg:col-span-2">
            <h3 className="font-semibold mb-4">Statistiques par cours</h3>
            <div className="h-64"><canvas ref={courseChartRef}/></div>
          </Card>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
          <Card className="p-4">
            <h3 className="font-semibold mb-4">Distribution des progressions</h3>
            <div className="h-64"><canvas ref={progressChartRef}/></div>
          </Card>
          <Card className="p-4">
            <h3 className="font-semibold mb-4">Taux de complétion</h3>
            <div className="h-64 flex items-center justify-center">
