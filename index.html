    // My Certificates Page
    function MyCertificatesPage(){
      const{user,profile}=useAuth();
      const[certificates,setCertificates]=useState([]);
      const[loading,setLoading]=useState(true);
      const[generating,setGenerating]=useState(null);

      useEffect(()=>{
        const load=async()=>{
          const{data}=await supabase.from('certificates').select('*,playlists(title),profiles:learner_id(first_name,last_name)').eq('learner_id',user.id).order('issued_at',{ascending:false});
          setCertificates(data||[]);
          setLoading(false);
        };
        load();
      },[user.id]);

      const generatePDF=async(cert)=>{
        setGenerating(cert.id);
        try{
          const{jsPDF}=window.jspdf;
          const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
          
          // Fond
          doc.setFillColor(31,41,55);
          doc.rect(0,0,297,210,'F');
          
          // Bordure
          doc.setDrawColor(99,102,241);
          doc.setLineWidth(3);
          doc.rect(10,10,277,190);
          doc.setLineWidth(1);
          doc.rect(15,15,267,180);
          
          // Titre
          doc.setTextColor(255,255,255);
          doc.setFontSize(40);
          doc.setFont('helvetica','bold');
          doc.text('CERTIFICAT DE REUSSITE',148.5,45,{align:'center'});
          
          // Ligne décorative
          doc.setDrawColor(99,102,241);
          doc.setLineWidth(2);
          doc.line(80,53,217,53);
          
          // Texte
          doc.setFontSize(16);
          doc.setFont('helvetica','normal');
          doc.setTextColor(156,163,175);
          doc.text('Ce certificat est decerne a',148.5,70,{align:'center'});
          
          // Nom
          doc.setFontSize(32);
          doc.setFont('helvetica','bold');
          doc.setTextColor(255,255,255);
          doc.text(`${cert.profiles?.first_name||''} ${cert.profiles?.last_name||''}`.trim()||'Apprenant',148.5,88,{align:'center'});
          
          // Texte suite
          doc.setFontSize(16);
          doc.setFont('helvetica','normal');
          doc.setTextColor(156,163,175);
          doc.text('pour avoir complete avec succes la formation',148.5,105,{align:'center'});
          
          // Titre du cours
          doc.setFontSize(24);
          doc.setFont('helvetica','bold');
          doc.setTextColor(99,102,241);
          doc.text(cert.playlists?.title||'Formation',148.5,122,{align:'center'});
          
          // Note et Durée (si disponibles)
          let yPos=140;
          if(cert.score!==null||cert.duration_seconds){
            doc.setFontSize(14);
            doc.setFont('helvetica','normal');
            
            const infos=[];
            if(cert.score!==null){
              infos.push(`Note obtenue: ${Math.round(cert.score)}%`);
            }
            if(cert.duration_seconds){
              infos.push(`Durée de formation: ${formatDuration(cert.duration_seconds)}`);
            }
            
            if(infos.length>0){
              // Cadre pour les infos
              const boxWidth=180;
              const boxHeight=infos.length*12+10;
              doc.setFillColor(55,65,81);
              doc.roundedRect(148.5-boxWidth/2,yPos-5,boxWidth,boxHeight,3,3,'F');
              
              doc.setTextColor(255,255,255);
              infos.forEach((info,i)=>{
                doc.text(info,148.5,yPos+8+i*12,{align:'center'});
              });
              
              yPos+=boxHeight+10;
            }
          }
          
          // Date et numéro
          doc.setFontSize(12);
          doc.setFont('helvetica','normal');
          doc.setTextColor(156,163,175);
          doc.text(`Date d'emission: ${new Date(cert.issued_at||cert.completed_at).toLocaleDateString('fr-FR')}`,148.5,yPos+5,{align:'center'});
          doc.text(`N° ${cert.certificate_number}`,148.5,yPos+15,{align:'center'});
          
          // Logo/Badge
          doc.setFillColor(99,102,241);
          doc.circle(148.5,190,8,'F');
          doc.setTextColor(255,255,255);
          doc.setFontSize(10);
          doc.text('V',148.5,193,{align:'center'});
          
          // Sauvegarder le PDF avec doc.save natif
          const fileName='certificat_'+cert.certificate_number+'.pdf';
          doc.save(fileName);
          setGenerating(null);
          
        }catch(err){
          console.error('Erreur PDF:',err);
          alert('Erreur lors de la generation du PDF');
          setGenerating(null);
        }
      };

      if(loading)return<Loading/>;

      return<div>
        <h1 className="text-2xl font-bold mb-6">Mes certificats</h1>
        
        {certificates.length===0?(
          <Empty icon="Award" title="Aucun certificat" desc="Complétez des cours pour obtenir vos certificats"/>
        ):(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {certificates.map(cert=>{
              const formatDur=(s)=>{if(!s)return null;const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);return h>0?`${h}h ${m}min`:`${m}min`;};
              return(
              <Card key={cert.id} className="overflow-hidden">
                <div className="h-32 bg-gradient-to-br from-indigo-600 to-purple-700 flex items-center justify-center relative">
                  <Icon name="Award" size={64} className="text-white/80"/>
                  {cert.score!==null&&(
                    <div className="absolute top-2 right-2 bg-white/20 backdrop-blur rounded-lg px-2 py-1">
                      <span className="text-white font-bold">{Math.round(cert.score)}%</span>
                    </div>
                  )}
                </div>
                <div className="p-4">
                  <h3 className="font-semibold mb-1">{cert.playlists?.title}</h3>
                  <p className="text-sm text-gray-400 mb-2">Obtenu le {new Date(cert.issued_at||cert.completed_at).toLocaleDateString('fr-FR')}</p>
                  <div className="flex flex-wrap gap-2 mb-3">
                    {cert.score!==null&&(
                      <span className="inline-flex items-center gap-1 px-2 py-1 bg-green-500/20 text-green-400 rounded text-xs">
                        <Icon name="Star" size={12}/> Note: {Math.round(cert.score)}%
                      </span>
                    )}
                    {cert.duration_seconds&&(
                      <span className="inline-flex items-center gap-1 px-2 py-1 bg-blue-500/20 text-blue-400 rounded text-xs">
                        <Icon name="Clock" size={12}/> {formatDur(cert.duration_seconds)}
                      </span>
                    )}
                  </div>
                  <p className="text-xs text-gray-500 mb-3">N° {cert.certificate_number}</p>
                  <Button icon="Download" size="sm" onClick={()=>generatePDF(cert)} loading={generating===cert.id}>
                    Télécharger PDF
                  </Button>
                </div>
              </Card>
            );})}
          </div>
        )}
      </div>;
    }

    // ============================================================
    // PAGE: Mon Suivi (MyProgressPage) - Tableau de bord apprenant complet
    // ============================================================
    function MyProgressPage(){
      const{user,profile}=useAuth();
      const[loading,setLoading]=useState(true);
      const[activeTab,setActiveTab]=useState('overview');
      
      // Données globales
      const[enrollments,setEnrollments]=useState([]);
      const[pathEnrollments,setPathEnrollments]=useState([]);
      const[videoProgress,setVideoProgress]=useState([]);
      const[scormProgress,setScormProgress]=useState([]);
      const[quizAttempts,setQuizAttempts]=useState([]);
      const[sessions,setSessions]=useState([]);
      
      // Stats calculées
      const[stats,setStats]=useState({
        totalCourses:0,completedCourses:0,
        totalPaths:0,completedPaths:0,
        totalVideos:0,watchedVideos:0,totalWatchTime:0,
        totalScorm:0,completedScorm:0,passedScorm:0,avgScormScore:0,
        totalQuizzes:0,passedQuizzes:0,avgQuizScore:0,
        totalSessionTime:0,sessionsCount:0,lastActivity:null
      });
      
      // Graphiques
      const activityChartRef=useRef(null);
      const progressChartRef=useRef(null);
      const chartsRef=useRef({});

      // Enregistrer la session actuelle
      useEffect(()=>{
        const sessionStart=new Date();
        const sessionId=`session_${Date.now()}`;
        
        // Enregistrer le début de session dans localStorage
        const existingSessions=JSON.parse(localStorage.getItem(`lms_sessions_${user.id}`)||'[]');
        existingSessions.push({id:sessionId,start:sessionStart.toISOString(),end:null});
        localStorage.setItem(`lms_sessions_${user.id}`,JSON.stringify(existingSessions.slice(-50))); // Garder les 50 dernières
        
        // À la fermeture, mettre à jour la fin de session
        const handleUnload=()=>{
          const sessions=JSON.parse(localStorage.getItem(`lms_sessions_${user.id}`)||'[]');
          const idx=sessions.findIndex(s=>s.id===sessionId);
          if(idx!==-1){
            sessions[idx].end=new Date().toISOString();
            sessions[idx].duration=Math.round((new Date()-sessionStart)/1000);
            localStorage.setItem(`lms_sessions_${user.id}`,JSON.stringify(sessions));
          }
        };
        
        window.addEventListener('beforeunload',handleUnload);
        return()=>{
          handleUnload();
          window.removeEventListener('beforeunload',handleUnload);
        };
      },[user.id]);

      const load=useCallback(async()=>{
        // Charger les inscriptions aux cours
        const{data:enr}=await supabase.from('enrollments').select('*,playlists:playlist_id(id,title)').eq('learner_id',user.id);
        setEnrollments(enr||[]);
        
        // Charger les inscriptions aux parcours
        const{data:pathEnr}=await supabase.from('path_enrollments').select('*,learning_paths(id,title,description)').eq('learner_id',user.id);
        
        // Charger la progression vidéo
        const{data:vp}=await supabase.from('video_progress').select('*').eq('learner_id',user.id);
        
        // Si pas de résultats par learner_id, essayer par enrollment_id
        let videoProgressData = vp || [];
        if(videoProgressData.length === 0 && enr?.length > 0) {
          const enrollmentIds = enr.map(e => e.id);
          const{data:vpByEnrollment} = await supabase.from('video_progress').select('*').in('enrollment_id', enrollmentIds);
          videoProgressData = vpByEnrollment || [];
        }
        
        // Charger les infos des vidéos si on a des progressions
        if(videoProgressData.length > 0) {
          const playlistVideoIds = [...new Set(videoProgressData.map(v => v.playlist_video_id).filter(Boolean))];
          if(playlistVideoIds.length > 0) {
            const{data:pvData} = await supabase.from('playlist_videos').select('id,video_id,videos(title,duration)').in('id', playlistVideoIds);
            const pvMap = {};
            (pvData||[]).forEach(pv => { pvMap[pv.id] = pv; });
            videoProgressData = videoProgressData.map(v => ({
              ...v,
              playlist_videos: pvMap[v.playlist_video_id] || null
            }));
          }
        }
        setVideoProgress(videoProgressData);
        
        // Charger la progression SCORM
        const{data:sp}=await supabase.from('scorm_progress').select('*').eq('learner_id',user.id);
        
        // Charger les infos des modules SCORM si on a des progressions
        let scormProgressData = sp || [];
        if(scormProgressData.length > 0) {
          const moduleIds = [...new Set(scormProgressData.map(s => s.module_id).filter(Boolean))];
          const enrollmentIds = [...new Set(scormProgressData.map(s => s.enrollment_id).filter(Boolean))];
          
          // Charger les modules SCORM
          let modulesMap = {};
          if(moduleIds.length > 0) {
            const{data:modules} = await supabase.from('scorm_modules').select('id,title,category').in('id', moduleIds);
            (modules||[]).forEach(m => { modulesMap[m.id] = m; });
          }
          
          // Charger les enrollments pour avoir les titres des cours
          let enrollmentsMap = {};
          if(enrollmentIds.length > 0) {
            const{data:enrollmentsData} = await supabase.from('enrollments').select('id,playlists:playlist_id(title)').in('id', enrollmentIds);
            (enrollmentsData||[]).forEach(e => { enrollmentsMap[e.id] = e; });
          }
          
          // Associer les données
          scormProgressData = scormProgressData.map(s => ({
            ...s,
            scorm_modules: modulesMap[s.module_id] || null,
            enrollments: enrollmentsMap[s.enrollment_id] || null
          }));
        }
        setScormProgress(scormProgressData);
        
        // Charger les tentatives de quiz
        const{data:qa}=await supabase.from('quiz_attempts').select('*').eq('learner_id',user.id);
        
        // Charger les infos des quiz si on a des tentatives
        let quizAttemptsData = qa || [];
        if(quizAttemptsData.length > 0) {
          const quizIds = [...new Set(quizAttemptsData.map(q => q.quiz_id).filter(Boolean))];
          if(quizIds.length > 0) {
            const{data:quizzes} = await supabase.from('quizzes').select('id,title,passing_score').in('id', quizIds);
            const quizzesMap = {};
            (quizzes||[]).forEach(q => { quizzesMap[q.id] = q; });
            quizAttemptsData = quizAttemptsData.map(q => ({
              ...q,
              quizzes: quizzesMap[q.quiz_id] || null
            }));
          }
        }
        setQuizAttempts(quizAttemptsData);
        
        // Charger les sessions depuis localStorage
        const localSessions=JSON.parse(localStorage.getItem(`lms_sessions_${user.id}`)||'[]');
        setSessions(localSessions);
        
        // Charger les sessions de cours depuis la base de données
        const{data:courseSessions}=await supabase.from('course_sessions').select('*').eq('learner_id',user.id);
        
        // Calculer les stats des parcours
        const pathStats={
          total:(pathEnr||[]).length,
          completed:(pathEnr||[]).filter(p=>p.progress_percent===100||p.status==='completed').length,
          inProgress:(pathEnr||[]).filter(p=>p.progress_percent>0&&p.progress_percent<100).length,
          totalTime:(pathEnr||[]).reduce((a,p)=>a+(p.time_spent_seconds||0),0)
        };
        
        // Calculer les stats
        const totalCourses=(enr||[]).length;
        const completedCourses=(enr||[]).filter(e=>e.status==='completed').length;
        const inProgressCourses=(enr||[]).filter(e=>e.status==='in_progress').length;
        
        // Temps passé sur les cours (depuis enrollments.time_spent_seconds)
        const totalCourseTime=(enr||[]).reduce((a,e)=>a+(e.time_spent_seconds||0),0);
        
        const totalVideos=videoProgressData.length;
        const watchedVideos=videoProgressData.filter(v=>v.is_completed).length;
        const inProgressVideos=videoProgressData.filter(v=>!v.is_completed&&v.last_position_seconds>0).length;
        const totalWatchTime=videoProgressData.reduce((a,v)=>a+(v.watch_time_seconds||0),0);
        
        const totalScorm=scormProgressData.length;
        const completedScorm=scormProgressData.filter(s=>s.completion_status==='completed'||s.completion_status==='passed').length;
        const inProgressScorm=scormProgressData.filter(s=>s.completion_status==='incomplete'||s.completion_status==='browsed').length;
        const passedScorm=scormProgressData.filter(s=>s.completion_status==='passed'||s.success_status==='passed').length;
        const scormWithScore=scormProgressData.filter(s=>s.score_scaled!==null&&s.score_scaled!==undefined);
        // Calculer le score moyen en gérant les deux formats (0-1 ou 0-100)
        const avgScormScore=scormWithScore.length>0?scormWithScore.reduce((a,s)=>{
          const score=s.score_scaled||0;
          return a+(score>1?score:score*100);
        },0)/scormWithScore.length:0;
        
        // Calculer le temps total passé sur les SCORM
        const totalScormTime=scormProgressData.reduce((a,s)=>a+parseScormTime(s.total_time),0);
        
        const quizzesTaken=[...new Set(quizAttemptsData.map(q=>q.quiz_id))].length;
        const passedQuizzes=quizAttemptsData.filter(q=>q.passed).length;
        const avgQuizScore=quizAttemptsData.length>0?quizAttemptsData.reduce((a,q)=>a+(q.score_percent||0),0)/quizAttemptsData.length:0;
        
        // Temps total = temps cours + temps SCORM (si pas déjà inclus)
        const sessionsWithDuration=localSessions.filter(s=>s.duration);
        const localSessionTime=sessionsWithDuration.reduce((a,s)=>a+(s.duration||0),0);
        const dbSessionTime=(courseSessions||[]).reduce((a,s)=>a+(s.duration_seconds||0),0);
        // Prioriser: temps des cours > temps DB > temps local
        const totalSessionTime=totalCourseTime>0?totalCourseTime:(dbSessionTime>0?dbSessionTime:localSessionTime);
        const sessionsCount=(courseSessions||[]).length||localSessions.length;
        
        // Dernière activité - utiliser last_accessed_at pour scorm_progress
        const dates=[
          ...(enr||[]).map(e=>e.updated_at),
          ...(pathEnr||[]).map(p=>p.updated_at),
          ...videoProgressData.map(v=>v.updated_at),
          ...scormProgressData.map(s=>s.last_accessed_at),
          ...quizAttemptsData.map(q=>q.created_at)
        ].filter(Boolean).sort((a,b)=>new Date(b)-new Date(a));
        const lastActivity=dates[0]||null;
        
        // Sauvegarder les parcours
        setPathEnrollments(pathEnr||[]);
        
        setStats({
          totalCourses,completedCourses,inProgressCourses,totalCourseTime,
          totalPaths:pathStats.total,completedPaths:pathStats.completed,inProgressPaths:pathStats.inProgress,pathTime:pathStats.totalTime,
          totalVideos,watchedVideos,inProgressVideos,totalWatchTime,
          totalScorm,completedScorm,inProgressScorm,passedScorm,avgScormScore,totalScormTime,
          totalQuizzes:quizzesTaken,passedQuizzes,avgQuizScore,
          totalSessionTime,sessionsCount,lastActivity
        });
        
        setLoading(false);
      },[user.id]);

      useEffect(()=>{load();},[load]);

      // Créer les graphiques
      useEffect(()=>{
        if(loading||activeTab!=='overview')return;
        
        // Détruire les anciens graphiques
        Object.values(chartsRef.current).forEach(c=>c?.destroy());
        chartsRef.current={};
        
        // Graphique d'activité par jour (7 derniers jours)
        if(activityChartRef.current){

            data:{

              scales:{

        }
        
        return()=>{

                    try{
                    // Export Excel avec SheetJS
                    var formatDate=function(d){return d?new Date(d).toLocaleDateString('fr-FR'):''};
                    var formatTime=function(s){
                      if(!s)return '';
                      var h=Math.floor(s/3600);
                      var m=Math.floor((s%3600)/60);
                      return h>0?(h+'h '+m+'min'):(m+'min');
                    };
                    
                    // Créer le workbook
                    var wb=XLSX.utils.book_new();
                    
                    // Feuille Cours
                    var coursesData=[['Cours','Statut','Progression','Temps passe','Date inscription']];
                    enrollments.forEach(function(e){
                      coursesData.push([
                        e.playlists?.title||'',
                        e.status||'',
                        (e.progress_percent||0)+'%',
                        formatTime(e.time_spent_seconds),
                        formatDate(e.created_at)
                      ]);
                    });
                    var wsCourses=XLSX.utils.aoa_to_sheet(coursesData);
                    wsCourses['!cols']=[{wch:40},{wch:15},{wch:12},{wch:15},{wch:15}];
                    XLSX.utils.book_append_sheet(wb,wsCourses,'Mes Cours');
                    
                    // Feuille Parcours
                    if(pathEnrollments.length>0){
                      var pathsData=[['Parcours','Progression','Temps passe','Date demarrage']];
                      pathEnrollments.forEach(function(p){
                        pathsData.push([
                          p.learning_paths?.title||'',
                          (p.progress_percent||0)+'%',
                          formatTime(p.time_spent_seconds),
                          formatDate(p.started_at)
                        ]);
                      });
                      var wsPaths=XLSX.utils.aoa_to_sheet(pathsData);
                      wsPaths['!cols']=[{wch:40},{wch:12},{wch:15},{wch:15}];
                      XLSX.utils.book_append_sheet(wb,wsPaths,'Mes Parcours');
                    }
                    
                    // Feuille SCORM
                    if(scormProgress.length>0){
                      var scormData=[['Module','Cours','Statut','Score','Temps','Date']];
                      scormProgress.forEach(function(s){
                        scormData.push([
                          s.scorm_modules?.title||'',
                          s.enrollments?.playlists?.title||'',
                          s.completion_status||'',
                          s.score_scaled?Math.round(s.score_scaled*100)+'%':'',
                          s.total_time||'',
                          formatDate(s.last_accessed_at)
                        ]);
                      });
                      var wsScorm=XLSX.utils.aoa_to_sheet(scormData);
                      wsScorm['!cols']=[{wch:35},{wch:30},{wch:12},{wch:10},{wch:12},{wch:12}];
                      XLSX.utils.book_append_sheet(wb,wsScorm,'Modules SCORM');
                    }
                    
                    // Feuille Videos
                    if(videoProgress.length>0){
                      var videosData=[['Video','Terminee','Temps visionne','Derniere vue']];
                      videoProgress.forEach(function(v){
                        videosData.push([
                          v.playlist_videos?.videos?.title||'',
                          v.is_completed?'Oui':'Non',
                          formatTime(v.watch_time_seconds),
                          formatDate(v.updated_at)
                        ]);
                      });
                      var wsVideos=XLSX.utils.aoa_to_sheet(videosData);
                      wsVideos['!cols']=[{wch:40},{wch:10},{wch:15},{wch:12}];
                      XLSX.utils.book_append_sheet(wb,wsVideos,'Videos');
                    }
                    
                    // Feuille Quiz
                    if(quizAttempts.length>0){
                      var quizData=[['Quiz','Score','Reussi','Date']];
                      quizAttempts.forEach(function(q){
                        quizData.push([
                          q.quizzes?.title||'',
                          (q.score_percent||0)+'%',
                          q.passed?'Oui':'Non',
                          formatDate(q.created_at)
                        ]);
                      });
                      var wsQuiz=XLSX.utils.aoa_to_sheet(quizData);
                      wsQuiz['!cols']=[{wch:40},{wch:10},{wch:10},{wch:12}];
                      XLSX.utils.book_append_sheet(wb,wsQuiz,'Quiz');
                    }
                    
                    // Telecharger
                    var filename='mes-donnees-'+user.email.replace('@','_').replace(/[^a-zA-Z0-9_.-]/g,'_')+'-'+new Date().toISOString().slice(0,10)+'.xlsx';
                    XLSX.writeFile(wb,filename);
                    }catch(err){console.error('Export Excel error:',err);alert('Erreur lors de l export Excel');}
                  }}
                >
                  Exporter en Excel
                </Button>
              </div>
              
              <p className="text-xs text-gray-500 mt-4">
                <Icon name="Info" size={12} className="inline mr-1"/>
                Les donnees exportees contiennent uniquement vos informations personnelles et votre progression d apprentissage.
              </p>
            </Card>
          </div>
        )}
      </div>;
    }

    // My Paths Page (Learner)
    function MyPathsPage(){
      const{user}=useAuth();
      const[paths,setPaths]=useState([]);
      const[loading,setLoading]=useState(true);

      useEffect(()=>{
        const load=async()=>{
          // Charger les parcours publiés avec inscription
          const{data:enrolledPaths}=await supabase.from('path_enrollments').select('*,learning_paths(*,learning_path_courses(count))').eq('learner_id',user.id);
          
          // Charger aussi les parcours publiés non inscrits
          const{data:allPaths}=await supabase.from('learning_paths').select('*,learning_path_courses(count)').eq('is_published',true);
          
          const enrolledIds=(enrolledPaths||[]).map(e=>e.path_id);
          const availablePaths=(allPaths||[]).filter(p=>!enrolledIds.includes(p.id)).map(p=>({...p,enrolled:false,progress_percent:0}));
          const myPaths=(enrolledPaths||[]).map(e=>({...e.learning_paths,enrolled:true,progress_percent:e.progress_percent,enrollment_id:e.id}));
          
          setPaths([...myPaths,...availablePaths]);
          setLoading(false);
        };
        load();
      },[user.id]);

      const enroll=async(pathId)=>{
        await supabase.from('path_enrollments').insert({path_id:pathId,learner_id:user.id,started_at:new Date().toISOString()});
        window.location.reload();
      };

      const difficultyLabels={beginner:'Débutant',intermediate:'Intermédiaire',advanced:'Avancé'};
      const difficultyColors={beginner:'bg-green-500/20 text-green-400',intermediate:'bg-yellow-500/20 text-yellow-400',advanced:'bg-red-500/20 text-red-400'};

      if(loading)return<Loading/>;

      return<div>
        <h1 className="text-2xl font-bold mb-6">Parcours de formation</h1>
        {paths.length===0?<Empty icon="Map" title="Aucun parcours disponible"/>:(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {paths.map(p=>(
              <Card key={p.id} className="overflow-hidden">
                <div className="h-32 bg-gradient-to-br from-purple-600 to-indigo-700 flex items-center justify-center relative">
                  <Icon name="Map" size={48} className="text-white/80"/>
                  {p.enrolled&&<div className="absolute top-2 right-2 px-2 py-1 bg-green-500 rounded text-xs font-medium">Inscrit</div>}
                </div>
                <div className="p-4">
                  <h3 className="font-semibold mb-2">{p.title}</h3>
                  <div className="flex items-center gap-2 mb-3">
                    <span className={`px-2 py-1 rounded text-xs ${difficultyColors[p.difficulty]}`}>{difficultyLabels[p.difficulty]}</span>
                    <span className="text-xs text-gray-400">{p.learning_path_courses?.[0]?.count||0} cours</span>
                    {p.estimated_duration&&<span className="text-xs text-gray-400">• {p.estimated_duration}</span>}
                  </div>
                  {p.enrolled?(<><ProgressBar percent={p.progress_percent||0} size="sm"/><p className="text-xs text-gray-400 mt-2">{p.progress_percent||0}% complété</p></>):(<Button className="w-full" onClick={()=>enroll(p.id)}>S'inscrire</Button>)}
                </div>
              </Card>
            ))}
          </div>
        )}
      </div>;
    }

    // My Badges Page (Learner)
    function MyBadgesPage(){
      const{user}=useAuth();
      const[earnedBadges,setEarnedBadges]=useState([]);
      const[allBadges,setAllBadges]=useState([]);
      const[points,setPoints]=useState(0);
      const[loading,setLoading]=useState(true);

      useEffect(()=>{
        const load=async()=>{
          const[{data:earned},{data:all},{data:pts}]=await Promise.all([
            supabase.from('learner_badges').select('*,badges(*)').eq('learner_id',user.id),
            supabase.from('badges').select('*').eq('is_active',true),
            supabase.from('learner_points').select('points').eq('learner_id',user.id)
          ]);
          setEarnedBadges(earned||[]);
          setAllBadges(all||[]);
          setPoints((pts||[]).reduce((sum,p)=>sum+p.points,0));
          setLoading(false);
        };
        load();
      },[user.id]);

      const colorClasses={gold:'bg-yellow-500',silver:'bg-gray-400',bronze:'bg-orange-600',purple:'bg-purple-500',blue:'bg-blue-500'};
      const earnedIds=earnedBadges.map(e=>e.badge_id);

      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6">
          <h1 className="text-2xl font-bold">Mes badges</h1>
          <div className="flex items-center gap-2 px-4 py-2 bg-indigo-600 rounded-lg">
            <Icon name="Zap" size={20}/>
            <span className="font-bold">{points} points</span>
          </div>
        </div>

        <div className="mb-8">
          <h2 className="text-lg font-semibold mb-4">Badges obtenus ({earnedBadges.length})</h2>
          {earnedBadges.length===0?<p className="text-gray-500">Aucun badge obtenu pour le moment</p>:(
            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
              {earnedBadges.map(e=>(
                <div key={e.id} className="text-center">
                  <div className={`w-16 h-16 mx-auto rounded-full ${colorClasses[e.badges?.color]} flex items-center justify-center mb-2`}>
                    <Icon name={e.badges?.icon} size={32} className="text-white"/>
                  </div>
                  <p className="font-medium text-sm">{e.badges?.name}</p>
                  <p className="text-xs text-gray-400">+{e.badges?.points} pts</p>
                </div>
              ))}
            </div>
          )}
        </div>

        <div>
          <h2 className="text-lg font-semibold mb-4">Badges à débloquer</h2>
          <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            {allBadges.filter(b=>!earnedIds.includes(b.id)).map(b=>(
              <div key={b.id} className="text-center opacity-40">
                <div className={`w-16 h-16 mx-auto rounded-full bg-gray-700 flex items-center justify-center mb-2`}>
                  <Icon name={b.icon} size={32} className="text-gray-500"/>
                </div>
                <p className="font-medium text-sm">{b.name}</p>
                <p className="text-xs text-gray-500">+{b.points} pts</p>
              </div>
            ))}
          </div>
        </div>
      </div>;
    }

    // Leaderboard Page
    function LeaderboardPage(){
      const{user,center,viewAs}=useAuth();
      const[leaderboard,setLeaderboard]=useState([]);
      const[loading,setLoading]=useState(true);
      const[myRank,setMyRank]=useState(null);
      
      // Utiliser le center_id effectif (réel ou simulé)
      const effectiveCenterId=viewAs?.center_id||center?.id;

      useEffect(()=>{
        const load=async()=>{
          // Filtrer par centre
          let profilesQuery=supabase.from('profiles').select('id,first_name,last_name,center_id').eq('role','learner');
          if(effectiveCenterId){
            profilesQuery=profilesQuery.eq('center_id',effectiveCenterId);
          }
          const{data:profiles}=await profilesQuery;
          
          const{data:points}=await supabase.from('learner_points').select('learner_id,points');
          const{data:badges}=await supabase.from('learner_badges').select('learner_id');
          
          const pointsMap={};
          (points||[]).forEach(p=>{pointsMap[p.learner_id]=(pointsMap[p.learner_id]||0)+p.points;});
          
          const badgesMap={};
          (badges||[]).forEach(b=>{badgesMap[b.learner_id]=(badgesMap[b.learner_id]||0)+1;});
          
          const ranked=(profiles||[]).map(p=>({
            ...p,
            total_points:pointsMap[p.id]||0,
            badge_count:badgesMap[p.id]||0
          })).sort((a,b)=>b.total_points-a.total_points).map((p,i)=>({...p,rank:i+1}));
          
          setLeaderboard(ranked.slice(0,20));
          setMyRank(ranked.find(r=>r.id===user.id));
          setLoading(false);
        };
        load();
      },[user.id,effectiveCenterId]);

      if(loading)return<Loading/>;

      return<div>
        <h1 className="text-2xl font-bold mb-6">Classement{center?.name?` - ${center.name}`:''}</h1>
        
        {myRank&&(
          <Card className="p-4 mb-6 bg-indigo-600/20 border-indigo-500">
            <div className="flex items-center gap-4">
              <div className="w-12 h-12 bg-indigo-600 rounded-full flex items-center justify-center text-xl font-bold">#{myRank.rank}</div>
              <div className="flex-1">
                <p className="font-semibold">Votre position</p>
                <p className="text-sm text-gray-400">{myRank.total_points} points • {myRank.badge_count} badges</p>
              </div>
            </div>
          </Card>
        )}

        <Card>
          <div className="divide-y divide-gray-700">
            {leaderboard.length===0?<p className="p-4 text-gray-500 text-center">Aucun apprenant dans ce centre</p>:leaderboard.map((l,i)=>(
              <div key={l.id} className={`flex items-center gap-4 p-4 ${l.id===user.id?'bg-indigo-600/10':''}`}>
                <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold ${i===0?'bg-yellow-500':i===1?'bg-gray-400':i===2?'bg-orange-600':'bg-gray-700'}`}>
                  {i<3?<Icon name={i===0?'Crown':'Medal'} size={20}/>:l.rank}
                </div>
                <div className="flex-1">
                  <p className="font-medium">{l.first_name} {l.last_name}</p>
                  <p className="text-sm text-gray-400">{l.badge_count} badges</p>
                </div>
                <div className="text-right">
                  <p className="font-bold text-indigo-400">{l.total_points}</p>
                  <p className="text-xs text-gray-500">points</p>
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>;
    }

    // App
    function App(){
      const{isAuth,loading}=useAuth();
      
      // Masquer l'écran de chargement quand React est prêt
      useEffect(()=>{
        if(!loading)hideLoadingScreen();
      },[loading]);
      
      if(loading)return null; // L'écran de chargement HTML est déjà visible
      if(!isAuth)return<LoginPage/>;
      return<AppLayout/>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AuthProvider><App/></AuthProvider>);
  </script>
</body>
</html>
