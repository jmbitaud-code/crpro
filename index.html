<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Course Builder Pro</title>
  <meta name="description" content="Plateforme de création et diffusion de cours vidéo multi-centres">
  <meta name="theme-color" content="#1f2937">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  
  <!-- CSS critique inline pour l'écran de chargement -->
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#111827}
    #loading-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111827;z-index:9999}
    #loading-screen .logo{width:64px;height:64px;background:#4f46e5;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
    #loading-screen .logo svg{width:32px;height:32px;color:white}
    #loading-screen h1{color:white;font-size:24px;font-weight:bold;margin:0 0 8px}
    #loading-screen p{color:#9ca3af;font-size:14px;margin:0 0 24px}
    #loading-screen .spinner{width:32px;height:32px;border:3px solid #374151;border-top-color:#4f46e5;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
    .animate-spin{animation:spin 1s linear infinite}
    @keyframes fade-in{from{opacity:0}to{opacity:1}}.animate-fade-in{animation:fade-in .2s ease-out}
    input,textarea,select,button{font-family:inherit}
    .progress-bar{transition:width 0.3s ease}
    .aspect-video iframe{position:absolute;top:0;left:0;width:100%;height:100%}
  </style>
</head>
<body>
  <!-- Écran de chargement -->
  <div id="loading-screen">
    <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
    <h1>Course Builder Pro</h1>
    <p>Chargement en cours...</p>
    <div class="spinner"></div>
  </div>
  
  <div id="root"></div>
  
  <!-- Scripts essentiels -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{gray:{750:'#2d3748',850:'#1a1f2e'}}}}}</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Scripts différés (chargés après) -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js" defer></script>
  <script src="https://player.vimeo.com/api/player.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  
  <script type="text/babel">
    const{useState,useEffect,useRef,createContext,useContext,useCallback,useMemo}=React;

    // ============ CONFIGURATION ============
    const SUPABASE_URL='https://ludepnnsvwvpfbdxweam.supabase.co';
    const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1ZGVwbm5zdnd2cGZiZHh3ZWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNjI4NjgsImV4cCI6MjA4NDYzODg2OH0.SYTPY5l4XwxOK19_p_Dlx3be29i_sxMQD3JLYgqjL2g';
    const APP_VERSION = '6.8.17';
    // =======================================

    // Masquer l'écran de chargement une fois React prêt
    const hideLoadingScreen=()=>{
      const el=document.getElementById('loading-screen');
      if(el)el.style.display='none';
    };

    // Convertir une durée "MM:SS" ou "HH:MM:SS" en secondes
    const parseDuration=(duration)=>{
      if(!duration)return 0;
      const parts=duration.split(':').map(Number);
      if(parts.length===2)return parts[0]*60+parts[1];
      if(parts.length===3)return parts[0]*3600+parts[1]*60+parts[2];
      return 0;
    };

    const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
    });
    
    // Exposer lms_origin globalement pour SCORM Dispatch (Codes Rousseau)
    window.lms_origin = window.location.origin;
    window.LMS_ORIGIN = window.location.origin;

    const ROLE_LABELS={super_admin:'Super Admin',center_admin:'Admin Centre',trainer:'Formateur',learner:'Apprenant'};
    const ROLE_COLORS={super_admin:'bg-red-500',center_admin:'bg-purple-500',trainer:'bg-green-500',learner:'bg-gray-500'};
    
    const PERMISSION_LABELS={
      manage_centers:'Gérer les centres',
      manage_users:'Gérer les utilisateurs',
      manage_videos:'Gérer les vidéos',
      manage_playlists:'Gérer les cours',
      manage_enrollments:'Gérer les inscriptions',
      view_analytics:'Voir les statistiques',
      export_reports:'Exporter les rapports',
      manage_permissions:'Gérer les permissions'
    };
    
    // Labels et couleurs SCORM
    const SCORM_STATUS_LABELS={
      'not attempted':'Non commencé',
      'incomplete':'En cours',
      'completed':'Terminé',
      'passed':'Réussi',
      'failed':'Échoué',
      'unknown':'Inconnu'
    };
    const SCORM_STATUS_COLORS={
      'not attempted':'bg-gray-500',
      'incomplete':'bg-yellow-500',
      'completed':'bg-green-500',
      'passed':'bg-green-500',
      'failed':'bg-red-500',
      'unknown':'bg-gray-500'
    };

    // Auth Context avec mode "Vue comme"
    const AuthContext=createContext(null);
    function AuthProvider({children}){
      const[user,setUser]=useState(null);
      const[profile,setProfile]=useState(null);
      const[center,setCenter]=useState(null);
      const[permissions,setPermissions]=useState({});
      const[loading,setLoading]=useState(true);
      
      // Mode "Vue comme" pour Super Admin
      const[viewAs,setViewAs]=useState(null);

      const loadProfile=useCallback(async(userId)=>{
        try{
          const{data,error:err}=await supabase.from('profiles').select('*,centers(*)').eq('id',userId).single();
          if(err)throw err;
          setProfile(data);
          setCenter(data?.centers);
          const{data:perms}=await supabase.from('role_permissions').select('permissions').eq('role',data?.role).single();
          setPermissions(perms?.permissions||{});
          return data;
        }catch(e){console.error('Erreur:',e);return null;}
      },[]);

      useEffect(()=>{
        let mounted=true;
        const init=async()=>{
          try{
            const{data:{session}}=await supabase.auth.getSession();
            if(mounted&&session?.user){setUser(session.user);await loadProfile(session.user.id);}
          }catch(e){console.error(e);}
          finally{if(mounted)setLoading(false);}
        };
        init();
        const{data:{subscription}}=supabase.auth.onAuthStateChange(async(event,session)=>{
          if(!mounted)return;
          if(event==='SIGNED_IN'&&session?.user){setUser(session.user);await loadProfile(session.user.id);}
          else if(event==='SIGNED_OUT'){setUser(null);setProfile(null);setCenter(null);setPermissions({});setViewAs(null);}
        });
        return()=>{mounted=false;subscription.unsubscribe();};
      },[loadProfile]);

      const signIn=async(email,password)=>{
        try{const{error:err}=await supabase.auth.signInWithPassword({email,password});if(err)throw err;return{success:true};}
        catch(e){return{success:false,error:e.message};}
      };
      const signOut=async()=>{setViewAs(null);await supabase.auth.signOut();};

      // Fonctions adaptées au mode "Vue comme"
      const realIsSuperAdmin=profile?.role==='super_admin';
      const can=(perm)=>realIsSuperAdmin||permissions[perm]===true;
      
      // Rôle effectif
      const effectiveRole=viewAs?.role||profile?.role;
      const effectiveCenter=viewAs?{id:viewAs.center_id,name:viewAs.center_name}:center;
      
      const isSuperAdmin=!viewAs&&realIsSuperAdmin;
      const isCenterAdmin=viewAs?(viewAs.role==='center_admin'||viewAs.role==='trainer'):(profile?.role==='center_admin'||profile?.role==='trainer');
      const isLearner=viewAs?viewAs.role==='learner':profile?.role==='learner';
      
      // Fonction pour changer de vue
      const switchView=(role,centerId,centerName)=>{
        if(!realIsSuperAdmin)return;
        if(role===null)setViewAs(null);
        else setViewAs({role,center_id:centerId,center_name:centerName});
      };
      const exitViewAs=()=>setViewAs(null);

      const value={
        user,profile,
        center:effectiveCenter,
        loading,signIn,signOut,
        isAuth:!!user,
        isSuperAdmin,
        realIsSuperAdmin,
        isCenterAdmin,
        isLearner,
        effectiveRole,
        role:effectiveRole||'learner',
        can,permissions,
        viewAs,switchView,exitViewAs,
        reload:async()=>{if(user)await loadProfile(user.id);}
      };
      return<AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
    }
    const useAuth=()=>useContext(AuthContext);

    // Icon
    const Icon=({name,size=20,className=''})=>{
      const ref=useRef(null);
      useEffect(()=>{if(ref.current&&lucide.icons[name]){ref.current.innerHTML='';const i=lucide.createElement(lucide.icons[name]);i.setAttribute('width',size);i.setAttribute('height',size);ref.current.appendChild(i);}},[name,size]);
      return<span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{width:size,height:size}}/>;
    };

    // UI Components
    const Button=({children,variant='primary',size='md',icon,loading,disabled,className='',...props})=>{
      const v={primary:'bg-indigo-600 hover:bg-indigo-700',secondary:'bg-gray-700 hover:bg-gray-600',ghost:'hover:bg-gray-700',success:'bg-green-600 hover:bg-green-700',danger:'bg-red-600 hover:bg-red-700'};
      const s={sm:'px-3 py-1.5 text-sm',md:'px-4 py-2',lg:'px-6 py-3'};
      return<button className={`inline-flex items-center justify-center gap-2 rounded-lg font-medium text-white transition disabled:opacity-50 ${v[variant]} ${s[size]} ${className}`} disabled={disabled||loading} {...props}>{loading?<Icon name="Loader2" size={16} className="animate-spin"/>:icon&&<Icon name={icon} size={16}/>}{children}</button>;
    };
    const Input=({label,error,icon,className='',...props})=>(<div className={className}>{label&&<label className="block text-sm font-medium text-gray-300 mb-1">{label}</label>}<div className="relative">{icon&&<div className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><Icon name={icon} size={18}/></div>}<input className={`w-full px-4 py-2.5 bg-gray-700 border rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 ${icon?'pl-10':''} ${error?'border-red-500':'border-gray-600'}`} {...props}/></div>{error&&<p className="text-red-400 text-sm mt-1">{error}</p>}</div>);
    const Select=({label,options,className='',...props})=>(<div className={className}>{label&&<label className="block text-sm font-medium text-gray-300 mb-1">{label}</label>}<select className="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 rounded-lg text-white" {...props}>{options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select></div>);
    const Checkbox=({label,checked,onChange,className=''})=>(<label className={`flex items-center gap-3 cursor-pointer ${className}`}><input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)} className="w-5 h-5 rounded bg-gray-700 border-gray-600 text-indigo-600 focus:ring-indigo-500"/><span className="text-gray-300">{label}</span></label>);
    const Modal=({isOpen,onClose,title,children,size='md'})=>{if(!isOpen)return null;const s={sm:'max-w-md',md:'max-w-lg',lg:'max-w-2xl',xl:'max-w-4xl',full:'max-w-6xl'};return(<div className="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in"><div className="absolute inset-0 bg-black/70" onClick={onClose}/><div className={`relative bg-gray-800 rounded-xl w-full ${s[size]} max-h-[90vh] overflow-auto`}><div className="sticky top-0 bg-gray-800 p-4 border-b border-gray-700 flex items-center justify-between z-10"><h2 className="text-lg font-semibold">{title}</h2><button onClick={onClose} className="p-2 hover:bg-gray-700 rounded-lg"><Icon name="X" size={20}/></button></div><div className="p-4">{children}</div></div></div>);};
    const Card=({children,className='',...props})=><div className={`bg-gray-800 rounded-xl border border-gray-700 ${className}`} {...props}>{children}</div>;
    const RoleBadge=({role})=><span className={`inline-flex px-2 py-1 rounded-full text-xs font-medium ${ROLE_COLORS[role]||'bg-gray-500'} text-white`}>{ROLE_LABELS[role]||role}</span>;
    
    // Score Badge pour SCORM
    const ScoreBadge=({score,showLabel=true})=>{
      if(score===null||score===undefined)return<span className="text-gray-500 text-sm">—</span>;
      const percent=Math.round(score*100);
      const color=percent>=70?'text-green-400':percent>=50?'text-yellow-400':'text-red-400';
      return<span className={`font-semibold ${color}`}>{percent}%{showLabel&&' score'}</span>;
    };
    
    // Status Badge pour SCORM
    const ScormStatusBadge=({status})=>{
      const label=SCORM_STATUS_LABELS[status]||status||'Inconnu';
      const color=SCORM_STATUS_COLORS[status]||'bg-gray-500';
      return<span className={`px-2 py-0.5 rounded text-xs font-medium ${color}`}>{label}</span>;
    };
    const Loading=({text})=><div className="flex flex-col items-center justify-center p-8"><div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"/>{text&&<p className="text-gray-400 mt-4">{text}</p>}</div>;
    const Empty=({icon,title,desc,action})=><div className="flex flex-col items-center justify-center p-8 text-center"><div className="text-gray-500 mb-4"><Icon name={icon} size={48}/></div><h3 className="text-lg font-medium text-gray-300">{title}</h3>{desc&&<p className="text-gray-500 mt-1">{desc}</p>}{action&&<div className="mt-4">{action}</div>}</div>;
    const Alert=({type='info',children})=>{const colors={info:'bg-blue-500/20 text-blue-300',success:'bg-green-500/20 text-green-300',warning:'bg-yellow-500/20 text-yellow-300',error:'bg-red-500/20 text-red-300'};return<div className={`p-4 rounded-lg ${colors[type]}`}>{children}</div>;};
    const ProgressBar=({percent,size='md',showLabel=true})=>{const h={sm:'h-2',md:'h-3',lg:'h-4'};return<div className="w-full"><div className={`w-full bg-gray-700 rounded-full ${h[size]}`}><div className={`bg-indigo-600 rounded-full ${h[size]} progress-bar`} style={{width:`${Math.min(100,Math.max(0,percent))}%`}}/></div>{showLabel&&<p className="text-sm text-gray-400 mt-1">{Math.round(percent)}% complété</p>}</div>;};

    // Login
    function LoginPage(){
      const{signIn}=useAuth();
      const[email,setEmail]=useState('');
      const[password,setPassword]=useState('');
      const[loading,setLoading]=useState(false);
      const[msg,setMsg]=useState(null);

      const handleSubmit=async e=>{
        e.preventDefault();setLoading(true);setMsg(null);
        const r=await signIn(email,password);
        if(!r.success)setMsg({type:'error',text:r.error});
        setLoading(false);
      };

      return(<div className="min-h-screen bg-gray-900 flex items-center justify-center p-4"><div className="w-full max-w-md"><div className="text-center mb-8"><div className="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-2xl mb-4"><Icon name="GraduationCap" size={32} className="text-white"/></div><h1 className="text-2xl font-bold text-white">Course Builder Pro</h1><p className="text-gray-400 mt-1">Plateforme de formation vidéo</p></div><Card className="p-6">{msg&&<Alert type={msg.type}>{msg.text}</Alert>}<form onSubmit={handleSubmit} className="space-y-4 mt-4"><Input label="Email" type="email" icon="Mail" value={email} onChange={e=>setEmail(e.target.value)} required/><Input label="Mot de passe" type="password" icon="Lock" value={password} onChange={e=>setPassword(e.target.value)} required/><Button type="submit" className="w-full" loading={loading}>Se connecter</Button></form></Card><p className="text-center text-gray-500 text-xs mt-4">v{APP_VERSION}</p></div></div>);
    }

    // Layout
    function AppLayout(){
      const{profile,signOut,center,can,isSuperAdmin,realIsSuperAdmin,viewAs,switchView,exitViewAs,effectiveRole,isLearner,isCenterAdmin}=useAuth();
      const[sidebarOpen,setSidebarOpen]=useState(window.innerWidth>=1024);
      const[page,setPage]=useState('dashboard');
      const[notifications,setNotifications]=useState([]);
      const[showNotifs,setShowNotifs]=useState(false);
      const[showViewAs,setShowViewAs]=useState(false);
      const[centers,setCenters]=useState([]);
      const[selectedCenter,setSelectedCenter]=useState('');
      const[selectedRole,setSelectedRole]=useState('center_admin');
      const isMobile=window.innerWidth<1024;
      
      // Charger les centres pour le mode "Vue comme"
      useEffect(()=>{
        if(realIsSuperAdmin){
          supabase.from('centers').select('id,name').order('name').then(({data})=>setCenters(data||[]));
        }
      },[realIsSuperAdmin]);
      
      // Reset page quand on change de vue
      useEffect(()=>{
        if(viewAs){
          if(viewAs.role==='learner')setPage('my-courses');
          else setPage('dashboard');
        }
      },[viewAs]);
      
      // Charger les notifications
      useEffect(()=>{
        const loadNotifications=async()=>{
          const{data}=await supabase.from('notifications').select('*').eq('user_id',profile?.id).order('created_at',{ascending:false}).limit(20);
          setNotifications(data||[]);
        };
        if(profile?.id)loadNotifications();
        
        const channel=supabase.channel('notifications').on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`user_id=eq.${profile?.id}`},(payload)=>{
          setNotifications(prev=>[payload.new,...prev]);
        }).subscribe();
        
        return()=>{supabase.removeChannel(channel);};
      },[profile?.id]);
      
      const markAsRead=async(id)=>{
        await supabase.from('notifications').update({is_read:true}).eq('id',id);
        setNotifications(prev=>prev.map(n=>n.id===id?{...n,is_read:true}:n));
      };
      
      const markAllAsRead=async()=>{
        await supabase.from('notifications').update({is_read:true}).eq('user_id',profile?.id).eq('is_read',false);
        setNotifications(prev=>prev.map(n=>({...n,is_read:true})));
      };
      
      const handleSwitchView=()=>{
        if(!selectedCenter)return;
        const c=centers.find(c=>c.id===selectedCenter);
        switchView(selectedRole,selectedCenter,c?.name);
        setShowViewAs(false);
      };
      
      const unreadCount=notifications.filter(n=>!n.is_read).length;
      
      // Menu adapté au rôle effectif (réel ou simulé)
      const showAsLearner=viewAs?.role==='learner'||(profile?.role==='learner'&&!viewAs);
      const showAsAdmin=!viewAs&&(can('manage_playlists')||profile?.role==='trainer');
      const showAsSuperAdmin=!viewAs&&isSuperAdmin;
      
      const menu=[
        {id:'dashboard',label:'Tableau de bord',icon:'LayoutDashboard',show:!showAsLearner},
        {id:'analytics',label:'Statistiques',icon:'BarChart3',show:!showAsLearner&&can('view_analytics')},
        {id:'scorm-tracking',label:'Suivi SCORM',icon:'Package',show:!showAsLearner&&(can('view_analytics')||can('manage_enrollments'))},
        {id:'centers',label:'Centres',icon:'Building2',show:showAsSuperAdmin},
        {id:'users',label:'Utilisateurs',icon:'Users',show:!viewAs&&can('manage_users')},
        {id:'videos',label:'Bibliothèque',icon:'Film',show:!viewAs&&can('manage_videos')},
        {id:'playlists',label:'Cours',icon:'BookOpen',show:showAsAdmin||(viewAs&&(viewAs.role==='center_admin'||viewAs.role==='trainer'))},
        {id:'paths',label:'Parcours',icon:'Map',show:showAsAdmin||(viewAs&&(viewAs.role==='center_admin'||viewAs.role==='trainer'))},
        {id:'quizzes',label:'Quiz',icon:'HelpCircle',show:showAsAdmin||(viewAs&&(viewAs.role==='center_admin'||viewAs.role==='trainer'))},
        {id:'badges',label:'Badges',icon:'Award',show:!viewAs&&can('manage_playlists')},
        {id:'enrollments',label:'Inscriptions',icon:'UserPlus',show:!viewAs&&can('manage_enrollments')||(viewAs&&(viewAs.role==='center_admin'||viewAs.role==='trainer'))},
        {id:'emails',label:'Emails',icon:'Mail',show:!viewAs&&can('manage_users')},
        {id:'permissions',label:'Permissions',icon:'Shield',show:!viewAs&&can('manage_permissions')},
        {id:'my-courses',label:'Mes cours',icon:'GraduationCap',show:showAsLearner},
        {id:'my-progress',label:'Mon suivi',icon:'BarChart3',show:showAsLearner},
        {id:'my-paths',label:'Mes parcours',icon:'Map',show:showAsLearner},
        {id:'my-badges',label:'Mes badges',icon:'Trophy',show:showAsLearner},
        {id:'my-certificates',label:'Mes certificats',icon:'Award',show:showAsLearner},
        {id:'leaderboard',label:'Classement',icon:'Medal',show:showAsLearner},
      ].filter(i=>i.show);

      return(<div className="min-h-screen bg-gray-900 text-white flex">
        {/* Bandeau Vue comme */}
        {viewAs&&<div className="fixed top-0 left-0 right-0 z-50 bg-orange-600 text-white px-4 py-2 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <Icon name="Eye" size={18}/>
            <span className="text-sm font-medium">Vue comme: <strong>{ROLE_LABELS[viewAs.role]}</strong> du centre <strong>{viewAs.center_name}</strong></span>
          </div>
          <button onClick={exitViewAs} className="flex items-center gap-1 px-3 py-1 bg-white/20 hover:bg-white/30 rounded text-sm"><Icon name="X" size={16}/>Quitter</button>
        </div>}
        
        <aside className={`fixed lg:static inset-y-0 left-0 z-40 w-64 bg-gray-800 border-r border-gray-700 transform transition-transform ${sidebarOpen?'translate-x-0':'-translate-x-full lg:translate-x-0'} ${viewAs?'pt-10':''}`}>
          <div className="h-full flex flex-col">

            <div className="p-4 border-t border-gray-700"><div className="flex items-center gap-3 mb-3"><div className={`w-10 h-10 rounded-full flex items-center justify-center ${viewAs?ROLE_COLORS[viewAs.role]:'bg-gray-700'}`}><Icon name="User" size={20}/></div><div className="flex-1 min-w-0"><p className="font-medium truncate">{profile?.first_name} {profile?.last_name}</p><RoleBadge role={viewAs?.role||profile?.role}/></div></div><Button variant="ghost" className="w-full" icon="LogOut" onClick={signOut}>Déconnexion</Button></div>
          </div>
        </aside>
        {sidebarOpen&&isMobile&&<div className="fixed inset-0 bg-black/50 z-30" onClick={()=>setSidebarOpen(false)}/>}
        <main className={`flex-1 min-h-screen ${viewAs?'pt-10':''}`}>
          <header className="bg-gray-800 border-b border-gray-700 p-4 flex items-center gap-4">
            <button onClick={()=>setSidebarOpen(!sidebarOpen)} className="lg:hidden p-2 hover:bg-gray-700 rounded-lg"><Icon name="Menu" size={24}/></button>
            <h1 className="font-semibold flex-1">{menu.find(i=>i.id===page)?.label||'Dashboard'}</h1>
            
            {/* Bouton Vue comme pour Super Admin */}
            {realIsSuperAdmin&&<div className="relative">
              <button onClick={()=>setShowViewAs(!showViewAs)} className={`p-2 rounded-lg flex items-center gap-2 ${viewAs?'bg-orange-600 hover:bg-orange-700':'hover:bg-gray-700'}`}>
                <Icon name="Eye" size={20}/>
                <span className="hidden sm:inline text-sm">{viewAs?'Changer':'Vue comme'}</span>
              </button>
              {showViewAs&&<div className="absolute right-0 mt-2 w-72 bg-gray-800 border border-gray-700 rounded-xl shadow-xl p-4 z-50">
                <h3 className="font-semibold mb-3">Voir l'application comme...</h3>
                <div className="space-y-3">
                  <Select label="Centre" value={selectedCenter} onChange={e=>setSelectedCenter(e.target.value)} options={[{value:'',label:'Sélectionner un centre...'},...centers.map(c=>({value:c.id,label:c.name}))]}/>
                  <Select label="Rôle" value={selectedRole} onChange={e=>setSelectedRole(e.target.value)} options={[{value:'center_admin',label:'Admin Centre'},{value:'trainer',label:'Formateur'},{value:'learner',label:'Apprenant'}]}/>
                  <div className="flex gap-2">
                    <Button className="flex-1" onClick={handleSwitchView} disabled={!selectedCenter}>Appliquer</Button>
                    {viewAs&&<Button variant="secondary" onClick={()=>{exitViewAs();setShowViewAs(false);}}>Retour</Button>}
                  </div>
                </div>
              </div>}
            </div>}
            
            <div className="relative">
              <button onClick={()=>setShowNotifs(!showNotifs)} className="p-2 hover:bg-gray-700 rounded-lg relative">
                <Icon name="Bell" size={20}/>
                {unreadCount>0&&<span className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full text-xs flex items-center justify-center">{unreadCount>9?'9+':unreadCount}</span>}
              </button>
              {showNotifs&&(
                <div className="absolute right-0 top-full mt-2 w-80 bg-gray-800 border border-gray-700 rounded-xl shadow-xl z-50 animate-fade-in">
                  <div className="p-3 border-b border-gray-700 flex items-center justify-between">
                    <h3 className="font-semibold">Notifications</h3>
                    {unreadCount>0&&<button onClick={markAllAsRead} className="text-xs text-indigo-400 hover:underline">Tout marquer lu</button>}
                  </div>
                  <div className="max-h-80 overflow-y-auto">
                    {notifications.length===0?<p className="p-4 text-gray-500 text-sm text-center">Aucune notification</p>:(
                      notifications.slice(0,10).map(n=>(
                        <div key={n.id} onClick={()=>{markAsRead(n.id);if(n.link)setPage(n.link);setShowNotifs(false);}} className={`p-3 border-b border-gray-700 hover:bg-gray-700/50 cursor-pointer ${!n.is_read?'bg-indigo-600/10':''}`}>
                          <div className="flex items-start gap-3">
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center ${n.type==='success'?'bg-green-500/20 text-green-400':n.type==='certificate'?'bg-yellow-500/20 text-yellow-400':'bg-indigo-500/20 text-indigo-400'}`}>
                              <Icon name={n.type==='certificate'?'Award':n.type==='success'?'CheckCircle':'Info'} size={16}/>
                            </div>
                            <div className="flex-1 min-w-0">
                              <p className="font-medium text-sm">{n.title}</p>
                              {n.message&&<p className="text-xs text-gray-400 truncate">{n.message}</p>}
                              <p className="text-xs text-gray-500 mt-1">{new Date(n.created_at).toLocaleString('fr-FR')}</p>
                            </div>
                            {!n.is_read&&<div className="w-2 h-2 bg-indigo-500 rounded-full"/>}
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              )}
            </div>
          </header>
          <div className="p-4 lg:p-6">
            {page==='dashboard'&&<DashboardPage/>}
            {page==='analytics'&&<AnalyticsPage/>}
            {page==='scorm-tracking'&&<ScormTrackingPage/>}
            {page==='centers'&&<CentersPage/>}
            {page==='users'&&<UsersPage/>}
            {page==='videos'&&<VideosPage/>}
            {page==='playlists'&&<PlaylistsPage/>}
            {page==='paths'&&<PathsPage/>}
            {page==='quizzes'&&<QuizzesPage/>}
            {page==='badges'&&<BadgesPage/>}
            {page==='enrollments'&&<EnrollmentsPage/>}
            {page==='emails'&&<EmailsPage/>}
            {page==='permissions'&&<PermissionsPage/>}
            {page==='my-courses'&&<MyCoursesPage/>}
            {page==='my-progress'&&<MyProgressPage/>}
            {page==='my-paths'&&<MyPathsPage/>}
            {page==='my-badges'&&<MyBadgesPage/>}
            {page==='my-certificates'&&<MyCertificatesPage/>}
            {page==='leaderboard'&&<LeaderboardPage/>}
          </div>
        </main>
      </div>);

    // ============================================================
    // PAGE: Suivi SCORM (ScormTrackingPage) - v6.7.1
    // ============================================================
    function ScormTrackingPage(){
      const{can,center,isSuperAdmin,profile}=useAuth();
      const[scormProgress,setScormProgress]=useState([]);
      const[modules,setModules]=useState([]);
      const[courses,setCourses]=useState([]);
      const[learners,setLearners]=useState([]);
      const[loading,setLoading]=useState(true);
      const[filter,setFilter]=useState({module:'all',course:'all',status:'all',learner:'all',search:''});
      const[selectedLearner,setSelectedLearner]=useState(null);
      const[learnerHistory,setLearnerHistory]=useState([]);
      const[stats,setStats]=useState({total:0,completed:0,passed:0,failed:0,inProgress:0,avgScore:0});
      const[activeTab,setActiveTab]=useState('table');
      const chartRef=useRef(null);
      const chartInstance=useRef(null);

      const load=useCallback(async()=>{
        // Charger les modules SCORM
        const{data:mods}=await supabase.from('scorm_modules').select('id,title,category');
        setModules(mods||[]);
        
        // Charger les cours (filtrés par centre si nécessaire)
        let qc=supabase.from('playlists').select('id,title');
        if(!isSuperAdmin&&center?.id)qc=qc.eq('center_id',center.id);
        const{data:crs}=await qc;
        setCourses(crs||[]);
        
        // Charger les apprenants (filtrés par centre)
        let ql=supabase.from('profiles').select('id,first_name,last_name,email').eq('role','learner');
        if(!isSuperAdmin&&center?.id)ql=ql.eq('center_id',center.id);
        const{data:lrn}=await ql;
        setLearners(lrn||[]);
        const learnerIds=(lrn||[]).map(l=>l.id);
        
        // Charger la progression SCORM avec les infos liées
        let q=supabase.from('scorm_progress').select(`
          *,
          scorm_modules:module_id(id,title,category),
          profiles:learner_id(id,first_name,last_name,email,center_id),
          enrollments:enrollment_id(id,playlist_id,playlists:playlist_id(id,title,center_id))
        `).order('updated_at',{ascending:false});
        
        const{data:progress}=await q;
        
        // Filtrer par centre côté client si pas super admin
        let filtered=progress||[];
        if(!isSuperAdmin&&center?.id){
          filtered=filtered.filter(p=>
            learnerIds.includes(p.learner_id)||
            p.profiles?.center_id===center.id||
            p.enrollments?.playlists?.center_id===center.id
          );
        }
        
        setScormProgress(filtered);
        
        // Calculer les stats
        const total=filtered.length;
        const completed=filtered.filter(p=>p.completion_status==='completed'||p.completion_status==='passed').length;
        const passed=filtered.filter(p=>p.completion_status==='passed'||p.success_status==='passed').length;
        const failed=filtered.filter(p=>p.completion_status==='failed'||p.success_status==='failed').length;
        const inProgress=filtered.filter(p=>p.completion_status==='incomplete').length;
        const withScore=filtered.filter(p=>p.score_scaled!==null&&p.score_scaled!==undefined);
        const avgScore=withScore.length>0?withScore.reduce((a,p)=>a+(p.score_scaled||0),0)/withScore.length:0;
        
        setStats({total,completed,passed,failed,inProgress,avgScore});
        setLoading(false);
      },[isSuperAdmin,center?.id]);

      useEffect(()=>{load();},[load]);

      // Créer le graphique
      useEffect(()=>{
        if(loading||!chartRef.current||activeTab!=='charts')return;
        
        // Détruire l'ancien graphique
        if(chartInstance.current){
          chartInstance.current.destroy();
        }
        
        // Données par statut
        const statusData={
          labels:['Réussis','Terminés','En cours','Échoués','Non commencés'],
          datasets:[{
            data:[stats.passed,stats.completed-stats.passed,stats.inProgress,stats.failed,stats.total-stats.completed-stats.inProgress-stats.failed],
            backgroundColor:['#22c55e','#3b82f6','#eab308','#ef4444','#6b7280']
          }]
        };
        
        chartInstance.current=new Chart(chartRef.current,{
          type:'doughnut',
          data:statusData,
          options:{
            responsive:true,
            maintainAspectRatio:false,
            plugins:{
              legend:{position:'bottom',labels:{color:'#9ca3af',padding:15}}
            }
          }
        });
        
        return()=>{
          if(chartInstance.current){
            chartInstance.current.destroy();
          }
        };
      },[loading,stats,activeTab]);

      // Filtrer les données
      const filteredProgress=useMemo(()=>{
        return scormProgress.filter(p=>{
          if(filter.module!=='all'&&p.module_id!==filter.module)return false;
          if(filter.course!=='all'&&p.enrollments?.playlist_id!==filter.course)return false;
          if(filter.learner!=='all'&&p.learner_id!==filter.learner)return false;
          if(filter.status!=='all'){
            const status=p.completion_status||'not attempted';
            if(filter.status==='completed'&&status!=='completed'&&status!=='passed')return false;
            if(filter.status==='in_progress'&&status!=='incomplete')return false;
            if(filter.status==='not_started'&&status!=='not attempted')return false;
            if(filter.status==='failed'&&status!=='failed')return false;
            if(filter.status==='passed'&&status!=='passed')return false;
          }
          if(filter.search){
            const search=filter.search.toLowerCase();
            const name=`${p.profiles?.first_name||''} ${p.profiles?.last_name||''}`.toLowerCase();
            const email=(p.profiles?.email||'').toLowerCase();
            const moduleName=(p.scorm_modules?.title||'').toLowerCase();
            if(!name.includes(search)&&!email.includes(search)&&!moduleName.includes(search))return false;
          }
          return true;
        });
      },[scormProgress,filter]);

      // Stats par module
      const moduleStats=useMemo(()=>{
        const stats={};
        scormProgress.forEach(p=>{
          const modId=p.module_id;
          const modTitle=p.scorm_modules?.title||'Inconnu';
          if(!stats[modId])stats[modId]={id:modId,title:modTitle,total:0,completed:0,passed:0,failed:0,scores:[]};
          stats[modId].total++;
          if(p.completion_status==='completed'||p.completion_status==='passed')stats[modId].completed++;
          if(p.completion_status==='passed'||p.success_status==='passed')stats[modId].passed++;
          if(p.completion_status==='failed'||p.success_status==='failed')stats[modId].failed++;
          if(p.score_scaled!==null)stats[modId].scores.push(p.score_scaled);
        });
        return Object.values(stats).map(s=>({
          ...s,
          avgScore:s.scores.length>0?s.scores.reduce((a,b)=>a+b,0)/s.scores.length:0,
          completionRate:s.total>0?Math.round((s.completed/s.total)*100):0
        }));
      },[scormProgress]);

      // Ouvrir le détail d'un apprenant
      const openLearnerDetail=async(learnerId,learnerName)=>{
        const{data}=await supabase.from('scorm_progress').select(`*,scorm_modules:module_id(id,title,category),enrollments:enrollment_id(playlists:playlist_id(title))`).eq('learner_id',learnerId).order('updated_at',{ascending:false});
        setLearnerHistory(data||[]);
        setSelectedLearner({id:learnerId,name:learnerName});
      };

      // Export CSV
      const exportCSV=()=>{
        const headers=['Apprenant','Email','Module','Cours','Statut','Succès','Score','Date mise à jour'];
        const rows=filteredProgress.map(p=>[
          `${p.profiles?.first_name||''} ${p.profiles?.last_name||''}`,
          p.profiles?.email||'',
          p.scorm_modules?.title||'',
          p.enrollments?.playlists?.title||'',
          SCORM_STATUS_LABELS[p.completion_status]||p.completion_status||'',
          p.success_status||'',
          p.score_scaled!==null?`${Math.round(p.score_scaled*100)}%`:'',
          p.updated_at?new Date(p.updated_at).toLocaleString('fr-FR'):''
        ]);
        const csv=[headers,...rows].map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
        const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');a.href=url;a.download=`suivi-scorm-${new Date().toISOString().slice(0,10)}.csv`;a.click();
        URL.revokeObjectURL(url);
      };

      if(!can('view_analytics')&&!can('manage_enrollments'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4">
          <h1 className="text-2xl font-bold">Suivi SCORM</h1>
          <div className="flex gap-2">
            <Button variant="ghost" icon="RefreshCw" onClick={load}>Actualiser</Button>
            <Button variant="secondary" icon="Download" onClick={exportCSV}>Exporter CSV</Button>
          </div>
        </div>

        {/* Stats globales */}
        <div className="grid grid-cols-2 md:grid-cols-6 gap-4 mb-6">
          <Card className="p-4"><div className="flex items-center gap-3"><div className="text-blue-400"><Icon name="Users" size={24}/></div><div><p className="text-gray-400 text-sm">Total</p><p className="text-2xl font-bold">{stats.total}</p></div></div></Card>
          <Card className="p-4"><div className="flex items-center gap-3"><div className="text-green-400"><Icon name="CheckCircle" size={24}/></div><div><p className="text-gray-400 text-sm">Terminés</p><p className="text-2xl font-bold">{stats.completed}</p></div></div></Card>
          <Card className="p-4"><div className="flex items-center gap-3"><div className="text-emerald-400"><Icon name="Award" size={24}/></div><div><p className="text-gray-400 text-sm">Réussis</p><p className="text-2xl font-bold">{stats.passed}</p></div></div></Card>
          <Card className="p-4"><div className="flex items-center gap-3"><div className="text-yellow-400"><Icon name="Clock" size={24}/></div><div><p className="text-gray-400 text-sm">En cours</p><p className="text-2xl font-bold">{stats.inProgress}</p></div></div></Card>
          <Card className="p-4"><div className="flex items-center gap-3"><div className="text-red-400"><Icon name="XCircle" size={24}/></div><div><p className="text-gray-400 text-sm">Échoués</p><p className="text-2xl font-bold">{stats.failed}</p></div></div></Card>
          <Card className="p-4"><div className="flex items-center gap-3"><div className="text-indigo-400"><Icon name="Target" size={24}/></div><div><p className="text-gray-400 text-sm">Score moy.</p><p className="text-2xl font-bold">{Math.round(stats.avgScore*100)}%</p></div></div></Card>
        </div>

        {/* Onglets */}
        <Tabs tabs={[
          {id:'table',label:'Tableau',icon:'Table'},
          {id:'charts',label:'Graphiques',icon:'PieChart'},
          {id:'modules',label:'Par module',icon:'Package'}
        ]} active={activeTab} onChange={setActiveTab}/>

        {/* Filtres */}
        <Card className="p-4 mb-6">
          <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
            <Input icon="Search" placeholder="Rechercher..." value={filter.search} onChange={e=>setFilter({...filter,search:e.target.value})}/>
            <Select value={filter.learner} onChange={e=>setFilter({...filter,learner:e.target.value})} options={[{value:'all',label:'Tous les apprenants'},...learners.map(l=>({value:l.id,label:`${l.first_name} ${l.last_name}`}))]}/>
            <Select value={filter.module} onChange={e=>setFilter({...filter,module:e.target.value})} options={[{value:'all',label:'Tous les modules'},...modules.map(m=>({value:m.id,label:m.title}))]}/>
            <Select value={filter.course} onChange={e=>setFilter({...filter,course:e.target.value})} options={[{value:'all',label:'Tous les cours'},...courses.map(c=>({value:c.id,label:c.title}))]}/>
            <Select value={filter.status} onChange={e=>setFilter({...filter,status:e.target.value})} options={[{value:'all',label:'Tous les statuts'},{value:'passed',label:'Réussis'},{value:'completed',label:'Terminés'},{value:'in_progress',label:'En cours'},{value:'failed',label:'Échoués'},{value:'not_started',label:'Non commencés'}]}/>
          </div>
        </Card>

        {/* Vue Tableau */}
        {activeTab==='table'&&(
          filteredProgress.length===0?<Empty icon="Package" title="Aucune donnée SCORM" desc="Aucun résultat ne correspond à vos filtres"/>:(
            <Card>
              <div className="overflow-x-auto">
                <table className="w-full">
                  <thead className="bg-gray-750"><tr>
                    <th className="text-left p-4 font-medium text-gray-400">Apprenant</th>
                    <th className="text-left p-4 font-medium text-gray-400">Module</th>
                    <th className="text-left p-4 font-medium text-gray-400">Cours</th>
                    <th className="text-left p-4 font-medium text-gray-400">Statut</th>
                    <th className="text-left p-4 font-medium text-gray-400">Score</th>
                    <th className="text-left p-4 font-medium text-gray-400">Date</th>
                    <th className="text-right p-4"></th>
                  </tr></thead>
                  <tbody className="divide-y divide-gray-700">
                    {filteredProgress.slice(0,100).map(p=>(
                      <tr key={p.id} className="hover:bg-gray-750/50">
                        <td className="p-4"><p className="font-medium">{p.profiles?.first_name} {p.profiles?.last_name}</p><p className="text-sm text-gray-400">{p.profiles?.email}</p></td>
                        <td className="p-4"><div className="flex items-center gap-2"><div className="w-8 h-8 bg-orange-500/20 rounded flex items-center justify-center"><Icon name="Package" size={16} className="text-orange-400"/></div><div><p className="font-medium text-sm">{p.scorm_modules?.title||'Module inconnu'}</p>{p.scorm_modules?.category&&<p className="text-xs text-gray-500">{p.scorm_modules.category}</p>}</div></div></td>
                        <td className="p-4 text-gray-400 text-sm">{p.enrollments?.playlists?.title||'—'}</td>
                        <td className="p-4"><ScormStatusBadge status={p.completion_status}/></td>
                        <td className="p-4"><ScoreBadge score={p.score_scaled} showLabel={false}/></td>
                        <td className="p-4 text-gray-400 text-sm">{p.updated_at?new Date(p.updated_at).toLocaleDateString('fr-FR'):'-'}</td>
                        <td className="p-4 text-right"><Button variant="ghost" size="sm" icon="Eye" onClick={()=>openLearnerDetail(p.learner_id,`${p.profiles?.first_name} ${p.profiles?.last_name}`)}>Détails</Button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                {filteredProgress.length>100&&<p className="p-4 text-center text-gray-500 text-sm">Affichage limité à 100 résultats. Utilisez les filtres pour affiner.</p>}
              </div>
            </Card>
          )
        )}

        {/* Vue Graphiques */}
        {activeTab==='charts'&&(
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <Card className="p-6">
              <h3 className="font-semibold mb-4">Répartition par statut</h3>
              <div className="h-64">
                <canvas ref={chartRef}></canvas>
              </div>
            </Card>
            <Card className="p-6">
              <h3 className="font-semibold mb-4">Résumé</h3>
              <div className="space-y-4">
                <div className="flex justify-between items-center"><span className="text-gray-400">Taux de complétion</span><span className="text-2xl font-bold text-green-400">{stats.total>0?Math.round((stats.completed/stats.total)*100):0}%</span></div>
                <ProgressBar percent={stats.total>0?(stats.completed/stats.total)*100:0} color="green" showLabel={false}/>
                <div className="flex justify-between items-center"><span className="text-gray-400">Taux de réussite</span><span className="text-2xl font-bold text-emerald-400">{stats.completed>0?Math.round((stats.passed/stats.completed)*100):0}%</span></div>
                <ProgressBar percent={stats.completed>0?(stats.passed/stats.completed)*100:0} color="green" showLabel={false}/>
                <div className="flex justify-between items-center"><span className="text-gray-400">Score moyen</span><span className="text-2xl font-bold text-indigo-400">{Math.round(stats.avgScore*100)}%</span></div>
                <ProgressBar percent={stats.avgScore*100} showLabel={false}/>
              </div>
            </Card>
          </div>
        )}

        {/* Vue Par module */}
        {activeTab==='modules'&&(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {moduleStats.length===0?<Empty icon="Package" title="Aucun module"/>:moduleStats.map(m=>(
              <Card key={m.id} className="p-4">
                <div className="flex items-center gap-3 mb-4">
                  <div className="w-12 h-12 bg-orange-500/20 rounded-lg flex items-center justify-center"><Icon name="Package" size={24} className="text-orange-400"/></div>
                  <div className="flex-1 min-w-0"><h3 className="font-semibold truncate">{m.title}</h3><p className="text-sm text-gray-400">{m.total} session{m.total>1?'s':''}</p></div>
                </div>
                <div className="space-y-3">

    // Dashboard

      const[recentActivity,setRecentActivity]=useState([]);
      const[recentBadges,setRecentBadges]=useState([]);
      const[topLearners,setTopLearners]=useState([]);
      const[recentScorm,setRecentScorm]=useState([]);
      const[loading,setLoading]=useState(true);
      
      // Déterminer le center_id à utiliser (réel ou simulé)
      const effectiveCenterId=viewAs?.center_id||center?.id;

      useEffect(()=>{
        const load=async()=>{
          // Si Super Admin (sans viewAs), montrer les stats globales
          // Sinon, filtrer par center_id
          const isGlobal=realIsSuperAdmin&&!viewAs;
          
          let usersQuery=supabase.from('profiles').select('*',{count:'exact',head:true});
          let videosQuery=supabase.from('videos').select('*',{count:'exact',head:true});
          let playlistsQuery=supabase.from('playlists').select('*',{count:'exact',head:true});
          let enrollmentsQuery=supabase.from('enrollments').select('*',{count:'exact',head:true});
          let completionsQuery=supabase.from('enrollments').select('*',{count:'exact',head:true}).eq('status','completed');
          let quizzesQuery=supabase.from('quizzes').select('*',{count:'exact',head:true});
          let pathsQuery=supabase.from('learning_paths').select('*',{count:'exact',head:true});
          let badgesQuery=supabase.from('learner_badges').select('*',{count:'exact',head:true});
          let scormQuery=supabase.from('scorm_progress').select('*',{count:'exact',head:true});
          let scormCompletedQuery=supabase.from('scorm_progress').select('*',{count:'exact',head:true}).or('completion_status.eq.completed,completion_status.eq.passed');
          
          // Filtrer par centre si pas global
          if(!isGlobal&&effectiveCenterId){
            usersQuery=usersQuery.eq('center_id',effectiveCenterId);
            playlistsQuery=playlistsQuery.eq('center_id',effectiveCenterId);
            // Pour enrollments, filtrer via les playlists du centre ou via learner_id

          const[{count:users},{count:videos},{count:playlists},{count:enrollments},{count:completions},{count:quizzes},{count:paths},{count:badges},{count:scormSessions},{count:scormCompleted}]=await Promise.all([
            usersQuery,videosQuery,playlistsQuery,enrollmentsQuery,completionsQuery,quizzesQuery,pathsQuery,badgesQuery,scormQuery,scormCompletedQuery

          let centers=1;
          if(realIsSuperAdmin&&!viewAs){
            const{count}=await supabase.from('centers').select('*',{count:'exact',head:true});

          // Filtrer les stats pour le centre si nécessaire

          if(!isGlobal&&effectiveCenterId){
            // Compter les enrollments des apprenants du centre

            const learnerIds=(centerLearners||[]).map(l=>l.id);
            if(learnerIds.length>0){
              const{count:ce}=await supabase.from('enrollments').select('*',{count:'exact',head:true}).in('learner_id',learnerIds);
              const{count:cc}=await supabase.from('enrollments').select('*',{count:'exact',head:true}).in('learner_id',learnerIds).eq('status','completed');
              const{count:cb}=await supabase.from('learner_badges').select('*',{count:'exact',head:true}).in('learner_id',learnerIds);
              filteredEnrollments=ce||0;
              filteredCompletions=cc||0;
              filteredBadges=cb||0;
            }else{
              filteredEnrollments=0;filteredCompletions=0;filteredBadges=0;
            }
          }
          
          setStats({
            centers,
            users:users||0,
            videos:videos||0,
            playlists:playlists||0,
            enrollments:filteredEnrollments,
            completions:filteredCompletions,
            quizzes:quizzes||0,
            paths:paths||0,

          // Activité récente (filtrée par centre si nécessaire)

          const{data:recent}=await recentQuery;
          // Filtrer côté client si pas global
          const filteredRecent=isGlobal?recent:(recent||[]).filter(r=>r.profiles?.center_id===effectiveCenterId);
          setRecentActivity(filteredRecent.slice(0,5));
          
          // Activité SCORM récente
          const{data:scormRecent}=await supabase.from('scorm_progress').select('*,profiles:learner_id(first_name,last_name),scorm_modules:module_id(title)').order('updated_at',{ascending:false}).limit(5);
          setRecentScorm(scormRecent||[]);
          
          // Badges récemment obtenus (filtrés par centre)
          let badgesRecentQuery=supabase.from('learner_badges').select('*,badges(*),profiles:learner_id(first_name,last_name,center_id)').order('earned_at',{ascending:false}).limit(10);
          const{data:rBadges}=await badgesRecentQuery;

          setRecentBadges(filteredRBadges.slice(0,5));
          
          // Top apprenants (filtrés par centre)
          const{data:pts}=await supabase.from('learner_points').select('learner_id,points');

          if(!isGlobal&&effectiveCenterId)profsQuery=profsQuery.eq('center_id',effectiveCenterId);

          const ranked=(profs||[]).map(p=>({...p,points:pointsMap[p.id]||0})).sort((a,b)=>b.points-a.points).slice(0,5);
          setTopLearners(ranked);
          
          setLoading(false);
        };
        load();
      },[realIsSuperAdmin,viewAs,effectiveCenterId]);

      const colorClasses={gold:'bg-yellow-500',silver:'bg-gray-400',bronze:'bg-orange-600',purple:'bg-purple-500',blue:'bg-blue-500'};

      if(loading)return<Loading text="Chargement..."/>;
      
      const cards=[];
      if(can('manage_centers')&&!viewAs)cards.push({label:'Centres',value:stats.centers,icon:'Building2',color:'text-red-400'});
      if(can('manage_users')||viewAs)cards.push({label:'Utilisateurs',value:stats.users,icon:'Users',color:'text-blue-400'});
      if(can('manage_videos')&&!viewAs)cards.push({label:'Vidéos',value:stats.videos,icon:'Film',color:'text-purple-400'});
      if(can('manage_playlists')||viewAs)cards.push({label:'Cours',value:stats.playlists,icon:'BookOpen',color:'text-green-400'});
      if(can('manage_playlists')||viewAs)cards.push({label:'Parcours',value:stats.paths,icon:'Map',color:'text-cyan-400'});
      if(can('manage_enrollments')||viewAs)cards.push({label:'Inscriptions',value:stats.enrollments,icon:'UserPlus',color:'text-yellow-400'});
      if(can('manage_enrollments')||viewAs)cards.push({label:'Complétés',value:stats.completions,icon:'CheckCircle',color:'text-emerald-400'});
      if((can('manage_playlists')||viewAs)&&!viewAs)cards.push({label:'Badges délivrés',value:stats.badges,icon:'Award',color:'text-amber-400'});
      if(can('view_analytics')||viewAs)cards.push({label:'Sessions SCORM',value:stats.scormSessions,icon:'Package',color:'text-orange-400'});
      
      const completionRate=stats.enrollments>0?Math.round((stats.completions/stats.enrollments)*100):0;
      const scormRate=stats.scormSessions>0?Math.round((stats.scormCompleted/stats.scormSessions)*100):0;
      
      return<div>
        <h1 className="text-2xl font-bold mb-6">Tableau de bord</h1>
        
        {/* Stats principales */}
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          {cards.map(c=><Card key={c.label} className="p-4"><div className="flex items-center gap-3"><div className={c.color}><Icon name={c.icon} size={24}/></div><div><p className="text-gray-400 text-sm">{c.label}</p><p className="text-2xl font-bold">{c.value}</p></div></div></Card>)}
        </div>
        
        {/* Taux de complétion */}
        {can('view_analytics')&&(
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <Card className="p-6">
              <div className="flex items-center justify-between mb-4">
                <h2 className="text-lg font-semibold">Taux de complétion cours</h2>

              <ProgressBar percent={completionRate} showLabel={false}/>

            <Card className="p-6">

                <h2 className="text-lg font-semibold">Taux de réussite SCORM</h2>

        <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
          {/* Activité récente */}

            <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="Activity" size={18}/>Activité récente</h3>
            <div className="space-y-3">
              {recentActivity.length===0?<p className="text-gray-500 text-sm">Aucune activité</p>:recentActivity.map(a=>(
                <div key={a.id} className="flex items-center gap-3 text-sm">
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center ${a.status==='completed'?'bg-green-500/20 text-green-400':'bg-blue-500/20 text-blue-400'}`}>
                    <Icon name={a.status==='completed'?'CheckCircle':'UserPlus'} size={14}/>

    // Analytics Page
    function AnalyticsPage(){
      const{can,center,isSuperAdmin}=useAuth();
      const[data,setData]=useState({enrollments:[],courses:[],summary:{},learnerStats:[]});
      const[loading,setLoading]=useState(true);
      const[filter,setFilter]=useState({course:'all',period:'all'});
      const[selectedLearner,setSelectedLearner]=useState(null);
      const progressChartRef=useRef(null);
      const statusChartRef=useRef(null);
      const courseChartRef=useRef(null);
      const chartsRef=useRef({});

      // Fonction pour formater le temps
      const formatTime=(seconds)=>{
        if(!seconds||seconds===0)return'-';
        const h=Math.floor(seconds/3600);
        const m=Math.floor((seconds%3600)/60);
        const s=seconds%60;
        if(h>0)return `${h}h ${m}min`;
        if(m>0)return `${m}min ${s}s`;
        return `${s}s`;
      };

      const load=useCallback(async()=>{
        // Charger les inscriptions avec détails
        let q=supabase.from('enrollments').select(`
          *,
          playlists:playlist_id(id,title,center_id),
          profiles:learner_id(id,first_name,last_name,email)
        `);
        if(!isSuperAdmin&&center?.id){
          q=q.eq('playlists.center_id',center.id);
        }
        const{data:enrollments}=await q;
        
        // Charger les cours
        let qc=supabase.from('playlists').select('id,title,is_published');
        if(!isSuperAdmin&&center?.id)qc=qc.eq('center_id',center.id);
        const{data:courses}=await qc;
        
        // Charger les sessions de cours pour le temps total
        let qs=supabase.from('course_sessions').select('*');
        if(!isSuperAdmin&&center?.id){
          // Filtrer par les enrollments du centre
          const enrollmentIds=(enrollments||[]).filter(e=>e.playlists).map(e=>e.id);
          if(enrollmentIds.length>0)qs=qs.in('enrollment_id',enrollmentIds);
        }
        const{data:sessions}=await qs;
        
        // Charger les scores SCORM
        const learnerIds=[...new Set((enrollments||[]).map(e=>e.learner_id).filter(Boolean))];
        let scormData=[];
        if(learnerIds.length>0){
          const{data:sp}=await supabase.from('scorm_progress').select('*').in('learner_id',learnerIds);
          scormData=sp||[];
        }
        
        // Charger les tentatives de quiz
        let quizData=[];
        if(learnerIds.length>0){
          const{data:qa}=await supabase.from('quiz_attempts').select('*').in('learner_id',learnerIds);
          quizData=qa||[];
        }

        // Calculer les statistiques par apprenant
        const learnerStats=learnerIds.map(learnerId=>{
          const learnerEnrollments=(enrollments||[]).filter(e=>e.learner_id===learnerId);
          const profile=learnerEnrollments[0]?.profiles;
          const totalTime=learnerEnrollments.reduce((a,e)=>a+(e.time_spent_seconds||0),0);
          const completedCourses=learnerEnrollments.filter(e=>e.status==='completed').length;
          const learnerScorm=scormData.filter(s=>s.learner_id===learnerId);
          const learnerQuiz=quizData.filter(q=>q.learner_id===learnerId);
          const avgScormScore=learnerScorm.length>0?learnerScorm.reduce((a,s)=>a+(s.score_scaled||0)*100,0)/learnerScorm.length:null;
          const avgQuizScore=learnerQuiz.length>0?learnerQuiz.reduce((a,q)=>a+(q.score_percent||0),0)/learnerQuiz.length:null;
          const lastActivity=learnerEnrollments.reduce((latest,e)=>{
            const d=new Date(e.updated_at);
            return d>latest?d:latest;
          },new Date(0));
          
          return{
            id:learnerId,
            name:profile?`${profile.first_name} ${profile.last_name}`:'Inconnu',
            email:profile?.email||'',
            totalCourses:learnerEnrollments.length,
            completedCourses,
            totalTime,
            avgProgress:learnerEnrollments.length>0?Math.round(learnerEnrollments.reduce((a,e)=>a+(e.progress_percent||0),0)/learnerEnrollments.length):0,
            avgScormScore,
            avgQuizScore,
            lastActivity:lastActivity.getTime()>0?lastActivity:null,
            enrollments:learnerEnrollments
          };
        }).sort((a,b)=>b.totalTime-a.totalTime);

        // Calculer les statistiques globales
        const validEnrollments=(enrollments||[]).filter(e=>e.playlists&&e.profiles);
        const totalTimeAll=validEnrollments.reduce((a,e)=>a+(e.time_spent_seconds||0),0);
        const summary={
          total:validEnrollments.length,
          notStarted:validEnrollments.filter(e=>e.status==='not_started').length,
          inProgress:validEnrollments.filter(e=>e.status==='in_progress').length,
          completed:validEnrollments.filter(e=>e.status==='completed').length,
          avgProgress:validEnrollments.length?Math.round(validEnrollments.reduce((a,e)=>a+(e.progress_percent||0),0)/validEnrollments.length):0,
          totalTime:totalTimeAll,
          avgTimePerCourse:validEnrollments.length>0?Math.round(totalTimeAll/validEnrollments.length):0,
          learnersCount:learnerIds.length
        };

        setData({enrollments:validEnrollments,courses:courses||[],summary,learnerStats});
        setLoading(false);
      },[isSuperAdmin,center?.id]);

      useEffect(()=>{load();},[load]);

      // Créer les graphiques
      useEffect(()=>{
        if(loading||!data.enrollments.length)return;

        // Détruire les anciens graphiques
        Object.values(chartsRef.current).forEach(chart=>chart?.destroy());
        chartsRef.current={};

        // Graphique de statut (Doughnut)
        if(statusChartRef.current){
          const ctx=statusChartRef.current.getContext('2d');
          chartsRef.current.status=new Chart(ctx,{
            type:'doughnut',
            data:{
              labels:['Non commencé','En cours','Terminé'],
              datasets:[{
                data:[data.summary.notStarted,data.summary.inProgress,data.summary.completed],
                backgroundColor:['#6b7280','#eab308','#22c55e'],
                borderWidth:0
              }]
            },
            options:{
              responsive:true,
              maintainAspectRatio:false,
              plugins:{legend:{position:'bottom',labels:{color:'#9ca3af'}}}
            }
          });
        }

        // Graphique par cours (Bar)
        if(courseChartRef.current){
          const courseStats=data.courses.map(c=>{
            const courseEnrollments=data.enrollments.filter(e=>e.playlist_id===c.id);
            return{
              title:c.title,
              count:courseEnrollments.length,
              avgProgress:courseEnrollments.length?Math.round(courseEnrollments.reduce((a,e)=>a+(e.progress_percent||0),0)/courseEnrollments.length):0
            };
          });
          
          const ctx=courseChartRef.current.getContext('2d');
          chartsRef.current.course=new Chart(ctx,{
            type:'bar',
            data:{
              labels:courseStats.map(c=>c.title.length>20?c.title.substring(0,20)+'...':c.title),
              datasets:[
                {label:'Inscrits',data:courseStats.map(c=>c.count),backgroundColor:'#6366f1'},
                {label:'Progression moy. %',data:courseStats.map(c=>c.avgProgress),backgroundColor:'#22c55e'}
              ]
            },
            options:{
              responsive:true,
              maintainAspectRatio:false,
              scales:{
                x:{ticks:{color:'#9ca3af'},grid:{color:'#374151'}},
                y:{ticks:{color:'#9ca3af'},grid:{color:'#374151'}}
              },

    // Centers
    function CentersPage(){
      const{can}=useAuth();

      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({name:'',slug:'',description:''});
      const[saving,setSaving]=useState(false);

      const load=useCallback(async()=>{const{data}=await supabase.from('centers').select('*').order('name');setCenters(data||[]);setLoading(false);},[]);
      useEffect(()=>{load();},[load]);

      const handleSave=async()=>{
        setSaving(true);
        const payload={name:form.name,slug:form.slug.toLowerCase().replace(/[^a-z0-9-]/g,'-'),description:form.description};
        if(editing)await supabase.from('centers').update(payload).eq('id',editing.id);
        else await supabase.from('centers').insert(payload);
        await load();setModal(false);setForm({name:'',slug:'',description:''});setEditing(null);setSaving(false);
      };
      const handleDelete=async id=>{if(!confirm('Supprimer ?'))return;await supabase.from('centers').delete().eq('id',id);load();};

      if(loading)return<Loading/>;
      return<div>
        <div className="flex items-center justify-between mb-6"><h1 className="text-2xl font-bold">Centres</h1><Button icon="Plus" onClick={()=>{setForm({name:'',slug:'',description:''});setEditing(null);setModal(true);}}>Nouveau</Button></div>

        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title={editing?'Modifier':'Nouveau centre'}><div className="space-y-4"><Input label="Nom" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/><Input label="Slug" value={form.slug} onChange={e=>setForm({...form,slug:e.target.value})}/><div><label className="block text-sm font-medium text-gray-300 mb-1">Description</label><textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={3} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/></div><div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button><Button onClick={handleSave} loading={saving}>Enregistrer</Button></div></div></Modal>

      const{profile,center,isSuperAdmin,can}=useAuth();

      const[bulkDeleteModal,setBulkDeleteModal]=useState(false);

      const[editing,setEditing]=useState(null);
      const[search,setSearch]=useState('');
      const[filterRole,setFilterRole]=useState('');
      const[filterCenter,setFilterCenter]=useState('');
      const[sortBy,setSortBy]=useState('created_at');
      const[sortDir,setSortDir]=useState('desc');
      const[selectedUsers,setSelectedUsers]=useState([]);
      const[form,setForm]=useState({email:'',first_name:'',last_name:'',role:'learner',center_id:''});
      const[createForm,setCreateForm]=useState({email:'',password:'',first_name:'',last_name:'',role:'learner',center_id:''});
      const[saving,setSaving]=useState(false);
      const[creating,setCreating]=useState(false);
      const[createResult,setCreateResult]=useState(null);
      const[importData,setImportData]=useState([]);
      const[importLoading,setImportLoading]=useState(false);
      const[importResult,setImportResult]=useState(null);
      const fileInputRef=useRef(null);

      const load=useCallback(async()=>{
        let q=supabase.from('profiles').select('*,centers(name)').order('created_at',{ascending:false});
        if(!isSuperAdmin&&center?.id)q=q.eq('center_id',center.id);
        const{data:u}=await q;setUsers(u||[]);
        const{data:c}=await supabase.from('centers').select('id,name');setCenters(c||[]);
        setLoading(false);
        setSelectedUsers([]);
      },[isSuperAdmin,center?.id]);
      
      useEffect(()=>{load();},[load]);

      const generatePassword=()=>{
        const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!@#$%';
        let pwd='';for(let i=0;i<12;i++)pwd+=chars.charAt(Math.floor(Math.random()*chars.length));
        return pwd;
      };

      // Suppression par lot
      const handleBulkDelete=async()=>{
        if(!selectedUsers.length)return;
        setDeleting(true);
        try{
          for(const userId of selectedUsers){
            await supabase.from('enrollments').delete().eq('learner_id',userId);
            await supabase.from('video_progress').delete().eq('learner_id',userId);
            await supabase.from('scorm_progress').delete().eq('learner_id',userId);
            await supabase.from('quiz_attempts').delete().eq('learner_id',userId);
            await supabase.from('learner_badges').delete().eq('learner_id',userId);
            await supabase.from('learner_points').delete().eq('learner_id',userId);
            await supabase.from('learner_notes').delete().eq('learner_id',userId);
            await supabase.from('notifications').delete().eq('user_id',userId);
            await supabase.from('certificates').delete().eq('learner_id',userId);
            await supabase.from('profiles').delete().eq('id',userId);
          }
          await load();
          setBulkDeleteModal(false);
        }catch(err){
          console.error('Erreur suppression:',err);
          alert('Erreur lors de la suppression: '+err.message);
        }
        setDeleting(false);
      };

      // Sélection
      const toggleSelect=(userId)=>{
        setSelectedUsers(prev=>prev.includes(userId)?prev.filter(id=>id!==userId):[...prev,userId]);
      };
      const toggleSelectAll=(filteredUsers)=>{
        const selectableUsers=filteredUsers.filter(u=>u.id!==profile?.id&&u.role!=='super_admin');
        const allSelected=selectableUsers.every(u=>selectedUsers.includes(u.id));
        if(allSelected){
          setSelectedUsers([]);
        }else{
          setSelectedUsers(selectableUsers.map(u=>u.id));
        }
      };

      // Tri
      const handleSort=(field)=>{
        if(sortBy===field){
          setSortDir(prev=>prev==='asc'?'desc':'asc');
        }else{
          setSortBy(field);
          setSortDir('asc');
        }
      };

      const handleCreate=async()=>{
        if(!createForm.email||!createForm.first_name||!createForm.last_name){
          alert('Veuillez remplir tous les champs obligatoires');return;
        }
        // Valider le rôle selon les permissions
        const allowedRoles=isSuperAdmin?['learner','trainer','center_admin','super_admin']:['learner','trainer'];
        const finalRole=allowedRoles.includes(createForm.role)?createForm.role:'learner';
        
        setCreating(true);setCreateResult(null);
        try{
          const password=createForm.password||generatePassword();
          const targetCenterId=isSuperAdmin?(createForm.center_id||center?.id):center?.id;
          
          // Créer l'utilisateur via l'API Supabase Auth
          const{data:authData,error:authError}=await supabase.auth.signUp({
            email:createForm.email.toLowerCase().trim(),
            password:password,
            options:{data:{first_name:createForm.first_name,last_name:createForm.last_name}}
          });
          
          if(authError)throw authError;
          if(!authData.user)throw new Error('Erreur lors de la création du compte');
          
          // Mettre à jour le profil avec le rôle et le centre
          const{error:profileError}=await supabase.from('profiles').update({
            first_name:createForm.first_name,
            last_name:createForm.last_name,
            role:finalRole,
            center_id:targetCenterId||null
          }).eq('id',authData.user.id);
          
          if(profileError)console.error('Erreur profil:',profileError);
          
          setCreateResult({success:true,email:createForm.email,password:password});
          await load();
        }catch(err){
          console.error('Erreur création:',err);
          setCreateResult({success:false,error:err.message});
        }
        setCreating(false);
      };

      const resetCreateForm=()=>{
        setCreateForm({email:'',password:'',first_name:'',last_name:'',role:'learner',center_id:center?.id||''});
        setCreateResult(null);
      };

      const handleSave=async()=>{
        if(!editing)return;
        setSaving(true);
        await supabase.from('profiles').update({first_name:form.first_name,last_name:form.last_name,role:form.role,center_id:form.center_id||null}).eq('id',editing.id);
        await load();setModal(false);setEditing(null);setSaving(false);
      };

      const handleDelete=async()=>{
        if(!deleteModal)return;
        setDeleting(true);
        try{
          // Supprimer les données liées
          await supabase.from('enrollments').delete().eq('learner_id',deleteModal.id);
          await supabase.from('video_progress').delete().eq('learner_id',deleteModal.id);
          await supabase.from('scorm_progress').delete().eq('learner_id',deleteModal.id);
          await supabase.from('quiz_attempts').delete().eq('learner_id',deleteModal.id);
          await supabase.from('learner_badges').delete().eq('learner_id',deleteModal.id);
          await supabase.from('learner_points').delete().eq('learner_id',deleteModal.id);
          await supabase.from('learner_notes').delete().eq('learner_id',deleteModal.id);
          await supabase.from('notifications').delete().eq('user_id',deleteModal.id);
          await supabase.from('certificates').delete().eq('learner_id',deleteModal.id);
          
          // Supprimer le profil
          await supabase.from('profiles').delete().eq('id',deleteModal.id);
          
          // Supprimer l'utilisateur auth (nécessite une fonction Edge ou admin API)
          // Note: Cela nécessite les droits admin Supabase
          // Pour l'instant on garde le user auth mais sans profil
          
          await load();
          setDeleteModal(null);
        }catch(err){
          console.error('Erreur suppression:',err);
          alert('Erreur lors de la suppression: '+err.message);
        }
        setDeleting(false);
      };

      const handleFileSelect=async(e)=>{
        const file=e.target.files[0];if(!file)return;
        try{
          const data=await file.arrayBuffer();
          const workbook=XLSX.read(data);
          const sheet=workbook.Sheets[workbook.SheetNames[0]];
          const jsonData=XLSX.utils.sheet_to_json(sheet);
          // Rôles autorisés selon le type d'admin
          const allowedRoles=isSuperAdmin?['learner','trainer','center_admin','super_admin']:['learner','trainer'];
          const mapped=jsonData.map((row,i)=>{
            let role=String(row['Rôle']||row['Role']||row['role']||'learner').toLowerCase();
            // Si le rôle n'est pas autorisé pour cet admin, forcer à 'learner'
            if(!allowedRoles.includes(role))role='learner';
            return{
              _index:i+1,
              email:String(row['Email']||row['email']||'').toLowerCase().trim(),
              first_name:row['Prénom']||row['Prenom']||row['first_name']||'',
              last_name:row['Nom']||row['last_name']||'',
              role:role,
              password:row['Mot de passe']||row['Password']||row['password']||'',
              center_name:row['Centre']||row['center']||'',
              _valid:!!(row['Email']||row['email'])&&!!(row['Prénom']||row['Prenom']||row['first_name'])&&!!(row['Nom']||row['last_name']),
              _roleForced:!allowedRoles.includes(String(row['Rôle']||row['Role']||row['role']||'learner').toLowerCase())
            };
          });
          setImportData(mapped);setImportResult(null);
        }catch(err){alert('Erreur: '+err.message);}
        e.target.value='';
      };

      const handleImport=async()=>{
        const validData=importData.filter(d=>d._valid);
        if(!validData.length){alert('Aucune donnée valide');return;}
        
        setImportLoading(true);
        try{
          const usersToCreate=validData.map(item=>{
            let targetCenterId=center?.id;
            if(isSuperAdmin&&item.center_name){
              const found=centers.find(c=>c.name.toLowerCase()===item.center_name.toLowerCase());
              if(found)targetCenterId=found.id;
            }
            return{email:item.email,password:item.password||'',first_name:item.first_name,last_name:item.last_name,role:item.role,center_id:targetCenterId};
          });

          const{data:{session}}=await supabase.auth.getSession();
          const response=await fetch(`${SUPABASE_URL}/functions/v1/create-users`,{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token}`},
            body:JSON.stringify({users:usersToCreate})
          });

          const result=await response.json();
          
          if(result.success){
            setImportResult({created:result.created||0,updated:result.updated||0,errors:result.errors||0,results:result.results||[]});
            await load();
          }else{
            setImportResult({created:0,updated:0,errors:validData.length,errorMessage:result.error});
          }
        }catch(err){
          setImportResult({created:0,updated:0,errors:validData.length,errorMessage:err.message});
        }
        setImportLoading(false);
      };

      const downloadTemplate=()=>{
        const template=[{'Email':'paul@email.com','Prénom':'Paul','Nom':'Moreau','Rôle':'learner','Mot de passe':'','Centre':''}];
        const ws=XLSX.utils.json_to_sheet(template);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Utilisateurs');
        XLSX.writeFile(wb,'template_utilisateurs.xlsx');
      };

      const exportResults=()=>{
        if(!importResult?.results)return;
        const data=importResult.results.map(r=>({'Email':r.email,'Statut':r.status==='created'?'Créé':r.status==='updated'?'Mis à jour':'Erreur','Mot de passe':r.password||'','Message':r.message||''}));
        const ws=XLSX.utils.json_to_sheet(data);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Résultats');
        XLSX.writeFile(wb,'resultat_import.xlsx');
      };

      const filtered=useMemo(()=>{
        let result=[...users];
        // Recherche
        if(search){
          const s=search.toLowerCase();
          result=result.filter(u=>u.email?.toLowerCase().includes(s)||u.first_name?.toLowerCase().includes(s)||u.last_name?.toLowerCase().includes(s));
        }
        // Filtre par rôle
        if(filterRole){
          result=result.filter(u=>u.role===filterRole);
        }
        // Filtre par centre
        if(filterCenter){
          result=result.filter(u=>u.center_id===filterCenter);
        }
        // Tri
        result.sort((a,b)=>{
          let valA,valB;
          switch(sortBy){
            case 'name':valA=`${a.first_name} ${a.last_name}`.toLowerCase();valB=`${b.first_name} ${b.last_name}`.toLowerCase();break;
            case 'email':valA=a.email?.toLowerCase()||'';valB=b.email?.toLowerCase()||'';break;
            case 'role':valA=a.role||'';valB=b.role||'';break;
            case 'center':valA=a.centers?.name?.toLowerCase()||'';valB=b.centers?.name?.toLowerCase()||'';break;
            default:valA=a.created_at||'';valB=b.created_at||'';
          }
          if(valA<valB)return sortDir==='asc'?-1:1;
          if(valA>valB)return sortDir==='asc'?1:-1;
          return 0;
        });
        return result;
      },[users,search,filterRole,filterCenter,sortBy,sortDir]);

      const selectableUsers=filtered.filter(u=>u.id!==profile?.id&&u.role!=='super_admin');
      const allSelected=selectableUsers.length>0&&selectableUsers.every(u=>selectedUsers.includes(u.id));

      if(!can('manage_users'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4">
          <div>
            <h1 className="text-2xl font-bold">Utilisateurs</h1>
            <p className="text-sm text-gray-400">{users.length} utilisateur{users.length>1?'s':''}</p>
          </div>
          <div className="flex gap-2">
            {selectedUsers.length>0&&(
              <Button variant="secondary" icon="Trash2" className="text-red-400 border-red-500/50 hover:bg-red-500/10" onClick={()=>setBulkDeleteModal(true)}>
                Supprimer ({selectedUsers.length})
              </Button>
            )}
