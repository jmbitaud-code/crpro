            const{data}=await supabase.from('content_packs').insert({name:packForm.name,code:packForm.code||null,description:packForm.description,pack_type:packForm.pack_type}).select().single();
            packId=data.id;
          }
          const items=[];
          packContents.videos.forEach(id=>items.push({pack_id:packId,content_type:'video',content_id:id}));
          packContents.scorm.forEach(id=>items.push({pack_id:packId,content_type:'scorm',content_id:id}));
          packContents.quizzes.forEach(id=>items.push({pack_id:packId,content_type:'quiz',content_id:id}));
          packContents.courses.forEach(id=>items.push({pack_id:packId,content_type:'course',content_id:id}));
          packContents.paths.forEach(id=>items.push({pack_id:packId,content_type:'path',content_id:id}));
          if(items.length>0)await supabase.from('content_pack_items').insert(items);
          setPackModal(false);load();
        }catch(e){console.error(e);}
        setSaving(false);
      };
      
      const deletePack=async(id)=>{
        if(!confirm('Supprimer ce pack ?'))return;
        await supabase.from('content_packs').delete().eq('id',id);
        load();
      };
      
      const getPackStats=(packId)=>{
        const items=packItems.filter(i=>i.pack_id===packId);
        return{videos:items.filter(i=>i.content_type==='video').length,scorm:items.filter(i=>i.content_type==='scorm').length,quizzes:items.filter(i=>i.content_type==='quiz').length,courses:items.filter(i=>i.content_type==='course').length,paths:items.filter(i=>i.content_type==='path').length,total:items.length};
      };
      
      const getTotalContents=()=>packContents.videos.length+packContents.scorm.length+packContents.quizzes.length+packContents.courses.length+packContents.paths.length;
      
      if(!isSuperAdmin)return<Alert type="warning">Accès réservé aux super administrateurs</Alert>;
      if(loading)return<div className="flex justify-center py-12"><Icon name="Loader2" size={32} className="animate-spin text-indigo-400"/></div>;
      
      return<div>

            <Card className="px-4 py-2 text-center"><p className="text-2xl font-bold text-green-400">{packs.filter(p=>packItems.some(i=>i.pack_id===p.id)).length}</p><p className="text-xs text-gray-400">Avec contenu</p></Card>
          </div>
          <Button icon="Plus" onClick={()=>openPackModal()}>Créer un pack</Button>
        </div>
        
        {packs.length===0?<Empty icon="Boxes" title="Aucun pack" desc="Créez des packs pour regrouper vos contenus LMS"/>:
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          {packs.map(p=>{const stats=getPackStats(p.id);return<Card key={p.id} className="p-4">

              </div>
              <div className="flex-1 min-w-0">
                <h3 className="font-semibold truncate">{p.name}</h3>
                <p className="text-sm text-gray-400">{p.code||'Sans code'} • {p.pack_type==='bundle'?'Bundle':'Personnalisé'}</p>

            </div>
            <div className="flex flex-wrap gap-2 mb-3 text-xs">
              {stats.videos>0&&<span className="px-2 py-1 bg-blue-500/20 text-blue-300 rounded">{stats.videos} vidéos</span>}
              {stats.scorm>0&&<span className="px-2 py-1 bg-orange-500/20 text-orange-300 rounded">{stats.scorm} SCORM</span>}
              {stats.quizzes>0&&<span className="px-2 py-1 bg-green-500/20 text-green-300 rounded">{stats.quizzes} quiz</span>}
              {stats.courses>0&&<span className="px-2 py-1 bg-indigo-500/20 text-indigo-300 rounded">{stats.courses} cours</span>}
              {stats.paths>0&&<span className="px-2 py-1 bg-purple-500/20 text-purple-300 rounded">{stats.paths} parcours</span>}
              {stats.total===0&&<span className="px-2 py-1 bg-red-500/20 text-red-400 rounded">Vide</span>}
            </div>
            {p.description&&<p className="text-sm text-gray-400 line-clamp-2 mb-3">{p.description}</p>}
            <div className="flex flex-wrap gap-2">
              <Button variant="ghost" size="sm" icon="Edit2" onClick={()=>openPackModal(p)}>Modifier</Button>
              <Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>deletePack(p.id)}/>
            </div>
          </Card>})}
        </div>}
        
        <Modal isOpen={packModal} onClose={()=>setPackModal(false)} title={editingPack?'Modifier le pack':'Créer un pack'} size="xl">
          <div className="space-y-4">
            <div className="grid grid-cols-3 gap-4">
              <Input label="Nom *" value={packForm.name} onChange={e=>setPackForm({...packForm,name:e.target.value})}/>
              <Input label="Code" value={packForm.code} onChange={e=>setPackForm({...packForm,code:e.target.value})} placeholder="PACK_001"/>
              <Select label="Type" value={packForm.pack_type} onChange={e=>setPackForm({...packForm,pack_type:e.target.value})} options={[{value:'bundle',label:'Bundle'},{value:'custom',label:'Personnalisé'}]}/>
            </div>
            <div><label className="block text-sm font-medium text-gray-300 mb-1">Description</label><textarea value={packForm.description} onChange={e=>setPackForm({...packForm,description:e.target.value})} rows={2} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/></div>
            
            <div className="border-t border-gray-700 pt-4">
              <h4 className="font-semibold mb-3">Contenus du pack ({getTotalContents()} sélectionnés)</h4>
              <Tabs tabs={[
                {id:'pk-videos',label:`Vidéos (${packContents.videos.length})`,icon:'Film'},
                {id:'pk-scorm',label:`SCORM (${packContents.scorm.length})`,icon:'Package'},
                {id:'pk-quizzes',label:`Quiz (${packContents.quizzes.length})`,icon:'HelpCircle'},
                {id:'pk-courses',label:`Cours (${packContents.courses.length})`,icon:'BookOpen'},
                {id:'pk-paths',label:`Parcours (${packContents.paths.length})`,icon:'Route'}

              <div className="max-h-64 overflow-y-auto mt-3 space-y-1">
                {packTab==='pk-videos'&&(videos.length===0?<p className="text-gray-500 text-sm text-center py-4">Aucune vidéo LMS</p>:videos.map(v=><label key={v.id} className={`flex items-center gap-2 p-2 rounded cursor-pointer ${isInPack('video',v.id)?'bg-indigo-600/30':'hover:bg-gray-700'}`}>
                  <input type="checkbox" checked={isInPack('video',v.id)} onChange={()=>togglePackContent('video',v.id)} className="rounded"/>
                  <Icon name="Film" size={16}/><span className="truncate">{v.title}</span>

                {packTab==='pk-scorm'&&(scormModules.length===0?<p className="text-gray-500 text-sm text-center py-4">Aucun module SCORM LMS</p>:scormModules.map(m=><label key={m.id} className={`flex items-center gap-2 p-2 rounded cursor-pointer ${isInPack('scorm',m.id)?'bg-indigo-600/30':'hover:bg-gray-700'}`}>

                  <Icon name="Package" size={16}/><span className="truncate">{m.title}</span>

                {packTab==='pk-quizzes'&&(quizzes.length===0?<p className="text-gray-500 text-sm text-center py-4">Aucun quiz LMS</p>:quizzes.map(q=><label key={q.id} className={`flex items-center gap-2 p-2 rounded cursor-pointer ${isInPack('quiz',q.id)?'bg-indigo-600/30':'hover:bg-gray-700'}`}>
                  <input type="checkbox" checked={isInPack('quiz',q.id)} onChange={()=>togglePackContent('quiz',q.id)} className="rounded"/>
                  <Icon name="HelpCircle" size={16}/><span className="truncate">{q.title}</span>
                </label>))}
                {packTab==='pk-courses'&&(courses.length===0?<p className="text-gray-500 text-sm text-center py-4">Aucun cours LMS</p>:courses.map(c=><label key={c.id} className={`flex items-center gap-2 p-2 rounded cursor-pointer ${isInPack('course',c.id)?'bg-indigo-600/30':'hover:bg-gray-700'}`}>
                  <input type="checkbox" checked={isInPack('course',c.id)} onChange={()=>togglePackContent('course',c.id)} className="rounded"/>
                  <Icon name="BookOpen" size={16}/><span className="truncate">{c.title}</span>

                {packTab==='pk-paths'&&(paths.length===0?<p className="text-gray-500 text-sm text-center py-4">Aucun parcours</p>:paths.map(p=><label key={p.id} className={`flex items-center gap-2 p-2 rounded cursor-pointer ${isInPack('path',p.id)?'bg-indigo-600/30':'hover:bg-gray-700'}`}>
                  <input type="checkbox" checked={isInPack('path',p.id)} onChange={()=>togglePackContent('path',p.id)} className="rounded"/>
                  <Icon name="Route" size={16}/><span className="truncate">{p.title}</span>
                </label>))}
              </div>
            </div>
            
            <div className="flex justify-end gap-3 pt-4 border-t border-gray-700">
              <Button variant="secondary" onClick={()=>setPackModal(false)}>Annuler</Button>
              <Button onClick={savePack} loading={saving} disabled={!packForm.name}>Enregistrer</Button>
            </div>
          </div>
        </Modal>
      </div>;
    }
    
    // ============================================================
    // SOUS-PAGE: Catalogue de contenu
    // mode: undefined = tout (super admin/legacy), 'formations' = cours+parcours, 'ressources' = vidéos+scorm+quiz
    // ============================================================
    function ContentCataloguePage({mode}){
      const{isSuperAdmin,center,realRole,effectiveRole,can}=useAuth();
      const{categories}=useTaxonomy();
      const{isLicensed}=useLicenseInfo();
      
      const isFormations=mode==='formations';
      const isRessources=mode==='ressources';
      const isAll=!mode;
      
      const canPreview=can('preview_content')||isSuperAdmin;
      const canRequestLicense=can('request_licenses')&&!isSuperAdmin&&!!center?.id;
      
      const defaultTab=isFormations?'courses':isRessources?'videos':'videos';
      const[activeTab,setActiveTab]=useState(defaultTab);
      const[videos,setVideos]=useState([]);
      const[scormModules,setScormModules]=useState([]);
      const[quizzes,setQuizzes]=useState([]);
      const[courses,setCourses]=useState([]);
      const[paths,setPaths]=useState([]);
      const[loading,setLoading]=useState(true);
      const[search,setSearch]=useState('');
      const[filterCategory,setFilterCategory]=useState('');
      const[previewModal,setPreviewModal]=useState(null);
      const[previewScormCatalog,setPreviewScormCatalog]=useState(null);
      const[requestCart,setRequestCart]=useState({videos:[],scorm:[],quizzes:[],courses:[],paths:[]});
      const[requestCartModal,setRequestCartModal]=useState(false);
      const[requestCartForm,setRequestCartForm]=useState({name:'',description:'',duration_months:12,max_learners:'',message:''});
      const[requestCartSaving,setRequestCartSaving]=useState(false);
      
      const load=useCallback(async()=>{
        const[{data:vids},{data:scorm},{data:quiz},{data:cours},{data:path}]=await Promise.all([
          supabase.from('videos').select('*,content_categories(id,name,color),content_themes(id,name),content_sub_themes(id,name)').eq('is_lms_content',true).order('sort_order').order('title'),
          supabase.from('scorm_modules').select('*,content_categories(id,name,color),content_themes(id,name),content_sub_themes(id,name)').eq('is_lms_content',true).order('title'),
          supabase.from('quizzes').select('*,content_categories(id,name,color),content_themes(id,name),content_sub_themes(id,name),quiz_questions(count)').eq('is_lms_content',true).order('title'),
          supabase.from('playlists').select('*,content_categories(id,name,color),content_themes(id,name),content_sub_themes(id,name),playlist_videos(count)').eq('is_lms_content',true).order('title'),
          supabase.from('learning_paths').select('*,content_categories(id,name,color),content_themes(id,name),content_sub_themes(id,name),learning_path_courses(count)').eq('is_lms_content',true).order('title')
        ]);
        setVideos(vids||[]);
        setScormModules(scorm||[]);
        setQuizzes(quiz||[]);
        setCourses(cours||[]);
        setPaths(path||[]);
        
        setLoading(false);
      },[]);
      
      useEffect(()=>{load();},[load]);
      
      const toggleRequestCart=(type,id,item)=>{
        setRequestCart(prev=>{
          const list=[...prev[type+'s']||[]];
          const idx=list.findIndex(i=>i.id===id);
          if(idx>=0)list.splice(idx,1);
          else list.push({id,title:item.title,type});
          return{...prev,[type+'s']:list};
        });
      };
      
      const isInRequestCart=(type,id)=>(requestCart[type+'s']||[]).some(i=>i.id===id);
      
      const getRequestCartCount=()=>{
        return(requestCart.videos?.length||0)+(requestCart.scorm?.length||0)+(requestCart.quizzes?.length||0)+(requestCart.courses?.length||0)+(requestCart.paths?.length||0);
      };
      
      // Générer le PDF de demande de licence
      const generateRequestPDF=async(requestData)=>{
        const{jsPDF}=window.jspdf;
        const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
        const pageWidth=doc.internal.pageSize.getWidth();
        const margin=20;
        let y=20;
        const primaryColor=[99,102,241];
        const textColor=[55,65,81];
        const lightGray=[156,163,175];
        
        // En-tête
        doc.setFillColor(...primaryColor);
        doc.rect(0,0,pageWidth,45,'F');
        doc.setTextColor(255,255,255);
        doc.setFontSize(24);doc.setFont('helvetica','bold');
        doc.text('CRPro',margin,25);
        doc.setFontSize(10);doc.setFont('helvetica','normal');
        doc.text('Learning Management System',margin,32);
        doc.setFontSize(14);
        doc.text('DEMANDE DE LICENCE',pageWidth-margin,25,{align:'right'});
        doc.setFontSize(10);
        doc.text(`N° ${Date.now().toString(36).toUpperCase()}`,pageWidth-margin,32,{align:'right'});
        y=55;
        
        // Informations du demandeur
        doc.setTextColor(...textColor);
        doc.setFontSize(12);doc.setFont('helvetica','bold');
        doc.text('INFORMATIONS DU DEMANDEUR',margin,y);y+=8;
        doc.setDrawColor(...primaryColor);doc.setLineWidth(0.5);
        doc.line(margin,y,pageWidth-margin,y);y+=8;
        doc.setFontSize(10);doc.setFont('helvetica','normal');
        [['Centre:',requestData.centerName||'-'],['Demandeur:',requestData.requesterName||'-'],['Email:',requestData.requesterEmail||'-'],['Date:',new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})]].forEach(([label,value])=>{
          doc.setFont('helvetica','bold');doc.text(label,margin,y);
          doc.setFont('helvetica','normal');doc.text(value,margin+35,y);y+=6;
        });
        y+=10;
        
        // Détails
        doc.setFontSize(12);doc.setFont('helvetica','bold');
        doc.text('DÉTAILS DE LA DEMANDE',margin,y);y+=8;
        doc.line(margin,y,pageWidth-margin,y);y+=8;
        doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(...primaryColor);
        doc.text(requestData.name,margin,y);y+=7;
        if(requestData.description){doc.setFontSize(10);doc.setFont('helvetica','italic');doc.setTextColor(...lightGray);const dl=doc.splitTextToSize(requestData.description,pageWidth-2*margin);doc.text(dl,margin,y);y+=dl.length*5+5;}
        doc.setTextColor(...textColor);doc.setFont('helvetica','normal');doc.setFontSize(10);
        doc.text(`Durée: ${requestData.duration_months} mois`,margin,y);y+=6;
        doc.text(`Apprenants: ${requestData.max_learners||'Illimité'}`,margin,y);y+=12;
        
        // Contenus
        doc.setFontSize(12);doc.setFont('helvetica','bold');
        doc.text(`CONTENUS DEMANDÉS (${requestData.totalItems})`,margin,y);y+=8;
        doc.line(margin,y,pageWidth-margin,y);y+=8;
        doc.setFontSize(10);
        [{key:'videos',label:'Vidéos',icon:'🎬',color:[59,130,246]},{key:'scorm',label:'SCORM',icon:'📦',color:[249,115,22]},{key:'quizzes',label:'Quiz',icon:'❓',color:[34,197,94]},{key:'courses',label:'Cours',icon:'📚',color:[99,102,241]},{key:'paths',label:'Parcours',icon:'🛤️',color:[168,85,247]}].forEach(ct=>{
          const items=requestData.cart[ct.key]||[];
          if(items.length>0){
            doc.setFont('helvetica','bold');doc.setTextColor(...ct.color);
            doc.text(`${ct.icon} ${ct.label} (${items.length})`,margin,y);y+=6;
            doc.setFont('helvetica','normal');doc.setTextColor(...textColor);
            items.forEach((item,i)=>{if(y>270){doc.addPage();y=20;}doc.text(`   ${i+1}. ${item.title}`,margin,y);y+=5;});
            y+=5;
          }
        });
        
        if(requestData.message){if(y>240){doc.addPage();y=20;}y+=5;doc.setFontSize(12);doc.setFont('helvetica','bold');doc.setTextColor(...textColor);doc.text('MESSAGE',margin,y);y+=8;doc.line(margin,y,pageWidth-margin,y);y+=8;doc.setFontSize(10);doc.setFont('helvetica','normal');const ml=doc.splitTextToSize(requestData.message,pageWidth-2*margin);doc.text(ml,margin,y);}
        
        // Pied de page
        const pc=doc.internal.getNumberOfPages();
        for(let i=1;i<=pc;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(...lightGray);doc.text(`Document généré par CRPro - Page ${i}/${pc}`,pageWidth/2,290,{align:'center'});}
        return doc.output('datauristring').split(',')[1];
      };
      
      const submitLicenseRequest=async()=>{
        if(!requestCartForm.name)return alert('Nom de la demande requis');
        setRequestCartSaving(true);
        try{
        // Créer la demande
        const{data:user}=await supabase.auth.getUser();
        const{data:profile}=await supabase.from('profiles').select('first_name,last_name,email').eq('id',user?.user?.id).single();
        
        // Déterminer le type de demande en fonction du mode
        const requestType=isRessources?'resource_volume':'content_pack';
        
        // Pour les demandes volume, construire la liste des supports demandés

    // Users
    function UsersPage(){
      const{profile,center,isSuperAdmin,realRole,can,canAssignRole}=useAuth();
      const[users,setUsers]=useState([]);
      const[centers,setCenters]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[createModal,setCreateModal]=useState(false);
      const[importModal,setImportModal]=useState(false);
      const[deleteModal,setDeleteModal]=useState(null);
      const[bulkDeleteModal,setBulkDeleteModal]=useState(false);
      const[deleting,setDeleting]=useState(false);
      const[editing,setEditing]=useState(null);
      const[search,setSearch]=useState('');
      const[filterRole,setFilterRole]=useState('');
      const[filterCenter,setFilterCenter]=useState('');
      const[sortBy,setSortBy]=useState('created_at');
      const[sortDir,setSortDir]=useState('desc');
      const[selectedUsers,setSelectedUsers]=useState([]);
      const[form,setForm]=useState({email:'',first_name:'',last_name:'',role:'learner',center_id:''});
      const[createForm,setCreateForm]=useState({email:'',password:'',first_name:'',last_name:'',role:'learner',center_id:''});
      const[saving,setSaving]=useState(false);
      const[creating,setCreating]=useState(false);
      const[createResult,setCreateResult]=useState(null);
      const[importData,setImportData]=useState([]);
      const[importLoading,setImportLoading]=useState(false);
      const[importResult,setImportResult]=useState(null);
      const fileInputRef=useRef(null);
      
      // Rôles que l'utilisateur courant peut assigner
      const assignableRoles=Object.entries(ROLE_LABELS).filter(([r])=>{
        if(isSuperAdmin)return true;
        return canAssignRole(r);
      });

      const load=useCallback(async()=>{
        let q=supabase.from('profiles').select('*,centers(name)').order('created_at',{ascending:false});
        // Filtrage par centre pour non-super-admin
        if(!isSuperAdmin&&center?.id)q=q.eq('center_id',center.id);
        const{data:u}=await q;setUsers(u||[]);
        const{data:c}=await supabase.from('centers').select('id,name');setCenters(c||[]);
        setLoading(false);
        setSelectedUsers([]);
      },[isSuperAdmin,center?.id]);
      
      useEffect(()=>{load();},[load]);

      // Suppression par lot
      const handleBulkDelete=async()=>{
        if(!selectedUsers.length||!can('delete_users'))return;
        setDeleting(true);
        try{
          for(const userId of selectedUsers){
            await supabase.from('enrollments').delete().eq('learner_id',userId);
            await supabase.from('video_progress').delete().eq('learner_id',userId);
            await supabase.from('scorm_progress').delete().eq('learner_id',userId);
            await supabase.from('quiz_attempts').delete().eq('learner_id',userId);
            await supabase.from('learner_badges').delete().eq('learner_id',userId);
            await supabase.from('learner_points').delete().eq('learner_id',userId);
            await supabase.from('learner_notes').delete().eq('learner_id',userId);
            await supabase.from('notifications').delete().eq('user_id',userId);
            await supabase.from('certificates').delete().eq('learner_id',userId);
            await supabase.from('profiles').delete().eq('id',userId);
          }
          await load();
          setBulkDeleteModal(false);
        }catch(err){
          console.error('Erreur suppression:',err);
          alert('Erreur lors de la suppression: '+err.message);
        }
        setDeleting(false);
      };

      // Sélection
      const toggleSelect=(userId)=>{
        setSelectedUsers(prev=>prev.includes(userId)?prev.filter(id=>id!==userId):[...prev,userId]);
      };
      const toggleSelectAll=(filteredUsers)=>{
        const selectableUsers=filteredUsers.filter(u=>u.id!==profile?.id&&u.role!=='super_admin');
        const allSelected=selectableUsers.every(u=>selectedUsers.includes(u.id));
        if(allSelected){
          setSelectedUsers([]);
        }else{
          setSelectedUsers(selectableUsers.map(u=>u.id));
        }
      };

      // Tri
      const handleSort=(field)=>{
        if(sortBy===field){
          setSortDir(prev=>prev==='asc'?'desc':'asc');
        }else{
          setSortBy(field);
          setSortDir('asc');
        }
      };

      const handleCreate=async()=>{
        if(!createForm.email||!createForm.first_name||!createForm.last_name){
          alert('Veuillez remplir tous les champs obligatoires');return;
        }
        // Valider le rôle selon les permissions
        const allowedRoles=isSuperAdmin?['learner','trainer','center_admin','super_admin']:['learner','trainer'];
        const finalRole=allowedRoles.includes(createForm.role)?createForm.role:'learner';
        
        setCreating(true);setCreateResult(null);
        try{
          const password=createForm.password||generatePassword();
          const targetCenterId=isSuperAdmin?(createForm.center_id||center?.id):center?.id;
          
          // Créer l'utilisateur via l'API Supabase Auth
          const{data:authData,error:authError}=await supabase.auth.signUp({
            email:createForm.email.toLowerCase().trim(),
            password:password,
            options:{data:{first_name:createForm.first_name,last_name:createForm.last_name}}
          });
          
          if(authError)throw authError;
          if(!authData.user)throw new Error('Erreur lors de la création du compte');
          
          // Mettre à jour le profil avec le rôle et le centre
          const{error:profileError}=await supabase.from('profiles').update({
            first_name:createForm.first_name,
            last_name:createForm.last_name,
            role:finalRole,
            center_id:targetCenterId||null
          }).eq('id',authData.user.id);
          
          if(profileError)console.error('Erreur profil:',profileError);
          
          setCreateResult({success:true,email:createForm.email,password:password});
          await load();
        }catch(err){
          console.error('Erreur création:',err);
          setCreateResult({success:false,error:err.message});
        }
        setCreating(false);
      };

      const resetCreateForm=()=>{
        setCreateForm({email:'',password:'',first_name:'',last_name:'',role:'learner',center_id:center?.id||''});
        setCreateResult(null);
      };

      const handleSave=async()=>{
        if(!editing)return;
        // Protection: un non-super_admin ne peut pas modifier un super_admin
        if(!isSuperAdmin&&editing.role==='super_admin'){
          alert('Vous n\'avez pas la permission de modifier ce profil.');
          setModal(false);setEditing(null);
          return;
        }
        // Protection: un non-super_admin ne peut pas promouvoir quelqu'un en super_admin
        if(!isSuperAdmin&&form.role==='super_admin'){
          alert('Vous n\'avez pas la permission d\'attribuer ce rôle.');
          return;
        }
        setSaving(true);
        await supabase.from('profiles').update({first_name:form.first_name,last_name:form.last_name,role:form.role,center_id:form.center_id||null}).eq('id',editing.id);
        await load();setModal(false);setEditing(null);setSaving(false);
      };

      const handleDelete=async()=>{
        if(!deleteModal)return;
        setDeleting(true);
        try{
          // Supprimer les données liées
          await supabase.from('enrollments').delete().eq('learner_id',deleteModal.id);
          await supabase.from('video_progress').delete().eq('learner_id',deleteModal.id);
          await supabase.from('scorm_progress').delete().eq('learner_id',deleteModal.id);
          await supabase.from('quiz_attempts').delete().eq('learner_id',deleteModal.id);
          await supabase.from('learner_badges').delete().eq('learner_id',deleteModal.id);
          await supabase.from('learner_points').delete().eq('learner_id',deleteModal.id);
          await supabase.from('learner_notes').delete().eq('learner_id',deleteModal.id);
          await supabase.from('notifications').delete().eq('user_id',deleteModal.id);
          await supabase.from('certificates').delete().eq('learner_id',deleteModal.id);
          
          // Supprimer le profil
          await supabase.from('profiles').delete().eq('id',deleteModal.id);
          
          // Supprimer l'utilisateur auth (nécessite une fonction Edge ou admin API)
          // Note: Cela nécessite les droits admin Supabase
          // Pour l'instant on garde le user auth mais sans profil
          
          await load();
          setDeleteModal(null);
        }catch(err){
          console.error('Erreur suppression:',err);
          alert('Erreur lors de la suppression: '+err.message);
        }
        setDeleting(false);
      };

      const handleFileSelect=async(e)=>{
        const file=e.target.files[0];if(!file)return;
        try{
          const data=await file.arrayBuffer();
          const workbook=XLSX.read(data);
          const sheet=workbook.Sheets[workbook.SheetNames[0]];
          const jsonData=XLSX.utils.sheet_to_json(sheet);
          // Rôles autorisés selon le type d'admin
          const allowedRoles=isSuperAdmin?['learner','trainer','center_admin','super_admin']:['learner','trainer'];
          const mapped=jsonData.map((row,i)=>{
            let role=String(row['Rôle']||row['Role']||row['role']||'learner').toLowerCase();
            // Si le rôle n'est pas autorisé pour cet admin, forcer à 'learner'
            if(!allowedRoles.includes(role))role='learner';
            return{
              _index:i+1,
              email:String(row['Email']||row['email']||'').toLowerCase().trim(),
              first_name:row['Prénom']||row['Prenom']||row['first_name']||'',
              last_name:row['Nom']||row['last_name']||'',
              role:role,
              password:row['Mot de passe']||row['Password']||row['password']||'',
              center_name:row['Centre']||row['center']||'',
              _valid:!!(row['Email']||row['email'])&&!!(row['Prénom']||row['Prenom']||row['first_name'])&&!!(row['Nom']||row['last_name']),
              _roleForced:!allowedRoles.includes(String(row['Rôle']||row['Role']||row['role']||'learner').toLowerCase())
            };
          });
          setImportData(mapped);setImportResult(null);
        }catch(err){alert('Erreur: '+err.message);}
        e.target.value='';
      };

      const handleImport=async()=>{
        const validData=importData.filter(d=>d._valid);
        if(!validData.length){alert('Aucune donnée valide');return;}
        
        setImportLoading(true);
        try{
          const usersToCreate=validData.map(item=>{
            let targetCenterId=center?.id;
            if(isSuperAdmin&&item.center_name){
              const found=centers.find(c=>c.name.toLowerCase()===item.center_name.toLowerCase());
              if(found)targetCenterId=found.id;
            }
            return{email:item.email,password:item.password||'',first_name:item.first_name,last_name:item.last_name,role:item.role,center_id:targetCenterId};
          });

          const{data:{session}}=await supabase.auth.getSession();
          const response=await fetch(`${SUPABASE_URL}/functions/v1/create-users`,{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token}`},
            body:JSON.stringify({users:usersToCreate})
          });

          const result=await response.json();
          
          if(result.success){
            setImportResult({created:result.created||0,updated:result.updated||0,errors:result.errors||0,results:result.results||[]});
            await load();
          }else{
            setImportResult({created:0,updated:0,errors:validData.length,errorMessage:result.error});
          }
        }catch(err){
          setImportResult({created:0,updated:0,errors:validData.length,errorMessage:err.message});
        }
        setImportLoading(false);
      };

      const downloadTemplate=()=>{
        const template=[{'Email':'paul@email.com','Prénom':'Paul','Nom':'Moreau','Rôle':'learner','Mot de passe':'','Centre':''}];
        const ws=XLSX.utils.json_to_sheet(template);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Utilisateurs');
        XLSX.writeFile(wb,'template_utilisateurs.xlsx');
      };

      const exportResults=()=>{
        if(!importResult?.results)return;
        const data=importResult.results.map(r=>({'Email':r.email,'Statut':r.status==='created'?'Créé':r.status==='updated'?'Mis à jour':'Erreur','Mot de passe':r.password||'','Message':r.message||''}));
        const ws=XLSX.utils.json_to_sheet(data);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Résultats');
        XLSX.writeFile(wb,'resultat_import.xlsx');
      };

      const filtered=useMemo(()=>{
        let result=[...users];
        // Recherche
        if(search){
          const s=search.toLowerCase();
          result=result.filter(u=>u.email?.toLowerCase().includes(s)||u.first_name?.toLowerCase().includes(s)||u.last_name?.toLowerCase().includes(s));
        }
        // Filtre par rôle
        if(filterRole){
          result=result.filter(u=>u.role===filterRole);
        }
        // Filtre par centre
        if(filterCenter){
          result=result.filter(u=>u.center_id===filterCenter);
        }
        // Tri
        result.sort((a,b)=>{
          let valA,valB;
          switch(sortBy){
            case 'name':valA=`${a.first_name} ${a.last_name}`.toLowerCase();valB=`${b.first_name} ${b.last_name}`.toLowerCase();break;
            case 'email':valA=a.email?.toLowerCase()||'';valB=b.email?.toLowerCase()||'';break;
            case 'role':valA=a.role||'';valB=b.role||'';break;
            case 'center':valA=a.centers?.name?.toLowerCase()||'';valB=b.centers?.name?.toLowerCase()||'';break;
            default:valA=a.created_at||'';valB=b.created_at||'';
          }
          if(valA<valB)return sortDir==='asc'?-1:1;
          if(valA>valB)return sortDir==='asc'?1:-1;
          return 0;
        });
        return result;
      },[users,search,filterRole,filterCenter,sortBy,sortDir]);

      const selectableUsers=filtered.filter(u=>u.id!==profile?.id&&u.role!=='super_admin');
      const allSelected=selectableUsers.length>0&&selectableUsers.every(u=>selectedUsers.includes(u.id));

      if(!can('create_users')&&!can('edit_users')&&!can('delete_users'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4">
          <div>
            <h1 className="text-2xl font-bold">Utilisateurs</h1>
            <p className="text-sm text-gray-400">{users.length} utilisateur{users.length>1?'s':''}{!isSuperAdmin&&center?' - '+center.name:''}</p>
          </div>
          <div className="flex gap-2">
            {selectedUsers.length>0&&(
              <Button variant="secondary" icon="Trash2" className="text-red-400 border-red-500/50 hover:bg-red-500/10" onClick={()=>setBulkDeleteModal(true)}>
                Supprimer ({selectedUsers.length})
              </Button>
            )}
            <Button icon="UserPlus" onClick={()=>{resetCreateForm();setCreateModal(true);}}>Ajouter</Button>
            {can('import_users')&&<Button variant="secondary" icon="Upload" onClick={()=>setImportModal(true)}>Importer</Button>}
          </div>
        </div>
        
        {/* Filtres */}
        <Card className="p-4 mb-6">
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <Input icon="Search" placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)}/>
            <Select value={filterRole} onChange={e=>setFilterRole(e.target.value)} options={[
              {value:'',label:'Tous les rôles'},
              {value:'learner',label:'Apprenants'},
              {value:'trainer',label:'Formateurs'},
              {value:'center_admin',label:'Admins de centre'},
              {value:'super_admin',label:'Super Admins'}
            ]}/>
            {isSuperAdmin&&<Select value={filterCenter} onChange={e=>setFilterCenter(e.target.value)} options={[
              {value:'',label:'Tous les centres'},
              ...centers.map(c=>({value:c.id,label:c.name}))
            ]}/>}
            <Select value={`${sortBy}-${sortDir}`} onChange={e=>{const[field,dir]=e.target.value.split('-');setSortBy(field);setSortDir(dir);}} options={[
              {value:'created_at-desc',label:'Plus récents'},
              {value:'created_at-asc',label:'Plus anciens'},
              {value:'name-asc',label:'Nom A-Z'},
              {value:'name-desc',label:'Nom Z-A'},
              {value:'email-asc',label:'Email A-Z'},
              {value:'role-asc',label:'Rôle A-Z'}
            ]}/>
          </div>
        </Card>
        
        {/* Tableau */}
        <Card>
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead className="bg-gray-750">
                <tr>
                  <th className="p-4 w-12">
                    <input type="checkbox" checked={allSelected} onChange={()=>toggleSelectAll(filtered)} className="w-4 h-4 rounded bg-gray-700 border-gray-600 text-indigo-600 focus:ring-indigo-500"/>
                  </th>
                  <th className="text-left p-4 font-medium text-gray-400 cursor-pointer hover:text-white" onClick={()=>handleSort('name')}>
                    <div className="flex items-center gap-1">Utilisateur {sortBy==='name'&&<Icon name={sortDir==='asc'?'ChevronUp':'ChevronDown'} size={14}/>}</div>
                  </th>
                  <th className="text-left p-4 font-medium text-gray-400 cursor-pointer hover:text-white" onClick={()=>handleSort('role')}>
                    <div className="flex items-center gap-1">Rôle {sortBy==='role'&&<Icon name={sortDir==='asc'?'ChevronUp':'ChevronDown'} size={14}/>}</div>
                  </th>
                  {isSuperAdmin&&<th className="text-left p-4 font-medium text-gray-400 cursor-pointer hover:text-white" onClick={()=>handleSort('center')}>
                    <div className="flex items-center gap-1">Centre {sortBy==='center'&&<Icon name={sortDir==='asc'?'ChevronUp':'ChevronDown'} size={14}/>}</div>
                  </th>}
                  <th className="text-left p-4 font-medium text-gray-400 cursor-pointer hover:text-white" onClick={()=>handleSort('created_at')}>
                    <div className="flex items-center gap-1">Créé le {sortBy==='created_at'&&<Icon name={sortDir==='asc'?'ChevronUp':'ChevronDown'} size={14}/>}</div>
                  </th>
                  <th className="text-right p-4"></th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-700">
                {filtered.length===0?(
                  <tr><td colSpan={isSuperAdmin?6:5} className="p-8 text-center text-gray-500">Aucun utilisateur trouvé</td></tr>
                ):filtered.map(u=>(
                  <tr key={u.id} className={`hover:bg-gray-750/50 ${selectedUsers.includes(u.id)?'bg-indigo-500/10':''}`}>
                    <td className="p-4">
                      {u.id!==profile?.id&&u.role!=='super_admin'?(
                        <input type="checkbox" checked={selectedUsers.includes(u.id)} onChange={()=>toggleSelect(u.id)} className="w-4 h-4 rounded bg-gray-700 border-gray-600 text-indigo-600 focus:ring-indigo-500"/>

                    <td className="p-4">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center"><Icon name="User" size={18}/></div>
                        <div>
                          <p className="font-medium">{u.first_name} {u.last_name}</p>

                        </div>
                      </div>
                    </td>
                    <td className="p-4"><RoleBadge role={u.role}/></td>
                    {isSuperAdmin&&<td className="p-4 text-gray-400">{u.centers?.name||'-'}</td>}
                    <td className="p-4 text-gray-400 text-sm">{u.created_at?new Date(u.created_at).toLocaleDateString('fr-FR'):'-'}</td>
                    <td className="p-4 text-right">
                      <div className="flex justify-end gap-1">
                        {/* Seul le super_admin peut éditer un autre super_admin */}

                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {filtered.length>0&&<div className="p-4 border-t border-gray-700 text-sm text-gray-400">
            {selectedUsers.length>0?`${selectedUsers.length} sélectionné${selectedUsers.length>1?'s':''} sur `:''}{filtered.length} utilisateur{filtered.length>1?'s':''}
          </div>}
        </Card>
        
        {/* Modal de suppression par lot */}
        <Modal isOpen={bulkDeleteModal} onClose={()=>setBulkDeleteModal(false)} title="Supprimer les utilisateurs sélectionnés">
          <div className="space-y-4">
            <div className="p-4 bg-red-500/10 border border-red-500/30 rounded-lg">
              <div className="flex items-center gap-3 mb-3">
                <div className="w-12 h-12 bg-red-500/20 rounded-full flex items-center justify-center">
                  <Icon name="AlertTriangle" size={24} className="text-red-400"/>
                </div>
                <div>
                  <p className="font-semibold text-red-400">Attention !</p>
                  <p className="text-sm text-gray-400">Cette action est irréversible.</p>
                </div>
              </div>
              <p className="text-sm text-gray-300">
                Vous êtes sur le point de supprimer <strong className="text-white">{selectedUsers.length} utilisateur{selectedUsers.length>1?'s':''}</strong>.
              </p>
            </div>
            <div className="bg-gray-700/50 p-3 rounded-lg max-h-48 overflow-y-auto">
              <p className="font-medium text-gray-300 mb-2">Utilisateurs à supprimer :</p>
              <ul className="space-y-1 text-sm">
                {selectedUsers.map(id=>{
                  const u=users.find(user=>user.id===id);
                  return u?<li key={id} className="flex items-center gap-2"><Icon name="User" size={14} className="text-gray-500"/>{u.first_name} {u.last_name} <span className="text-gray-500">({u.email})</span></li>:null;
                })}
              </ul>
            </div>
            <div className="flex justify-end gap-3">
              <Button variant="secondary" onClick={()=>setBulkDeleteModal(false)}>Annuler</Button>
              <Button variant="primary" className="bg-red-600 hover:bg-red-700" icon="Trash2" onClick={handleBulkDelete} loading={deleting}>Supprimer {selectedUsers.length} utilisateur{selectedUsers.length>1?'s':''}</Button>
            </div>
          </div>
        </Modal>
        
        {/* Modal de création d'utilisateur */}
        <Modal isOpen={createModal} onClose={()=>{setCreateModal(false);resetCreateForm();}} title="Ajouter un utilisateur">
          <div className="space-y-4">
            {!createResult?(
              <>
                <Input label="Email *" type="email" icon="Mail" placeholder="email@exemple.com" value={createForm.email} onChange={e=>setCreateForm({...createForm,email:e.target.value})}/>
                <div className="grid grid-cols-2 gap-4">
                  <Input label="Prénom *" placeholder="Jean" value={createForm.first_name} onChange={e=>setCreateForm({...createForm,first_name:e.target.value})}/>
                  <Input label="Nom *" placeholder="Dupont" value={createForm.last_name} onChange={e=>setCreateForm({...createForm,last_name:e.target.value})}/>
                </div>
                <div className="relative">
                  <Input label="Mot de passe" type="text" icon="Lock" placeholder="Laisser vide pour générer" value={createForm.password} onChange={e=>setCreateForm({...createForm,password:e.target.value})}/>
                  <button type="button" onClick={()=>setCreateForm({...createForm,password:generatePassword()})} className="absolute right-2 top-8 text-xs text-indigo-400 hover:text-indigo-300">Générer</button>
                </div>
                <Select label="Rôle *" value={createForm.role} onChange={e=>setCreateForm({...createForm,role:e.target.value})} options={[
                  {value:'learner',label:'Apprenant'},
                  {value:'trainer',label:'Formateur'},
                  ...(isSuperAdmin?[
                    {value:'center_admin',label:'Admin de centre'},
                    {value:'super_admin',label:'Super Admin'}
                  ]:[])
                ]}/>
                {isSuperAdmin&&<Select label="Centre" value={createForm.center_id} onChange={e=>setCreateForm({...createForm,center_id:e.target.value})} options={[{value:'',label:'Aucun centre'},...centers.map(c=>({value:c.id,label:c.name}))]}/>}
                <div className="flex justify-end gap-3 pt-2">
                  <Button variant="secondary" onClick={()=>{setCreateModal(false);resetCreateForm();}}>Annuler</Button>
                  <Button icon="UserPlus" onClick={handleCreate} loading={creating}>Créer l'utilisateur</Button>
                </div>
              </>
            ):(
              <div className="space-y-4">
                {createResult.success?(
                  <>
                    <div className="p-4 bg-green-500/10 border border-green-500/30 rounded-lg text-center">
                      <div className="w-16 h-16 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-3">
                        <Icon name="CheckCircle" size={32} className="text-green-400"/>
                      </div>
                      <p className="font-semibold text-green-400 text-lg">Utilisateur créé avec succès !</p>
                    </div>
                    <div className="bg-gray-700/50 p-4 rounded-lg space-y-3">
                      <div><p className="text-xs text-gray-400">Email</p><p className="font-medium">{createResult.email}</p></div>
                      <div><p className="text-xs text-gray-400">Mot de passe</p><div className="flex items-center gap-2"><code className="bg-gray-800 px-3 py-1 rounded font-mono text-indigo-400">{createResult.password}</code><Button variant="ghost" size="sm" icon="Copy" onClick={()=>{navigator.clipboard.writeText(createResult.password);}}></Button></div></div>
                    </div>
                    <Alert type="warning">⚠️ Notez ce mot de passe, il ne sera plus affiché.</Alert>
                    <div className="flex justify-end gap-3">
                      <Button variant="secondary" onClick={()=>{setCreateModal(false);resetCreateForm();}}>Fermer</Button>
                      <Button icon="UserPlus" onClick={()=>{resetCreateForm();}}>Ajouter un autre</Button>
                    </div>
                  </>
                ):(
                  <>
                    <div className="p-4 bg-red-500/10 border border-red-500/30 rounded-lg text-center">
                      <div className="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-3">
                        <Icon name="XCircle" size={32} className="text-red-400"/>
                      </div>
                      <p className="font-semibold text-red-400">Erreur lors de la création</p>
                      <p className="text-sm text-gray-400 mt-2">{createResult.error}</p>
                    </div>
                    <div className="flex justify-end gap-3">
                      <Button variant="secondary" onClick={()=>{setCreateModal(false);resetCreateForm();}}>Fermer</Button>
                      <Button onClick={()=>setCreateResult(null)}>Réessayer</Button>
                    </div>
                  </>
                )}
              </div>
            )}
          </div>
        </Modal>
        
        {/* Modal de confirmation de suppression */}
        <Modal isOpen={!!deleteModal} onClose={()=>setDeleteModal(null)} title="Supprimer l'utilisateur">
          <div className="space-y-4">
            <div className="p-4 bg-red-500/10 border border-red-500/30 rounded-lg">
              <div className="flex items-center gap-3 mb-3">
                <div className="w-12 h-12 bg-red-500/20 rounded-full flex items-center justify-center">
                  <Icon name="AlertTriangle" size={24} className="text-red-400"/>
                </div>
                <div>
                  <p className="font-semibold text-red-400">Attention !</p>
                  <p className="text-sm text-gray-400">Cette action est irréversible.</p>
                </div>
              </div>
              <p className="text-sm text-gray-300">
                Vous êtes sur le point de supprimer l'utilisateur :
              </p>
              <p className="font-medium mt-2">{deleteModal?.first_name} {deleteModal?.last_name}</p>
              <p className="text-sm text-gray-400">{deleteModal?.email}</p>
            </div>
            <div className="bg-gray-700/50 p-3 rounded-lg text-sm text-gray-400">
              <p className="font-medium text-gray-300 mb-1">Données qui seront supprimées :</p>
              <ul className="list-disc list-inside space-y-1">
                <li>Inscriptions aux cours</li>
                <li>Progression vidéo et SCORM</li>
                <li>Résultats de quiz</li>
                <li>Badges et points</li>
                <li>Notes et certificats</li>
              </ul>
            </div>
            <div className="flex justify-end gap-3">
              <Button variant="secondary" onClick={()=>setDeleteModal(null)}>Annuler</Button>
              <Button variant="primary" className="bg-red-600 hover:bg-red-700" icon="Trash2" onClick={handleDelete} loading={deleting}>Supprimer définitivement</Button>
            </div>
          </div>
        </Modal>
        
        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title="Modifier"><div className="space-y-4"><Input label="Email" value={form.email} disabled/><div className="grid grid-cols-2 gap-4"><Input label="Prénom" value={form.first_name} onChange={e=>setForm({...form,first_name:e.target.value})}/><Input label="Nom" value={form.last_name} onChange={e=>setForm({...form,last_name:e.target.value})}/></div><Select label="Rôle" value={form.role} onChange={e=>setForm({...form,role:e.target.value})} options={Object.entries(ROLE_LABELS).filter(([r])=>isSuperAdmin||r!=='super_admin').map(([v,l])=>({value:v,label:l}))}/>{isSuperAdmin&&<Select label="Centre" value={form.center_id} onChange={e=>setForm({...form,center_id:e.target.value})} options={[{value:'',label:'Aucun'},...centers.map(c=>({value:c.id,label:c.name}))]}/>}<div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button><Button onClick={handleSave} loading={saving}>Enregistrer</Button></div></div></Modal>

        <Modal isOpen={importModal} onClose={()=>{setImportModal(false);setImportData([]);setImportResult(null);}} title="Importer des utilisateurs" size="lg">
          <div className="space-y-4">
            <Alert type="info"><p className="font-medium mb-1">✨ Import automatique</p><p className="text-sm">Crée les comptes et assigne les rôles.</p></Alert>
            <div className="bg-gray-700/50 rounded-lg p-4"><p className="text-sm text-gray-400 mb-2">Colonnes : Email*, Prénom*, Nom*, Rôle, Mot de passe, Centre</p><Button variant="ghost" size="sm" icon="Download" onClick={downloadTemplate}>Télécharger le template</Button></div>
            <div className="border-2 border-dashed border-gray-600 rounded-lg p-8 text-center"><input type="file" ref={fileInputRef} onChange={handleFileSelect} accept=".xlsx,.xls,.csv" className="hidden"/><Icon name="Users" size={48} className="mx-auto text-gray-500 mb-4"/><p className="text-gray-400 mb-4">Glissez un fichier Excel ou</p><Button variant="secondary" onClick={()=>fileInputRef.current?.click()}>Parcourir</Button></div>
            {importData.length>0&&!importResult&&(<div><h3 className="font-medium mb-2">Aperçu ({importData.filter(d=>d._valid).length} valides)</h3><div className="max-h-48 overflow-y-auto bg-gray-700/50 rounded-lg"><table className="w-full text-sm"><thead className="bg-gray-700 sticky top-0"><tr><th className="p-2 text-left">Email</th><th className="p-2 text-left">Nom</th><th className="p-2 text-left">Rôle</th></tr></thead><tbody>{importData.filter(d=>d._valid).map((row,i)=>(<tr key={i}><td className="p-2">{row.email}</td><td className="p-2">{row.first_name} {row.last_name}</td><td className="p-2"><RoleBadge role={row.role}/></td></tr>))}</tbody></table></div></div>)}
            {importResult&&(<div className="space-y-3">{importResult.errorMessage?(<Alert type="error"><p className="font-medium">❌ Erreur : {importResult.errorMessage}</p></Alert>):(<Alert type={importResult.errors>0?'warning':'success'}><p className="font-medium">{importResult.created>0&&<span className="text-green-400">✅ {importResult.created} créé(s) </span>}{importResult.updated>0&&<span className="text-blue-400">🔄 {importResult.updated} mis à jour </span>}{importResult.errors>0&&<span className="text-yellow-400">⚠️ {importResult.errors} erreur(s)</span>}</p></Alert>)}{importResult.results?.some(r=>r.password)&&(<div className="bg-indigo-500/20 p-4 rounded-lg"><p className="text-sm text-indigo-300 mb-2">⚠️ Des mots de passe ont été générés.</p><Button variant="secondary" size="sm" icon="Download" onClick={exportResults}>Exporter les résultats</Button></div>)}</div>)}
            <div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>{setImportModal(false);setImportData([]);setImportResult(null);}}>Fermer</Button>{importData.length>0&&!importResult&&(<Button icon="Upload" onClick={handleImport} loading={importLoading} disabled={importData.filter(d=>d._valid).length===0}>Importer {importData.filter(d=>d._valid).length} utilisateur(s)</Button>)}</div>
          </div>
        </Modal>
      </div>;
    }

    // Composant Tabs réutilisable
    const Tabs=({tabs,active,onChange})=><div className="flex gap-1 p-1 bg-gray-700 rounded-lg mb-6">{tabs.map(t=><button key={t.id} onClick={()=>onChange(t.id)} className={`px-4 py-2 rounded-md text-sm font-medium transition-all flex items-center gap-2 ${active===t.id?'bg-indigo-600 text-white':'text-gray-400 hover:text-white'}`}><Icon name={t.icon} size={16}/>{t.label}</button>)}</div>;

    // Playlists
    function PlaylistsPage({creationMode=false}){
      const{categories,themes,subThemes,getThemesForCategory,getSubThemesForTheme}=useTaxonomy();
      const{licensedIds,isLicensed}=useLicenseInfo();
      const{center,isSuperAdmin,can,profile,realRole}=useAuth();
      // En mode création, on ne montre que les contenus LMS
      const filterLMS=creationMode||isSuperAdmin;
      const[playlists,setPlaylists]=useState([]);
      const[videos,setVideos]=useState([]);
      const[scormModules,setScormModules]=useState([]);
      const[quizzes,setQuizzes]=useState([]);
      const[trainers,setTrainers]=useState([]);
      const[trainerCourses,setTrainerCourses]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({title:'',description:'',category_id:'',theme_id:'',sub_theme_id:'',thumbnail_url:'',estimated_duration:'',learning_objectives:'',tags:'',passing_score:70,certificate_enabled:false});
      const[coursePrereqs,setCoursePrereqs]=useState([]);
      const[saving,setSaving]=useState(false);
      const[editContentModal,setEditContentModal]=useState(null);
      const[courseItems,setCourseItems]=useState([]); // unified list: {type,tableId,position,data}
      const[addContentTab,setAddContentTab]=useState('videos');
      const[assignModal,setAssignModal]=useState(null);
      const[assignedTrainers,setAssignedTrainers]=useState([]);
      const[extensions,setExtensions]=useState([]);
      const[extensionUploading,setExtensionUploading]=useState(false);
      const extensionFileRef=useRef(null);
      const sortableRef=useRef(null);
      const sortableInstanceRef=useRef(null);
      // Preview mode
      const[previewCourse,setPreviewCourse]=useState(null);
      const[previewItems,setPreviewItems]=useState([]);
      const[previewCurrent,setPreviewCurrent]=useState(null);
      const previewPlayerRef=useRef(null);
      const previewVimeoRef=useRef(null);
      
      // Preview Vimeo player effect (must be before any conditional return)
      useEffect(()=>{
        if(!previewCurrent||previewCurrent.type!=='video')return;
        if(previewVimeoRef.current){try{previewVimeoRef.current.destroy();}catch(e){}}
        if(!previewPlayerRef.current)return;
        const vid=previewCurrent.data?.vimeo_id||previewCurrent.data?.vimeo_url?.match(/\/(\d+)/)?.[1];
        if(!vid)return;
        try{previewVimeoRef.current=new Vimeo.Player(previewPlayerRef.current,{id:vid,width:'100%',responsive:true,title:false,byline:false,portrait:false,fullscreen:false,pip:false,quality:'360p'});}catch(e){}
        return()=>{if(previewVimeoRef.current){try{previewVimeoRef.current.destroy();}catch(e){}}};
      },[previewCurrent?.id,previewCurrent?.type]);
      
      // Helpers taxonomie
      
      // Vérifier si un contenu est licencié

      const load=useCallback(async()=>{
        // Charger les assignations formateur-cours
        let tcData=[];
        try{
          const{data:tc}=await supabase.from('trainer_courses').select('*');
          tcData=tc||[];
          setTrainerCourses(tcData);
        }catch(e){}
        
        // Charger les cours (du centre + catalogue LMS)
        let q=supabase.from('playlists').select('*,playlist_videos(count)').order('created_at',{ascending:false});
        if(!isSuperAdmin&&center?.id){
          q=q.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        }
        const{data:p}=await q;
        
        let filteredPlaylists=p||[];
        // Si formateur, ne voir que ses cours assignés
        if(realRole==='trainer'&&profile?.id){
          const myCoursesIds=tcData.filter(tc=>tc.trainer_id===profile.id).map(tc=>tc.playlist_id);
          filteredPlaylists=filteredPlaylists.filter(pl=>myCoursesIds.includes(pl.id));
        }
        setPlaylists(filteredPlaylists);
        
        // Charger les vidéos sous licence ou du centre
        let qv=supabase.from('videos').select('*');
        if(!isSuperAdmin&&center?.id)qv=qv.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        const{data:v}=await qv;
        setVideos(v||[]);
        
        // Charger les modules SCORM
        try {
          let qs=supabase.from('scorm_modules').select('*');
          if(!isSuperAdmin&&center?.id)qs=qs.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
          const{data:scorm,error}=await qs;
          if(!error)setScormModules(scorm||[]);
        } catch(e) {}
        
        // Charger les quiz
        try {
          let qq=supabase.from('quizzes').select('*');
          if(!isSuperAdmin&&center?.id)qq=qq.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
          const{data:qz,error}=await qq;
          if(!error)setQuizzes(qz||[]);
        } catch(e) {}
        
        // Charger les formateurs du centre (pour l'assignation)
        if(can('manage_playlists')){
          let qt=supabase.from('profiles').select('id,first_name,last_name,email').eq('role','trainer');
          if(!isSuperAdmin&&center?.id)qt=qt.eq('center_id',center.id);
          const{data:t}=await qt;
          setTrainers(t||[]);
        }
        
        setLoading(false);
      },[isSuperAdmin,center?.id,realRole,profile?.id,can]);
      useEffect(()=>{load();},[load]);

      const handleSave=async()=>{
        setSaving(true);
        try{
          const tagsArr=form.tags?form.tags.split(',').map(t=>t.trim()).filter(Boolean):[];
          const payload={
            title:form.title,description:form.description,
            category_id:form.category_id||null,theme_id:form.theme_id||null,sub_theme_id:form.sub_theme_id||null,
            thumbnail_url:form.thumbnail_url||null,
            estimated_duration:form.estimated_duration?parseInt(form.estimated_duration):null,
            learning_objectives:form.learning_objectives||null,
            tags:tagsArr,
            passing_score:form.passing_score?parseInt(form.passing_score):70,
            certificate_enabled:!!form.certificate_enabled,
            center_id:center?.id,created_by:profile?.id
          };
          let courseId=editing?.id;
          if(editing){
            await supabase.from('playlists').update(payload).eq('id',editing.id);
          }else{
            const{data:ins}=await supabase.from('playlists').insert(payload).select('id').single();
            courseId=ins?.id;
          }
          // Sauvegarder les prérequis
          if(courseId){
            try{
              await supabase.from('course_prerequisites').delete().eq('course_id',courseId);
              if(coursePrereqs.length>0){
                await supabase.from('course_prerequisites').insert(coursePrereqs.map(pid=>({course_id:courseId,prerequisite_id:pid})));
              }
            }catch(e){console.warn('Prerequisites save:',e);}
          }
          await load();setModal(false);
          setForm({title:'',description:'',category_id:'',theme_id:'',sub_theme_id:'',thumbnail_url:'',estimated_duration:'',learning_objectives:'',tags:'',passing_score:70,certificate_enabled:false});
          setCoursePrereqs([]);setEditing(null);
        }catch(e){alert('Erreur: '+e.message);}
        setSaving(false);
      };
      const handleDelete=async id=>{if(!confirm('Supprimer ?'))return;await supabase.from('playlists').delete().eq('id',id);load();};
      
      // Gestion des formateurs assignés
      const openAssignModal=async(playlist)=>{
        const assigned=trainerCourses.filter(tc=>tc.playlist_id===playlist.id).map(tc=>tc.trainer_id);
        setAssignedTrainers(assigned);
        setAssignModal(playlist);
      };
      
      const toggleTrainerAssignment=async(trainerId)=>{
        const isAssigned=assignedTrainers.includes(trainerId);
        if(isAssigned){
          await supabase.from('trainer_courses').delete().eq('playlist_id',assignModal.id).eq('trainer_id',trainerId);
          setAssignedTrainers(assignedTrainers.filter(id=>id!==trainerId));
        }else{
          await supabase.from('trainer_courses').insert({playlist_id:assignModal.id,trainer_id:trainerId});
          setAssignedTrainers([...assignedTrainers,trainerId]);
        }
        // Mettre à jour le cache local
        const{data:tc}=await supabase.from('trainer_courses').select('*');
        setTrainerCourses(tc||[]);
      };
      
      const getAssignedTrainersCount=(playlistId)=>{
        return trainerCourses.filter(tc=>tc.playlist_id===playlistId).length;
      };
      
      // Vérifier si un cours est sous licence
      const isCourseLicensed=(courseId)=>isLicensed('course',courseId);
      
      const openEditContent=async(playlist)=>{
        // Load all 3 content types
        const{data:pvs}=await supabase.from('playlist_videos').select('*,videos(*)').eq('playlist_id',playlist.id).order('position');
        const{data:ps}=await supabase.from('playlist_scorm').select('*,scorm_modules(*)').eq('playlist_id',playlist.id).order('position');
        let pq=[];
        try{
          const{data}=await supabase.from('playlist_quizzes').select('*,quizzes(*)').eq('playlist_id',playlist.id).order('position');
          pq=data||[];
        }catch(e){}
        
        // Build unified list sorted by position
        const items=[
          ...(pvs||[]).map(pv=>({type:'video',tableId:pv.id,position:pv.position,contentId:pv.video_id,data:pv.videos,raw:pv})),
          ...(ps||[]).map(s=>({type:'scorm',tableId:s.id,position:s.position,contentId:s.scorm_module_id,data:s.scorm_modules,raw:s})),
          ...pq.map(q=>({type:'quiz',tableId:q.id,position:q.position,contentId:q.quiz_id,data:q.quizzes,raw:q}))
        ].sort((a,b)=>(a.position||0)-(b.position||0));
        
        setCourseItems(items);
        
        // Charger les extensions du centre pour ce cours
        if(center?.id&&playlist.is_lms_content){
          try{
            const{data:ext}=await supabase.from('course_extensions').select('*').eq('playlist_id',playlist.id).eq('center_id',center.id).order('position');
            setExtensions(ext||[]);
          }catch(e){setExtensions([]);}
        }else{
          setExtensions([]);
        }
        
        setEditContentModal(playlist);
        setAddContentTab('videos');
      };
      
      // Gestion des extensions (documents ajoutés par le centre)
      const uploadExtension=async(file)=>{
        if(!file||!editContentModal||!center?.id)return;
        setExtensionUploading(true);
        try{
          const fileName=`${Date.now()}_${file.name}`;
          const filePath=`extensions/${center.id}/${editContentModal.id}/${fileName}`;
          const{error:uploadError}=await supabase.storage.from('documents').upload(filePath,file);
          if(uploadError)throw uploadError;
          const{data:{publicUrl}}=supabase.storage.from('documents').getPublicUrl(filePath);
          
          const{data:ext}=await supabase.from('course_extensions').insert({
            playlist_id:editContentModal.id,
            center_id:center.id,
            extension_type:'document',
            title:file.name.replace(/\.[^/.]+$/,''),
            file_url:publicUrl,
            file_name:file.name,
            file_size:file.size,
            position:extensions.length
          }).select().single();
          
          if(ext)setExtensions([...extensions,ext]);
        }catch(err){alert('Erreur upload: '+err.message);}
        setExtensionUploading(false);
      };
      
      const deleteExtension=async(extId)=>{
        if(!confirm('Supprimer ce document ?'))return;
        const ext=extensions.find(e=>e.id===extId);
        if(ext?.file_url){
          const path=ext.file_url.split('/documents/')[1];
          if(path)await supabase.storage.from('documents').remove([path]);
        }
        await supabase.from('course_extensions').delete().eq('id',extId);
        setExtensions(extensions.filter(e=>e.id!==extId));
      };
      
      // Unified add/remove content
      const addContentItem=async(type,contentId)=>{
        const pos=courseItems.length;
        let newItem=null;
        if(type==='video'){
          const{data}=await supabase.from('playlist_videos').insert({playlist_id:editContentModal.id,video_id:contentId,position:pos}).select('*,videos(*)').single();
          if(data)newItem={type:'video',tableId:data.id,position:pos,contentId:data.video_id,data:data.videos,raw:data};
        }else if(type==='scorm'){
          const{data}=await supabase.from('playlist_scorm').insert({playlist_id:editContentModal.id,scorm_module_id:contentId,position:pos}).select('*,scorm_modules(*)').single();
          if(data)newItem={type:'scorm',tableId:data.id,position:pos,contentId:data.scorm_module_id,data:data.scorm_modules,raw:data};
        }else if(type==='quiz'){
          try{
            const{data}=await supabase.from('playlist_quizzes').insert({playlist_id:editContentModal.id,quiz_id:contentId,position:pos}).select('*,quizzes(*)').single();
            if(data)newItem={type:'quiz',tableId:data.id,position:pos,contentId:data.quiz_id,data:data.quizzes,raw:data};
          }catch(e){console.warn('playlist_quizzes insert error:',e);}
        }
        if(newItem)setCourseItems(prev=>[...prev,newItem]);
      };
      
      const removeContentItem=async(item)=>{
        const table=item.type==='video'?'playlist_videos':item.type==='scorm'?'playlist_scorm':'playlist_quizzes';
        await supabase.from(table).delete().eq('id',item.tableId);
        setCourseItems(prev=>prev.filter(i=>i.tableId!==item.tableId));
      };
      
      const togglePublish=async(playlist)=>{await supabase.from('playlists').update({is_published:!playlist.is_published}).eq('id',playlist.id);load();};
      
      // Drag & Drop for unified content list
      useEffect(()=>{
        if(!editContentModal||!sortableRef.current)return;
        if(sortableInstanceRef.current){
          try{sortableInstanceRef.current.destroy();}catch(e){}
          sortableInstanceRef.current=null;
        }
        
        sortableInstanceRef.current=new Sortable(sortableRef.current,{
          animation:150,
          handle:'.drag-handle',
          ghostClass:'opacity-50',
          onEnd:async(evt)=>{
            const{oldIndex,newIndex}=evt;
            if(oldIndex===newIndex)return;
            const newOrder=[...courseItems];
            const[moved]=newOrder.splice(oldIndex,1);
            newOrder.splice(newIndex,0,moved);
            // Update positions
            const updated=newOrder.map((item,i)=>({...item,position:i}));
            setCourseItems(updated);
            // Persist positions to respective tables
            for(const item of updated){
              const table=item.type==='video'?'playlist_videos':item.type==='scorm'?'playlist_scorm':'playlist_quizzes';
              await supabase.from(table).update({position:item.position}).eq('id',item.tableId);
            }
          }
        });
        
        return()=>{
          if(sortableInstanceRef.current){
            try{sortableInstanceRef.current.destroy();}catch(e){}
            sortableInstanceRef.current=null;
          }
        };
      },[editContentModal,courseItems.length]);

      if(!can('manage_playlists')&&profile?.role!=='trainer')return<Empty icon="Lock" title="Accès refusé"/>;
      
      // Preview course functions
      const openPreview=async(course)=>{
        setPreviewCourse(course);
        const[{data:pvs},{data:ps}]=await Promise.all([
          supabase.from('playlist_videos').select('*,videos(*)').eq('playlist_id',course.id).order('position'),
          supabase.from('playlist_scorm').select('*,scorm_modules(*)').eq('playlist_id',course.id).order('position')
        ]);
        let pq=[];
        try{const{data}=await supabase.from('playlist_quizzes').select('*,quizzes(*)').eq('playlist_id',course.id).order('position');pq=data||[];}catch(e){}
        const items=[
          ...(pvs||[]).map(pv=>({type:'video',id:pv.id,position:pv.position,data:pv.videos})),
          ...(ps||[]).map(s=>({type:'scorm',id:s.id,position:s.position,data:s.scorm_modules})),
          ...pq.map(q=>({type:'quiz',id:q.id,position:q.position,data:q.quizzes}))
        ].sort((a,b)=>(a.position||0)-(b.position||0));
        setPreviewItems(items);
        setPreviewCurrent(items[0]||null);
      };
      const closePreview=()=>{
        if(previewVimeoRef.current){try{previewVimeoRef.current.destroy();}catch(e){}}
        setPreviewCourse(null);setPreviewItems([]);setPreviewCurrent(null);
      };
      
      if(loading)return<Loading/>;
      
      // ===== PREVIEW MODE =====
      if(previewCourse){
        const pIcon=t=>t==='video'?'Film':t==='scorm'?'Package':'HelpCircle';
        const pColor=t=>t==='video'?'blue':t==='scorm'?'orange':'purple';
        const pLabel=t=>t==='video'?'Vidéo':t==='scorm'?'SCORM':'Quiz';
        return<div>
          <div className="flex items-center gap-4 mb-6">
            <Button variant="ghost" icon="ArrowLeft" onClick={closePreview}>Retour</Button>
            <div className="flex-1">
              <h1 className="text-xl font-bold">{previewCourse.title}</h1>
              <p className="text-sm text-gray-400">{previewItems.length} élément{previewItems.length>1?'s':''}</p>
            </div>
            <span className="px-3 py-1 bg-cyan-500/20 text-cyan-400 rounded-lg text-xs font-medium">
              <Icon name="Eye" size={14} className="inline mr-1"/>Prévisualisation
            </span>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 space-y-4">
              {!previewCurrent?(
                <Card className="p-12 text-center"><Icon name="Layers" size={48} className="mx-auto text-gray-600 mb-4"/><p className="text-gray-400">Ce cours ne contient aucun élément</p></Card>
              ):previewCurrent.type==='video'?(
                <Card className="overflow-hidden">
                  <div className="aspect-video bg-black relative"><div ref={previewPlayerRef} className="absolute inset-0"/></div>
                  <div className="p-4">
                    <div className="flex items-center gap-2 mb-1"><span className="px-2 py-0.5 bg-blue-500/20 text-blue-400 rounded text-xs">Vidéo</span><h2 className="text-lg font-semibold">{previewCurrent.data?.title}</h2></div>
                    {previewCurrent.data?.description&&<p className="text-gray-400 mt-2 text-sm">{previewCurrent.data.description}</p>}
                    {previewCurrent.data?.duration&&<p className="text-xs text-gray-500 mt-2">Durée: {previewCurrent.data.duration}</p>}
                  </div>
                </Card>
              ):previewCurrent.type==='scorm'?(
                <Card className="overflow-hidden">
                  <div className="p-6 text-center">
                    <Icon name="Package" size={48} className="mx-auto text-orange-400 mb-4"/>
                    <h2 className="text-lg font-semibold mb-2">{previewCurrent.data?.title}</h2>
                    <p className="text-sm text-gray-400 mb-1">Module {previewCurrent.data?.module_type?.toUpperCase()}</p>
                    {previewCurrent.data?.description&&<p className="text-sm text-gray-500 mb-4">{previewCurrent.data.description}</p>}
                    {previewCurrent.data?.package_url?(
                      <Button icon="ExternalLink" onClick={()=>{
                        const url=previewCurrent.data.entry_point?previewCurrent.data.package_url.replace(/\/[^/]*$/,'/')+previewCurrent.data.entry_point:previewCurrent.data.package_url;
                        window.open(url,'_blank','width=1024,height=768');
                      }}>Lancer le module SCORM</Button>
                    ):(<p className="text-gray-500 text-sm italic">URL du module non configurée</p>)}
                  </div>
                </Card>
              ):previewCurrent.type==='quiz'?(
                <Card className="p-6">
                  <div className="text-center mb-4">
                    <Icon name="HelpCircle" size={48} className="mx-auto text-purple-400 mb-4"/>
                    <h2 className="text-lg font-semibold mb-2">{previewCurrent.data?.title}</h2>
                    {previewCurrent.data?.description&&<p className="text-sm text-gray-400 mb-2">{previewCurrent.data.description}</p>}
                  </div>
                  <div className="grid grid-cols-2 gap-4 max-w-md mx-auto">
                    <div className="p-3 bg-gray-700/50 rounded-lg text-center"><p className="text-2xl font-bold text-purple-400">{previewCurrent.data?.passing_score||70}%</p><p className="text-xs text-gray-500">Score requis</p></div>
                    <div className="p-3 bg-gray-700/50 rounded-lg text-center"><p className="text-2xl font-bold text-purple-400">{previewCurrent.data?.max_attempts||'∞'}</p><p className="text-xs text-gray-500">Tentatives max</p></div>
                  </div>
                </Card>
              ):null}
            </div>
            <div>
              <Card className="p-4">
                <h3 className="font-semibold mb-3 flex items-center gap-2"><Icon name="List" size={18}/>Contenu du cours</h3>
                <div className="space-y-1 max-h-[60vh] overflow-y-auto">
                  {previewItems.map((item,i)=>{
                    const isActive=previewCurrent?.id===item.id;
                    return<button key={item.id} onClick={()=>setPreviewCurrent(item)} className={`w-full flex items-center gap-3 p-3 rounded-lg text-left transition ${isActive?'bg-indigo-600':'hover:bg-gray-700'}`}>
                      <span className="w-6 h-6 bg-gray-600 rounded-full flex items-center justify-center text-xs font-bold shrink-0">{i+1}</span>
                      <Icon name={pIcon(item.type)} size={16} className={`text-${pColor(item.type)}-400 shrink-0`}/>
                      <div className="flex-1 min-w-0">
                        <p className="text-sm font-medium truncate">{item.data?.title||'Sans titre'}</p>
                        <p className={`text-xs ${isActive?'text-indigo-200':'text-gray-500'}`}>{pLabel(item.type)}{item.data?.duration?` • ${item.data.duration}`:''}</p>
                      </div>
                    </button>;
                  })}
                  {previewItems.length===0&&<p className="text-gray-500 text-sm text-center py-4">Aucun contenu</p>}
                </div>
              </Card>
              {previewCourse.description&&<Card className="p-4 mt-4"><h4 className="text-sm font-medium mb-2">Description</h4><p className="text-sm text-gray-400">{previewCourse.description}</p></Card>}
            </div>
          </div>
        </div>;
      }
      return<div>
        <div className="flex items-center justify-between mb-6">
          <div>
            <h1 className="text-2xl font-bold">Cours</h1>
            {realRole==='trainer'&&<p className="text-sm text-gray-400">Vos cours assignés</p>}
          </div>
          {can('manage_playlists')&&<Button icon="Plus" onClick={()=>{setForm({title:'',description:''});setEditing(null);setModal(true);}}>Créer</Button>}
        </div>
        {playlists.length===0?<Empty icon="BookOpen" title={realRole==='trainer'?'Aucun cours assigné':'Aucun cours'}/>:<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{playlists.map(p=>{
          const licensed=!p.is_lms_content||isCourseLicensed(p.id);
          const isLocked=p.is_lms_content&&p.is_locked;
          const canModify=can('manage_playlists')&&(!p.is_lms_content||isSuperAdmin)&&!isLocked;
          return<Card key={p.id} className={`overflow-hidden ${!licensed?'opacity-75':''}`}>
          {p.thumbnail_url&&<div className="h-32 bg-gray-800"><img src={p.thumbnail_url} className="w-full h-full object-cover" onError={e=>{e.target.style.display='none'}}/></div>}
          <div className="p-4">
          <div className="flex items-start justify-between mb-2">
            <div>
              <div className="flex items-center gap-2">
                <h3 className="font-semibold">{p.title}</h3>
                {isLocked&&<Icon name="Lock" size={14} className="text-red-400"/>}
              </div>
              <div className="flex items-center gap-3 text-sm text-gray-400 mt-1">
                <span>{p.playlist_videos?.[0]?.count||0} élément(s)</span>
                {p.estimated_duration&&<span><Icon name="Clock" size={12} className="inline mr-1"/>{p.estimated_duration>=60?Math.round(p.estimated_duration/60)+'h':p.estimated_duration+'min'}</span>}
              </div>
              {can('manage_playlists')&&getAssignedTrainersCount(p.id)>0&&(
                <p className="text-xs text-indigo-400 mt-1"><Icon name="Users" size={12} className="inline mr-1"/>{getAssignedTrainersCount(p.id)} formateur(s)</p>
              )}
            </div>
            <div className="flex flex-col gap-1 items-end">
              {p.is_lms_content&&<span className={`px-2 py-0.5 rounded text-xs ${licensed?'bg-indigo-600':'bg-red-600/80'}`}>{licensed?'📦 LMS':'🔒 Non licencié'}</span>}
              <span className={`px-2 py-1 rounded text-xs ${p.is_published?'bg-green-500/20 text-green-400':'bg-gray-500/20 text-gray-400'}`}>{p.is_published?'Publié':'Brouillon'}</span>
              {p.certificate_enabled&&<span className="px-2 py-0.5 rounded text-xs bg-amber-500/20 text-amber-400">🎓 Certifiant</span>}
            </div>
          </div>
          {(p.tags||[]).length>0&&<div className="flex flex-wrap gap-1 mb-2">{p.tags.slice(0,4).map((t,i)=><span key={i} className="px-2 py-0.5 bg-gray-700 rounded text-xs text-gray-300">{t}</span>)}{p.tags.length>4&&<span className="text-xs text-gray-500">+{p.tags.length-4}</span>}</div>}
          {p.passing_score&&p.passing_score!==70&&<p className="text-xs text-gray-500 mb-2">Score requis: {p.passing_score}%</p>}

      const[saving,setSaving]=useState(false);
      
      // Mode lecture seule si pas manage_taxonomy
      const isReadOnly=!can('manage_taxonomy')&&!isSuperAdmin;

      const[categories,setCategories]=useState([]);
      const[themes,setThemes]=useState([]);
      const[subThemes,setSubThemes]=useState([]);
      
      // Tags prédéfinis
      const[predefinedTags,setPredefinedTags]=useState([]);
      
      // Stats contenus par catégorie
      const[contentStats,setContentStats]=useState({});
      
      // UI

      const[expandedThemes,setExpandedThemes]=useState({});
      const[quickAddValue,setQuickAddValue]=useState('');
