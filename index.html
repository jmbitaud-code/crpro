      };
      const handleDelete=async id=>{if(!confirm('Supprimer ?'))return;await supabase.from('videos').delete().eq('id',id);load();};

      const handleFileSelect=async(e)=>{const file=e.target.files[0];if(!file)return;try{const data=await file.arrayBuffer();const workbook=XLSX.read(data);const sheet=workbook.Sheets[workbook.SheetNames[0]];const jsonData=XLSX.utils.sheet_to_json(sheet);const mapped=jsonData.map((row,i)=>({_index:i+1,title:row['Titre']||row['title']||'',vimeo_id:String(row['ID Vimeo']||row['vimeo_id']||''),duration:row['Durée']||row['duration']||'',category:row['Catégorie']||row['category']||'',description:row['Description']||'',sort_order:row['Ordre']||null,tags:row['Tags']||'',theme:row['Thème']||'',thumbnail_url:row['Miniature URL']||'',_valid:!!(row['Titre']||row['title'])&&!!(row['ID Vimeo']||row['vimeo_id'])}));setImportData(mapped);setImportResult(null);}catch(err){alert('Erreur: '+err.message);}e.target.value='';};

      const handleImport=async()=>{const validData=importData.filter(d=>d._valid);if(!validData.length)return;setImportLoading(true);let created=0,updated=0,errors=0;for(const item of validData){const vimeoMatch=item.vimeo_id.match(/vimeo\.com\/(\d+)/)||item.vimeo_id.match(/^(\d+)$/);const vimeoId=vimeoMatch?vimeoMatch[1]:item.vimeo_id;const tagsArray=item.tags?item.tags.split(',').map(t=>t.trim()).filter(t=>t):null;const payload={title:item.title,vimeo_id:vimeoId,duration:item.duration||null,category:item.category||null,description:item.description||null,sort_order:item.sort_order?parseInt(item.sort_order):null,tags:tagsArray,theme:item.theme||null,thumbnail_url:item.thumbnail_url||null,center_id:center?.id,created_by:profile?.id};const{data:existing}=await supabase.from('videos').select('id').eq('vimeo_id',vimeoId).eq('center_id',center?.id).single();if(existing){const{error}=await supabase.from('videos').update(payload).eq('id',existing.id);if(error)errors++;else updated++;}else{const{error}=await supabase.from('videos').insert(payload);if(error)errors++;else created++;}}setImportLoading(false);setImportResult({created,updated,errors});await load();};

      const downloadTemplate=()=>{const template=[{'Titre':'Ma vidéo','ID Vimeo':'123456789','Durée':'5:30','Ordre':'1','Tags':'tag1, tag2','Catégorie':'Intro','Thème':'Bases','Description':''}];const ws=XLSX.utils.json_to_sheet(template);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Videos');XLSX.writeFile(wb,'template_videos.xlsx');};

      // Ouvrir le modal de détail (documents + chapitres)
      const openDetailModal=async(video)=>{
        setDetailModal(video);
        const[{data:att},{data:chap}]=await Promise.all([
          supabase.from('video_attachments').select('*').eq('video_id',video.id).order('sort_order'),
          supabase.from('video_chapters').select('*').eq('video_id',video.id).order('timestamp_seconds')
        ]);
        setAttachments(att||[]);
        setChapters(chap||[]);
        setNewAttachment({title:'',file_url:''});
        setNewChapter({title:'',timestamp:'',description:''});
      };

      // Gestion des documents
      const addAttachment=async()=>{
        if(!newAttachment.title||!newAttachment.file_url)return;
        const fileType=newAttachment.file_url.split('.').pop()?.toLowerCase()||'file';
        const{data}=await supabase.from('video_attachments').insert({
          video_id:detailModal.id,
          title:newAttachment.title,
          file_url:newAttachment.file_url,
          file_type:fileType,
          sort_order:attachments.length
        }).select().single();
        if(data)setAttachments([...attachments,data]);
        setNewAttachment({title:'',file_url:''});
      };
      const deleteAttachment=async(id)=>{
        await supabase.from('video_attachments').delete().eq('id',id);
        setAttachments(attachments.filter(a=>a.id!==id));
      };

      // Gestion des chapitres
      const parseTimestamp=(str)=>{
        const parts=str.split(':').map(Number);
        if(parts.length===2)return parts[0]*60+parts[1];
        if(parts.length===3)return parts[0]*3600+parts[1]*60+parts[2];
        return parseInt(str)||0;
      };
      const formatTimestamp=(seconds)=>{
        const m=Math.floor(seconds/60);
        const s=seconds%60;
        return `${m}:${s.toString().padStart(2,'0')}`;
      };
      const addChapter=async()=>{
        if(!newChapter.title||!newChapter.timestamp)return;
        const timestampSeconds=parseTimestamp(newChapter.timestamp);
        const{data}=await supabase.from('video_chapters').insert({
          video_id:detailModal.id,
          title:newChapter.title,
          timestamp_seconds:timestampSeconds,
          description:newChapter.description||null,
          sort_order:chapters.length
        }).select().single();
        if(data)setChapters([...chapters,data].sort((a,b)=>a.timestamp_seconds-b.timestamp_seconds));
        setNewChapter({title:'',timestamp:'',description:''});
      };
      const deleteChapter=async(id)=>{
        await supabase.from('video_chapters').delete().eq('id',id);
        setChapters(chapters.filter(c=>c.id!==id));
      };

      const filtered=videos.filter(v=>!search||v.title?.toLowerCase().includes(search.toLowerCase()));
      if(!can('manage_videos'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4"><h1 className="text-2xl font-bold">Bibliothèque vidéo</h1><div className="flex gap-2"><Button variant="secondary" icon="Upload" onClick={()=>setImportModal(true)}>Importer</Button><Button icon="Plus" onClick={()=>{resetForm();setEditing(null);setModal(true);}}>Ajouter</Button></div></div>
        <Card className="p-4 mb-6"><Input icon="Search" placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)}/></Card>
        {filtered.length===0?<Empty icon="Film" title="Aucune vidéo"/>:<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{filtered.map(v=><Card key={v.id} className="overflow-hidden"><div className="aspect-video bg-gray-900 relative">{v.thumbnail_url?<img src={v.thumbnail_url} className="w-full h-full object-cover"/>:<iframe src={`https://player.vimeo.com/video/${v.vimeo_id}?background=1`} className="w-full h-full" allow="autoplay"/>}<div className="absolute bottom-2 right-2 px-2 py-1 bg-black/70 rounded text-xs">{v.duration||'--:--'}</div>{v.sort_order&&<div className="absolute top-2 left-2 w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center text-xs font-bold">{v.sort_order}</div>}</div><div className="p-4"><h3 className="font-semibold truncate">{v.title}</h3><div className="flex flex-wrap gap-1 mt-2">{v.category&&<span className="px-2 py-1 bg-gray-700 rounded text-xs">{v.category}</span>}{v.theme&&<span className="px-2 py-1 bg-indigo-600/30 text-indigo-300 rounded text-xs">{v.theme}</span>}</div><div className="flex flex-wrap gap-2 mt-3"><Button variant="ghost" size="sm" icon="Settings" onClick={()=>openDetailModal(v)}>Ressources</Button><Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(v);setForm({title:v.title,vimeo_id:v.vimeo_id,duration:v.duration||'',category:v.category||'',description:v.description||'',sort_order:v.sort_order||'',tags:v.tags?v.tags.join(', '):'',theme:v.theme||'',thumbnail_url:v.thumbnail_url||''});setModal(true);}}>Modifier</Button><Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(v.id)}/></div></div></Card>)}</div>}
        
        {/* Modal édition vidéo */}
        <Modal isOpen={modal} onClose={()=>{setModal(false);resetForm();setEditing(null);}} title={editing?'Modifier':'Ajouter'} size="lg"><div className="space-y-4"><div className="grid grid-cols-2 gap-4"><Input label="Titre *" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/><Input label="ID Vimeo *" value={form.vimeo_id} onChange={e=>setForm({...form,vimeo_id:e.target.value})} placeholder="123456789"/></div><div className="grid grid-cols-3 gap-4"><Input label="Durée" value={form.duration} onChange={e=>setForm({...form,duration:e.target.value})} placeholder="5:30"/><Input label="Ordre" type="number" value={form.sort_order} onChange={e=>setForm({...form,sort_order:e.target.value})}/><Input label="Catégorie" value={form.category} onChange={e=>setForm({...form,category:e.target.value})}/></div><div className="grid grid-cols-2 gap-4"><Input label="Thème" value={form.theme} onChange={e=>setForm({...form,theme:e.target.value})}/><Input label="Tags" value={form.tags} onChange={e=>setForm({...form,tags:e.target.value})} placeholder="tag1, tag2"/></div><Input label="Miniature URL" value={form.thumbnail_url} onChange={e=>setForm({...form,thumbnail_url:e.target.value})}/><div><label className="block text-sm font-medium text-gray-300 mb-1">Description</label><textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={2} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/></div><div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>{setModal(false);resetForm();setEditing(null);}}>Annuler</Button><Button onClick={handleSave} loading={saving}>Enregistrer</Button></div></div></Modal>
        
        {/* Modal import */}
        <Modal isOpen={importModal} onClose={()=>{setImportModal(false);setImportData([]);setImportResult(null);}} title="Importer" size="lg"><div className="space-y-4"><div className="bg-gray-700/50 rounded-lg p-4"><p className="text-sm text-gray-400 mb-2">Colonnes : Titre*, ID Vimeo*, Durée, Ordre, Tags, Catégorie, Thème</p><Button variant="ghost" size="sm" icon="Download" onClick={downloadTemplate}>Template</Button></div><div className="border-2 border-dashed border-gray-600 rounded-lg p-8 text-center"><input type="file" ref={fileInputRef} onChange={handleFileSelect} accept=".xlsx,.xls,.csv" className="hidden"/><Icon name="Film" size={48} className="mx-auto text-gray-500 mb-4"/><Button variant="secondary" onClick={()=>fileInputRef.current?.click()}>Parcourir</Button></div>{importData.length>0&&!importResult&&<div className="max-h-48 overflow-y-auto bg-gray-700/50 rounded-lg p-2">{importData.filter(d=>d._valid).map((row,i)=><div key={i} className="text-sm py-1">{row.title}</div>)}</div>}{importResult&&<Alert type={importResult.errors>0?'warning':'success'}>{importResult.created>0&&<span className="text-green-400">✅ {importResult.created} créée(s) </span>}{importResult.updated>0&&<span className="text-blue-400">🔄 {importResult.updated} mise(s) à jour </span>}{importResult.errors>0&&<span className="text-red-400">❌ {importResult.errors} erreur(s)</span>}</Alert>}<div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>{setImportModal(false);setImportData([]);setImportResult(null);}}>Fermer</Button>{importData.length>0&&!importResult&&<Button icon="Upload" onClick={handleImport} loading={importLoading}>Importer {importData.filter(d=>d._valid).length}</Button>}</div></div></Modal>
        
        {/* Modal ressources (documents + chapitres) */}
        <Modal isOpen={!!detailModal} onClose={()=>setDetailModal(null)} title={`Ressources: ${detailModal?.title}`} size="xl">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* Documents */}
            <div>
              <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="Paperclip" size={18}/>Documents joints ({attachments.length})</h3>
              <div className="space-y-2 mb-4 max-h-64 overflow-y-auto">
                {attachments.map(a=>(
                  <div key={a.id} className="flex items-center gap-3 p-3 bg-gray-700 rounded-lg">
                    <Icon name="FileText" size={20} className="text-indigo-400"/>
                    <div className="flex-1 min-w-0">
                      <p className="font-medium truncate text-sm">{a.title}</p>
                      <p className="text-xs text-gray-400 truncate">{a.file_type?.toUpperCase()}</p>
                    </div>
                    <a href={a.file_url} target="_blank" rel="noopener" className="p-1 hover:bg-gray-600 rounded"><Icon name="ExternalLink" size={16}/></a>
                    <button onClick={()=>deleteAttachment(a.id)} className="p-1 hover:bg-red-600 rounded"><Icon name="Trash2" size={16}/></button>
                  </div>
                ))}
                {attachments.length===0&&<p className="text-gray-500 text-sm text-center py-4">Aucun document</p>}
              </div>
              <div className="space-y-2 p-3 bg-gray-700/50 rounded-lg">
                <Input placeholder="Titre du document" value={newAttachment.title} onChange={e=>setNewAttachment({...newAttachment,title:e.target.value})}/>
                <Input placeholder="URL du fichier" value={newAttachment.file_url} onChange={e=>setNewAttachment({...newAttachment,file_url:e.target.value})}/>
                <Button size="sm" icon="Plus" onClick={addAttachment} disabled={!newAttachment.title||!newAttachment.file_url}>Ajouter</Button>
              </div>
            </div>
            
            {/* Chapitres */}
            <div>
              <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="List" size={18}/>Chapitres ({chapters.length})</h3>
              <div className="space-y-2 mb-4 max-h-64 overflow-y-auto">
                {chapters.map(c=>(
                  <div key={c.id} className="flex items-center gap-3 p-3 bg-gray-700 rounded-lg">
                    <span className="px-2 py-1 bg-indigo-600 rounded text-xs font-mono">{formatTimestamp(c.timestamp_seconds)}</span>
                    <div className="flex-1 min-w-0">
                      <p className="font-medium truncate text-sm">{c.title}</p>
                      {c.description&&<p className="text-xs text-gray-400 truncate">{c.description}</p>}
                    </div>
                    <button onClick={()=>deleteChapter(c.id)} className="p-1 hover:bg-red-600 rounded"><Icon name="Trash2" size={16}/></button>
                  </div>
                ))}
                {chapters.length===0&&<p className="text-gray-500 text-sm text-center py-4">Aucun chapitre</p>}
              </div>
              <div className="space-y-2 p-3 bg-gray-700/50 rounded-lg">
                <div className="grid grid-cols-2 gap-2">
                  <Input placeholder="Timestamp (ex: 2:30)" value={newChapter.timestamp} onChange={e=>setNewChapter({...newChapter,timestamp:e.target.value})}/>
                  <Input placeholder="Titre du chapitre" value={newChapter.title} onChange={e=>setNewChapter({...newChapter,title:e.target.value})}/>
                </div>
                <Input placeholder="Description (optionnel)" value={newChapter.description} onChange={e=>setNewChapter({...newChapter,description:e.target.value})}/>
                <Button size="sm" icon="Plus" onClick={addChapter} disabled={!newChapter.title||!newChapter.timestamp}>Ajouter</Button>
              </div>
            </div>
          </div>
        </Modal>
      </div>;
    }

    // Playlists
    function PlaylistsPage(){
      const{center,isSuperAdmin,can,profile}=useAuth();
      const[playlists,setPlaylists]=useState([]);
      const[videos,setVideos]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({title:'',description:''});
      const[saving,setSaving]=useState(false);
      const[editVideosModal,setEditVideosModal]=useState(null);
      const[playlistVideos,setPlaylistVideos]=useState([]);
      const sortableRef=useRef(null);
      const sortableInstanceRef=useRef(null);

      const load=useCallback(async()=>{let q=supabase.from('playlists').select('*,playlist_videos(count)').order('created_at',{ascending:false});if(!isSuperAdmin&&center?.id)q=q.eq('center_id',center.id);const{data:p}=await q;setPlaylists(p||[]);let qv=supabase.from('videos').select('*');if(!isSuperAdmin&&center?.id)qv=qv.eq('center_id',center.id);const{data:v}=await qv;setVideos(v||[]);setLoading(false);},[isSuperAdmin,center?.id]);
      useEffect(()=>{load();},[load]);

      const handleSave=async()=>{setSaving(true);const payload={title:form.title,description:form.description,center_id:center?.id,created_by:profile?.id};if(editing)await supabase.from('playlists').update(payload).eq('id',editing.id);else await supabase.from('playlists').insert(payload);await load();setModal(false);setForm({title:'',description:''});setEditing(null);setSaving(false);};
      const handleDelete=async id=>{if(!confirm('Supprimer ?'))return;await supabase.from('playlists').delete().eq('id',id);load();};
      const openEditVideos=async(playlist)=>{const{data}=await supabase.from('playlist_videos').select('*,videos(*)').eq('playlist_id',playlist.id).order('position');setPlaylistVideos(data||[]);setEditVideosModal(playlist);};
      const addVideoToPlaylist=async(videoId)=>{const pos=playlistVideos.length;const{data}=await supabase.from('playlist_videos').insert({playlist_id:editVideosModal.id,video_id:videoId,position:pos}).select('*,videos(*)').single();if(data)setPlaylistVideos([...playlistVideos,data]);};
      const removeVideoFromPlaylist=async(pvId)=>{await supabase.from('playlist_videos').delete().eq('id',pvId);setPlaylistVideos(playlistVideos.filter(pv=>pv.id!==pvId));};
      const togglePublish=async(playlist)=>{await supabase.from('playlists').update({is_published:!playlist.is_published}).eq('id',playlist.id);load();};
      
      // Drag & Drop
      useEffect(()=>{
        if(!editVideosModal||!sortableRef.current)return;
        
        // Détruire l'instance précédente
        if(sortableInstanceRef.current){
          sortableInstanceRef.current.destroy();
        }
        
        sortableInstanceRef.current=new Sortable(sortableRef.current,{
          animation:150,
          handle:'.drag-handle',
          ghostClass:'opacity-50',
          onEnd:async(evt)=>{
            const{oldIndex,newIndex}=evt;
            if(oldIndex===newIndex)return;
            
            // Réorganiser localement
            const newOrder=[...playlistVideos];
            const[moved]=newOrder.splice(oldIndex,1);
            newOrder.splice(newIndex,0,moved);
            
            // Mettre à jour les positions
            setPlaylistVideos(newOrder);
            
            // Sauvegarder en base
            for(let i=0;i<newOrder.length;i++){
              await supabase.from('playlist_videos').update({position:i}).eq('id',newOrder[i].id);
            }
          }
        });
        
        return()=>{
          if(sortableInstanceRef.current){
            sortableInstanceRef.current.destroy();
            sortableInstanceRef.current=null;
          }
        };
      },[editVideosModal,playlistVideos.length]);

      if(!can('manage_playlists')&&profile?.role!=='trainer')return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;
      return<div>
        <div className="flex items-center justify-between mb-6"><h1 className="text-2xl font-bold">Cours</h1>{can('manage_playlists')&&<Button icon="Plus" onClick={()=>{setForm({title:'',description:''});setEditing(null);setModal(true);}}>Créer</Button>}</div>
        {playlists.length===0?<Empty icon="BookOpen" title="Aucun cours"/>:<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{playlists.map(p=><Card key={p.id} className="p-4"><div className="flex items-start justify-between mb-3"><div><h3 className="font-semibold">{p.title}</h3><p className="text-sm text-gray-400 mt-1">{p.playlist_videos?.[0]?.count||0} vidéos</p></div><span className={`px-2 py-1 rounded text-xs ${p.is_published?'bg-green-500/20 text-green-400':'bg-gray-500/20 text-gray-400'}`}>{p.is_published?'Publié':'Brouillon'}</span></div><div className="flex flex-wrap gap-2">{can('manage_playlists')&&<><Button variant="ghost" size="sm" icon="Film" onClick={()=>openEditVideos(p)}>Vidéos</Button><Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(p);setForm({title:p.title,description:p.description||''});setModal(true);}}>Modifier</Button></>}<Button variant="ghost" size="sm" icon={p.is_published?'EyeOff':'Eye'} onClick={()=>togglePublish(p)}>{p.is_published?'Dépublier':'Publier'}</Button>{can('manage_playlists')&&<Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(p.id)}/>}</div></Card>)}</div>}
        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title={editing?'Modifier':'Créer'}><div className="space-y-4"><Input label="Titre" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/><div><label className="block text-sm font-medium text-gray-300 mb-1">Description</label><textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={3} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/></div><div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button><Button onClick={handleSave} loading={saving}>Enregistrer</Button></div></div></Modal>
        <Modal isOpen={!!editVideosModal} onClose={()=>setEditVideosModal(null)} title={`Vidéos: ${editVideosModal?.title}`} size="lg"><div className="grid grid-cols-1 lg:grid-cols-2 gap-4"><div><h4 className="font-medium mb-3">Dans le cours ({playlistVideos.length}) <span className="text-gray-500 text-sm font-normal">- Glissez pour réorganiser</span></h4><div ref={sortableRef} className="space-y-2 max-h-96 overflow-y-auto">{playlistVideos.map((pv,i)=><div key={pv.id} data-id={pv.id} className="flex items-center gap-3 p-3 bg-gray-700 rounded-lg"><div className="drag-handle cursor-grab active:cursor-grabbing p-1 hover:bg-gray-600 rounded"><Icon name="GripVertical" size={16} className="text-gray-400"/></div><span className="w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center text-xs font-bold">{i+1}</span><div className="flex-1 min-w-0"><p className="font-medium truncate text-sm">{pv.videos?.title}</p></div><button onClick={()=>removeVideoFromPlaylist(pv.id)} className="p-1 hover:bg-red-600 rounded"><Icon name="X" size={16}/></button></div>)}{playlistVideos.length===0&&<p className="text-gray-500 text-sm text-center py-4">Aucune vidéo</p>}</div></div><div><h4 className="font-medium mb-3">Disponibles</h4><div className="space-y-2 max-h-96 overflow-y-auto">{videos.filter(v=>!playlistVideos.find(pv=>pv.video_id===v.id)).map(v=><div key={v.id} className="flex items-center gap-3 p-3 bg-gray-700/50 rounded-lg hover:bg-gray-700 cursor-pointer" onClick={()=>addVideoToPlaylist(v.id)}><Icon name="Plus" size={16} className="text-indigo-400"/><div className="flex-1 min-w-0"><p className="font-medium truncate text-sm">{v.title}</p></div></div>)}{videos.filter(v=>!playlistVideos.find(pv=>pv.video_id===v.id)).length===0&&<p className="text-gray-500 text-sm text-center py-4">Toutes ajoutées</p>}</div></div></div></Modal>
      </div>;
    }

    // Enrollments avec inscription en masse
    function EnrollmentsPage(){
      const{center,isSuperAdmin,profile,can}=useAuth();
      const[enrollments,setEnrollments]=useState([]);
      const[playlists,setPlaylists]=useState([]);
      const[learners,setLearners]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[bulkModal,setBulkModal]=useState(false);
      const[form,setForm]=useState({playlist_id:'',learner_id:''});
      const[bulkForm,setBulkForm]=useState({playlist_id:'',selectedLearners:[]});
      const[saving,setSaving]=useState(false);

      const load=useCallback(async()=>{
        const{data:e}=await supabase.from('enrollments').select('*,playlists:playlist_id(title),profiles:learner_id(first_name,last_name,email)').order('created_at',{ascending:false});
        setEnrollments(e||[]);
        let qp=supabase.from('playlists').select('id,title').eq('is_published',true);
        let ql=supabase.from('profiles').select('id,first_name,last_name,email').eq('role','learner');
        if(!isSuperAdmin&&center?.id){qp=qp.eq('center_id',center.id);ql=ql.eq('center_id',center.id);}
        const[{data:p},{data:l}]=await Promise.all([qp,ql]);
        setPlaylists(p||[]);setLearners(l||[]);setLoading(false);
      },[isSuperAdmin,center?.id]);
      useEffect(()=>{load();},[load]);

      const handleEnroll=async()=>{
        setSaving(true);
        await supabase.from('enrollments').insert({playlist_id:form.playlist_id,learner_id:form.learner_id,enrolled_by:profile?.id});
        await load();setModal(false);setForm({playlist_id:'',learner_id:''});setSaving(false);
      };
      
      const handleBulkEnroll=async()=>{
        setSaving(true);
        const inserts=bulkForm.selectedLearners.map(learnerId=>({playlist_id:bulkForm.playlist_id,learner_id:learnerId,enrolled_by:profile?.id}));
        await supabase.from('enrollments').upsert(inserts,{onConflict:'playlist_id,learner_id'});
        await load();setBulkModal(false);setBulkForm({playlist_id:'',selectedLearners:[]});setSaving(false);
      };
      
      const handleUnenroll=async id=>{if(!confirm('Désinscrire ?'))return;await supabase.from('enrollments').delete().eq('id',id);load();};
      
      const toggleLearner=(learnerId)=>{
        setBulkForm(prev=>({
          ...prev,
          selectedLearners:prev.selectedLearners.includes(learnerId)?prev.selectedLearners.filter(id=>id!==learnerId):[...prev.selectedLearners,learnerId]
        }));
      };
      
      const selectAll=()=>{
        const enrolledIds=enrollments.filter(e=>e.playlist_id===bulkForm.playlist_id).map(e=>e.learner_id);
        const available=learners.filter(l=>!enrolledIds.includes(l.id));
        setBulkForm(prev=>({...prev,selectedLearners:available.map(l=>l.id)}));
      };

      if(!can('manage_enrollments'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;
      
      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4"><h1 className="text-2xl font-bold">Inscriptions</h1><div className="flex gap-2"><Button variant="secondary" icon="Users" onClick={()=>setBulkModal(true)}>Inscription en masse</Button><Button icon="UserPlus" onClick={()=>setModal(true)}>Inscrire</Button></div></div>
        {enrollments.length===0?<Empty icon="UserPlus" title="Aucune inscription"/>:<Card><div className="overflow-x-auto"><table className="w-full"><thead className="bg-gray-750"><tr><th className="text-left p-4 font-medium text-gray-400">Apprenant</th><th className="text-left p-4 font-medium text-gray-400">Cours</th><th className="text-left p-4 font-medium text-gray-400">Progression</th><th className="text-left p-4 font-medium text-gray-400">Date</th><th className="text-right p-4"></th></tr></thead><tbody className="divide-y divide-gray-700">{enrollments.map(e=><tr key={e.id}><td className="p-4"><p className="font-medium">{e.profiles?.first_name} {e.profiles?.last_name}</p><p className="text-sm text-gray-400">{e.profiles?.email}</p></td><td className="p-4">{e.playlists?.title||'—'}</td><td className="p-4"><ProgressBar percent={e.progress_percent||0} size="sm" showLabel={false}/></td><td className="p-4 text-gray-400">{new Date(e.created_at).toLocaleDateString('fr-FR')}</td><td className="p-4 text-right"><Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleUnenroll(e.id)}/></td></tr>)}</tbody></table></div></Card>}
        
        <Modal isOpen={modal} onClose={()=>setModal(false)} title="Inscrire"><div className="space-y-4"><Select label="Cours" value={form.playlist_id} onChange={e=>setForm({...form,playlist_id:e.target.value})} options={[{value:'',label:'Sélectionner...'},...playlists.map(p=>({value:p.id,label:p.title}))]}/><Select label="Apprenant" value={form.learner_id} onChange={e=>setForm({...form,learner_id:e.target.value})} options={[{value:'',label:'Sélectionner...'},...learners.map(l=>({value:l.id,label:`${l.first_name} ${l.last_name}`}))]}/><div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button><Button onClick={handleEnroll} loading={saving} disabled={!form.playlist_id||!form.learner_id}>Inscrire</Button></div></div></Modal>
        
        <Modal isOpen={bulkModal} onClose={()=>setBulkModal(false)} title="Inscription en masse" size="lg">
          <div className="space-y-4">
            <Select label="Cours" value={bulkForm.playlist_id} onChange={e=>setBulkForm({...bulkForm,playlist_id:e.target.value,selectedLearners:[]})} options={[{value:'',label:'Sélectionner un cours...'},...playlists.map(p=>({value:p.id,label:p.title}))]}/>
            
            {bulkForm.playlist_id&&(
              <div>
                <div className="flex items-center justify-between mb-3">
                  <h4 className="font-medium">Apprenants disponibles</h4>
                  <Button variant="ghost" size="sm" onClick={selectAll}>Tout sélectionner</Button>
                </div>
                <div className="max-h-64 overflow-y-auto bg-gray-700/50 rounded-lg p-2 space-y-1">
                  {learners.filter(l=>!enrollments.find(e=>e.playlist_id===bulkForm.playlist_id&&e.learner_id===l.id)).map(l=>(
                    <Checkbox key={l.id} label={`${l.first_name} ${l.last_name} (${l.email})`} checked={bulkForm.selectedLearners.includes(l.id)} onChange={()=>toggleLearner(l.id)}/>
                  ))}
                  {learners.filter(l=>!enrollments.find(e=>e.playlist_id===bulkForm.playlist_id&&e.learner_id===l.id)).length===0&&<p className="text-gray-500 text-sm text-center py-4">Tous les apprenants sont déjà inscrits</p>}
                </div>
                <p className="text-sm text-gray-400 mt-2">{bulkForm.selectedLearners.length} apprenant(s) sélectionné(s)</p>
              </div>
            )}
            
            <div className="flex justify-end gap-3">
              <Button variant="secondary" onClick={()=>setBulkModal(false)}>Annuler</Button>
              <Button onClick={handleBulkEnroll} loading={saving} disabled={!bulkForm.playlist_id||bulkForm.selectedLearners.length===0}>Inscrire {bulkForm.selectedLearners.length} apprenant(s)</Button>
            </div>
          </div>
        </Modal>
      </div>;
    }

    // Permissions Page
    function PermissionsPage(){
      const{can}=useAuth();
      const[roles,setRoles]=useState([]);
      const[loading,setLoading]=useState(true);
      const[saving,setSaving]=useState(false);

      const load=useCallback(async()=>{
        const{data}=await supabase.from('role_permissions').select('*').order('role');
        setRoles(data||[]);
        setLoading(false);
      },[]);
      useEffect(()=>{load();},[load]);

      const togglePermission=async(role,permission)=>{
        setSaving(true);
        const roleData=roles.find(r=>r.role===role);
        if(!roleData)return;
        const newPermissions={...roleData.permissions,[permission]:!roleData.permissions[permission]};
        await supabase.from('role_permissions').update({permissions:newPermissions}).eq('role',role);
        setRoles(roles.map(r=>r.role===role?{...r,permissions:newPermissions}:r));
        setSaving(false);
      };

      if(!can('manage_permissions'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      return<div>
        <h1 className="text-2xl font-bold mb-6">Gestion des permissions</h1>
        <Card>
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead className="bg-gray-750">
                <tr>
                  <th className="text-left p-4 font-medium text-gray-400">Permission</th>
                  {roles.filter(r=>r.role!=='super_admin').map(r=><th key={r.role} className="text-center p-4 font-medium"><RoleBadge role={r.role}/></th>)}
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-700">
                {Object.entries(PERMISSION_LABELS).map(([perm,label])=>(
                  <tr key={perm}>
                    <td className="p-4 font-medium">{label}</td>
                    {roles.filter(r=>r.role!=='super_admin').map(r=>(
                      <td key={r.role} className="p-4 text-center">
                        <input 
                          type="checkbox" 
                          checked={r.permissions[perm]||false} 
                          onChange={()=>togglePermission(r.role,perm)}
                          disabled={saving||r.role==='super_admin'}
                          className="w-5 h-5 rounded bg-gray-700 border-gray-600 text-indigo-600 focus:ring-indigo-500 cursor-pointer disabled:opacity-50"
                        />
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>
        <Alert type="info" className="mt-4"><p><Icon name="Info" size={16} className="inline mr-2"/>Les permissions du Super Admin ne peuvent pas être modifiées.</p></Alert>
      </div>;
    }

    // My Courses avec lecteur vidéo et progression
    function MyCoursesPage(){
      const{user}=useAuth();
      const[enrollments,setEnrollments]=useState([]);
      const[loading,setLoading]=useState(true);
      const[selectedCourse,setSelectedCourse]=useState(null);
      const[courseVideos,setCourseVideos]=useState([]);
      const[currentVideo,setCurrentVideo]=useState(null);
      const[videoProgress,setVideoProgress]=useState({});
      const[chapters,setChapters]=useState([]);
      const[attachments,setAttachments]=useState([]);
      const[notes,setNotes]=useState([]);
      const[newNote,setNewNote]=useState('');
      const[activeTab,setActiveTab]=useState('content');
      const playerRef=useRef(null);
      const playerInstanceRef=useRef(null);

      const load=useCallback(async()=>{
        const{data}=await supabase.from('enrollments').select('*,playlists:playlist_id(*)').eq('learner_id',user.id);
        setEnrollments(data||[]);
        setLoading(false);
      },[user.id]);
      
      useEffect(()=>{load();},[load]);

      const openCourse=async(enrollment)=>{
        setSelectedCourse(enrollment);
        const{data:pvs}=await supabase.from('playlist_videos').select('*,videos(*)').eq('playlist_id',enrollment.playlist_id).order('position');
        setCourseVideos(pvs||[]);
        
        const{data:progress}=await supabase.from('video_progress').select('*').eq('enrollment_id',enrollment.id);
        const progressMap={};
        (progress||[]).forEach(p=>{progressMap[p.playlist_video_id]=p;});
        setVideoProgress(progressMap);
        
        const firstIncomplete=pvs?.find(pv=>!progressMap[pv.id]?.is_completed);
        setCurrentVideo(firstIncomplete||pvs?.[0]||null);
      };

      const closeCourse=()=>{
        setSelectedCourse(null);
        setCourseVideos([]);
        setCurrentVideo(null);
        setVideoProgress({});
        setChapters([]);
        setAttachments([]);
        setNotes([]);
        setNewNote('');
        if(playerInstanceRef.current){
          playerInstanceRef.current.destroy();
          playerInstanceRef.current=null;
        }
      };

      const selectVideo=async(pv)=>{
        setCurrentVideo(pv);
      };

      // Charger les ressources de la vidéo courante
      useEffect(()=>{
        if(!currentVideo||!selectedCourse)return;
        const loadResources=async()=>{
          const videoId=currentVideo.videos?.id;
          if(!videoId)return;
          
          const[{data:chap},{data:att},{data:n}]=await Promise.all([
            supabase.from('video_chapters').select('*').eq('video_id',videoId).order('timestamp_seconds'),
            supabase.from('video_attachments').select('*').eq('video_id',videoId).order('sort_order'),
            supabase.from('learner_notes').select('*').eq('playlist_video_id',currentVideo.id).eq('enrollment_id',selectedCourse.id).order('created_at',{ascending:false})
          ]);
          setChapters(chap||[]);
          setAttachments(att||[]);
          setNotes(n||[]);
        };
        loadResources();
      },[currentVideo?.id,selectedCourse?.id]);

      // Initialiser le lecteur Vimeo
      useEffect(()=>{
        if(!currentVideo||!playerRef.current)return;
        
        if(playerInstanceRef.current){
          playerInstanceRef.current.destroy();
        }
        
        const startTime=videoProgress[currentVideo.id]?.last_position_seconds||0;
        playerRef.current.innerHTML='';
        
        const player=new Vimeo.Player(playerRef.current,{
          id:currentVideo.videos?.vimeo_id,
          responsive:true,
          autoplay:false
        });
        
        if(startTime>0){
          player.setCurrentTime(startTime).catch(()=>{});
        }
        
        playerInstanceRef.current=player;
        
        let lastSave=0;
        player.on('timeupdate',async(data)=>{
          const now=Date.now();
          if(now-lastSave>10000){
            lastSave=now;
            await saveProgress(Math.floor(data.seconds),false);
          }
        });
        
        player.on('ended',async()=>{
          await saveProgress(0,true);
          await updateCourseProgress();
        });
        
        return()=>{
          if(playerInstanceRef.current){
            playerInstanceRef.current.off('timeupdate');
            playerInstanceRef.current.off('ended');
          }
        };
      },[currentVideo?.id]);

      const saveProgress=async(positionSeconds,completed)=>{
        if(!selectedCourse||!currentVideo)return;
        
        const existing=videoProgress[currentVideo.id];
        const data={
          enrollment_id:selectedCourse.id,
          playlist_video_id:currentVideo.id,
          last_position_seconds:positionSeconds,
          is_completed:completed||existing?.is_completed||false,
          watch_time_seconds:(existing?.watch_time_seconds||0)+10
        };
        
        if(completed)data.completed_at=new Date().toISOString();
        
        if(existing){
          await supabase.from('video_progress').update(data).eq('id',existing.id);
        }else{
          const{data:inserted}=await supabase.from('video_progress').insert(data).select().single();
          if(inserted)setVideoProgress(prev=>({...prev,[currentVideo.id]:inserted}));
        }
        
        if(completed){
          setVideoProgress(prev=>({...prev,[currentVideo.id]:{...prev[currentVideo.id],...data,is_completed:true}}));
        }
      };

      const updateCourseProgress=async()=>{
        if(!selectedCourse)return;
        const totalVideos=courseVideos.length;
        const completedVideos=Object.values(videoProgress).filter(p=>p.is_completed).length+(videoProgress[currentVideo?.id]?.is_completed?0:1);
        const percent=totalVideos>0?Math.round((completedVideos/totalVideos)*100):0;
        
        await supabase.from('enrollments').update({progress_percent:percent,status:percent===100?'completed':percent>0?'in_progress':'not_started'}).eq('id',selectedCourse.id);
        
        setEnrollments(prev=>prev.map(e=>e.id===selectedCourse.id?{...e,progress_percent:percent}:e));
        setSelectedCourse(prev=>({...prev,progress_percent:percent}));
      };

      const markAsComplete=async(pv)=>{
        await supabase.from('video_progress').upsert({
          enrollment_id:selectedCourse.id,
          playlist_video_id:pv.id,
          is_completed:true,
          completed_at:new Date().toISOString(),
          last_position_seconds:0,
          watch_time_seconds:0
        },{onConflict:'enrollment_id,playlist_video_id'});
        
        setVideoProgress(prev=>({...prev,[pv.id]:{...prev[pv.id],is_completed:true}}));
        await updateCourseProgress();
      };

      // Naviguer vers un chapitre
      const goToChapter=(seconds)=>{
        if(playerInstanceRef.current){
          playerInstanceRef.current.setCurrentTime(seconds).catch(()=>{});
        }
      };

      // Gestion des notes
      const addNote=async()=>{
        if(!newNote.trim()||!selectedCourse||!currentVideo)return;
        let currentTime=0;
        if(playerInstanceRef.current){
          try{currentTime=Math.floor(await playerInstanceRef.current.getCurrentTime());}catch(e){}
        }
        const{data}=await supabase.from('learner_notes').insert({
          enrollment_id:selectedCourse.id,
          playlist_video_id:currentVideo.id,
          content:newNote.trim(),
          timestamp_seconds:currentTime
        }).select().single();
        if(data)setNotes([data,...notes]);
        setNewNote('');
      };

      const deleteNote=async(id)=>{
        await supabase.from('learner_notes').delete().eq('id',id);
        setNotes(notes.filter(n=>n.id!==id));
      };

      const formatTime=(seconds)=>{
        const m=Math.floor(seconds/60);
        const s=seconds%60;
        return `${m}:${s.toString().padStart(2,'0')}`;
      };

      if(loading)return<Loading/>;
      
      // Vue du lecteur de cours
      if(selectedCourse){
        const totalVideos=courseVideos.length;
        const completedVideos=Object.values(videoProgress).filter(p=>p.is_completed).length;
        const progressPercent=totalVideos>0?Math.round((completedVideos/totalVideos)*100):0;
        
        return<div>
          <div className="flex items-center gap-4 mb-6">
            <Button variant="ghost" icon="ArrowLeft" onClick={closeCourse}>Retour</Button>
            <div className="flex-1">
              <h1 className="text-xl font-bold">{selectedCourse.playlists?.title}</h1>
              <p className="text-sm text-gray-400">{completedVideos}/{totalVideos} vidéos complétées</p>
            </div>
          </div>
          
          <div className="mb-4"><ProgressBar percent={progressPercent}/></div>
          
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 space-y-4">
              <Card className="overflow-hidden">
                <div className="aspect-video bg-black relative">
                  <div ref={playerRef} className="absolute inset-0"/>
                </div>
                {currentVideo&&(
                  <div className="p-4">
                    <h2 className="text-lg font-semibold">{currentVideo.videos?.title}</h2>
                    {currentVideo.videos?.description&&<p className="text-gray-400 mt-2 text-sm">{currentVideo.videos.description}</p>}
                  </div>
                )}
              </Card>
              
              {/* Chapitres sous la vidéo */}
              {chapters.length>0&&(
                <Card className="p-4">
                  <h3 className="font-semibold mb-3 flex items-center gap-2"><Icon name="List" size={18}/>Chapitres</h3>
                  <div className="flex flex-wrap gap-2">
                    {chapters.map(c=>(
                      <button key={c.id} onClick={()=>goToChapter(c.timestamp_seconds)} className="flex items-center gap-2 px-3 py-2 bg-gray-700 hover:bg-indigo-600 rounded-lg transition text-sm">
                        <span className="font-mono text-xs bg-gray-600 px-2 py-0.5 rounded">{formatTime(c.timestamp_seconds)}</span>
                        <span>{c.title}</span>
                      </button>
                    ))}
                  </div>
                </Card>
              )}
              
              {/* Documents et Notes */}
              <Card>
                <div className="flex border-b border-gray-700">
                  <button onClick={()=>setActiveTab('attachments')} className={`flex-1 px-4 py-3 text-sm font-medium ${activeTab==='attachments'?'text-indigo-400 border-b-2 border-indigo-400':'text-gray-400 hover:text-white'}`}>
                    <Icon name="Paperclip" size={16} className="inline mr-2"/>Documents ({attachments.length})
                  </button>
                  <button onClick={()=>setActiveTab('notes')} className={`flex-1 px-4 py-3 text-sm font-medium ${activeTab==='notes'?'text-indigo-400 border-b-2 border-indigo-400':'text-gray-400 hover:text-white'}`}>
                    <Icon name="StickyNote" size={16} className="inline mr-2"/>Mes notes ({notes.length})
                  </button>
                </div>
                <div className="p-4">
                  {activeTab==='attachments'&&(
                    <div className="space-y-2">
                      {attachments.length===0?<p className="text-gray-500 text-sm text-center py-4">Aucun document pour cette vidéo</p>:(
                        attachments.map(a=>(
                          <a key={a.id} href={a.file_url} target="_blank" rel="noopener" className="flex items-center gap-3 p-3 bg-gray-700/50 hover:bg-gray-700 rounded-lg transition">
                            <Icon name="FileText" size={20} className="text-indigo-400"/>
                            <div className="flex-1">
                              <p className="font-medium text-sm">{a.title}</p>
                              <p className="text-xs text-gray-400">{a.file_type?.toUpperCase()}</p>
                            </div>
                            <Icon name="Download" size={16} className="text-gray-400"/>
                          </a>
                        ))
                      )}
                    </div>
                  )}
                  {activeTab==='notes'&&(
                    <div className="space-y-4">
                      <div className="flex gap-2">
                        <input value={newNote} onChange={e=>setNewNote(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addNote()} placeholder="Ajouter une note..." className="flex-1 px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white text-sm"/>
                        <Button size="sm" icon="Plus" onClick={addNote} disabled={!newNote.trim()}>Ajouter</Button>
                      </div>
                      <div className="space-y-2 max-h-64 overflow-y-auto">
                        {notes.length===0?<p className="text-gray-500 text-sm text-center py-4">Aucune note</p>:(
                          notes.map(n=>(
                            <div key={n.id} className="p-3 bg-gray-700/50 rounded-lg">
                              <div className="flex items-start justify-between gap-2">
                                <div className="flex-1">
                                  {n.timestamp_seconds>0&&(
                                    <button onClick={()=>goToChapter(n.timestamp_seconds)} className="text-xs text-indigo-400 hover:underline mb-1">
                                      📍 {formatTime(n.timestamp_seconds)}
                                    </button>
                                  )}
                                  <p className="text-sm">{n.content}</p>
                                  <p className="text-xs text-gray-500 mt-1">{new Date(n.created_at).toLocaleString('fr-FR')}</p>
                                </div>
                                <button onClick={()=>deleteNote(n.id)} className="p-1 hover:bg-red-600 rounded text-gray-400 hover:text-white">
                                  <Icon name="Trash2" size={14}/>
                                </button>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </Card>
            </div>
            
            <div>
              <Card className="p-4">
                <h3 className="font-semibold mb-4">Contenu du cours</h3>
                <div className="space-y-2 max-h-[60vh] overflow-y-auto">
                  {courseVideos.map((pv,i)=>{
                    const isCompleted=videoProgress[pv.id]?.is_completed;
                    const isCurrent=currentVideo?.id===pv.id;
                    return(
                      <div key={pv.id} onClick={()=>selectVideo(pv)} className={`flex items-center gap-3 p-3 rounded-lg cursor-pointer transition ${isCurrent?'bg-indigo-600':'hover:bg-gray-700'}`}>
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${isCompleted?'bg-green-500':isCurrent?'bg-white text-indigo-600':'bg-gray-700'}`}>
                          {isCompleted?<Icon name="Check" size={16}/>:i+1}
                        </div>
                        <div className="flex-1 min-w-0">
                          <p className="font-medium truncate text-sm">{pv.videos?.title}</p>
                          <p className="text-xs text-gray-400">{pv.videos?.duration||'--:--'}</p>
                        </div>
                        {!isCompleted&&!isCurrent&&(
                          <button onClick={(e)=>{e.stopPropagation();markAsComplete(pv);}} className="p-1 hover:bg-gray-600 rounded" title="Marquer comme vu">
                            <Icon name="CheckCircle" size={16} className="text-gray-500"/>
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </Card>
            </div>
          </div>
        </div>;
      }
      
      // Vue liste des cours
      return<div>
        <h1 className="text-2xl font-bold mb-6">Mes cours</h1>
        {enrollments.length===0?<Empty icon="GraduationCap" title="Aucun cours" desc="Vous n'êtes inscrit à aucun cours"/>:(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {enrollments.map(e=>(
              <Card key={e.id} className="overflow-hidden cursor-pointer hover:border-indigo-500 transition" onClick={()=>openCourse(e)}>
                <div className="aspect-video bg-gradient-to-br from-indigo-600 to-purple-700 flex items-center justify-center">
                  <Icon name="PlayCircle" size={64} className="text-white/80"/>
                </div>
                <div className="p-4">
                  <h3 className="font-semibold mb-2">{e.playlists?.title}</h3>
                  <ProgressBar percent={e.progress_percent||0} size="sm"/>
                </div>
              </Card>
            ))}
          </div>
        )}
      </div>;
    }

    // App
    function App(){
      const{isAuth,loading}=useAuth();
      if(loading)return<div className="min-h-screen bg-gray-900 flex items-center justify-center"><Loading text="Chargement..."/></div>;
      if(!isAuth)return<LoginPage/>;
      return<AppLayout/>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AuthProvider><App/></AuthProvider>);
  </script>
</body>
</html>
