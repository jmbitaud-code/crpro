    function LearningPathsPage(){
      const{center,isSuperAdmin,can,profile}=useAuth();
      const[paths,setPaths]=useState([]);
      const[courses,setCourses]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({title:'',description:'',thumbnail_url:'',estimated_duration:'',category_id:'',theme_id:'',sub_theme_id:''});
      const[pathCourses,setPathCourses]=useState([]);
      const[saving,setSaving]=useState(false);
      const[contentModal,setContentModal]=useState(null);
      const[licensedIds,setLicensedIds]=useState({paths:[],courses:[],hasFullCatalog:false});
      const[filterSource,setFilterSource]=useState('all');
      // Taxonomie
      const[categories,setCategories]=useState([]);
      const[themes,setThemes]=useState([]);
      const[subThemes,setSubThemes]=useState([]);
      const sortableRef=useRef(null);
      const sortableInstance=useRef(null);
      
      // Helpers taxonomie
      const getThemesForCategory=(catId)=>themes.filter(t=>t.category_id===catId);
      const getSubThemesForTheme=(themeId)=>subThemes.filter(st=>st.theme_id===themeId);
      
      const load=useCallback(async()=>{
        // Charger les licences (parcours + cours)
        let licenseInfo={paths:[],courses:[],hasFullCatalog:false};
        if(!isSuperAdmin&&center?.id){
          try{
            const today=new Date().toISOString().split('T')[0];
            const{data:licenses}=await supabase.from('center_licenses').select('*,content_packs(pack_type)').eq('center_id',center.id).eq('status','active').lte('start_date',today).gte('end_date',today);
            licenseInfo.hasFullCatalog=(licenses||[]).some(l=>l.license_type==='full_catalog'||l.content_packs?.pack_type==='full_catalog');
            if(!licenseInfo.hasFullCatalog){
              const packIds=(licenses||[]).map(l=>l.pack_id).filter(Boolean);
              if(packIds.length>0){
                const{data:items}=await supabase.from('content_pack_items').select('content_type,content_id').in('pack_id',packIds);
                (items||[]).forEach(i=>{
                  if(i.content_type==='path')licenseInfo.paths.push(i.content_id);
                  else if(i.content_type==='course')licenseInfo.courses.push(i.content_id);
                });
              }
            }
          }catch(e){}
        }
        setLicensedIds(licenseInfo);
        
        // Charger les parcours
        let q=supabase.from('learning_paths').select('*,learning_path_courses(count)').order('created_at',{ascending:false});
        if(!isSuperAdmin&&center?.id){
          q=q.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        }
        const{data:p}=await q;
        setPaths(p||[]);
        
        // Charger les cours disponibles
        let qc=supabase.from('playlists').select('id,title,is_lms_content,is_published').order('title');
        if(!isSuperAdmin&&center?.id){
          qc=qc.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        }
        const{data:c}=await qc;
        setCourses(c||[]);
        
        // Charger la taxonomie
        try{
          const{data:cats}=await supabase.from('content_categories').select('*').order('position').order('name');
          setCategories(cats||[]);
        }catch(e){setCategories([]);}
        try{
          const{data:ths}=await supabase.from('content_themes').select('*').order('position').order('name');
          setThemes(ths||[]);
        }catch(e){setThemes([]);}
        try{
          const{data:sths}=await supabase.from('content_sub_themes').select('*').order('position').order('name');
          setSubThemes(sths||[]);
        }catch(e){setSubThemes([]);}
        
        setLoading(false);
      },[isSuperAdmin,center?.id]);
      useEffect(()=>{load();},[load]);
      
      // Drag & drop
      useEffect(()=>{
        if(contentModal&&sortableRef.current&&pathCourses.length>0&&window.Sortable){
          if(sortableInstance.current){try{sortableInstance.current.destroy();}catch(e){}}
          sortableInstance.current=window.Sortable.create(sortableRef.current,{
            animation:150,handle:'.drag-handle',
            onEnd:(evt)=>{const arr=[...pathCourses];const[m]=arr.splice(evt.oldIndex,1);arr.splice(evt.newIndex,0,m);setPathCourses(arr);}
          });
        }
        return()=>{if(sortableInstance.current){try{sortableInstance.current.destroy();}catch(e){}}};
      },[contentModal,pathCourses.length]);
      
      const isPathLicensed=(pathId)=>{
        if(isSuperAdmin)return true;
        if(licensedIds.hasFullCatalog)return true;
        return licensedIds.paths.includes(pathId);
      };
      
      const isCourseLicensed=(course)=>{
        if(isSuperAdmin)return true;
        if(!course.is_lms_content)return true; // Cours du centre = toujours ok
        if(course.center_id===center?.id)return true; // Cours du propre centre
        if(licensedIds.hasFullCatalog)return true;
        return licensedIds.courses.includes(course.id);
      };
      
      const filterBySource=(items)=>{
        if(filterSource==='all')return items;
        return items.filter(item=>{
          const isOwn=!item.is_lms_content;
          const licensed=isPathLicensed(item.id);
          if(filterSource==='center')return isOwn;
          if(filterSource==='lms')return item.is_lms_content;
          if(filterSource==='licensed')return item.is_lms_content&&licensed;
          if(filterSource==='unlicensed')return item.is_lms_content&&!licensed;
          return true;
        });
      };
      
      const stats={
        total:paths.length,
        center:paths.filter(p=>!p.is_lms_content).length,
        lms:paths.filter(p=>p.is_lms_content).length,
        licensed:paths.filter(p=>p.is_lms_content&&isPathLicensed(p.id)).length
      };
      
      const openModal=(path=null)=>{
        if(path){
          setEditing(path);
          setForm({title:path.title,description:path.description||'',thumbnail_url:path.thumbnail_url||'',estimated_duration:path.estimated_duration||'',category_id:path.category_id||'',theme_id:path.theme_id||'',sub_theme_id:path.sub_theme_id||''});
        }else{
          setEditing(null);
          setForm({title:'',description:'',thumbnail_url:'',estimated_duration:'',category_id:'',theme_id:'',sub_theme_id:''});
        }
        setModal(true);
      };
      
      const handleSave=async()=>{
        if(!form.title.trim()){alert('Titre requis');return;}
        setSaving(true);
        try{
          const payload={...form,estimated_duration:form.estimated_duration?parseInt(form.estimated_duration):null,center_id:center?.id||null};
          if(editing){
            await supabase.from('learning_paths').update(payload).eq('id',editing.id);
          }else{
            await supabase.from('learning_paths').insert(payload);
          }
          await load();setModal(false);
        }catch(err){alert('Erreur: '+err.message);}
        setSaving(false);
      };
      
      const handleDelete=async(id)=>{
        if(!confirm('Supprimer ce parcours ?'))return;
        await supabase.from('learning_paths').delete().eq('id',id);
        load();
      };
      
      const togglePublish=async(path)=>{
        await supabase.from('learning_paths').update({is_published:!path.is_published}).eq('id',path.id);
        load();
      };
      
      const openContentModal=async(path)=>{
        const{data}=await supabase.from('learning_path_courses').select('*,playlists(id,title,is_lms_content)').eq('path_id',path.id).order('position');
        setPathCourses(data||[]);
        setContentModal(path);
      };
      
      const addCourseToPath=async(courseId)=>{
        const pos=pathCourses.length;
        const{data}=await supabase.from('learning_path_courses').insert({path_id:contentModal.id,playlist_id:courseId,position:pos}).select('*,playlists(id,title,is_lms_content)').single();
        if(data)setPathCourses([...pathCourses,data]);
      };
      
      const removeCourseFromPath=async(id)=>{
        await supabase.from('learning_path_courses').delete().eq('id',id);
        setPathCourses(pathCourses.filter(pc=>pc.id!==id));
      };
      
      const saveCoursesOrder=async()=>{
        for(let i=0;i<pathCourses.length;i++){
          await supabase.from('learning_path_courses').update({position:i}).eq('id',pathCourses[i].id);
        }
        load();
        setContentModal(null);
      };
      
      if(!can('manage_playlists')&&!can('view_playlists'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;
      
      const filtered=filterBySource(paths);
      
      return<div>
        <div className="flex items-center justify-between mb-6">
          <div>
            <h1 className="text-2xl font-bold">Parcours de formation</h1>
            <p className="text-sm text-gray-400">Séquences de cours avec progression</p>
          </div>
          {can('manage_playlists')&&<Button icon="Plus" onClick={()=>openModal()}>Créer un parcours</Button>}
        </div>
        
        {/* Filtres */}
        {!isSuperAdmin&&<Card className="p-4 mb-4">
          <div className="flex flex-wrap items-center gap-4">
            <span className="text-sm text-gray-400">Filtrer :</span>
            <div className="flex flex-wrap gap-2">
              <button onClick={()=>setFilterSource('all')} className={`px-3 py-1.5 rounded-lg text-sm ${filterSource==='all'?'bg-indigo-600':'bg-gray-700 hover:bg-gray-600'}`}>Tout ({stats.total})</button>
              <button onClick={()=>setFilterSource('center')} className={`px-3 py-1.5 rounded-lg text-sm ${filterSource==='center'?'bg-indigo-600':'bg-gray-700 hover:bg-gray-600'}`}>📁 Mes parcours ({stats.center})</button>
              <button onClick={()=>setFilterSource('lms')} className={`px-3 py-1.5 rounded-lg text-sm ${filterSource==='lms'?'bg-indigo-600':'bg-gray-700 hover:bg-gray-600'}`}>📦 Catalogue LMS ({stats.lms})</button>
              <button onClick={()=>setFilterSource('licensed')} className={`px-3 py-1.5 rounded-lg text-sm ${filterSource==='licensed'?'bg-green-600':'bg-gray-700 hover:bg-gray-600'}`}>✓ Sous licence ({stats.licensed})</button>
              <button onClick={()=>setFilterSource('unlicensed')} className={`px-3 py-1.5 rounded-lg text-sm ${filterSource==='unlicensed'?'bg-red-600':'bg-gray-700 hover:bg-gray-600'}`}>🔒 Non licencié ({stats.lms-stats.licensed})</button>
            </div>
          </div>
        </Card>}
        
        {filtered.length===0?<Empty icon="Route" title="Aucun parcours" desc={filterSource!=='all'?'Essayez un autre filtre':undefined}/>:(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {filtered.map(path=>{
              const licensed=!path.is_lms_content||isPathLicensed(path.id);
              const isOwn=!path.is_lms_content;
              const isLocked=path.is_lms_content&&path.is_locked;
              const canModify=can('manage_playlists')&&(isOwn||isSuperAdmin)&&!isLocked;
              const courseCount=path.learning_path_courses?.[0]?.count||0;
              
              return<Card key={path.id} className={`overflow-hidden ${!licensed&&!isOwn?'opacity-80':''}`}>
                {path.thumbnail_url&&<div className="h-32 bg-gray-800"><img src={path.thumbnail_url} className="w-full h-full object-cover"/></div>}
                <div className="p-4">
                  <div className="flex items-start justify-between mb-2">
                    <div className="flex items-center gap-2">
                      <h3 className="font-semibold">{path.title}</h3>
                      {isLocked&&<Icon name="Lock" size={14} className="text-red-400"/>}
                    </div>
                    <div className="flex flex-col gap-1 items-end">
                      {path.is_lms_content?<span className={`px-2 py-0.5 rounded text-xs ${licensed?'bg-indigo-600':'bg-red-600/80'}`}>{licensed?'📦 LMS':'🔒'}</span>:<span className="px-2 py-0.5 bg-gray-600 rounded text-xs">📁</span>}
                      <span className={`px-2 py-0.5 rounded text-xs ${path.is_published?'bg-green-500/20 text-green-400':'bg-gray-500/20 text-gray-400'}`}>{path.is_published?'Publié':'Brouillon'}</span>
                    </div>
                  </div>
                  
                  <div className="flex items-center gap-3 text-sm text-gray-400 mb-3">
                    <span><Icon name="BookOpen" size={14} className="inline mr-1"/>{courseCount} cours</span>
                    {path.estimated_duration&&<span><Icon name="Clock" size={14} className="inline mr-1"/>{Math.round(path.estimated_duration/60)}h</span>}
                  </div>
                  
                  {path.description&&<p className="text-sm text-gray-400 line-clamp-2 mb-3">{path.description}</p>}
                  
                  <div className="flex flex-wrap gap-2">
                    {(licensed||isOwn)&&<Button variant="ghost" size="sm" icon="Layers" onClick={()=>openContentModal(path)}>{isLocked?'Voir':'Gérer'} cours</Button>}
                    {canModify&&<Button variant="ghost" size="sm" icon="Edit2" onClick={()=>openModal(path)}>Modifier</Button>}
                    {canModify&&<Button variant="ghost" size="sm" icon={path.is_published?'EyeOff':'Eye'} onClick={()=>togglePublish(path)}/>}
                    {canModify&&<Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(path.id)}/>}
                    {!licensed&&!isOwn&&realRole==='center_admin'&&<label className="flex items-center gap-2 text-xs cursor-pointer bg-purple-500/20 text-purple-300 px-2 py-1 rounded hover:bg-purple-500/30"><input type="checkbox" checked={false} onChange={()=>{localStorage.setItem('openLicenseRequest','true');window.location.hash='licenses';}} className="rounded"/>Demander</label>}
                  </div>
                </div>
              </Card>;
            })}
          </div>
        )}
        
        {/* Modal création/édition */}
        <Modal isOpen={modal} onClose={()=>setModal(false)} title={editing?'Modifier le parcours':'Créer un parcours'} size="lg">
          <div className="space-y-4">
            <Input label="Titre *" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/>
            <div className="grid grid-cols-3 gap-4">
              <Select label="Catégorie" value={form.category_id} onChange={e=>setForm({...form,category_id:e.target.value,theme_id:'',sub_theme_id:''})} options={[{value:'',label:'Aucune'},...categories.map(c=>({value:c.id,label:c.name}))]}/>
              <Select label="Thème" value={form.theme_id} onChange={e=>setForm({...form,theme_id:e.target.value,sub_theme_id:''})} options={[{value:'',label:'Aucun'},...getThemesForCategory(form.category_id).map(t=>({value:t.id,label:t.name}))]} disabled={!form.category_id}/>
              <Select label="Sous-thème" value={form.sub_theme_id} onChange={e=>setForm({...form,sub_theme_id:e.target.value})} options={[{value:'',label:'Aucun'},...getSubThemesForTheme(form.theme_id).map(st=>({value:st.id,label:st.name}))]} disabled={!form.theme_id}/>
            </div>
            <div><label className="block text-sm font-medium text-gray-300 mb-1">Description</label><textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={3} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/></div>
            <div className="grid grid-cols-2 gap-4">
              <Input label="Image URL" value={form.thumbnail_url} onChange={e=>setForm({...form,thumbnail_url:e.target.value})} placeholder="https://..."/>
              <Input label="Durée estimée (minutes)" type="number" value={form.estimated_duration} onChange={e=>setForm({...form,estimated_duration:e.target.value})}/>
            </div>
          </div>
          <div className="flex gap-2 mt-4">
            <Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button>
            <Button className="flex-1" onClick={handleSave} loading={saving} disabled={!form.title}>Enregistrer</Button>
          </div>
        </Modal>
        
        {/* Modal gestion des cours */}
        <Modal isOpen={!!contentModal} onClose={()=>setContentModal(null)} title={`Cours du parcours: ${contentModal?.title}`} size="xl">
          {contentModal?.is_locked&&!isSuperAdmin&&<Alert type="info" className="mb-4"><Icon name="Lock" size={14} className="inline mr-2"/>Ce parcours LMS est verrouillé. Vous ne pouvez pas modifier la séquence des cours.</Alert>}
          
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div>
              <h4 className="font-medium mb-3">Cours du parcours ({pathCourses.length}){!contentModal?.is_locked&&<span className="text-gray-500 text-sm font-normal ml-2">- Glissez pour réorganiser</span>}</h4>
              <div ref={sortableRef} className="space-y-2 max-h-80 overflow-y-auto">
                {pathCourses.map((pc,i)=><div key={pc.id} className="flex items-center gap-3 p-3 bg-gray-700 rounded-lg">
                  {!contentModal?.is_locked&&<div className="drag-handle cursor-grab p-1 hover:bg-gray-600 rounded"><Icon name="GripVertical" size={16} className="text-gray-400"/></div>}
                  <span className="w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center text-xs font-bold">{i+1}</span>
                  <div className="flex-1 min-w-0">
                    <p className="font-medium truncate text-sm">{pc.playlists?.title}</p>
                  </div>
                  {pc.playlists?.is_lms_content&&<span className="px-1.5 py-0.5 bg-indigo-500/20 text-indigo-400 rounded text-xs">LMS</span>}
                  {!contentModal?.is_locked&&<button onClick={()=>removeCourseFromPath(pc.id)} className="p-1 hover:bg-red-600 rounded"><Icon name="X" size={16}/></button>}
                </div>)}
                {pathCourses.length===0&&<p className="text-gray-500 text-sm text-center py-4">Aucun cours</p>}
              </div>
            </div>
            
            {!contentModal?.is_locked&&<div>
              <h4 className="font-medium mb-3">Cours disponibles</h4>
              <div className="space-y-2 max-h-80 overflow-y-auto">
                {courses.filter(c=>{
                  // Exclure les cours déjà dans le parcours
                  if(pathCourses.find(pc=>pc.playlist_id===c.id))return false;
                  // Super Admin voit tout
                  if(isSuperAdmin)return true;
                  // Contenu LMS = toujours vérifier la licence (même si même center_id)
                  if(c.is_lms_content){
                    return isCourseLicensed(c);
                  }
                  // Contenu non-LMS du centre = toujours visible
                  return c.center_id===center?.id;
                }).map(c=>{
                  const isOwn=!c.is_lms_content&&c.center_id===center?.id;
                  return<div key={c.id} className="flex items-center gap-3 p-3 rounded-lg bg-gray-700/50 hover:bg-gray-700 cursor-pointer" onClick={()=>addCourseToPath(c.id)}>
                    <Icon name="Plus" size={16} className="text-indigo-400"/>
                    <div className="flex-1 min-w-0"><p className="font-medium truncate text-sm">{c.title}</p></div>
                    {c.is_lms_content&&<span className="px-1.5 py-0.5 rounded text-xs bg-indigo-500/20 text-indigo-400">📦 LMS</span>}
                  </div>;
                })}
                {courses.filter(c=>!pathCourses.find(pc=>pc.playlist_id===c.id)&&(isSuperAdmin||(c.is_lms_content?isCourseLicensed(c):c.center_id===center?.id))).length===0&&<p className="text-gray-500 text-sm text-center py-4">Tous les cours ajoutés</p>}
              </div>
            </div>}
          </div>
          
          <div className="flex gap-2 mt-4">
            <Button variant="secondary" onClick={()=>setContentModal(null)}>Fermer</Button>
            {!contentModal?.is_locked&&<Button className="flex-1" onClick={saveCoursesOrder}>Enregistrer l'ordre</Button>}
          </div>
        </Modal>
      </div>;
    }

    // ==================== LICENCES ====================
    function LicensesPage(){
      const{isSuperAdmin,profile,center,realRole}=useAuth();
      const[loading,setLoading]=useState(true);
      const[licenses,setLicenses]=useState([]);
      const[requests,setRequests]=useState([]);
      const[packs,setPacks]=useState([]);
      const[centers,setCenters]=useState([]);
      const[activeTab,setActiveTab]=useState(isSuperAdmin?'dashboard':'my-licenses');
      const[licenseModal,setLicenseModal]=useState(false);
      const[editingLicense,setEditingLicense]=useState(null);
      const[licenseForm,setLicenseForm]=useState({center_id:'',pack_id:'',start_date:'',end_date:'',max_learners:'',notes:''});
      const[saving,setSaving]=useState(false);
      const[requestModal,setRequestModal]=useState(false);
      const[requestForm,setRequestForm]=useState({pack_id:'',requested_duration_months:12,requested_max_learners:'',request_message:''});
      const[history,setHistory]=useState([]);
      const[alertsSent,setAlertsSent]=useState([]);
      const[loadError,setLoadError]=useState(null);
      
      // Seul le Center Admin peut demander des licences (pas le trainer)
      const canRequestLicense=realRole==='center_admin'&&center?.id;
      
      // Ouvrir automatiquement le modal si on vient de la bibliothèque
      useEffect(()=>{
        // Attendre que le chargement soit terminé
        if(loading)return;
        
        if(canRequestLicense){
          const shouldOpen=localStorage.getItem('openLicenseRequest');
          if(shouldOpen==='true'){
            localStorage.removeItem('openLicenseRequest');
            setActiveTab('my-requests');
            setRequestModal(true);
          }
        }
      },[canRequestLicense,loading]);
      
      const load=useCallback(async()=>{
        setLoadError(null);
        try{
          const{data:pk,error:pkErr}=await supabase.from('content_packs').select('*').eq('is_active',true);
          if(pkErr)console.warn('Erreur packs:',pkErr);
          setPacks(pk||[]);
          
          if(isSuperAdmin){
            const{data:lic}=await supabase.from('center_licenses').select('*,centers(name,slug),content_packs(name,code)').order('created_at',{ascending:false});setLicenses(lic||[]);
            const{data:req}=await supabase.from('license_requests').select('*,centers(name),content_packs(name),profiles!requested_by(first_name,last_name)').order('created_at',{ascending:false});setRequests(req||[]);
            const{data:ct}=await supabase.from('centers').select('id,name,slug');setCenters(ct||[]);
            // Charger les alertes déjà envoyées
            try{const{data:alerts}=await supabase.from('license_alerts').select('*');setAlertsSent(alerts||[]);}catch(e){setAlertsSent([]);}
          }else if(center?.id){
            const{data:lic,error:licErr}=await supabase.from('center_licenses').select('*,content_packs(name,code,description)').eq('center_id',center.id);
            if(licErr){console.warn('Erreur licences:',licErr);setLoadError('Erreur lors du chargement des licences');}
            setLicenses(lic||[]);
            const{data:req,error:reqErr}=await supabase.from('license_requests').select('*,content_packs(name)').eq('center_id',center.id);
            if(reqErr)console.warn('Erreur requêtes:',reqErr);
            setRequests(req||[]);
          }else{
            setLoadError('Aucun centre associé à votre compte');
          }
        }catch(err){
          console.error('Erreur chargement licences:',err);
          setLoadError('Erreur lors du chargement: '+err.message);
        }
        setLoading(false);
      },[isSuperAdmin,center?.id]);
      useEffect(()=>{load();},[load]);
      
      const getStatus=lic=>{
        if(lic.status==='suspended')return{label:'Suspendu',color:'red',icon:'Pause'};
        const today=new Date(),end=new Date(lic.end_date),start=new Date(lic.start_date);
        if(end<today)return{label:'Expiré',color:'red',icon:'XCircle'};
        if(start>today)return{label:'À venir',color:'blue',icon:'Clock'};
        const days=Math.ceil((end-today)/(1000*60*60*24));
        if(days<=7)return{label:`${days}j`,color:'orange',icon:'AlertTriangle'};
        if(days<=30)return{label:`${days}j`,color:'yellow',icon:'AlertCircle'};
        return{label:'Actif',color:'green',icon:'CheckCircle'};
      };
      
      // Stats pour le dashboard
      const stats=useMemo(()=>{
        const today=new Date();
        const active=licenses.filter(l=>l.status==='active'&&new Date(l.end_date)>=today&&new Date(l.start_date)<=today);
        const expiring7=active.filter(l=>{const d=Math.ceil((new Date(l.end_date)-today)/(1000*60*60*24));return d<=7;});
        const expiring30=active.filter(l=>{const d=Math.ceil((new Date(l.end_date)-today)/(1000*60*60*24));return d>7&&d<=30;});
        const expired=licenses.filter(l=>new Date(l.end_date)<today);
        const pending=requests.filter(r=>r.status==='pending');
        return{total:licenses.length,active:active.length,expiring7:expiring7.length,expiring30:expiring30.length,expired:expired.length,pending:pending.length,byCenter:centers.map(c=>({...c,count:licenses.filter(l=>l.center_id===c.id&&l.status==='active').length}))};
      },[licenses,requests,centers]);
      
      // Licences qui expirent bientôt (pour alertes)
      const expiringLicenses=useMemo(()=>{
        const today=new Date();
        return licenses.filter(l=>{
          if(l.status!=='active')return false;
          const days=Math.ceil((new Date(l.end_date)-today)/(1000*60*60*24));
          return days>0&&days<=30;
        }).map(l=>({...l,daysRemaining:Math.ceil((new Date(l.end_date)-new Date())/(1000*60*60*24))}));
      },[licenses]);
      
      // Envoyer alerte email (simulation)
      const sendExpirationAlert=async(lic,alertType)=>{
        // Vérifier si déjà envoyée
        if(alertsSent.find(a=>a.license_id===lic.id&&a.alert_type===alertType)){
          alert('Alerte déjà envoyée');return;
        }
        
        setSaving(true);
        try{
          // Enregistrer l'alerte
          await supabase.from('license_alerts').insert({license_id:lic.id,alert_type:alertType});
          
          // Récupérer l'email de l'admin du centre
          const{data:admins}=await supabase.from('profiles').select('email,first_name').eq('center_id',lic.center_id).eq('role','center_admin').limit(1);
          const admin=admins?.[0];
          
          if(admin?.email){
            // Ici on pourrait appeler une Edge Function pour envoyer l'email
            // Pour l'instant, on simule
            console.log(`Email envoyé à ${admin.email}: Licence expire dans ${lic.daysRemaining} jours`);
            alert(`✅ Alerte envoyée à ${admin.email}`);
          }else{
            alert('⚠️ Aucun admin trouvé pour ce centre');
          }
          
          await load();
        }catch(err){alert('Erreur: '+err.message);}
        setSaving(false);
      };
      
      const openLicenseModal=(lic=null)=>{
        if(lic){setEditingLicense(lic);setLicenseForm({center_id:lic.center_id,pack_id:lic.pack_id||'',start_date:lic.start_date,end_date:lic.end_date,max_learners:lic.max_learners||'',notes:lic.notes||''});}
        else{setEditingLicense(null);const t=new Date().toISOString().split('T')[0],y=new Date(Date.now()+365*24*60*60*1000).toISOString().split('T')[0];setLicenseForm({center_id:'',pack_id:'',start_date:t,end_date:y,max_learners:'',notes:''});}
        setLicenseModal(true);
      };
      
      const saveLicense=async()=>{
        if(!licenseForm.center_id||!licenseForm.start_date||!licenseForm.end_date){alert('Champs requis');return;}
        setSaving(true);
        try{
          const payload={center_id:licenseForm.center_id,pack_id:licenseForm.pack_id||null,license_type:licenseForm.pack_id?'bundle':'full_catalog',start_date:licenseForm.start_date,end_date:licenseForm.end_date,max_learners:licenseForm.max_learners?parseInt(licenseForm.max_learners):null,notes:licenseForm.notes||null,status:'active'};
          if(editingLicense)await supabase.from('center_licenses').update(payload).eq('id',editingLicense.id);
          else{payload.created_by=profile?.id;await supabase.from('center_licenses').insert(payload);}
          await load();setLicenseModal(false);
        }catch(err){alert('Erreur: '+err.message);}
        setSaving(false);
      };
      
      const deleteLicense=async id=>{
        const license=licenses.find(l=>l.id===id);
        const confirmMsg=`⚠️ SUPPRIMER CETTE LICENCE ?\n\nCentre: ${license?.centers?.name||'Inconnu'}\nPack: ${license?.content_packs?.name||'Catalogue complet'}\nPériode: ${license?.start_date} → ${license?.end_date}\n\nCette action est irréversible.`;
        if(!confirm(confirmMsg))return;
        try{
          await supabase.from('center_licenses').delete().eq('id',id);
          alert('✅ Licence supprimée');
          load();
        }catch(err){alert('Erreur: '+err.message);}
      };
      const toggleStatus=async lic=>{await supabase.from('center_licenses').update({status:lic.status==='active'?'suspended':'active'}).eq('id',lic.id);load();};
      
      // Renouveler une licence (créer une nouvelle avec dates décalées)
      const renewLicense=async(lic)=>{
        const months=parseInt(prompt('Durée du renouvellement (mois):','12'));
        if(!months||isNaN(months))return;
        setSaving(true);
        try{
          const newStart=new Date(lic.end_date);
          newStart.setDate(newStart.getDate()+1);
          const newEnd=new Date(newStart);
          newEnd.setMonth(newEnd.getMonth()+months);
          
          await supabase.from('center_licenses').insert({
            center_id:lic.center_id,
            pack_id:lic.pack_id,
            license_type:lic.license_type,
            start_date:newStart.toISOString().split('T')[0],
            end_date:newEnd.toISOString().split('T')[0],
            max_learners:lic.max_learners,
            status:'active',
            notes:`Renouvellement de la licence du ${lic.start_date}`,
            created_by:profile?.id
          });
          await load();
          alert('✅ Licence renouvelée');
        }catch(err){alert('Erreur: '+err.message);}
        setSaving(false);
      };
      
      const submitRequest=async()=>{

        setSaving(true);

            requested_by:profile.id,
            requested_duration_months:requestForm.requested_duration_months||12,

      const processRequest=async(req,ok)=>{
        setSaving(true);

          if(ok){const s=new Date().toISOString().split('T')[0],e=new Date(Date.now()+req.requested_duration_months*30*24*60*60*1000).toISOString().split('T')[0];await supabase.from('center_licenses').insert({center_id:req.center_id,pack_id:req.pack_id,license_type:'bundle',start_date:s,end_date:e,max_learners:req.requested_max_learners,status:'active',created_by:profile.id});}

              />
            </div>
          </div>
          
          <div className="flex gap-2 mt-4">
            <Button variant="secondary" onClick={()=>setRequestModal(false)}>Annuler</Button>
            <Button className="flex-1" onClick={submitRequest} loading={saving}>Envoyer la demande</Button>
          </div>
        </Modal>
      </div>;
    }

        try{
          const{data,error}=await supabase.from('role_permissions').select('*').order('role');
          const expectedRoles=['center_admin','trainer','learner'];
          const existingRoles=(data||[]).map(r=>r.role);
          const missingRoles=expectedRoles.filter(r=>!existingRoles.includes(r));
          if(missingRoles.length>0){
            for(const role of missingRoles){
              await supabase.from('role_permissions').insert({role,permissions:DEFAULT_PERMISSIONS[role]||{}});
            }
            const{data:updated}=await supabase.from('role_permissions').select('*').order('role');
            setRoles(updated||[]);
          }else{
            setRoles(data||[]);
          }

          console.error('Erreur:',err);
          setRoles([
            {role:'center_admin',permissions:DEFAULT_PERMISSIONS.center_admin},
            {role:'trainer',permissions:DEFAULT_PERMISSIONS.trainer},
            {role:'learner',permissions:DEFAULT_PERMISSIONS.learner}

        if(role==='super_admin')return;

          await supabase.from('role_permissions').update({permissions:newPermissions}).eq('role',role);

    // Lecteur SCORM avec API SCORM 1.2 et 2004
    function ScormPlayer({module,enrollmentId,onComplete,onClose,previewMode=false}){
      const{user}=useAuth();
      const iframeRef=useRef(null);
      const[loading,setLoading]=useState(true);
      const[error,setError]=useState(null);
      const[status,setStatus]=useState('not attempted');
      const[score,setScore]=useState(null);
      const[initialDataLoaded,setInitialDataLoaded]=useState(false);
      const[savedCmiData,setSavedCmiData]=useState(null);
      
      // Exposer lms_origin sur window pour que layer2.js puisse le trouver
      useEffect(() => {
        const origin = window.location.origin;
        window.lms_origin = origin;
        window.LMS_ORIGIN = origin;
        console.log('Exposed lms_origin on window:', origin);
        
        return () => {
          // Cleanup optionnel
        };
      }, []);
      
      // Charger les données existantes AVANT d'initialiser l'API (sauf en mode preview)
      useEffect(()=>{
        if(previewMode){
          // En mode preview, pas de chargement de données existantes
          console.log('SCORM Preview Mode: Skipping progress load');
          setSavedCmiData({});
          setInitialDataLoaded(true);
          return;
        }
        const loadProgress=async()=>{
          console.log('SCORM: Loading existing progress for module', module.id, 'learner', user.id);
          // La contrainte unique est sur (module_id, learner_id)
          const{data,error}=await supabase.from('scorm_progress')
            .select('*')
            .eq('module_id',module.id)
            .eq('learner_id',user.id)
            .maybeSingle();
          
          if(error){
            console.error('SCORM: Error loading progress', error);
          }
          
          if(data){
            console.log('SCORM: Found existing progress', data);
            setSavedCmiData(data.cmi_data||{});
            setStatus(data.completion_status||'unknown');
            setScore(data.score_scaled);
          }else{
            console.log('SCORM: No existing progress found');
            setSavedCmiData({});
          }
          setInitialDataLoaded(true);
        };
        loadProgress();
      },[module.id,user?.id,previewMode]);
      
      // Initialiser l'API SCORM seulement après le chargement des données
      useEffect(()=>{
        if(!initialDataLoaded)return;
        
        console.log('SCORM: Initializing API with saved data', savedCmiData);
        
        // Créer l'API SCORM 1.2
        const previewUser = previewMode ? {id:'preview',email:'Aperçu Admin'} : user;
        const SCORM12_API={
          _initialized:false,
          _finished:false,
          _lastError:'0',
          _data:{
            'cmi.core.student_id':previewUser.id,
            'cmi.core.student_name':previewUser.email||'Apprenant',
            'cmi.core.lesson_status':savedCmiData?.['cmi.core.lesson_status']||'not attempted',
            'cmi.core.lesson_location':savedCmiData?.['cmi.core.lesson_location']||'',
            'cmi.core.score.raw':savedCmiData?.['cmi.core.score.raw']||'',
            'cmi.core.score.min':savedCmiData?.['cmi.core.score.min']||'0',
            'cmi.core.score.max':savedCmiData?.['cmi.core.score.max']||'100',
            'cmi.suspend_data':savedCmiData?.['cmi.suspend_data']||'',
            'cmi.core.session_time':'00:00:00',
            'cmi.core.total_time':savedCmiData?.['cmi.core.total_time']||'00:00:00',
            'cmi.core.entry':savedCmiData?.['cmi.suspend_data']?'resume':'',
            ...savedCmiData
          },
          
          LMSInitialize:function(param){
            console.log('SCORM 1.2: LMSInitialize');
            if(this._initialized){this._lastError='101';return 'false';}
            this._initialized=true;
            this._lastError='0';
            setLoading(false);
            return 'true';
          },
          
          LMSFinish:function(param){
            console.log('SCORM 1.2: LMSFinish');
            if(!this._initialized){this._lastError='301';return 'false';}
            this._finished=true;
            this.LMSCommit('');
            return 'true';
          },
          
          LMSGetValue:function(element){
            console.log('SCORM 1.2: LMSGetValue',element);
            if(!this._initialized){this._lastError='301';return '';}
            this._lastError='0';
            return this._data[element]||'';
          },
          
          LMSSetValue:function(element,value){
            console.log('SCORM 1.2: LMSSetValue',element,value);
            if(!this._initialized){this._lastError='301';return 'false';}
            this._data[element]=value;
            this._lastError='0';
            
            // Mettre à jour le statut
            if(element==='cmi.core.lesson_status'){
              setStatus(value);
            }
            if(element==='cmi.core.score.raw'){
              setScore(parseFloat(value)/100);
            }
            return 'true';
          },
          
          LMSCommit:function(param){
            console.log('SCORM 1.2: LMSCommit');
            // En mode preview, ne pas sauvegarder
            if(previewMode){
              console.log('SCORM Preview Mode: Skipping save');
              return 'true';
            }
            // Sauvegarder dans Supabase
            const saveData=async()=>{
              try{
                const lessonStatus=SCORM12_API._data['cmi.core.lesson_status']||'not attempted';
                const scoreRaw=SCORM12_API._data['cmi.core.score.raw'];
                const scoreScaled=scoreRaw?parseFloat(scoreRaw)/100:null;
                const sessionTime=SCORM12_API._data['cmi.core.session_time']||null;
                const totalTime=SCORM12_API._data['cmi.core.total_time']||null;
                const location=SCORM12_API._data['cmi.core.lesson_location']||null;
                const suspendData=SCORM12_API._data['cmi.suspend_data']||null;
                
                console.log('SCORM Saving:', {moduleId:module.id, lessonStatus, scoreScaled, learnerId:user.id});
                
                // La contrainte unique est sur (module_id, learner_id)
                const{data:existing,error:selectError}=await supabase.from('scorm_progress')
                  .select('id')
                  .eq('module_id',module.id)
                  .eq('learner_id',user.id)
                  .maybeSingle();
                
                if(selectError){
                  console.error('SCORM Select Error:', selectError);
                }
                
                const payload={
                  module_id:module.id,
                  learner_id:user.id,
                  enrollment_id:enrollmentId,
                  completion_status:lessonStatus,
                  success_status:lessonStatus==='passed'?'passed':lessonStatus==='failed'?'failed':'unknown',
                  score_scaled:scoreScaled,
                  score_raw:scoreRaw?parseFloat(scoreRaw):null,
                  score_min:SCORM12_API._data['cmi.core.score.min']?parseFloat(SCORM12_API._data['cmi.core.score.min']):null,
                  score_max:SCORM12_API._data['cmi.core.score.max']?parseFloat(SCORM12_API._data['cmi.core.score.max']):null,
                  session_time:sessionTime,
                  total_time:totalTime,
                  location:location,
                  suspend_data:suspendData,
                  cmi_data:SCORM12_API._data,
                  last_accessed_at:new Date().toISOString()
                };
                
                let result;
                if(existing?.id){
                  console.log('SCORM: Updating existing record', existing.id);
                  result=await supabase.from('scorm_progress').update(payload).eq('id',existing.id);
                }else{
                  console.log('SCORM: Inserting new record');
                  result=await supabase.from('scorm_progress').insert(payload);
                }
                
                if(result.error){
                  console.error('SCORM Save Error:', result.error);
                }else{
                  console.log('SCORM Saved successfully');
                }
                
                if(lessonStatus==='completed'||lessonStatus==='passed'){
                  if(onComplete)onComplete();
                }
              }catch(err){
                console.error('SCORM Save Exception:', err);
              }
            };
            saveData();
            return 'true';
          },
          
          LMSGetLastError:function(){return this._lastError;},
          LMSGetErrorString:function(code){
            const errors={'0':'No Error','101':'General Exception','201':'Invalid argument error','301':'Not initialized','401':'Not implemented error'};
            return errors[code]||'Unknown Error';
          },
          LMSGetDiagnostic:function(code){return this.LMSGetErrorString(code);}
        };
        
        // Créer l'API SCORM 2004
        const SCORM2004_API={
          _initialized:false,
          _terminated:false,
          _lastError:'0',
          _data:{
            'cmi.learner_id':previewUser.id,
            'cmi.learner_name':previewUser.email||'Apprenant',
            'cmi.completion_status':savedCmiData?.['cmi.completion_status']||'not attempted',
            'cmi.success_status':savedCmiData?.['cmi.success_status']||'unknown',
            'cmi.location':savedCmiData?.['cmi.location']||'',
            'cmi.score.scaled':savedCmiData?.['cmi.score.scaled']||'',
            'cmi.score.raw':savedCmiData?.['cmi.score.raw']||'',
            'cmi.score.min':savedCmiData?.['cmi.score.min']||'0',
            'cmi.score.max':savedCmiData?.['cmi.score.max']||'100',
            'cmi.suspend_data':savedCmiData?.['cmi.suspend_data']||'',
            'cmi.session_time':'PT0H0M0S',
            'cmi.total_time':savedCmiData?.['cmi.total_time']||'PT0H0M0S',
            'cmi.entry':savedCmiData?.['cmi.suspend_data']?'resume':'ab-initio',
            ...savedCmiData
          },
          
          Initialize:function(param){
            console.log('SCORM 2004: Initialize');
            if(this._initialized){this._lastError='103';return 'false';}
            this._initialized=true;
            this._lastError='0';
            setLoading(false);
            return 'true';
          },
          
          Terminate:function(param){
            console.log('SCORM 2004: Terminate');
            if(!this._initialized||this._terminated){this._lastError='113';return 'false';}
            this._terminated=true;
            this.Commit('');
            return 'true';
          },
          
          GetValue:function(element){
            console.log('SCORM 2004: GetValue',element);
            if(!this._initialized){this._lastError='122';return '';}
            this._lastError='0';
            return this._data[element]||'';
          },
          
          SetValue:function(element,value){
            console.log('SCORM 2004: SetValue',element,value);
            if(!this._initialized){this._lastError='132';return 'false';}
            this._data[element]=value;
            this._lastError='0';
            
            if(element==='cmi.completion_status'){setStatus(value);}
            if(element==='cmi.score.scaled'){setScore(parseFloat(value));}
            return 'true';
          },
          
          Commit:function(param){
            console.log('SCORM 2004: Commit');
            // En mode preview, ne pas sauvegarder
            if(previewMode){
              console.log('SCORM 2004 Preview Mode: Skipping save');
              return 'true';
            }
            const saveData=async()=>{
              try{
                const completionStatus=SCORM2004_API._data['cmi.completion_status']||'unknown';
                const successStatus=SCORM2004_API._data['cmi.success_status']||'unknown';
                const scoreScaled=SCORM2004_API._data['cmi.score.scaled']?parseFloat(SCORM2004_API._data['cmi.score.scaled']):null;
                const scoreRaw=SCORM2004_API._data['cmi.score.raw'];
                const sessionTime=SCORM2004_API._data['cmi.session_time']||null;
                const totalTime=SCORM2004_API._data['cmi.total_time']||null;
                const location=SCORM2004_API._data['cmi.location']||null;
                const suspendData=SCORM2004_API._data['cmi.suspend_data']||null;
                
                console.log('SCORM 2004 Saving:', {moduleId:module.id, completionStatus, scoreScaled, learnerId:user.id});
                
                // La contrainte unique est sur (module_id, learner_id)
                const{data:existing,error:selectError}=await supabase.from('scorm_progress')
                  .select('id')
                  .eq('module_id',module.id)
                  .eq('learner_id',user.id)
                  .maybeSingle();
                
                if(selectError){
                  console.error('SCORM 2004 Select Error:', selectError);
                }
                
                const payload={
                  module_id:module.id,
                  learner_id:user.id,
                  enrollment_id:enrollmentId,
                  completion_status:completionStatus,
                  success_status:successStatus,
                  score_scaled:scoreScaled,
                  score_raw:scoreRaw?parseFloat(scoreRaw):null,
                  score_min:SCORM2004_API._data['cmi.score.min']?parseFloat(SCORM2004_API._data['cmi.score.min']):null,
                  score_max:SCORM2004_API._data['cmi.score.max']?parseFloat(SCORM2004_API._data['cmi.score.max']):null,
                  session_time:sessionTime,
                  total_time:totalTime,
                  location:location,
                  suspend_data:suspendData,
                  cmi_data:SCORM2004_API._data,
                  last_accessed_at:new Date().toISOString()
                };
                
                let result;
                if(existing?.id){
                  console.log('SCORM 2004: Updating existing record', existing.id);
                  result=await supabase.from('scorm_progress').update(payload).eq('id',existing.id);
                }else{
                  console.log('SCORM 2004: Inserting new record');
                  result=await supabase.from('scorm_progress').insert(payload);
                }
                
                if(result.error){
                  console.error('SCORM 2004 Save Error:', result.error);
                }else{
                  console.log('SCORM 2004 Saved successfully');
                }
                
                if(completionStatus==='completed'||successStatus==='passed'){
                  if(onComplete)onComplete();
                }
              }catch(err){
                console.error('SCORM 2004 Save Exception:', err);
              }
            };
            saveData();
            return 'true';
          },
          
          GetLastError:function(){return this._lastError;},
          GetErrorString:function(code){
            const errors={'0':'No Error','103':'Already Initialized','113':'Termination After Termination','122':'Retrieve Data Before Initialization','132':'Store Data Before Initialization'};
            return errors[code]||'Unknown Error';
          },
          GetDiagnostic:function(code){return this.GetErrorString(code);}
        };
        
        // Exposer les APIs globalement
        window.API=SCORM12_API;
        window.API_1484_11=SCORM2004_API;
        
        return()=>{
          // Cleanup
          delete window.API;
          delete window.API_1484_11;
        };
      },[module.id,enrollmentId,user.id,initialDataLoaded,savedCmiData,onComplete]);
      
      // L'URL du module SCORM via scorm-loader.html
      // Le loader détecte le type et utilise la méthode appropriée
      const scormUrl = useMemo(() => {
        if (!module.package_url) return null;
        
        // Détecter si c'est un SCORM Codes Rousseau (via remote_url)
        const isCodesRousseau = module.remote_url && module.remote_url.includes('codesrousseau');
        
        // Mode: preview (pas d'enregistrement) ou course (enregistrement)
        const scormMode = previewMode ? 'preview' : 'course';
        
        const loaderUrl = window.location.origin + '/scorm-loader.html?url=' + 
          encodeURIComponent(module.package_url) +
          (isCodesRousseau ? '&type=cr' : '&type=standard') +
          '&mode=' + scormMode;
        
        console.log('SCORM Loader URL:', loaderUrl, isCodesRousseau ? '(Codes Rousseau)' : '(Standard)', '- Mode:', scormMode);
        return loaderUrl;
      }, [module.package_url, module.remote_url, previewMode]);
      
      // Écouter les messages postMessage venant de l'iframe SCORM
      useEffect(() => {
        if (!initialDataLoaded) return;
        
        const handleMessage = (event) => {
          const data = event.data;
          if (!data || !data.type) return;
          
          // Vérifier que le message vient de notre iframe
          const frame = iframeRef.current;
          if (!frame) return;
          
          // Gérer les appels API SCORM
          if (data.type === 'scorm_api_call') {
            console.log('[SCORM Player] API call from iframe:', data.apiType, data.method);
            
            let result = 'false';
            try {
              const api = data.apiType === '12' ? window.API : window.API_1484_11;
              if (api && api[data.method]) {
                result = api[data.method].apply(api, data.args || []);
              }
            } catch (e) {
              console.error('[SCORM Player] API call error:', e);
            }
            
            // Envoyer la réponse
            if (frame.contentWindow) {
              frame.contentWindow.postMessage({
                type: 'scorm_api_response',
                callId: data.callId,
                result: result
              }, '*');
            }
          }
          
          // Notification que le contenu SCORM est prêt
          if (data.type === 'scorm_content_ready') {
            console.log('[SCORM Player] Content ready');
            setLoading(false);
          }
        };
        
        window.addEventListener('message', handleMessage);
        return () => window.removeEventListener('message', handleMessage);
      }, [initialDataLoaded]);
      
      console.log('SCORM Player:', { scormUrl, module });
      
      const statusLabels={'not attempted':'Non commencé','incomplete':'En cours','completed':'Terminé','passed':'Réussi','failed':'Échoué'};
      const statusColors={'not attempted':'bg-gray-500','incomplete':'bg-yellow-500','completed':'bg-green-500','passed':'bg-green-500','failed':'bg-red-500'};
      
      // Fonction pour basculer en plein écran
      const toggleFullscreen=()=>{
        const container=iframeRef.current?.parentElement?.parentElement;
        if(!container)return;
        
        if(!document.fullscreenElement){
          // Entrer en plein écran
          if(container.requestFullscreen){
            container.requestFullscreen();
          }else if(container.webkitRequestFullscreen){
            container.webkitRequestFullscreen();
          }else if(container.mozRequestFullScreen){
            container.mozRequestFullScreen();
          }else if(container.msRequestFullscreen){
            container.msRequestFullscreen();
          }
        }else{
          // Sortir du plein écran
          if(document.exitFullscreen){
            document.exitFullscreen();
          }else if(document.webkitExitFullscreen){
            document.webkitExitFullscreen();
          }else if(document.mozCancelFullScreen){
            document.mozCancelFullScreen();
          }else if(document.msExitFullscreen){
            document.msExitFullscreen();
          }
        }
      };
      
      return(
        <div className="fixed inset-0 z-50 bg-gray-900 flex flex-col">
          {/* Header */}
          <div className="bg-gray-800 border-b border-gray-700 p-4 flex items-center justify-between">
            <div className="flex items-center gap-4">
              <button onClick={onClose} className="p-2 hover:bg-gray-700 rounded-lg">
                <Icon name="ArrowLeft" size={20}/>
              </button>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-semibold">{module.title}</h1>
                  {previewMode&&<span className="px-2 py-0.5 bg-amber-500/20 text-amber-400 rounded text-xs font-medium">👁️ Mode Aperçu</span>}
                </div>
                <div className="flex items-center gap-2 text-sm">
                  {!previewMode&&<span className={`px-2 py-0.5 rounded text-xs ${statusColors[status]||'bg-gray-500'}`}>{statusLabels[status]||status}</span>}
                  {!previewMode&&score!==null&&<span className="text-gray-400">Score: {Math.round((score>1?score:score*100))}%</span>}
                  {previewMode&&<span className="text-gray-400 text-xs">La progression ne sera pas enregistrée</span>}
                </div>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={toggleFullscreen} className="p-2 hover:bg-gray-700 rounded-lg" title="Plein écran">
                <Icon name="Maximize2" size={20}/>
              </button>
              <Button variant="secondary" icon="X" onClick={onClose}>Fermer</Button>
            </div>
          </div>
          
          {/* Contenu SCORM */}
          <div className="flex-1 relative">
            {(loading || !scormUrl)&&<div className="absolute inset-0 flex items-center justify-center bg-gray-900 z-10"><Loading text="Chargement du module..."/></div>}
            {error?<div className="absolute inset-0 flex items-center justify-center"><Alert type="error">{error}</Alert></div>:(
              scormUrl && <iframe
                ref={iframeRef}
                src={scormUrl}
                className="w-full h-full border-0"
                allow="fullscreen; autoplay; encrypted-media"
                allowFullScreen={true}
                webkitallowfullscreen="true"
                mozallowfullscreen="true"
                onLoad={()=>setLoading(false)}
                onError={()=>setError('Erreur de chargement du module SCORM')}
              />
            )}
          </div>
        </div>
      );
    }

    // My Courses avec lecteur vidéo et progression
    function MyCoursesPage(){
      const{user}=useAuth();
      const[enrollments,setEnrollments]=useState([]);
      const[loading,setLoading]=useState(true);
      const[selectedCourse,setSelectedCourse]=useState(null);
      const[courseVideos,setCourseVideos]=useState([]);
      const[courseScorm,setCourseScorm]=useState([]);
      const[currentVideo,setCurrentVideo]=useState(null);
      const[activeScorm,setActiveScorm]=useState(null);
      const[scormProgress,setScormProgress]=useState({});
      const[videoProgress,setVideoProgress]=useState({});
      const[chapters,setChapters]=useState([]);
      const[attachments,setAttachments]=useState([]);
      const[notes,setNotes]=useState([]);
      const[newNote,setNewNote]=useState('');
      const[activeTab,setActiveTab]=useState('content');
      const[courseQuiz,setCourseQuiz]=useState(null);
      const[quizQuestions,setQuizQuestions]=useState([]);
      const[quizAnswers,setQuizAnswers]=useState({});
      const[quizMode,setQuizMode]=useState(false);
      const[quizResult,setQuizResult]=useState(null);
      const[quizStartTime,setQuizStartTime]=useState(null);
      const[quizAttempts,setQuizAttempts]=useState([]);
      const[myScormStats,setMyScormStats]=useState({total:0,completed:0,passed:0,avgScore:0});
      const[allMyScorm,setAllMyScorm]=useState([]);
      const playerRef=useRef(null);
      const playerInstanceRef=useRef(null);
      
      // Suivi du temps passé sur le cours
      const courseSessionRef=useRef({startTime:null,sessionId:null});
      
      // Démarrer le suivi quand on ouvre un cours
      useEffect(()=>{
        if(selectedCourse){
          // Démarrer une nouvelle session
          const startTime=new Date();
          const sessionId=`session_${Date.now()}`;
          courseSessionRef.current={startTime,sessionId,enrollmentId:selectedCourse.id};
          console.log('⏱️ Course session started:', sessionId);
          
          // Créer la session en base
          supabase.from('course_sessions').insert({
            enrollment_id:selectedCourse.id,
            learner_id:user.id,
            started_at:startTime.toISOString()
          }).select().single().then(({data})=>{
            if(data)courseSessionRef.current.dbSessionId=data.id;
          });
          
          // Sauvegarder périodiquement (toutes les 30 secondes)
          const interval=setInterval(()=>{
            const elapsed=Math.floor((Date.now()-courseSessionRef.current.startTime)/1000);
            console.log('⏱️ Course time elapsed:', elapsed, 'seconds');
          },30000);
          
          return()=>{
            clearInterval(interval);
            // Fin de session
            const endTime=new Date();
            const duration=Math.floor((endTime-courseSessionRef.current.startTime)/1000);
            console.log('⏱️ Course session ended, duration:', duration, 'seconds');
            
            // Mettre à jour la session en base
            if(courseSessionRef.current.dbSessionId){
              supabase.from('course_sessions').update({
                ended_at:endTime.toISOString(),
                duration_seconds:duration
              }).eq('id',courseSessionRef.current.dbSessionId);
            }
            
            // Mettre à jour le temps total sur l'enrollment
            if(courseSessionRef.current.enrollmentId&&duration>0){
              supabase.from('enrollments').select('time_spent_seconds').eq('id',courseSessionRef.current.enrollmentId).single().then(({data})=>{
                const currentTime=data?.time_spent_seconds||0;
                supabase.from('enrollments').update({time_spent_seconds:currentTime+duration}).eq('id',courseSessionRef.current.enrollmentId);
              });
            }
          };
        }
      },[selectedCourse?.id,user.id]);

      const load=useCallback(async()=>{
        const{data}=await supabase.from('enrollments').select('*,playlists:playlist_id(*)').eq('learner_id',user.id);
        setEnrollments(data||[]);
        
        // Charger toutes les progressions SCORM de l'apprenant
        const{data:scorm}=await supabase.from('scorm_progress').select('*').eq('learner_id',user.id).order('last_accessed_at',{ascending:false});
        setAllMyScorm(scorm||[]);
        
        // Calculer les stats SCORM personnelles
        const total=(scorm||[]).length;
        const completed=(scorm||[]).filter(s=>s.completion_status==='completed'||s.completion_status==='passed').length;
        const passed=(scorm||[]).filter(s=>s.completion_status==='passed'||s.success_status==='passed').length;
        const withScore=(scorm||[]).filter(s=>s.score_scaled!==null);
        const avgScore=withScore.length>0?withScore.reduce((a,s)=>a+(s.score_scaled||0),0)/withScore.length:0;
        setMyScormStats({total,completed,passed,avgScore});
        
        setLoading(false);
      },[user.id]);
      
      useEffect(()=>{load();},[load]);

      const openCourse=async(enrollment)=>{
        setSelectedCourse(enrollment);
        const{data:pvs}=await supabase.from('playlist_videos').select('*,videos(*)').eq('playlist_id',enrollment.playlist_id).order('position');
        setCourseVideos(pvs||[]);
        
        // Charger les modules SCORM du cours
        try {
          const{data:scorm}=await supabase.from('playlist_scorm').select('*,scorm_modules(*)').eq('playlist_id',enrollment.playlist_id).order('position');
          setCourseScorm(scorm||[]);
          
          // Charger la progression SCORM par learner_id (contrainte unique: module_id + learner_id)
          const moduleIds=(scorm||[]).map(s=>s.scorm_modules?.id).filter(Boolean);
          let spMap={};
          if(moduleIds.length>0){
            const{data:sp}=await supabase.from('scorm_progress').select('*').eq('learner_id',user.id).in('module_id',moduleIds);
            (sp||[]).forEach(p=>{spMap[p.module_id]=p;});
          }
          setScormProgress(spMap);
        } catch(e) { console.log('SCORM tables not available'); setCourseScorm([]); }
        
        const{data:progress,error:progressError}=await supabase.from('video_progress').select('*').eq('enrollment_id',enrollment.id);
        console.log('📊 Loaded video progress:', {enrollmentId: enrollment.id, count: progress?.length, progress, error: progressError});
        const progressMap={};
        (progress||[]).forEach(p=>{
          // Utiliser playlist_video_id en priorité, sinon course_video_id
          const videoKey = p.playlist_video_id || p.course_video_id;
          if(videoKey) progressMap[videoKey]=p;
        });
        console.log('📊 Progress map:', progressMap);
        setVideoProgress(progressMap);
        
        // Charger le quiz du cours
        const{data:quiz,error:quizError}=await supabase.from('quizzes').select('*').eq('playlist_id',enrollment.playlist_id).maybeSingle();
        if(quiz&&!quizError){
          // Charger les questions et réponses séparément
          const{data:questions}=await supabase.from('quiz_questions').select('*').eq('quiz_id',quiz.id).order('sort_order');
          const questionIds=(questions||[]).map(q=>q.id);
          let answers=[];
          if(questionIds.length>0){
            const{data:ans}=await supabase.from('quiz_answers').select('*').in('question_id',questionIds);
            answers=ans||[];
          }
          // Associer les réponses aux questions
          const questionsWithAnswers=(questions||[]).map(q=>({
            ...q,
            quiz_answers:answers.filter(a=>a.question_id===q.id)
          }));
          setCourseQuiz(quiz);
          setQuizQuestions(questionsWithAnswers);
          // Charger les tentatives précédentes
          const{data:attempts}=await supabase.from('quiz_attempts').select('*').eq('quiz_id',quiz.id).eq('learner_id',user.id).order('created_at',{ascending:false});
          setQuizAttempts(attempts||[]);
        }else{
          setCourseQuiz(null);
          setQuizQuestions([]);
          setQuizAttempts([]);
        }
        
        const firstIncomplete=pvs?.find(pv=>!progressMap[pv.id]?.is_completed);
        setCurrentVideo(firstIncomplete||pvs?.[0]||null);
      };

      const closeCourse=()=>{
        setSelectedCourse(null);
        setCourseVideos([]);
        setCourseScorm([]);
        setCurrentVideo(null);
        setActiveScorm(null);
        setVideoProgress({});
        setScormProgress({});
        setChapters([]);
        setAttachments([]);
        setNotes([]);
        setNewNote('');
        setCourseQuiz(null);
        setQuizQuestions([]);
        setQuizAnswers({});
        setQuizMode(false);
        setQuizResult(null);
        setQuizAttempts([]);
        if(playerInstanceRef.current){
          playerInstanceRef.current.destroy();
          playerInstanceRef.current=null;
        }
      };

      const selectVideo=async(pv)=>{
        setCurrentVideo(pv);
      };
      
      // Fonctions Quiz
      const startQuiz=()=>{
        setQuizAnswers({});
        setQuizResult(null);
        setQuizStartTime(Date.now());
        setQuizMode(true);
      };
      
      const selectAnswer=(questionId,answerId,isMultiple)=>{
        if(isMultiple){
          const current=quizAnswers[questionId]||[];
          if(current.includes(answerId)){
            setQuizAnswers({...quizAnswers,[questionId]:current.filter(id=>id!==answerId)});
          }else{
            setQuizAnswers({...quizAnswers,[questionId]:[...current,answerId]});
          }
        }else{
          setQuizAnswers({...quizAnswers,[questionId]:[answerId]});
        }
      };
      
      const submitQuiz=async()=>{
        let totalPoints=0;
        let earnedPoints=0;
        
        quizQuestions.forEach(q=>{
          const correctAnswers=q.quiz_answers.filter(a=>a.is_correct).map(a=>a.id);
          const userAnswers=quizAnswers[q.id]||[];
          totalPoints+=q.points||1;
          
          const isCorrect=correctAnswers.length===userAnswers.length&&correctAnswers.every(id=>userAnswers.includes(id));
          if(isCorrect)earnedPoints+=(q.points||1);
        });
        
        const scorePercent=totalPoints>0?Math.round((earnedPoints/totalPoints)*100):0;
        const passed=scorePercent>=courseQuiz.passing_score;
        
        // Calculer le temps passé sur le quiz
        const quizDurationSeconds=quizStartTime?Math.round((Date.now()-quizStartTime)/1000):0;
        
        // Enregistrer la tentative
        const{data:attempt}=await supabase.from('quiz_attempts').insert({
          quiz_id:courseQuiz.id,
          learner_id:user.id,
          enrollment_id:selectedCourse.id,
          score_percent:scorePercent,
          passed,
          completed_at:new Date().toISOString(),
          answers:quizAnswers,
          duration_seconds:quizDurationSeconds
        }).select().single();
        
        if(attempt){
          setQuizAttempts([attempt,...quizAttempts]);
        }
        
        setQuizResult({scorePercent,passed,earnedPoints,totalPoints});
        
        // Si réussi
        if(passed){
          // Ajouter des points (25 points par quiz réussi)
          await supabase.from('learner_points').insert({
            learner_id:user.id,
            points:25,
            reason:'quiz_passed',
            reference_id:courseQuiz.id
          });
          
          // Notification
          await supabase.from('notifications').insert({
            user_id:user.id,
            title:'Quiz réussi !',
            message:`Vous avez obtenu ${scorePercent}% au quiz "${courseQuiz.title}" (+25 pts)`,
            type:'success'
          });
          
          // Vérifier badge "Sans faute" si 100%
          if(scorePercent===100){
            const{data:badge}=await supabase.from('badges').select('id,points').eq('code','perfect_quiz').single();
            if(badge){
              const{data:existing}=await supabase.from('learner_badges').select('id').eq('learner_id',user.id).eq('badge_id',badge.id).single();
              if(!existing){
                await supabase.from('learner_badges').insert({learner_id:user.id,badge_id:badge.id});
                await supabase.from('learner_points').insert({learner_id:user.id,points:badge.points,reason:'badge_earned',reference_id:badge.id});
                await supabase.from('notifications').insert({user_id:user.id,title:'🏆 Badge obtenu !',message:'Vous avez obtenu le badge "Sans faute"',type:'success',link:'my-badges'});
              }
            }
          }
        }
      };
      
      const closeQuiz=()=>{
        setQuizMode(false);
        setQuizResult(null);
        setQuizAnswers({});
      };
      
      const bestAttempt=quizAttempts.length>0?quizAttempts.reduce((best,a)=>a.score_percent>(best?.score_percent||0)?a:best,null):null;

      // Charger les ressources de la vidéo courante
      useEffect(()=>{
        if(!currentVideo||!selectedCourse)return;
        const loadResources=async()=>{
          const videoId=currentVideo.videos?.id;
          if(!videoId)return;
          
          const[{data:chap},{data:att},{data:n}]=await Promise.all([
            supabase.from('video_chapters').select('*').eq('video_id',videoId).order('timestamp_seconds'),
            supabase.from('video_attachments').select('*').eq('video_id',videoId).order('sort_order'),
            supabase.from('learner_notes').select('*').eq('playlist_video_id',currentVideo.id).eq('enrollment_id',selectedCourse.id).order('created_at',{ascending:false})
          ]);
          setChapters(chap||[]);
          setAttachments(att||[]);
          setNotes(n||[]);
        };
        loadResources();
      },[currentVideo?.id,selectedCourse?.id]);

      // Ref pour accéder à videoProgress sans causer de re-render du player
      const videoProgressRef=useRef(videoProgress);
      useEffect(()=>{videoProgressRef.current=videoProgress;},[videoProgress]);
      
      // Ref pour selectedCourse
      const selectedCourseRef=useRef(selectedCourse);
      useEffect(()=>{selectedCourseRef.current=selectedCourse;},[selectedCourse]);
      
      // Ref pour scormProgress
      const scormProgressRef=useRef(scormProgress);
      useEffect(()=>{scormProgressRef.current=scormProgress;},[scormProgress]);

      // Initialiser le lecteur Vimeo
      useEffect(()=>{
        if(!currentVideo||!playerRef.current||!selectedCourse)return;
        
        if(playerInstanceRef.current){
          playerInstanceRef.current.destroy();
        }
        
        const progressData=videoProgressRef.current[currentVideo.id];
        const startTime=progressData?.last_position_seconds||0;
        const vimeoId=currentVideo.videos?.vimeo_id;
        const vimeoHash=currentVideo.videos?.vimeo_hash;
        console.log('🎬 Initializing video player:', {
          videoId: currentVideo.id,
          vimeoId,
          vimeoHash: vimeoHash ? '***' : null,
          startTime
        });
        playerRef.current.innerHTML='';
        
        // Pour les vidéos privées avec hash, on doit utiliser l'URL d'embed
        const playerOptions={
          responsive:true,
          autoplay:false
        };
        if(vimeoHash){
          playerOptions.url=`https://player.vimeo.com/video/${vimeoId}?h=${vimeoHash}`;
        }else{
          playerOptions.id=vimeoId;
        }
        
        const player=new Vimeo.Player(playerRef.current,playerOptions);
        
        player.ready().then(()=>{
          console.log('🎬 Player ready');
          if(startTime>0){
            console.log('⏩ Seeking to:', startTime);
            player.setCurrentTime(startTime).catch(e=>console.error('Seek error:',e));
          }
        });
        
        playerInstanceRef.current=player;
        
        // Variables locales pour la closure
        const videoId=currentVideo.id;
        const visitorId=user.id;
        const enrollmentId=selectedCourse.id;
        let lastSaveTime=0;
        
        // Fonction de sauvegarde locale
        const saveProgress=async(positionSeconds,completed)=>{
          const existing=videoProgressRef.current[videoId];
          const progressData={
            enrollment_id:enrollmentId,
            playlist_video_id:videoId,
            learner_id:visitorId,
            last_position_seconds:Math.floor(positionSeconds),
            is_completed:completed||existing?.is_completed||false,
            watch_time_seconds:(existing?.watch_time_seconds||0)+10
          };
          
          if(completed)progressData.completed_at=new Date().toISOString();
          
          console.log('💾 Saving video progress:', {videoId, positionSeconds, completed, existing: !!existing?.id});
          
          try{
            if(existing?.id){
              const{data:updated,error}=await supabase.from('video_progress').update({
                last_position_seconds:progressData.last_position_seconds,
                is_completed:progressData.is_completed,
                watch_time_seconds:progressData.watch_time_seconds,
                ...(completed?{completed_at:progressData.completed_at}:{})
              }).eq('id',existing.id).select().single();
              
              if(error){
                console.error('❌ Error updating video progress:', error);
              }else{
                console.log('✅ Updated video progress:', updated);
                setVideoProgress(prev=>({...prev,[videoId]:updated||{...prev[videoId],...progressData}}));
              }
            }else{
              const{data:inserted,error}=await supabase.from('video_progress').insert(progressData).select().single();
              if(error){
                console.error('❌ Error inserting video progress:', error);
              }else if(inserted){
                console.log('✅ Inserted video progress:', inserted);
                setVideoProgress(prev=>({...prev,[videoId]:inserted}));
              }
            }
          }catch(err){
            console.error('❌ Exception saving video progress:', err);
          }
        };
        
        player.on('timeupdate',(data)=>{
          const now=Date.now();
          if(now-lastSaveTime>10000){ // Sauvegarder toutes les 10 secondes
            lastSaveTime=now;
            saveProgress(data.seconds,false);
          }
        });
        
        // Flag pour éviter que pause écrase le statut après ended
        let videoEnded=false;
        
        player.on('ended',async()=>{
          console.log('🏁 Video ended');
          videoEnded=true;
          await saveProgress(0,true);
          // Attendre un peu que l'état soit mis à jour puis recalculer
          setTimeout(async()=>{
            // Recalculer la progression du cours
            const totalVids=courseVideos.length;
            const completedVids=Object.values(videoProgressRef.current).filter(p=>p.is_completed).length;
            const totalScorms=courseScorm.length;
            const completedScorms=Object.values(scormProgressRef.current||{}).filter(p=>p.completion_status==='completed'||p.completion_status==='passed').length;
            const totalItems=totalVids+totalScorms;
            const completedItems=completedVids+completedScorms;
            const pct=totalItems>0?Math.round((completedItems/totalItems)*100):0;
            console.log('📈 Course progress after video ended:', {totalVids, completedVids, totalScorms, completedScorms, pct});
            
            await supabase.from('enrollments').update({progress_percent:pct,status:pct===100?'completed':'in_progress'}).eq('id',enrollmentId);
            setSelectedCourse(prev=>prev?{...prev,progress_percent:pct,status:pct===100?'completed':'in_progress'}:prev);
            
            // Si le cours est terminé à 100%, appeler updateCourseProgress pour générer certificat et badges
            if(pct===100){
              console.log('🎉 Course completed! Generating certificate and badges...');
              updateCourseProgress();
            }
          },500);
        });
        
        // Sauvegarder aussi quand on pause (mais pas si la vidéo vient de se terminer)
        player.on('pause',(data)=>{
          if(videoEnded){
            console.log('⏸️ Video paused after ended, ignoring...');
            return;
          }
          console.log('⏸️ Video paused at:', data.seconds);
          saveProgress(data.seconds,false);
        });
        
        return()=>{
          if(playerInstanceRef.current){
            playerInstanceRef.current.off('timeupdate');
            playerInstanceRef.current.off('ended');
            playerInstanceRef.current.off('pause');
          }
        };
      },[currentVideo?.id,currentVideo?.videos?.vimeo_id,selectedCourse?.id,user.id,courseVideos.length,courseScorm.length]);

      const updateCourseProgress=useCallback(async()=>{
        if(!selectedCourse)return;
        
        // Compter les vidéos complétées
        const totalVideos=courseVideos.length;
        const completedVideos=Object.values(videoProgressRef.current).filter(p=>p.is_completed).length;
        
        // Compter les SCORM complétés
        const totalScorm=courseScorm.length;
        const completedScorm=Object.values(scormProgress).filter(p=>p.completion_status==='completed'||p.completion_status==='passed').length;
        
        // Calculer le pourcentage total
        const totalItems=totalVideos+totalScorm;
        const completedItems=completedVideos+completedScorm;
        const percent=totalItems>0?Math.round((completedItems/totalItems)*100):0;
        
        console.log('📈 Updating course progress:', {totalVideos, completedVideos, totalScorm, completedScorm, percent});
        
        const wasCompleted=selectedCourse.status==='completed';
        await supabase.from('enrollments').update({progress_percent:percent,status:percent===100?'completed':percent>0?'in_progress':'not_started'}).eq('id',selectedCourse.id);
        
        // Mettre à jour l'état local
        setSelectedCourse(prev=>({...prev,progress_percent:percent,status:percent===100?'completed':percent>0?'in_progress':'not_started'}));
        setEnrollments(prev=>prev.map(e=>e.id===selectedCourse.id?{...e,progress_percent:percent,status:percent===100?'completed':percent>0?'in_progress':'not_started'}:e));
        
        // Cours complété à 100%
        if(percent===100&&!wasCompleted){
          console.log('🎉 Cours complété à 100% ! Génération certificat...');
          
          // Vérifier si un certificat existe déjà pour cette inscription
          const{data:existingCert}=await supabase.from('certificates').select('id').eq('enrollment_id',selectedCourse.id).single();
          if(existingCert){
            console.log('⚠️ Certificat déjà existant pour cette inscription, skip...');
          }else{
          
          // Calculer la note moyenne (SCORM + Quiz)
          let totalScore=0;
          let scoreCount=0;
          
          // Scores SCORM
          Object.values(scormProgressRef.current||{}).forEach(sp=>{
            if(sp.score_scaled!==null&&sp.score_scaled!==undefined){
              totalScore+=sp.score_scaled*100;
              scoreCount++;
            }
          });
          
          // Scores Quiz (si disponibles)
          const{data:quizAttempts}=await supabase.from('quiz_attempts').select('score_percent').eq('enrollment_id',selectedCourse.id).eq('passed',true);
          (quizAttempts||[]).forEach(qa=>{
            if(qa.score_percent!==null){
              totalScore+=qa.score_percent;
              scoreCount++;
            }
          });
          
          const avgScore=scoreCount>0?Math.round(totalScore/scoreCount):null;
          
          // Calculer la durée de réalisation (temps entre inscription et maintenant)
          const enrollmentDate=new Date(selectedCourse.created_at);
          const completionDate=new Date();
          const durationSeconds=Math.floor((completionDate-enrollmentDate)/1000);
          
          // Calculer aussi le temps total de visionnage
          let totalWatchTime=0;
          Object.values(videoProgressRef.current||{}).forEach(vp=>{
            totalWatchTime+=(vp.watch_time_seconds||0);
          });
          
          console.log('📊 Certificat stats:', {avgScore, durationSeconds, totalWatchTime});
          
          // 1. Générer certificat avec note et durée
          const certNumber='CERT-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.random().toString(36).substring(2,8).toUpperCase();
          const{data:cert}=await supabase.from('certificates').insert({
            enrollment_id:selectedCourse.id,
            learner_id:user.id,
