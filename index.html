        if(url)setQuestionForm(f=>({...f,image_url:url}));
      };
      
      const handleAudioChange=async(e)=>{
        const file=e.target.files[0];if(!file)return;
        if(!file.type.startsWith('audio/')){alert('Audio requis');return;}
        if(file.size>20*1024*1024){alert('Max 20 Mo');return;}
        const url=await uploadMedia(file,'audio');
        if(url)setQuestionForm(f=>({...f,audio_url:url}));
      };
      
      const extractVimeoId=(url)=>{if(!url)return'';const m=url.match(/(?:vimeo\.com\/)(\d+)/);return m?m[1]:url;};
      
      // ========== QUESTIONS CRUD ==========
      const changeQuestionType=(type)=>{
        const nq=getEmptyQuestion(type);
        setQuestionForm({...nq,question_text:questionForm.question_text,category_id:questionForm.category_id,theme_id:questionForm.theme_id,sub_theme_id:questionForm.sub_theme_id,difficulty:questionForm.difficulty,points:questionForm.points,time_limit:questionForm.time_limit,image_url:questionForm.image_url,audio_url:questionForm.audio_url,vimeo_id:questionForm.vimeo_id,feedback_correct:questionForm.feedback_correct,feedback_incorrect:questionForm.feedback_incorrect});
      };
      
      const updateAnswer=(idx,field,value)=>{
        const arr=[...questionForm.answers];
        if(field==='is_correct'&&questionForm.question_type==='single'){arr.forEach((a,i)=>a.is_correct=i===idx);}
        else if(field==='is_correct'&&questionForm.question_type==='true_false'){arr[0].is_correct=idx===0;arr[1].is_correct=idx===1;}
        else{arr[idx][field]=value;}
        setQuestionForm({...questionForm,answers:arr});
      };
      
      const addAnswerOption=()=>{if(questionForm.answers.length<8)setQuestionForm({...questionForm,answers:[...questionForm.answers,{text:'',is_correct:false}]});};
      const removeAnswerOption=(idx)=>{if(questionForm.answers.length>2)setQuestionForm({...questionForm,answers:questionForm.answers.filter((_,i)=>i!==idx)});};
      const updatePair=(idx,f,v)=>{const p=[...questionForm.pairs];p[idx][f]=v;setQuestionForm({...questionForm,pairs:p});};
      const addPair=()=>{if((questionForm.pairs||[]).length<8)setQuestionForm({...questionForm,pairs:[...questionForm.pairs,{left:'',right:''}]});};
      const removePair=(idx)=>{if((questionForm.pairs||[]).length>2)setQuestionForm({...questionForm,pairs:questionForm.pairs.filter((_,i)=>i!==idx)});};
      const updateItem=(idx,v)=>{const it=[...questionForm.items];it[idx]=v;setQuestionForm({...questionForm,items:it});};
      const addItem=()=>{if((questionForm.items||[]).length<10)setQuestionForm({...questionForm,items:[...questionForm.items,'']});};
      const removeItem=(idx)=>{if((questionForm.items||[]).length>2)setQuestionForm({...questionForm,items:questionForm.items.filter((_,i)=>i!==idx)});};
      const addKeyword=()=>{const kw=questionForm.answers[0]?.text?.trim();if(kw&&!questionForm.keywords.includes(kw)){setQuestionForm({...questionForm,keywords:[...questionForm.keywords,kw],answers:[{text:'',is_correct:true}]});}};
      const removeKeyword=(kw)=>setQuestionForm({...questionForm,keywords:questionForm.keywords.filter(k=>k!==kw)});
      
      const validateQuestion=()=>{
        if(!questionForm.question_text.trim()){alert('Entrez la question');return false;}
        switch(questionForm.question_type){
          case'single':case'multiple':
            if(questionForm.answers.filter(a=>a.text.trim()).length<2){alert('Min 2 réponses');return false;}
            if(!questionForm.answers.some(a=>a.is_correct)){alert('Cochez une bonne réponse');return false;}
            return true;
          case'text':return questionForm.keywords.length>0||(alert('Ajoutez un mot-clé'),false);
          case'matching':return(questionForm.pairs||[]).filter(p=>p.left.trim()&&p.right.trim()).length>=2||(alert('Min 2 paires'),false);
          case'ordering':return(questionForm.items||[]).filter(i=>i.trim()).length>=2||(alert('Min 2 éléments'),false);
          default:return true;
        }
      };
      
      const prepareAnswersData=()=>{
        switch(questionForm.question_type){
          case'matching':return(questionForm.pairs||[]).filter(p=>p.left&&p.right).map((p,i)=>({answer_text:JSON.stringify(p),is_correct:true,sort_order:i}));
          case'ordering':return(questionForm.items||[]).filter(i=>i).map((item,i)=>({answer_text:item,is_correct:true,sort_order:i}));
          case'text':return(questionForm.keywords||[]).map((kw,i)=>({answer_text:kw,is_correct:true,sort_order:i}));
          default:return questionForm.answers.filter(a=>a.text.trim()).map((a,i)=>({answer_text:a.text.trim(),is_correct:a.is_correct,sort_order:i}));
        }
      };
      
      const saveQuestion=async()=>{
        if(!validateQuestion())return;
        setSaving(true);
        try{
          const data={
            question_text:questionForm.question_text.trim(),
            question_type:questionForm.question_type,
            category_id:questionForm.category_id||null,
            theme_id:questionForm.theme_id||null,
            sub_theme_id:questionForm.sub_theme_id||null,
            difficulty:questionForm.difficulty||'medium',
            points:questionForm.points||1,
            time_limit:questionForm.time_limit||0,
            image_url:questionForm.image_url||null,
            audio_url:questionForm.audio_url||null,
            vimeo_id:questionForm.vimeo_id||null,
            feedback_correct:questionForm.feedback_correct||null,
            feedback_incorrect:questionForm.feedback_incorrect||null
          };
          
          let qId;
          if(editingQuestion){
            await supabase.from('question_bank').update(data).eq('id',editingQuestion.id);
            await supabase.from('question_bank_answers').delete().eq('question_id',editingQuestion.id);
            qId=editingQuestion.id;
          }else{
            const{data:q}=await supabase.from('question_bank').insert(data).select().single();
            qId=q.id;
          }
          
          const answers=prepareAnswersData().map(a=>({...a,question_id:qId}));
          if(answers.length>0)await supabase.from('question_bank_answers').insert(answers);
          
          await load();
          setQuestionForm(getEmptyQuestion());
          setEditingQuestion(null);
        }catch(err){alert('Erreur: '+err.message);}
        setSaving(false);
      };
      
      const editQuestion=(q)=>{
        const ans=q.question_bank_answers||[];
        let form={...getEmptyQuestion(q.question_type),
          question_text:q.question_text,category_id:q.category_id||'',theme_id:q.theme_id||'',sub_theme_id:q.sub_theme_id||'',
          difficulty:q.difficulty||'medium',points:q.points||1,time_limit:q.time_limit||0,
          image_url:q.image_url||'',audio_url:q.audio_url||'',vimeo_id:q.vimeo_id||'',
          feedback_correct:q.feedback_correct||'',feedback_incorrect:q.feedback_incorrect||''
        };
        switch(q.question_type){
          case'matching':form.pairs=ans.map(a=>{try{return JSON.parse(a.answer_text);}catch{return{left:'',right:''};}});break;
          case'ordering':form.items=ans.sort((a,b)=>a.sort_order-b.sort_order).map(a=>a.answer_text);break;
          case'text':form.keywords=ans.map(a=>a.answer_text);form.answers=[{text:'',is_correct:true}];break;
          default:form.answers=ans.map(a=>({text:a.answer_text,is_correct:a.is_correct}));
        }
        setQuestionForm(form);
        setEditingQuestion(q);
      };
      
      const deleteQuestion=async(id)=>{
        if(!confirm('Supprimer cette question ?'))return;
        await supabase.from('question_bank').delete().eq('id',id);
        setBankQuestions(prev=>prev.filter(q=>q.id!==id));
        if(editingQuestion?.id===id){setEditingQuestion(null);setQuestionForm(getEmptyQuestion());}
      };
      
      const cancelEdit=()=>{setQuestionForm(getEmptyQuestion());setEditingQuestion(null);};
      
      // ========== FILTRAGE QUESTIONS ==========
      const isFilterActive=()=>{
        return Object.values(filterChecked.categories).some(v=>v)||Object.values(filterChecked.themes).some(v=>v)||Object.values(filterChecked.subThemes).some(v=>v)||filterDifficulty!=='all'||filterSearch;
      };
      
      const clearFilters=()=>{
        setFilterChecked({categories:{},themes:{},subThemes:{}});
        setFilterDifficulty('all');
        setFilterSearch('');
      };
      
      const toggleFilterCategory=(catId)=>{
        const checked=!filterChecked.categories[catId];
        const newCats={...filterChecked.categories,[catId]:checked};
        const newThemes={...filterChecked.themes};
        const newSubs={...filterChecked.subThemes};
        // Si on coche/décoche une catégorie, on coche/décoche ses thèmes et sous-thèmes
        getThemesForCategory(catId).forEach(t=>{
          newThemes[t.id]=checked;
          getSubThemesForTheme(t.id).forEach(st=>{newSubs[st.id]=checked;});
        });
        setFilterChecked({categories:newCats,themes:newThemes,subThemes:newSubs});
      };
      
      const toggleFilterTheme=(themeId)=>{
        const checked=!filterChecked.themes[themeId];
        const newThemes={...filterChecked.themes,[themeId]:checked};
        const newSubs={...filterChecked.subThemes};
        getSubThemesForTheme(themeId).forEach(st=>{newSubs[st.id]=checked;});
        setFilterChecked({...filterChecked,themes:newThemes,subThemes:newSubs});
      };
      
      const toggleFilterSubTheme=(stId)=>{
        setFilterChecked({...filterChecked,subThemes:{...filterChecked.subThemes,[stId]:!filterChecked.subThemes[stId]}});
      };
      
      const filteredQuestions=useMemo(()=>{
        return bankQuestions.filter(q=>{
          // Recherche texte
          if(filterSearch&&!q.question_text.toLowerCase().includes(filterSearch.toLowerCase()))return false;
          // Difficulté
          if(filterDifficulty!=='all'&&q.difficulty!==filterDifficulty)return false;
          // Hiérarchie (si au moins un filtre actif)
          const hasHierarchyFilter=Object.values(filterChecked.categories).some(v=>v)||Object.values(filterChecked.themes).some(v=>v)||Object.values(filterChecked.subThemes).some(v=>v);
          if(hasHierarchyFilter){
            // La question passe si son sub_theme, theme ou category est coché
            if(q.sub_theme_id&&filterChecked.subThemes[q.sub_theme_id])return true;
            if(q.theme_id&&filterChecked.themes[q.theme_id])return true;
            if(q.category_id&&filterChecked.categories[q.category_id])return true;
            return false;
          }
          return true;
        });
      },[bankQuestions,filterSearch,filterDifficulty,filterChecked]);
      
      // ========== STATISTIQUES ==========
      const stats=useMemo(()=>{
        const total=bankQuestions.length;
        const byCat={};categories.forEach(c=>{byCat[c.id]={name:c.name,count:0};});
        const orphans=bankQuestions.filter(q=>!q.category_id);
        const withTheme=bankQuestions.filter(q=>q.theme_id).length;
        const withSubTheme=bankQuestions.filter(q=>q.sub_theme_id).length;
        bankQuestions.forEach(q=>{if(q.category_id&&byCat[q.category_id])byCat[q.category_id].count++;});
        return{total,byCat:Object.values(byCat),orphans:orphans.length,withTheme,withSubTheme,catCount:categories.length,themeCount:themes.length,subThemeCount:subThemes.length};
      },[bankQuestions,categories,themes,subThemes]);
      
      // ========== EXPORT/IMPORT EXCEL ==========
      const exportBankTemplate=()=>{
        const wb=XLSX.utils.book_new();
        const data=[
          ['Question','Type','Catégorie','Thème','Sous-thème','Difficulté','Points','Temps(sec)','Réponse 1','Correct 1','Réponse 2','Correct 2','Réponse 3','Correct 3','Réponse 4','Correct 4','Feedback correct','Feedback incorrect'],
          ['Quelle est la capitale ?','single','Géographie','Europe','Capitales','medium','1','0','Paris','TRUE','Lyon','FALSE','','','','','Bravo !','Réponse: Paris'],
        ];
        const ws=XLSX.utils.aoa_to_sheet(data);
        XLSX.utils.book_append_sheet(wb,ws,'Template');
        XLSX.writeFile(wb,'template_questions.xlsx');
      };
      
      const exportBank=()=>{
        if(bankQuestions.length===0){alert('Aucune question');return;}
        const data=[['Question','Type','Catégorie','Thème','Sous-thème','Difficulté','Points','Temps','R1','C1','R2','C2','R3','C3','R4','C4','Feedback+','Feedback-']];
        bankQuestions.forEach(q=>{
          const ans=q.question_bank_answers||[];
          const row=[q.question_text,q.question_type,getCategoryName(q.category_id),getThemeName(q.theme_id),getSubThemeName(q.sub_theme_id),q.difficulty,q.points,q.time_limit];
          for(let i=0;i<4;i++)row.push(ans[i]?.answer_text||'',ans[i]?.is_correct?'TRUE':'FALSE');
          row.push(q.feedback_correct||'',q.feedback_incorrect||'');
          data.push(row);
        });
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(data),'Questions');
        XLSX.writeFile(wb,`banque_${new Date().toISOString().split('T')[0]}.xlsx`);
      };
      
      const importFromExcel=async(e)=>{
        const file=e.target.files[0];if(!file)return;
        const reader=new FileReader();
        reader.onload=async(evt)=>{
          try{
            const wb=XLSX.read(new Uint8Array(evt.target.result),{type:'array'});
            const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
            let imported=0;
            for(let i=1;i<rows.length;i++){
              const r=rows[i];if(!r[0])continue;
              // Auto-créer catégorie/thème/sous-thème si besoin
              let catId=null,themeId=null,subThemeId=null;
              if(r[2]){
                let cat=categories.find(c=>c.name.toLowerCase()===r[2].toLowerCase());
                if(!cat){cat=await addCategory(r[2]);}
                catId=cat?.id;
                if(r[3]&&catId){
                  let th=themes.find(t=>t.name.toLowerCase()===r[3].toLowerCase()&&t.category_id===catId);
                  if(!th){th=await addTheme(r[3],catId);}
                  themeId=th?.id;
                  if(r[4]&&themeId){
                    let st=subThemes.find(s=>s.name.toLowerCase()===r[4].toLowerCase()&&s.theme_id===themeId);
                    if(!st){st=await addSubTheme(r[4],themeId);}
                    subThemeId=st?.id;
                  }
                }
              }
              const{data:q}=await supabase.from('question_bank').insert({
                question_text:r[0],question_type:r[1]||'single',category_id:catId,theme_id:themeId,sub_theme_id:subThemeId,
                difficulty:r[5]||'medium',points:parseInt(r[6])||1,time_limit:parseInt(r[7])||0,
                feedback_correct:r[16]||null,feedback_incorrect:r[17]||null
              }).select().single();
              if(q){
                const answers=[];
                for(let j=0;j<4;j++){if(r[8+j*2])answers.push({question_id:q.id,answer_text:String(r[8+j*2]),is_correct:String(r[9+j*2]).toUpperCase()==='TRUE',sort_order:j});}
                if(answers.length)await supabase.from('question_bank_answers').insert(answers);
                imported++;
              }
            }
            alert(`${imported} question(s) importée(s)`);
            load();
          }catch(err){alert('Erreur: '+err.message);}
        };
        reader.readAsArrayBuffer(file);
        e.target.value='';
      };
      
      // ========== QUIZ ==========
      const openQuizModal=(quiz=null)=>{
        if(quiz){
          setEditingQuiz(quiz);
          setQuizForm({title:quiz.title,description:quiz.description||'',playlist_id:quiz.playlist_id||'',passing_score:quiz.passing_score||70,is_required:quiz.is_required||false,max_attempts:quiz.max_attempts||0,time_limit:quiz.time_limit||0,shuffle_questions:quiz.shuffle_questions||false,shuffle_answers:quiz.shuffle_answers||false,show_answers:quiz.show_answers!==false,show_feedback:quiz.show_feedback!==false,allow_review:quiz.allow_review!==false});
          supabase.from('quiz_questions').select('*,quiz_answers(*)').eq('quiz_id',quiz.id).order('sort_order').then(({data})=>setQuizQuestions(data||[]));
        }else{
          setEditingQuiz(null);
          setQuizForm({title:'',description:'',playlist_id:'',passing_score:70,is_required:false,max_attempts:0,time_limit:0,shuffle_questions:false,shuffle_answers:false,show_answers:true,show_feedback:true,allow_review:true});
          setQuizQuestions([]);
        }
        setSelectedQuestions([]);
        setQuizModal(true);
      };
      
      const saveQuiz=async()=>{
        if(!quizForm.title.trim()){alert('Titre requis');return;}
        setSaving(true);
        try{
          const payload={...quizForm,passing_score:parseInt(quizForm.passing_score)||70};
          let quizId;
          if(editingQuiz){
            await supabase.from('quizzes').update(payload).eq('id',editingQuiz.id);
            quizId=editingQuiz.id;
            await supabase.from('quiz_questions').delete().eq('quiz_id',quizId);
          }else{
            const{data:nq}=await supabase.from('quizzes').insert(payload).select().single();
            quizId=nq.id;
          }
          for(let i=0;i<quizQuestions.length;i++){
            const q=quizQuestions[i];
            const isBank=!!q.question_bank_answers;
            const{data:newQ}=await supabase.from('quiz_questions').insert({
              quiz_id:quizId,question_text:q.question_text,question_type:q.question_type,sort_order:i,
              points:q.points||1,time_limit:q.time_limit||0,image_url:q.image_url,audio_url:q.audio_url,vimeo_id:q.vimeo_id,
              feedback_correct:q.feedback_correct,feedback_incorrect:q.feedback_incorrect
            }).select().single();
            const answers=isBank?q.question_bank_answers:q.quiz_answers;
            if(newQ&&answers?.length)await supabase.from('quiz_answers').insert(answers.map((a,j)=>({question_id:newQ.id,answer_text:a.answer_text,is_correct:a.is_correct,sort_order:j})));
          }
          await load();
          setQuizModal(false);
        }catch(err){alert('Erreur: '+err.message);}
        setSaving(false);
      };
      
      const deleteQuiz=async(id)=>{
        if(!confirm('Supprimer ce quiz ?'))return;
        await supabase.from('quizzes').delete().eq('id',id);
        setQuizzes(prev=>prev.filter(q=>q.id!==id));
      };
      
      const addQuestionsToQuiz=()=>{
        const toAdd=bankQuestions.filter(q=>selectedQuestions.includes(q.id)&&!quizQuestions.some(qq=>qq.id===q.id||qq.bank_id===q.id));
        setQuizQuestions([...quizQuestions,...toAdd.map(q=>({...q,bank_id:q.id}))]);
        setSelectedQuestions([]);
      };
      
      const removeFromQuiz=(idx)=>setQuizQuestions(quizQuestions.filter((_,i)=>i!==idx));
      
      // Pioche intelligente
      const executePicker=()=>{
        let pool=bankQuestions.filter(q=>!quizQuestions.some(qq=>qq.id===q.id||qq.bank_id===q.id));
        if(pickerConfig.mode==='branch'){
          if(pickerConfig.themeId){
            pool=pool.filter(q=>q.theme_id===pickerConfig.themeId);
          }else if(pickerConfig.categoryId){
            pool=pool.filter(q=>q.category_id===pickerConfig.categoryId);
          }
        }else if(pickerConfig.mode==='balance'){
          // Équilibrage par catégorie
          const perCat=Math.ceil(pickerConfig.count/categories.length);
          let picked=[];
          categories.forEach(cat=>{
            const catPool=pool.filter(q=>q.category_id===cat.id).sort(()=>Math.random()-0.5);
            picked=[...picked,...catPool.slice(0,perCat)];
          });
          pool=picked;
        }
        const shuffled=[...pool].sort(()=>Math.random()-0.5);
        const picked=shuffled.slice(0,Math.min(pickerConfig.count,shuffled.length));
        setQuizQuestions([...quizQuestions,...picked.map(q=>({...q,bank_id:q.id}))]);
        setShowPickerModal(false);
      };
      
      // Prévisualisation
      const openPreview=(quiz)=>{
        supabase.from('quiz_questions').select('*,quiz_answers(*)').eq('quiz_id',quiz.id).order('sort_order').then(({data})=>{
          let qs=data||[];
          if(quiz.shuffle_questions)qs=[...qs].sort(()=>Math.random()-0.5);
          if(quiz.shuffle_answers)qs=qs.map(q=>({...q,quiz_answers:(q.quiz_answers||[]).sort(()=>Math.random()-0.5)}));
          setPreviewQuiz({...quiz,questions:qs});
          setPreviewAnswers({});
          setPreviewSubmitted(false);
        });
      };
      
      const calcScore=()=>{
        if(!previewQuiz)return{score:0,total:0,pct:0};
        let score=0,total=0;
        previewQuiz.questions.forEach(q=>{
          const pts=q.points||1;total+=pts;
          const correct=(q.quiz_answers||[]).filter(a=>a.is_correct).map(a=>a.id);
          const ans=previewAnswers[q.id];
          if(q.question_type==='single'||q.question_type==='true_false'){if(correct.includes(ans))score+=pts;}
          else if(q.question_type==='multiple'){const arr=ans||[];if(correct.every(id=>arr.includes(id))&&arr.every(id=>correct.includes(id)))score+=pts;}
        });
        return{score,total,pct:total>0?Math.round(score/total*100):0};
      };
      
      // ========== RENDU ==========
      if(!can('manage_playlists')&&profile?.role!=='trainer')return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6">
          <h1 className="text-2xl font-bold">Quiz & Banque de questions</h1>
          <div className="flex gap-2">
            {activeTab==='questions'&&<>
              <Button variant="secondary" size="sm" icon="Download" onClick={exportBankTemplate}>Template</Button>
              <Button variant="secondary" size="sm" icon="FileDown" onClick={exportBank}>Exporter</Button>
              <label className="cursor-pointer"><span className="inline-flex items-center gap-2 px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium"><Icon name="Upload" size={16}/>Importer</span><input type="file" accept=".xlsx,.xls" className="hidden" onChange={importFromExcel}/></label>
              <Button variant="secondary" size="sm" icon="BarChart2" onClick={()=>setShowStats(true)}>Stats</Button>
            </>}
          </div>
        </div>
        
        <Tabs tabs={[{id:'categories',label:'Catégories',icon:'FolderTree'},{id:'questions',label:`Questions (${bankQuestions.length})`,icon:'Database'},{id:'quizzes',label:`Quiz (${quizzes.length})`,icon:'HelpCircle'}]} active={activeTab} onChange={setActiveTab}/>
        
        {/* ==================== ONGLET CATÉGORIES ==================== */}
        {activeTab==='categories'&&(
          <Card className="p-6">
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-semibold text-lg">Arborescence des catégories</h3>
              <div className="text-sm text-gray-400">{stats.catCount} catégories • {stats.themeCount} thèmes • {stats.subThemeCount} sous-thèmes</div>
            </div>
            
            {/* Ajouter catégorie */}
            <div className="flex gap-2 mb-4">
              <Input className="flex-1" placeholder="Nouvelle catégorie..." value={quickAddValue} onChange={e=>setQuickAddValue(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&quickAddValue.trim()){addCategory(quickAddValue);setQuickAddValue('');}}}/>
              <Button icon="Plus" onClick={()=>{if(quickAddValue.trim()){addCategory(quickAddValue);setQuickAddValue('');}}}>Catégorie</Button>
            </div>
            
            {categories.length===0?<p className="text-gray-500 text-center py-8">Aucune catégorie. Créez-en une pour organiser vos questions.</p>:(
              <div className="space-y-2">
                {categories.map(cat=>{
                  const catThemes=getThemesForCategory(cat.id);
                  const isExpanded=expandedCats[cat.id];
                  const catCount=countQuestionsForCategory(cat.id);
                  return<div key={cat.id} className="border border-gray-700 rounded-lg overflow-hidden">
                    {/* Catégorie header */}
                    <div className="flex items-center gap-2 p-3 bg-gray-800 hover:bg-gray-700 cursor-pointer" onClick={()=>setExpandedCats({...expandedCats,[cat.id]:!isExpanded})}>
                      <Icon name={isExpanded?'ChevronDown':'ChevronRight'} size={18} className="text-gray-400"/>
                      <Icon name="Folder" size={18} className="text-indigo-400"/>
                      <span className="font-medium flex-1">{cat.name}</span>
                      <span className="text-sm text-gray-400">{catCount} questions • {catThemes.length} thèmes</span>
                      <button onClick={e=>{e.stopPropagation();deleteCategory(cat.id);}} className="p-1 hover:bg-red-500/20 rounded"><Icon name="Trash2" size={14} className="text-red-400"/></button>
                    </div>
                    
                    {/* Thèmes */}
                    {isExpanded&&(
                      <div className="p-2 pl-8 space-y-2 bg-gray-800/50">
                        {catThemes.map(theme=>{
                          const themeSubs=getSubThemesForTheme(theme.id);
                          const themeExpanded=expandedThemes[theme.id];
                          const themeCount=countQuestionsForTheme(theme.id);
                          return<div key={theme.id} className="border border-gray-600 rounded-lg overflow-hidden">
                            <div className="flex items-center gap-2 p-2 bg-gray-700 hover:bg-gray-600 cursor-pointer" onClick={()=>setExpandedThemes({...expandedThemes,[theme.id]:!themeExpanded})}>
                              <Icon name={themeExpanded?'ChevronDown':'ChevronRight'} size={16} className="text-gray-400"/>
                              <Icon name="Tag" size={16} className="text-purple-400"/>
                              <span className="flex-1">{theme.name}</span>
                              <span className="text-xs text-gray-400">{themeCount} q • {themeSubs.length} sous</span>
                              <button onClick={e=>{e.stopPropagation();deleteTheme(theme.id);}} className="p-1 hover:bg-red-500/20 rounded"><Icon name="X" size={12} className="text-red-400"/></button>
                            </div>
                            
                            {themeExpanded&&(
                              <div className="p-2 pl-6 space-y-1 bg-gray-700/50">
                                {themeSubs.map(st=>(
                                  <div key={st.id} className="flex items-center gap-2 p-1.5 rounded hover:bg-gray-600">
                                    <Icon name="Circle" size={8} className="text-cyan-400"/>
                                    <span className="flex-1 text-sm">{st.name}</span>
                                    <span className="text-xs text-gray-500">{countQuestionsForSubTheme(st.id)} q</span>
                                    <button onClick={()=>deleteSubTheme(st.id)} className="p-1 hover:bg-red-500/20 rounded"><Icon name="X" size={12} className="text-red-400"/></button>
                                  </div>
                                ))}
                                <div className="flex gap-2 mt-1">
                                  <Input size="sm" placeholder="+ Sous-thème..." onKeyDown={e=>{if(e.key==='Enter'&&e.target.value.trim()){addSubTheme(e.target.value,theme.id);e.target.value='';}}}/>
                                </div>
                              </div>
                            )}
                          </div>;
                        })}
                        <div className="flex gap-2 mt-2">
                          <Input size="sm" placeholder="+ Nouveau thème..." onKeyDown={e=>{if(e.key==='Enter'&&e.target.value.trim()){addTheme(e.target.value,cat.id);e.target.value='';}}}/>
                        </div>
                      </div>
                    )}
                  </div>;
                })}
              </div>
            )}
          </Card>
        )}
        
        {/* ==================== ONGLET QUESTIONS ==================== */}
        {activeTab==='questions'&&(
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* Colonne gauche : Liste */}
            <div className="space-y-4">
              {/* Barre de filtres */}
              <Card className="p-3">
                <div className="flex items-center gap-2">
                  <Input size="sm" icon="Search" placeholder="Rechercher..." value={filterSearch} onChange={e=>setFilterSearch(e.target.value)} className="flex-1"/>
                  <Select size="sm" value={filterDifficulty} onChange={e=>setFilterDifficulty(e.target.value)} options={[{value:'all',label:'Difficulté'},...DIFFICULTIES.map(d=>({value:d.value,label:d.label}))]}/>
                  <Button size="sm" variant={showFilterPanel?'primary':'secondary'} icon="Filter" onClick={()=>setShowFilterPanel(!showFilterPanel)}>{isFilterActive()?'Filtres actifs':'Filtres'}</Button>
                  {isFilterActive()&&<Button size="sm" variant="ghost" icon="X" onClick={clearFilters}/>}
                </div>
                
                {/* Panel filtres arborescence */}
                {showFilterPanel&&(
                  <div className="mt-3 p-3 bg-gray-700/50 rounded-lg max-h-60 overflow-y-auto">
                    <p className="text-xs text-gray-400 mb-2">Cocher les catégories/thèmes à afficher :</p>
                    {categories.map(cat=>{
                      const catThemes=getThemesForCategory(cat.id);
                      return<div key={cat.id} className="mb-2">
                        <label className="flex items-center gap-2 cursor-pointer hover:bg-gray-600 p-1 rounded">
                          <input type="checkbox" checked={!!filterChecked.categories[cat.id]} onChange={()=>toggleFilterCategory(cat.id)} className="w-4 h-4 rounded"/>
                          <Icon name="Folder" size={14} className="text-indigo-400"/>
                          <span className="text-sm">{cat.name}</span>
                          <span className="text-xs text-gray-500">({countQuestionsForCategory(cat.id)})</span>
                        </label>
                        <div className="ml-6">
                          {catThemes.map(th=>{
                            const themeSubs=getSubThemesForTheme(th.id);
                            return<div key={th.id}>
                              <label className="flex items-center gap-2 cursor-pointer hover:bg-gray-600 p-1 rounded">
                                <input type="checkbox" checked={!!filterChecked.themes[th.id]} onChange={()=>toggleFilterTheme(th.id)} className="w-3 h-3 rounded"/>
                                <span className="text-xs">{th.name}</span>
                                <span className="text-xs text-gray-500">({countQuestionsForTheme(th.id)})</span>
                              </label>
                              <div className="ml-5">
                                {themeSubs.map(st=>(
                                  <label key={st.id} className="flex items-center gap-2 cursor-pointer hover:bg-gray-600 p-0.5 rounded">
                                    <input type="checkbox" checked={!!filterChecked.subThemes[st.id]} onChange={()=>toggleFilterSubTheme(st.id)} className="w-3 h-3 rounded"/>
                                    <span className="text-xs text-gray-400">{st.name} ({countQuestionsForSubTheme(st.id)})</span>
                                  </label>
                                ))}
                              </div>
                            </div>;
                          })}
                        </div>
                      </div>;
                    })}
                  </div>
                )}
              </Card>
              
              {/* Liste des questions */}
              <div className="space-y-2 max-h-[calc(100vh-350px)] overflow-y-auto">
                {filteredQuestions.length===0?<Card className="p-8 text-center text-gray-500">Aucune question{isFilterActive()?' (filtres actifs)':''}</Card>:(
                  filteredQuestions.map(q=>(
                    <Card key={q.id} className={`p-3 cursor-pointer hover:border-indigo-500 ${editingQuestion?.id===q.id?'border-indigo-500':''}`} onClick={()=>editQuestion(q)}>
                      <div className="flex flex-wrap gap-1 mb-1">
                        <span className="px-2 py-0.5 bg-gray-600 rounded text-xs">{QUESTION_TYPES[q.question_type]?.label}</span>
                        {q.category_id&&<span className="px-2 py-0.5 bg-indigo-500/20 text-indigo-400 rounded text-xs">{getCategoryName(q.category_id)}</span>}
                        {q.theme_id&&<span className="px-2 py-0.5 bg-purple-500/20 text-purple-400 rounded text-xs">{getThemeName(q.theme_id)}</span>}
                        <span className={`px-2 py-0.5 rounded text-xs ${q.difficulty==='easy'?'bg-green-500/20 text-green-400':q.difficulty==='hard'?'bg-red-500/20 text-red-400':'bg-yellow-500/20 text-yellow-400'}`}>{DIFFICULTIES.find(d=>d.value===q.difficulty)?.label}</span>
                        {q.image_url&&<Icon name="Image" size={12} className="text-purple-400"/>}
                        {q.audio_url&&<Icon name="Music" size={12} className="text-pink-400"/>}
                        {q.vimeo_id&&<Icon name="Video" size={12} className="text-cyan-400"/>}
                      </div>
                      <p className="text-sm truncate">{q.question_text}</p>
                    </Card>
                  ))
                )}
              </div>
            </div>
            
            {/* Colonne droite : Formulaire */}
            <Card className="p-4 h-fit sticky top-4 max-h-[calc(100vh-200px)] overflow-y-auto">
              <div className="flex items-center justify-between mb-4">
                <h3 className="font-semibold">{editingQuestion?'Modifier':'Nouvelle question'}</h3>
                {editingQuestion&&<Button size="sm" variant="ghost" icon="X" onClick={cancelEdit}/>}
              </div>
              
              {/* Médias en haut */}
              <div className="mb-4 p-3 bg-gray-700/50 rounded-lg">
                <div className="grid grid-cols-2 gap-3 mb-3">
                  <div>
                    <label className="text-xs text-gray-400 mb-1 block">Image</label>
                    {!questionForm.image_url?(
                      <label className="flex flex-col items-center justify-center h-28 border-2 border-dashed border-gray-600 rounded-lg cursor-pointer hover:border-indigo-500">
                        <Icon name="Upload" size={20} className="text-gray-400"/>
                        <span className="text-xs text-gray-400 mt-1">{uploadingMedia?'Upload...':'Choisir'}</span>
                        <input type="file" accept="image/*" className="hidden" onChange={handleImageChange} disabled={uploadingMedia}/>
                      </label>
                    ):(
                      <div className="relative h-28">
                        <img src={questionForm.image_url} alt="" className="w-full h-full object-cover rounded-lg"/>
                        <button onClick={()=>setQuestionForm({...questionForm,image_url:''})} className="absolute top-1 right-1 p-1 bg-red-500 rounded-full"><Icon name="X" size={10}/></button>
                      </div>
                    )}
                  </div>
                  <div>
                    <label className="text-xs text-gray-400 mb-1 block">Vidéo Vimeo</label>
                    {!questionForm.vimeo_id?(
                      <Input size="sm" placeholder="URL ou ID" onChange={e=>setQuestionForm({...questionForm,vimeo_id:extractVimeoId(e.target.value)})} className="h-28"/>
                    ):(
                      <div className="relative h-28">
                        <iframe src={`https://player.vimeo.com/video/${questionForm.vimeo_id}`} className="w-full h-full rounded-lg" frameBorder="0"/>
                        <button onClick={()=>setQuestionForm({...questionForm,vimeo_id:''})} className="absolute top-1 right-1 p-1 bg-red-500 rounded-full"><Icon name="X" size={10}/></button>
                      </div>
                    )}
                  </div>
                </div>
                <div>
                  <label className="text-xs text-gray-400 mb-1 block">Audio</label>
                  {!questionForm.audio_url?(
                    <label className="flex items-center justify-center gap-2 p-2 border-2 border-dashed border-gray-600 rounded-lg cursor-pointer hover:border-indigo-500">
                      <Icon name="Music" size={16} className="text-gray-400"/>
                      <span className="text-xs text-gray-400">{uploadingMedia?'Upload...':'Choisir un audio'}</span>
                      <input type="file" accept="audio/*" className="hidden" onChange={handleAudioChange} disabled={uploadingMedia}/>
                    </label>
                  ):(
                    <div className="flex items-center gap-2 p-2 bg-gray-600 rounded-lg">
                      <audio src={questionForm.audio_url} controls className="flex-1 h-8"/>
                      <button onClick={()=>setQuestionForm({...questionForm,audio_url:''})} className="p-1 hover:bg-red-500/20 rounded"><Icon name="X" size={14} className="text-red-400"/></button>
                    </div>
                  )}
                </div>
              </div>
              
              {/* Classification avec + Créer */}
              <div className="grid grid-cols-3 gap-2 mb-4">
                <div className="flex gap-1">
                  <Select size="sm" className="flex-1" value={questionForm.category_id} onChange={e=>setQuestionForm({...questionForm,category_id:e.target.value,theme_id:'',sub_theme_id:''})} options={[{value:'',label:'Catégorie'},...categories.map(c=>({value:c.id,label:c.name}))]}/>
                  <button onClick={()=>setQuickAdd({type:'category'})} className="px-2 bg-gray-700 hover:bg-gray-600 rounded text-indigo-400" title="Créer"><Icon name="Plus" size={14}/></button>
                </div>
                <div className="flex gap-1">
                  <Select size="sm" className="flex-1" value={questionForm.theme_id} onChange={e=>setQuestionForm({...questionForm,theme_id:e.target.value,sub_theme_id:''})} options={[{value:'',label:'Thème'},...getThemesForCategory(questionForm.category_id).map(t=>({value:t.id,label:t.name}))]} disabled={!questionForm.category_id}/>
                  <button onClick={()=>{if(questionForm.category_id)setQuickAdd({type:'theme',parentId:questionForm.category_id});}} className={`px-2 rounded ${questionForm.category_id?'bg-gray-700 hover:bg-gray-600 text-indigo-400':'bg-gray-800 text-gray-600'}`} title="Créer" disabled={!questionForm.category_id}><Icon name="Plus" size={14}/></button>
                </div>
                <div className="flex gap-1">
                  <Select size="sm" className="flex-1" value={questionForm.sub_theme_id} onChange={e=>setQuestionForm({...questionForm,sub_theme_id:e.target.value})} options={[{value:'',label:'Sous-thème'},...getSubThemesForTheme(questionForm.theme_id).map(st=>({value:st.id,label:st.name}))]} disabled={!questionForm.theme_id}/>
                  <button onClick={()=>{if(questionForm.theme_id)setQuickAdd({type:'subtheme',parentId:questionForm.theme_id});}} className={`px-2 rounded ${questionForm.theme_id?'bg-gray-700 hover:bg-gray-600 text-indigo-400':'bg-gray-800 text-gray-600'}`} title="Créer" disabled={!questionForm.theme_id}><Icon name="Plus" size={14}/></button>
                </div>
              </div>
              
              {/* Type et difficulté */}
              <div className="flex gap-2 mb-4">
                <Select size="sm" className="flex-1" value={questionForm.question_type} onChange={e=>changeQuestionType(e.target.value)} options={Object.entries(QUESTION_TYPES).map(([k,v])=>({value:k,label:v.label}))}/>
                <Select size="sm" value={questionForm.difficulty} onChange={e=>setQuestionForm({...questionForm,difficulty:e.target.value})} options={DIFFICULTIES.map(d=>({value:d.value,label:d.label}))}/>
              </div>
              
              {/* Question */}
              <textarea value={questionForm.question_text} onChange={e=>setQuestionForm({...questionForm,question_text:e.target.value})} rows={2} className="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white mb-4" placeholder="Votre question..."/>
              
              {/* Réponses selon type */}
              <div className="mb-4 max-h-40 overflow-y-auto">
                {(questionForm.question_type==='single'||questionForm.question_type==='multiple')&&(
                  <div className="space-y-2">
                    {questionForm.answers.map((a,i)=>(
                      <div key={i} className="flex items-center gap-2">
                        <input type={questionForm.question_type==='single'?'radio':'checkbox'} checked={a.is_correct} onChange={()=>updateAnswer(i,'is_correct',!a.is_correct)} className="w-4 h-4"/>
                        <Input size="sm" className="flex-1" value={a.text} onChange={e=>updateAnswer(i,'text',e.target.value)} placeholder={`Réponse ${i+1}`}/>
                        {questionForm.answers.length>2&&<button onClick={()=>removeAnswerOption(i)} className="p-1 text-red-400"><Icon name="X" size={14}/></button>}
                      </div>
                    ))}
                    {questionForm.answers.length<8&&<Button size="sm" variant="ghost" icon="Plus" onClick={addAnswerOption}>Réponse</Button>}
                  </div>
                )}
                {questionForm.question_type==='true_false'&&(
                  <div className="flex gap-4">
                    {['Vrai','Faux'].map((l,i)=>(
                      <button key={i} onClick={()=>updateAnswer(i,'is_correct',true)} className={`flex-1 p-3 rounded-lg border ${questionForm.answers[i]?.is_correct?'border-green-500 bg-green-500/20':'border-gray-600'}`}>
                        <Icon name={i===0?'Check':'X'} size={20} className={`mx-auto ${questionForm.answers[i]?.is_correct?'text-green-400':'text-gray-500'}`}/>
                        <span className="block text-center text-sm mt-1">{l}</span>
                      </button>
                    ))}
                  </div>
                )}
                {questionForm.question_type==='text'&&(
                  <div>
                    <div className="flex gap-2 mb-2">
                      <Input size="sm" className="flex-1" placeholder="Mot-clé..." value={questionForm.answers[0]?.text||''} onChange={e=>updateAnswer(0,'text',e.target.value)} onKeyDown={e=>e.key==='Enter'&&addKeyword()}/>
                      <Button size="sm" icon="Plus" onClick={addKeyword}>Ajouter</Button>
                    </div>
                    <div className="flex flex-wrap gap-1">{questionForm.keywords.map(kw=><span key={kw} className="px-2 py-1 bg-indigo-500/20 text-indigo-300 rounded-full text-xs flex items-center gap-1">{kw}<button onClick={()=>removeKeyword(kw)}><Icon name="X" size={10}/></button></span>)}</div>
                  </div>
                )}
                {questionForm.question_type==='matching'&&(
                  <div className="space-y-2">
                    {(questionForm.pairs||[]).map((p,i)=>(
                      <div key={i} className="flex items-center gap-2">
                        <Input size="sm" className="flex-1" value={p.left} onChange={e=>updatePair(i,'left',e.target.value)} placeholder="Élément"/>
                        <Icon name="ArrowRight" size={14}/>
                        <Input size="sm" className="flex-1" value={p.right} onChange={e=>updatePair(i,'right',e.target.value)} placeholder="Correspond."/>
                        {(questionForm.pairs||[]).length>2&&<button onClick={()=>removePair(i)} className="text-red-400"><Icon name="X" size={14}/></button>}
                      </div>
                    ))}
                    {(questionForm.pairs||[]).length<8&&<Button size="sm" variant="ghost" icon="Plus" onClick={addPair}>Paire</Button>}
                  </div>
                )}
                {questionForm.question_type==='ordering'&&(
                  <div className="space-y-2">
                    {(questionForm.items||[]).map((it,i)=>(
                      <div key={i} className="flex items-center gap-2">
                        <span className="w-6 h-6 bg-indigo-500/20 rounded flex items-center justify-center text-xs">{i+1}</span>
                        <Input size="sm" className="flex-1" value={it} onChange={e=>updateItem(i,e.target.value)} placeholder={`Étape ${i+1}`}/>
                        {(questionForm.items||[]).length>2&&<button onClick={()=>removeItem(i)} className="text-red-400"><Icon name="X" size={14}/></button>}
                      </div>
                    ))}
                    {(questionForm.items||[]).length<10&&<Button size="sm" variant="ghost" icon="Plus" onClick={addItem}>Étape</Button>}
                  </div>
                )}
              </div>
              
              {/* Options */}
              <div className="grid grid-cols-2 gap-2 mb-4">
                <Input size="sm" label="Points" type="number" min="1" value={questionForm.points} onChange={e=>setQuestionForm({...questionForm,points:parseInt(e.target.value)||1})}/>
                <Input size="sm" label="Temps (s)" type="number" min="0" value={questionForm.time_limit} onChange={e=>setQuestionForm({...questionForm,time_limit:parseInt(e.target.value)||0})}/>
              </div>
              
              {/* Feedback */}
              <div className="grid grid-cols-2 gap-2 mb-4">
                <div><label className="text-xs text-gray-400">Feedback ✓</label><textarea value={questionForm.feedback_correct} onChange={e=>setQuestionForm({...questionForm,feedback_correct:e.target.value})} rows={2} className="w-full px-2 py-1 bg-gray-700 border border-gray-600 rounded text-sm"/></div>
                <div><label className="text-xs text-gray-400">Feedback ✗</label><textarea value={questionForm.feedback_incorrect} onChange={e=>setQuestionForm({...questionForm,feedback_incorrect:e.target.value})} rows={2} className="w-full px-2 py-1 bg-gray-700 border border-gray-600 rounded text-sm"/></div>
              </div>
              
              <Button className="w-full" onClick={saveQuestion} loading={saving} disabled={uploadingMedia}>{editingQuestion?'Mettre à jour':'Créer'}</Button>
            </Card>
          </div>
        )}
        
        {/* ==================== ONGLET QUIZ ==================== */}
        {activeTab==='quizzes'&&(
          <div className="space-y-4">
            <div className="flex justify-end"><Button icon="Plus" onClick={()=>openQuizModal()}>Créer un quiz</Button></div>
            {quizzes.length===0?<Empty icon="HelpCircle" title="Aucun quiz"/>:(
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {quizzes.map(quiz=>(
                  <Card key={quiz.id} className="p-4">
                    <div className="flex items-start justify-between mb-2">
                      <h3 className="font-semibold">{quiz.title}</h3>
                      {quiz.is_required&&<span className="px-2 py-0.5 bg-red-500/20 text-red-400 rounded text-xs">Obligatoire</span>}
                    </div>
                    <div className="flex flex-wrap gap-2 text-xs text-gray-400 mb-3">
                      <span><Icon name="Target" size={12} className="inline mr-1"/>{quiz.passing_score}%</span>
                      {quiz.time_limit>0&&<span><Icon name="Clock" size={12} className="inline mr-1"/>{quiz.time_limit}min</span>}
                      {quiz.max_attempts>0&&<span>{quiz.max_attempts} tentatives</span>}
                    </div>
                    <div className="flex gap-2">
                      <Button size="sm" variant="ghost" icon="Play" onClick={()=>openPreview(quiz)}>Tester</Button>
                      <Button size="sm" variant="ghost" icon="Edit2" onClick={()=>openQuizModal(quiz)}/>
                      <Button size="sm" variant="ghost" icon="Trash2" className="text-red-400" onClick={()=>deleteQuiz(quiz.id)}/>
                    </div>
                  </Card>
                ))}
              </div>
            )}
          </div>
        )}
        
        {/* ==================== MODALS ==================== */}
        
        {/* Modal création rapide */}
        <Modal isOpen={!!quickAdd} onClose={()=>setQuickAdd(null)} title={`Créer ${quickAdd?.type==='category'?'une catégorie':quickAdd?.type==='theme'?'un thème':'un sous-thème'}`} size="sm">
          <Input autoFocus value={quickAddValue} onChange={e=>setQuickAddValue(e.target.value)} placeholder="Nom..." onKeyDown={e=>e.key==='Enter'&&handleQuickAdd()}/>
          <div className="flex gap-2 mt-4">
            <Button variant="secondary" onClick={()=>setQuickAdd(null)}>Annuler</Button>
            <Button className="flex-1" onClick={handleQuickAdd}>Créer</Button>
          </div>
        </Modal>
        
        {/* Modal Stats */}
        <Modal isOpen={showStats} onClose={()=>setShowStats(false)} title="Statistiques" size="lg">
          <div className="grid grid-cols-4 gap-4 mb-6">
            <div className="text-center p-4 bg-gray-700 rounded-lg"><p className="text-2xl font-bold text-indigo-400">{stats.total}</p><p className="text-sm text-gray-400">Questions</p></div>
            <div className="text-center p-4 bg-gray-700 rounded-lg"><p className="text-2xl font-bold text-purple-400">{stats.catCount}</p><p className="text-sm text-gray-400">Catégories</p></div>
            <div className="text-center p-4 bg-gray-700 rounded-lg"><p className="text-2xl font-bold text-cyan-400">{stats.themeCount}</p><p className="text-sm text-gray-400">Thèmes</p></div>
            <div className="text-center p-4 bg-gray-700 rounded-lg"><p className="text-2xl font-bold text-green-400">{stats.subThemeCount}</p><p className="text-sm text-gray-400">Sous-thèmes</p></div>
          </div>
          
          <h4 className="font-medium mb-3">Répartition par catégorie</h4>
          <div className="space-y-2 mb-6">
            {stats.byCat.map(c=>(
              <div key={c.name} className="flex items-center gap-3">
                <span className="w-32 truncate">{c.name}</span>
                <div className="flex-1 bg-gray-700 rounded-full h-4">
                  <div className="bg-indigo-500 h-4 rounded-full" style={{width:`${stats.total>0?c.count/stats.total*100:0}%`}}/>
                </div>
                <span className="text-sm text-gray-400 w-16 text-right">{c.count} ({stats.total>0?Math.round(c.count/stats.total*100):0}%)</span>
              </div>
            ))}
          </div>
          
          <h4 className="font-medium mb-3">Couverture</h4>
          <div className="space-y-2">
            <p className="text-sm text-gray-400"><span className={stats.orphans>0?'text-orange-400':'text-green-400'}>{stats.orphans}</span> questions sans catégorie</p>
            <p className="text-sm text-gray-400">{stats.total>0?Math.round(stats.withTheme/stats.total*100):0}% ont un thème</p>
            <p className="text-sm text-gray-400">{stats.total>0?Math.round(stats.withSubTheme/stats.total*100):0}% ont un sous-thème</p>
          </div>
        </Modal>
        
        {/* Modal Quiz */}
        <Modal isOpen={quizModal} onClose={()=>setQuizModal(false)} title={editingQuiz?'Modifier le quiz':'Créer un quiz'} size="xl">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* Gauche : Paramètres */}
            <div className="space-y-4">
              <Input label="Titre *" value={quizForm.title} onChange={e=>setQuizForm({...quizForm,title:e.target.value})}/>
              <Select label="Cours" value={quizForm.playlist_id} onChange={e=>setQuizForm({...quizForm,playlist_id:e.target.value})} options={[{value:'',label:'-- Aucun --'},...playlists.map(p=>({value:p.id,label:p.title}))]}/>
              <textarea value={quizForm.description} onChange={e=>setQuizForm({...quizForm,description:e.target.value})} rows={2} className="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg" placeholder="Description..."/>
              
              <div className="grid grid-cols-3 gap-3">
                <Input label="Score min (%)" type="number" value={quizForm.passing_score} onChange={e=>setQuizForm({...quizForm,passing_score:e.target.value})}/>
                <Input label="Tentatives" type="number" value={quizForm.max_attempts} onChange={e=>setQuizForm({...quizForm,max_attempts:e.target.value})} placeholder="0=∞"/>
                <Input label="Durée (min)" type="number" value={quizForm.time_limit} onChange={e=>setQuizForm({...quizForm,time_limit:e.target.value})} placeholder="0=∞"/>
              </div>
              
              <div className="grid grid-cols-2 gap-2 p-3 bg-gray-700/50 rounded-lg text-sm">
                <Checkbox label="Obligatoire" checked={quizForm.is_required} onChange={v=>setQuizForm({...quizForm,is_required:v})}/>
                <Checkbox label="Mélanger questions" checked={quizForm.shuffle_questions} onChange={v=>setQuizForm({...quizForm,shuffle_questions:v})}/>
                <Checkbox label="Mélanger réponses" checked={quizForm.shuffle_answers} onChange={v=>setQuizForm({...quizForm,shuffle_answers:v})}/>
                <Checkbox label="Afficher réponses" checked={quizForm.show_answers} onChange={v=>setQuizForm({...quizForm,show_answers:v})}/>
                <Checkbox label="Afficher feedback" checked={quizForm.show_feedback} onChange={v=>setQuizForm({...quizForm,show_feedback:v})}/>
                <Checkbox label="Mode révision" checked={quizForm.allow_review} onChange={v=>setQuizForm({...quizForm,allow_review:v})}/>
              </div>
              
              <div className="flex gap-2">
                <Button variant="secondary" onClick={()=>setQuizModal(false)}>Annuler</Button>
                <Button className="flex-1" onClick={saveQuiz} loading={saving}>Enregistrer</Button>
              </div>
            </div>
            
            {/* Droite : Questions */}
            <div className="space-y-4">
              <div className="flex items-center justify-between">
                <h4 className="font-medium">Questions ({quizQuestions.length})</h4>
                <Button size="sm" variant="secondary" icon="Shuffle" onClick={()=>setShowPickerModal(true)}>Pioche intelligente</Button>
              </div>
              
              {/* Questions du quiz (drag & drop) */}
              <div ref={sortableRef} className="space-y-1 max-h-36 overflow-y-auto p-2 bg-gray-700/30 rounded-lg min-h-[80px]">
                {quizQuestions.length===0?<p className="text-center text-gray-500 py-4 text-sm">Aucune question</p>:(
                  quizQuestions.map((q,i)=>(
                    <div key={q.id||i} className="flex items-center gap-2 p-2 bg-gray-700 rounded text-sm">
                      <Icon name="GripVertical" size={14} className="drag-handle cursor-move text-gray-500"/>
                      <span className="w-6 h-6 bg-indigo-500/20 text-indigo-400 rounded flex items-center justify-center text-xs">{i+1}</span>
                      <span className="flex-1 truncate">{q.question_text}</span>
                      <button onClick={()=>removeFromQuiz(i)} className="p-1 hover:bg-red-500/20 rounded"><Icon name="X" size={12} className="text-red-400"/></button>
                    </div>
                  ))
                )}
              </div>
              
              {/* Sélection depuis banque */}
              <div className="border-t border-gray-600 pt-3">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-sm font-medium">Banque de questions</span>
                  <Button size="sm" onClick={addQuestionsToQuiz} disabled={selectedQuestions.length===0}>Ajouter ({selectedQuestions.length})</Button>
                </div>
                <Input size="sm" icon="Search" placeholder="Rechercher..." className="mb-2"/>
                <div className="space-y-1 max-h-40 overflow-y-auto">
                  {bankQuestions.map(q=>{
                    const inQuiz=quizQuestions.some(qq=>qq.id===q.id||qq.bank_id===q.id);
                    return(
                      <label key={q.id} className={`flex items-center gap-2 p-1.5 rounded text-sm cursor-pointer ${inQuiz?'opacity-40':'hover:bg-gray-700'}`}>
                        <input type="checkbox" checked={selectedQuestions.includes(q.id)} onChange={e=>setSelectedQuestions(e.target.checked?[...selectedQuestions,q.id]:selectedQuestions.filter(id=>id!==q.id))} disabled={inQuiz} className="w-4 h-4"/>
                        <span className="flex-1 truncate">{q.question_text}</span>
                        {q.category_id&&<span className="text-xs text-indigo-400">{getCategoryName(q.category_id)}</span>}
                      </label>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        </Modal>
        
        {/* Modal Pioche intelligente */}
        <Modal isOpen={showPickerModal} onClose={()=>setShowPickerModal(false)} title="Pioche intelligente" size="md">
          <div className="space-y-4">
            <div>
              <label className="block text-sm font-medium mb-2">Mode de sélection</label>
              <div className="flex gap-2">
                <button onClick={()=>setPickerConfig({...pickerConfig,mode:'branch'})} className={`flex-1 p-3 rounded-lg border ${pickerConfig.mode==='branch'?'border-indigo-500 bg-indigo-500/20':'border-gray-600'}`}>
                  <Icon name="GitBranch" size={20} className="mx-auto mb-1"/>
                  <span className="text-sm">Par branche</span>
                </button>
                <button onClick={()=>setPickerConfig({...pickerConfig,mode:'balance'})} className={`flex-1 p-3 rounded-lg border ${pickerConfig.mode==='balance'?'border-indigo-500 bg-indigo-500/20':'border-gray-600'}`}>
                  <Icon name="Scale" size={20} className="mx-auto mb-1"/>
                  <span className="text-sm">Équilibré</span>
                </button>
              </div>
            </div>
            
            {pickerConfig.mode==='branch'&&(
              <div className="grid grid-cols-2 gap-3">
                <Select label="Catégorie" value={pickerConfig.categoryId} onChange={e=>setPickerConfig({...pickerConfig,categoryId:e.target.value,themeId:''})} options={[{value:'',label:'Toutes'},...categories.map(c=>({value:c.id,label:`${c.name} (${countQuestionsForCategory(c.id)})`}))]}/>
                <Select label="Thème" value={pickerConfig.themeId} onChange={e=>setPickerConfig({...pickerConfig,themeId:e.target.value})} options={[{value:'',label:'Tous'},...getThemesForCategory(pickerConfig.categoryId).map(t=>({value:t.id,label:`${t.name} (${countQuestionsForTheme(t.id)})`}))]} disabled={!pickerConfig.categoryId}/>
              </div>
            )}
            
            {pickerConfig.mode==='balance'&&(
              <p className="text-sm text-gray-400">Les questions seront réparties équitablement entre toutes les catégories.</p>
            )}
            
            <Input label="Nombre de questions" type="number" min="1" max="50" value={pickerConfig.count} onChange={e=>setPickerConfig({...pickerConfig,count:parseInt(e.target.value)||10})}/>
            
            <div className="flex gap-2">
              <Button variant="secondary" onClick={()=>setShowPickerModal(false)}>Annuler</Button>
              <Button className="flex-1" icon="Shuffle" onClick={executePicker}>Piocher</Button>
            </div>
          </div>
        </Modal>
        
        {/* Modal Prévisualisation */}
        <Modal isOpen={!!previewQuiz} onClose={()=>setPreviewQuiz(null)} title={`Test: ${previewQuiz?.title}`} size="xl">
          {previewQuiz&&(
            <div className="space-y-4">
              {previewSubmitted&&(
                <div className={`p-4 rounded-lg ${calcScore().pct>=previewQuiz.passing_score?'bg-green-500/20':'bg-red-500/20'}`}>
                  <p className="font-semibold">{calcScore().pct>=previewQuiz.passing_score?'✓ Réussi':'✗ Échoué'} - {calcScore().score}/{calcScore().total} pts ({calcScore().pct}%)</p>
                  <Button size="sm" variant="secondary" className="mt-2" onClick={()=>{setPreviewAnswers({});setPreviewSubmitted(false);}}>Recommencer</Button>
                </div>
              )}
              
              <div className="space-y-3 max-h-96 overflow-y-auto">
                {previewQuiz.questions.map((q,i)=>{
                  const correct=(q.quiz_answers||[]).filter(a=>a.is_correct).map(a=>a.id);
                  const ans=previewAnswers[q.id];
                  const isCorrect=previewSubmitted&&((q.question_type==='single'||q.question_type==='true_false')?correct.includes(ans):(ans||[]).length===correct.length&&correct.every(id=>(ans||[]).includes(id)));
                  
                  return(
                    <div key={q.id} className={`p-4 rounded-lg ${previewSubmitted?(isCorrect?'bg-green-500/10':'bg-red-500/10'):'bg-gray-700'}`}>
                      <div className="flex gap-2 mb-2">
                        <span className="px-2 py-1 bg-indigo-500/20 text-indigo-400 rounded text-sm font-medium">Q{i+1}</span>
                        <span className="flex-1 font-medium">{q.question_text}</span>
                      </div>
                      
                      {(q.question_type==='single'||q.question_type==='true_false')&&(
                        <div className="space-y-2 ml-8">
                          {(q.quiz_answers||[]).map(a=>(
                            <label key={a.id} className={`flex items-center gap-2 p-2 rounded cursor-pointer ${previewSubmitted?(a.is_correct?'bg-green-500/20':ans===a.id?'bg-red-500/20':''):(ans===a.id?'bg-indigo-500/20':'hover:bg-gray-600')}`}>
                              <input type="radio" checked={ans===a.id} onChange={()=>!previewSubmitted&&setPreviewAnswers({...previewAnswers,[q.id]:a.id})} disabled={previewSubmitted}/>
                              <span>{a.answer_text}</span>
                            </label>
                          ))}
                        </div>
                      )}
                      
                      {q.question_type==='multiple'&&(
                        <div className="space-y-2 ml-8">
                          {(q.quiz_answers||[]).map(a=>{
                            const sel=(ans||[]).includes(a.id);
                            return(
                              <label key={a.id} className={`flex items-center gap-2 p-2 rounded cursor-pointer ${previewSubmitted?(a.is_correct?'bg-green-500/20':sel?'bg-red-500/20':''):(sel?'bg-indigo-500/20':'hover:bg-gray-600')}`}>
                                <input type="checkbox" checked={sel} onChange={()=>!previewSubmitted&&setPreviewAnswers({...previewAnswers,[q.id]:sel?(ans||[]).filter(id=>id!==a.id):[...(ans||[]),a.id]})} disabled={previewSubmitted}/>
                                <span>{a.answer_text}</span>
                              </label>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              
              {!previewSubmitted?<Button className="w-full" onClick={()=>setPreviewSubmitted(true)}>Soumettre</Button>:<Button className="w-full" onClick={()=>setPreviewQuiz(null)}>Fermer</Button>}
            </div>
          )}
        </Modal>
      </div>;
    }

    function EnrollmentsPage(){
      const{center,isSuperAdmin,profile,can}=useAuth();
      const[enrollments,setEnrollments]=useState([]);
      const[playlists,setPlaylists]=useState([]);
      const[learners,setLearners]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[bulkModal,setBulkModal]=useState(false);
      const[form,setForm]=useState({playlist_id:'',learner_id:''});
      const[bulkForm,setBulkForm]=useState({playlist_id:'',selectedLearners:[]});
      const[saving,setSaving]=useState(false);

      const load=useCallback(async()=>{
        // Charger les playlists et apprenants filtrés par centre
        let qp=supabase.from('playlists').select('id,title,is_published,center_id').order('title');
        let ql=supabase.from('profiles').select('id,first_name,last_name,email,center_id').eq('role','learner');
        if(!isSuperAdmin&&center?.id){
          qp=qp.eq('center_id',center.id);
          ql=ql.eq('center_id',center.id);
        }
        const[{data:p},{data:l}]=await Promise.all([qp,ql]);
        setPlaylists(p||[]);
        setLearners(l||[]);
        
        // Charger les inscriptions - filtrer par les playlists ET apprenants du centre
        const playlistIds=(p||[]).map(pl=>pl.id);
        const learnerIds=(l||[]).map(le=>le.id);
        
        let enrollmentsQuery=supabase.from('enrollments')
          .select('*,playlists:playlist_id(title,center_id),profiles:learner_id(first_name,last_name,email,center_id)')
          .order('created_at',{ascending:false});
        
        const{data:e}=await enrollmentsQuery;
        
        // Si pas super admin, filtrer par les playlists et apprenants du centre
        if(!isSuperAdmin&&center?.id){
          const filtered=(e||[]).filter(enr=>
            playlistIds.includes(enr.playlist_id)&&learnerIds.includes(enr.learner_id)
          );
          setEnrollments(filtered);
        }else{
          setEnrollments(e||[]);
        }
        
        setLoading(false);
      },[isSuperAdmin,center?.id]);
      useEffect(()=>{load();},[load]);

      const handleEnroll=async()=>{
        setSaving(true);
        await supabase.from('enrollments').insert({playlist_id:form.playlist_id,learner_id:form.learner_id,enrolled_by:profile?.id});
        await load();setModal(false);setForm({playlist_id:'',learner_id:''});setSaving(false);
      };
      
      const handleBulkEnroll=async()=>{
        setSaving(true);
        const inserts=bulkForm.selectedLearners.map(learnerId=>({playlist_id:bulkForm.playlist_id,learner_id:learnerId,enrolled_by:profile?.id}));
        await supabase.from('enrollments').upsert(inserts,{onConflict:'playlist_id,learner_id'});
        await load();setBulkModal(false);setBulkForm({playlist_id:'',selectedLearners:[]});setSaving(false);
      };
      
      const handleUnenroll=async id=>{if(!confirm('Désinscrire ?'))return;await supabase.from('enrollments').delete().eq('id',id);load();};
      
      const toggleLearner=(learnerId)=>{
        setBulkForm(prev=>({
          ...prev,
          selectedLearners:prev.selectedLearners.includes(learnerId)?prev.selectedLearners.filter(id=>id!==learnerId):[...prev.selectedLearners,learnerId]
        }));
      };
      
      const selectAll=()=>{
        const enrolledIds=enrollments.filter(e=>e.playlist_id===bulkForm.playlist_id).map(e=>e.learner_id);
        const available=learners.filter(l=>!enrolledIds.includes(l.id));
        setBulkForm(prev=>({...prev,selectedLearners:available.map(l=>l.id)}));
      };

      if(!can('manage_enrollments'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;
      
      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4"><h1 className="text-2xl font-bold">Inscriptions</h1><div className="flex gap-2"><Button variant="secondary" icon="Users" onClick={()=>setBulkModal(true)}>Inscription en masse</Button><Button icon="UserPlus" onClick={()=>setModal(true)}>Inscrire</Button></div></div>
        {enrollments.length===0?<Empty icon="UserPlus" title="Aucune inscription"/>:<Card><div className="overflow-x-auto"><table className="w-full"><thead className="bg-gray-750"><tr><th className="text-left p-4 font-medium text-gray-400">Apprenant</th><th className="text-left p-4 font-medium text-gray-400">Cours</th><th className="text-left p-4 font-medium text-gray-400">Progression</th><th className="text-left p-4 font-medium text-gray-400">Temps</th><th className="text-left p-4 font-medium text-gray-400">Statut</th><th className="text-left p-4 font-medium text-gray-400">Date</th><th className="text-right p-4"></th></tr></thead><tbody className="divide-y divide-gray-700">{enrollments.map(e=>{const formatT=(s)=>{if(!s)return'-';const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);return h>0?`${h}h ${m}min`:`${m}min`;};return<tr key={e.id}><td className="p-4"><p className="font-medium">{e.profiles?.first_name} {e.profiles?.last_name}</p><p className="text-sm text-gray-400">{e.profiles?.email}</p></td><td className="p-4">{e.playlists?.title||'—'}</td><td className="p-4"><ProgressBar percent={e.progress_percent||0} size="sm" showLabel={true}/></td><td className="p-4 text-blue-400">{formatT(e.time_spent_seconds)}</td><td className="p-4"><span className={`px-2 py-1 rounded text-xs ${e.status==='completed'?'bg-green-500/20 text-green-400':e.status==='in_progress'?'bg-yellow-500/20 text-yellow-400':'bg-gray-500/20 text-gray-400'}`}>{e.status==='not_started'?'Non commencé':e.status==='in_progress'?'En cours':'Terminé'}</span></td><td className="p-4 text-gray-400">{new Date(e.created_at).toLocaleDateString('fr-FR')}</td><td className="p-4 text-right"><Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleUnenroll(e.id)}/></td></tr>})}</tbody></table></div></Card>}
        
        <Modal isOpen={modal} onClose={()=>setModal(false)} title="Inscrire"><div className="space-y-4"><Select label="Cours" value={form.playlist_id} onChange={e=>setForm({...form,playlist_id:e.target.value})} options={[{value:'',label:'Sélectionner...'},...playlists.map(p=>({value:p.id,label:`${p.title}${p.is_published?'':' (brouillon)'}`}))]}/><Select label="Apprenant" value={form.learner_id} onChange={e=>setForm({...form,learner_id:e.target.value})} options={[{value:'',label:'Sélectionner...'},...learners.map(l=>({value:l.id,label:`${l.first_name} ${l.last_name}`}))]}/><div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button><Button onClick={handleEnroll} loading={saving} disabled={!form.playlist_id||!form.learner_id}>Inscrire</Button></div></div></Modal>
        
        <Modal isOpen={bulkModal} onClose={()=>setBulkModal(false)} title="Inscription en masse" size="lg">
          <div className="space-y-4">
            <Select label="Cours" value={bulkForm.playlist_id} onChange={e=>setBulkForm({...bulkForm,playlist_id:e.target.value,selectedLearners:[]})} options={[{value:'',label:'Sélectionner un cours...'},...playlists.map(p=>({value:p.id,label:`${p.title}${p.is_published?'':' (brouillon)'}`}))]}/>
            
            {bulkForm.playlist_id&&(
              <div>
                <div className="flex items-center justify-between mb-3">
                  <h4 className="font-medium">Apprenants disponibles</h4>
                  <Button variant="ghost" size="sm" onClick={selectAll}>Tout sélectionner</Button>
                </div>
                <div className="max-h-64 overflow-y-auto bg-gray-700/50 rounded-lg p-2 space-y-1">
                  {learners.filter(l=>!enrollments.find(e=>e.playlist_id===bulkForm.playlist_id&&e.learner_id===l.id)).map(l=>(
                    <Checkbox key={l.id} label={`${l.first_name} ${l.last_name} (${l.email})`} checked={bulkForm.selectedLearners.includes(l.id)} onChange={()=>toggleLearner(l.id)}/>
                  ))}
                  {learners.filter(l=>!enrollments.find(e=>e.playlist_id===bulkForm.playlist_id&&e.learner_id===l.id)).length===0&&<p className="text-gray-500 text-sm text-center py-4">Tous les apprenants sont déjà inscrits</p>}
                </div>
                <p className="text-sm text-gray-400 mt-2">{bulkForm.selectedLearners.length} apprenant(s) sélectionné(s)</p>
              </div>
            )}
            
            <div className="flex justify-end gap-3">
              <Button variant="secondary" onClick={()=>setBulkModal(false)}>Annuler</Button>
              <Button onClick={handleBulkEnroll} loading={saving} disabled={!bulkForm.playlist_id||bulkForm.selectedLearners.length===0}>Inscrire {bulkForm.selectedLearners.length} apprenant(s)</Button>
            </div>
          </div>
        </Modal>
      </div>;
    }

    // ==================== CATALOGUE LMS (Super Admin) ====================
    function CatalogPage(){
      const{isSuperAdmin}=useAuth();
      const[activeTab,setActiveTab]=useState('content');
      const[loading,setLoading]=useState(true);
      const[saving,setSaving]=useState(false);
      const[videos,setVideos]=useState([]);
      const[scormModules,setScormModules]=useState([]);
      const[quizzes,setQuizzes]=useState([]);
      const[courses,setCourses]=useState([]);
      const[packs,setPacks]=useState([]);
      const[packModal,setPackModal]=useState(false);
      const[editingPack,setEditingPack]=useState(null);
      const[packForm,setPackForm]=useState({name:'',code:'',description:'',pack_type:'bundle',is_active:true});
      const[selectedContent,setSelectedContent]=useState({videos:[],scorm:[],quizzes:[],courses:[]});
      
      const load=useCallback(async()=>{
        try{
          const{data:v}=await supabase.from('videos').select('*').order('title');setVideos(v||[]);
          const{data:s}=await supabase.from('scorm_modules').select('*').order('title');setScormModules(s||[]);
          const{data:q}=await supabase.from('quizzes').select('*').order('title');setQuizzes(q||[]);
          const{data:c}=await supabase.from('playlists').select('*').order('title');setCourses(c||[]);
          try{const{data:pk}=await supabase.from('content_packs').select('*').order('name');setPacks(pk||[]);}catch(e){setPacks([]);}
        }catch(err){console.error(err);}
        setLoading(false);
      },[]);
      useEffect(()=>{load();},[load]);
      
      const toggleLmsContent=async(table,id,val)=>{setSaving(true);await supabase.from(table).update({is_lms_content:!val}).eq('id',id);await load();setSaving(false);};
      const toggleLocked=async(table,id,val)=>{setSaving(true);await supabase.from(table).update({is_locked:!val}).eq('id',id);await load();setSaving(false);};
      
      const openPackModal=(pack=null)=>{
        if(pack){
          setEditingPack(pack);setPackForm({name:pack.name,code:pack.code||'',description:pack.description||'',pack_type:pack.pack_type,is_active:pack.is_active});
          supabase.from('content_pack_items').select('*').eq('pack_id',pack.id).then(({data})=>{
            const sel={videos:[],scorm:[],quizzes:[],courses:[]};
            (data||[]).forEach(i=>{if(i.content_type==='video')sel.videos.push(i.content_id);else if(i.content_type==='scorm')sel.scorm.push(i.content_id);else if(i.content_type==='quiz')sel.quizzes.push(i.content_id);else if(i.content_type==='course')sel.courses.push(i.content_id);});
            setSelectedContent(sel);
          });
        }else{setEditingPack(null);setPackForm({name:'',code:'',description:'',pack_type:'bundle',is_active:true});setSelectedContent({videos:[],scorm:[],quizzes:[],courses:[]});}
        setPackModal(true);
      };
      
      const savePack=async()=>{
        if(!packForm.name.trim()){alert('Nom requis');return;}setSaving(true);
        try{
          let packId;
          if(editingPack){await supabase.from('content_packs').update(packForm).eq('id',editingPack.id);packId=editingPack.id;await supabase.from('content_pack_items').delete().eq('pack_id',packId);}
          else{const{data:np}=await supabase.from('content_packs').insert(packForm).select().single();packId=np.id;}
          const items=[];
          selectedContent.videos.forEach(id=>items.push({pack_id:packId,content_type:'video',content_id:id}));
          selectedContent.scorm.forEach(id=>items.push({pack_id:packId,content_type:'scorm',content_id:id}));
          selectedContent.quizzes.forEach(id=>items.push({pack_id:packId,content_type:'quiz',content_id:id}));
          selectedContent.courses.forEach(id=>items.push({pack_id:packId,content_type:'course',content_id:id}));
          if(items.length>0)await supabase.from('content_pack_items').insert(items);
          await load();setPackModal(false);
        }catch(err){alert('Erreur: '+err.message);}
        setSaving(false);
      };
      
      const deletePack=async(id)=>{if(!confirm('Supprimer ?'))return;await supabase.from('content_packs').delete().eq('id',id);load();};
      const toggleSel=(type,id)=>setSelectedContent(p=>({...p,[type]:p[type].includes(id)?p[type].filter(x=>x!==id):[...p[type],id]}));
      
      if(!isSuperAdmin)return<Empty icon="Lock" title="Accès Super Admin"/>;
      if(loading)return<Loading/>;
      
      const lmsV=videos.filter(v=>v.is_lms_content),lmsS=scormModules.filter(s=>s.is_lms_content),lmsQ=quizzes.filter(q=>q.is_lms_content),lmsC=courses.filter(c=>c.is_lms_content);
      
      return<div>
        <div className="flex items-center justify-between mb-6"><div><h1 className="text-2xl font-bold">Catalogue LMS</h1><p className="text-sm text-gray-400">Contenus et packs distribués aux centres</p></div></div>
        <Tabs tabs={[{id:'content',label:'Contenus LMS',icon:'Film'},{id:'packs',label:`Packs (${packs.length})`,icon:'Package'}]} active={activeTab} onChange={setActiveTab}/>
        
        {activeTab==='content'&&<div className="space-y-6">
          <div className="grid grid-cols-4 gap-4">
            <Card className="p-4 text-center"><p className="text-2xl font-bold text-indigo-400">{lmsV.length}</p><p className="text-sm text-gray-400">Vidéos</p></Card>
            <Card className="p-4 text-center"><p className="text-2xl font-bold text-purple-400">{lmsS.length}</p><p className="text-sm text-gray-400">SCORM</p></Card>
            <Card className="p-4 text-center"><p className="text-2xl font-bold text-cyan-400">{lmsQ.length}</p><p className="text-sm text-gray-400">Quiz</p></Card>
            <Card className="p-4 text-center"><p className="text-2xl font-bold text-green-400">{lmsC.length}</p><p className="text-sm text-gray-400">Cours</p></Card>
          </div>
          <Card className="p-4"><h3 className="font-semibold mb-3">Vidéos ({videos.length})</h3><div className="space-y-2 max-h-60 overflow-y-auto">{videos.map(v=><div key={v.id} className="flex items-center gap-3 p-2 bg-gray-700/50 rounded"><input type="checkbox" checked={v.is_lms_content||false} onChange={()=>toggleLmsContent('videos',v.id,v.is_lms_content)} disabled={saving} className="w-5 h-5"/><span className="flex-1">{v.title}</span>{v.is_lms_content&&<span className="px-2 py-0.5 bg-indigo-500/20 text-indigo-400 rounded text-xs">LMS</span>}</div>)}</div></Card>
          <Card className="p-4"><h3 className="font-semibold mb-3">SCORM ({scormModules.length})</h3><div className="space-y-2 max-h-60 overflow-y-auto">{scormModules.map(s=><div key={s.id} className="flex items-center gap-3 p-2 bg-gray-700/50 rounded"><input type="checkbox" checked={s.is_lms_content||false} onChange={()=>toggleLmsContent('scorm_modules',s.id,s.is_lms_content)} disabled={saving} className="w-5 h-5"/><span className="flex-1">{s.title}</span>{s.is_lms_content&&<span className="px-2 py-0.5 bg-purple-500/20 text-purple-400 rounded text-xs">LMS</span>}</div>)}</div></Card>
