            playlist_id:selectedCourse.playlist_id,
            certificate_number:certNumber,
            score:avgScore,
            duration_seconds:totalWatchTime>0?totalWatchTime:durationSeconds,
            completed_at:completionDate.toISOString()
          }).select().single();
          
          // 2. Ajouter des points (50 points par cours complété)
          await supabase.from('learner_points').insert({
            learner_id:user.id,
            points:50,
            reason:'course_completed',
            reference_id:selectedCourse.playlist_id
          });
          
          // 3. Vérifier le badge "Premier cours"
          const{data:completedCourses}=await supabase.from('enrollments').select('id').eq('learner_id',user.id).eq('status','completed');
          const completedCount=(completedCourses||[]).length;
          
          if(completedCount===1){
            // Badge premier cours
            const{data:badge}=await supabase.from('badges').select('id,points').eq('code','first_course').single();
            if(badge){
              const{data:existing}=await supabase.from('learner_badges').select('id').eq('learner_id',user.id).eq('badge_id',badge.id).single();
              if(!existing){
                await supabase.from('learner_badges').insert({learner_id:user.id,badge_id:badge.id});
                await supabase.from('learner_points').insert({learner_id:user.id,points:badge.points,reason:'badge_earned',reference_id:badge.id});
                await supabase.from('notifications').insert({user_id:user.id,title:'🏆 Badge obtenu !',message:'Vous avez obtenu le badge "Premier pas"',type:'success',link:'my-badges'});
              }
            }
          }
          
          if(completedCount>=5){
            // Badge 5 cours complétés
            const{data:badge}=await supabase.from('badges').select('id,points').eq('code','five_courses').single();
            if(badge){
              const{data:existing}=await supabase.from('learner_badges').select('id').eq('learner_id',user.id).eq('badge_id',badge.id).single();
              if(!existing){
                await supabase.from('learner_badges').insert({learner_id:user.id,badge_id:badge.id});
                await supabase.from('learner_points').insert({learner_id:user.id,points:badge.points,reason:'badge_earned',reference_id:badge.id});
                await supabase.from('notifications').insert({user_id:user.id,title:'🏆 Badge obtenu !',message:'Vous avez obtenu le badge "Expert en herbe"',type:'success',link:'my-badges'});
              }
            }
          }
          
          // 4. Notification certificat
          if(cert){
            await supabase.from('notifications').insert({
              user_id:user.id,
              title:'🎉 Félicitations !',
              message:`Vous avez obtenu votre certificat pour "${selectedCourse.playlists?.title}"${avgScore?' avec une note de '+avgScore+'%':''}`,
              type:'certificate',
              link:'my-certificates'
            });
          }
          } // Fin du else (pas de certificat existant)
        }
      },[selectedCourse,courseVideos.length,courseScorm.length,scormProgress,user.id]);

      const markAsComplete=async(pv)=>{
        await supabase.from('video_progress').upsert({
          enrollment_id:selectedCourse.id,
          playlist_video_id:pv.id,
          learner_id:user.id,
          is_completed:true,
          completed_at:new Date().toISOString(),
          last_position_seconds:0,
          watch_time_seconds:0
        },{onConflict:'enrollment_id,playlist_video_id'});
        
        setVideoProgress(prev=>({...prev,[pv.id]:{...prev[pv.id],is_completed:true}}));
        await updateCourseProgress();
      };

      // Naviguer vers un chapitre
      const goToChapter=(seconds)=>{
        if(playerInstanceRef.current){
          playerInstanceRef.current.setCurrentTime(seconds).catch(()=>{});
        }
      };

      // Gestion des notes
      const addNote=async()=>{
        if(!newNote.trim()||!selectedCourse||!currentVideo)return;
        let currentTime=0;
        if(playerInstanceRef.current){
          try{currentTime=Math.floor(await playerInstanceRef.current.getCurrentTime());}catch(e){}
        }
        const{data}=await supabase.from('learner_notes').insert({
          enrollment_id:selectedCourse.id,
          playlist_video_id:currentVideo.id,
          content:newNote.trim(),
          timestamp_seconds:currentTime
        }).select().single();
        if(data)setNotes([data,...notes]);
        setNewNote('');
      };

      const deleteNote=async(id)=>{
        await supabase.from('learner_notes').delete().eq('id',id);
        setNotes(notes.filter(n=>n.id!==id));
      };

      const formatTime=(seconds)=>{
        const m=Math.floor(seconds/60);
        const s=seconds%60;
        return `${m}:${s.toString().padStart(2,'0')}`;
      };

      if(loading)return<Loading/>;
      
      // Vue du lecteur de cours
      if(selectedCourse){
        const totalVideos=courseVideos.length;
        const completedVideos=Object.values(videoProgress).filter(p=>p.is_completed).length;
        const progressPercent=totalVideos>0?Math.round((completedVideos/totalVideos)*100):0;
        
        return<div>
          <div className="flex items-center gap-4 mb-6">
            <Button variant="ghost" icon="ArrowLeft" onClick={closeCourse}>Retour</Button>
            <div className="flex-1">
              <h1 className="text-xl font-bold">{selectedCourse.playlists?.title}</h1>
              <p className="text-sm text-gray-400">{completedVideos}/{totalVideos} vidéos complétées</p>
            </div>
          </div>
          
          <div className="mb-4"><ProgressBar percent={progressPercent}/></div>
          
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 space-y-4">
              <Card className="overflow-hidden">
                <div className="aspect-video bg-black relative">
                  <div ref={playerRef} className="absolute inset-0"/>
                </div>
                {currentVideo&&(
                  <div className="p-4">
                    <h2 className="text-lg font-semibold">{currentVideo.videos?.title}</h2>
                    {currentVideo.videos?.description&&<p className="text-gray-400 mt-2 text-sm">{currentVideo.videos.description}</p>}
                  </div>
                )}
              </Card>
              
              {/* Chapitres sous la vidéo */}
              {chapters.length>0&&(
                <Card className="p-4">
                  <h3 className="font-semibold mb-3 flex items-center gap-2"><Icon name="List" size={18}/>Chapitres</h3>
                  <div className="flex flex-wrap gap-2">
                    {chapters.map(c=>(
                      <button key={c.id} onClick={()=>goToChapter(c.timestamp_seconds)} className="flex items-center gap-2 px-3 py-2 bg-gray-700 hover:bg-indigo-600 rounded-lg transition text-sm">
                        <span className="font-mono text-xs bg-gray-600 px-2 py-0.5 rounded">{formatTime(c.timestamp_seconds)}</span>
                        <span>{c.title}</span>
                      </button>
                    ))}
                  </div>
                </Card>
              )}
              
              {/* Documents, Notes et Quiz */}
              <Card>
                <div className="flex border-b border-gray-700">
                  <button onClick={()=>setActiveTab('attachments')} className={`flex-1 px-4 py-3 text-sm font-medium ${activeTab==='attachments'?'text-indigo-400 border-b-2 border-indigo-400':'text-gray-400 hover:text-white'}`}>
                    <Icon name="Paperclip" size={16} className="inline mr-2"/>Documents ({attachments.length})
                  </button>
                  <button onClick={()=>setActiveTab('notes')} className={`flex-1 px-4 py-3 text-sm font-medium ${activeTab==='notes'?'text-indigo-400 border-b-2 border-indigo-400':'text-gray-400 hover:text-white'}`}>
                    <Icon name="StickyNote" size={16} className="inline mr-2"/>Mes notes ({notes.length})
                  </button>
                  {courseQuiz&&(
                    <button onClick={()=>setActiveTab('quiz')} className={`flex-1 px-4 py-3 text-sm font-medium ${activeTab==='quiz'?'text-indigo-400 border-b-2 border-indigo-400':'text-gray-400 hover:text-white'}`}>
                      <Icon name="HelpCircle" size={16} className="inline mr-2"/>Quiz {bestAttempt?.passed&&'✓'}
                    </button>
                  )}
                </div>
                <div className="p-4">
                  {activeTab==='attachments'&&(
                    <div className="space-y-2">
                      {attachments.length===0?<p className="text-gray-500 text-sm text-center py-4">Aucun document pour cette vidéo</p>:(
                        attachments.map(a=>(
                          <a key={a.id} href={a.file_url} target="_blank" rel="noopener" className="flex items-center gap-3 p-3 bg-gray-700/50 hover:bg-gray-700 rounded-lg transition">
                            <Icon name="FileText" size={20} className="text-indigo-400"/>
                            <div className="flex-1">
                              <p className="font-medium text-sm">{a.title}</p>
                              <p className="text-xs text-gray-400">{a.file_type?.toUpperCase()}</p>
                            </div>
                            <Icon name="Download" size={16} className="text-gray-400"/>
                          </a>
                        ))
                      )}
                    </div>
                  )}
                  {activeTab==='notes'&&(
                    <div className="space-y-4">
                      <div className="flex gap-2">
                        <input value={newNote} onChange={e=>setNewNote(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addNote()} placeholder="Ajouter une note..." className="flex-1 px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white text-sm"/>
                        <Button size="sm" icon="Plus" onClick={addNote} disabled={!newNote.trim()}>Ajouter</Button>
                      </div>
                      <div className="space-y-2 max-h-64 overflow-y-auto">
                        {notes.length===0?<p className="text-gray-500 text-sm text-center py-4">Aucune note</p>:(
                          notes.map(n=>(
                            <div key={n.id} className="p-3 bg-gray-700/50 rounded-lg">
                              <div className="flex items-start justify-between gap-2">
                                <div className="flex-1">
                                  {n.timestamp_seconds>0&&(
                                    <button onClick={()=>goToChapter(n.timestamp_seconds)} className="text-xs text-indigo-400 hover:underline mb-1">
                                      📍 {formatTime(n.timestamp_seconds)}
                                    </button>
                                  )}
                                  <p className="text-sm">{n.content}</p>
                                  <p className="text-xs text-gray-500 mt-1">{new Date(n.created_at).toLocaleString('fr-FR')}</p>
                                </div>
                                <button onClick={()=>deleteNote(n.id)} className="p-1 hover:bg-red-600 rounded text-gray-400 hover:text-white">
                                  <Icon name="Trash2" size={14}/>
                                </button>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  )}
                  {activeTab==='quiz'&&courseQuiz&&(
                    <div>
                      {!quizMode&&!quizResult?(
                        <div className="text-center py-4">
                          <Icon name="HelpCircle" size={48} className="mx-auto text-indigo-400 mb-4"/>
                          <h4 className="font-semibold text-lg mb-2">{courseQuiz.title}</h4>
                          {courseQuiz.description&&<p className="text-gray-400 text-sm mb-4">{courseQuiz.description}</p>}
                          <div className="flex items-center justify-center gap-4 text-sm text-gray-400 mb-4">
                            <span><Icon name="List" size={14} className="inline mr-1"/>{quizQuestions.length} questions</span>
                            <span><Icon name="Target" size={14} className="inline mr-1"/>{courseQuiz.passing_score}% requis</span>
                          </div>
                          {bestAttempt&&(
                            <div className={`p-3 rounded-lg mb-4 ${bestAttempt.passed?'bg-green-500/20 text-green-400':'bg-yellow-500/20 text-yellow-400'}`}>
                              <p className="font-medium">Meilleur score: {bestAttempt.score_percent}%</p>
                              <p className="text-sm opacity-75">{bestAttempt.passed?'Quiz réussi ✓':'Non validé'}</p>
                            </div>
                          )}
                          <Button icon="Play" onClick={startQuiz}>{quizAttempts.length>0?'Repasser le quiz':'Commencer le quiz'}</Button>
                        </div>
                      ):quizMode&&!quizResult?(
                        <div className="space-y-6">
                          {quizQuestions.map((q,i)=>(
                            <div key={q.id} className="p-4 bg-gray-700/50 rounded-lg">
                              <p className="font-medium mb-3"><span className="text-indigo-400 mr-2">Q{i+1}.</span>{q.question_text}</p>
                              <div className="space-y-2">
                                {q.quiz_answers?.map(a=>(
                                  <label key={a.id} className={`flex items-center gap-3 p-3 rounded-lg cursor-pointer transition ${(quizAnswers[q.id]||[]).includes(a.id)?'bg-indigo-600':'bg-gray-700 hover:bg-gray-600'}`}>
                                    <input type={q.question_type==='multiple'?'checkbox':'radio'} name={`q-${q.id}`} checked={(quizAnswers[q.id]||[]).includes(a.id)} onChange={()=>selectAnswer(q.id,a.id,q.question_type==='multiple')} className="sr-only"/>
                                    <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center ${(quizAnswers[q.id]||[]).includes(a.id)?'border-white bg-white':'border-gray-500'}`}>
                                      {(quizAnswers[q.id]||[]).includes(a.id)&&<div className="w-2 h-2 rounded-full bg-indigo-600"/>}
                                    </div>
                                    <span>{a.answer_text}</span>
                                  </label>
                                ))}
                              </div>
                            </div>
                          ))}
                          <div className="flex justify-between">
                            <Button variant="secondary" onClick={closeQuiz}>Annuler</Button>
                            <Button icon="Check" onClick={submitQuiz} disabled={Object.keys(quizAnswers).length<quizQuestions.length}>Valider ({Object.keys(quizAnswers).length}/{quizQuestions.length})</Button>
                          </div>
                        </div>
                      ):(
                        <div className="text-center py-4">
                          <div className={`w-24 h-24 rounded-full mx-auto mb-4 flex items-center justify-center ${quizResult.passed?'bg-green-500':'bg-red-500'}`}>
                            <Icon name={quizResult.passed?'Check':'X'} size={48} className="text-white"/>
                          </div>
                          <h4 className="font-semibold text-2xl mb-2">{quizResult.scorePercent}%</h4>
                          <p className={`font-medium ${quizResult.passed?'text-green-400':'text-red-400'}`}>{quizResult.passed?'Quiz réussi !':'Quiz non validé'}</p>
                          <p className="text-gray-400 text-sm mt-2">{quizResult.earnedPoints}/{quizResult.totalPoints} points</p>
                          <div className="flex justify-center gap-3 mt-6">
                            <Button variant="secondary" onClick={closeQuiz}>Fermer</Button>
                            {!quizResult.passed&&<Button onClick={startQuiz}>Réessayer</Button>}
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </Card>
            </div>
            
            <div>
              <Card className="p-4">
                <h3 className="font-semibold mb-4">Contenu du cours</h3>
                <div className="space-y-2 max-h-[60vh] overflow-y-auto">
                  {/* Vidéos */}
                  {courseVideos.map((pv,i)=>{
                    const progress=videoProgress[pv.id];
                    const isCompleted=progress?.is_completed;
                    const isCurrent=currentVideo?.id===pv.id;
                    const hasProgress=progress?.last_position_seconds>0&&!isCompleted;
                    const progressPercent=hasProgress&&pv.videos?.duration?Math.min(100,Math.round((progress.last_position_seconds/parseDuration(pv.videos.duration))*100)):0;
                    return(
                      <div key={pv.id} onClick={()=>selectVideo(pv)} className={`flex items-center gap-3 p-3 rounded-lg cursor-pointer transition ${isCurrent?'bg-indigo-600':'hover:bg-gray-700'}`}>
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${isCompleted?'bg-green-500':hasProgress?'bg-yellow-500':isCurrent?'bg-white text-indigo-600':'bg-gray-700'}`}>
                          {isCompleted?<Icon name="Check" size={16}/>:hasProgress?<Icon name="Play" size={14}/>:i+1}
                        </div>
                        <div className="flex-1 min-w-0">
                          <p className="font-medium truncate text-sm">{pv.videos?.title}</p>
                          <div className="flex items-center gap-2 text-xs text-gray-400">
                            <span>{pv.videos?.duration||'--:--'}</span>
                            {isCompleted&&<span className="text-green-400">✓ Terminée</span>}
                            {hasProgress&&<span className="text-yellow-400">• {progressPercent}% vu</span>}
                          </div>
                        </div>
                        {!isCompleted&&!isCurrent&&(
                          <button onClick={(e)=>{e.stopPropagation();markAsComplete(pv);}} className="p-1 hover:bg-gray-600 rounded" title="Marquer comme vu">
                            <Icon name="CheckCircle" size={16} className="text-gray-500"/>
                          </button>
                        )}
                      </div>
                    );
                  })}
                  
                  {/* Modules SCORM */}
                  {courseScorm.length>0&&(
                    <>
                      <div className="border-t border-gray-700 my-3 pt-3">
                        <p className="text-xs text-gray-400 uppercase tracking-wider mb-2">Modules interactifs</p>
                      </div>
                      {courseScorm.map((ps,i)=>{
                        // ps.scorm_modules.id est l'ID du module SCORM
                        // scormProgress est indexé par module_id
                        const moduleId=ps.scorm_modules?.id;
                        const sp=scormProgress[moduleId];
                        const isCompleted=sp?.completion_status==='completed'||sp?.completion_status==='passed';
                        const inProgress=sp?.completion_status==='incomplete'||sp?.completion_status==='browsed';
                        const hasScore=sp?.score_scaled!==null&&sp?.score_scaled!==undefined;
                        return(
                          <div key={ps.id} onClick={()=>setActiveScorm(ps.scorm_modules)} className="flex items-center gap-3 p-3 rounded-lg cursor-pointer transition hover:bg-orange-500/20 border border-orange-500/30">
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center ${isCompleted?'bg-green-500':inProgress?'bg-orange-500':'bg-orange-500/30'}`}>
                              {isCompleted?<Icon name="Check" size={16}/>:<Icon name="Package" size={16}/>}
                            </div>
                            <div className="flex-1 min-w-0">
                              <p className="font-medium truncate text-sm">{ps.scorm_modules?.title}</p>
                              <div className="flex items-center gap-2 text-xs">
                                {isCompleted&&<span className="text-green-400">✓ Terminé</span>}
                                {inProgress&&<span className="text-orange-400">En cours</span>}
                                {!isCompleted&&!inProgress&&<span className="text-gray-500">Non commencé</span>}
                                {hasScore&&<span className="text-gray-400">• {Math.round(sp.score_scaled*100)}%</span>}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </>
                  )}
                </div>
              </Card>
            </div>
          </div>
          
          {/* Lecteur SCORM plein écran */}
          {activeScorm&&(
            <ScormPlayer 
              module={activeScorm} 
              enrollmentId={selectedCourse.id}
              onComplete={async()=>{
                // Recharger la progression SCORM par learner_id
                const moduleIds=courseScorm.map(s=>s.scorm_modules?.id).filter(Boolean);
                let spMap={};
                if(moduleIds.length>0){
                  const{data:sp}=await supabase.from('scorm_progress').select('*').eq('learner_id',user.id).in('module_id',moduleIds);
                  (sp||[]).forEach(p=>{spMap[p.module_id]=p;});
                }
                setScormProgress(spMap);
                
                // Recalculer et mettre à jour la progression du cours
                const totalVids=courseVideos.length;
                const completedVids=Object.values(videoProgressRef.current).filter(p=>p.is_completed).length;
                const totalScorms=courseScorm.length;
                const completedScorms=Object.values(spMap).filter(p=>p.completion_status==='completed'||p.completion_status==='passed').length;
                const totalItems=totalVids+totalScorms;
                const completedItems=completedVids+completedScorms;
                const pct=totalItems>0?Math.round((completedItems/totalItems)*100):0;
                console.log('📈 Course progress after SCORM:', {totalVids, completedVids, totalScorms, completedScorms, pct});
                await supabase.from('enrollments').update({progress_percent:pct,status:pct===100?'completed':'in_progress'}).eq('id',selectedCourse.id);
                setSelectedCourse(prev=>prev?{...prev,progress_percent:pct,status:pct===100?'completed':'in_progress'}:prev);
                
                // Si le cours est terminé à 100%, générer certificat et badges
                if(pct===100){
                  console.log('🎉 Course completed via SCORM! Generating certificate and badges...');
                  updateCourseProgress();
                }
              }}
              onClose={async()=>{
                // Recharger la progression SCORM avant de fermer
                const moduleIds=courseScorm.map(s=>s.scorm_modules?.id).filter(Boolean);
                let spMap={};
                if(moduleIds.length>0){
                  const{data:sp}=await supabase.from('scorm_progress').select('*').eq('learner_id',user.id).in('module_id',moduleIds);
                  (sp||[]).forEach(p=>{spMap[p.module_id]=p;});
                }
                setScormProgress(spMap);
                
                // Recalculer et mettre à jour la progression du cours
                const totalVids=courseVideos.length;
                const completedVids=Object.values(videoProgressRef.current).filter(p=>p.is_completed).length;
                const totalScorms=courseScorm.length;
                const completedScorms=Object.values(spMap).filter(p=>p.completion_status==='completed'||p.completion_status==='passed').length;
                const totalItems=totalVids+totalScorms;
                const completedItems=completedVids+completedScorms;
                const pct=totalItems>0?Math.round((completedItems/totalItems)*100):0;
                console.log('📈 Course progress on SCORM close:', {totalVids, completedVids, totalScorms, completedScorms, pct});
                
                if(selectedCourse?.id){
                  await supabase.from('enrollments').update({
                    progress_percent:pct,
                    status:pct===100?'completed':pct>0?'in_progress':'not_started'
                  }).eq('id',selectedCourse.id);
                  
                  setSelectedCourse(prev=>prev?{...prev,progress_percent:pct,status:pct===100?'completed':pct>0?'in_progress':'not_started'}:prev);
                  
                  // Si le cours est terminé à 100%, générer certificat
                  if(pct===100){
                    console.log('🎉 Course completed! Generating certificate...');
                    updateCourseProgress();
                  }
                }
                
                setActiveScorm(null);
              }}
            />
          )}
        </div>;
      }
      
      // Vue liste des cours
      return<div>
        <h1 className="text-2xl font-bold mb-6">Mes cours</h1>
        
        {/* Récapitulatif SCORM personnel */}
        {myScormStats.total>0&&(
          <Card className="p-4 mb-6 bg-gradient-to-r from-orange-500/10 to-yellow-500/10 border-orange-500/30">
            <div className="flex items-center gap-4 flex-wrap">
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 bg-orange-500/20 rounded-lg flex items-center justify-center">
                  <Icon name="Package" size={24} className="text-orange-400"/>
                </div>
                <div>
                  <p className="text-sm text-gray-400">Mes modules SCORM</p>
                  <p className="text-xl font-bold">{myScormStats.completed}/{myScormStats.total} terminés</p>
                </div>
              </div>
              <div className="flex-1"/>
              <div className="flex gap-6 text-center">
                <div><p className="text-2xl font-bold text-green-400">{myScormStats.passed}</p><p className="text-xs text-gray-400">Réussis</p></div>
                <div><p className="text-2xl font-bold text-indigo-400">{Math.round(myScormStats.avgScore*100)}%</p><p className="text-xs text-gray-400">Score moy.</p></div>
              </div>
            </div>
            
            {/* Derniers résultats SCORM */}
            {allMyScorm.length>0&&(
              <div className="mt-4 pt-4 border-t border-orange-500/20">
                <p className="text-sm text-gray-400 mb-3">Derniers résultats</p>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
                  {allMyScorm.slice(0,3).map(s=>(
                    <div key={s.id} className="flex items-center gap-3 p-2 bg-gray-800/50 rounded-lg">
                      <div className={`w-8 h-8 rounded-full flex items-center justify-center ${s.completion_status==='passed'?'bg-green-500':s.completion_status==='completed'?'bg-blue-500':s.completion_status==='failed'?'bg-red-500':'bg-gray-600'}`}>
                        <Icon name={s.completion_status==='passed'||s.completion_status==='completed'?'Check':s.completion_status==='failed'?'X':'Clock'} size={14}/>
                      </div>
                      <div className="flex-1 min-w-0">
                        <p className="text-sm font-medium truncate">{s.scorm_modules?.title}</p>
                        <p className="text-xs text-gray-500">{s.enrollments?.playlists?.title}</p>
                      </div>
                      {s.score_scaled!==null&&<span className={`text-sm font-bold ${s.score_scaled>=0.7?'text-green-400':s.score_scaled>=0.5?'text-yellow-400':'text-red-400'}`}>{Math.round(s.score_scaled*100)}%</span>}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </Card>
        )}
        
        {enrollments.length===0?<Empty icon="GraduationCap" title="Aucun cours" desc="Vous n'êtes inscrit à aucun cours"/>:(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {enrollments.map(e=>(
              <Card key={e.id} className="overflow-hidden cursor-pointer hover:border-indigo-500 transition" onClick={()=>openCourse(e)}>
                <div className="aspect-video bg-gradient-to-br from-indigo-600 to-purple-700 flex items-center justify-center">
                  <Icon name="PlayCircle" size={64} className="text-white/80"/>
                </div>
                <div className="p-4">
                  <h3 className="font-semibold mb-2">{e.playlists?.title}</h3>
                  <ProgressBar percent={e.progress_percent||0} size="sm"/>
                </div>
              </Card>
            ))}
          </div>
        )}
      </div>;
    }

    // Learning Paths Page (Admin)
    function PathsPage(){
      const{center,isSuperAdmin,can,profile}=useAuth();
      const[paths,setPaths]=useState([]);
      const[playlists,setPlaylists]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({title:'',description:'',difficulty:'intermediate',estimated_duration:''});
      const[saving,setSaving]=useState(false);
      const[coursesModal,setCoursesModal]=useState(null);
      const[pathCourses,setPathCourses]=useState([]);

      const load=useCallback(async()=>{
        const{data:p}=await supabase.from('learning_paths').select('*,learning_path_courses(count)').order('created_at',{ascending:false});
        setPaths(p||[]);
        const{data:pl}=await supabase.from('playlists').select('id,title').order('title');
        setPlaylists(pl||[]);
        setLoading(false);
      },[]);
      useEffect(()=>{load();},[load]);

      const handleSave=async()=>{
        setSaving(true);
        const payload={title:form.title,description:form.description||null,difficulty:form.difficulty,estimated_duration:form.estimated_duration||null,center_id:center?.id,created_by:profile?.id};
        if(editing)await supabase.from('learning_paths').update(payload).eq('id',editing.id);
        else await supabase.from('learning_paths').insert(payload);
        await load();setModal(false);setForm({title:'',description:'',difficulty:'intermediate',estimated_duration:''});setEditing(null);setSaving(false);
      };

      const handleDelete=async(id)=>{if(!confirm('Supprimer ce parcours ?'))return;await supabase.from('learning_paths').delete().eq('id',id);load();};
      
      const togglePublish=async(path)=>{await supabase.from('learning_paths').update({is_published:!path.is_published}).eq('id',path.id);load();};

      const openCoursesModal=async(path)=>{
        setCoursesModal(path);
        const{data}=await supabase.from('learning_path_courses').select('*,playlists(title)').eq('path_id',path.id).order('position');
        setPathCourses(data||[]);
      };

      const addCourseToPath=async(playlistId)=>{
        if(!playlistId||pathCourses.find(c=>c.playlist_id===playlistId))return;
        await supabase.from('learning_path_courses').insert({path_id:coursesModal.id,playlist_id:playlistId,position:pathCourses.length});
        const{data}=await supabase.from('learning_path_courses').select('*,playlists(title)').eq('path_id',coursesModal.id).order('position');
        setPathCourses(data||[]);
      };

      const removeCourseFromPath=async(id)=>{
        await supabase.from('learning_path_courses').delete().eq('id',id);
        setPathCourses(pathCourses.filter(c=>c.id!==id));
      };

      const difficultyLabels={beginner:'Débutant',intermediate:'Intermédiaire',advanced:'Avancé'};
      const difficultyColors={beginner:'bg-green-500/20 text-green-400',intermediate:'bg-yellow-500/20 text-yellow-400',advanced:'bg-red-500/20 text-red-400'};

      if(!can('manage_playlists')&&profile?.role!=='trainer')return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6"><h1 className="text-2xl font-bold">Parcours de formation</h1><Button icon="Plus" onClick={()=>{setForm({title:'',description:'',difficulty:'intermediate',estimated_duration:''});setEditing(null);setModal(true);}}>Créer un parcours</Button></div>
        
        {paths.length===0?<Empty icon="Map" title="Aucun parcours" desc="Créez votre premier parcours de formation"/>:(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {paths.map(p=>(
              <Card key={p.id} className="p-4">
                <div className="flex items-start justify-between mb-3">
                  <div><h3 className="font-semibold">{p.title}</h3><p className="text-sm text-gray-400">{p.learning_path_courses?.[0]?.count||0} cours</p></div>
                  <span className={`px-2 py-1 rounded text-xs ${p.is_published?'bg-green-500/20 text-green-400':'bg-gray-500/20 text-gray-400'}`}>{p.is_published?'Publié':'Brouillon'}</span>
                </div>
                <div className="flex items-center gap-2 mb-3">
                  <span className={`px-2 py-1 rounded text-xs ${difficultyColors[p.difficulty]}`}>{difficultyLabels[p.difficulty]}</span>
                  {p.estimated_duration&&<span className="text-xs text-gray-400"><Icon name="Clock" size={12} className="inline mr-1"/>{p.estimated_duration}</span>}
                </div>
                <div className="flex flex-wrap gap-2">
                  <Button variant="ghost" size="sm" icon="BookOpen" onClick={()=>openCoursesModal(p)}>Cours</Button>
                  <Button variant="ghost" size="sm" icon={p.is_published?'EyeOff':'Eye'} onClick={()=>togglePublish(p)}/>
                  <Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(p);setForm({title:p.title,description:p.description||'',difficulty:p.difficulty,estimated_duration:p.estimated_duration||''});setModal(true);}}/>
                  <Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(p.id)}/>
                </div>
              </Card>
            ))}
          </div>
        )}

        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title={editing?'Modifier le parcours':'Créer un parcours'}>
          <div className="space-y-4">
            <Input label="Titre *" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/>
            <div><label className="block text-sm font-medium text-gray-300 mb-1">Description</label><textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={3} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/></div>
            <Select label="Niveau" value={form.difficulty} onChange={e=>setForm({...form,difficulty:e.target.value})} options={[{value:'beginner',label:'Débutant'},{value:'intermediate',label:'Intermédiaire'},{value:'advanced',label:'Avancé'}]}/>
            <Input label="Durée estimée" value={form.estimated_duration} onChange={e=>setForm({...form,estimated_duration:e.target.value})} placeholder="ex: 10 heures"/>
            <div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button><Button onClick={handleSave} loading={saving} disabled={!form.title}>Enregistrer</Button></div>
          </div>
        </Modal>

        <Modal isOpen={!!coursesModal} onClose={()=>setCoursesModal(null)} title={`Cours du parcours: ${coursesModal?.title}`} size="lg">
          <div className="space-y-4">
            <div className="space-y-2 max-h-64 overflow-y-auto">
              {pathCourses.map((c,i)=>(
                <div key={c.id} className="flex items-center gap-3 p-3 bg-gray-700 rounded-lg">
                  <span className="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center text-sm font-bold">{i+1}</span>
                  <span className="flex-1">{c.playlists?.title}</span>
                  <button onClick={()=>removeCourseFromPath(c.id)} className="p-1 hover:bg-red-600 rounded"><Icon name="Trash2" size={16}/></button>
                </div>
              ))}
              {pathCourses.length===0&&<p className="text-gray-500 text-center py-4">Aucun cours dans ce parcours</p>}
            </div>
            <div className="flex gap-2">
              <Select className="flex-1" value="" onChange={e=>addCourseToPath(e.target.value)} options={[{value:'',label:'Ajouter un cours...'},...playlists.filter(pl=>!pathCourses.find(c=>c.playlist_id===pl.id)).map(pl=>({value:pl.id,label:pl.title}))]}/>
            </div>
          </div>
        </Modal>
      </div>;
    }

      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6"><h1 className="text-2xl font-bold">Badges & Gamification</h1><Button icon="Plus" onClick={()=>{setForm({name:'',description:'',icon:'Award',color:'gold',points:10});setEditing(null);setModal(true);}}>Créer un badge</Button></div>
        
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

                <div><h3 className="font-semibold">{b.name}</h3><p className="text-sm text-gray-400">{b.points} points</p></div>
              </div>
              {b.description&&<p className="text-sm text-gray-400 mb-3">{b.description}</p>}
              <p className="text-xs text-gray-500 mb-3">{b.learner_badges?.[0]?.count||0} apprenants</p>
              <div className="flex gap-2">
                <Button variant="ghost" size="sm" icon={b.is_active?'EyeOff':'Eye'} onClick={()=>toggleActive(b)}/>
                <Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(b);setForm({name:b.name,description:b.description||'',icon:b.icon,color:b.color,points:b.points});setModal(true);}}/>
              </div>
            </Card>
          ))}
        </div>

        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title={editing?'Modifier le badge':'Créer un badge'}>
          <div className="space-y-4">

    // Emails Page (Admin)
    function EmailsPage(){
      const{can,isSuperAdmin,center}=useAuth();
      const[templates,setTemplates]=useState([]);
      const[logs,setLogs]=useState([]);
      const[learners,setLearners]=useState([]);
      const[loading,setLoading]=useState(true);
      const[tab,setTab]=useState('templates');
      const[editModal,setEditModal]=useState(null);
      const[previewModal,setPreviewModal]=useState(null);
      const[sendModal,setSendModal]=useState(null);

      const[sendResult,setSendResult]=useState(null);

      const load=useCallback(async()=>{
        const[{data:t},{data:l},{data:lrn}]=await Promise.all([
          supabase.from('email_templates').select('*').order('name'),
          supabase.from('email_logs').select('*,profiles:recipient_id(first_name,last_name)').order('created_at',{ascending:false}).limit(100),
          supabase.from('profiles').select('id,first_name,last_name,email,center_id').eq('role','learner').order('first_name')
        ]);
        setTemplates(t||[]);setLogs(l||[]);setLearners(isSuperAdmin?lrn||[]:(lrn||[]).filter(x=>x.center_id===center?.id));setLoading(false);
      },[isSuperAdmin,center?.id]);
      useEffect(()=>{load();},[load]);

      const saveTemplate=async()=>{
        setSaving(true);
        const{error}=await supabase.from('email_templates').update({
          subject:editModal.subject,
          body_html:editModal.body_html,
          is_active:editModal.is_active,
          description:editModal.description||''

        if(error)alert('Erreur: '+error.message);
        await load();setEditModal(null);setSaving(false);
      };
      
      // Envoyer un email
      const handleSendEmail=async()=>{
        if(!sendModal)return;
        const toEmail=sendForm.test_mode?sendForm.to_email:(learners.find(l=>l.id===sendForm.learner_id)?.email);
        if(!toEmail){alert('Email destinataire requis');return;}
        
        setSending(true);setSendResult(null);
        
        // Préparer les variables avec des valeurs de test ou réelles
        const learner=sendForm.test_mode?null:learners.find(l=>l.id===sendForm.learner_id);

          first_name:learner?.first_name||'[Prénom]',
          last_name:learner?.last_name||'[Nom]',
          center_name:center?.name||'CRPro',
          course_title:'[Titre du cours]',
          course_description:'[Description du cours]',
          score:'85',
          duration:'2h 30min',
          progress:'75',
          days_inactive:'7',
          pack_name:'[Pack]',
          start_date:new Date().toLocaleDateString('fr-FR'),
          end_date:new Date(Date.now()+365*24*60*60*1000).toLocaleDateString('fr-FR'),

          days_remaining:'30',
          requester_name:'[Demandeur]',
          message:'[Message]',

          template_code:sendModal.code,
          to_email:toEmail,
          to_user_id:learner?.id,
          variables

        if(result.success)await load();

            <p className="text-xs text-gray-400">Échecs</p>

    // My Certificates Page
    function MyCertificatesPage(){
      const{user,profile}=useAuth();
      const[certificates,setCertificates]=useState([]);
      const[loading,setLoading]=useState(true);
      const[generating,setGenerating]=useState(null);

      useEffect(()=>{
        const load=async()=>{
          const{data}=await supabase.from('certificates').select('*,playlists(title),profiles:learner_id(first_name,last_name)').eq('learner_id',user.id).order('issued_at',{ascending:false});
          setCertificates(data||[]);
          setLoading(false);
        };
        load();
      },[user.id]);

      const generatePDF=async(cert)=>{
        setGenerating(cert.id);
        try{
          const{jsPDF}=window.jspdf;
          const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
          
          // Fond
          doc.setFillColor(31,41,55);
          doc.rect(0,0,297,210,'F');
          
          // Bordure
          doc.setDrawColor(99,102,241);
          doc.setLineWidth(3);
          doc.rect(10,10,277,190);
          doc.setLineWidth(1);
          doc.rect(15,15,267,180);
          
          // Titre
          doc.setTextColor(255,255,255);
          doc.setFontSize(40);
          doc.setFont('helvetica','bold');
          doc.text('CERTIFICAT DE REUSSITE',148.5,45,{align:'center'});
          
          // Ligne décorative
          doc.setDrawColor(99,102,241);
          doc.setLineWidth(2);
          doc.line(80,53,217,53);
          
          // Texte
          doc.setFontSize(16);
          doc.setFont('helvetica','normal');
          doc.setTextColor(156,163,175);
          doc.text('Ce certificat est decerne a',148.5,70,{align:'center'});
          
          // Nom
          doc.setFontSize(32);
          doc.setFont('helvetica','bold');
          doc.setTextColor(255,255,255);
          doc.text(`${cert.profiles?.first_name||''} ${cert.profiles?.last_name||''}`.trim()||'Apprenant',148.5,88,{align:'center'});
          
          // Texte suite
          doc.setFontSize(16);
          doc.setFont('helvetica','normal');
          doc.setTextColor(156,163,175);
          doc.text('pour avoir complete avec succes la formation',148.5,105,{align:'center'});
          
          // Titre du cours
          doc.setFontSize(24);
          doc.setFont('helvetica','bold');
          doc.setTextColor(99,102,241);
          doc.text(cert.playlists?.title||'Formation',148.5,122,{align:'center'});
          
          // Note et Durée (si disponibles)
          let yPos=140;
          if(cert.score!==null||cert.duration_seconds){
            doc.setFontSize(14);
            doc.setFont('helvetica','normal');
            
            const infos=[];
            if(cert.score!==null){
              infos.push(`Note obtenue: ${Math.round(cert.score)}%`);
            }
            if(cert.duration_seconds){
              infos.push(`Durée de formation: ${formatDuration(cert.duration_seconds)}`);
            }
            
            if(infos.length>0){
              // Cadre pour les infos
              const boxWidth=180;
              const boxHeight=infos.length*12+10;
              doc.setFillColor(55,65,81);
              doc.roundedRect(148.5-boxWidth/2,yPos-5,boxWidth,boxHeight,3,3,'F');
              
              doc.setTextColor(255,255,255);
              infos.forEach((info,i)=>{
                doc.text(info,148.5,yPos+8+i*12,{align:'center'});
              });
              
              yPos+=boxHeight+10;
            }
          }
          
          // Date et numéro
          doc.setFontSize(12);
          doc.setFont('helvetica','normal');
          doc.setTextColor(156,163,175);
          doc.text(`Date d'emission: ${new Date(cert.issued_at||cert.completed_at).toLocaleDateString('fr-FR')}`,148.5,yPos+5,{align:'center'});
          doc.text(`N° ${cert.certificate_number}`,148.5,yPos+15,{align:'center'});
          
          // Logo/Badge
          doc.setFillColor(99,102,241);
          doc.circle(148.5,190,8,'F');
          doc.setTextColor(255,255,255);
          doc.setFontSize(10);
          doc.text('V',148.5,193,{align:'center'});
          
          // Sauvegarder le PDF avec doc.save natif
          const fileName='certificat_'+cert.certificate_number+'.pdf';
          doc.save(fileName);
          setGenerating(null);
          
        }catch(err){
          console.error('Erreur PDF:',err);
          alert('Erreur lors de la generation du PDF');
          setGenerating(null);
        }
      };

      if(loading)return<Loading/>;

      return<div>
        <h1 className="text-2xl font-bold mb-6">Mes certificats</h1>
        
        {certificates.length===0?(
          <Empty icon="Award" title="Aucun certificat" desc="Complétez des cours pour obtenir vos certificats"/>
        ):(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {certificates.map(cert=>{
              const formatDur=(s)=>{if(!s)return null;const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);return h>0?`${h}h ${m}min`:`${m}min`;};
              return(
              <Card key={cert.id} className="overflow-hidden">
                <div className="h-32 bg-gradient-to-br from-indigo-600 to-purple-700 flex items-center justify-center relative">
                  <Icon name="Award" size={64} className="text-white/80"/>
                  {cert.score!==null&&(
                    <div className="absolute top-2 right-2 bg-white/20 backdrop-blur rounded-lg px-2 py-1">
                      <span className="text-white font-bold">{Math.round(cert.score)}%</span>
                    </div>
                  )}
                </div>
                <div className="p-4">
                  <h3 className="font-semibold mb-1">{cert.playlists?.title}</h3>
                  <p className="text-sm text-gray-400 mb-2">Obtenu le {new Date(cert.issued_at||cert.completed_at).toLocaleDateString('fr-FR')}</p>
                  <div className="flex flex-wrap gap-2 mb-3">
                    {cert.score!==null&&(
                      <span className="inline-flex items-center gap-1 px-2 py-1 bg-green-500/20 text-green-400 rounded text-xs">
                        <Icon name="Star" size={12}/> Note: {Math.round(cert.score)}%
                      </span>
                    )}
                    {cert.duration_seconds&&(
                      <span className="inline-flex items-center gap-1 px-2 py-1 bg-blue-500/20 text-blue-400 rounded text-xs">
                        <Icon name="Clock" size={12}/> {formatDur(cert.duration_seconds)}
                      </span>
                    )}
                  </div>
                  <p className="text-xs text-gray-500 mb-3">N° {cert.certificate_number}</p>
                  <Button icon="Download" size="sm" onClick={()=>generatePDF(cert)} loading={generating===cert.id}>
                    Télécharger PDF
                  </Button>
                </div>
              </Card>
            );})}
          </div>
        )}
      </div>;
    }

    // ============================================================
    // PAGE: Mon Suivi (MyProgressPage) - Tableau de bord apprenant complet
    // ============================================================
    function MyProgressPage(){
      const{user,profile}=useAuth();
      const[loading,setLoading]=useState(true);
      const[activeTab,setActiveTab]=useState('overview');
      
      // Données globales
      const[enrollments,setEnrollments]=useState([]);
      const[pathEnrollments,setPathEnrollments]=useState([]);
      const[videoProgress,setVideoProgress]=useState([]);
      const[scormProgress,setScormProgress]=useState([]);
      const[quizAttempts,setQuizAttempts]=useState([]);
      const[sessions,setSessions]=useState([]);
      
      // Stats calculées
      const[stats,setStats]=useState({
        totalCourses:0,completedCourses:0,
        totalPaths:0,completedPaths:0,
        totalVideos:0,watchedVideos:0,totalWatchTime:0,
        totalScorm:0,completedScorm:0,passedScorm:0,avgScormScore:0,
        totalQuizzes:0,passedQuizzes:0,avgQuizScore:0,
        totalSessionTime:0,sessionsCount:0,lastActivity:null
      });
      
      // Graphiques
      const activityChartRef=useRef(null);
      const progressChartRef=useRef(null);
      const chartsRef=useRef({});

      // Enregistrer la session actuelle
      useEffect(()=>{
        const sessionStart=new Date();
        const sessionId=`session_${Date.now()}`;
        
        // Enregistrer le début de session dans localStorage
        const existingSessions=JSON.parse(localStorage.getItem(`lms_sessions_${user.id}`)||'[]');
        existingSessions.push({id:sessionId,start:sessionStart.toISOString(),end:null});
        localStorage.setItem(`lms_sessions_${user.id}`,JSON.stringify(existingSessions.slice(-50))); // Garder les 50 dernières
        
        // À la fermeture, mettre à jour la fin de session
        const handleUnload=()=>{
          const sessions=JSON.parse(localStorage.getItem(`lms_sessions_${user.id}`)||'[]');
          const idx=sessions.findIndex(s=>s.id===sessionId);
          if(idx!==-1){
            sessions[idx].end=new Date().toISOString();
            sessions[idx].duration=Math.round((new Date()-sessionStart)/1000);
            localStorage.setItem(`lms_sessions_${user.id}`,JSON.stringify(sessions));
          }
        };
        
        window.addEventListener('beforeunload',handleUnload);
        return()=>{
          handleUnload();
          window.removeEventListener('beforeunload',handleUnload);
        };
      },[user.id]);

      const load=useCallback(async()=>{
        // Charger les inscriptions aux cours
        const{data:enr}=await supabase.from('enrollments').select('*,playlists:playlist_id(id,title)').eq('learner_id',user.id);
        setEnrollments(enr||[]);
        
        // Charger les inscriptions aux parcours avec les cours associés
        const{data:pathEnr}=await supabase.from('path_enrollments').select('*,learning_paths(id,title,description,learning_path_courses(playlist_id))').eq('learner_id',user.id);
        
        // Charger la progression vidéo
        const{data:vp}=await supabase.from('video_progress').select('*').eq('learner_id',user.id);
        
        // Si pas de résultats par learner_id, essayer par enrollment_id
        let videoProgressData = vp || [];
        if(videoProgressData.length === 0 && enr?.length > 0) {
          const enrollmentIds = enr.map(e => e.id);
          const{data:vpByEnrollment} = await supabase.from('video_progress').select('*').in('enrollment_id', enrollmentIds);
          videoProgressData = vpByEnrollment || [];
        }
        
        // Charger les infos des vidéos si on a des progressions
        if(videoProgressData.length > 0) {
          const playlistVideoIds = [...new Set(videoProgressData.map(v => v.playlist_video_id).filter(Boolean))];
          if(playlistVideoIds.length > 0) {
            const{data:pvData} = await supabase.from('playlist_videos').select('id,video_id,videos(title,duration)').in('id', playlistVideoIds);
            const pvMap = {};
            (pvData||[]).forEach(pv => { pvMap[pv.id] = pv; });
            videoProgressData = videoProgressData.map(v => ({
              ...v,
              playlist_videos: pvMap[v.playlist_video_id] || null
            }));
          }
        }
        setVideoProgress(videoProgressData);
        
        // Charger la progression SCORM
        const{data:sp}=await supabase.from('scorm_progress').select('*').eq('learner_id',user.id);
        
        // Charger les infos des modules SCORM si on a des progressions
        let scormProgressData = sp || [];
        if(scormProgressData.length > 0) {
          const moduleIds = [...new Set(scormProgressData.map(s => s.module_id).filter(Boolean))];
          const enrollmentIds = [...new Set(scormProgressData.map(s => s.enrollment_id).filter(Boolean))];
          
          // Charger les modules SCORM
          let modulesMap = {};
          if(moduleIds.length > 0) {
            const{data:modules} = await supabase.from('scorm_modules').select('id,title,category').in('id', moduleIds);
            (modules||[]).forEach(m => { modulesMap[m.id] = m; });
          }
          
          // Charger les enrollments pour avoir les titres des cours
          let enrollmentsMap = {};
          if(enrollmentIds.length > 0) {
            const{data:enrollmentsData} = await supabase.from('enrollments').select('id,playlists:playlist_id(title)').in('id', enrollmentIds);
            (enrollmentsData||[]).forEach(e => { enrollmentsMap[e.id] = e; });
          }
          
          // Associer les données
          scormProgressData = scormProgressData.map(s => ({
            ...s,
            scorm_modules: modulesMap[s.module_id] || null,
            enrollments: enrollmentsMap[s.enrollment_id] || null
          }));
        }
        setScormProgress(scormProgressData);
        
        // Charger les tentatives de quiz
        const{data:qa}=await supabase.from('quiz_attempts').select('*').eq('learner_id',user.id);
        
        // Charger les infos des quiz si on a des tentatives
        let quizAttemptsData = qa || [];
        if(quizAttemptsData.length > 0) {
          const quizIds = [...new Set(quizAttemptsData.map(q => q.quiz_id).filter(Boolean))];
          if(quizIds.length > 0) {
            const{data:quizzes} = await supabase.from('quizzes').select('id,title,passing_score').in('id', quizIds);
            const quizzesMap = {};
            (quizzes||[]).forEach(q => { quizzesMap[q.id] = q; });
            quizAttemptsData = quizAttemptsData.map(q => ({
              ...q,
              quizzes: quizzesMap[q.quiz_id] || null
            }));
          }
        }
        setQuizAttempts(quizAttemptsData);
        
        // Charger les sessions depuis localStorage
        const localSessions=JSON.parse(localStorage.getItem(`lms_sessions_${user.id}`)||'[]');
        setSessions(localSessions);
        
        // Charger les sessions de cours depuis la base de données
        const{data:courseSessions}=await supabase.from('course_sessions').select('*').eq('learner_id',user.id);
        
        // Calculer les stats des parcours
        // Le temps de chaque parcours = cumul des temps des cours qu'il contient
        let totalPathsTime=0;
        (pathEnr||[]).forEach(p=>{
          const pathCourseIds=(p.learning_paths?.learning_path_courses||[]).map(c=>c.playlist_id);
          const pathEnrollmentIds=(enr||[]).filter(e=>pathCourseIds.includes(e.playlist_id)).map(e=>e.id);
          
          const pVideoTime=videoProgressData.filter(v=>pathEnrollmentIds.includes(v.enrollment_id)).reduce((a,v)=>a+(v.watch_time_seconds||0),0);
          const pScormTime=scormProgressData.filter(s=>pathEnrollmentIds.includes(s.enrollment_id)).reduce((a,s)=>a+parseScormTime(s.total_time),0);
          const pQuizTime=quizAttemptsData.filter(q=>pathEnrollmentIds.includes(q.enrollment_id)).reduce((a,q)=>a+(q.duration_seconds||0),0);
          
          totalPathsTime+=pVideoTime+pScormTime+pQuizTime;
        });
        
        const pathStats={
          total:(pathEnr||[]).length,
          completed:(pathEnr||[]).filter(p=>p.progress_percent===100||p.status==='completed').length,
          inProgress:(pathEnr||[]).filter(p=>p.progress_percent>0&&p.progress_percent<100).length,
          totalTime:totalPathsTime
        };
        
        // Calculer les stats
        const totalCourses=(enr||[]).length;
        const completedCourses=(enr||[]).filter(e=>e.status==='completed').length;
        const inProgressCourses=(enr||[]).filter(e=>e.status==='in_progress').length;
        
        const totalVideos=videoProgressData.length;
        const watchedVideos=videoProgressData.filter(v=>v.is_completed).length;
        const inProgressVideos=videoProgressData.filter(v=>!v.is_completed&&v.last_position_seconds>0).length;
        const totalWatchTime=videoProgressData.reduce((a,v)=>a+(v.watch_time_seconds||0),0);
        
        const totalScorm=scormProgressData.length;
        const completedScorm=scormProgressData.filter(s=>s.completion_status==='completed'||s.completion_status==='passed').length;
        const inProgressScorm=scormProgressData.filter(s=>s.completion_status==='incomplete'||s.completion_status==='browsed').length;
        const passedScorm=scormProgressData.filter(s=>s.completion_status==='passed'||s.success_status==='passed').length;
        const scormWithScore=scormProgressData.filter(s=>s.score_scaled!==null&&s.score_scaled!==undefined);
        // Calculer le score moyen en gérant les deux formats (0-1 ou 0-100)
        const avgScormScore=scormWithScore.length>0?scormWithScore.reduce((a,s)=>{
          const score=s.score_scaled||0;
          return a+(score>1?score:score*100);
        },0)/scormWithScore.length:0;
        
        // Calculer le temps total passé sur les SCORM
        const totalScormTime=scormProgressData.reduce((a,s)=>a+parseScormTime(s.total_time),0);
        
        // Calculer le temps total passé sur les quiz
        const totalQuizTime=quizAttemptsData.reduce((a,q)=>a+(q.duration_seconds||0),0);
        
        // Temps total de formation = temps vidéos + temps SCORM + temps quiz
        const totalCourseTime=totalWatchTime+totalScormTime+totalQuizTime;
        
        const quizzesTaken=[...new Set(quizAttemptsData.map(q=>q.quiz_id))].length;
        const passedQuizzes=quizAttemptsData.filter(q=>q.passed).length;
        const avgQuizScore=quizAttemptsData.length>0?quizAttemptsData.reduce((a,q)=>a+(q.score_percent||0),0)/quizAttemptsData.length:0;
        
        // Temps total = temps cours + temps SCORM (si pas déjà inclus)
        const sessionsWithDuration=localSessions.filter(s=>s.duration);
        const localSessionTime=sessionsWithDuration.reduce((a,s)=>a+(s.duration||0),0);
        const dbSessionTime=(courseSessions||[]).reduce((a,s)=>a+(s.duration_seconds||0),0);
        // Prioriser: temps des cours > temps DB > temps local
        const totalSessionTime=totalCourseTime>0?totalCourseTime:(dbSessionTime>0?dbSessionTime:localSessionTime);
        const sessionsCount=(courseSessions||[]).length||localSessions.length;
        
        // Dernière activité - utiliser last_accessed_at pour scorm_progress
        const dates=[
          ...(enr||[]).map(e=>e.updated_at),
          ...(pathEnr||[]).map(p=>p.updated_at),
          ...videoProgressData.map(v=>v.updated_at),
          ...scormProgressData.map(s=>s.last_accessed_at),
          ...quizAttemptsData.map(q=>q.created_at)
        ].filter(Boolean).sort((a,b)=>new Date(b)-new Date(a));
        const lastActivity=dates[0]||null;
        
        // Sauvegarder les parcours
        setPathEnrollments(pathEnr||[]);
        
        setStats({
          totalCourses,completedCourses,inProgressCourses,totalCourseTime,
          totalPaths:pathStats.total,completedPaths:pathStats.completed,inProgressPaths:pathStats.inProgress,pathTime:pathStats.totalTime,
          totalVideos,watchedVideos,inProgressVideos,totalWatchTime,
          totalScorm,completedScorm,inProgressScorm,passedScorm,avgScormScore,totalScormTime,
          totalQuizzes:quizzesTaken,passedQuizzes,avgQuizScore,totalQuizTime,
          totalSessionTime,sessionsCount,lastActivity
        });
        
        setLoading(false);
      },[user.id]);

      useEffect(()=>{load();},[load]);

      // Créer les graphiques
      useEffect(()=>{
        if(loading||activeTab!=='overview')return;
        
        // Détruire les anciens graphiques
        Object.values(chartsRef.current).forEach(c=>c?.destroy());
        chartsRef.current={};
        
        // Graphique d'activité par jour (7 derniers jours)
        if(activityChartRef.current){
          const last7Days=[];
          for(let i=6;i>=0;i--){
            const d=new Date();
            d.setDate(d.getDate()-i);
            last7Days.push(d.toISOString().slice(0,10));
          }
          
          const activityByDay=last7Days.map(day=>{
            const dayVideos=videoProgress.filter(v=>v.updated_at?.slice(0,10)===day).length;
            const dayScorm=scormProgress.filter(s=>s.last_accessed_at?.slice(0,10)===day).length;
            const dayQuiz=quizAttempts.filter(q=>q.created_at?.slice(0,10)===day).length;
            return dayVideos+dayScorm+dayQuiz;
          });
          
          chartsRef.current.activity=new Chart(activityChartRef.current,{
            type:'bar',
            data:{
              labels:last7Days.map(d=>{const date=new Date(d);return date.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'});}),
              datasets:[{
                label:'Activités',
                data:activityByDay,
                backgroundColor:'#6366f1'
              }]
            },
            options:{
              responsive:true,
              maintainAspectRatio:false,
              scales:{
                x:{ticks:{color:'#9ca3af'},grid:{display:false}},
                y:{ticks:{color:'#9ca3af'},grid:{color:'#374151'},beginAtZero:true}
              },
              plugins:{legend:{display:false}}
            }
          });
        }
        
        // Graphique de progression
        if(progressChartRef.current){
          chartsRef.current.progress=new Chart(progressChartRef.current,{
            type:'doughnut',
            data:{
              labels:['Cours terminés','Cours en cours','Vidéos vues','SCORM réussis'],
              datasets:[{
                data:[stats.completedCourses,stats.totalCourses-stats.completedCourses,stats.watchedVideos,stats.passedScorm],
                backgroundColor:['#22c55e','#eab308','#3b82f6','#f97316']
              }]
            },
            options:{
              responsive:true,
              maintainAspectRatio:false,
              plugins:{legend:{position:'bottom',labels:{color:'#9ca3af'}}}
            }
          });
        }
        
        return()=>{
          Object.values(chartsRef.current).forEach(c=>c?.destroy());
        };
      },[loading,activeTab,videoProgress,scormProgress,quizAttempts,stats]);

      if(loading)return<Loading/>;
      
      // Calculer le streak (jours consécutifs)
      const calculateStreak=()=>{
        const localSessions=JSON.parse(localStorage.getItem(`lms_sessions_${user.id}`)||'[]');
        const uniqueDays=[...new Set([
          ...localSessions.filter(s=>s.start).map(s=>s.start.slice(0,10)),
          ...scormProgress.filter(s=>s.last_accessed_at).map(s=>s.last_accessed_at.slice(0,10)),
          ...videoProgress.filter(v=>v.updated_at).map(v=>v.updated_at.slice(0,10)),
          ...quizAttempts.filter(q=>q.created_at).map(q=>q.created_at.slice(0,10))
        ])].sort((a,b)=>b.localeCompare(a));
        
        if(uniqueDays.length===0)return 0;
        
        let streak=0;
        const today=new Date().toISOString().slice(0,10);
        const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
        
        // Vérifier si actif aujourd'hui ou hier
        if(uniqueDays[0]!==today&&uniqueDays[0]!==yesterday)return 0;
        
        let checkDate=new Date(uniqueDays[0]);
        for(const day of uniqueDays){
          const dayDate=new Date(day);
          const diff=Math.round((checkDate-dayDate)/(86400000));
          if(diff<=1){
            streak++;
            checkDate=dayDate;
          }else break;
        }
        return streak;
      };
      
      const streak=calculateStreak();
      
      // Trouver le dernier contenu consulté
      const getLastContent=()=>{
        const activities=[
          ...scormProgress.map(s=>({type:'scorm',title:s.scorm_modules?.title||'Module SCORM',id:s.module_id,enrollmentId:s.enrollment_id,progress:(s.completion_status==='completed'||s.completion_status==='passed')?100:(s.completion_status==='incomplete'?50:0),date:s.last_accessed_at})),
          ...videoProgress.map(v=>({type:'video',title:v.playlist_videos?.videos?.title||'Vidéo',id:v.video_id,progress:v.watch_percent||0,date:v.updated_at})),
          ...enrollments.filter(e=>e.status!=='completed').map(e=>({type:'course',title:e.playlists?.title||'Cours',id:e.id,progress:e.progress_percent||0,date:e.updated_at}))
        ].filter(a=>a.date).sort((a,b)=>new Date(b.date)-new Date(a.date));
        return activities[0]||null;
      };
      
      const lastContent=getLastContent();
      
      // Message motivationnel
      const getMotivation=()=>{
        const progress=stats.totalCourses>0?Math.round((stats.completedCourses/stats.totalCourses)*100):0;
        if(progress===100)return{emoji:'🎉',text:'Félicitations ! Vous avez terminé toutes vos formations !'};
        if(progress>=75)return{emoji:'🚀',text:'Excellent travail ! Plus que quelques modules et vous aurez tout terminé !'};
        if(progress>=50)return{emoji:'💪',text:'Vous êtes à mi-chemin ! Continuez sur cette lancée !'};
        if(progress>=25)return{emoji:'🌱',text:'Bon début ! Chaque module compte, continuez !'};
        if(stats.totalCourses>0)return{emoji:'👋',text:'Prêt à commencer votre parcours de formation ?'};
        return{emoji:'📚',text:'Bienvenue ! Inscrivez-vous à des formations pour commencer.'};
      };
      
      const motivation=getMotivation();
      
      // Objectifs du jour
      const getDailyGoals=()=>{
        const goals=[];
        const today=new Date().toISOString().slice(0,10);
        const todayScorm=scormProgress.filter(s=>s.last_accessed_at?.slice(0,10)===today).length;
        const todayVideos=videoProgress.filter(v=>v.updated_at?.slice(0,10)===today).length;
        
        if(todayScorm===0&&stats.totalScorm>stats.completedScorm){
          goals.push({icon:'Package',text:'Compléter 1 module SCORM',done:false});
        }else if(todayScorm>0){
          goals.push({icon:'Package',text:`${todayScorm} module(s) SCORM aujourd'hui`,done:true});
        }
        
        if(todayVideos<3&&stats.totalVideos>stats.watchedVideos){
          goals.push({icon:'Play',text:`Regarder ${3-todayVideos} vidéo(s)`,done:todayVideos>=3});
        }else if(todayVideos>=3){
          goals.push({icon:'Play',text:`${todayVideos} vidéos aujourd'hui`,done:true});
        }
        
        if(streak>0){
          goals.push({icon:'Flame',text:`Maintenir votre série de ${streak} jour(s)`,done:true});
        }else{
          goals.push({icon:'Flame',text:'Démarrer une série de jours consécutifs',done:false});
        }
        
        return goals;
      };
      
      const dailyGoals=getDailyGoals();

      return<div>
        {/* Header avec message motivationnel */}
        <div className="flex items-center justify-between mb-6">
          <div>
            <h1 className="text-2xl font-bold flex items-center gap-2">
              <span>{motivation.emoji}</span>
              Bonjour{profile?.first_name?`, ${profile.first_name}`:''} !
            </h1>
            <p className="text-gray-400 text-sm">{motivation.text}</p>
          </div>
          <div className="flex items-center gap-4">
            {streak>0&&(
              <div className="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-orange-500/20 to-red-500/20 border border-orange-500/30 rounded-xl">
                <span className="text-2xl">🔥</span>
                <div>
                  <p className="font-bold text-orange-400">{streak} jour{streak>1?'s':''}</p>
                  <p className="text-xs text-gray-400">série en cours</p>
                </div>
              </div>
            )}
            {stats.lastActivity&&<p className="text-sm text-gray-500">Dernière activité: {new Date(stats.lastActivity).toLocaleDateString('fr-FR')}</p>}
          </div>
        </div>
        
        {/* Widget Reprendre + Objectifs */}
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
          {/* Reprendre là où j'en étais */}
          {lastContent&&lastContent.progress<100?(
            <Card className="lg:col-span-2 p-6 bg-gradient-to-br from-indigo-600/20 to-purple-600/20 border-indigo-500/30">
              <div className="flex items-start gap-4">
                <div className="w-16 h-16 bg-indigo-600/30 rounded-xl flex items-center justify-center shrink-0">
                  <Icon name={lastContent.type==='scorm'?'Package':lastContent.type==='video'?'Play':'BookOpen'} size={32} className="text-indigo-400"/>
                </div>
                <div className="flex-1 min-w-0">
                  <p className="text-xs text-indigo-400 uppercase tracking-wide mb-1">▶️ Reprendre là où vous en étiez</p>
                  <h3 className="font-semibold text-lg truncate">{lastContent.title}</h3>
                  <div className="flex items-center gap-3 mt-2">
                    <div className="flex-1 max-w-xs">
                      <div className="w-full bg-gray-700 rounded-full h-2">
                        <div className="bg-indigo-500 rounded-full h-2 transition-all" style={{width:`${lastContent.progress}%`}}/>
                      </div>
                    </div>
                    <span className="text-sm text-gray-400">{Math.round(lastContent.progress)}%</span>
                  </div>
                </div>
                <Button onClick={async()=>{
                  // Trouver et ouvrir le cours correspondant
                  if(lastContent.type==='course'){
                    // C'est un enrollment direct
                    const enrollment=enrollments.find(e=>e.id===lastContent.id);
                    if(enrollment){
                      openCourse(enrollment);
                    }else{
                      setActiveTab('courses');
                    }
                  }else if(lastContent.type==='scorm'&&lastContent.enrollmentId){
                    // SCORM avec enrollment_id
                    const enrollment=enrollments.find(e=>e.id===lastContent.enrollmentId);
                    if(enrollment){
                      openCourse(enrollment);
                    }else{
                      setActiveTab('courses');
                    }
                  }else if(lastContent.type==='video'){
                    // Vidéo - trouver l'enrollment via videoProgress
                    const vp=videoProgress.find(v=>v.video_id===lastContent.id);
                    if(vp?.enrollment_id){
                      const enrollment=enrollments.find(e=>e.id===vp.enrollment_id);
                      if(enrollment){
                        openCourse(enrollment);
                        return;
                      }
                    }
                    setActiveTab('courses');
                  }else{
                    setActiveTab('courses');
                  }
                }} className="shrink-0">
                  Continuer <Icon name="ArrowRight" size={16} className="ml-1"/>
                </Button>
              </div>
            </Card>
          ):(
            <Card className="lg:col-span-2 p-6 bg-gradient-to-br from-green-600/20 to-emerald-600/20 border-green-500/30">
              <div className="flex items-center gap-4">
                <div className="w-16 h-16 bg-green-600/30 rounded-xl flex items-center justify-center">
                  <Icon name="CheckCircle" size={32} className="text-green-400"/>
                </div>
                <div>
                  <p className="text-xs text-green-400 uppercase tracking-wide mb-1">✨ Tout est à jour</p>
                  <h3 className="font-semibold text-lg">Aucune formation en cours</h3>
                  <p className="text-sm text-gray-400">Explorez le catalogue pour de nouvelles formations</p>
                </div>
              </div>
            </Card>
          )}
          
          {/* Objectifs du jour */}
          <Card className="p-4">
            <h4 className="font-semibold text-sm text-gray-400 uppercase tracking-wide mb-3">🎯 Objectifs du jour</h4>
            <div className="space-y-2">
              {dailyGoals.map((goal,i)=>(
                <div key={i} className={`flex items-center gap-3 p-2 rounded-lg ${goal.done?'bg-green-500/10':'bg-gray-700/50'}`}>
                  <div className={`w-6 h-6 rounded-full flex items-center justify-center ${goal.done?'bg-green-500':'bg-gray-600'}`}>
                    {goal.done?<Icon name="Check" size={14}/>:<Icon name={goal.icon} size={14}/>}
                  </div>
                  <span className={`text-sm ${goal.done?'text-green-400 line-through':'text-gray-300'}`}>{goal.text}</span>
                </div>
              ))}
            </div>
            {dailyGoals.filter(g=>g.done).length===dailyGoals.length&&(
              <div className="mt-3 p-2 bg-green-500/20 rounded-lg text-center">
                <span className="text-green-400 text-sm font-medium">🎉 Tous les objectifs atteints !</span>
              </div>
            )}
          </Card>
        </div>

        {/* Stats principales - Temps total en premier */}
        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4 mb-6">
          <Card className="p-4 text-center bg-gradient-to-br from-blue-600/20 to-blue-800/20 border-blue-500/30">
            <Icon name="Clock" size={24} className="mx-auto text-blue-400 mb-2"/>
            <p className="text-2xl font-bold text-blue-400">{formatDuration(stats.totalCourseTime||0)}</p>
            <p className="text-xs text-gray-400">Temps total formation</p>
            {(stats.totalScormTime>0||stats.totalQuizTime>0)&&<p className="text-xs text-orange-400 mt-1">
              {stats.totalScormTime>0&&`${formatDuration(stats.totalScormTime)} SCORM`}
              {stats.totalScormTime>0&&stats.totalQuizTime>0&&' + '}
              {stats.totalQuizTime>0&&`${formatDuration(stats.totalQuizTime)} Quiz`}
            </p>}
          </Card>
          <Card className="p-4 text-center">
            <Icon name="BookOpen" size={24} className="mx-auto text-indigo-400 mb-2"/>
            <p className="text-2xl font-bold">{stats.completedCourses}<span className="text-base text-gray-500">/{stats.totalCourses}</span></p>
            <p className="text-xs text-gray-400">Cours terminés</p>
            {stats.inProgressCourses>0&&<p className="text-xs text-yellow-400 mt-1">{stats.inProgressCourses} en cours</p>}
          </Card>
          {stats.totalPaths>0&&(
            <Card className="p-4 text-center">
              <Icon name="Route" size={24} className="mx-auto text-purple-400 mb-2"/>
              <p className="text-2xl font-bold">{stats.completedPaths}<span className="text-base text-gray-500">/{stats.totalPaths}</span></p>
              <p className="text-xs text-gray-400">Parcours terminés</p>
              {stats.inProgressPaths>0&&<p className="text-xs text-yellow-400 mt-1">{stats.inProgressPaths} en cours</p>}
            </Card>
          )}
          <Card className="p-4 text-center">
            <Icon name="Target" size={24} className="mx-auto text-green-400 mb-2"/>
            <p className="text-2xl font-bold">{stats.totalCourses>0?Math.round((stats.completedCourses/stats.totalCourses)*100):0}%</p>

                  <Icon name="Shield" size={24} className="text-blue-400"/>

                  <Icon name="Clock" size={20} className="text-yellow-400"/>
