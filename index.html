            <Button icon="UserPlus" onClick={()=>{resetCreateForm();setCreateModal(true);}}>Ajouter</Button>
            <Button variant="secondary" icon="Upload" onClick={()=>setImportModal(true)}>Importer</Button>
          </div>
        </div>
        
        {/* Filtres */}
        <Card className="p-4 mb-6">
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <Input icon="Search" placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)}/>
            <Select value={filterRole} onChange={e=>setFilterRole(e.target.value)} options={[
              {value:'',label:'Tous les rôles'},
              {value:'learner',label:'Apprenants'},
              {value:'trainer',label:'Formateurs'},
              {value:'center_admin',label:'Admins de centre'},
              {value:'super_admin',label:'Super Admins'}
            ]}/>
            {isSuperAdmin&&<Select value={filterCenter} onChange={e=>setFilterCenter(e.target.value)} options={[
              {value:'',label:'Tous les centres'},
              ...centers.map(c=>({value:c.id,label:c.name}))
            ]}/>}
            <Select value={`${sortBy}-${sortDir}`} onChange={e=>{const[field,dir]=e.target.value.split('-');setSortBy(field);setSortDir(dir);}} options={[
              {value:'created_at-desc',label:'Plus récents'},
              {value:'created_at-asc',label:'Plus anciens'},
              {value:'name-asc',label:'Nom A-Z'},
              {value:'name-desc',label:'Nom Z-A'},
              {value:'email-asc',label:'Email A-Z'},
              {value:'role-asc',label:'Rôle A-Z'}
            ]}/>
          </div>
        </Card>
        
        {/* Tableau */}
        <Card>
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead className="bg-gray-750">
                <tr>
                  <th className="p-4 w-12">
                    <input type="checkbox" checked={allSelected} onChange={()=>toggleSelectAll(filtered)} className="w-4 h-4 rounded bg-gray-700 border-gray-600 text-indigo-600 focus:ring-indigo-500"/>
                  </th>
                  <th className="text-left p-4 font-medium text-gray-400 cursor-pointer hover:text-white" onClick={()=>handleSort('name')}>
                    <div className="flex items-center gap-1">Utilisateur {sortBy==='name'&&<Icon name={sortDir==='asc'?'ChevronUp':'ChevronDown'} size={14}/>}</div>
                  </th>
                  <th className="text-left p-4 font-medium text-gray-400 cursor-pointer hover:text-white" onClick={()=>handleSort('role')}>
                    <div className="flex items-center gap-1">Rôle {sortBy==='role'&&<Icon name={sortDir==='asc'?'ChevronUp':'ChevronDown'} size={14}/>}</div>
                  </th>
                  {isSuperAdmin&&<th className="text-left p-4 font-medium text-gray-400 cursor-pointer hover:text-white" onClick={()=>handleSort('center')}>
                    <div className="flex items-center gap-1">Centre {sortBy==='center'&&<Icon name={sortDir==='asc'?'ChevronUp':'ChevronDown'} size={14}/>}</div>
                  </th>}
                  <th className="text-left p-4 font-medium text-gray-400 cursor-pointer hover:text-white" onClick={()=>handleSort('created_at')}>
                    <div className="flex items-center gap-1">Créé le {sortBy==='created_at'&&<Icon name={sortDir==='asc'?'ChevronUp':'ChevronDown'} size={14}/>}</div>
                  </th>
                  <th className="text-right p-4"></th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-700">
                {filtered.length===0?(
                  <tr><td colSpan={isSuperAdmin?6:5} className="p-8 text-center text-gray-500">Aucun utilisateur trouvé</td></tr>
                ):filtered.map(u=>(
                  <tr key={u.id} className={`hover:bg-gray-750/50 ${selectedUsers.includes(u.id)?'bg-indigo-500/10':''}`}>
                    <td className="p-4">
                      {u.id!==profile?.id&&u.role!=='super_admin'?(
                        <input type="checkbox" checked={selectedUsers.includes(u.id)} onChange={()=>toggleSelect(u.id)} className="w-4 h-4 rounded bg-gray-700 border-gray-600 text-indigo-600 focus:ring-indigo-500"/>
                      ):<span className="w-4 h-4 block"></span>}
                    </td>
                    <td className="p-4">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center"><Icon name="User" size={18}/></div>
                        <div>
                          <p className="font-medium">{u.first_name} {u.last_name}</p>
                          <p className="text-sm text-gray-400">{u.email}</p>
                        </div>
                      </div>
                    </td>
                    <td className="p-4"><RoleBadge role={u.role}/></td>
                    {isSuperAdmin&&<td className="p-4 text-gray-400">{u.centers?.name||'-'}</td>}
                    <td className="p-4 text-gray-400 text-sm">{u.created_at?new Date(u.created_at).toLocaleDateString('fr-FR'):'-'}</td>
                    <td className="p-4 text-right">
                      <div className="flex justify-end gap-1">
                        <Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(u);setForm({email:u.email,first_name:u.first_name||'',last_name:u.last_name||'',role:u.role,center_id:u.center_id||''});setModal(true);}}/>
                        {u.id!==profile?.id&&u.role!=='super_admin'&&<Button variant="ghost" size="sm" icon="Trash2" className="text-red-400 hover:text-red-300 hover:bg-red-500/10" onClick={()=>setDeleteModal(u)}/>}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {filtered.length>0&&<div className="p-4 border-t border-gray-700 text-sm text-gray-400">
            {selectedUsers.length>0?`${selectedUsers.length} sélectionné${selectedUsers.length>1?'s':''} sur `:''}{filtered.length} utilisateur{filtered.length>1?'s':''}
          </div>}
        </Card>
        
        {/* Modal de suppression par lot */}
        <Modal isOpen={bulkDeleteModal} onClose={()=>setBulkDeleteModal(false)} title="Supprimer les utilisateurs sélectionnés">
          <div className="space-y-4">
            <div className="p-4 bg-red-500/10 border border-red-500/30 rounded-lg">
              <div className="flex items-center gap-3 mb-3">
                <div className="w-12 h-12 bg-red-500/20 rounded-full flex items-center justify-center">
                  <Icon name="AlertTriangle" size={24} className="text-red-400"/>
                </div>
                <div>
                  <p className="font-semibold text-red-400">Attention !</p>
                  <p className="text-sm text-gray-400">Cette action est irréversible.</p>
                </div>
              </div>
              <p className="text-sm text-gray-300">
                Vous êtes sur le point de supprimer <strong className="text-white">{selectedUsers.length} utilisateur{selectedUsers.length>1?'s':''}</strong>.
              </p>
            </div>
            <div className="bg-gray-700/50 p-3 rounded-lg max-h-48 overflow-y-auto">
              <p className="font-medium text-gray-300 mb-2">Utilisateurs à supprimer :</p>
              <ul className="space-y-1 text-sm">
                {selectedUsers.map(id=>{
                  const u=users.find(user=>user.id===id);
                  return u?<li key={id} className="flex items-center gap-2"><Icon name="User" size={14} className="text-gray-500"/>{u.first_name} {u.last_name} <span className="text-gray-500">({u.email})</span></li>:null;
                })}
              </ul>
            </div>
            <div className="flex justify-end gap-3">
              <Button variant="secondary" onClick={()=>setBulkDeleteModal(false)}>Annuler</Button>
              <Button variant="primary" className="bg-red-600 hover:bg-red-700" icon="Trash2" onClick={handleBulkDelete} loading={deleting}>Supprimer {selectedUsers.length} utilisateur{selectedUsers.length>1?'s':''}</Button>
            </div>
          </div>
        </Modal>
        
        {/* Modal de création d'utilisateur */}
        <Modal isOpen={createModal} onClose={()=>{setCreateModal(false);resetCreateForm();}} title="Ajouter un utilisateur">
          <div className="space-y-4">
            {!createResult?(
              <>
                <Input label="Email *" type="email" icon="Mail" placeholder="email@exemple.com" value={createForm.email} onChange={e=>setCreateForm({...createForm,email:e.target.value})}/>
                <div className="grid grid-cols-2 gap-4">
                  <Input label="Prénom *" placeholder="Jean" value={createForm.first_name} onChange={e=>setCreateForm({...createForm,first_name:e.target.value})}/>
                  <Input label="Nom *" placeholder="Dupont" value={createForm.last_name} onChange={e=>setCreateForm({...createForm,last_name:e.target.value})}/>
                </div>
                <div className="relative">
                  <Input label="Mot de passe" type="text" icon="Lock" placeholder="Laisser vide pour générer" value={createForm.password} onChange={e=>setCreateForm({...createForm,password:e.target.value})}/>
                  <button type="button" onClick={()=>setCreateForm({...createForm,password:generatePassword()})} className="absolute right-2 top-8 text-xs text-indigo-400 hover:text-indigo-300">Générer</button>
                </div>
                <Select label="Rôle *" value={createForm.role} onChange={e=>setCreateForm({...createForm,role:e.target.value})} options={[
                  {value:'learner',label:'Apprenant'},
                  {value:'trainer',label:'Formateur'},
                  ...(isSuperAdmin?[
                    {value:'center_admin',label:'Admin de centre'},
                    {value:'super_admin',label:'Super Admin'}
                  ]:[])
                ]}/>
                {isSuperAdmin&&<Select label="Centre" value={createForm.center_id} onChange={e=>setCreateForm({...createForm,center_id:e.target.value})} options={[{value:'',label:'Aucun centre'},...centers.map(c=>({value:c.id,label:c.name}))]}/>}
                <div className="flex justify-end gap-3 pt-2">
                  <Button variant="secondary" onClick={()=>{setCreateModal(false);resetCreateForm();}}>Annuler</Button>
                  <Button icon="UserPlus" onClick={handleCreate} loading={creating}>Créer l'utilisateur</Button>
                </div>
              </>
            ):(
              <div className="space-y-4">
                {createResult.success?(
                  <>
                    <div className="p-4 bg-green-500/10 border border-green-500/30 rounded-lg text-center">
                      <div className="w-16 h-16 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-3">
                        <Icon name="CheckCircle" size={32} className="text-green-400"/>
                      </div>
                      <p className="font-semibold text-green-400 text-lg">Utilisateur créé avec succès !</p>
                    </div>
                    <div className="bg-gray-700/50 p-4 rounded-lg space-y-3">
                      <div><p className="text-xs text-gray-400">Email</p><p className="font-medium">{createResult.email}</p></div>
                      <div><p className="text-xs text-gray-400">Mot de passe</p><div className="flex items-center gap-2"><code className="bg-gray-800 px-3 py-1 rounded font-mono text-indigo-400">{createResult.password}</code><Button variant="ghost" size="sm" icon="Copy" onClick={()=>{navigator.clipboard.writeText(createResult.password);}}></Button></div></div>
                    </div>
                    <Alert type="warning">⚠️ Notez ce mot de passe, il ne sera plus affiché.</Alert>
                    <div className="flex justify-end gap-3">
                      <Button variant="secondary" onClick={()=>{setCreateModal(false);resetCreateForm();}}>Fermer</Button>
                      <Button icon="UserPlus" onClick={()=>{resetCreateForm();}}>Ajouter un autre</Button>
                    </div>
                  </>
                ):(
                  <>
                    <div className="p-4 bg-red-500/10 border border-red-500/30 rounded-lg text-center">
                      <div className="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-3">
                        <Icon name="XCircle" size={32} className="text-red-400"/>
                      </div>
                      <p className="font-semibold text-red-400">Erreur lors de la création</p>
                      <p className="text-sm text-gray-400 mt-2">{createResult.error}</p>
                    </div>
                    <div className="flex justify-end gap-3">
                      <Button variant="secondary" onClick={()=>{setCreateModal(false);resetCreateForm();}}>Fermer</Button>
                      <Button onClick={()=>setCreateResult(null)}>Réessayer</Button>
                    </div>
                  </>
                )}
              </div>
            )}
          </div>
        </Modal>
        
        {/* Modal de confirmation de suppression */}
        <Modal isOpen={!!deleteModal} onClose={()=>setDeleteModal(null)} title="Supprimer l'utilisateur">
          <div className="space-y-4">
            <div className="p-4 bg-red-500/10 border border-red-500/30 rounded-lg">
              <div className="flex items-center gap-3 mb-3">
                <div className="w-12 h-12 bg-red-500/20 rounded-full flex items-center justify-center">
                  <Icon name="AlertTriangle" size={24} className="text-red-400"/>
                </div>
                <div>
                  <p className="font-semibold text-red-400">Attention !</p>
                  <p className="text-sm text-gray-400">Cette action est irréversible.</p>
                </div>
              </div>
              <p className="text-sm text-gray-300">
                Vous êtes sur le point de supprimer l'utilisateur :
              </p>
              <p className="font-medium mt-2">{deleteModal?.first_name} {deleteModal?.last_name}</p>
              <p className="text-sm text-gray-400">{deleteModal?.email}</p>
            </div>
            <div className="bg-gray-700/50 p-3 rounded-lg text-sm text-gray-400">
              <p className="font-medium text-gray-300 mb-1">Données qui seront supprimées :</p>
              <ul className="list-disc list-inside space-y-1">
                <li>Inscriptions aux cours</li>
                <li>Progression vidéo et SCORM</li>
                <li>Résultats de quiz</li>
                <li>Badges et points</li>
                <li>Notes et certificats</li>
              </ul>
            </div>
            <div className="flex justify-end gap-3">
              <Button variant="secondary" onClick={()=>setDeleteModal(null)}>Annuler</Button>
              <Button variant="primary" className="bg-red-600 hover:bg-red-700" icon="Trash2" onClick={handleDelete} loading={deleting}>Supprimer définitivement</Button>
            </div>
          </div>
        </Modal>
        
        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title="Modifier"><div className="space-y-4"><Input label="Email" value={form.email} disabled/><div className="grid grid-cols-2 gap-4"><Input label="Prénom" value={form.first_name} onChange={e=>setForm({...form,first_name:e.target.value})}/><Input label="Nom" value={form.last_name} onChange={e=>setForm({...form,last_name:e.target.value})}/></div><Select label="Rôle" value={form.role} onChange={e=>setForm({...form,role:e.target.value})} options={Object.entries(ROLE_LABELS).filter(([r])=>isSuperAdmin||r!=='super_admin').map(([v,l])=>({value:v,label:l}))}/>{isSuperAdmin&&<Select label="Centre" value={form.center_id} onChange={e=>setForm({...form,center_id:e.target.value})} options={[{value:'',label:'Aucun'},...centers.map(c=>({value:c.id,label:c.name}))]}/>}<div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button><Button onClick={handleSave} loading={saving}>Enregistrer</Button></div></div></Modal>

        <Modal isOpen={importModal} onClose={()=>{setImportModal(false);setImportData([]);setImportResult(null);}} title="Importer des utilisateurs" size="lg">
          <div className="space-y-4">
            <Alert type="info"><p className="font-medium mb-1">✨ Import automatique</p><p className="text-sm">Crée les comptes et assigne les rôles.</p></Alert>
            <div className="bg-gray-700/50 rounded-lg p-4"><p className="text-sm text-gray-400 mb-2">Colonnes : Email*, Prénom*, Nom*, Rôle, Mot de passe, Centre</p><Button variant="ghost" size="sm" icon="Download" onClick={downloadTemplate}>Télécharger le template</Button></div>
            <div className="border-2 border-dashed border-gray-600 rounded-lg p-8 text-center"><input type="file" ref={fileInputRef} onChange={handleFileSelect} accept=".xlsx,.xls,.csv" className="hidden"/><Icon name="Users" size={48} className="mx-auto text-gray-500 mb-4"/><p className="text-gray-400 mb-4">Glissez un fichier Excel ou</p><Button variant="secondary" onClick={()=>fileInputRef.current?.click()}>Parcourir</Button></div>
            {importData.length>0&&!importResult&&(<div><h3 className="font-medium mb-2">Aperçu ({importData.filter(d=>d._valid).length} valides)</h3><div className="max-h-48 overflow-y-auto bg-gray-700/50 rounded-lg"><table className="w-full text-sm"><thead className="bg-gray-700 sticky top-0"><tr><th className="p-2 text-left">Email</th><th className="p-2 text-left">Nom</th><th className="p-2 text-left">Rôle</th></tr></thead><tbody>{importData.filter(d=>d._valid).map((row,i)=>(<tr key={i}><td className="p-2">{row.email}</td><td className="p-2">{row.first_name} {row.last_name}</td><td className="p-2"><RoleBadge role={row.role}/></td></tr>))}</tbody></table></div></div>)}
            {importResult&&(<div className="space-y-3">{importResult.errorMessage?(<Alert type="error"><p className="font-medium">❌ Erreur : {importResult.errorMessage}</p></Alert>):(<Alert type={importResult.errors>0?'warning':'success'}><p className="font-medium">{importResult.created>0&&<span className="text-green-400">✅ {importResult.created} créé(s) </span>}{importResult.updated>0&&<span className="text-blue-400">🔄 {importResult.updated} mis à jour </span>}{importResult.errors>0&&<span className="text-yellow-400">⚠️ {importResult.errors} erreur(s)</span>}</p></Alert>)}{importResult.results?.some(r=>r.password)&&(<div className="bg-indigo-500/20 p-4 rounded-lg"><p className="text-sm text-indigo-300 mb-2">⚠️ Des mots de passe ont été générés.</p><Button variant="secondary" size="sm" icon="Download" onClick={exportResults}>Exporter les résultats</Button></div>)}</div>)}
            <div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>{setImportModal(false);setImportData([]);setImportResult(null);}}>Fermer</Button>{importData.length>0&&!importResult&&(<Button icon="Upload" onClick={handleImport} loading={importLoading} disabled={importData.filter(d=>d._valid).length===0}>Importer {importData.filter(d=>d._valid).length} utilisateur(s)</Button>)}</div>
          </div>
        </Modal>
      </div>;
    }

    // Videos
    const Tabs=({tabs,active,onChange})=><div className="flex gap-1 p-1 bg-gray-700 rounded-lg mb-6">{tabs.map(t=><button key={t.id} onClick={()=>onChange(t.id)} className={`px-4 py-2 rounded-md text-sm font-medium transition-all flex items-center gap-2 ${active===t.id?'bg-indigo-600 text-white':'text-gray-400 hover:text-white'}`}><Icon name={t.icon} size={16}/>{t.label}</button>)}</div>;

    function VideosPage(){
      const{center,isSuperAdmin,profile,can}=useAuth();
      const[activeTab,setActiveTab]=useState('videos');
      const[videos,setVideos]=useState([]);
      const[scormModules,setScormModules]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[importModal,setImportModal]=useState(false);
      const[detailModal,setDetailModal]=useState(null);
      const[editing,setEditing]=useState(null);
      const[search,setSearch]=useState('');
      const[form,setForm]=useState({title:'',vimeo_id:'',duration:'',category:'',description:'',sort_order:'',tags:'',theme:'',thumbnail_url:''});
      const[saving,setSaving]=useState(false);
      const[importData,setImportData]=useState([]);
      const[importLoading,setImportLoading]=useState(false);
      const[importResult,setImportResult]=useState(null);
      const[attachments,setAttachments]=useState([]);
      const[chapters,setChapters]=useState([]);
      const[newAttachment,setNewAttachment]=useState({title:'',file:null});
      const[newChapter,setNewChapter]=useState({title:'',timestamp:'',description:''});
      const[uploading,setUploading]=useState(false);
      const[scormModal,setScormModal]=useState(false);
      const[scormEditing,setScormEditing]=useState(null);
      const[scormForm,setScormForm]=useState({title:'',description:'',module_type:'scorm12',package_url:'',entry_point:'sco_0.html',category:'',version:'',remote_url:''});
      const[scormSaving,setScormSaving]=useState(false);
      const[scormZipParsing,setScormZipParsing]=useState(false);
      const[scormZipFile,setScormZipFile]=useState(null);
      const fileInputRef=useRef(null);
      const attachmentFileRef=useRef(null);
      const scormFileRef=useRef(null);
      const scormZipRef=useRef(null);

      // Parser un fichier ZIP SCORM Dispatch
      const parseScormZip=async(file)=>{
        // Vérifier que JSZip est chargé
        if(typeof JSZip === 'undefined'){
          alert('Bibliothèque ZIP en cours de chargement. Veuillez réessayer dans quelques secondes.');
          return;
        }
        
        setScormZipParsing(true);
        setScormZipFile(file);
        
        const lmsOrigin = window.location.origin; // https://www.crpro.app
        
        try {
          const zip = await JSZip.loadAsync(file);
          let manifest = null;
          let scoHtmlContent = null;
          let entryPoint = 'sco_0.html';
          const filesToUpload = [];
          
          // Chercher les fichiers dans le ZIP
          const fileNames = Object.keys(zip.files);
          for(const filename of fileNames){
            const zipEntry = zip.files[filename];
            if(zipEntry.dir) continue;
            
            const name = filename.toLowerCase();
            const actualName = filename.split('/').pop();
            
            if(name.endsWith('imsmanifest.xml')){
              manifest = await zipEntry.async('string');
              filesToUpload.push({name:'imsmanifest.xml', content:manifest, type:'application/xml'});
            }
            if(name.endsWith('.html')){
              let content = await zipEntry.async('string');
              
              // Injecter lms_origin dans le fichier HTML pour Codes Rousseau
              if(content.includes('layer2.js') || content.includes('data-source')){
                
                // Méthode 1: Définir window.lms_origin DANS le script de chargement de layer2.js
                content = content.replace(
                  "var url = 'https://lms.codesrousseau.fr",
                  "window.lms_origin = '" + lmsOrigin + "'; window.LMS_ORIGIN = '" + lmsOrigin + "'; var url = 'https://lms.codesrousseau.fr"
                );
                
                // Méthode 2: Ajouter lms_origin à l'URL de layer2.js
                content = content.replace(
                  /layer2\.js\?cacherev=/g,
                  'layer2.js?lms_origin=' + encodeURIComponent(lmsOrigin) + '&cacherev='
                );
                
                // NE PAS modifier data-clientid - le laisser vide comme l'original
                // Codes Rousseau détermine le client à partir du domaine lms_origin
                
                scoHtmlContent = content;
                entryPoint = actualName;
                
                console.log('Modified HTML with lms_origin injection (data-clientid unchanged)');
              }
              
              filesToUpload.push({name:actualName, content:content, type:'text/html; charset=utf-8'});
            }
          }
          
          if(!manifest){
            alert('Fichier imsmanifest.xml non trouvé dans le ZIP');
            setScormZipParsing(false);
            return;
          }
          
          // Parser le manifest XML
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(manifest, 'text/xml');
          
          // Extraire le titre
          const titleEl = xmlDoc.querySelector('title langstring') || xmlDoc.querySelector('title');
          const title = titleEl?.textContent?.trim() || file.name.replace('.zip','');
          
          // Générer un slug unique
          const slug = title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+/g,'-').substring(0,50) + '-' + Date.now();
          
          // Détecter le type SCORM
          const schemaVersion = xmlDoc.querySelector('schemaversion')?.textContent || '';
          let moduleType = 'scorm12';
          if(schemaVersion.includes('2004')) moduleType = 'scorm2004';
          
          // Extraire l'URL distante
          let remoteUrl = '';
          if(scoHtmlContent){
            const match = scoHtmlContent.match(/data-source=["']([^"']+)["']/);
            if(match) remoteUrl = match[1];
          }
          
          // Uploader vers Supabase Storage
          let packageUrl = '';
          try {
            console.log('Uploading modified SCORM files with lms_origin:', lmsOrigin);
            for(const f of filesToUpload){
              const filePath = slug + '/' + f.name;
              const blob = new Blob([f.content], {type: f.type});
              const result = await supabase.storage.from('scorm-dispatch').upload(filePath, blob, {
                contentType: f.type,
                upsert: true
              });
              if(result.error){
                console.error('Upload error:', f.name, result.error);
                if(result.error.message && result.error.message.includes('bucket')){
                  alert('Le bucket "scorm-dispatch" n\'existe pas. Créez-le dans Supabase Storage.');
                  break;
                }
              } else {
                console.log('Uploaded:', filePath);
              }
            }
            const urlResult = supabase.storage.from('scorm-dispatch').getPublicUrl(slug + '/' + entryPoint);
            packageUrl = urlResult.data?.publicUrl || '';
          } catch(e) {
            console.error('Storage error:', e);
            packageUrl = remoteUrl;
          }
          
          // Mettre à jour le formulaire
          setScormForm(prev => ({
            ...prev,
            title: title,
            module_type: moduleType,
            entry_point: entryPoint,
            remote_url: remoteUrl,
            package_url: packageUrl || remoteUrl
          }));
          
          console.log('SCORM parsed with lms_origin injection:', {title, moduleType, entryPoint, remoteUrl, packageUrl, lmsOrigin});
          
        } catch(err) {
          console.error('ZIP parse error:', err);
          alert('Erreur lecture ZIP: ' + err.message);
        }
        
        setScormZipParsing(false);
      };

      const load=useCallback(async()=>{
        // Charger les vidéos
        let q=supabase.from('videos').select('*').order('sort_order',{ascending:true,nullsFirst:false}).order('created_at',{ascending:false});
        if(!isSuperAdmin&&center?.id)q=q.eq('center_id',center.id);
        const{data}=await q;
        setVideos(data||[]);
        
        // Charger les modules SCORM (avec gestion d'erreur si table n'existe pas)
        try {
          let qs=supabase.from('scorm_modules').select('*').order('created_at',{ascending:false});
          if(!isSuperAdmin&&center?.id)qs=qs.eq('center_id',center.id);
          const{data:scorm,error}=await qs;
          if(!error)setScormModules(scorm||[]);
        } catch(e) { console.log('SCORM tables not yet created'); }
        
        setLoading(false);
      },[isSuperAdmin,center?.id]);
      useEffect(()=>{load();},[load]);
      const resetForm=()=>setForm({title:'',vimeo_id:'',duration:'',category:'',description:'',sort_order:'',tags:'',theme:'',thumbnail_url:''});
      const resetScormForm=()=>{setScormForm({title:'',description:'',module_type:'scorm12',package_url:'',entry_point:'sco_0.html',category:'',version:'',remote_url:''});setScormZipFile(null);};

      // Gestion SCORM
      const handleScormSave=async()=>{
        setScormSaving(true);
        const payload={
          title:scormForm.title,
          description:scormForm.description||null,
          module_type:scormForm.module_type,
          package_url:scormForm.package_url||null,
          entry_point:scormForm.entry_point||'sco_0.html',
          category:scormForm.category||null,
          center_id:center?.id||null,
          created_by:profile?.id,
          metadata:scormForm.remote_url?{remote_url:scormForm.remote_url,dispatch:true}:{}
        };
        
        console.log('Saving SCORM module:', payload);
        
        let result;
        if(scormEditing){
          result = await supabase.from('scorm_modules').update(payload).eq('id',scormEditing.id);
        }else{
          result = await supabase.from('scorm_modules').insert(payload);
        }
        
        if(result.error){
          console.error('SCORM save error:', result.error);
          alert('Erreur lors de l\'enregistrement: ' + result.error.message + '\n\nVérifiez que les tables SCORM sont créées.');
          setScormSaving(false);
          return;
        }
        
        console.log('SCORM module saved successfully');
        await load();
        setScormModal(false);
        resetScormForm();
        setScormEditing(null);
        setScormSaving(false);
      };
      
      const handleScormDelete=async(id)=>{
        if(!confirm('Supprimer ce module SCORM ?'))return;
        await supabase.from('scorm_modules').delete().eq('id',id);
        load();
      };
      
      const handleScormFileUpload=async(e)=>{
        const file=e.target.files[0];
        if(!file)return;
        
        try{
          const fileName=`scorm/${center?.id||'global'}/${Date.now()}_${file.name}`;
          const{data:uploadData,error:uploadError}=await supabase.storage
            .from('scorm-packages')
            .upload(fileName,file);
          
          if(uploadError)throw uploadError;
          
          const{data:urlData}=supabase.storage
            .from('scorm-packages')
            .getPublicUrl(fileName);
          
          setScormForm(prev=>({...prev,package_url:urlData.publicUrl}));
          alert('Package uploadé avec succès !');
        }catch(err){
          alert('Erreur upload: '+err.message);
        }
        e.target.value='';
      };

      const handleSave=async()=>{
        setSaving(true);
        const vimeoMatch=form.vimeo_id.match(/vimeo\.com\/(\d+)/)||form.vimeo_id.match(/^(\d+)$/);
        const vimeoId=vimeoMatch?vimeoMatch[1]:form.vimeo_id;
        const tagsArray=form.tags?form.tags.split(',').map(t=>t.trim()).filter(t=>t):null;
        const payload={title:form.title,vimeo_id:vimeoId,duration:form.duration||null,category:form.category||null,description:form.description||null,sort_order:form.sort_order?parseInt(form.sort_order):null,tags:tagsArray,theme:form.theme||null,thumbnail_url:form.thumbnail_url||null,center_id:center?.id,created_by:profile?.id};
        if(editing)await supabase.from('videos').update(payload).eq('id',editing.id);
        else await supabase.from('videos').insert(payload);
        await load();setModal(false);resetForm();setEditing(null);setSaving(false);
      };
      const handleDelete=async id=>{if(!confirm('Supprimer ?'))return;await supabase.from('videos').delete().eq('id',id);load();};

      const handleFileSelect=async(e)=>{const file=e.target.files[0];if(!file)return;try{const data=await file.arrayBuffer();const workbook=XLSX.read(data);const sheet=workbook.Sheets[workbook.SheetNames[0]];const jsonData=XLSX.utils.sheet_to_json(sheet);const mapped=jsonData.map((row,i)=>({_index:i+1,title:row['Titre']||row['title']||'',vimeo_id:String(row['ID Vimeo']||row['vimeo_id']||''),duration:row['Durée']||row['duration']||'',category:row['Catégorie']||row['category']||'',description:row['Description']||'',sort_order:row['Ordre']||null,tags:row['Tags']||'',theme:row['Thème']||'',thumbnail_url:row['Miniature URL']||'',_valid:!!(row['Titre']||row['title'])&&!!(row['ID Vimeo']||row['vimeo_id'])}));setImportData(mapped);setImportResult(null);}catch(err){alert('Erreur: '+err.message);}e.target.value='';};

      const handleImport=async()=>{const validData=importData.filter(d=>d._valid);if(!validData.length)return;setImportLoading(true);let created=0,updated=0,errors=0;for(const item of validData){const vimeoMatch=item.vimeo_id.match(/vimeo\.com\/(\d+)/)||item.vimeo_id.match(/^(\d+)$/);const vimeoId=vimeoMatch?vimeoMatch[1]:item.vimeo_id;const tagsArray=item.tags?item.tags.split(',').map(t=>t.trim()).filter(t=>t):null;const payload={title:item.title,vimeo_id:vimeoId,duration:item.duration||null,category:item.category||null,description:item.description||null,sort_order:item.sort_order?parseInt(item.sort_order):null,tags:tagsArray,theme:item.theme||null,thumbnail_url:item.thumbnail_url||null,center_id:center?.id,created_by:profile?.id};const{data:existing}=await supabase.from('videos').select('id').eq('vimeo_id',vimeoId).eq('center_id',center?.id).single();if(existing){const{error}=await supabase.from('videos').update(payload).eq('id',existing.id);if(error)errors++;else updated++;}else{const{error}=await supabase.from('videos').insert(payload);if(error)errors++;else created++;}}setImportLoading(false);setImportResult({created,updated,errors});await load();};

      const downloadTemplate=()=>{const template=[{'Titre':'Ma vidéo','ID Vimeo':'123456789','Durée':'5:30','Ordre':'1','Tags':'tag1, tag2','Catégorie':'Intro','Thème':'Bases','Description':''}];const ws=XLSX.utils.json_to_sheet(template);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Videos');XLSX.writeFile(wb,'template_videos.xlsx');};

      // Ouvrir le modal de détail (documents + chapitres)
      const openDetailModal=async(video)=>{
        setDetailModal(video);
        const[{data:att},{data:chap}]=await Promise.all([
          supabase.from('video_attachments').select('*').eq('video_id',video.id).order('sort_order'),
          supabase.from('video_chapters').select('*').eq('video_id',video.id).order('timestamp_seconds')
        ]);
        setAttachments(att||[]);
        setChapters(chap||[]);
        setNewAttachment({title:'',file:null});
        setNewChapter({title:'',timestamp:'',description:''});
      };

      // Gestion des documents avec upload
      const handleFileChange=(e)=>{
        const file=e.target.files[0];
        if(file){
          setNewAttachment(prev=>({...prev,file,title:prev.title||file.name.split('.')[0]}));
        }
      };
      
      const addAttachment=async()=>{
        if(!newAttachment.title||!newAttachment.file)return;
        setUploading(true);
        
        try{
          const file=newAttachment.file;
          const fileExt=file.name.split('.').pop();
          const fileName=`${detailModal.id}/${Date.now()}.${fileExt}`;
          
          // Upload vers Supabase Storage
          const{data:uploadData,error:uploadError}=await supabase.storage
            .from('attachments')
            .upload(fileName,file);
          
          if(uploadError)throw uploadError;
          
          // Obtenir l'URL publique
          const{data:urlData}=supabase.storage
            .from('attachments')
            .getPublicUrl(fileName);
          
          // Enregistrer dans la base
          const{data}=await supabase.from('video_attachments').insert({
            video_id:detailModal.id,
            title:newAttachment.title,
            file_url:urlData.publicUrl,
            file_type:fileExt,
            file_size:file.size,
            sort_order:attachments.length
          }).select().single();
          
          if(data)setAttachments([...attachments,data]);
          setNewAttachment({title:'',file:null});
          if(attachmentFileRef.current)attachmentFileRef.current.value='';
        }catch(err){
          console.error('Upload error:',err);
          alert('Erreur upload: '+err.message);
        }
        setUploading(false);
      };
      
      const deleteAttachment=async(att)=>{
        // Supprimer du storage
        const filePath=att.file_url.split('/attachments/')[1];
        if(filePath){
          await supabase.storage.from('attachments').remove([filePath]);
        }
        // Supprimer de la base
        await supabase.from('video_attachments').delete().eq('id',att.id);
        setAttachments(attachments.filter(a=>a.id!==att.id));
      };

      // Gestion des chapitres
      const parseTimestamp=(str)=>{
        const parts=str.split(':').map(Number);
        if(parts.length===2)return parts[0]*60+parts[1];
        if(parts.length===3)return parts[0]*3600+parts[1]*60+parts[2];
        return parseInt(str)||0;
      };
      const formatTimestamp=(seconds)=>{
        const m=Math.floor(seconds/60);
        const s=seconds%60;
        return `${m}:${s.toString().padStart(2,'0')}`;
      };
      const addChapter=async()=>{
        if(!newChapter.title||!newChapter.timestamp)return;
        const timestampSeconds=parseTimestamp(newChapter.timestamp);
        const{data}=await supabase.from('video_chapters').insert({
          video_id:detailModal.id,
          title:newChapter.title,
          timestamp_seconds:timestampSeconds,
          description:newChapter.description||null,
          sort_order:chapters.length
        }).select().single();
        if(data)setChapters([...chapters,data].sort((a,b)=>a.timestamp_seconds-b.timestamp_seconds));
        setNewChapter({title:'',timestamp:'',description:''});
      };
      const deleteChapter=async(id)=>{
        await supabase.from('video_chapters').delete().eq('id',id);
        setChapters(chapters.filter(c=>c.id!==id));
      };

      const filtered=videos.filter(v=>!search||v.title?.toLowerCase().includes(search.toLowerCase()));
      if(!can('manage_videos'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      const moduleTypeLabels={scorm12:'SCORM 1.2',scorm2004:'SCORM 2004',xapi:'xAPI (Tin Can)',cmi5:'cmi5'};

      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4">
          <h1 className="text-2xl font-bold">Bibliothèque</h1>
          <div className="flex gap-2">
            {activeTab==='videos'&&<><Button variant="secondary" icon="Upload" onClick={()=>setImportModal(true)}>Importer</Button><Button icon="Plus" onClick={()=>{resetForm();setEditing(null);setModal(true);}}>Ajouter vidéo</Button></>}
            {activeTab==='scorm'&&<Button icon="Plus" onClick={()=>{resetScormForm();setScormEditing(null);setScormModal(true);}}>Ajouter SCORM</Button>}
          </div>
        </div>
        
        <Tabs tabs={[{id:'videos',label:`Vidéos (${videos.length})`,icon:'Film'},{id:'scorm',label:`SCORM (${scormModules.length})`,icon:'Package'}]} active={activeTab} onChange={setActiveTab}/>
        
        {/* ONGLET VIDÉOS */}
        {activeTab==='videos'&&<>
          <Card className="p-4 mb-6"><Input icon="Search" placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)}/></Card>
          {filtered.length===0?<Empty icon="Film" title="Aucune vidéo"/>:<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{filtered.map(v=><Card key={v.id} className="overflow-hidden"><div className="aspect-video bg-gray-900 relative">{v.thumbnail_url?<img src={v.thumbnail_url} className="w-full h-full object-cover"/>:<iframe src={`https://player.vimeo.com/video/${v.vimeo_id}?background=1`} className="w-full h-full" allow="autoplay"/>}<div className="absolute bottom-2 right-2 px-2 py-1 bg-black/70 rounded text-xs">{v.duration||'--:--'}</div>{v.sort_order&&<div className="absolute top-2 left-2 w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center text-xs font-bold">{v.sort_order}</div>}</div><div className="p-4"><h3 className="font-semibold truncate">{v.title}</h3><div className="flex flex-wrap gap-1 mt-2">{v.category&&<span className="px-2 py-1 bg-gray-700 rounded text-xs">{v.category}</span>}{v.theme&&<span className="px-2 py-1 bg-indigo-600/30 text-indigo-300 rounded text-xs">{v.theme}</span>}</div><div className="flex flex-wrap gap-2 mt-3"><Button variant="ghost" size="sm" icon="Settings" onClick={()=>openDetailModal(v)}>Ressources</Button><Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(v);setForm({title:v.title,vimeo_id:v.vimeo_id,duration:v.duration||'',category:v.category||'',description:v.description||'',sort_order:v.sort_order||'',tags:v.tags?v.tags.join(', '):'',theme:v.theme||'',thumbnail_url:v.thumbnail_url||''});setModal(true);}}>Modifier</Button><Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(v.id)}/></div></div></Card>)}</div>}
        </>}
        
        {/* ONGLET SCORM */}
        {activeTab==='scorm'&&<>
          {scormModules.length===0?<Empty icon="Package" title="Aucun module SCORM" desc="Ajoutez votre premier module de formation interactif"/>:
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {scormModules.map(m=><Card key={m.id} className="p-4">
              <div className="flex items-start gap-3 mb-3">
                <div className="w-12 h-12 bg-orange-500/20 rounded-lg flex items-center justify-center shrink-0">
                  <Icon name="Package" size={24} className="text-orange-400"/>
                </div>
                <div className="flex-1 min-w-0">
                  <h3 className="font-semibold truncate">{m.title}</h3>
                  <p className="text-sm text-gray-400">{moduleTypeLabels[m.module_type]||m.module_type}</p>
                </div>
              </div>
              {m.category&&<span className="inline-block px-2 py-1 bg-purple-500/20 text-purple-300 rounded text-xs mb-3">{m.category}</span>}
              {m.description&&<p className="text-sm text-gray-400 line-clamp-2 mb-3">{m.description}</p>}
              <div className="flex gap-2">
                <Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{
                  setScormEditing(m);
                  setScormForm({title:m.title,description:m.description||'',module_type:m.module_type,package_url:m.package_url||'',entry_point:m.entry_point||'index.html',category:m.category||'',version:m.version||''});
                  setScormModal(true);
                }}>Modifier</Button>
                {m.package_url&&<a href={m.package_url} target="_blank" className="inline-flex items-center gap-1 px-3 py-1.5 text-sm hover:bg-gray-700 rounded-lg"><Icon name="ExternalLink" size={14}/>Tester</a>}
                <Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleScormDelete(m.id)}/>
              </div>
            </Card>)}
          </div>}
        </>}
        
        {/* Modal édition vidéo */}
        <Modal isOpen={modal} onClose={()=>{setModal(false);resetForm();setEditing(null);}} title={editing?'Modifier':'Ajouter'} size="lg"><div className="space-y-4"><div className="grid grid-cols-2 gap-4"><Input label="Titre *" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/><Input label="ID Vimeo *" value={form.vimeo_id} onChange={e=>setForm({...form,vimeo_id:e.target.value})} placeholder="123456789"/></div><div className="grid grid-cols-3 gap-4"><Input label="Durée" value={form.duration} onChange={e=>setForm({...form,duration:e.target.value})} placeholder="5:30"/><Input label="Ordre" type="number" value={form.sort_order} onChange={e=>setForm({...form,sort_order:e.target.value})}/><Input label="Catégorie" value={form.category} onChange={e=>setForm({...form,category:e.target.value})}/></div><div className="grid grid-cols-2 gap-4"><Input label="Thème" value={form.theme} onChange={e=>setForm({...form,theme:e.target.value})}/><Input label="Tags" value={form.tags} onChange={e=>setForm({...form,tags:e.target.value})} placeholder="tag1, tag2"/></div><Input label="Miniature URL" value={form.thumbnail_url} onChange={e=>setForm({...form,thumbnail_url:e.target.value})}/><div><label className="block text-sm font-medium text-gray-300 mb-1">Description</label><textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={2} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/></div><div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>{setModal(false);resetForm();setEditing(null);}}>Annuler</Button><Button onClick={handleSave} loading={saving}>Enregistrer</Button></div></div></Modal>
        
        {/* Modal import */}
        <Modal isOpen={importModal} onClose={()=>{setImportModal(false);setImportData([]);setImportResult(null);}} title="Importer" size="lg"><div className="space-y-4"><div className="bg-gray-700/50 rounded-lg p-4"><p className="text-sm text-gray-400 mb-2">Colonnes : Titre*, ID Vimeo*, Durée, Ordre, Tags, Catégorie, Thème</p><Button variant="ghost" size="sm" icon="Download" onClick={downloadTemplate}>Template</Button></div><div className="border-2 border-dashed border-gray-600 rounded-lg p-8 text-center"><input type="file" ref={fileInputRef} onChange={handleFileSelect} accept=".xlsx,.xls,.csv" className="hidden"/><Icon name="Film" size={48} className="mx-auto text-gray-500 mb-4"/><Button variant="secondary" onClick={()=>fileInputRef.current?.click()}>Parcourir</Button></div>{importData.length>0&&!importResult&&<div className="max-h-48 overflow-y-auto bg-gray-700/50 rounded-lg p-2">{importData.filter(d=>d._valid).map((row,i)=><div key={i} className="text-sm py-1">{row.title}</div>)}</div>}{importResult&&<Alert type={importResult.errors>0?'warning':'success'}>{importResult.created>0&&<span className="text-green-400">✅ {importResult.created} créée(s) </span>}{importResult.updated>0&&<span className="text-blue-400">🔄 {importResult.updated} mise(s) à jour </span>}{importResult.errors>0&&<span className="text-red-400">❌ {importResult.errors} erreur(s)</span>}</Alert>}<div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>{setImportModal(false);setImportData([]);setImportResult(null);}}>Fermer</Button>{importData.length>0&&!importResult&&<Button icon="Upload" onClick={handleImport} loading={importLoading}>Importer {importData.filter(d=>d._valid).length}</Button>}</div></div></Modal>
        
        {/* Modal ressources (documents + chapitres) */}
        <Modal isOpen={!!detailModal} onClose={()=>setDetailModal(null)} title={`Ressources: ${detailModal?.title}`} size="xl">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* Documents */}
            <div>
              <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="Paperclip" size={18}/>Documents joints ({attachments.length})</h3>
              <div className="space-y-2 mb-4 max-h-64 overflow-y-auto">
                {attachments.map(a=>(
                  <div key={a.id} className="flex items-center gap-3 p-3 bg-gray-700 rounded-lg">
                    <Icon name="FileText" size={20} className="text-indigo-400"/>
                    <div className="flex-1 min-w-0">
                      <p className="font-medium truncate text-sm">{a.title}</p>
                      <p className="text-xs text-gray-400">{a.file_type?.toUpperCase()} {a.file_size?`• ${Math.round(a.file_size/1024)} Ko`:''}</p>
                    </div>
                    <a href={a.file_url} download className="p-2 hover:bg-indigo-600 rounded" title="Télécharger"><Icon name="Download" size={16}/></a>
                    <button onClick={()=>deleteAttachment(a)} className="p-2 hover:bg-red-600 rounded" title="Supprimer"><Icon name="Trash2" size={16}/></button>
                  </div>
                ))}
                {attachments.length===0&&<p className="text-gray-500 text-sm text-center py-4">Aucun document</p>}
              </div>
              <div className="space-y-3 p-3 bg-gray-700/50 rounded-lg">
                <Input placeholder="Titre du document" value={newAttachment.title} onChange={e=>setNewAttachment({...newAttachment,title:e.target.value})}/>
                <div className="flex items-center gap-2">
                  <input type="file" ref={attachmentFileRef} onChange={handleFileChange} className="hidden" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip"/>
                  <Button variant="secondary" size="sm" icon="Upload" onClick={()=>attachmentFileRef.current?.click()}>
                    {newAttachment.file?newAttachment.file.name:'Choisir un fichier'}
                  </Button>
                  {newAttachment.file&&<span className="text-xs text-gray-400">{Math.round(newAttachment.file.size/1024)} Ko</span>}
                </div>
                <Button size="sm" icon="Plus" onClick={addAttachment} loading={uploading} disabled={!newAttachment.title||!newAttachment.file||uploading}>
                  {uploading?'Upload en cours...':'Ajouter le document'}
                </Button>
              </div>
            </div>
            
            {/* Chapitres */}
            <div>
              <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="List" size={18}/>Chapitres ({chapters.length})</h3>
              <div className="space-y-2 mb-4 max-h-64 overflow-y-auto">
                {chapters.map(c=>(
                  <div key={c.id} className="flex items-center gap-3 p-3 bg-gray-700 rounded-lg">
                    <span className="px-2 py-1 bg-indigo-600 rounded text-xs font-mono">{formatTimestamp(c.timestamp_seconds)}</span>
                    <div className="flex-1 min-w-0">
                      <p className="font-medium truncate text-sm">{c.title}</p>
                      {c.description&&<p className="text-xs text-gray-400 truncate">{c.description}</p>}
                    </div>
                    <button onClick={()=>deleteChapter(c.id)} className="p-1 hover:bg-red-600 rounded"><Icon name="Trash2" size={16}/></button>
                  </div>
                ))}
                {chapters.length===0&&<p className="text-gray-500 text-sm text-center py-4">Aucun chapitre</p>}
              </div>
              <div className="space-y-2 p-3 bg-gray-700/50 rounded-lg">
                <div className="grid grid-cols-2 gap-2">
                  <Input placeholder="Timestamp (ex: 2:30)" value={newChapter.timestamp} onChange={e=>setNewChapter({...newChapter,timestamp:e.target.value})}/>
                  <Input placeholder="Titre du chapitre" value={newChapter.title} onChange={e=>setNewChapter({...newChapter,title:e.target.value})}/>
                </div>
                <Input placeholder="Description (optionnel)" value={newChapter.description} onChange={e=>setNewChapter({...newChapter,description:e.target.value})}/>
                <Button size="sm" icon="Plus" onClick={addChapter} disabled={!newChapter.title||!newChapter.timestamp}>Ajouter</Button>
              </div>
            </div>
          </div>
        </Modal>
        
        {/* Modal SCORM */}
        <Modal isOpen={scormModal} onClose={()=>{setScormModal(false);resetScormForm();setScormEditing(null);}} title={scormEditing?'Modifier le module SCORM':'Ajouter un module SCORM'} size="lg">
          <div className="space-y-4">
            {/* Zone d'upload ZIP */}
            {!scormEditing&&(
              <div className="border-2 border-dashed border-gray-600 rounded-lg p-6 text-center hover:border-indigo-500 transition-colors">
                <input type="file" ref={scormZipRef} onChange={e=>{if(e.target.files[0])parseScormZip(e.target.files[0]);}} accept=".zip" className="hidden"/>
                {scormZipParsing?(
                  <div className="flex items-center justify-center gap-3">
                    <div className="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"/>
                    <span>Analyse du ZIP...</span>
                  </div>
                ):scormZipFile?(
                  <div>
                    <div className="w-12 h-12 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-2">
                      <Icon name="CheckCircle" size={24} className="text-green-400"/>
                    </div>
                    <p className="font-medium text-green-400">✅ {scormZipFile.name}</p>
                    <p className="text-sm text-gray-400 mt-1">Informations extraites automatiquement</p>
                    <Button variant="ghost" size="sm" className="mt-2" onClick={()=>{setScormZipFile(null);scormZipRef.current.value='';}}>Changer de fichier</Button>
                  </div>
                ):(
                  <div onClick={()=>scormZipRef.current?.click()} className="cursor-pointer">
                    <Icon name="Package" size={48} className="mx-auto text-gray-500 mb-3"/>
                    <p className="font-medium">Glissez un fichier ZIP Dispatch ici</p>
                    <p className="text-sm text-gray-400 mt-1">ou cliquez pour parcourir</p>
                    <p className="text-xs text-gray-500 mt-2">Le titre et l'URL seront extraits automatiquement</p>
                  </div>
                )}
              </div>
            )}
            
            {scormZipFile&&scormForm.remote_url&&(
              <Alert type="success">
                <p className="text-sm"><strong>URL distante détectée :</strong> Le contenu sera chargé depuis le serveur Codes Rousseau.</p>
              </Alert>
            )}
            
            <Input label="Titre *" value={scormForm.title} onChange={e=>setScormForm({...scormForm,title:e.target.value})}/>
            
            <div className="grid grid-cols-2 gap-4">
              <Select label="Type de module" value={scormForm.module_type} onChange={e=>setScormForm({...scormForm,module_type:e.target.value})} options={[{value:'scorm12',label:'SCORM 1.2'},{value:'scorm2004',label:'SCORM 2004'},{value:'xapi',label:'xAPI (Tin Can)'},{value:'cmi5',label:'cmi5'}]}/>
              <Input label="Point d'entrée" value={scormForm.entry_point} onChange={e=>setScormForm({...scormForm,entry_point:e.target.value})} placeholder="sco_0.html"/>
            </div>
            
            <Input label="URL du contenu distant *" value={scormForm.package_url} onChange={e=>setScormForm({...scormForm,package_url:e.target.value})} placeholder="https://lms.codesrousseau.fr/pluginfile.php/..."/>
            
            <Input label="Catégorie" value={scormForm.category} onChange={e=>setScormForm({...scormForm,category:e.target.value})} placeholder="Ex: Formation Moto, Code de la route..."/>
            
            <div>
              <label className="block text-sm font-medium text-gray-300 mb-1">Description</label>
              <textarea value={scormForm.description} onChange={e=>setScormForm({...scormForm,description:e.target.value})} rows={2} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none" placeholder="Description optionnelle du module"/>
            </div>
            
            <div className="flex justify-end gap-3 pt-2">
              <Button variant="secondary" onClick={()=>{setScormModal(false);resetScormForm();setScormEditing(null);}}>Annuler</Button>
              <Button onClick={handleScormSave} loading={scormSaving} disabled={!scormForm.title||!scormForm.package_url}>Enregistrer</Button>
            </div>
          </div>
        </Modal>
      </div>;
    }

    // Playlists
    function PlaylistsPage(){
      const{center,isSuperAdmin,can,profile}=useAuth();
      const[playlists,setPlaylists]=useState([]);
      const[videos,setVideos]=useState([]);
      const[scormModules,setScormModules]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({title:'',description:''});
      const[saving,setSaving]=useState(false);
      const[editContentModal,setEditContentModal]=useState(null);
      const[playlistVideos,setPlaylistVideos]=useState([]);
      const[playlistScorm,setPlaylistScorm]=useState([]);
      const[contentTab,setContentTab]=useState('videos');
      const sortableRef=useRef(null);
      const sortableInstanceRef=useRef(null);

      const load=useCallback(async()=>{
        let q=supabase.from('playlists').select('*,playlist_videos(count)').order('created_at',{ascending:false});
        if(!isSuperAdmin&&center?.id)q=q.eq('center_id',center.id);
        const{data:p}=await q;
        setPlaylists(p||[]);
        
        let qv=supabase.from('videos').select('*');
        if(!isSuperAdmin&&center?.id)qv=qv.eq('center_id',center.id);
        const{data:v}=await qv;
        setVideos(v||[]);
        
        // Charger les modules SCORM (avec gestion d'erreur si table n'existe pas)
        try {
          let qs=supabase.from('scorm_modules').select('*');
          if(!isSuperAdmin&&center?.id)qs=qs.or(`center_id.eq.${center.id},center_id.is.null`);
          const{data:scorm,error}=await qs;
          if(!error)setScormModules(scorm||[]);
        } catch(e) { console.log('SCORM tables not yet created'); }
        
        setLoading(false);
      },[isSuperAdmin,center?.id]);
      useEffect(()=>{load();},[load]);

      const handleSave=async()=>{setSaving(true);const payload={title:form.title,description:form.description,center_id:center?.id,created_by:profile?.id};if(editing)await supabase.from('playlists').update(payload).eq('id',editing.id);else await supabase.from('playlists').insert(payload);await load();setModal(false);setForm({title:'',description:''});setEditing(null);setSaving(false);};
      const handleDelete=async id=>{if(!confirm('Supprimer ?'))return;await supabase.from('playlists').delete().eq('id',id);load();};
      
      const openEditContent=async(playlist)=>{
        const{data:pvs}=await supabase.from('playlist_videos').select('*,videos(*)').eq('playlist_id',playlist.id).order('position');
        setPlaylistVideos(pvs||[]);
        
        // Charger les modules SCORM du cours
        const{data:ps}=await supabase.from('playlist_scorm').select('*,scorm_modules(*)').eq('playlist_id',playlist.id).order('position');
        setPlaylistScorm(ps||[]);
        
        setEditContentModal(playlist);
        setContentTab('videos');
      };
      
      const addVideoToPlaylist=async(videoId)=>{const pos=playlistVideos.length;const{data}=await supabase.from('playlist_videos').insert({playlist_id:editContentModal.id,video_id:videoId,position:pos}).select('*,videos(*)').single();if(data)setPlaylistVideos([...playlistVideos,data]);};
      const removeVideoFromPlaylist=async(pvId)=>{await supabase.from('playlist_videos').delete().eq('id',pvId);setPlaylistVideos(playlistVideos.filter(pv=>pv.id!==pvId));};
      
      const addScormToPlaylist=async(scormId)=>{
        const pos=playlistScorm.length;
        const{data}=await supabase.from('playlist_scorm').insert({playlist_id:editContentModal.id,scorm_module_id:scormId,position:pos}).select('*,scorm_modules(*)').single();
        if(data)setPlaylistScorm([...playlistScorm,data]);
      };
      const removeScormFromPlaylist=async(psId)=>{
        await supabase.from('playlist_scorm').delete().eq('id',psId);
        setPlaylistScorm(playlistScorm.filter(ps=>ps.id!==psId));
      };
      
      const togglePublish=async(playlist)=>{await supabase.from('playlists').update({is_published:!playlist.is_published}).eq('id',playlist.id);load();};
      
      // Drag & Drop pour vidéos
      useEffect(()=>{
        if(!editContentModal||!sortableRef.current||contentTab!=='videos')return;
        if(sortableInstanceRef.current)sortableInstanceRef.current.destroy();
        
        sortableInstanceRef.current=new Sortable(sortableRef.current,{
          animation:150,
          handle:'.drag-handle',
          ghostClass:'opacity-50',
          onEnd:async(evt)=>{
            const{oldIndex,newIndex}=evt;
            if(oldIndex===newIndex)return;
            const newOrder=[...playlistVideos];
            const[moved]=newOrder.splice(oldIndex,1);
            newOrder.splice(newIndex,0,moved);
            setPlaylistVideos(newOrder);
            for(let i=0;i<newOrder.length;i++){
              await supabase.from('playlist_videos').update({position:i}).eq('id',newOrder[i].id);
            }
          }
        });
        
        return()=>{
          if(sortableInstanceRef.current){
            sortableInstanceRef.current.destroy();
            sortableInstanceRef.current=null;
          }
        };
      },[editContentModal,playlistVideos.length,contentTab]);

      if(!can('manage_playlists')&&profile?.role!=='trainer')return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;
      return<div>
        <div className="flex items-center justify-between mb-6"><h1 className="text-2xl font-bold">Cours</h1>{can('manage_playlists')&&<Button icon="Plus" onClick={()=>{setForm({title:'',description:''});setEditing(null);setModal(true);}}>Créer</Button>}</div>
        {playlists.length===0?<Empty icon="BookOpen" title="Aucun cours"/>:<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{playlists.map(p=><Card key={p.id} className="p-4"><div className="flex items-start justify-between mb-3"><div><h3 className="font-semibold">{p.title}</h3><p className="text-sm text-gray-400 mt-1">{p.playlist_videos?.[0]?.count||0} vidéos</p></div><span className={`px-2 py-1 rounded text-xs ${p.is_published?'bg-green-500/20 text-green-400':'bg-gray-500/20 text-gray-400'}`}>{p.is_published?'Publié':'Brouillon'}</span></div><div className="flex flex-wrap gap-2">{can('manage_playlists')&&<><Button variant="ghost" size="sm" icon="Layers" onClick={()=>openEditContent(p)}>Contenu</Button><Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(p);setForm({title:p.title,description:p.description||''});setModal(true);}}>Modifier</Button></>}<Button variant="ghost" size="sm" icon={p.is_published?'EyeOff':'Eye'} onClick={()=>togglePublish(p)}>{p.is_published?'Dépublier':'Publier'}</Button>{can('manage_playlists')&&<Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(p.id)}/>}</div></Card>)}</div>}
        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title={editing?'Modifier':'Créer'}><div className="space-y-4"><Input label="Titre" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/><div><label className="block text-sm font-medium text-gray-300 mb-1">Description</label><textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={3} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/></div><div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button><Button onClick={handleSave} loading={saving}>Enregistrer</Button></div></div></Modal>
        <Modal isOpen={!!editContentModal} onClose={()=>setEditContentModal(null)} title={`Contenu: ${editContentModal?.title}`} size="xl">
          <Tabs tabs={[{id:'videos',label:`Vidéos (${playlistVideos.length})`,icon:'Film'},{id:'scorm',label:`SCORM (${playlistScorm.length})`,icon:'Package'}]} active={contentTab} onChange={setContentTab}/>
          
          {contentTab==='videos'&&<div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div>
              <h4 className="font-medium mb-3">Dans le cours ({playlistVideos.length}) <span className="text-gray-500 text-sm font-normal">- Glissez pour réorganiser</span></h4>
              <div ref={sortableRef} className="space-y-2 max-h-96 overflow-y-auto">
                {playlistVideos.map((pv,i)=><div key={pv.id} data-id={pv.id} className="flex items-center gap-3 p-3 bg-gray-700 rounded-lg">
                  <div className="drag-handle cursor-grab active:cursor-grabbing p-1 hover:bg-gray-600 rounded"><Icon name="GripVertical" size={16} className="text-gray-400"/></div>
                  <span className="w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center text-xs font-bold">{i+1}</span>
                  <div className="flex-1 min-w-0"><p className="font-medium truncate text-sm">{pv.videos?.title}</p></div>
                  <button onClick={()=>removeVideoFromPlaylist(pv.id)} className="p-1 hover:bg-red-600 rounded"><Icon name="X" size={16}/></button>
                </div>)}
                {playlistVideos.length===0&&<p className="text-gray-500 text-sm text-center py-4">Aucune vidéo</p>}
              </div>
            </div>
            <div>
              <h4 className="font-medium mb-3">Vidéos disponibles</h4>
              <div className="space-y-2 max-h-96 overflow-y-auto">
                {videos.filter(v=>!playlistVideos.find(pv=>pv.video_id===v.id)).map(v=><div key={v.id} className="flex items-center gap-3 p-3 bg-gray-700/50 rounded-lg hover:bg-gray-700 cursor-pointer" onClick={()=>addVideoToPlaylist(v.id)}>
                  <Icon name="Plus" size={16} className="text-indigo-400"/>
                  <div className="flex-1 min-w-0"><p className="font-medium truncate text-sm">{v.title}</p></div>
                </div>)}
                {videos.filter(v=>!playlistVideos.find(pv=>pv.video_id===v.id)).length===0&&<p className="text-gray-500 text-sm text-center py-4">Toutes les vidéos ajoutées</p>}
              </div>
            </div>
          </div>}
          
          {contentTab==='scorm'&&<div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div>
              <h4 className="font-medium mb-3">Modules SCORM du cours ({playlistScorm.length})</h4>
              <div className="space-y-2 max-h-96 overflow-y-auto">
                {playlistScorm.map((ps,i)=><div key={ps.id} className="flex items-center gap-3 p-3 bg-gray-700 rounded-lg">
                  <div className="w-8 h-8 bg-orange-500/20 rounded flex items-center justify-center"><Icon name="Package" size={16} className="text-orange-400"/></div>
                  <div className="flex-1 min-w-0">
                    <p className="font-medium truncate text-sm">{ps.scorm_modules?.title}</p>
                    <p className="text-xs text-gray-400">{ps.scorm_modules?.module_type}</p>
                  </div>
                  <button onClick={()=>removeScormFromPlaylist(ps.id)} className="p-1 hover:bg-red-600 rounded"><Icon name="X" size={16}/></button>
                </div>)}
                {playlistScorm.length===0&&<p className="text-gray-500 text-sm text-center py-4">Aucun module SCORM</p>}
              </div>
            </div>
            <div>
              <h4 className="font-medium mb-3">Modules disponibles</h4>
              <div className="space-y-2 max-h-96 overflow-y-auto">
                {scormModules.filter(m=>!playlistScorm.find(ps=>ps.scorm_module_id===m.id)).map(m=><div key={m.id} className="flex items-center gap-3 p-3 bg-gray-700/50 rounded-lg hover:bg-gray-700 cursor-pointer" onClick={()=>addScormToPlaylist(m.id)}>
                  <Icon name="Plus" size={16} className="text-orange-400"/>
                  <div className="flex-1 min-w-0">
                    <p className="font-medium truncate text-sm">{m.title}</p>
                    <p className="text-xs text-gray-400">{m.module_type}</p>
                  </div>
                </div>)}
                {scormModules.filter(m=>!playlistScorm.find(ps=>ps.scorm_module_id===m.id)).length===0&&<p className="text-gray-500 text-sm text-center py-4">{scormModules.length===0?'Aucun module SCORM disponible':'Tous les modules ajoutés'}</p>}
              </div>
            </div>
          </div>}
        </Modal>
      </div>;
    }

    // Quiz Management
    function QuizzesPage(){
      const{center,isSuperAdmin,can,profile}=useAuth();
      const[quizzes,setQuizzes]=useState([]);
      const[playlists,setPlaylists]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({title:'',description:'',playlist_id:'',passing_score:70,is_required:false});
      const[saving,setSaving]=useState(false);
      const[questionsModal,setQuestionsModal]=useState(null);
      const[questions,setQuestions]=useState([]);
      const[newQuestion,setNewQuestion]=useState({question_text:'',question_type:'single',answers:[{text:'',is_correct:false},{text:'',is_correct:false}]});

      const load=useCallback(async()=>{
        // Charger les quiz avec une requête simple
        const{data:qz,error:qzErr}=await supabase.from('quizzes').select('*').order('created_at',{ascending:false});
        if(qzErr)console.error('Erreur quiz:',qzErr);
        
        // Charger les infos des playlists séparément
        const playlistIds=(qz||[]).filter(q=>q.playlist_id).map(q=>q.playlist_id);
        let playlistsInfo={};
        if(playlistIds.length>0){
          const{data:pInfo}=await supabase.from('playlists').select('id,title').in('id',playlistIds);
          (pInfo||[]).forEach(p=>playlistsInfo[p.id]=p);
        }
        
        // Charger le nombre de questions par quiz
        const quizIds=(qz||[]).map(q=>q.id);
        let questionsCount={};
        if(quizIds.length>0){
          const{data:qCount}=await supabase.from('quiz_questions').select('quiz_id').in('quiz_id',quizIds);
          (qCount||[]).forEach(q=>{questionsCount[q.quiz_id]=(questionsCount[q.quiz_id]||0)+1;});
        }
        
        // Combiner les données
        const enrichedQuizzes=(qz||[]).map(q=>({
          ...q,
          playlists:playlistsInfo[q.playlist_id]||null,
          questions_count:questionsCount[q.id]||0
        }));
        
        setQuizzes(enrichedQuizzes);
        
        // Charger TOUS les cours
        const{data:pl,error:plErr}=await supabase.from('playlists').select('id,title').order('title');
        if(plErr)console.error('Erreur playlists:',plErr);
        setPlaylists(pl||[]);
        setLoading(false);
      },[]);
      
      useEffect(()=>{load();},[load]);

      const handleSave=async()=>{
        setSaving(true);
        const payload={
          title:form.title,
          description:form.description||null,
          playlist_id:form.playlist_id||null,
          passing_score:parseInt(form.passing_score)||70,
          is_required:form.is_required
        };
        if(editing){
          await supabase.from('quizzes').update(payload).eq('id',editing.id);
        }else{
          await supabase.from('quizzes').insert(payload);
        }
        await load();
        setModal(false);
        setForm({title:'',description:'',playlist_id:'',passing_score:70,is_required:false});
        setEditing(null);
        setSaving(false);
      };

      const handleDelete=async(id)=>{
        if(!confirm('Supprimer ce quiz et toutes ses questions ?'))return;
        await supabase.from('quizzes').delete().eq('id',id);
        load();
      };

      const openQuestions=async(quiz)=>{
        setQuestionsModal(quiz);
        const{data}=await supabase.from('quiz_questions').select('*,quiz_answers(*)').eq('quiz_id',quiz.id).order('sort_order');
        setQuestions(data||[]);
        setNewQuestion({question_text:'',question_type:'single',answers:[{text:'',is_correct:false},{text:'',is_correct:false}]});
      };

      const addQuestion=async()=>{
        if(!newQuestion.question_text.trim()){alert('Veuillez entrer une question');return;}
        if(newQuestion.answers.filter(a=>a.text.trim()).length<2){alert('Veuillez entrer au moins 2 réponses');return;}
        if(!newQuestion.answers.some(a=>a.is_correct&&a.text.trim())){alert('Veuillez cocher au moins une bonne réponse');return;}
        
        try{
          const{data:q,error:qError}=await supabase.from('quiz_questions').insert({
            quiz_id:questionsModal.id,
            question_text:newQuestion.question_text.trim(),
            question_type:newQuestion.question_type,
            sort_order:questions.length
          }).select().single();
          
          if(qError)throw qError;
          
          if(q){
            const answersToInsert=newQuestion.answers.filter(a=>a.text.trim()).map((a,i)=>({
              question_id:q.id,
              answer_text:a.text.trim(),
              is_correct:a.is_correct,
              sort_order:i
            }));
            const{error:aError}=await supabase.from('quiz_answers').insert(answersToInsert);
            if(aError)throw aError;
            
            const{data:fullQ}=await supabase.from('quiz_questions').select('*,quiz_answers(*)').eq('id',q.id).single();
            setQuestions(prev=>[...prev,fullQ]);
          }
          setNewQuestion({question_text:'',question_type:'single',answers:[{text:'',is_correct:false},{text:'',is_correct:false}]});
        }catch(err){
          console.error('Erreur ajout question:',err);
          alert('Erreur: '+err.message);
        }
      };

      const deleteQuestion=async(id)=>{
        await supabase.from('quiz_questions').delete().eq('id',id);
        setQuestions(questions.filter(q=>q.id!==id));
      };

      const updateAnswer=(index,field,value)=>{
        setNewQuestion(prev=>{
          const newAnswers=prev.answers.map((a,i)=>{
            if(i===index){
              if(field==='is_correct'&&prev.question_type==='single'){
                return {...a,is_correct:true};
              }
              return {...a,[field]:value};
            }else if(field==='is_correct'&&prev.question_type==='single'){
              return {...a,is_correct:false};
            }
            return {...a};
          });
          return {...prev,answers:newAnswers};
        });
      };

      const addAnswerOption=()=>{
        if(newQuestion.answers.length<6){
          setNewQuestion({...newQuestion,answers:[...newQuestion.answers,{text:'',is_correct:false}]});
        }
      };

      if(!can('manage_playlists')&&profile?.role!=='trainer')return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6">
          <h1 className="text-2xl font-bold">Quiz</h1>
          <Button icon="Plus" onClick={()=>{setForm({title:'',description:'',playlist_id:'',passing_score:70,is_required:false});setEditing(null);setModal(true);}}>Créer un quiz</Button>
        </div>
        
        {quizzes.length===0?<Empty icon="HelpCircle" title="Aucun quiz" desc="Créez votre premier quiz"/>:(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {quizzes.map(q=>(
              <Card key={q.id} className="p-4">
                <div className="flex items-start justify-between mb-3">
                  <div>
                    <h3 className="font-semibold">{q.title}</h3>
                    <p className="text-sm text-gray-400">{q.playlists?.title||'Quiz indépendant'}</p>
                  </div>
                  {q.is_required&&<span className="px-2 py-1 bg-red-500/20 text-red-400 rounded text-xs">Obligatoire</span>}
                </div>
                <div className="flex items-center gap-4 text-sm text-gray-400 mb-3">
                  <span><Icon name="HelpCircle" size={14} className="inline mr-1"/>{q.questions_count||0} questions</span>
                  <span><Icon name="Target" size={14} className="inline mr-1"/>{q.passing_score}% requis</span>
                </div>
                <div className="flex flex-wrap gap-2">
                  <Button variant="ghost" size="sm" icon="List" onClick={()=>openQuestions(q)}>Questions</Button>
                  <Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(q);setForm({title:q.title,description:q.description||'',playlist_id:q.playlist_id||'',passing_score:q.passing_score,is_required:q.is_required});setModal(true);}}/>
                  <Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(q.id)}/>
                </div>
              </Card>
            ))}
          </div>
        )}

        {/* Modal création/édition quiz */}
        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title={editing?'Modifier le quiz':'Créer un quiz'}>
          <div className="space-y-4">
            <Input label="Titre du quiz *" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/>
            {playlists.length===0?(
              <Alert type="warning">Aucun cours disponible. Créez d'abord un cours dans le menu "Cours".</Alert>
            ):(
              <Select label={`Cours associé * (${playlists.length} disponible${playlists.length>1?'s':''})`} value={form.playlist_id} onChange={e=>setForm({...form,playlist_id:e.target.value})} options={[{value:'',label:'-- Sélectionner un cours --'},...playlists.map(p=>({value:p.id,label:p.title}))]}/>
            )}
            <div><label className="block text-sm font-medium text-gray-300 mb-1">Description</label><textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={2} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/></div>
            <Input label="Score minimum pour réussir (%)" type="number" value={form.passing_score} onChange={e=>setForm({...form,passing_score:e.target.value})} min="0" max="100"/>
            <Checkbox label="Quiz obligatoire pour compléter le cours" checked={form.is_required} onChange={v=>setForm({...form,is_required:v})}/>
            <div className="flex justify-end gap-3">
              <Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button>
              <Button onClick={handleSave} loading={saving} disabled={!form.title||!form.playlist_id}>Enregistrer</Button>
            </div>
          </div>
        </Modal>

        {/* Modal gestion des questions */}
        <Modal isOpen={!!questionsModal} onClose={()=>setQuestionsModal(null)} title={`Questions: ${questionsModal?.title}`} size="xl">
          <div className="space-y-6">
            {/* Liste des questions existantes */}
            <div>
              <h4 className="font-medium mb-3">Questions ({questions.length})</h4>
              <div className="space-y-3 max-h-64 overflow-y-auto">
                {questions.map((q,i)=>(
                  <div key={q.id} className="p-4 bg-gray-700 rounded-lg">
                    <div className="flex items-start justify-between">
                      <div className="flex-1">
                        <p className="font-medium"><span className="text-indigo-400 mr-2">Q{i+1}.</span>{q.question_text}</p>
                        <div className="mt-2 space-y-1">
                          {q.quiz_answers?.map(a=>(
