    // Centers
    function CentersPage(){
      const{can}=useAuth();
      const[centers,setCenters]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({name:'',slug:'',description:''});
      const[saving,setSaving]=useState(false);

      const load=useCallback(async()=>{const{data}=await supabase.from('centers').select('*').order('name');setCenters(data||[]);setLoading(false);},[]);
      useEffect(()=>{load();},[load]);

      const handleSave=async()=>{
        setSaving(true);
        const payload={name:form.name,slug:form.slug.toLowerCase().replace(/[^a-z0-9-]/g,'-'),description:form.description};
        if(editing)await supabase.from('centers').update(payload).eq('id',editing.id);
        else await supabase.from('centers').insert(payload);
        await load();setModal(false);setForm({name:'',slug:'',description:''});setEditing(null);setSaving(false);
      };
      const handleDelete=async id=>{if(!confirm('Supprimer ?'))return;await supabase.from('centers').delete().eq('id',id);load();};

      if(!can('manage_centers'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;
      return<div>
        <div className="flex items-center justify-between mb-6"><h1 className="text-2xl font-bold">Centres</h1><Button icon="Plus" onClick={()=>{setForm({name:'',slug:'',description:''});setEditing(null);setModal(true);}}>Nouveau</Button></div>
        {centers.length===0?<Empty icon="Building2" title="Aucun centre"/>:<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{centers.map(c=><Card key={c.id} className="p-4"><div className="flex items-center gap-3 mb-3"><div className="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center"><Icon name="Building2" size={24}/></div><div><h3 className="font-semibold">{c.name}</h3><p className="text-sm text-gray-400">/{c.slug}</p></div></div><div className="flex gap-2"><Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(c);setForm({name:c.name,slug:c.slug,description:c.description||''});setModal(true);}}>Modifier</Button><Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(c.id)}>Supprimer</Button></div></Card>)}</div>}
        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title={editing?'Modifier':'Nouveau centre'}><div className="space-y-4"><Input label="Nom" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/><Input label="Slug" value={form.slug} onChange={e=>setForm({...form,slug:e.target.value})}/><div><label className="block text-sm font-medium text-gray-300 mb-1">Description</label><textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={3} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/></div><div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button><Button onClick={handleSave} loading={saving}>Enregistrer</Button></div></div></Modal>
      </div>;
    }

    // Users
    function UsersPage(){
      const{profile,center,isSuperAdmin,realRole,can,canAssignRole}=useAuth();
      const[users,setUsers]=useState([]);
      const[centers,setCenters]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[createModal,setCreateModal]=useState(false);
      const[importModal,setImportModal]=useState(false);
      const[deleteModal,setDeleteModal]=useState(null);
      const[bulkDeleteModal,setBulkDeleteModal]=useState(false);
      const[deleting,setDeleting]=useState(false);
      const[editing,setEditing]=useState(null);
      const[search,setSearch]=useState('');
      const[filterRole,setFilterRole]=useState('');
      const[filterCenter,setFilterCenter]=useState('');
      const[sortBy,setSortBy]=useState('created_at');
      const[sortDir,setSortDir]=useState('desc');
      const[selectedUsers,setSelectedUsers]=useState([]);
      const[form,setForm]=useState({email:'',first_name:'',last_name:'',role:'learner',center_id:''});
      const[createForm,setCreateForm]=useState({email:'',password:'',first_name:'',last_name:'',role:'learner',center_id:''});
      const[saving,setSaving]=useState(false);
      const[creating,setCreating]=useState(false);
      const[createResult,setCreateResult]=useState(null);
      const[importData,setImportData]=useState([]);
      const[importLoading,setImportLoading]=useState(false);
      const[importResult,setImportResult]=useState(null);
      const fileInputRef=useRef(null);
      
      // Rôles que l'utilisateur courant peut assigner
      const assignableRoles=Object.entries(ROLE_LABELS).filter(([r])=>{
        if(isSuperAdmin)return true;
        return canAssignRole(r);
      });

      const load=useCallback(async()=>{
        let q=supabase.from('profiles').select('*,centers(name)').order('created_at',{ascending:false});
        // Filtrage par centre pour non-super-admin
        if(!isSuperAdmin&&center?.id)q=q.eq('center_id',center.id);
        const{data:u}=await q;setUsers(u||[]);
        const{data:c}=await supabase.from('centers').select('id,name');setCenters(c||[]);
        setLoading(false);
        setSelectedUsers([]);
      },[isSuperAdmin,center?.id]);
      
      useEffect(()=>{load();},[load]);

      const generatePassword=()=>{
        const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!@#$%';
        let pwd='';for(let i=0;i<12;i++)pwd+=chars.charAt(Math.floor(Math.random()*chars.length));
        return pwd;
      };

      // Suppression par lot
      const handleBulkDelete=async()=>{
        if(!selectedUsers.length||!can('delete_users'))return;
        setDeleting(true);
        try{
          for(const userId of selectedUsers){
            await supabase.from('enrollments').delete().eq('learner_id',userId);
            await supabase.from('video_progress').delete().eq('learner_id',userId);
            await supabase.from('scorm_progress').delete().eq('learner_id',userId);
            await supabase.from('quiz_attempts').delete().eq('learner_id',userId);
            await supabase.from('learner_badges').delete().eq('learner_id',userId);
            await supabase.from('learner_points').delete().eq('learner_id',userId);
            await supabase.from('learner_notes').delete().eq('learner_id',userId);
            await supabase.from('notifications').delete().eq('user_id',userId);
            await supabase.from('certificates').delete().eq('learner_id',userId);
            await supabase.from('profiles').delete().eq('id',userId);
          }
          await load();
          setBulkDeleteModal(false);
        }catch(err){
          console.error('Erreur suppression:',err);
          alert('Erreur lors de la suppression: '+err.message);
        }
        setDeleting(false);
      };

      // Sélection
      const toggleSelect=(userId)=>{
        setSelectedUsers(prev=>prev.includes(userId)?prev.filter(id=>id!==userId):[...prev,userId]);
      };
      const toggleSelectAll=(filteredUsers)=>{
        const selectableUsers=filteredUsers.filter(u=>u.id!==profile?.id&&u.role!=='super_admin');
        const allSelected=selectableUsers.every(u=>selectedUsers.includes(u.id));
        if(allSelected){
          setSelectedUsers([]);
        }else{
          setSelectedUsers(selectableUsers.map(u=>u.id));
        }
      };

      // Tri
      const handleSort=(field)=>{
        if(sortBy===field){
          setSortDir(prev=>prev==='asc'?'desc':'asc');
        }else{
          setSortBy(field);
          setSortDir('asc');
        }
      };

      const handleCreate=async()=>{
        if(!createForm.email||!createForm.first_name||!createForm.last_name){
          alert('Veuillez remplir tous les champs obligatoires');return;
        }
        // Valider le rôle selon les permissions
        const allowedRoles=isSuperAdmin?['learner','trainer','center_admin','super_admin']:['learner','trainer'];
        const finalRole=allowedRoles.includes(createForm.role)?createForm.role:'learner';
        
        setCreating(true);setCreateResult(null);
        try{
          const password=createForm.password||generatePassword();
          const targetCenterId=isSuperAdmin?(createForm.center_id||center?.id):center?.id;
          
          // Créer l'utilisateur via l'API Supabase Auth
          const{data:authData,error:authError}=await supabase.auth.signUp({
            email:createForm.email.toLowerCase().trim(),
            password:password,
            options:{data:{first_name:createForm.first_name,last_name:createForm.last_name}}
          });
          
          if(authError)throw authError;
          if(!authData.user)throw new Error('Erreur lors de la création du compte');
          
          // Mettre à jour le profil avec le rôle et le centre
          const{error:profileError}=await supabase.from('profiles').update({
            first_name:createForm.first_name,
            last_name:createForm.last_name,
            role:finalRole,
            center_id:targetCenterId||null
          }).eq('id',authData.user.id);
          
          if(profileError)console.error('Erreur profil:',profileError);
          
          setCreateResult({success:true,email:createForm.email,password:password});
          await load();
        }catch(err){
          console.error('Erreur création:',err);
          setCreateResult({success:false,error:err.message});
        }
        setCreating(false);
      };

      const resetCreateForm=()=>{
        setCreateForm({email:'',password:'',first_name:'',last_name:'',role:'learner',center_id:center?.id||''});
        setCreateResult(null);
      };

      const handleSave=async()=>{
        if(!editing)return;
        // Protection: un non-super_admin ne peut pas modifier un super_admin
        if(!isSuperAdmin&&editing.role==='super_admin'){
          alert('Vous n\'avez pas la permission de modifier ce profil.');
          setModal(false);setEditing(null);
          return;
        }
        // Protection: un non-super_admin ne peut pas promouvoir quelqu'un en super_admin
        if(!isSuperAdmin&&form.role==='super_admin'){
          alert('Vous n\'avez pas la permission d\'attribuer ce rôle.');
          return;
        }
        setSaving(true);
        await supabase.from('profiles').update({first_name:form.first_name,last_name:form.last_name,role:form.role,center_id:form.center_id||null}).eq('id',editing.id);
        await load();setModal(false);setEditing(null);setSaving(false);
      };

      const handleDelete=async()=>{
        if(!deleteModal)return;
        setDeleting(true);
        try{
          // Supprimer les données liées
          await supabase.from('enrollments').delete().eq('learner_id',deleteModal.id);
          await supabase.from('video_progress').delete().eq('learner_id',deleteModal.id);
          await supabase.from('scorm_progress').delete().eq('learner_id',deleteModal.id);
          await supabase.from('quiz_attempts').delete().eq('learner_id',deleteModal.id);
          await supabase.from('learner_badges').delete().eq('learner_id',deleteModal.id);
          await supabase.from('learner_points').delete().eq('learner_id',deleteModal.id);
          await supabase.from('learner_notes').delete().eq('learner_id',deleteModal.id);
          await supabase.from('notifications').delete().eq('user_id',deleteModal.id);
          await supabase.from('certificates').delete().eq('learner_id',deleteModal.id);
          
          // Supprimer le profil
          await supabase.from('profiles').delete().eq('id',deleteModal.id);
          
          // Supprimer l'utilisateur auth (nécessite une fonction Edge ou admin API)
          // Note: Cela nécessite les droits admin Supabase
          // Pour l'instant on garde le user auth mais sans profil
          
          await load();
          setDeleteModal(null);
        }catch(err){
          console.error('Erreur suppression:',err);
          alert('Erreur lors de la suppression: '+err.message);
        }
        setDeleting(false);
      };

      const handleFileSelect=async(e)=>{
        const file=e.target.files[0];if(!file)return;
        try{
          const data=await file.arrayBuffer();
          const workbook=XLSX.read(data);
          const sheet=workbook.Sheets[workbook.SheetNames[0]];
          const jsonData=XLSX.utils.sheet_to_json(sheet);
          // Rôles autorisés selon le type d'admin
          const allowedRoles=isSuperAdmin?['learner','trainer','center_admin','super_admin']:['learner','trainer'];
          const mapped=jsonData.map((row,i)=>{
            let role=String(row['Rôle']||row['Role']||row['role']||'learner').toLowerCase();
            // Si le rôle n'est pas autorisé pour cet admin, forcer à 'learner'
            if(!allowedRoles.includes(role))role='learner';
            return{
              _index:i+1,
              email:String(row['Email']||row['email']||'').toLowerCase().trim(),
              first_name:row['Prénom']||row['Prenom']||row['first_name']||'',
              last_name:row['Nom']||row['last_name']||'',
              role:role,
              password:row['Mot de passe']||row['Password']||row['password']||'',
              center_name:row['Centre']||row['center']||'',
              _valid:!!(row['Email']||row['email'])&&!!(row['Prénom']||row['Prenom']||row['first_name'])&&!!(row['Nom']||row['last_name']),
              _roleForced:!allowedRoles.includes(String(row['Rôle']||row['Role']||row['role']||'learner').toLowerCase())
            };
          });
          setImportData(mapped);setImportResult(null);
        }catch(err){alert('Erreur: '+err.message);}
        e.target.value='';
      };

      const handleImport=async()=>{
        const validData=importData.filter(d=>d._valid);
        if(!validData.length){alert('Aucune donnée valide');return;}
        
        setImportLoading(true);
        try{
          const usersToCreate=validData.map(item=>{
            let targetCenterId=center?.id;
            if(isSuperAdmin&&item.center_name){
              const found=centers.find(c=>c.name.toLowerCase()===item.center_name.toLowerCase());
              if(found)targetCenterId=found.id;
            }
            return{email:item.email,password:item.password||'',first_name:item.first_name,last_name:item.last_name,role:item.role,center_id:targetCenterId};
          });

          const{data:{session}}=await supabase.auth.getSession();
          const response=await fetch(`${SUPABASE_URL}/functions/v1/create-users`,{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token}`},
            body:JSON.stringify({users:usersToCreate})
          });

          const result=await response.json();
          
          if(result.success){
            setImportResult({created:result.created||0,updated:result.updated||0,errors:result.errors||0,results:result.results||[]});
            await load();
          }else{
            setImportResult({created:0,updated:0,errors:validData.length,errorMessage:result.error});
          }
        }catch(err){
          setImportResult({created:0,updated:0,errors:validData.length,errorMessage:err.message});
        }
        setImportLoading(false);
      };

      const downloadTemplate=()=>{
        const template=[{'Email':'paul@email.com','Prénom':'Paul','Nom':'Moreau','Rôle':'learner','Mot de passe':'','Centre':''}];
        const ws=XLSX.utils.json_to_sheet(template);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Utilisateurs');
        XLSX.writeFile(wb,'template_utilisateurs.xlsx');
      };

      const exportResults=()=>{
        if(!importResult?.results)return;
        const data=importResult.results.map(r=>({'Email':r.email,'Statut':r.status==='created'?'Créé':r.status==='updated'?'Mis à jour':'Erreur','Mot de passe':r.password||'','Message':r.message||''}));
        const ws=XLSX.utils.json_to_sheet(data);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Résultats');
        XLSX.writeFile(wb,'resultat_import.xlsx');
      };

      const filtered=useMemo(()=>{
        let result=[...users];
        // Recherche
        if(search){
          const s=search.toLowerCase();

            case 'name':valA=`${a.first_name} ${a.last_name}`.toLowerCase();valB=`${b.first_name} ${b.last_name}`.toLowerCase();break;

          if(valA<valB)return sortDir==='asc'?-1:1;

          return 0;
        });

    function VideosPage(){
      const{center,isSuperAdmin,profile,can}=useAuth();
      const[activeTab,setActiveTab]=useState('videos');
      const[videos,setVideos]=useState([]);
      const[scormModules,setScormModules]=useState([]);
      const[loading,setLoading]=useState(true);

      const[importModal,setImportModal]=useState(false);

      const[form,setForm]=useState({title:'',vimeo_id:'',duration:'',category:'',description:'',sort_order:'',tags:'',theme:'',thumbnail_url:''});
      const[saving,setSaving]=useState(false);
      const[importData,setImportData]=useState([]);
      const[importLoading,setImportLoading]=useState(false);
      const[importResult,setImportResult]=useState(null);
      const[attachments,setAttachments]=useState([]);
      const[chapters,setChapters]=useState([]);
      const[newAttachment,setNewAttachment]=useState({title:'',file:null});
      const[newChapter,setNewChapter]=useState({title:'',timestamp:'',description:''});
      const[uploading,setUploading]=useState(false);
      const[scormModal,setScormModal]=useState(false);
      const[scormEditing,setScormEditing]=useState(null);
      const[scormForm,setScormForm]=useState({title:'',description:'',module_type:'scorm12',package_url:'',entry_point:'sco_0.html',category:'',version:'',remote_url:''});
      const[scormSaving,setScormSaving]=useState(false);
      const[scormZipParsing,setScormZipParsing]=useState(false);
      const[scormZipFile,setScormZipFile]=useState(null);
      const[licensedIds,setLicensedIds]=useState({videos:[],scorm:[],hasFullCatalog:false,hasAnyLicense:false});
      const fileInputRef=useRef(null);
      const attachmentFileRef=useRef(null);
      const scormFileRef=useRef(null);
      const scormZipRef=useRef(null);

      // Parser un fichier ZIP SCORM Dispatch
      const parseScormZip=async(file)=>{
        // Vérifier que JSZip est chargé
        if(typeof JSZip === 'undefined'){
          alert('Bibliothèque ZIP en cours de chargement. Veuillez réessayer dans quelques secondes.');
          return;
        }
        
        setScormZipParsing(true);
        setScormZipFile(file);
        
        const lmsOrigin = window.location.origin; // https://www.crpro.app
        
        try {
          const zip = await JSZip.loadAsync(file);
          let manifest = null;
          let scoHtmlContent = null;
          let entryPoint = 'sco_0.html';
          const filesToUpload = [];
          
          // Chercher les fichiers dans le ZIP
          const fileNames = Object.keys(zip.files);
          for(const filename of fileNames){
            const zipEntry = zip.files[filename];
            if(zipEntry.dir) continue;
            
            const name = filename.toLowerCase();
            const actualName = filename.split('/').pop();
            
            if(name.endsWith('imsmanifest.xml')){
              manifest = await zipEntry.async('string');
              filesToUpload.push({name:'imsmanifest.xml', content:manifest, type:'application/xml'});
            }
            if(name.endsWith('.html')){
              let content = await zipEntry.async('string');
              
              // Injecter lms_origin dans le fichier HTML pour Codes Rousseau
              if(content.includes('layer2.js') || content.includes('data-source')){
                
                // Méthode 1: Définir window.lms_origin DANS le script de chargement de layer2.js
                content = content.replace(
                  "var url = 'https://lms.codesrousseau.fr",
                  "window.lms_origin = '" + lmsOrigin + "'; window.LMS_ORIGIN = '" + lmsOrigin + "'; var url = 'https://lms.codesrousseau.fr"
                );
                
                // Méthode 2: Ajouter lms_origin à l'URL de layer2.js
                content = content.replace(
                  /layer2\.js\?cacherev=/g,
                  'layer2.js?lms_origin=' + encodeURIComponent(lmsOrigin) + '&cacherev='
                );
                
                // NE PAS modifier data-clientid - le laisser vide comme l'original
                // Codes Rousseau détermine le client à partir du domaine lms_origin
                
                scoHtmlContent = content;
                entryPoint = actualName;
                
                console.log('Modified HTML with lms_origin injection (data-clientid unchanged)');
              }
              
              filesToUpload.push({name:actualName, content:content, type:'text/html; charset=utf-8'});
            }
          }
          
          if(!manifest){
            alert('Fichier imsmanifest.xml non trouvé dans le ZIP');
            setScormZipParsing(false);
            return;
          }
          
          // Parser le manifest XML
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(manifest, 'text/xml');
          
          // Extraire le titre
          const titleEl = xmlDoc.querySelector('title langstring') || xmlDoc.querySelector('title');
          const title = titleEl?.textContent?.trim() || file.name.replace('.zip','');
          
          // Générer un slug unique
          const slug = title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+/g,'-').substring(0,50) + '-' + Date.now();
          
          // Détecter le type SCORM
          const schemaVersion = xmlDoc.querySelector('schemaversion')?.textContent || '';
          let moduleType = 'scorm12';
          if(schemaVersion.includes('2004')) moduleType = 'scorm2004';
          
          // Extraire l'URL distante
          let remoteUrl = '';
          if(scoHtmlContent){
            const match = scoHtmlContent.match(/data-source=["']([^"']+)["']/);
            if(match) remoteUrl = match[1];
          }
          
          // Uploader vers Supabase Storage
          let packageUrl = '';
          try {
            console.log('Uploading modified SCORM files with lms_origin:', lmsOrigin);
            for(const f of filesToUpload){
              const filePath = slug + '/' + f.name;
              const blob = new Blob([f.content], {type: f.type});
              const result = await supabase.storage.from('scorm-dispatch').upload(filePath, blob, {
                contentType: f.type,
                upsert: true
              });
              if(result.error){
                console.error('Upload error:', f.name, result.error);
                if(result.error.message && result.error.message.includes('bucket')){
                  alert('Le bucket "scorm-dispatch" n\'existe pas. Créez-le dans Supabase Storage.');
                  break;
                }
              } else {
                console.log('Uploaded:', filePath);
              }
            }
            const urlResult = supabase.storage.from('scorm-dispatch').getPublicUrl(slug + '/' + entryPoint);
            packageUrl = urlResult.data?.publicUrl || '';
          } catch(e) {
            console.error('Storage error:', e);
            packageUrl = remoteUrl;
          }
          
          // Mettre à jour le formulaire
          setScormForm(prev => ({
            ...prev,
            title: title,
            module_type: moduleType,
            entry_point: entryPoint,
            remote_url: remoteUrl,
            package_url: packageUrl || remoteUrl
          }));
          
          console.log('SCORM parsed with lms_origin injection:', {title, moduleType, entryPoint, remoteUrl, packageUrl, lmsOrigin});
          
        } catch(err) {
          console.error('ZIP parse error:', err);
          alert('Erreur lecture ZIP: ' + err.message);
        }
        
        setScormZipParsing(false);
      };

      const load=useCallback(async()=>{
        // Charger les licences du centre
        let licenseInfo={videos:[],scorm:[],hasFullCatalog:false,hasAnyLicense:false};
        if(!isSuperAdmin&&center?.id){
          try{
            const today=new Date().toISOString().split('T')[0];
            const{data:licenses}=await supabase.from('center_licenses').select('*,content_packs(pack_type)').eq('center_id',center.id).eq('status','active').lte('start_date',today).gte('end_date',today);
            licenseInfo.hasAnyLicense=(licenses||[]).length>0;
            licenseInfo.hasFullCatalog=(licenses||[]).some(l=>l.license_type==='full_catalog'||l.content_packs?.pack_type==='full_catalog');
            if(!licenseInfo.hasFullCatalog){
              const packIds=(licenses||[]).map(l=>l.pack_id).filter(Boolean);
              if(packIds.length>0){
                const{data:items}=await supabase.from('content_pack_items').select('content_type,content_id').in('pack_id',packIds);
                (items||[]).forEach(i=>{
                  if(i.content_type==='video')licenseInfo.videos.push(i.content_id);
                  else if(i.content_type==='scorm')licenseInfo.scorm.push(i.content_id);
                });
              }
            }
          }catch(e){console.log('Erreur licences:',e);}
        }
        setLicensedIds(licenseInfo);
        
        // Charger TOUTES les videos (centre + catalogue LMS pour consultation)
        let q=supabase.from('videos').select('*').order('sort_order',{ascending:true,nullsFirst:false}).order('created_at',{ascending:false});
        if(!isSuperAdmin&&center?.id){
          q=q.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        }
        const{data}=await q;
        setVideos(data||[]);
        
        // Charger TOUS les modules SCORM
        try {
          let qs=supabase.from('scorm_modules').select('*').order('created_at',{ascending:false});
          if(!isSuperAdmin&&center?.id){
            qs=qs.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
          }
          const{data:scorm,error}=await qs;
          if(!error)setScormModules(scorm||[]);
        } catch(e) { console.log('SCORM tables not yet created'); }
        
        setLoading(false);
      },[isSuperAdmin,center?.id]);
      useEffect(()=>{load();},[load]);
      
      // Verifier si un contenu est sous licence
      const isLicensed=(type,id)=>{
        if(isSuperAdmin)return true;
        if(licensedIds.hasFullCatalog)return true;
        if(type==='video')return licensedIds.videos.includes(id);
        if(type==='scorm')return licensedIds.scorm.includes(id);
        return false;
      };
      
      const resetForm=()=>setForm({title:'',vimeo_id:'',duration:'',category:'',description:'',sort_order:'',tags:'',theme:'',thumbnail_url:''});
      const resetScormForm=()=>{setScormForm({title:'',description:'',module_type:'scorm12',package_url:'',entry_point:'sco_0.html',category:'',version:'',remote_url:''});setScormZipFile(null);};

      // Gestion SCORM
      const handleScormSave=async()=>{
        setScormSaving(true);
        const payload={
          title:scormForm.title,
          description:scormForm.description||null,
          module_type:scormForm.module_type,
          package_url:scormForm.package_url||null,
          entry_point:scormForm.entry_point||'sco_0.html',
          category:scormForm.category||null,
          center_id:center?.id||null,
          created_by:profile?.id,
          metadata:scormForm.remote_url?{remote_url:scormForm.remote_url,dispatch:true}:{}
        };
        
        console.log('Saving SCORM module:', payload);
        
        let result;
        if(scormEditing){
          result = await supabase.from('scorm_modules').update(payload).eq('id',scormEditing.id);
        }else{
          result = await supabase.from('scorm_modules').insert(payload);
        }
        
        if(result.error){
          console.error('SCORM save error:', result.error);
          alert('Erreur lors de l\'enregistrement: ' + result.error.message + '\n\nVérifiez que les tables SCORM sont créées.');
          setScormSaving(false);
          return;
        }
        
        console.log('SCORM module saved successfully');
        await load();
        setScormModal(false);
        resetScormForm();
        setScormEditing(null);
        setScormSaving(false);
      };
      
      const handleScormDelete=async(id)=>{
        if(!confirm('Supprimer ce module SCORM ?'))return;
        await supabase.from('scorm_modules').delete().eq('id',id);
        load();
      };
      
      const handleScormFileUpload=async(e)=>{
        const file=e.target.files[0];
        if(!file)return;
        
        try{
          const fileName=`scorm/${center?.id||'global'}/${Date.now()}_${file.name}`;
          const{data:uploadData,error:uploadError}=await supabase.storage
            .from('scorm-packages')
            .upload(fileName,file);
          
          if(uploadError)throw uploadError;
          
          const{data:urlData}=supabase.storage
            .from('scorm-packages')
            .getPublicUrl(fileName);
          
          setScormForm(prev=>({...prev,package_url:urlData.publicUrl}));
          alert('Package uploadé avec succès !');
        }catch(err){
          alert('Erreur upload: '+err.message);
        }
        e.target.value='';
      };

      const handleSave=async()=>{
        setSaving(true);
        const vimeoMatch=form.vimeo_id.match(/vimeo\.com\/(\d+)/)||form.vimeo_id.match(/^(\d+)$/);

        const tagsArray=form.tags?form.tags.split(',').map(t=>t.trim()).filter(t=>t):null;
        const payload={title:form.title,vimeo_id:vimeoId,duration:form.duration||null,category:form.category||null,description:form.description||null,sort_order:form.sort_order?parseInt(form.sort_order):null,tags:tagsArray,theme:form.theme||null,thumbnail_url:form.thumbnail_url||null,center_id:center?.id,created_by:profile?.id};

        else await supabase.from('videos').insert(payload);
        await load();setModal(false);resetForm();setEditing(null);setSaving(false);
      };
      const handleDelete=async id=>{if(!confirm('Supprimer ?'))return;await supabase.from('videos').delete().eq('id',id);load();};

      const handleFileSelect=async(e)=>{const file=e.target.files[0];if(!file)return;try{const data=await file.arrayBuffer();const workbook=XLSX.read(data);const sheet=workbook.Sheets[workbook.SheetNames[0]];const jsonData=XLSX.utils.sheet_to_json(sheet);const mapped=jsonData.map((row,i)=>({_index:i+1,title:row['Titre']||row['title']||'',vimeo_id:String(row['ID Vimeo']||row['vimeo_id']||''),duration:row['Durée']||row['duration']||'',category:row['Catégorie']||row['category']||'',description:row['Description']||'',sort_order:row['Ordre']||null,tags:row['Tags']||'',theme:row['Thème']||'',thumbnail_url:row['Miniature URL']||'',_valid:!!(row['Titre']||row['title'])&&!!(row['ID Vimeo']||row['vimeo_id'])}));setImportData(mapped);setImportResult(null);}catch(err){alert('Erreur: '+err.message);}e.target.value='';};

      const handleImport=async()=>{const validData=importData.filter(d=>d._valid);if(!validData.length)return;setImportLoading(true);let created=0,updated=0,errors=0;for(const item of validData){const vimeoMatch=item.vimeo_id.match(/vimeo\.com\/(\d+)/)||item.vimeo_id.match(/^(\d+)$/);const vimeoId=vimeoMatch?vimeoMatch[1]:item.vimeo_id;const tagsArray=item.tags?item.tags.split(',').map(t=>t.trim()).filter(t=>t):null;const payload={title:item.title,vimeo_id:vimeoId,duration:item.duration||null,category:item.category||null,description:item.description||null,sort_order:item.sort_order?parseInt(item.sort_order):null,tags:tagsArray,theme:item.theme||null,thumbnail_url:item.thumbnail_url||null,center_id:center?.id,created_by:profile?.id};const{data:existing}=await supabase.from('videos').select('id').eq('vimeo_id',vimeoId).eq('center_id',center?.id).single();if(existing){const{error}=await supabase.from('videos').update(payload).eq('id',existing.id);if(error)errors++;else updated++;}else{const{error}=await supabase.from('videos').insert(payload);if(error)errors++;else created++;}}setImportLoading(false);setImportResult({created,updated,errors});await load();};

      const downloadTemplate=()=>{const template=[{'Titre':'Ma vidéo','ID Vimeo':'123456789','Durée':'5:30','Ordre':'1','Tags':'tag1, tag2','Catégorie':'Intro','Thème':'Bases','Description':''}];const ws=XLSX.utils.json_to_sheet(template);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Videos');XLSX.writeFile(wb,'template_videos.xlsx');};

      // Ouvrir le modal de détail (documents + chapitres)
      const openDetailModal=async(video)=>{
        setDetailModal(video);
        const[{data:att},{data:chap}]=await Promise.all([
          supabase.from('video_attachments').select('*').eq('video_id',video.id).order('sort_order'),
          supabase.from('video_chapters').select('*').eq('video_id',video.id).order('timestamp_seconds')
        ]);
        setAttachments(att||[]);
        setChapters(chap||[]);
        setNewAttachment({title:'',file:null});
        setNewChapter({title:'',timestamp:'',description:''});
      };

      // Gestion des documents avec upload
      const handleFileChange=(e)=>{
        const file=e.target.files[0];
        if(file){
          setNewAttachment(prev=>({...prev,file,title:prev.title||file.name.split('.')[0]}));
        }
      };
      
      const addAttachment=async()=>{
        if(!newAttachment.title||!newAttachment.file)return;
        setUploading(true);
        
        try{
          const file=newAttachment.file;
          const fileExt=file.name.split('.').pop();
          const fileName=`${detailModal.id}/${Date.now()}.${fileExt}`;
          
          // Upload vers Supabase Storage
          const{data:uploadData,error:uploadError}=await supabase.storage
            .from('attachments')
            .upload(fileName,file);
          
          if(uploadError)throw uploadError;
          
          // Obtenir l'URL publique
          const{data:urlData}=supabase.storage
            .from('attachments')
            .getPublicUrl(fileName);
          
          // Enregistrer dans la base
          const{data}=await supabase.from('video_attachments').insert({
            video_id:detailModal.id,
            title:newAttachment.title,
            file_url:urlData.publicUrl,
            file_type:fileExt,
            file_size:file.size,
            sort_order:attachments.length
          }).select().single();
          
          if(data)setAttachments([...attachments,data]);
          setNewAttachment({title:'',file:null});
          if(attachmentFileRef.current)attachmentFileRef.current.value='';
        }catch(err){
          console.error('Upload error:',err);
          alert('Erreur upload: '+err.message);
        }
        setUploading(false);
      };
      
      const deleteAttachment=async(att)=>{
        // Supprimer du storage
        const filePath=att.file_url.split('/attachments/')[1];
        if(filePath){
          await supabase.storage.from('attachments').remove([filePath]);
        }
        // Supprimer de la base
        await supabase.from('video_attachments').delete().eq('id',att.id);
        setAttachments(attachments.filter(a=>a.id!==att.id));
      };

      // Gestion des chapitres
      const parseTimestamp=(str)=>{
        const parts=str.split(':').map(Number);
        if(parts.length===2)return parts[0]*60+parts[1];
        if(parts.length===3)return parts[0]*3600+parts[1]*60+parts[2];
        return parseInt(str)||0;
      };
      const formatTimestamp=(seconds)=>{
        const m=Math.floor(seconds/60);
        const s=seconds%60;
        return `${m}:${s.toString().padStart(2,'0')}`;
      };
      const addChapter=async()=>{
        if(!newChapter.title||!newChapter.timestamp)return;
        const timestampSeconds=parseTimestamp(newChapter.timestamp);
        const{data}=await supabase.from('video_chapters').insert({
          video_id:detailModal.id,
          title:newChapter.title,
          timestamp_seconds:timestampSeconds,
          description:newChapter.description||null,
          sort_order:chapters.length
        }).select().single();
        if(data)setChapters([...chapters,data].sort((a,b)=>a.timestamp_seconds-b.timestamp_seconds));
        setNewChapter({title:'',timestamp:'',description:''});
      };
      const deleteChapter=async(id)=>{
        await supabase.from('video_chapters').delete().eq('id',id);
        setChapters(chapters.filter(c=>c.id!==id));
      };

      const filtered=videos.filter(v=>!search||v.title?.toLowerCase().includes(search.toLowerCase()));
      if(!can('manage_videos')&&!can('view_videos'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      const moduleTypeLabels={scorm12:'SCORM 1.2',scorm2004:'SCORM 2004',xapi:'xAPI (Tin Can)',cmi5:'cmi5'};
      const canEdit=can('manage_videos');

      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4">
          <h1 className="text-2xl font-bold">Bibliothèque</h1>
          <div className="flex gap-2">
            {activeTab==='videos'&&canEdit&&<><Button variant="secondary" icon="Upload" onClick={()=>setImportModal(true)}>Importer</Button><Button icon="Plus" onClick={()=>{resetForm();setEditing(null);setModal(true);}}>Ajouter vidéo</Button></>}
            {activeTab==='scorm'&&canEdit&&<Button icon="Plus" onClick={()=>{resetScormForm();setScormEditing(null);setScormModal(true);}}>Ajouter SCORM</Button>}
          </div>

        <Tabs tabs={[{id:'videos',label:`Vidéos (${videos.length})`,icon:'Film'},{id:'scorm',label:`SCORM (${scormModules.length})`,icon:'Package'}]} active={activeTab} onChange={setActiveTab}/>
        
        {/* ONGLET VIDÉOS */}
        {activeTab==='videos'&&<>
          <Card className="p-4 mb-6"><Input icon="Search" placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)}/></Card>
          {filtered.length===0?<Empty icon="Film" title="Aucune vidéo"/>:<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{filtered.map(v=>{const licensed=!v.is_lms_content||isLicensed('video',v.id);return<Card key={v.id} className={`overflow-hidden ${!licensed?'opacity-75':''}`}><div className="aspect-video bg-gray-900 relative">{v.thumbnail_url?<img src={v.thumbnail_url} className="w-full h-full object-cover"/>:<iframe src={`https://player.vimeo.com/video/${v.vimeo_id}?background=1`} className="w-full h-full" allow="autoplay"/>}<div className="absolute bottom-2 right-2 px-2 py-1 bg-black/70 rounded text-xs">{v.duration||'--:--'}</div>{v.sort_order&&<div className="absolute top-2 left-2 w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center text-xs font-bold">{v.sort_order}</div>}{v.is_lms_content&&<div className={`absolute top-2 right-2 px-2 py-1 rounded text-xs font-medium ${licensed?'bg-indigo-600':'bg-red-600/80'}`}>{licensed?'📦 LMS':'🔒 Non licencié'}</div>}</div><div className="p-4"><h3 className="font-semibold truncate">{v.title}</h3><div className="flex flex-wrap gap-1 mt-2">{v.category&&<span className="px-2 py-1 bg-gray-700 rounded text-xs">{v.category}</span>}{v.theme&&<span className="px-2 py-1 bg-indigo-600/30 text-indigo-300 rounded text-xs">{v.theme}</span>}{v.is_lms_content&&!isSuperAdmin&&<span className={`px-2 py-1 rounded text-xs ${licensed?'bg-green-500/20 text-green-400':'bg-red-500/20 text-red-400'}`}>{licensed?'✓ Sous licence':'Consultation'}</span>}</div><div className="flex flex-wrap gap-2 mt-3">{licensed&&<Button variant="ghost" size="sm" icon="Settings" onClick={()=>openDetailModal(v)}>Ressources</Button>}{canEdit&&(!v.is_lms_content||isSuperAdmin)&&<><Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(v);setForm({title:v.title,vimeo_id:v.vimeo_id,duration:v.duration||'',category:v.category||'',description:v.description||'',sort_order:v.sort_order||'',tags:v.tags?v.tags.join(', '):'',theme:v.theme||'',thumbnail_url:v.thumbnail_url||''});setModal(true);}}>Modifier</Button><Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(v.id)}/></>}{!licensed&&<span className="text-xs text-gray-500 italic">Demandez une licence pour utiliser</span>}</div></div></Card>})}</div>}
        </>}
        
        {/* ONGLET SCORM */}
        {activeTab==='scorm'&&<>
          {scormModules.length===0?<Empty icon="Package" title="Aucun module SCORM" desc="Ajoutez votre premier module de formation interactif"/>:
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {scormModules.map(m=>{const licensed=!m.is_lms_content||isLicensed('scorm',m.id);return<Card key={m.id} className={`p-4 ${!licensed?'opacity-75':''}`}>
              <div className="flex items-start gap-3 mb-3">
                <div className={`w-12 h-12 rounded-lg flex items-center justify-center shrink-0 ${licensed?'bg-orange-500/20':'bg-red-500/20'}`}>
                  <Icon name="Package" size={24} className={licensed?'text-orange-400':'text-red-400'}/>
                </div>
                <div className="flex-1 min-w-0">
                  <h3 className="font-semibold truncate">{m.title}</h3>
                  <p className="text-sm text-gray-400">{moduleTypeLabels[m.module_type]||m.module_type}</p>
                </div>
                {m.is_lms_content&&<span className={`px-2 py-1 rounded text-xs ${licensed?'bg-indigo-600':'bg-red-600/80'}`}>{licensed?'📦 LMS':'🔒'}</span>}
              </div>
              <div className="flex flex-wrap gap-1 mb-3">{m.category&&<span className="px-2 py-1 bg-purple-500/20 text-purple-300 rounded text-xs">{m.category}</span>}{m.is_lms_content&&!isSuperAdmin&&<span className={`px-2 py-1 rounded text-xs ${licensed?'bg-green-500/20 text-green-400':'bg-red-500/20 text-red-400'}`}>{licensed?'✓ Sous licence':'Non licencié'}</span>}</div>
              {m.description&&<p className="text-sm text-gray-400 line-clamp-2 mb-3">{m.description}</p>}
              <div className="flex gap-2">
                {canEdit&&(!m.is_lms_content||isSuperAdmin)&&<Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{
                  setScormEditing(m);
                  setScormForm({title:m.title,description:m.description||'',module_type:m.module_type,package_url:m.package_url||'',entry_point:m.entry_point||'index.html',category:m.category||'',version:m.version||''});
                  setScormModal(true);
                }}>Modifier</Button>}
                {licensed&&m.package_url&&<a href={m.package_url} target="_blank" className="inline-flex items-center gap-1 px-3 py-1.5 text-sm hover:bg-gray-700 rounded-lg"><Icon name="ExternalLink" size={14}/>Tester</a>}
                {canEdit&&(!m.is_lms_content||isSuperAdmin)&&<Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleScormDelete(m.id)}/>}
                {!licensed&&<span className="text-xs text-gray-500 italic">Demandez une licence</span>}
              </div>
            </Card>})}
          </div>}
        </>}
        
        {/* Modal édition vidéo */}
        <Modal isOpen={modal} onClose={()=>{setModal(false);resetForm();setEditing(null);}} title={editing?'Modifier':'Ajouter'} size="lg"><div className="space-y-4"><div className="grid grid-cols-2 gap-4"><Input label="Titre *" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/><Input label="ID Vimeo *" value={form.vimeo_id} onChange={e=>setForm({...form,vimeo_id:e.target.value})} placeholder="123456789"/></div><div className="grid grid-cols-3 gap-4"><Input label="Durée" value={form.duration} onChange={e=>setForm({...form,duration:e.target.value})} placeholder="5:30"/><Input label="Ordre" type="number" value={form.sort_order} onChange={e=>setForm({...form,sort_order:e.target.value})}/><Input label="Catégorie" value={form.category} onChange={e=>setForm({...form,category:e.target.value})}/></div><div className="grid grid-cols-2 gap-4"><Input label="Thème" value={form.theme} onChange={e=>setForm({...form,theme:e.target.value})}/><Input label="Tags" value={form.tags} onChange={e=>setForm({...form,tags:e.target.value})} placeholder="tag1, tag2"/></div><Input label="Miniature URL" value={form.thumbnail_url} onChange={e=>setForm({...form,thumbnail_url:e.target.value})}/><div><label className="block text-sm font-medium text-gray-300 mb-1">Description</label><textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={2} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/></div><div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>{setModal(false);resetForm();setEditing(null);}}>Annuler</Button><Button onClick={handleSave} loading={saving}>Enregistrer</Button></div></div></Modal>
        
        {/* Modal import */}
        <Modal isOpen={importModal} onClose={()=>{setImportModal(false);setImportData([]);setImportResult(null);}} title="Importer" size="lg"><div className="space-y-4"><div className="bg-gray-700/50 rounded-lg p-4"><p className="text-sm text-gray-400 mb-2">Colonnes : Titre*, ID Vimeo*, Durée, Ordre, Tags, Catégorie, Thème</p><Button variant="ghost" size="sm" icon="Download" onClick={downloadTemplate}>Template</Button></div><div className="border-2 border-dashed border-gray-600 rounded-lg p-8 text-center"><input type="file" ref={fileInputRef} onChange={handleFileSelect} accept=".xlsx,.xls,.csv" className="hidden"/><Icon name="Film" size={48} className="mx-auto text-gray-500 mb-4"/><Button variant="secondary" onClick={()=>fileInputRef.current?.click()}>Parcourir</Button></div>{importData.length>0&&!importResult&&<div className="max-h-48 overflow-y-auto bg-gray-700/50 rounded-lg p-2">{importData.filter(d=>d._valid).map((row,i)=><div key={i} className="text-sm py-1">{row.title}</div>)}</div>}{importResult&&<Alert type={importResult.errors>0?'warning':'success'}>{importResult.created>0&&<span className="text-green-400">✅ {importResult.created} créée(s) </span>}{importResult.updated>0&&<span className="text-blue-400">🔄 {importResult.updated} mise(s) à jour </span>}{importResult.errors>0&&<span className="text-red-400">❌ {importResult.errors} erreur(s)</span>}</Alert>}<div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>{setImportModal(false);setImportData([]);setImportResult(null);}}>Fermer</Button>{importData.length>0&&!importResult&&<Button icon="Upload" onClick={handleImport} loading={importLoading}>Importer {importData.filter(d=>d._valid).length}</Button>}</div></div></Modal>
        
        {/* Modal ressources (documents + chapitres) */}
        <Modal isOpen={!!detailModal} onClose={()=>setDetailModal(null)} title={`Ressources: ${detailModal?.title}`} size="xl">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* Documents */}
            <div>
              <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="Paperclip" size={18}/>Documents joints ({attachments.length})</h3>
              <div className="space-y-2 mb-4 max-h-64 overflow-y-auto">
                {attachments.map(a=>(
                  <div key={a.id} className="flex items-center gap-3 p-3 bg-gray-700 rounded-lg">
                    <Icon name="FileText" size={20} className="text-indigo-400"/>
                    <div className="flex-1 min-w-0">
                      <p className="font-medium truncate text-sm">{a.title}</p>
                      <p className="text-xs text-gray-400">{a.file_type?.toUpperCase()} {a.file_size?`• ${Math.round(a.file_size/1024)} Ko`:''}</p>
                    </div>
                    <a href={a.file_url} download className="p-2 hover:bg-indigo-600 rounded" title="Télécharger"><Icon name="Download" size={16}/></a>
                    <button onClick={()=>deleteAttachment(a)} className="p-2 hover:bg-red-600 rounded" title="Supprimer"><Icon name="Trash2" size={16}/></button>
                  </div>
                ))}
                {attachments.length===0&&<p className="text-gray-500 text-sm text-center py-4">Aucun document</p>}
              </div>
              <div className="space-y-3 p-3 bg-gray-700/50 rounded-lg">
                <Input placeholder="Titre du document" value={newAttachment.title} onChange={e=>setNewAttachment({...newAttachment,title:e.target.value})}/>
                <div className="flex items-center gap-2">
                  <input type="file" ref={attachmentFileRef} onChange={handleFileChange} className="hidden" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip"/>
                  <Button variant="secondary" size="sm" icon="Upload" onClick={()=>attachmentFileRef.current?.click()}>
                    {newAttachment.file?newAttachment.file.name:'Choisir un fichier'}
                  </Button>
                  {newAttachment.file&&<span className="text-xs text-gray-400">{Math.round(newAttachment.file.size/1024)} Ko</span>}
                </div>
                <Button size="sm" icon="Plus" onClick={addAttachment} loading={uploading} disabled={!newAttachment.title||!newAttachment.file||uploading}>
                  {uploading?'Upload en cours...':'Ajouter le document'}
                </Button>
              </div>
            </div>
            
            {/* Chapitres */}
            <div>
              <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="List" size={18}/>Chapitres ({chapters.length})</h3>
              <div className="space-y-2 mb-4 max-h-64 overflow-y-auto">
                {chapters.map(c=>(
                  <div key={c.id} className="flex items-center gap-3 p-3 bg-gray-700 rounded-lg">
                    <span className="px-2 py-1 bg-indigo-600 rounded text-xs font-mono">{formatTimestamp(c.timestamp_seconds)}</span>
                    <div className="flex-1 min-w-0">
                      <p className="font-medium truncate text-sm">{c.title}</p>
                      {c.description&&<p className="text-xs text-gray-400 truncate">{c.description}</p>}
                    </div>
                    <button onClick={()=>deleteChapter(c.id)} className="p-1 hover:bg-red-600 rounded"><Icon name="Trash2" size={16}/></button>
                  </div>
                ))}
                {chapters.length===0&&<p className="text-gray-500 text-sm text-center py-4">Aucun chapitre</p>}
              </div>
              <div className="space-y-2 p-3 bg-gray-700/50 rounded-lg">
                <div className="grid grid-cols-2 gap-2">
                  <Input placeholder="Timestamp (ex: 2:30)" value={newChapter.timestamp} onChange={e=>setNewChapter({...newChapter,timestamp:e.target.value})}/>
                  <Input placeholder="Titre du chapitre" value={newChapter.title} onChange={e=>setNewChapter({...newChapter,title:e.target.value})}/>
                </div>
                <Input placeholder="Description (optionnel)" value={newChapter.description} onChange={e=>setNewChapter({...newChapter,description:e.target.value})}/>
                <Button size="sm" icon="Plus" onClick={addChapter} disabled={!newChapter.title||!newChapter.timestamp}>Ajouter</Button>
              </div>
            </div>
          </div>
        </Modal>
        
        {/* Modal SCORM */}
        <Modal isOpen={scormModal} onClose={()=>{setScormModal(false);resetScormForm();setScormEditing(null);}} title={scormEditing?'Modifier le module SCORM':'Ajouter un module SCORM'} size="lg">
          <div className="space-y-4">
            {/* Zone d'upload ZIP */}
            {!scormEditing&&(
              <div className="border-2 border-dashed border-gray-600 rounded-lg p-6 text-center hover:border-indigo-500 transition-colors">
                <input type="file" ref={scormZipRef} onChange={e=>{if(e.target.files[0])parseScormZip(e.target.files[0]);}} accept=".zip" className="hidden"/>
                {scormZipParsing?(
                  <div className="flex items-center justify-center gap-3">
                    <div className="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"/>
                    <span>Analyse du ZIP...</span>
                  </div>
                ):scormZipFile?(
                  <div>
                    <div className="w-12 h-12 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-2">
                      <Icon name="CheckCircle" size={24} className="text-green-400"/>
                    </div>
                    <p className="font-medium text-green-400">✅ {scormZipFile.name}</p>
                    <p className="text-sm text-gray-400 mt-1">Informations extraites automatiquement</p>
                    <Button variant="ghost" size="sm" className="mt-2" onClick={()=>{setScormZipFile(null);scormZipRef.current.value='';}}>Changer de fichier</Button>
                  </div>
                ):(
                  <div onClick={()=>scormZipRef.current?.click()} className="cursor-pointer">
                    <Icon name="Package" size={48} className="mx-auto text-gray-500 mb-3"/>
                    <p className="font-medium">Glissez un fichier ZIP Dispatch ici</p>
                    <p className="text-sm text-gray-400 mt-1">ou cliquez pour parcourir</p>
                    <p className="text-xs text-gray-500 mt-2">Le titre et l'URL seront extraits automatiquement</p>
                  </div>
                )}
              </div>
            )}
            
            {scormZipFile&&scormForm.remote_url&&(
              <Alert type="success">
                <p className="text-sm"><strong>URL distante détectée :</strong> Le contenu sera chargé depuis le serveur Codes Rousseau.</p>
              </Alert>
            )}
            
            <Input label="Titre *" value={scormForm.title} onChange={e=>setScormForm({...scormForm,title:e.target.value})}/>
            
            <div className="grid grid-cols-2 gap-4">
              <Select label="Type de module" value={scormForm.module_type} onChange={e=>setScormForm({...scormForm,module_type:e.target.value})} options={[{value:'scorm12',label:'SCORM 1.2'},{value:'scorm2004',label:'SCORM 2004'},{value:'xapi',label:'xAPI (Tin Can)'},{value:'cmi5',label:'cmi5'}]}/>
              <Input label="Point d'entrée" value={scormForm.entry_point} onChange={e=>setScormForm({...scormForm,entry_point:e.target.value})} placeholder="sco_0.html"/>
            </div>
            
            <Input label="URL du contenu distant *" value={scormForm.package_url} onChange={e=>setScormForm({...scormForm,package_url:e.target.value})} placeholder="https://lms.codesrousseau.fr/pluginfile.php/..."/>
            
            <Input label="Catégorie" value={scormForm.category} onChange={e=>setScormForm({...scormForm,category:e.target.value})} placeholder="Ex: Formation Moto, Code de la route..."/>
            
            <div>
              <label className="block text-sm font-medium text-gray-300 mb-1">Description</label>
              <textarea value={scormForm.description} onChange={e=>setScormForm({...scormForm,description:e.target.value})} rows={2} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none" placeholder="Description optionnelle du module"/>
            </div>
            
            <div className="flex justify-end gap-3 pt-2">
              <Button variant="secondary" onClick={()=>{setScormModal(false);resetScormForm();setScormEditing(null);}}>Annuler</Button>
              <Button onClick={handleScormSave} loading={scormSaving} disabled={!scormForm.title||!scormForm.package_url}>Enregistrer</Button>
            </div>
          </div>
        </Modal>
      </div>;
    }

    // Playlists
    function PlaylistsPage(){
      const{center,isSuperAdmin,can,profile,realRole}=useAuth();
      const[playlists,setPlaylists]=useState([]);
      const[videos,setVideos]=useState([]);
      const[scormModules,setScormModules]=useState([]);
      const[trainers,setTrainers]=useState([]);
      const[trainerCourses,setTrainerCourses]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({title:'',description:''});
      const[saving,setSaving]=useState(false);
      const[editContentModal,setEditContentModal]=useState(null);
      const[playlistVideos,setPlaylistVideos]=useState([]);
      const[playlistScorm,setPlaylistScorm]=useState([]);
      const[contentTab,setContentTab]=useState('videos');
      const[assignModal,setAssignModal]=useState(null);
      const[assignedTrainers,setAssignedTrainers]=useState([]);
      const[licensedIds,setLicensedIds]=useState({courses:[],hasFullCatalog:false});
      const sortableRef=useRef(null);
      const sortableInstanceRef=useRef(null);

      const load=useCallback(async()=>{
        // Charger les licences du centre
        let licenseInfo={courses:[],hasFullCatalog:false};
        if(!isSuperAdmin&&center?.id){
          try{
            const today=new Date().toISOString().split('T')[0];
            const{data:licenses}=await supabase.from('center_licenses').select('*,content_packs(pack_type)').eq('center_id',center.id).eq('status','active').lte('start_date',today).gte('end_date',today);
            licenseInfo.hasFullCatalog=(licenses||[]).some(l=>l.license_type==='full_catalog'||l.content_packs?.pack_type==='full_catalog');
            if(!licenseInfo.hasFullCatalog){
              const packIds=(licenses||[]).map(l=>l.pack_id).filter(Boolean);
              if(packIds.length>0){
                const{data:items}=await supabase.from('content_pack_items').select('content_type,content_id').in('pack_id',packIds);
                (items||[]).forEach(i=>{if(i.content_type==='course')licenseInfo.courses.push(i.content_id);});
              }
            }
          }catch(e){console.log('Erreur licences:',e);}
        }
        setLicensedIds(licenseInfo);
        
        // Charger les assignations formateur-cours
        let tcData=[];
        try{
          const{data:tc}=await supabase.from('trainer_courses').select('*');
          tcData=tc||[];
          setTrainerCourses(tcData);
        }catch(e){console.log('trainer_courses table not yet created');}
        
        // Charger les cours (du centre + catalogue LMS)
        let q=supabase.from('playlists').select('*,playlist_videos(count)').order('created_at',{ascending:false});
        if(!isSuperAdmin&&center?.id){
          q=q.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        }
        const{data:p}=await q;
        
        let filteredPlaylists=p||[];
        // Si formateur, ne voir que ses cours assignés
        if(realRole==='trainer'&&profile?.id){
          const myCoursesIds=tcData.filter(tc=>tc.trainer_id===profile.id).map(tc=>tc.playlist_id);
          filteredPlaylists=filteredPlaylists.filter(pl=>myCoursesIds.includes(pl.id));
        }
        setPlaylists(filteredPlaylists);
        
        // Charger les vidéos sous licence ou du centre
        let qv=supabase.from('videos').select('*');
        if(!isSuperAdmin&&center?.id)qv=qv.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        const{data:v}=await qv;
        setVideos(v||[]);
        
        // Charger les modules SCORM
        try {
          let qs=supabase.from('scorm_modules').select('*');
          if(!isSuperAdmin&&center?.id)qs=qs.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
          const{data:scorm,error}=await qs;
          if(!error)setScormModules(scorm||[]);
        } catch(e) { console.log('SCORM tables not yet created'); }
        
        // Charger les formateurs du centre (pour l'assignation)
        if(can('manage_playlists')){
          let qt=supabase.from('profiles').select('id,first_name,last_name,email').eq('role','trainer');
          if(!isSuperAdmin&&center?.id)qt=qt.eq('center_id',center.id);
          const{data:t}=await qt;
          setTrainers(t||[]);
        }
        
        setLoading(false);
      },[isSuperAdmin,center?.id,realRole,profile?.id,can]);
      useEffect(()=>{load();},[load]);

      const handleSave=async()=>{setSaving(true);const payload={title:form.title,description:form.description,center_id:center?.id,created_by:profile?.id};if(editing)await supabase.from('playlists').update(payload).eq('id',editing.id);else await supabase.from('playlists').insert(payload);await load();setModal(false);setForm({title:'',description:''});setEditing(null);setSaving(false);};
      const handleDelete=async id=>{if(!confirm('Supprimer ?'))return;await supabase.from('playlists').delete().eq('id',id);load();};
      
      // Gestion des formateurs assignés
      const openAssignModal=async(playlist)=>{
        const assigned=trainerCourses.filter(tc=>tc.playlist_id===playlist.id).map(tc=>tc.trainer_id);
        setAssignedTrainers(assigned);
        setAssignModal(playlist);
      };
      
      const toggleTrainerAssignment=async(trainerId)=>{
        const isAssigned=assignedTrainers.includes(trainerId);
        if(isAssigned){
          await supabase.from('trainer_courses').delete().eq('playlist_id',assignModal.id).eq('trainer_id',trainerId);
          setAssignedTrainers(assignedTrainers.filter(id=>id!==trainerId));
        }else{
          await supabase.from('trainer_courses').insert({playlist_id:assignModal.id,trainer_id:trainerId});
          setAssignedTrainers([...assignedTrainers,trainerId]);
        }
        // Mettre à jour le cache local
        const{data:tc}=await supabase.from('trainer_courses').select('*');
        setTrainerCourses(tc||[]);
      };
      
      const getAssignedTrainersCount=(playlistId)=>{
        return trainerCourses.filter(tc=>tc.playlist_id===playlistId).length;
      };
      
      // Vérifier si un cours est sous licence
      const isCourseLicensed=(courseId)=>{
        if(isSuperAdmin)return true;
        if(licensedIds.hasFullCatalog)return true;
        return licensedIds.courses.includes(courseId);
      };
      
      const openEditContent=async(playlist)=>{
        const{data:pvs}=await supabase.from('playlist_videos').select('*,videos(*)').eq('playlist_id',playlist.id).order('position');
        setPlaylistVideos(pvs||[]);
        
        // Charger les modules SCORM du cours
        const{data:ps}=await supabase.from('playlist_scorm').select('*,scorm_modules(*)').eq('playlist_id',playlist.id).order('position');
        setPlaylistScorm(ps||[]);
        
        setEditContentModal(playlist);
        setContentTab('videos');
      };
      
      const addVideoToPlaylist=async(videoId)=>{const pos=playlistVideos.length;const{data}=await supabase.from('playlist_videos').insert({playlist_id:editContentModal.id,video_id:videoId,position:pos}).select('*,videos(*)').single();if(data)setPlaylistVideos([...playlistVideos,data]);};
      const removeVideoFromPlaylist=async(pvId)=>{await supabase.from('playlist_videos').delete().eq('id',pvId);setPlaylistVideos(playlistVideos.filter(pv=>pv.id!==pvId));};
      
      const addScormToPlaylist=async(scormId)=>{
        const pos=playlistScorm.length;
        const{data}=await supabase.from('playlist_scorm').insert({playlist_id:editContentModal.id,scorm_module_id:scormId,position:pos}).select('*,scorm_modules(*)').single();
        if(data)setPlaylistScorm([...playlistScorm,data]);
      };
      const removeScormFromPlaylist=async(psId)=>{
        await supabase.from('playlist_scorm').delete().eq('id',psId);
        setPlaylistScorm(playlistScorm.filter(ps=>ps.id!==psId));
      };
      
      const togglePublish=async(playlist)=>{await supabase.from('playlists').update({is_published:!playlist.is_published}).eq('id',playlist.id);load();};
      
      // Drag & Drop pour vidéos
      useEffect(()=>{
        if(!editContentModal||!sortableRef.current||contentTab!=='videos')return;
        if(sortableInstanceRef.current)sortableInstanceRef.current.destroy();
        
        sortableInstanceRef.current=new Sortable(sortableRef.current,{
          animation:150,
          handle:'.drag-handle',
          ghostClass:'opacity-50',
          onEnd:async(evt)=>{
            const{oldIndex,newIndex}=evt;
            if(oldIndex===newIndex)return;
            const newOrder=[...playlistVideos];
            const[moved]=newOrder.splice(oldIndex,1);
            newOrder.splice(newIndex,0,moved);
            setPlaylistVideos(newOrder);
            for(let i=0;i<newOrder.length;i++){
              await supabase.from('playlist_videos').update({position:i}).eq('id',newOrder[i].id);
            }
          }
        });
        
        return()=>{
          if(sortableInstanceRef.current){
            sortableInstanceRef.current.destroy();
            sortableInstanceRef.current=null;
          }
        };
      },[editContentModal,playlistVideos.length,contentTab]);

      if(!can('manage_playlists')&&profile?.role!=='trainer')return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;
      return<div>
        <div className="flex items-center justify-between mb-6">
          <div>
            <h1 className="text-2xl font-bold">Cours</h1>
            {realRole==='trainer'&&<p className="text-sm text-gray-400">Vos cours assignés</p>}
          </div>
          {can('manage_playlists')&&<Button icon="Plus" onClick={()=>{setForm({title:'',description:''});setEditing(null);setModal(true);}}>Créer</Button>}
        </div>
        {playlists.length===0?<Empty icon="BookOpen" title={realRole==='trainer'?'Aucun cours assigné':'Aucun cours'}/>:<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{playlists.map(p=>{
          const licensed=!p.is_lms_content||isCourseLicensed(p.id);
          const isLocked=p.is_lms_content&&p.is_locked;
          const canModify=can('manage_playlists')&&(!p.is_lms_content||isSuperAdmin)&&!isLocked;
          return<Card key={p.id} className={`p-4 ${!licensed?'opacity-75':''}`}>
          <div className="flex items-start justify-between mb-3">
            <div>
              <div className="flex items-center gap-2">
                <h3 className="font-semibold">{p.title}</h3>
                {isLocked&&<Icon name="Lock" size={14} className="text-red-400"/>}
              </div>
              <p className="text-sm text-gray-400 mt-1">{p.playlist_videos?.[0]?.count||0} vidéos</p>
              {can('manage_playlists')&&getAssignedTrainersCount(p.id)>0&&(
                <p className="text-xs text-indigo-400 mt-1"><Icon name="Users" size={12} className="inline mr-1"/>{getAssignedTrainersCount(p.id)} formateur(s)</p>
              )}
            </div>
            <div className="flex flex-col gap-1 items-end">
              {p.is_lms_content&&<span className={`px-2 py-0.5 rounded text-xs ${licensed?'bg-indigo-600':'bg-red-600/80'}`}>{licensed?'📦 LMS':'🔒 Non licencié'}</span>}
              <span className={`px-2 py-1 rounded text-xs ${p.is_published?'bg-green-500/20 text-green-400':'bg-gray-500/20 text-gray-400'}`}>{p.is_published?'Publié':'Brouillon'}</span>
            </div>
          </div>
          {p.is_lms_content&&!isSuperAdmin&&<div className="mb-3"><span className={`text-xs px-2 py-1 rounded ${licensed?'bg-green-500/20 text-green-400':'bg-red-500/20 text-red-400'}`}>{licensed?'✓ Sous licence':(isLocked?'Consultation seule':'Non licencié')}</span>{isLocked&&licensed&&<span className="text-xs text-gray-500 ml-2">• Non modifiable</span>}</div>}
          <div className="flex flex-wrap gap-2">
            {licensed&&(can('manage_playlists')||can('assign_content'))&&!isLocked&&<Button variant="ghost" size="sm" icon="Layers" onClick={()=>openEditContent(p)}>Contenu</Button>}
            {licensed&&isLocked&&<Button variant="ghost" size="sm" icon="Eye" onClick={()=>openEditContent(p)}>Voir contenu</Button>}
            {canModify&&<>
              <Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(p);setForm({title:p.title,description:p.description||''});setModal(true);}}>Modifier</Button>
              <Button variant="ghost" size="sm" icon="Users" onClick={()=>openAssignModal(p)}>Formateurs</Button>
            </>}

    // Quiz Management avec types de questions variés

    // ==================== QUIZ & BANQUE DE QUESTIONS ====================
    function QuizzesPage(){
      const{can,profile}=useAuth();
      const[loading,setLoading]=useState(true);
      const[activeTab,setActiveTab]=useState('questions');

      const[quizzes,setQuizzes]=useState([]);
      const[playlists,setPlaylists]=useState([]);
      const[bankQuestions,setBankQuestions]=useState([]);
      const[categories,setCategories]=useState([]);
      const[themes,setThemes]=useState([]);
      const[subThemes,setSubThemes]=useState([]);
      
      // États UI
      const[expandedCats,setExpandedCats]=useState({});
      const[expandedThemes,setExpandedThemes]=useState({});
      const[editingQuestion,setEditingQuestion]=useState(null);
      const[uploadingMedia,setUploadingMedia]=useState(false);
      const[saving,setSaving]=useState(false);
      const[showStats,setShowStats]=useState(false);
      
      // Filtres arborescence (checkboxes)
      const[filterChecked,setFilterChecked]=useState({categories:{},themes:{},subThemes:{}});
      const[filterSearch,setFilterSearch]=useState('');

      const[showFilterPanel,setShowFilterPanel]=useState(false);
      
      // Mini-modals pour création à la volée
      const[quickAdd,setQuickAdd]=useState(null); // {type:'category'|'theme'|'subtheme', parentId?}
      const[quickAddValue,setQuickAddValue]=useState('');
      
      // Quiz
      const[quizModal,setQuizModal]=useState(false);
      const[editingQuiz,setEditingQuiz]=useState(null);
      const[quizForm,setQuizForm]=useState({title:'',description:'',playlist_id:'',passing_score:70,is_required:false,max_attempts:0,time_limit:0,shuffle_questions:false,shuffle_answers:false,show_answers:true,show_feedback:true,allow_review:true});
      const[quizQuestions,setQuizQuestions]=useState([]);
      const[selectedQuestions,setSelectedQuestions]=useState([]);
      const[previewQuiz,setPreviewQuiz]=useState(null);
      const[previewAnswers,setPreviewAnswers]=useState({});
      const[previewSubmitted,setPreviewSubmitted]=useState(false);
      
      // Pioche intelligente
      const[showPickerModal,setShowPickerModal]=useState(false);
      const[pickerConfig,setPickerConfig]=useState({mode:'branch',categoryId:'',themeId:'',count:10,balance:false});
      
      const sortableRef=useRef(null);
      const sortableInstance=useRef(null);
      
      const DIFFICULTIES=[{value:'easy',label:'Facile',color:'green'},{value:'medium',label:'Moyen',color:'yellow'},{value:'hard',label:'Difficile',color:'red'}];
      const QUESTION_TYPES={
        single:{label:'Choix unique',icon:'CircleDot'},
        multiple:{label:'Choix multiple',icon:'CheckSquare'},
        true_false:{label:'Vrai/Faux',icon:'ToggleLeft'},
        text:{label:'Texte libre',icon:'Type'},
        matching:{label:'Correspondance',icon:'GitMerge'},
        ordering:{label:'Ordonnancement',icon:'ListOrdered'}
      };
      
      const getEmptyQuestion=(type='single')=>{
        const base={question_text:'',question_type:type,category_id:'',theme_id:'',sub_theme_id:'',difficulty:'medium',points:1,time_limit:0,image_url:'',audio_url:'',vimeo_id:'',feedback_correct:'',feedback_incorrect:'',answers:[],keywords:[],pairs:[],items:[]};
        switch(type){
          case'true_false':return{...base,answers:[{text:'Vrai',is_correct:true},{text:'Faux',is_correct:false}]};
          case'text':return{...base,answers:[{text:'',is_correct:true}]};
          case'matching':return{...base,pairs:[{left:'',right:''},{left:'',right:''}]};
          case'ordering':return{...base,items:['','']};
          default:return{...base,answers:[{text:'',is_correct:false},{text:'',is_correct:false}]};
        }
      };
      
      const[questionForm,setQuestionForm]=useState(getEmptyQuestion());
      
      // ========== CHARGEMENT ==========
      const load=useCallback(async()=>{
        try{
          const{data:qz}=await supabase.from('quizzes').select('*').order('created_at',{ascending:false});
          setQuizzes(qz||[]);
          const{data:pl}=await supabase.from('playlists').select('id,title').order('title');
          setPlaylists(pl||[]);
          
          // Charger avec la nouvelle structure (category_id dans themes)
          try{
            const{data:cats}=await supabase.from('question_categories').select('*').order('name');
            setCategories(cats||[]);
          }catch(e){setCategories([]);}
          
          try{
            const{data:th}=await supabase.from('question_themes').select('*').order('name');
            setThemes(th||[]);
          }catch(e){setThemes([]);}
          
          try{
            const{data:sth}=await supabase.from('question_sub_themes').select('*').order('name');
            setSubThemes(sth||[]);
          }catch(e){setSubThemes([]);}
          
          try{
            const{data:bank}=await supabase.from('question_bank').select('*,question_bank_answers(*)').order('created_at',{ascending:false});
            setBankQuestions(bank||[]);
          }catch(e){setBankQuestions([]);}
        }catch(err){console.error('Erreur chargement:',err);}
        setLoading(false);
      },[]);
      
      useEffect(()=>{load();},[load]);
      
      // Drag & drop quiz
      useEffect(()=>{
        if(sortableRef.current&&quizQuestions.length>0&&window.Sortable){
          if(sortableInstance.current)sortableInstance.current.destroy();
          sortableInstance.current=window.Sortable.create(sortableRef.current,{
            animation:150,handle:'.drag-handle',
            onEnd:(evt)=>{const arr=[...quizQuestions];const[m]=arr.splice(evt.oldIndex,1);arr.splice(evt.newIndex,0,m);setQuizQuestions(arr);}
          });
        }
        return()=>{if(sortableInstance.current)sortableInstance.current.destroy();};
      },[quizQuestions]);
      
      // ========== HELPERS HIÉRARCHIE ==========
      const getThemesForCategory=(catId)=>themes.filter(t=>t.category_id===catId);
      const getSubThemesForTheme=(themeId)=>subThemes.filter(st=>st.theme_id===themeId);
      const getCategoryName=(id)=>categories.find(c=>c.id===id)?.name||'';
      const getThemeName=(id)=>themes.find(t=>t.id===id)?.name||'';
      const getSubThemeName=(id)=>subThemes.find(st=>st.id===id)?.name||'';
      
      const countQuestionsForCategory=(catId)=>bankQuestions.filter(q=>q.category_id===catId).length;
      const countQuestionsForTheme=(themeId)=>bankQuestions.filter(q=>q.theme_id===themeId).length;
      const countQuestionsForSubTheme=(stId)=>bankQuestions.filter(q=>q.sub_theme_id===stId).length;
      
      // ========== GESTION CATÉGORIES/THÈMES/SOUS-THÈMES ==========
      const addCategory=async(name)=>{
        if(!name?.trim())return null;
        const{data}=await supabase.from('question_categories').insert({name:name.trim()}).select().single();
        if(data)setCategories(prev=>[...prev,data]);
        return data;
      };
      
      const deleteCategory=async(id)=>{
        const count=countQuestionsForCategory(id);
        if(count>0&&!confirm(`${count} question(s) dans cette catégorie. Supprimer quand même ?`))return;
        // Supprimer les thèmes et sous-thèmes associés
        const themeIds=themes.filter(t=>t.category_id===id).map(t=>t.id);
        if(themeIds.length>0){
          await supabase.from('question_sub_themes').delete().in('theme_id',themeIds);
          await supabase.from('question_themes').delete().eq('category_id',id);
        }
        await supabase.from('question_bank').update({category_id:null,theme_id:null,sub_theme_id:null}).eq('category_id',id);
        await supabase.from('question_categories').delete().eq('id',id);
        load();
      };
      
      const addTheme=async(name,categoryId)=>{
        if(!name?.trim()||!categoryId)return null;
        const{data}=await supabase.from('question_themes').insert({name:name.trim(),category_id:categoryId}).select().single();
        if(data)setThemes(prev=>[...prev,data]);
        return data;
      };
      
      const deleteTheme=async(id)=>{
        const count=countQuestionsForTheme(id);
        if(count>0&&!confirm(`${count} question(s) dans ce thème. Supprimer quand même ?`))return;
        await supabase.from('question_sub_themes').delete().eq('theme_id',id);
        await supabase.from('question_bank').update({theme_id:null,sub_theme_id:null}).eq('theme_id',id);
        await supabase.from('question_themes').delete().eq('id',id);
        load();
      };
      
      const addSubTheme=async(name,themeId)=>{
        if(!name?.trim()||!themeId)return null;
        const{data}=await supabase.from('question_sub_themes').insert({name:name.trim(),theme_id:themeId}).select().single();
        if(data)setSubThemes(prev=>[...prev,data]);
        return data;
      };
      
      const deleteSubTheme=async(id)=>{
        const count=countQuestionsForSubTheme(id);
        if(count>0&&!confirm(`${count} question(s) dans ce sous-thème. Supprimer quand même ?`))return;
        await supabase.from('question_bank').update({sub_theme_id:null}).eq('sub_theme_id',id);
        await supabase.from('question_sub_themes').delete().eq('id',id);
        load();
      };
      
      // Création rapide (depuis le formulaire)
      const handleQuickAdd=async()=>{
        if(!quickAddValue.trim()){setQuickAdd(null);return;}
        let result=null;
        if(quickAdd.type==='category'){
          result=await addCategory(quickAddValue);
          if(result)setQuestionForm(f=>({...f,category_id:result.id}));
        }else if(quickAdd.type==='theme'&&quickAdd.parentId){
          result=await addTheme(quickAddValue,quickAdd.parentId);
          if(result)setQuestionForm(f=>({...f,theme_id:result.id}));
        }else if(quickAdd.type==='subtheme'&&quickAdd.parentId){
          result=await addSubTheme(quickAddValue,quickAdd.parentId);
          if(result)setQuestionForm(f=>({...f,sub_theme_id:result.id}));
        }
        setQuickAdd(null);
        setQuickAddValue('');
      };
      
      // ========== MÉDIAS ==========
      const uploadMedia=async(file,type)=>{
        if(!file)return null;
        setUploadingMedia(true);
        try{
          const ext=file.name.split('.').pop().toLowerCase();
          const fileName=`${Date.now()}-${Math.random().toString(36).substr(2,9)}.${ext}`;
          const folder=type==='image'?'question-images':'question-audio';
          const{error}=await supabase.storage.from('media').upload(`${folder}/${fileName}`,file);
          if(error)throw error;
          const{data:{publicUrl}}=supabase.storage.from('media').getPublicUrl(`${folder}/${fileName}`);
          return publicUrl;
        }catch(err){alert('Erreur upload: '+err.message);return null;}
        finally{setUploadingMedia(false);}
      };
      
      const handleImageChange=async(e)=>{
        const file=e.target.files[0];if(!file)return;
        if(!file.type.startsWith('image/')){alert('Image requise');return;}
        if(file.size>5*1024*1024){alert('Max 5 Mo');return;}
        const url=await uploadMedia(file,'image');
