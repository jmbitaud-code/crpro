      const[editForm,setEditForm]=useState({name:'',description:'',color:'#6366f1',tags:[]});
      const[tagInput,setTagInput]=useState('');
      
      // Recherche
      const[searchQuery,setSearchQuery]=useState('');
      const[searchResults,setSearchResults]=useState({categories:[],themes:[],subThemes:[]});
      
      // Modal gestion tags
      const[tagsModal,setTagsModal]=useState(false);
      const[newTagForm,setNewTagForm]=useState({name:'',color:'#6b7280',description:''});
      
      // Import Excel
      const[importModal,setImportModal]=useState(false);
      const[importData,setImportData]=useState(null);
      const[importPreview,setImportPreview]=useState([]);
      const[importing,setImporting]=useState(false);
      const[importStats,setImportStats]=useState(null);
      const[importMode,setImportMode]=useState('merge');
      const fileInputRef=useRef(null);
      
      // Chargement
      const load=useCallback(async()=>{
        try{
          // Charger les catégories en premier (table principale)
          const{data:cats,error:catsError}=await supabase.from('content_categories').select('*').order('position').order('name');
          if(catsError)console.error('Erreur content_categories:',catsError);
          setCategories(cats||[]);
          
          // Charger les tables secondaires (peuvent ne pas exister)
          try{
            const[{data:ths},{data:sths},{data:tags}]=await Promise.all([
              supabase.from('content_themes').select('*').order('position').order('name'),
              supabase.from('content_sub_themes').select('*').order('position').order('name'),
              supabase.from('content_tags').select('*').order('usage_count',{ascending:false}).order('name')
            ]);
            setThemes(ths||[]);
            setSubThemes(sths||[]);
            setPredefinedTags(tags||[]);
          }catch(e){console.warn('Tables secondaires non disponibles:',e);}
          
          // Compter les contenus par catégorie
          const stats={};
          try{
            const[{data:vids},{data:scorm},{data:quiz},{data:cours},{data:paths}]=await Promise.all([
              supabase.from('videos').select('id,category_id'),
              supabase.from('scorm_modules').select('id,category_id'),
              supabase.from('quizzes').select('id,category_id'),
              supabase.from('playlists').select('id,category_id'),
              supabase.from('learning_paths').select('id,category_id')
            ]);
            
            const countByCat=(items)=>{
              const c={};
              (items||[]).forEach(i=>{if(i.category_id){c[i.category_id]=(c[i.category_id]||0)+1;}});
              return c;
            };
            
            stats.videos=countByCat(vids);
            stats.scorm=countByCat(scorm);
            stats.quizzes=countByCat(quiz);
            stats.courses=countByCat(cours);
            stats.paths=countByCat(paths);
            setContentStats(stats);
          }catch(e){console.warn('Stats contenus non disponibles:',e);}
          
        }catch(e){
          console.error('Erreur chargement catégories:',e);
        }
        setLoading(false);
        reloadTaxonomy();
      },[reloadTaxonomy]);
      
      useEffect(()=>{load();},[load]);
      
      // Helpers
      const getThemesForCategory=(catId)=>themes.filter(t=>t.category_id===catId);
      const getSubThemesForTheme=(themeId)=>subThemes.filter(st=>st.theme_id===themeId);
      
      const getContentCount=(catId)=>{
        return (contentStats.videos?.[catId]||0)+
               (contentStats.scorm?.[catId]||0)+
               (contentStats.quizzes?.[catId]||0)+
               (contentStats.courses?.[catId]||0)+
               (contentStats.paths?.[catId]||0);
      };
      
      // ============ RECHERCHE EN TEMPS RÉEL ============
      useEffect(()=>{
        if(!searchQuery.trim()){
          setSearchResults({categories:[],themes:[],subThemes:[]});
          return;
        }
        
        const q=searchQuery.toLowerCase().trim();
        const matchedCatIds=new Set();
        const matchedThemeIds=new Set();
        
        // Chercher dans les catégories
        const matchedCats=categories.filter(c=>{
          const nameMatch=c.name.toLowerCase().includes(q);
          const descMatch=(c.description||'').toLowerCase().includes(q);
          const tagsMatch=(c.tags||[]).some(t=>t.toLowerCase().includes(q));
          return nameMatch||descMatch||tagsMatch;
        });
        matchedCats.forEach(c=>matchedCatIds.add(c.id));
        
        // Chercher dans les thèmes
        const matchedThemes=themes.filter(t=>{
          const nameMatch=t.name.toLowerCase().includes(q);
          const descMatch=(t.description||'').toLowerCase().includes(q);
          const tagsMatch=(t.tags||[]).some(tag=>tag.toLowerCase().includes(q));
          return nameMatch||descMatch||tagsMatch;
        });
        matchedThemes.forEach(t=>{
          matchedThemeIds.add(t.id);
          matchedCatIds.add(t.category_id);
        });
        
        // Chercher dans les sous-thèmes
        const matchedSubThemes=subThemes.filter(st=>{
          const nameMatch=st.name.toLowerCase().includes(q);
          const descMatch=(st.description||'').toLowerCase().includes(q);
          const tagsMatch=(st.tags||[]).some(tag=>tag.toLowerCase().includes(q));
          return nameMatch||descMatch||tagsMatch;
        });
        matchedSubThemes.forEach(st=>{
          matchedThemeIds.add(st.theme_id);
          const theme=themes.find(t=>t.id===st.theme_id);
          if(theme)matchedCatIds.add(theme.category_id);
        });
        
        setSearchResults({
          categories:Array.from(matchedCatIds),
          themes:Array.from(matchedThemeIds),
          subThemes:matchedSubThemes.map(st=>st.id)

        // Auto-expansion
        const newExpandedCats={};

        matchedCatIds.forEach(id=>{newExpandedCats[id]=true;});
        matchedThemeIds.forEach(id=>{newExpandedThemes[id]=true;});
        setExpandedCats(prev=>({...prev,...newExpandedCats}));
        setExpandedThemes(prev=>({...prev,...newExpandedThemes}));
        
      },[searchQuery,categories,themes,subThemes]);
      
      const isHighlighted=(type,id)=>{

      // ============ CRUD CATÉGORIES ============

      // ============ EXPORT EXCEL ============

      // ============ IMPORT EXCEL ============
      const handleFileSelect=(e)=>{
        const file=e.target.files?.[0];
        if(!file||!window.XLSX)return;
        
        const reader=new FileReader();
        reader.onload=(evt)=>{
          try{
            const data=new Uint8Array(evt.target.result);
            const workbook=XLSX.read(data,{type:'array'});
            let sheetName=workbook.SheetNames.find(n=>n.toLowerCase().includes('catég')||n.toLowerCase().includes('categ'))||workbook.SheetNames[0];
            const json=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{defval:''});
            
            if(!json.length){alert('Fichier vide.');return;}
            
            // Normaliser
            const normalized=json.map(row=>{
              const n={};
              Object.keys(row).forEach(key=>{
                const k=key.toLowerCase().trim();
                if(k.includes('catégorie')||k==='categorie'||k==='category')n.category=String(row[key]).trim();
                else if(k==='couleur'||k==='color')n.color=String(row[key]).trim();
                else if(k==='description')n.description=String(row[key]).trim();
                else if(k==='tags catégorie'||k==='tags categorie'||k==='category tags')n.categoryTags=String(row[key]).trim();
                else if(k==='thème'||k==='theme')n.theme=String(row[key]).trim();
                else if(k==='tags thème'||k==='tags theme'||k==='theme tags')n.themeTags=String(row[key]).trim();
                else if(k.includes('sous-thème')||k.includes('sous_theme')||k==='subtheme')n.subTheme=String(row[key]).trim();
                else if(k.includes('tags sous')||k==='subtheme tags')n.subThemeTags=String(row[key]).trim();
              });
              return n;
            }).filter(r=>r.category);
            
            if(!normalized.length){alert('Aucune catégorie trouvée.');return;}
            
            // Construire structure
            const structure={};
            normalized.forEach(row=>{
              const catName=row.category;
              if(!structure[catName]){
                structure[catName]={
                  name:catName,
                  color:row.color?.startsWith('#')?row.color:'#6366f1',
                  description:row.description||'',
                  tags:row.categoryTags?row.categoryTags.split(',').map(t=>t.trim()).filter(Boolean):[],
                  themes:{}
                };
              }
              if(row.theme){
                if(!structure[catName].themes[row.theme]){
                  structure[catName].themes[row.theme]={
                    name:row.theme,
                    tags:row.themeTags?row.themeTags.split(',').map(t=>t.trim()).filter(Boolean):[],
                    subThemes:{}
                  };
                }
                if(row.subTheme){
                  if(!structure[catName].themes[row.theme].subThemes[row.subTheme]){
                    structure[catName].themes[row.theme].subThemes[row.subTheme]={
                      name:row.subTheme,
                      tags:row.subThemeTags?row.subThemeTags.split(',').map(t=>t.trim()).filter(Boolean):[]
                    };
                  }
                }
              }
            });
            
            const preview=Object.values(structure).map(cat=>({
              ...cat,
              themes:Object.values(cat.themes).map(th=>({
                ...th,
                subThemes:Object.values(th.subThemes)
              }))
            }));
            
            // Collecter tous les tags uniques
            const allTags=new Set();
            preview.forEach(c=>{
              (c.tags||[]).forEach(t=>allTags.add(t));
              c.themes.forEach(th=>{
                (th.tags||[]).forEach(t=>allTags.add(t));
                th.subThemes.forEach(st=>(st.tags||[]).forEach(t=>allTags.add(t)));
              });
            });
            
            setImportData(normalized);
            setImportPreview(preview);
            setImportStats({
              categories:preview.length,
              themes:preview.reduce((s,c)=>s+c.themes.length,0),
              subThemes:preview.reduce((s,c)=>s+c.themes.reduce((s2,t)=>s2+t.subThemes.length,0),0),
              tags:allTags.size
            });
            setImportModal(true);
            
          }catch(err){alert('Erreur: '+err.message);}
        };
        reader.readAsArrayBuffer(file);
        e.target.value='';
      };
      
      const executeImport=async()=>{
        if(!importPreview.length)return;
        setImporting(true);
        
        try{
          // Collecter et créer les tags manquants
          const allTags=new Set();
          importPreview.forEach(c=>{
            (c.tags||[]).forEach(t=>allTags.add(t));
            c.themes.forEach(th=>{
              (th.tags||[]).forEach(t=>allTags.add(t));
              th.subThemes.forEach(st=>(st.tags||[]).forEach(t=>allTags.add(t)));
            });
          });
          
          const existingTagNames=predefinedTags.map(t=>t.name.toLowerCase());
          const newTags=Array.from(allTags).filter(t=>!existingTagNames.includes(t.toLowerCase()));
          
          if(newTags.length>0){
            const colors=['#6b7280','#ef4444','#f59e0b','#22c55e','#3b82f6','#8b5cf6','#ec4899'];
            for(let i=0;i<newTags.length;i++){
              await supabase.from('content_tags').insert({name:newTags[i],color:colors[i%colors.length]}).select();
            }
          }
          
          if(importMode==='replace'){
            await supabase.from('content_sub_themes').delete().neq('id','00000000-0000-0000-0000-000000000000');
            await supabase.from('content_themes').delete().neq('id','00000000-0000-0000-0000-000000000000');
            await supabase.from('content_categories').delete().neq('id','00000000-0000-0000-0000-000000000000');
          }
          
          for(let i=0;i<importPreview.length;i++){
            const cat=importPreview[i];
            let categoryId;
            
            if(importMode==='merge'){
              const{data:existing}=await supabase.from('content_categories').select('id').eq('name',cat.name).single();
              if(existing){
                await supabase.from('content_categories').update({color:cat.color,description:cat.description,tags:cat.tags}).eq('id',existing.id);
                categoryId=existing.id;
              }else{
                const{data:newCat}=await supabase.from('content_categories').insert({name:cat.name,color:cat.color,description:cat.description,position:i,tags:cat.tags}).select().single();
                categoryId=newCat?.id;
              }
            }else{
              const{data:newCat}=await supabase.from('content_categories').insert({name:cat.name,color:cat.color,description:cat.description,position:i,tags:cat.tags}).select().single();
              categoryId=newCat?.id;
            }
            
            if(!categoryId)continue;
            
            for(let j=0;j<cat.themes.length;j++){
              const theme=cat.themes[j];
              let themeId;
              
              if(importMode==='merge'){
                const{data:existing}=await supabase.from('content_themes').select('id').eq('category_id',categoryId).eq('name',theme.name).single();
                if(existing){
                  await supabase.from('content_themes').update({tags:theme.tags}).eq('id',existing.id);
                  themeId=existing.id;
                }else{
                  const{data:newTh}=await supabase.from('content_themes').insert({name:theme.name,category_id:categoryId,position:j,tags:theme.tags}).select().single();
                  themeId=newTh?.id;
                }
              }else{
                const{data:newTh}=await supabase.from('content_themes').insert({name:theme.name,category_id:categoryId,position:j,tags:theme.tags}).select().single();
                themeId=newTh?.id;
              }
              
              if(!themeId)continue;
              
              for(let k=0;k<theme.subThemes.length;k++){
                const st=theme.subThemes[k];
                if(importMode==='merge'){
                  const{data:existing}=await supabase.from('content_sub_themes').select('id').eq('theme_id',themeId).eq('name',st.name).single();
                  if(!existing){
                    await supabase.from('content_sub_themes').insert({name:st.name,theme_id:themeId,position:k,tags:st.tags});
                  }else{
                    await supabase.from('content_sub_themes').update({tags:st.tags}).eq('id',existing.id);
                  }
                }else{
                  await supabase.from('content_sub_themes').insert({name:st.name,theme_id:themeId,position:k,tags:st.tags});
                }
              }
            }
          }
          
          await load();
          setImportModal(false);
          setImportData(null);
          setImportPreview([]);
          setImportStats(null);
          
        }catch(err){alert('Erreur: '+err.message);}
        setImporting(false);
      };
      
      // ============ RENDER ============
      if(!can('manage_taxonomy')&&!can('manage_videos')&&!isSuperAdmin)return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;
      
      const totalContents=Object.values(contentStats.videos||{}).reduce((a,b)=>a+b,0)+

                         Object.values(contentStats.courses||{}).reduce((a,b)=>a+b,0)+
                         Object.values(contentStats.paths||{}).reduce((a,b)=>a+b,0);
      
      const filteredCategories=searchQuery.trim()?categories.filter(c=>shouldShowCategory(c)):categories;
      
      // Composant Tag
      const TagBadge=({name,color,onRemove,small})=>(
        <span className={`inline-flex items-center gap-1 ${small?'px-1.5 py-0.5 text-xs':'px-2 py-1 text-xs'} rounded-full`} style={{backgroundColor:color||'#6b7280',color:'white'}}>

        </span>

      if(loading)return<div className="flex items-center justify-center py-20"><Icon name="Loader2" size={32} className="animate-spin text-indigo-400"/><span className="ml-3 text-gray-400">Chargement des catégories...</span></div>;
      
      return<div>
        {/* Bandeau lecture seule */}
        {isReadOnly&&(
          <div className="mb-4 p-3 bg-yellow-500/10 border border-yellow-500/30 rounded-lg flex items-center gap-3">
            <Icon name="Eye" size={20} className="text-yellow-400"/>
            <div>
              <p className="text-yellow-400 font-medium">Mode lecture seule</p>
              <p className="text-xs text-gray-400">Seul un Super Administrateur peut modifier les catégories</p>
            </div>
          </div>
        )}
        
        <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6">
          <div>
            <h1 className="text-2xl font-bold">Catégories</h1>
            <p className="text-sm text-gray-400">Organisez vos contenus avec catégories, thèmes, sous-thèmes et tags</p>
          </div>
          <div className="flex flex-wrap gap-2">
            {!isReadOnly&&<Button variant="secondary" icon="Tags" onClick={()=>setTagsModal(true)}>Gérer les tags</Button>}
            <Button variant="secondary" icon="FileSpreadsheet" onClick={downloadTemplate}>Template</Button>
            {!isReadOnly&&<Button variant="secondary" icon="Upload" onClick={()=>fileInputRef.current?.click()}>Importer</Button>}
            <Button variant="secondary" icon="Download" onClick={exportToExcel} disabled={categories.length===0}>Exporter</Button>
            {!isReadOnly&&<input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleFileSelect} className="hidden"/>}
          </div>
        </div>
        
        {/* Stats */}
        <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-6">
          <Card className="p-3 text-center"><p className="text-xl font-bold text-indigo-400">{categories.length}</p><p className="text-xs text-gray-400">Catégories</p></Card>
          <Card className="p-3 text-center"><p className="text-xl font-bold text-purple-400">{themes.length}</p><p className="text-xs text-gray-400">Thèmes</p></Card>
          <Card className="p-3 text-center"><p className="text-xl font-bold text-cyan-400">{subThemes.length}</p><p className="text-xs text-gray-400">Sous-thèmes</p></Card>
          <Card className="p-3 text-center"><p className="text-xl font-bold text-amber-400">{predefinedTags.length}</p><p className="text-xs text-gray-400">Tags</p></Card>
          <Card className="p-3 text-center"><p className="text-xl font-bold text-green-400">{totalContents}</p><p className="text-xs text-gray-400">Contenus</p></Card>
        </div>
        
        {/* Barre de recherche */}
        <Card className="p-4 mb-4">
          <div className="flex gap-3 items-center">
            <div className="relative flex-1">
              <Icon name="Search" size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"/>
              <input 
                type="text" 
                placeholder="Rechercher par nom, description ou tag..." 
                value={searchQuery}
                onChange={e=>setSearchQuery(e.target.value)}
                className="w-full pl-10 pr-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-indigo-500"
              />
              {searchQuery&&(
                <button onClick={()=>setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                  <Icon name="X" size={16}/>
                </button>
              )}
            </div>
            {searchQuery&&(
              <p className="text-sm text-gray-400">
                {filteredCategories.length} catégorie(s) • {searchResults.themes.length} thème(s) • {searchResults.subThemes.length} sous-thème(s)
              </p>
            )}
          </div>
        </Card>
        
        {/* Légende */}
        <div className="flex flex-wrap gap-4 mb-4 text-xs text-gray-400">
          <span className="flex items-center gap-1"><Icon name="ChevronRight" size={14}/> Cliquer pour déplier</span>
          {!isReadOnly&&<span className="flex items-center gap-1"><Icon name="Edit2" size={14} className="text-indigo-400"/> Modifier (nom, couleur, tags)</span>}
          {!isReadOnly&&<span className="flex items-center gap-1"><Icon name="Plus" size={14} className="text-green-400"/> Ajouter thème/sous-thème</span>}
          {!isReadOnly&&<span className="flex items-center gap-1"><Icon name="Tags" size={14} className="text-amber-400"/> Gérer les tags</span>}
        </div>
        
        <Card className="p-6">
          {/* Ajouter catégorie - masqué en lecture seule */}
          {!isReadOnly&&(
            <div className="flex gap-2 mb-6">
              <Input className="flex-1" placeholder="Nouvelle catégorie..." value={quickAddValue} onChange={e=>setQuickAddValue(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&quickAddValue.trim()){addCategory(quickAddValue);setQuickAddValue('');}}}/>
              <Button icon="Plus" onClick={()=>{if(quickAddValue.trim()){addCategory(quickAddValue);setQuickAddValue('');}}} loading={saving}>Ajouter catégorie</Button>
            </div>
          )}
          
          {filteredCategories.length===0?(
            <Empty icon="FolderTree" title={searchQuery?"Aucun résultat":"Aucune catégorie"} desc={searchQuery?"Modifiez votre recherche":"Créez ou importez des catégories."}/>
          ):(
            <div className="space-y-3">
              {filteredCategories.map(cat=>{
                const catThemes=getThemesForCategory(cat.id).filter(t=>shouldShowTheme(t));
                const allCatThemes=getThemesForCategory(cat.id);
                const isExpanded=expandedCats[cat.id];
                const highlighted=isHighlighted('category',cat.id);
                
                return<div key={cat.id} className={`border rounded-lg overflow-hidden ${highlighted?'border-indigo-500 ring-1 ring-indigo-500':'border-gray-700'}`}>
                  <div className="flex items-center gap-3 p-4 bg-gray-800 hover:bg-gray-750">
                    <button onClick={()=>setExpandedCats({...expandedCats,[cat.id]:!isExpanded})} className="p-1 hover:bg-gray-700 rounded">
                      <Icon name={isExpanded?'ChevronDown':'ChevronRight'} size={20} className="text-gray-400"/>
                    </button>
                    <div className="w-4 h-4 rounded-full shrink-0" style={{backgroundColor:cat.color||'#6366f1'}}/>
                    <span className="font-semibold flex-1 cursor-pointer" onClick={()=>setExpandedCats({...expandedCats,[cat.id]:!isExpanded})}>{cat.name}</span>
                    
                    {/* Tags */}
                    {(cat.tags||[]).length>0&&(
                      <div className="flex gap-1 flex-wrap max-w-xs">
                        {cat.tags.slice(0,3).map(t=>{
                          const tagDef=predefinedTags.find(pt=>pt.name===t);
                          return<TagBadge key={t} name={t} color={tagDef?.color} small/>;
                        })}
                        {cat.tags.length>3&&<span className="text-xs text-gray-400">+{cat.tags.length-3}</span>}
                      </div>
                    )}
                    
                    {/* Stats contenus */}
                    <div className="flex gap-2 text-xs text-gray-400">
                      {contentStats.videos?.[cat.id]>0&&<span title="Vidéos">🎬{contentStats.videos[cat.id]}</span>}
                      {contentStats.scorm?.[cat.id]>0&&<span title="SCORM">📦{contentStats.scorm[cat.id]}</span>}
                      {contentStats.quizzes?.[cat.id]>0&&<span title="Quiz">❓{contentStats.quizzes[cat.id]}</span>}
                      {contentStats.courses?.[cat.id]>0&&<span title="Cours">📚{contentStats.courses[cat.id]}</span>}
                      {contentStats.paths?.[cat.id]>0&&<span title="Parcours">🛤️{contentStats.paths[cat.id]}</span>}
                    </div>
                    
                    <span className="text-sm text-gray-500">{allCatThemes.length} thème(s)</span>
                    
                    {/* Boutons d'action explicites - masqués en lecture seule */}
                    {!isReadOnly&&(
                      <div className="flex items-center gap-1 border-l border-gray-600 pl-2 ml-2">
                        <button onClick={e=>{e.stopPropagation();setExpandedCats({...expandedCats,[cat.id]:true});}} className="p-2 hover:bg-green-500/20 rounded group relative" title="Ajouter un thème">
                          <Icon name="Plus" size={16} className="text-green-400"/>
                          <span className="absolute -bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-xs text-white px-2 py-1 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none">+ Thème</span>
                        </button>
                        <button onClick={e=>{e.stopPropagation();openEditModal('category',cat);}} className="p-2 hover:bg-indigo-500/20 rounded group relative" title="Modifier la catégorie">
                          <Icon name="Edit2" size={16} className="text-indigo-400"/>
                          <span className="absolute -bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-xs text-white px-2 py-1 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none">Modifier</span>
                        </button>
                        <button onClick={e=>{e.stopPropagation();deleteCategory(cat.id);}} className="p-2 hover:bg-red-500/20 rounded group relative" title="Supprimer">
                          <Icon name="Trash2" size={16} className="text-red-400"/>
                          <span className="absolute -bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-xs text-white px-2 py-1 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none">Supprimer</span>
                        </button>
                      </div>
                    )}
                  </div>
                  
                  {isExpanded&&(
                    <div className="p-4 pl-12 space-y-3 bg-gray-800/50 border-t border-gray-700">
                      {/* Formulaire ajout thème en haut - masqué en lecture seule */}
                      {!searchQuery&&!isReadOnly&&(
                        <div className="flex gap-2 items-center p-3 bg-gray-700/50 rounded-lg border border-dashed border-gray-600">
                          <Icon name="Plus" size={16} className="text-green-400"/>
                          <Input className="flex-1" size="sm" placeholder="Ajouter un thème à cette catégorie..." onKeyDown={e=>{if(e.key==='Enter'&&e.target.value.trim()){addTheme(e.target.value,cat.id);e.target.value='';}}}/>
                        </div>
                      )}
                      
                      {catThemes.length===0&&!searchQuery&&!isReadOnly&&<p className="text-sm text-gray-500 text-center py-2">Aucun thème - Utilisez le champ ci-dessus pour en créer</p>}
                      {catThemes.length===0&&!isReadOnly&&searchQuery&&<p className="text-sm text-gray-500">Aucun thème correspondant</p>}
                      {catThemes.length===0&&isReadOnly&&<p className="text-sm text-gray-500 text-center py-2">Aucun thème dans cette catégorie</p>}
                      
                      {catThemes.map(theme=>{
                        const themeSubs=getSubThemesForTheme(theme.id);
                        const themeExpanded=expandedThemes[theme.id];
                        const themeHighlighted=isHighlighted('theme',theme.id);
                        
                        return<div key={theme.id} className={`border rounded-lg overflow-hidden ${themeHighlighted?'border-purple-500':'border-gray-600'}`}>
                          <div className="flex items-center gap-2 p-3 bg-gray-700 hover:bg-gray-650">
                            <button onClick={()=>setExpandedThemes({...expandedThemes,[theme.id]:!themeExpanded})} className="p-1 hover:bg-gray-600 rounded">
                              <Icon name={themeExpanded?'ChevronDown':'ChevronRight'} size={16} className="text-gray-400"/>
                            </button>
                            <Icon name="Tag" size={16} className="text-purple-400"/>
                            <span className="flex-1 cursor-pointer" onClick={()=>setExpandedThemes({...expandedThemes,[theme.id]:!themeExpanded})}>{theme.name}</span>
                            {(theme.tags||[]).length>0&&(
                              <div className="flex gap-1">
                                {theme.tags.slice(0,2).map(t=>{
                                  const tagDef=predefinedTags.find(pt=>pt.name===t);
                                  return<TagBadge key={t} name={t} color={tagDef?.color} small/>;
                                })}
                                {theme.tags.length>2&&<span className="text-xs text-gray-400">+{theme.tags.length-2}</span>}
                              </div>
                            )}
                            <span className="text-xs text-gray-500">{themeSubs.length} sous-thème(s)</span>
                            
                            {/* Boutons thème - masqués en lecture seule */}
                            {!isReadOnly&&(
                              <div className="flex items-center gap-1 border-l border-gray-600 pl-2 ml-1">
                                <button onClick={e=>{e.stopPropagation();setExpandedThemes({...expandedThemes,[theme.id]:true});}} className="p-1.5 hover:bg-green-500/20 rounded" title="Ajouter sous-thème">
                                  <Icon name="Plus" size={14} className="text-green-400"/>
                                </button>
                                <button onClick={e=>{e.stopPropagation();openEditModal('theme',theme);}} className="p-1.5 hover:bg-indigo-500/20 rounded" title="Modifier">
                                  <Icon name="Edit2" size={14} className="text-indigo-400"/>
                                </button>
                                <button onClick={e=>{e.stopPropagation();deleteTheme(theme.id);}} className="p-1.5 hover:bg-red-500/20 rounded" title="Supprimer">
                                  <Icon name="X" size={14} className="text-red-400"/>
                                </button>
                              </div>
                            )}
                          </div>
                          
                          {themeExpanded&&(
                            <div className="p-3 pl-8 space-y-2 bg-gray-700/50 border-t border-gray-600">
                              {/* Formulaire ajout sous-thème en haut - masqué en lecture seule */}
                              {!isReadOnly&&(
                                <div className="flex gap-2 items-center p-2 bg-gray-600/50 rounded border border-dashed border-gray-500">
                                  <Icon name="Plus" size={14} className="text-cyan-400"/>
                                  <Input size="sm" className="flex-1" placeholder="Ajouter un sous-thème..." onKeyDown={e=>{if(e.key==='Enter'&&e.target.value.trim()){addSubTheme(e.target.value,theme.id);e.target.value='';}}}/>
                                </div>
                              )}
                              
                              {themeSubs.length===0&&<p className="text-xs text-gray-500 text-center py-1">Aucun sous-thème</p>}
                              
                              {themeSubs.map(st=>{
                                const stHighlighted=isHighlighted('subtheme',st.id);
                                return<div key={st.id} className={`flex items-center gap-2 p-2 rounded ${stHighlighted?'bg-cyan-500/20 border border-cyan-500':'hover:bg-gray-600'}`}>
                                  <Icon name="Circle" size={8} className="text-cyan-400"/>
                                  <span className="flex-1 text-sm">{st.name}</span>
                                  {(st.tags||[]).length>0&&(
                                    <div className="flex gap-1">
                                      {st.tags.slice(0,2).map(t=>{
                                        const tagDef=predefinedTags.find(pt=>pt.name===t);
                                        return<TagBadge key={t} name={t} color={tagDef?.color} small/>;
                                      })}
                                    </div>
                                  )}
                                  {!isReadOnly&&(
                                    <>
                                      <button onClick={()=>openEditModal('subtheme',st)} className="p-1 hover:bg-indigo-500/20 rounded" title="Modifier">
                                        <Icon name="Edit2" size={12} className="text-indigo-400"/>
                                      </button>
                                      <button onClick={()=>deleteSubTheme(st.id)} className="p-1 hover:bg-red-500/20 rounded" title="Supprimer">
                                        <Icon name="X" size={12} className="text-red-400"/>
                                      </button>
                                    </>
                                  )}
                                </div>;
                              })}
                            </div>
                          )}
                        </div>;
                      })}
                    </div>
                  )}
                </div>;
              })}
            </div>
          )}
        </Card>
        
        {/* Modal édition */}
        <Modal isOpen={!!editModal} onClose={()=>setEditModal(null)} title={editModal?.type==='category'?'Modifier la catégorie':editModal?.type==='theme'?'Modifier le thème':'Modifier le sous-thème'}>
          <div className="space-y-4">
            <Input label="Nom" value={editForm.name} onChange={e=>setEditForm({...editForm,name:e.target.value})}/>
            
            {editModal?.type==='category'&&(
              <div>
                <label className="block text-sm font-medium text-gray-300 mb-1">Couleur</label>
                <div className="flex items-center gap-3">
                  <input type="color" value={editForm.color} onChange={e=>setEditForm({...editForm,color:e.target.value})} className="w-12 h-10 rounded cursor-pointer bg-transparent"/>
                  <Input value={editForm.color} onChange={e=>setEditForm({...editForm,color:e.target.value})} className="flex-1"/>
                  <div className="flex gap-1">
                    {['#6366f1','#8b5cf6','#06b6d4','#22c55e','#f59e0b','#ef4444','#ec4899'].map(c=>(
                      <button key={c} onClick={()=>setEditForm({...editForm,color:c})} className="w-6 h-6 rounded-full border-2 border-transparent hover:border-white" style={{backgroundColor:c}}/>
                    ))}
                  </div>
                </div>
              </div>
            )}
            
            <div>
              <label className="block text-sm font-medium text-gray-300 mb-1">Description</label>
              <textarea value={editForm.description} onChange={e=>setEditForm({...editForm,description:e.target.value})} rows={2} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/>
            </div>
            
            {/* Tags */}
            <div>
              <label className="block text-sm font-medium text-gray-300 mb-2">Tags</label>
              <div className="flex flex-wrap gap-2 mb-2">
                {editForm.tags.map(t=>{
                  const tagDef=predefinedTags.find(pt=>pt.name===t);
                  return<TagBadge key={t} name={t} color={tagDef?.color} onRemove={()=>removeTagFromForm(t)}/>;
                })}
                {editForm.tags.length===0&&<span className="text-sm text-gray-500">Aucun tag</span>}
              </div>
              
              <div className="flex gap-2">
                <div className="relative flex-1">
                  <input 
                    type="text" 
                    placeholder="Ajouter un tag..."
                    value={tagInput}
                    onChange={e=>setTagInput(e.target.value)}
                    onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addTagToForm(tagInput);}}}
                    className="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white text-sm"
                  />
                </div>
                <Button size="sm" onClick={()=>addTagToForm(tagInput)} disabled={!tagInput.trim()}>Ajouter</Button>
              </div>
              
              {/* Tags prédéfinis rapides */}
              {predefinedTags.length>0&&(
                <div className="mt-3">
                  <p className="text-xs text-gray-400 mb-2">Tags prédéfinis :</p>
                  <div className="flex flex-wrap gap-1">
                    {predefinedTags.filter(t=>!editForm.tags.includes(t.name)).slice(0,10).map(t=>(
                      <button key={t.id} onClick={()=>addTagToForm(t.name)} className="px-2 py-1 text-xs rounded-full hover:opacity-80 transition" style={{backgroundColor:t.color,color:'white'}}>
                        + {t.name}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
            
            <div className="flex justify-end gap-3 pt-4">
              <Button variant="secondary" onClick={()=>setEditModal(null)}>Annuler</Button>
              <Button onClick={updateItem} loading={saving}>Enregistrer</Button>
            </div>
          </div>
        </Modal>
        
        {/* Modal gestion tags prédéfinis */}
        <Modal isOpen={tagsModal} onClose={()=>setTagsModal(false)} title="Gérer les tags prédéfinis" size="lg">
          <div className="space-y-4">
            {/* Formulaire nouveau tag */}
            <div className="p-4 bg-gray-800 rounded-lg">
              <p className="text-sm font-medium text-gray-300 mb-3">Créer un nouveau tag</p>
              <div className="flex gap-3">
                <Input placeholder="Nom du tag" value={newTagForm.name} onChange={e=>setNewTagForm({...newTagForm,name:e.target.value})} className="flex-1"/>
                <input type="color" value={newTagForm.color} onChange={e=>setNewTagForm({...newTagForm,color:e.target.value})} className="w-12 h-10 rounded cursor-pointer bg-transparent border border-gray-600"/>
                <Button icon="Plus" onClick={createPredefinedTag} loading={saving} disabled={!newTagForm.name.trim()}>Créer</Button>
              </div>
            </div>
            
            {/* Liste des tags */}
            <div className="max-h-80 overflow-y-auto">
              {predefinedTags.length===0?(
                <p className="text-gray-500 text-center py-4">Aucun tag prédéfini</p>
              ):(
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                  {predefinedTags.map(t=>(
                    <div key={t.id} className="flex items-center gap-2 p-2 bg-gray-800 rounded-lg">
                      <div className="w-4 h-4 rounded-full shrink-0" style={{backgroundColor:t.color}}/>
                      <span className="flex-1 text-sm truncate">{t.name}</span>
                      <span className="text-xs text-gray-500">{t.usage_count||0}</span>
                      <button onClick={()=>deletePredefinedTag(t.id)} className="p-1 hover:bg-red-500/20 rounded">
                        <Icon name="Trash2" size={14} className="text-red-400"/>
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
            
            <div className="flex justify-end pt-4">
              <Button variant="secondary" onClick={()=>setTagsModal(false)}>Fermer</Button>
            </div>
          </div>
        </Modal>
        
        {/* Modal Import */}
        <Modal isOpen={importModal} onClose={()=>{setImportModal(false);setImportData(null);setImportPreview([]);setImportStats(null);}} title="Importer des catégories" size="lg">
          <div className="space-y-4">
            {importStats&&(
              <div className="grid grid-cols-4 gap-3 p-4 bg-gray-800 rounded-lg">
                <div className="text-center"><p className="text-xl font-bold text-indigo-400">{importStats.categories}</p><p className="text-xs text-gray-400">Catégories</p></div>
                <div className="text-center"><p className="text-xl font-bold text-purple-400">{importStats.themes}</p><p className="text-xs text-gray-400">Thèmes</p></div>
                <div className="text-center"><p className="text-xl font-bold text-cyan-400">{importStats.subThemes}</p><p className="text-xs text-gray-400">Sous-thèmes</p></div>
                <div className="text-center"><p className="text-xl font-bold text-amber-400">{importStats.tags}</p><p className="text-xs text-gray-400">Tags</p></div>
              </div>
            )}
            
            <div className="p-4 bg-gray-800 rounded-lg">
              <p className="text-sm font-medium text-gray-300 mb-3">Mode d'import :</p>
              <div className="flex gap-4">
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="radio" name="importMode" checked={importMode==='merge'} onChange={()=>setImportMode('merge')} className="text-indigo-500"/>
                  <span className="text-sm">Fusionner</span>
                </label>
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="radio" name="importMode" checked={importMode==='replace'} onChange={()=>setImportMode('replace')} className="text-indigo-500"/>
                  <span className="text-sm text-red-400">Remplacer tout</span>
                </label>
              </div>
              {importMode==='replace'&&<p className="text-xs text-red-400 mt-2">⚠️ Toutes les données existantes seront supprimées!</p>}
            </div>
            
            <div className="max-h-64 overflow-y-auto border border-gray-700 rounded-lg">
              <table className="w-full text-sm">
                <thead className="bg-gray-800 sticky top-0">
                  <tr>
                    <th className="text-left p-3">Catégorie</th>
                    <th className="text-left p-3">Tags</th>
                    <th className="text-left p-3">Thèmes</th>
                    <th className="text-left p-3">Sous-thèmes</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-700">
                  {importPreview.map((cat,i)=>(
                    <tr key={i} className="hover:bg-gray-800/50">
                      <td className="p-3"><div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full" style={{backgroundColor:cat.color}}/>{cat.name}</div></td>
                      <td className="p-3 text-gray-400 text-xs">{(cat.tags||[]).join(', ')||'-'}</td>
                      <td className="p-3 text-gray-400">{cat.themes.length||'-'}</td>
                      <td className="p-3 text-gray-400">{cat.themes.reduce((s,t)=>s+t.subThemes.length,0)||'-'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            
            <div className="flex justify-end gap-3 pt-4">
              <Button variant="secondary" onClick={()=>{setImportModal(false);setImportData(null);setImportPreview([]);setImportStats(null);}}>Annuler</Button>
              <Button icon="Upload" onClick={executeImport} loading={importing}>{importing?'Import...':'Importer'}</Button>
            </div>
          </div>
        </Modal>
      </div>;
    }

    function LearningPathsPage({creationMode=false}){
      const{center,isSuperAdmin,can,profile,realRole}=useAuth();
      const{categories,themes,subThemes,getThemesForCategory,getSubThemesForTheme}=useTaxonomy();
      const{licensedIds,isLicensed}=useLicenseInfo();
      // En mode création, on ne montre que les contenus LMS
      const filterLMS=creationMode||isSuperAdmin;
      const[paths,setPaths]=useState([]);
      const[courses,setCourses]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({title:'',description:'',thumbnail_url:'',estimated_duration:'',category_id:'',theme_id:'',sub_theme_id:'',sequential_mode:false,learning_objectives:'',tags:'',difficulty_level:'intermediate',language:'fr',certificate_enabled:false});
      const[pathPrereqs,setPathPrereqs]=useState([]);
      const[pathCourses,setPathCourses]=useState([]);
      const[saving,setSaving]=useState(false);
      const[contentModal,setContentModal]=useState(null);
      const[filterSource,setFilterSource]=useState('all');
      const sortableRef=useRef(null);
      const sortableInstance=useRef(null);
      // Preview
      const[previewPath,setPreviewPath]=useState(null);
      const[previewPathCourses,setPreviewPathCourses]=useState([]);
      const[previewCourse,setPreviewCourse]=useState(null);
      const[previewItems,setPreviewItems]=useState([]);
      const[previewCurrent,setPreviewCurrent]=useState(null);
      const previewPlayerRef=useRef(null);
      const previewVimeoRef=useRef(null);
      
      // Preview Vimeo player effect (must be before any conditional return)
      useEffect(()=>{
        if(!previewCurrent||previewCurrent.type!=='video')return;
        if(previewVimeoRef.current){try{previewVimeoRef.current.destroy();}catch(e){}}
        if(!previewPlayerRef.current)return;
        const vid=previewCurrent.data?.vimeo_id||previewCurrent.data?.vimeo_url?.match(/\/(\d+)/)?.[1];
        if(!vid)return;
        try{previewVimeoRef.current=new Vimeo.Player(previewPlayerRef.current,{id:vid,width:'100%',responsive:true,title:false,byline:false,portrait:false,fullscreen:false,pip:false,quality:'360p'});}catch(e){}
        return()=>{if(previewVimeoRef.current){try{previewVimeoRef.current.destroy();}catch(e){}}};
      },[previewCurrent?.id,previewCurrent?.type]);
      
      const load=useCallback(async()=>{
        // Charger les parcours
        let q=supabase.from('learning_paths').select('*,learning_path_courses(count)').order('created_at',{ascending:false});
        if(!isSuperAdmin&&center?.id){
          q=q.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        }
        const{data:p}=await q;
        setPaths(p||[]);
        
        // Charger les cours disponibles
        let qc=supabase.from('playlists').select('id,title,is_lms_content,is_published').order('title');
        if(!isSuperAdmin&&center?.id){
          qc=qc.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        }
        const{data:c}=await qc;
        setCourses(c||[]);
        
        setLoading(false);
      },[isSuperAdmin,center?.id]);
      useEffect(()=>{load();},[load]);
      
      // Drag & drop
      useEffect(()=>{
        if(contentModal&&sortableRef.current&&pathCourses.length>0&&window.Sortable){
          if(sortableInstance.current){try{sortableInstance.current.destroy();}catch(e){}}
          sortableInstance.current=window.Sortable.create(sortableRef.current,{
            animation:150,handle:'.drag-handle',
            onEnd:(evt)=>{const arr=[...pathCourses];const[m]=arr.splice(evt.oldIndex,1);arr.splice(evt.newIndex,0,m);setPathCourses(arr);}
          });
        }
        return()=>{if(sortableInstance.current){try{sortableInstance.current.destroy();}catch(e){}}};
      },[contentModal,pathCourses.length]);
      
      const isPathLicensed=(pathId)=>isLicensed('path',pathId);
      
      const isCourseLicensed=(course)=>{
        if(!course.is_lms_content)return true;
        if(course.center_id===center?.id)return true;
        return isLicensed('course',course.id);
      };
      
      const filterBySource=(items)=>{
        if(filterSource==='all')return items;
        return items.filter(item=>{
          const isOwn=!item.is_lms_content;
          const licensed=isPathLicensed(item.id);
          if(filterSource==='center')return isOwn;
          if(filterSource==='lms')return item.is_lms_content;
          if(filterSource==='licensed')return item.is_lms_content&&licensed;
          if(filterSource==='unlicensed')return item.is_lms_content&&!licensed;
          return true;
        });
      };
      
      const stats={
        total:paths.length,
        center:paths.filter(p=>!p.is_lms_content).length,
        lms:paths.filter(p=>p.is_lms_content).length,
        licensed:paths.filter(p=>p.is_lms_content&&isPathLicensed(p.id)).length
      };
      
      const openModal=async(path=null)=>{
        if(path){
          setEditing(path);
          setForm({title:path.title,description:path.description||'',thumbnail_url:path.thumbnail_url||'',estimated_duration:path.estimated_duration||'',category_id:path.category_id||'',theme_id:path.theme_id||'',sub_theme_id:path.sub_theme_id||'',sequential_mode:!!path.sequential_mode,learning_objectives:path.learning_objectives||'',tags:(path.tags||[]).join(', '),difficulty_level:path.difficulty_level||'intermediate',language:path.language||'fr',certificate_enabled:!!path.certificate_enabled});
          try{const{data:pr}=await supabase.from('path_prerequisites').select('prerequisite_id').eq('path_id',path.id);setPathPrereqs((pr||[]).map(x=>x.prerequisite_id));}catch(e){setPathPrereqs([]);}
        }else{
          setEditing(null);
          setForm({title:'',description:'',thumbnail_url:'',estimated_duration:'',category_id:'',theme_id:'',sub_theme_id:'',sequential_mode:false,learning_objectives:'',tags:'',difficulty_level:'intermediate',language:'fr',certificate_enabled:false});
          setPathPrereqs([]);
        }
        setModal(true);
      };
      
      const handleSave=async()=>{
        if(!form.title.trim()){alert('Titre requis');return;}
        setSaving(true);
        try{
          const tagsArr=form.tags?form.tags.split(',').map(t=>t.trim()).filter(Boolean):[];
          const payload={
            title:form.title,description:form.description||null,thumbnail_url:form.thumbnail_url||null,
            estimated_duration:form.estimated_duration?parseInt(form.estimated_duration):null,
            category_id:form.category_id||null,theme_id:form.theme_id||null,sub_theme_id:form.sub_theme_id||null,
            sequential_mode:!!form.sequential_mode,
            learning_objectives:form.learning_objectives||null,
            tags:tagsArr,
            difficulty_level:form.difficulty_level||'intermediate',
            language:form.language||'fr',
            certificate_enabled:!!form.certificate_enabled,
            center_id:center?.id||null
          };
          let pathId=editing?.id;
          if(editing){
            await supabase.from('learning_paths').update(payload).eq('id',editing.id);
          }else{
            const{data:ins}=await supabase.from('learning_paths').insert(payload).select('id').single();
            pathId=ins?.id;
          }
          // Save prerequisites
          if(pathId){
            try{
              await supabase.from('path_prerequisites').delete().eq('path_id',pathId);
              if(pathPrereqs.length>0){
                await supabase.from('path_prerequisites').insert(pathPrereqs.map(pid=>({path_id:pathId,prerequisite_id:pid})));
              }
            }catch(e){console.warn('Path prerequisites save:',e);}
          }
          await load();setModal(false);setPathPrereqs([]);
        }catch(err){alert('Erreur: '+err.message);}
        setSaving(false);
      };
      
      const handleDelete=async(id)=>{
        if(!confirm('Supprimer ce parcours ?'))return;
        await supabase.from('learning_paths').delete().eq('id',id);
        load();
      };
      
      const togglePublish=async(path)=>{
        await supabase.from('learning_paths').update({is_published:!path.is_published}).eq('id',path.id);
        load();
      };
      
      const openContentModal=async(path)=>{
        const{data}=await supabase.from('learning_path_courses').select('*,playlists(id,title,is_lms_content)').eq('path_id',path.id).order('position');
        setPathCourses(data||[]);
        setContentModal(path);
      };
      
      const addCourseToPath=async(courseId)=>{
        const pos=pathCourses.length;
        const{data}=await supabase.from('learning_path_courses').insert({path_id:contentModal.id,playlist_id:courseId,position:pos}).select('*,playlists(id,title,is_lms_content)').single();
        if(data)setPathCourses([...pathCourses,data]);
      };
      
      const removeCourseFromPath=async(id)=>{
        await supabase.from('learning_path_courses').delete().eq('id',id);
        setPathCourses(pathCourses.filter(pc=>pc.id!==id));
      };
      
      const saveCoursesOrder=async()=>{
        for(let i=0;i<pathCourses.length;i++){
          await supabase.from('learning_path_courses').update({position:i}).eq('id',pathCourses[i].id);
        }
        load();
        setContentModal(null);
      };
      
      if(!can('manage_paths')&&!can('view_paths')&&!can('manage_playlists')&&!can('view_playlists'))return<Empty icon="Lock" title="Accès refusé"/>;
      
      // Path preview functions
      const openPathPreview=async(path)=>{
        setPreviewPath(path);
        const{data}=await supabase.from('learning_path_courses').select('*,playlists(id,title,description,playlist_videos(count))').eq('path_id',path.id).order('position');
        setPreviewPathCourses(data||[]);
      };
      const openCoursePreview=async(course)=>{
        setPreviewCourse(course);
        const[{data:pvs},{data:ps}]=await Promise.all([
          supabase.from('playlist_videos').select('*,videos(*)').eq('playlist_id',course.id).order('position'),
          supabase.from('playlist_scorm').select('*,scorm_modules(*)').eq('playlist_id',course.id).order('position')
        ]);
        let pq=[];try{const{data}=await supabase.from('playlist_quizzes').select('*,quizzes(*)').eq('playlist_id',course.id).order('position');pq=data||[];}catch(e){}
        const items=[
          ...(pvs||[]).map(pv=>({type:'video',id:pv.id,position:pv.position,data:pv.videos})),
          ...(ps||[]).map(s=>({type:'scorm',id:s.id,position:s.position,data:s.scorm_modules})),
          ...pq.map(q=>({type:'quiz',id:q.id,position:q.position,data:q.quizzes}))
        ].sort((a,b)=>(a.position||0)-(b.position||0));
        setPreviewItems(items);setPreviewCurrent(items[0]||null);
      };
      const closePathPreview=()=>{setPreviewPath(null);setPreviewPathCourses([]);};
      const closeCoursePreview=()=>{
        if(previewVimeoRef.current){try{previewVimeoRef.current.destroy();}catch(e){}}
        setPreviewCourse(null);setPreviewItems([]);setPreviewCurrent(null);
      };
      
      if(loading)return<Loading/>;
      
      // ===== COURSE PREVIEW FROM PATH =====
      if(previewCourse){
        const pI=t=>t==='video'?'Film':t==='scorm'?'Package':'HelpCircle';
        const pC=t=>t==='video'?'blue':t==='scorm'?'orange':'purple';
        const pL=t=>t==='video'?'Vidéo':t==='scorm'?'SCORM':'Quiz';
        return<div>
          <div className="flex items-center gap-4 mb-6">
            <Button variant="ghost" icon="ArrowLeft" onClick={closeCoursePreview}>{previewPath?'Retour au parcours':'Retour'}</Button>
            <div className="flex-1"><h1 className="text-xl font-bold">{previewCourse.title}</h1><p className="text-sm text-gray-400">{previewItems.length} élément{previewItems.length>1?'s':''}</p></div>
            <span className="px-3 py-1 bg-cyan-500/20 text-cyan-400 rounded-lg text-xs font-medium"><Icon name="Eye" size={14} className="inline mr-1"/>Prévisualisation</span>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 space-y-4">
              {!previewCurrent?<Card className="p-12 text-center"><Icon name="Layers" size={48} className="mx-auto text-gray-600 mb-4"/><p className="text-gray-400">Aucun élément</p></Card>
              :previewCurrent.type==='video'?<Card className="overflow-hidden"><div className="aspect-video bg-black relative"><div ref={previewPlayerRef} className="absolute inset-0"/></div><div className="p-4"><div className="flex items-center gap-2 mb-1"><span className="px-2 py-0.5 bg-blue-500/20 text-blue-400 rounded text-xs">Vidéo</span><h2 className="text-lg font-semibold">{previewCurrent.data?.title}</h2></div>{previewCurrent.data?.description&&<p className="text-gray-400 mt-2 text-sm">{previewCurrent.data.description}</p>}</div></Card>
              :previewCurrent.type==='scorm'?<Card className="p-6 text-center"><Icon name="Package" size={48} className="mx-auto text-orange-400 mb-4"/><h2 className="text-lg font-semibold mb-2">{previewCurrent.data?.title}</h2>{previewCurrent.data?.package_url?<Button icon="ExternalLink" onClick={()=>{const url=previewCurrent.data.entry_point?previewCurrent.data.package_url.replace(/\/[^/]*$/,'/')+previewCurrent.data.entry_point:previewCurrent.data.package_url;window.open(url,'_blank','width=1024,height=768');}}>Lancer le module SCORM</Button>:<p className="text-gray-500 text-sm italic">URL non configurée</p>}</Card>
              :previewCurrent.type==='quiz'?<Card className="p-6 text-center"><Icon name="HelpCircle" size={48} className="mx-auto text-purple-400 mb-4"/><h2 className="text-lg font-semibold mb-2">{previewCurrent.data?.title}</h2><div className="grid grid-cols-2 gap-4 max-w-md mx-auto"><div className="p-3 bg-gray-700/50 rounded-lg text-center"><p className="text-2xl font-bold text-purple-400">{previewCurrent.data?.passing_score||70}%</p><p className="text-xs text-gray-500">Score requis</p></div><div className="p-3 bg-gray-700/50 rounded-lg text-center"><p className="text-2xl font-bold text-purple-400">{previewCurrent.data?.max_attempts||'∞'}</p><p className="text-xs text-gray-500">Tentatives max</p></div></div></Card>
              :null}
            </div>
            <Card className="p-4 h-fit"><h3 className="font-semibold mb-3 flex items-center gap-2"><Icon name="List" size={18}/>Contenu</h3><div className="space-y-1 max-h-[60vh] overflow-y-auto">{previewItems.map((item,i)=>{const isA=previewCurrent?.id===item.id;return<button key={item.id} onClick={()=>setPreviewCurrent(item)} className={`w-full flex items-center gap-3 p-3 rounded-lg text-left transition ${isA?'bg-indigo-600':'hover:bg-gray-700'}`}><span className="w-6 h-6 bg-gray-600 rounded-full flex items-center justify-center text-xs font-bold shrink-0">{i+1}</span><Icon name={pI(item.type)} size={16} className={`text-${pC(item.type)}-400 shrink-0`}/><div className="flex-1 min-w-0"><p className="text-sm font-medium truncate">{item.data?.title||'Sans titre'}</p><p className={`text-xs ${isA?'text-indigo-200':'text-gray-500'}`}>{pL(item.type)}</p></div></button>})}{previewItems.length===0&&<p className="text-gray-500 text-sm text-center py-4">Aucun contenu</p>}</div></Card>
          </div>
        </div>;
      }
      
      // ===== PATH PREVIEW =====
      if(previewPath){
        return<div>
          <div className="flex items-center gap-4 mb-6">
            <Button variant="ghost" icon="ArrowLeft" onClick={closePathPreview}>Retour</Button>
            <div className="flex-1"><h1 className="text-xl font-bold">{previewPath.title}</h1><p className="text-sm text-gray-400">{previewPathCourses.length} cours dans ce parcours</p></div>
            <span className="px-3 py-1 bg-cyan-500/20 text-cyan-400 rounded-lg text-xs font-medium"><Icon name="Eye" size={14} className="inline mr-1"/>Prévisualisation</span>
          </div>
          {previewPath.description&&<Card className="p-4 mb-6"><p className="text-sm text-gray-400">{previewPath.description}</p></Card>}
          <div className="space-y-3">
            {previewPathCourses.map((pc,i)=>(
              <Card key={pc.id} className="p-4 flex items-center gap-4">
                <span className="w-10 h-10 bg-indigo-500/20 rounded-full flex items-center justify-center text-lg font-bold text-indigo-400 shrink-0">{i+1}</span>
                <div className="flex-1">
                  <h3 className="font-semibold">{pc.playlists?.title||'Cours supprimé'}</h3>
                  {pc.playlists?.description&&<p className="text-sm text-gray-400 mt-1 line-clamp-1">{pc.playlists.description}</p>}
                  <p className="text-xs text-gray-500 mt-1"><Icon name="Film" size={12} className="inline mr-1"/>{pc.playlists?.playlist_videos?.[0]?.count||0} éléments{pc.is_required&&<span className="ml-2 text-amber-400">• Obligatoire</span>}</p>
                </div>
                {pc.playlists&&<Button size="sm" icon="Play" onClick={()=>openCoursePreview(pc.playlists)}>Prévisualiser</Button>}
              </Card>
            ))}
            {previewPathCourses.length===0&&<Empty icon="Route" title="Parcours vide"/>}
          </div>
        </div>;
      }
      
      const filtered=filterBySource(paths);
      
      return<div>
        <div className="flex items-center justify-between mb-6">
          <div>
            <h1 className="text-2xl font-bold">Parcours de formation</h1>
            <p className="text-sm text-gray-400">Séquences de cours avec progression</p>
          </div>
          {can('manage_playlists')&&<Button icon="Plus" onClick={()=>openModal()}>Créer un parcours</Button>}
        </div>
        
        {/* Filtres */}
        {!isSuperAdmin&&<Card className="p-4 mb-4">
          <div className="flex flex-wrap items-center gap-4">
            <span className="text-sm text-gray-400">Filtrer :</span>
            <div className="flex flex-wrap gap-2">
              <button onClick={()=>setFilterSource('all')} className={`px-3 py-1.5 rounded-lg text-sm ${filterSource==='all'?'bg-indigo-600':'bg-gray-700 hover:bg-gray-600'}`}>Tout ({stats.total})</button>
              <button onClick={()=>setFilterSource('center')} className={`px-3 py-1.5 rounded-lg text-sm ${filterSource==='center'?'bg-indigo-600':'bg-gray-700 hover:bg-gray-600'}`}>📁 Mes parcours ({stats.center})</button>
              <button onClick={()=>setFilterSource('lms')} className={`px-3 py-1.5 rounded-lg text-sm ${filterSource==='lms'?'bg-indigo-600':'bg-gray-700 hover:bg-gray-600'}`}>📦 Catalogue LMS ({stats.lms})</button>
              <button onClick={()=>setFilterSource('licensed')} className={`px-3 py-1.5 rounded-lg text-sm ${filterSource==='licensed'?'bg-green-600':'bg-gray-700 hover:bg-gray-600'}`}>✓ Sous licence ({stats.licensed})</button>
              <button onClick={()=>setFilterSource('unlicensed')} className={`px-3 py-1.5 rounded-lg text-sm ${filterSource==='unlicensed'?'bg-red-600':'bg-gray-700 hover:bg-gray-600'}`}>🔒 Non licencié ({stats.lms-stats.licensed})</button>
            </div>
          </div>
        </Card>}
        
        {filtered.length===0?<Empty icon="Route" title="Aucun parcours" desc={filterSource!=='all'?'Essayez un autre filtre':undefined}/>:(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {filtered.map(path=>{
              const licensed=!path.is_lms_content||isPathLicensed(path.id);
              const isOwn=!path.is_lms_content;
              const isLocked=path.is_lms_content&&path.is_locked;
              const canModify=can('manage_playlists')&&(isOwn||isSuperAdmin)&&!isLocked;
              const courseCount=path.learning_path_courses?.[0]?.count||0;
              
              return<Card key={path.id} className={`overflow-hidden ${!licensed&&!isOwn?'opacity-80':''}`}>
                {path.thumbnail_url&&<div className="h-32 bg-gray-800"><img src={path.thumbnail_url} className="w-full h-full object-cover" onError={e=>{e.target.style.display='none'}}/></div>}
                <div className="p-4">
                  <div className="flex items-start justify-between mb-2">
                    <div className="flex items-center gap-2">
                      <h3 className="font-semibold">{path.title}</h3>
                      {isLocked&&<Icon name="Lock" size={14} className="text-red-400"/>}
                    </div>
                    <div className="flex flex-col gap-1 items-end">
                      {path.is_lms_content?<span className={`px-2 py-0.5 rounded text-xs ${licensed?'bg-indigo-600':'bg-red-600/80'}`}>{licensed?'📦 LMS':'🔒'}</span>:<span className="px-2 py-0.5 bg-gray-600 rounded text-xs">📁</span>}
                      <span className={`px-2 py-0.5 rounded text-xs ${path.is_published?'bg-green-500/20 text-green-400':'bg-gray-500/20 text-gray-400'}`}>{path.is_published?'Publié':'Brouillon'}</span>
                      {path.certificate_enabled&&<span className="px-2 py-0.5 rounded text-xs bg-amber-500/20 text-amber-400">🎓 Certifiant</span>}
                    </div>
                  </div>
                  
                  <div className="flex items-center gap-3 text-sm text-gray-400 mb-2">
                    <span><Icon name="BookOpen" size={14} className="inline mr-1"/>{courseCount} cours</span>
                    {path.estimated_duration&&<span><Icon name="Clock" size={14} className="inline mr-1"/>{path.estimated_duration>=60?Math.round(path.estimated_duration/60)+'h':path.estimated_duration+'min'}</span>}
                    {path.difficulty_level&&<span className={`px-1.5 py-0.5 rounded text-xs ${path.difficulty_level==='beginner'?'bg-green-500/20 text-green-400':path.difficulty_level==='intermediate'?'bg-yellow-500/20 text-yellow-400':path.difficulty_level==='advanced'?'bg-orange-500/20 text-orange-400':'bg-red-500/20 text-red-400'}`}>{({beginner:'Débutant',intermediate:'Intermédiaire',advanced:'Avancé',expert:'Expert'})[path.difficulty_level]}</span>}
                    {path.language&&path.language!=='fr'&&<span className="text-xs">🌐 {path.language.toUpperCase()}</span>}
                    {path.sequential_mode&&<span className="text-xs text-purple-400"><Icon name="ListOrdered" size={12} className="inline mr-1"/>Séquentiel</span>}
                  </div>
                  
                  {(path.tags||[]).length>0&&<div className="flex flex-wrap gap-1 mb-2">{path.tags.slice(0,4).map((t,i)=><span key={i} className="px-2 py-0.5 bg-gray-700 rounded text-xs text-gray-300">{t}</span>)}{path.tags.length>4&&<span className="text-xs text-gray-500">+{path.tags.length-4}</span>}</div>}
                  
                  {path.description&&<p className="text-sm text-gray-400 line-clamp-2 mb-3">{path.description}</p>}
                  
                  <div className="flex flex-wrap gap-2">
                    <Button variant="ghost" size="sm" icon="Eye" onClick={()=>openPathPreview(path)}>Prévisualiser</Button>
                    {(licensed||isOwn)&&<Button variant="ghost" size="sm" icon="Layers" onClick={()=>openContentModal(path)}>{isLocked?'Voir':'Gérer'} cours</Button>}
                    {canModify&&<Button variant="ghost" size="sm" icon="Edit2" onClick={()=>openModal(path)}>Modifier</Button>}
                    {canModify&&<Button variant="ghost" size="sm" icon={path.is_published?'EyeOff':'Eye'} onClick={()=>togglePublish(path)}/>}
                    {canModify&&<Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(path.id)}/>}
                    {!licensed&&!isOwn&&realRole==='center_admin'&&<label className="flex items-center gap-2 text-xs cursor-pointer bg-purple-500/20 text-purple-300 px-2 py-1 rounded hover:bg-purple-500/30"><input type="checkbox" checked={false} onChange={()=>{localStorage.setItem('openLicenseRequest','true');window.location.hash='licenses';}} className="rounded"/>Demander</label>}
                  </div>
                </div>
              </Card>;
            })}
          </div>
        )}
        
        {/* Modal création/édition */}
        <Modal isOpen={modal} onClose={()=>{setModal(false);setPathPrereqs([]);}} title={editing?'Modifier le parcours':'Créer un parcours'} size="xl">
          <div className="space-y-4 max-h-[70vh] overflow-y-auto pr-2">

            <div className="grid grid-cols-2 gap-4">

            <Input label="Tags (séparés par des virgules)" value={form.tags} onChange={e=>setForm({...form,tags:e.target.value})} placeholder="permis B, sécurité routière, conduite"/>
            
            <div className="grid grid-cols-3 gap-4">
              <Select label="Niveau de difficulté" value={form.difficulty_level} onChange={e=>setForm({...form,difficulty_level:e.target.value})} options={[{value:'beginner',label:'🟢 Débutant'},{value:'intermediate',label:'🟡 Intermédiaire'},{value:'advanced',label:'🟠 Avancé'},{value:'expert',label:'🔴 Expert'}]}/>
              <Select label="Langue" value={form.language} onChange={e=>setForm({...form,language:e.target.value})} options={[{value:'fr',label:'🇫🇷 Français'},{value:'en',label:'🇬🇧 Anglais'},{value:'es',label:'🇪🇸 Espagnol'},{value:'de',label:'🇩🇪 Allemand'},{value:'it',label:'🇮🇹 Italien'},{value:'pt',label:'🇵🇹 Portugais'},{value:'ar',label:'🇸🇦 Arabe'},{value:'zh',label:'🇨🇳 Chinois'}]}/>
              <div className="flex flex-col gap-2 justify-end">
                <label className="flex items-center gap-2 cursor-pointer p-2 rounded-lg hover:bg-gray-700">

                <input type="checkbox" checked={form.certificate_enabled} onChange={e=>setForm({...form,certificate_enabled:e.target.checked})} className="w-5 h-5 rounded"/>
                <div><span className="text-sm font-medium">Certificat de parcours</span><p className="text-xs text-gray-500">Délivré à la complétion de tous les cours</p></div>

                  <p className="text-sm text-gray-500 text-center py-2">Aucun parcours publié disponible</p>:
                  paths.filter(pp=>pp.id!==editing?.id&&pp.is_published).map(pp=>(
                    <label key={pp.id} className={`flex items-center gap-2 p-2 rounded cursor-pointer text-sm ${pathPrereqs.includes(pp.id)?'bg-indigo-600/30':'hover:bg-gray-700'}`}>
                      <input type="checkbox" checked={pathPrereqs.includes(pp.id)} onChange={()=>setPathPrereqs(prev=>prev.includes(pp.id)?prev.filter(x=>x!==pp.id):[...prev,pp.id])} className="w-4 h-4 rounded"/>
                      <span>{pp.title}</span>
                      {pp.is_lms_content&&<span className="text-xs bg-indigo-600 px-1.5 py-0.5 rounded">LMS</span>}

              </div>
              {pathPrereqs.length>0&&<p className="text-xs text-indigo-400 mt-1">{pathPrereqs.length} prérequis sélectionné{pathPrereqs.length>1?'s':''}</p>}
            </div>
            </>}
            
            {form.thumbnail_url&&<div><label className="block text-sm font-medium text-gray-300 mb-1">Aperçu image</label><img src={form.thumbnail_url} className="h-24 rounded-lg object-cover" onError={e=>{e.target.style.display='none'}}/></div>}
