          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div>
              <h4 className="font-medium mb-3">Cours du parcours ({pathCourses.length}){!contentModal?.is_locked&&<span className="text-gray-500 text-sm font-normal ml-2">- Glissez pour réorganiser</span>}</h4>
              <div ref={sortableRef} className="space-y-2 max-h-80 overflow-y-auto">
                {pathCourses.map((pc,i)=><div key={pc.id} className="flex items-center gap-3 p-3 bg-gray-700 rounded-lg">
                  {!contentModal?.is_locked&&<div className="drag-handle cursor-grab p-1 hover:bg-gray-600 rounded"><Icon name="GripVertical" size={16} className="text-gray-400"/></div>}
                  <span className="w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center text-xs font-bold">{i+1}</span>
                  <div className="flex-1 min-w-0">
                    <p className="font-medium truncate text-sm">{pc.playlists?.title}</p>
                  </div>
                  {pc.playlists?.is_lms_content&&<span className="px-1.5 py-0.5 bg-indigo-500/20 text-indigo-400 rounded text-xs">LMS</span>}
                  {!contentModal?.is_locked&&<button onClick={()=>removeCourseFromPath(pc.id)} className="p-1 hover:bg-red-600 rounded"><Icon name="X" size={16}/></button>}
                </div>)}
                {pathCourses.length===0&&<p className="text-gray-500 text-sm text-center py-4">Aucun cours</p>}
              </div>
            </div>
            
            {!contentModal?.is_locked&&<div>
              <h4 className="font-medium mb-3">Cours disponibles</h4>
              <div className="space-y-2 max-h-80 overflow-y-auto">
                {courses.filter(c=>{
                  // Exclure les cours déjà dans le parcours
                  if(pathCourses.find(pc=>pc.playlist_id===c.id))return false;
                  // Super Admin voit tout
                  if(isSuperAdmin)return true;
                  // Contenu LMS = toujours vérifier la licence (même si même center_id)
                  if(c.is_lms_content){
                    return isCourseLicensed(c);
                  }
                  // Contenu non-LMS du centre = toujours visible
                  return c.center_id===center?.id;
                }).map(c=>{
                  const isOwn=!c.is_lms_content&&c.center_id===center?.id;
                  return<div key={c.id} className="flex items-center gap-3 p-3 rounded-lg bg-gray-700/50 hover:bg-gray-700 cursor-pointer" onClick={()=>addCourseToPath(c.id)}>
                    <Icon name="Plus" size={16} className="text-indigo-400"/>
                    <div className="flex-1 min-w-0"><p className="font-medium truncate text-sm">{c.title}</p></div>
                    {c.is_lms_content&&<span className="px-1.5 py-0.5 rounded text-xs bg-indigo-500/20 text-indigo-400">📦 LMS</span>}
                  </div>;
                })}
                {courses.filter(c=>!pathCourses.find(pc=>pc.playlist_id===c.id)&&(isSuperAdmin||(c.is_lms_content?isCourseLicensed(c):c.center_id===center?.id))).length===0&&<p className="text-gray-500 text-sm text-center py-4">Tous les cours ajoutés</p>}
              </div>
            </div>}
          </div>
          
          <div className="flex gap-2 mt-4">
            <Button variant="secondary" onClick={()=>setContentModal(null)}>Fermer</Button>
            {!contentModal?.is_locked&&<Button className="flex-1" onClick={saveCoursesOrder}>Enregistrer l'ordre</Button>}
          </div>
        </Modal>
      </div>;
    }

    // ==================== LICENCES ====================
    function LicensesContent(){
      const{isSuperAdmin,profile,center,realRole,effectiveRole,can}=useAuth();
      const canManageLicenses=can('manage_licenses')||isSuperAdmin;
      const canViewUsage=can('view_license_usage');
      const[loading,setLoading]=useState(true);
      const[licenses,setLicenses]=useState([]);
      const[requests,setRequests]=useState([]);
      const[packs,setPacks]=useState([]);
      const[centers,setCenters]=useState([]);
      const[activeTab,setActiveTab]=useState(isSuperAdmin?'dashboard':'my-licenses');
      const[licenseModal,setLicenseModal]=useState(false);
      const[editingLicense,setEditingLicense]=useState(null);
      const[licenseForm,setLicenseForm]=useState({center_id:'',pack_id:'',license_type:'content_pack',start_date:'',end_date:'',max_learners:'',max_resources:'',full_catalog:false,notes:''});
      const[saving,setSaving]=useState(false);
      const[requestModal,setRequestModal]=useState(false);
      const[requestForm,setRequestForm]=useState({pack_id:'',requested_duration_months:12,requested_max_learners:'',request_message:''});
      const[history,setHistory]=useState([]);
      const[alertsSent,setAlertsSent]=useState([]);
      // Resource picker for volume licenses
      const[licenseResources,setLicenseResources]=useState([]); // [{content_type,content_id,title}]
      const[allLmsVideos,setAllLmsVideos]=useState([]);
      const[allLmsScorm,setAllLmsScorm]=useState([]);
      const[allLmsQuizzes,setAllLmsQuizzes]=useState([]);
      const[resourcePickerTab,setResourcePickerTab]=useState('video');
      const[resourcePickerSearch,setResourcePickerSearch]=useState('');
      const[loadError,setLoadError]=useState(null);
      const[licenseUsage,setLicenseUsage]=useState({}); // {licenseId: {sessions, learners}}
      
      // Seul le Center Admin peut demander des licences (pas le trainer)
      const canRequestLicense=(realRole==='center_admin'||effectiveRole==='center_admin')&&center?.id;
      
      // Ouvrir automatiquement le modal si on vient de la bibliothèque
      useEffect(()=>{
        // Attendre que le chargement soit terminé
        if(loading)return;
        
        if(canRequestLicense){
          const shouldOpen=localStorage.getItem('openLicenseRequest');
          if(shouldOpen==='true'){
            localStorage.removeItem('openLicenseRequest');
            setActiveTab('my-requests');
            setRequestModal(true);
          }
        }
      },[canRequestLicense,loading]);
      
      const load=useCallback(async()=>{
        setLoadError(null);
        try{
          const{data:pk,error:pkErr}=await supabase.from('content_packs').select('*').eq('is_active',true);
          if(pkErr)console.warn('Erreur packs:',pkErr);
          setPacks(pk||[]);
          
          if(isSuperAdmin){
            const{data:lic}=await supabase.from('center_licenses').select('*,centers(name,slug),content_packs(name,code)').order('created_at',{ascending:false});setLicenses(lic||[]);
            const{data:req}=await supabase.from('license_requests').select('*,centers(name),content_packs(name),profiles!requested_by(first_name,last_name)').order('created_at',{ascending:false});setRequests(req||[]);
            const{data:ct}=await supabase.from('centers').select('id,name,slug');setCenters(ct||[]);
            // Charger les alertes déjà envoyées
            try{const{data:alerts}=await supabase.from('license_alerts').select('*');setAlertsSent(alerts||[]);}catch(e){setAlertsSent([]);}
          }else if(center?.id){
            const{data:lic,error:licErr}=await supabase.from('center_licenses').select('*,content_packs(name,code,description)').eq('center_id',center.id);
            if(licErr){console.warn('Erreur licences:',licErr);setLoadError('Erreur lors du chargement des licences');}
            setLicenses(lic||[]);
            const{data:req,error:reqErr}=await supabase.from('license_requests').select('*,content_packs(name)').eq('center_id',center.id);
            if(reqErr)console.warn('Erreur requêtes:',reqErr);
            setRequests(req||[]);
            
            // Charger l'usage des licences (sessions + apprenants)
            try{
              const licIds=(lic||[]).map(l=>l.id);
              if(licIds.length>0){
                let sessData=[];
                try{
                  const{data,error}=await supabase.from('training_sessions').select('id,license_id,session_participants(learner_id,status)').in('license_id',licIds);
                  if(error)throw error;
                  sessData=data||[];
                }catch(e2){
                  // Fallback: load without nested relation
                  try{
                    const{data:sd}=await supabase.from('training_sessions').select('id,license_id').in('license_id',licIds);
                    sessData=(sd||[]).map(s=>({...s,session_participants:[]}));
                  }catch(e3){sessData=[];}
                }
                const usage={};
                licIds.forEach(lid=>{usage[lid]={sessions:0,learners:0};});
                (sessData||[]).forEach(s=>{
                  if(s.license_id&&usage[s.license_id]){
                    usage[s.license_id].sessions++;
                    const enrolled=(s.session_participants||[]).filter(p=>p.status==='enrolled');
                    enrolled.forEach(p=>{
                      // Use set-like counting via object
                      if(!usage[s.license_id]._learnerSet)usage[s.license_id]._learnerSet={};
                      usage[s.license_id]._learnerSet[p.learner_id]=true;
                    });
                  }
                });
                // Convert sets to counts
                Object.keys(usage).forEach(lid=>{
                  if(usage[lid]._learnerSet)usage[lid].learners=Object.keys(usage[lid]._learnerSet).length;
                  delete usage[lid]._learnerSet;
                });
                setLicenseUsage(usage);
              }
            }catch(e){console.warn('Usage load error:',e);}
          }else{
            setLoadError('Aucun centre associé à votre compte');
          }
        }catch(err){
          console.error('Erreur chargement licences:',err);
          setLoadError('Erreur lors du chargement: '+err.message);
        }
        // Super admin: Load all LMS resources for the resource picker
        if(isSuperAdmin){
          try{
            const[{data:v},{data:s},{data:q}]=await Promise.all([
              supabase.from('videos').select('id,title').eq('is_lms_content',true).order('title'),
              supabase.from('scorm_modules').select('id,title').eq('is_lms_content',true).order('title'),
              supabase.from('quizzes').select('id,title').eq('is_lms_content',true).order('title')
            ]);
            setAllLmsVideos(v||[]);setAllLmsScorm(s||[]);setAllLmsQuizzes(q||[]);
          }catch(e){console.warn('LMS resources load:',e);}
        }
        setLoading(false);
      },[isSuperAdmin,center?.id]);
      useEffect(()=>{load();},[load]);
      
      const getStatus=lic=>{
        if(lic.status==='suspended')return{label:'Suspendu',color:'red',icon:'Pause'};
        const today=new Date(),end=new Date(lic.end_date),start=new Date(lic.start_date);
        if(end<today)return{label:'Expiré',color:'red',icon:'XCircle'};
        if(start>today)return{label:'À venir',color:'blue',icon:'Clock'};
        const days=Math.ceil((end-today)/(1000*60*60*24));
        if(days<=7)return{label:`${days}j`,color:'orange',icon:'AlertTriangle'};
        if(days<=30)return{label:`${days}j`,color:'yellow',icon:'AlertCircle'};
        return{label:'Actif',color:'green',icon:'CheckCircle'};
      };
      
      // Stats pour le dashboard
      const stats=useMemo(()=>{
        const today=new Date();
        const active=licenses.filter(l=>l.status==='active'&&new Date(l.end_date)>=today&&new Date(l.start_date)<=today);
        const expiring7=active.filter(l=>{const d=Math.ceil((new Date(l.end_date)-today)/(1000*60*60*24));return d<=7;});
        const expiring30=active.filter(l=>{const d=Math.ceil((new Date(l.end_date)-today)/(1000*60*60*24));return d>7&&d<=30;});
        const expired=licenses.filter(l=>new Date(l.end_date)<today);
        const pending=requests.filter(r=>r.status==='pending');
        return{total:licenses.length,active:active.length,expiring7:expiring7.length,expiring30:expiring30.length,expired:expired.length,pending:pending.length,byCenter:centers.map(c=>({...c,count:licenses.filter(l=>l.center_id===c.id&&l.status==='active').length}))};
      },[licenses,requests,centers]);
      
      // Licences qui expirent bientôt (pour alertes)
      const expiringLicenses=useMemo(()=>{
        const today=new Date();
        return licenses.filter(l=>{
          if(l.status!=='active')return false;
          const days=Math.ceil((new Date(l.end_date)-today)/(1000*60*60*24));
          return days>0&&days<=30;
        }).map(l=>({...l,daysRemaining:Math.ceil((new Date(l.end_date)-new Date())/(1000*60*60*24))}));
      },[licenses]);
      
      // Envoyer alerte email (simulation)
      const sendExpirationAlert=async(lic,alertType)=>{
        // Vérifier si déjà envoyée
        if(alertsSent.find(a=>a.license_id===lic.id&&a.alert_type===alertType)){
          alert('Alerte déjà envoyée');return;
        }
        
        setSaving(true);
        try{
          // Enregistrer l'alerte
          await supabase.from('license_alerts').insert({license_id:lic.id,alert_type:alertType});
          
          // Récupérer l'email de l'admin du centre
          const{data:admins}=await supabase.from('profiles').select('email,first_name').eq('center_id',lic.center_id).eq('role','center_admin').limit(1);
          const admin=admins?.[0];
          
          if(admin?.email){
            // Ici on pourrait appeler une Edge Function pour envoyer l'email
            // Pour l'instant, on simule
            console.log(`Email envoyé à ${admin.email}: Licence expire dans ${lic.daysRemaining} jours`);
            alert(`✅ Alerte envoyée à ${admin.email}`);
          }else{
            alert('⚠️ Aucun admin trouvé pour ce centre');
          }
          
          await load();
        }catch(err){alert('Erreur: '+err.message);}
        setSaving(false);
      };
      
      const openLicenseModal=(lic=null)=>{
        if(lic){setEditingLicense(lic);setLicenseForm({center_id:lic.center_id,pack_id:lic.pack_id||'',license_type:lic.license_type||'content_pack',start_date:lic.start_date,end_date:lic.end_date,max_learners:lic.max_learners||'',max_resources:lic.max_resources||'',full_catalog:lic.full_catalog||false,notes:lic.notes||''});}
        else{setEditingLicense(null);const t=new Date().toISOString().split('T')[0],y=new Date(Date.now()+365*24*60*60*1000).toISOString().split('T')[0];setLicenseForm({center_id:'',pack_id:'',license_type:'content_pack',start_date:t,end_date:y,max_learners:'',max_resources:'',full_catalog:false,notes:''});}
        setLicenseModal(true);
      };
      
      const saveLicense=async()=>{
        if(!licenseForm.center_id||!licenseForm.start_date||!licenseForm.end_date){alert('Champs requis');return;}
        setSaving(true);
        try{
          const isVolume=licenseForm.license_type==='resource_volume';
          const payload={
            center_id:licenseForm.center_id,
            license_type:isVolume?'resource_volume':(licenseForm.pack_id?'content_pack':'full_catalog'),
            start_date:licenseForm.start_date,
            end_date:licenseForm.end_date,
            status:'active',
            notes:licenseForm.notes||null
          };
          if(isVolume){
            payload.pack_id=null;
            payload.max_learners=null;
            payload.max_resources=licenseForm.max_resources?parseInt(licenseForm.max_resources):null;
            payload.full_catalog=licenseForm.full_catalog||false;
          }else{
            payload.pack_id=licenseForm.pack_id||null;
            payload.max_learners=licenseForm.max_learners?parseInt(licenseForm.max_learners):null;
            payload.max_resources=null;
            payload.full_catalog=false;
          }
          if(editingLicense)await supabase.from('center_licenses').update(payload).eq('id',editingLicense.id);
          else{payload.created_by=profile?.id;await supabase.from('center_licenses').insert(payload);}
          await load();setLicenseModal(false);
        }catch(err){alert('Erreur: '+err.message);}
        setSaving(false);
      };
      
      const deleteLicense=async id=>{
        const license=licenses.find(l=>l.id===id);
        const confirmMsg=`⚠️ SUPPRIMER CETTE LICENCE ?\n\nCentre: ${license?.centers?.name||'Inconnu'}\nPack: ${license?.content_packs?.name||'Catalogue complet'}\nPériode: ${license?.start_date} → ${license?.end_date}\n\nCette action est irréversible.`;
        if(!confirm(confirmMsg))return;
        try{
          await supabase.from('center_licenses').delete().eq('id',id);
          alert('✅ Licence supprimée');
          load();
        }catch(err){alert('Erreur: '+err.message);}
      };
      const toggleStatus=async lic=>{await supabase.from('center_licenses').update({status:lic.status==='active'?'suspended':'active'}).eq('id',lic.id);load();};
      
      // Renouveler une licence (créer une nouvelle avec dates décalées)
      const renewLicense=async(lic)=>{
        const months=parseInt(prompt('Durée du renouvellement (mois):','12'));
        if(!months||isNaN(months))return;
        setSaving(true);
        try{
          const newStart=new Date(lic.end_date);
          newStart.setDate(newStart.getDate()+1);
          const newEnd=new Date(newStart);
          newEnd.setMonth(newEnd.getMonth()+months);
          
          await supabase.from('center_licenses').insert({
            center_id:lic.center_id,
            pack_id:lic.pack_id,
            license_type:lic.license_type,
            start_date:newStart.toISOString().split('T')[0],
            end_date:newEnd.toISOString().split('T')[0],
            max_learners:lic.max_learners,
            status:'active',
            notes:`Renouvellement de la licence du ${lic.start_date}`,
            created_by:profile?.id
          });
          await load();
          alert('✅ Licence renouvelée');
        }catch(err){alert('Erreur: '+err.message);}
        setSaving(false);
      };
      
      const submitRequest=async()=>{
        if(!center?.id){alert('Erreur: Aucun centre associé à votre compte');return;}
        if(!profile?.id){alert('Erreur: Utilisateur non identifié');return;}
        
        setSaving(true);
        try{
          const{error}=await supabase.from('license_requests').insert({
            center_id:center.id,
            pack_id:requestForm.pack_id||null, // null = catalogue complet
            requested_by:profile.id,
            requested_duration_months:requestForm.requested_duration_months||12,
            requested_max_learners:requestForm.requested_max_learners?parseInt(requestForm.requested_max_learners):null,
            request_message:requestForm.request_message||(requestForm.pack_id?'':'Demande d\'accès au catalogue complet')
          });
          
          if(error)throw error;
          
          await load();
          setRequestModal(false);
          setRequestForm({pack_id:'',requested_duration_months:12,requested_max_learners:'',request_message:''});
          alert('✅ Demande envoyée avec succès ! L\'administrateur sera notifié.');
        }catch(err){
          console.error('Erreur demande licence:',err);
          alert('Erreur lors de l\'envoi: '+(err.message||'Erreur inconnue'));
        }
        setSaving(false);
      };
      
      const processRequest=async(req,ok)=>{
        setSaving(true);
        try{
          if(ok){
            const s=new Date().toISOString().split('T')[0];
            const e=new Date(Date.now()+req.requested_duration_months*30*24*60*60*1000).toISOString().split('T')[0];
            
            if(req.request_type==='resource_volume'){
              // Créer une licence volume
              const{data:newLic}=await supabase.from('center_licenses').insert({
                center_id:req.center_id,
                pack_id:null,
                license_type:'resource_volume',
                start_date:s,end_date:e,
                max_resources:req.requested_max_resources||null,
                full_catalog:false,
                status:'active',
                created_by:profile.id
              }).select().single();
              
              // Créer les entrées license_resources pour les supports demandés
              if(newLic&&req.requested_resources&&req.requested_resources.length>0){
                const resources=req.requested_resources.map(r=>({
                  license_id:newLic.id,
                  content_type:r.type,
                  content_id:r.id,
                  added_by:profile.id
                }));
                await supabase.from('license_resources').insert(resources);
              }
            }else{
              // Licence pack classique
              await supabase.from('center_licenses').insert({
                center_id:req.center_id,pack_id:req.pack_id,license_type:'content_pack',
                start_date:s,end_date:e,max_learners:req.requested_max_learners,
                status:'active',created_by:profile.id
              });
            }
          }
          await supabase.from('license_requests').update({status:ok?'approved':'rejected',processed_by:profile.id,processed_at:new Date().toISOString()}).eq('id',req.id);
          await load();
        }catch(err){alert('Erreur: '+err.message);}
        setSaving(false);
      };
      
      if(loading)return<Loading/>;
      
      // Afficher l'erreur si présente
      if(loadError&&!isSuperAdmin){
        return<div className="text-center py-12">
          <Icon name="AlertTriangle" size={48} className="mx-auto text-yellow-400 mb-4"/>
          <h2 className="text-xl font-semibold mb-2">Impossible de charger les licences</h2>
          <p className="text-gray-400 mb-4">{loadError}</p>
          <Button onClick={load} icon="RefreshCw">Réessayer</Button>
        </div>;
      }
      
      return<div>
        <div className="flex items-center justify-between mb-6">
          <div>
            <h1 className="text-2xl font-bold">Licences</h1>
            <p className="text-sm text-gray-400">{isSuperAdmin?'Gestion des licences':center?.name||'Vos licences'}</p>
          </div>
          <div className="flex gap-2">
            {isSuperAdmin&&<Button icon="Plus" onClick={()=>openLicenseModal()}>Attribuer</Button>}
            {canRequestLicense&&<Button icon="Send" onClick={()=>setRequestModal(true)}>Demander une licence</Button>}
            {!isSuperAdmin&&!canRequestLicense&&realRole==='trainer'&&(
              <p className="text-sm text-gray-500 italic">Seul l'administrateur du centre peut demander des licences</p>
            )}
          </div>
        </div>
        
        {isSuperAdmin?<>
          <Tabs tabs={[
            {id:'dashboard',label:'Tableau de bord',icon:'BarChart3'},
            {id:'licenses',label:`Licences (${licenses.length})`,icon:'Key'},
            {id:'alerts',label:`Alertes (${expiringLicenses.length})`,icon:'Bell'},
            {id:'requests',label:`Demandes (${requests.filter(r=>r.status==='pending').length})`,icon:'Inbox'}
          ]} active={activeTab} onChange={setActiveTab}/>
          
          {/* DASHBOARD */}
          {activeTab==='dashboard'&&<div className="space-y-6">
            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
              <Card className="p-4 text-center"><p className="text-3xl font-bold text-white">{stats.total}</p><p className="text-sm text-gray-400">Total licences</p></Card>
              <Card className="p-4 text-center"><p className="text-3xl font-bold text-green-400">{stats.active}</p><p className="text-sm text-gray-400">Actives</p></Card>
              <Card className="p-4 text-center"><p className="text-3xl font-bold text-orange-400">{stats.expiring7}</p><p className="text-sm text-gray-400">Expire &lt;7j</p></Card>
              <Card className="p-4 text-center"><p className="text-3xl font-bold text-yellow-400">{stats.expiring30}</p><p className="text-sm text-gray-400">Expire &lt;30j</p></Card>
              <Card className="p-4 text-center"><p className="text-3xl font-bold text-red-400">{stats.expired}</p><p className="text-sm text-gray-400">Expirées</p></Card>
              <Card className="p-4 text-center"><p className="text-3xl font-bold text-blue-400">{stats.pending}</p><p className="text-sm text-gray-400">Demandes</p></Card>
            </div>
            
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <Card className="p-4">
                <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="Building2" size={18}/>Licences par centre</h3>
                <div className="space-y-2 max-h-64 overflow-y-auto">
                  {stats.byCenter.filter(c=>c.count>0).sort((a,b)=>b.count-a.count).map(c=>(
                    <div key={c.id} className="flex items-center justify-between p-2 bg-gray-700/50 rounded">
                      <span>{c.name}</span>
                      <span className="px-2 py-1 bg-indigo-500/20 text-indigo-400 rounded text-sm font-medium">{c.count}</span>
                    </div>
                  ))}
                  {stats.byCenter.filter(c=>c.count>0).length===0&&<p className="text-gray-500 text-center py-4">Aucune licence attribuée</p>}
                </div>
              </Card>
              
              <Card className="p-4">
                <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="AlertTriangle" size={18} className="text-orange-400"/>Expirations imminentes</h3>
                <div className="space-y-2 max-h-64 overflow-y-auto">
                  {expiringLicenses.slice(0,5).map(l=>(
                    <div key={l.id} className="flex items-center justify-between p-2 bg-gray-700/50 rounded">
                      <div>
                        <p className="font-medium">{l.centers?.name}</p>
                        <p className="text-xs text-gray-400">{l.content_packs?.name||'Catalogue complet'}</p>
                      </div>
                      <span className={`px-2 py-1 rounded text-sm font-medium ${l.daysRemaining<=7?'bg-red-500/20 text-red-400':'bg-yellow-500/20 text-yellow-400'}`}>{l.daysRemaining}j</span>
                    </div>
                  ))}
                  {expiringLicenses.length===0&&<p className="text-gray-500 text-center py-4">Aucune expiration proche</p>}
                </div>
              </Card>
            </div>
          </div>}
          
          {/* LICENCES */}
          {activeTab==='licenses'&&<Card><div className="overflow-x-auto"><table className="w-full"><thead className="bg-gray-750"><tr><th className="text-left p-4">Centre</th><th className="text-left p-4">Type</th><th className="text-left p-4">Pack / Objet</th><th className="text-left p-4">Période</th><th className="text-center p-4">Quota</th><th className="text-center p-4">Statut</th><th className="text-right p-4">Actions</th></tr></thead><tbody className="divide-y divide-gray-700">{licenses.map(l=>{const st=getStatus(l);const isVol=l.license_type==='resource_volume';return<tr key={l.id} className={st.color==='red'?'opacity-60':''}><td className="p-4 font-medium">{l.centers?.name}</td><td className="p-4">{isVol?<span className="px-2 py-1 rounded text-xs bg-amber-500/20 text-amber-400">Volume</span>:<span className="px-2 py-1 rounded text-xs bg-indigo-500/20 text-indigo-400">Pack</span>}</td><td className="p-4">{isVol?(l.full_catalog?<span className="text-amber-400">Tous les supports</span>:<span className="text-amber-300">{l.max_resources||'∞'} supports</span>):(l.content_packs?.name||<span className="text-purple-400">Catalogue complet</span>)}</td><td className="p-4 text-sm">{new Date(l.start_date).toLocaleDateString()} → {new Date(l.end_date).toLocaleDateString()}</td><td className="p-4 text-center">{isVol?(l.full_catalog?'∞':(l.max_resources||'∞')):(l.max_learners?l.max_learners+' appr.':'∞')}</td><td className="p-4 text-center"><span className={`px-2 py-1 rounded text-xs bg-${st.color}-500/20 text-${st.color}-400`}><Icon name={st.icon} size={12} className="inline mr-1"/>{st.label}</span></td><td className="p-4"><div className="flex gap-1 justify-end"><Button size="sm" variant="ghost" icon="RefreshCw" title="Renouveler" onClick={()=>renewLicense(l)}/><Button size="sm" variant="ghost" icon="Edit2" title="Modifier" onClick={()=>openLicenseModal(l)}/><Button size="sm" variant="ghost" icon={l.status==='active'?'Pause':'Play'} title={l.status==='active'?'Suspendre':'Activer'} onClick={()=>toggleStatus(l)}/><Button size="sm" variant="ghost" icon="Trash2" className="text-red-400 hover:bg-red-500/20" title="Supprimer" onClick={()=>deleteLicense(l.id)}/></div></td></tr>;})}</tbody></table></div>{licenses.length===0&&<div className="p-8 text-center text-gray-500">Aucune licence attribuée</div>}</Card>}
          
          {/* ALERTES */}
          {activeTab==='alerts'&&<div className="space-y-4">
            {expiringLicenses.length===0?<Empty icon="Bell" title="Aucune alerte" desc="Toutes les licences sont à jour"/>:(
              <Card>
                <div className="p-4 border-b border-gray-700">
                  <h3 className="font-semibold">Licences expirant dans les 30 prochains jours</h3>
                  <p className="text-sm text-gray-400">Envoyez des alertes email aux administrateurs des centres concernés</p>
                </div>
                <div className="divide-y divide-gray-700">
                  {expiringLicenses.map(l=>{
                    const alertType=l.daysRemaining<=1?'1_day':l.daysRemaining<=7?'7_days':'30_days';
                    const alreadySent=alertsSent.find(a=>a.license_id===l.id&&a.alert_type===alertType);
                    return<div key={l.id} className="p-4 flex items-center gap-4">
                      <div className={`w-12 h-12 rounded-full flex items-center justify-center ${l.daysRemaining<=7?'bg-red-500/20':'bg-yellow-500/20'}`}>
                        <span className={`text-lg font-bold ${l.daysRemaining<=7?'text-red-400':'text-yellow-400'}`}>{l.daysRemaining}</span>
                      </div>
                      <div className="flex-1">
                        <p className="font-medium">{l.centers?.name}</p>
                        <p className="text-sm text-gray-400">{l.content_packs?.name||'Catalogue complet'} • Expire le {new Date(l.end_date).toLocaleDateString()}</p>
                      </div>
                      {alreadySent?
                        <span className="px-3 py-1 bg-green-500/20 text-green-400 rounded text-sm"><Icon name="Check" size={14} className="inline mr-1"/>Envoyé</span>:
                        <Button size="sm" icon="Mail" onClick={()=>sendExpirationAlert(l,alertType)} loading={saving}>Envoyer alerte</Button>
                      }
                    </div>;
                  })}
                </div>
              </Card>
            )}
          </div>}
          
          {/* DEMANDES */}
          {activeTab==='requests'&&<Card>{requests.filter(r=>r.status==='pending').length===0?<Empty icon="Inbox" title="Aucune demande"/>:<div className="divide-y divide-gray-700">{requests.filter(r=>r.status==='pending').map(r=>{const isVol=r.request_type==='resource_volume';return<div key={r.id} className="p-4 flex items-center gap-4"><div className="flex-1"><div className="flex items-center gap-2"><p className="font-medium">{r.centers?.name||r.name}</p>{isVol?<span className="px-2 py-0.5 rounded text-xs bg-amber-500/20 text-amber-400">Volume</span>:<span className="px-2 py-0.5 rounded text-xs bg-indigo-500/20 text-indigo-400">Pack</span>}</div><p className="text-sm text-gray-400">{isVol?`${r.requested_max_resources||0} supports • ${r.requested_duration_months}m`:`${r.content_packs?.name||r.name||'Pack'} • ${r.requested_duration_months}m • ${r.requested_max_learners||'∞'} apprenants`}</p>{isVol&&r.requested_resources&&<div className="mt-1 flex flex-wrap gap-1">{r.requested_resources.slice(0,5).map((res,i)=><span key={i} className="px-1.5 py-0.5 bg-gray-700 rounded text-xs">{res.type==='video'?'🎬':res.type==='scorm'?'📦':'❓'} {res.title?.slice(0,25)}</span>)}{r.requested_resources.length>5&&<span className="text-xs text-gray-500">+{r.requested_resources.length-5} autres</span>}</div>}{r.request_message&&<p className="text-xs text-gray-500 mt-1 italic">"{r.request_message}"</p>}<p className="text-xs text-gray-500 mt-1">Par {r.profiles?.first_name} {r.profiles?.last_name} le {new Date(r.created_at).toLocaleDateString()}</p></div><Button size="sm" variant="secondary" onClick={()=>processRequest(r,false)}>Refuser</Button><Button size="sm" onClick={()=>processRequest(r,true)}>Approuver</Button></div>})}</div>}</Card>}
        </>:<>
          {/* GUIDE ADMIN CENTRE */}
          {canRequestLicense&&licenses.length===0&&(
            <Card className="p-6 mb-6 bg-gradient-to-r from-indigo-500/10 via-purple-500/10 to-amber-500/10 border-indigo-500/30">
              <h3 className="font-semibold text-lg mb-3 flex items-center gap-2">
                <Icon name="Sparkles" size={20} className="text-indigo-400"/>Comment obtenir des licences ?
              </h3>
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div className="flex items-start gap-3 p-3 bg-gray-800/50 rounded-lg">
                  <div className="w-8 h-8 bg-indigo-500 rounded-full flex items-center justify-center shrink-0 text-sm font-bold">1</div>
                  <div>
                    <p className="font-medium text-sm">Parcourir le catalogue</p>
                    <p className="text-xs text-gray-400 mt-1">Découvrez les contenus disponibles</p>
                  </div>
                </div>
                <div className="flex items-start gap-3 p-3 bg-gray-800/50 rounded-lg">
                  <div className="w-8 h-8 bg-purple-500 rounded-full flex items-center justify-center shrink-0 text-sm font-bold">2</div>
                  <div>
                    <p className="font-medium text-sm">Ajouter au panier</p>
                    <p className="text-xs text-gray-400 mt-1">Sélectionnez les contenus souhaités</p>
                  </div>
                </div>
                <div className="flex items-start gap-3 p-3 bg-gray-800/50 rounded-lg">
                  <div className="w-8 h-8 bg-amber-500 rounded-full flex items-center justify-center shrink-0 text-sm font-bold">3</div>
                  <div>
                    <p className="font-medium text-sm">Envoyer la demande</p>
                    <p className="text-xs text-gray-400 mt-1">Le super admin valide votre licence</p>
                  </div>
                </div>
                <div className="flex items-start gap-3 p-3 bg-gray-800/50 rounded-lg">
                  <div className="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center shrink-0 text-sm font-bold">4</div>
                  <div>
                    <p className="font-medium text-sm">Créer des sessions</p>
                    <p className="text-xs text-gray-400 mt-1">Assignez les contenus à vos apprenants</p>
                  </div>
                </div>
              </div>
              <div className="flex gap-3 mt-4">
                <Button icon="Library" onClick={()=>window.__setPage('contenus')}>Parcourir le catalogue</Button>
                <Button variant="secondary" icon="Send" onClick={()=>{setActiveTab('my-requests');setRequestModal(true);}}>Demander un pack</Button>
              </div>
            </Card>
          )}
          
          {/* CTA rapide si des licences existent */}
          {canRequestLicense&&licenses.length>0&&(
            <div className="flex gap-3 mb-6">
              <Button variant="secondary" icon="Library" onClick={()=>window.__setPage('contenus')}>Parcourir le catalogue</Button>
              <Button variant="secondary" icon="Calendar" onClick={()=>window.__setPage('sessions')}>Gérer mes sessions</Button>
              <Button variant="secondary" icon="Send" onClick={()=>{setActiveTab('my-requests');setRequestModal(true);}}>Nouvelle demande</Button>
            </div>
          )}
          
          <Tabs tabs={[{id:'my-licenses',label:`Mes licences (${licenses.length})`,icon:'Key'},{id:'my-sessions',label:'Mes sessions',icon:'Calendar'},{id:'my-requests',label:`Demandes (${requests.length})`,icon:'Send'}]} active={activeTab} onChange={setActiveTab}/>
          
          {/* Mes licences */}
          {activeTab==='my-licenses'&&<div className="space-y-4">
            {licenses.length===0?(
              <Card className="p-6 text-center">
                <Icon name="Key" size={48} className="mx-auto text-gray-500 mb-4"/>
                <h3 className="text-lg font-semibold mb-2">Aucune licence active</h3>
                <p className="text-gray-400 mb-4">Vous n'avez pas encore de licence pour accéder au catalogue LMS.</p>
                {canRequestLicense&&<Button icon="Send" onClick={()=>{setActiveTab('my-requests');setRequestModal(true);}}>Demander une licence</Button>}
              </Card>
            ):(
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">{licenses.map(l=>{
                const st=getStatus(l);
                const usage=licenseUsage[l.id]||{sessions:0,learners:0};
                const days=Math.ceil((new Date(l.end_date)-new Date())/(1000*60*60*24));
                const isVol=l.license_type==='resource_volume';
                const usagePercent=isVol?(l.max_resources?Math.round((l.max_resources-0)/l.max_resources*100):0):(l.max_learners?Math.round(usage.learners/l.max_learners*100):0);
                return<Card key={l.id} className={`p-4 ${isVol?'border-amber-500/30':'border-indigo-500/30'}`}>
                  <div className="flex justify-between mb-3">
                    <div className="flex items-center gap-2">
                      <h3 className="font-semibold">{isVol?'Licence Volume':(l.content_packs?.name||'Catalogue complet')}</h3>
                      {isVol?<span className="px-2 py-0.5 rounded text-xs bg-amber-500/20 text-amber-400">Volume</span>:<span className="px-2 py-0.5 rounded text-xs bg-indigo-500/20 text-indigo-400">Pack</span>}
                    </div>
                    <span className={`px-2 py-1 rounded text-xs bg-${st.color}-500/20 text-${st.color}-400`}>
                      <Icon name={st.icon} size={12} className="inline mr-1"/>{st.label}
                    </span>
                  </div>
                  
                  {isVol?(
                    <div className="grid grid-cols-3 gap-3 mb-3">
                      <div className="text-center p-2 bg-gray-800 rounded-lg">
                        <p className="text-lg font-bold text-amber-400">{l.full_catalog?'∞':(l.max_resources||'∞')}</p>
                        <p className="text-xs text-gray-500">Supports</p>
                      </div>
                      <div className="text-center p-2 bg-gray-800 rounded-lg">
                        <p className="text-lg font-bold text-green-400">—</p>
                        <p className="text-xs text-gray-500">Cours créés</p>
                      </div>
                      <div className="text-center p-2 bg-gray-800 rounded-lg">
                        <p className={`text-lg font-bold ${days<=7?'text-red-400':days<=30?'text-orange-400':'text-green-400'}`}>{days>0?days:0}j</p>
                        <p className="text-xs text-gray-500">Restants</p>
                      </div>
                    </div>
                  ):(
                    <div className="grid grid-cols-3 gap-3 mb-3">
                      <div className="text-center p-2 bg-gray-800 rounded-lg">
                        <p className="text-lg font-bold text-blue-400">{usage.sessions}</p>
                        <p className="text-xs text-gray-500">Session{usage.sessions>1?'s':''}</p>
                      </div>
                      <div className="text-center p-2 bg-gray-800 rounded-lg">
                        <p className={`text-lg font-bold ${usagePercent>=90?'text-red-400':usagePercent>=70?'text-orange-400':'text-green-400'}`}>
                          {usage.learners}{l.max_learners?`/${l.max_learners}`:''}
                        </p>
                        <p className="text-xs text-gray-500">Apprenants</p>
                      </div>
                      <div className="text-center p-2 bg-gray-800 rounded-lg">
                        <p className={`text-lg font-bold ${days<=7?'text-red-400':days<=30?'text-orange-400':'text-green-400'}`}>{days>0?days:0}j</p>
                        <p className="text-xs text-gray-500">Restants</p>
                      </div>
                    </div>
                  )}
                  
                  {l.max_learners&&(
                    <div className="mb-2">
                      <div className="flex justify-between text-xs text-gray-500 mb-1">
                        <span>Utilisation places</span>
                        <span className={usagePercent>=90?'text-red-400':usagePercent>=70?'text-orange-400':'text-green-400'}>{usagePercent}%</span>
                      </div>
                      <div className="h-2 bg-gray-700 rounded-full overflow-hidden">
                        <div className={`h-full rounded-full transition-all ${usagePercent>=90?'bg-red-500':usagePercent>=70?'bg-orange-500':'bg-green-500'}`} style={{width:Math.min(100,usagePercent)+'%'}}/>
                      </div>
                    </div>
                  )}
                  
                  <p className="text-sm text-gray-500">📅 {new Date(l.start_date).toLocaleDateString()} → {new Date(l.end_date).toLocaleDateString()}</p>
                  {l.notes&&<p className="text-xs text-gray-400 mt-1 italic">{l.notes}</p>}
                  
                  {usagePercent>=80&&l.max_learners&&(
                    <div className="mt-2 p-2 bg-orange-500/10 border border-orange-500/30 rounded text-xs text-orange-400 flex items-center gap-1">
                      <Icon name="AlertTriangle" size={12}/>
                      {usagePercent>=100?'Quota atteint ! Demandez une extension.':'Quota bientôt atteint.'}
                    </div>
                  )}
                </Card>;
              })}</div>
            )}
          </div>}
          
          {/* Mes sessions (raccourci) */}
          {activeTab==='my-sessions'&&<div className="space-y-4">
            <Card className="p-4 bg-gradient-to-r from-indigo-500/10 to-purple-500/10 border-indigo-500/30">
              <div className="flex items-center justify-between">
                <div>
                  <h3 className="font-semibold">Gérer vos sessions de formation</h3>
                  <p className="text-sm text-gray-400">Accédez à la page complète de gestion des sessions</p>
                </div>
                <Button icon="Calendar" onClick={()=>{
                  // Navigate to sessions page
                  if(window.__setPage)window.__setPage('sessions');
                }}>Aller aux sessions</Button>
              </div>
            </Card>
            
            {/* Quick view: sessions linked to active licenses */}
            {(()=>{
              const activeLicIds=licenses.filter(l=>getStatus(l).color!=='red').map(l=>l.id);
              return<div>
                <h3 className="text-sm font-medium text-gray-400 mb-2">Sessions liées à vos licences actives</h3>
                <p className="text-xs text-gray-500 mb-3">Consultez la page Sessions pour créer et gérer vos sessions</p>
                {Object.entries(licenseUsage).filter(([lid])=>activeLicIds.includes(lid)).map(([lid,u])=>{
                  const lic=licenses.find(l=>l.id===lid);
                  if(!lic)return null;
                  return<Card key={lid} className="p-3 mb-2">
