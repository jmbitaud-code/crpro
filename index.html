<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Course Builder Pro</title>
  <meta name="description" content="Plateforme LMS multi-centres avec isolation des données">
  <meta name="theme-color" content="#1f2937">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{gray:{750:'#2d3748',850:'#1a1f2e'}}}}}</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://player.vimeo.com/api/player.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#111827}
    .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
    @keyframes spin{to{transform:rotate(360deg)}}.animate-spin{animation:spin 1s linear infinite}
    @keyframes fade-in{from{opacity:0}to{opacity:1}}.animate-fade-in{animation:fade-in .2s ease-out}
    input,textarea,select,button{font-family:inherit}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const{useState,useEffect,useRef,createContext,useContext,useCallback}=React;

    // ============ CONFIGURATION ============
    const SUPABASE_URL='https://ludepnnsvwvpfbdxweam.supabase.co';
    const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1ZGVwbm5zdnd2cGZiZHh3ZWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNjI4NjgsImV4cCI6MjA4NDYzODg2OH0.SYTPY5l4XwxOK19_p_Dlx3be29i_sxMQD3JLYgqjL2g';
    const APP_VERSION = '6.0.0';
    // =======================================

    const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
    });

    const ROLE_LABELS={super_admin:'Super Admin',center_admin:'Admin Centre',trainer:'Formateur',learner:'Apprenant'};
    const ROLE_COLORS={super_admin:'bg-red-500',center_admin:'bg-purple-500',trainer:'bg-green-500',learner:'bg-gray-500'};

    // ============ AUTH CONTEXT ============
    const AuthContext=createContext(null);
    function AuthProvider({children}){
      const[user,setUser]=useState(null);
      const[profile,setProfile]=useState(null);
      const[center,setCenter]=useState(null);
      const[permissions,setPermissions]=useState({});
      const[loading,setLoading]=useState(true);

      const loadProfile=useCallback(async(userId)=>{
        try{
          const{data}=await supabase.from('profiles').select('*,centers(*)').eq('id',userId).single();
          setProfile(data);
          setCenter(data?.centers);
          const{data:perms}=await supabase.from('role_permissions').select('permissions').eq('role',data?.role).single();
          setPermissions(perms?.permissions||{});
          return data;
        }catch(e){console.error(e);return null;}
      },[]);

      useEffect(()=>{
        let mounted=true;
        const init=async()=>{
          try{
            const{data:{session}}=await supabase.auth.getSession();
            if(mounted&&session?.user){setUser(session.user);await loadProfile(session.user.id);}
          }catch(e){console.error(e);}
          finally{if(mounted)setLoading(false);}
        };
        init();
        const{data:{subscription}}=supabase.auth.onAuthStateChange(async(event,session)=>{
          if(!mounted)return;
          if(event==='SIGNED_IN'&&session?.user){setUser(session.user);await loadProfile(session.user.id);}
          else if(event==='SIGNED_OUT'){setUser(null);setProfile(null);setCenter(null);setPermissions({});}
        });
        return()=>{mounted=false;subscription.unsubscribe();};
      },[loadProfile]);

      const can=(perm)=>profile?.role==='super_admin'||permissions[perm]===true;
      const isSuperAdmin=profile?.role==='super_admin';
      const isCenterAdmin=profile?.role==='center_admin'||profile?.role==='trainer';
      const isLearner=profile?.role==='learner';
      const signOut=()=>supabase.auth.signOut();

      return<AuthContext.Provider value={{user,profile,center,can,isSuperAdmin,isCenterAdmin,isLearner,loading,signOut,loadProfile}}>{children}</AuthContext.Provider>;
    }
    const useAuth=()=>useContext(AuthContext);

    // ============ UI COMPONENTS ============
    function Icon({name,size=20,className=''}){
      const ref=useRef(null);
      useEffect(()=>{if(ref.current&&window.lucide){ref.current.innerHTML='';const el=document.createElement('i');el.setAttribute('data-lucide',name);ref.current.appendChild(el);window.lucide.createIcons({icons:{[name]:window.lucide.icons[name]},nodes:[el]});}},[name]);
      return<span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{width:size,height:size}}/>;
    }
    function Button({children,variant='primary',size='md',icon,loading,disabled,className='',...props}){
      const base='inline-flex items-center justify-center font-medium rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed';
      const variants={primary:'bg-indigo-600 hover:bg-indigo-700 text-white',secondary:'bg-gray-700 hover:bg-gray-600 text-white',ghost:'hover:bg-gray-700 text-gray-300',danger:'bg-red-600 hover:bg-red-700 text-white'};
      const sizes={sm:'px-3 py-1.5 text-sm gap-1.5',md:'px-4 py-2 text-sm gap-2',lg:'px-6 py-3 text-base gap-2'};
      return<button className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} disabled={disabled||loading} {...props}>{loading?<span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"/>:icon?<Icon name={icon} size={size==='sm'?14:16}/>:null}{children}</button>;
    }
    function Input({label,icon,error,...props}){
      return<div className="space-y-1">{label&&<label className="block text-sm font-medium text-gray-300">{label}</label>}<div className="relative">{icon&&<div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500"><Icon name={icon} size={18}/></div>}<input className={`w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent ${icon?'pl-10':''}`} {...props}/></div>{error&&<p className="text-sm text-red-400">{error}</p>}</div>;
    }
    function Select({label,options=[],className='',...props}){
      return<div className={`space-y-1 ${className}`}>{label&&<label className="block text-sm font-medium text-gray-300">{label}</label>}<select className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" {...props}>{options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select></div>;
    }
    function Card({children,className=''}){return<div className={`bg-gray-800 border border-gray-700 rounded-xl ${className}`}>{children}</div>;}
    function Modal({isOpen,onClose,title,children,size='md'}){
      if(!isOpen)return null;
      const sizes={sm:'max-w-md',md:'max-w-lg',lg:'max-w-2xl',xl:'max-w-4xl'};
      return<div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 animate-fade-in" onClick={onClose}><div className={`w-full ${sizes[size]} bg-gray-800 rounded-xl shadow-2xl max-h-[90vh] overflow-hidden flex flex-col`} onClick={e=>e.stopPropagation()}><div className="flex items-center justify-between p-4 border-b border-gray-700"><h2 className="text-lg font-semibold text-white">{title}</h2><button onClick={onClose} className="p-1 hover:bg-gray-700 rounded"><Icon name="X" size={20}/></button></div><div className="p-4 overflow-y-auto">{children}</div></div></div>;
    }
    function Loading({text='Chargement...'}){return<div className="flex flex-col items-center justify-center py-12"><div className="w-8 h-8 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"/><p className="mt-3 text-gray-400">{text}</p></div>;}
    function Empty({icon='Inbox',title='Aucune donnée',desc=''}){return<div className="text-center py-12"><div className="inline-flex items-center justify-center w-16 h-16 bg-gray-700 rounded-full mb-4"><Icon name={icon} size={32} className="text-gray-400"/></div><h3 className="text-lg font-medium text-white">{title}</h3>{desc&&<p className="text-gray-400 mt-1">{desc}</p>}</div>;}
    function Alert({type='info',children}){const styles={info:'bg-blue-500/10 border-blue-500 text-blue-400',success:'bg-green-500/10 border-green-500 text-green-400',error:'bg-red-500/10 border-red-500 text-red-400',warning:'bg-yellow-500/10 border-yellow-500 text-yellow-400'};return<div className={`p-3 rounded-lg border ${styles[type]}`}>{children}</div>;}
    function ProgressBar({percent=0,size='md'}){const heights={sm:'h-1',md:'h-2',lg:'h-3'};return<div className={`w-full bg-gray-700 rounded-full ${heights[size]} overflow-hidden`}><div className="h-full bg-indigo-600 transition-all duration-300" style={{width:`${Math.min(100,Math.max(0,percent))}%`}}/></div>;}
    function Badge({children,color='gray'}){const colors={gray:'bg-gray-500/20 text-gray-400',green:'bg-green-500/20 text-green-400',red:'bg-red-500/20 text-red-400',yellow:'bg-yellow-500/20 text-yellow-400',blue:'bg-blue-500/20 text-blue-400',purple:'bg-purple-500/20 text-purple-400'};return<span className={`px-2 py-1 rounded text-xs font-medium ${colors[color]}`}>{children}</span>;}
    function Tabs({tabs,active,onChange}){return<div className="flex gap-1 p-1 bg-gray-700 rounded-lg">{tabs.map(t=><button key={t.id} onClick={()=>onChange(t.id)} className={`px-4 py-2 rounded-md text-sm font-medium transition-all ${active===t.id?'bg-indigo-600 text-white':'text-gray-400 hover:text-white'}`}>{t.label}</button>)}</div>;}
    function Checkbox({label,checked,onChange}){return<label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)} className="w-4 h-4 rounded border-gray-600 bg-gray-700 text-indigo-600 focus:ring-indigo-500"/><span className="text-sm text-gray-300">{label}</span></label>;}

    // ============ LOGIN PAGE ============
    function LoginPage(){
      const[email,setEmail]=useState('');
      const[password,setPassword]=useState('');
      const[loading,setLoading]=useState(false);
      const[msg,setMsg]=useState(null);

      const handleSubmit=async(e)=>{
        e.preventDefault();setLoading(true);setMsg(null);
        const{error}=await supabase.auth.signInWithPassword({email,password});
        if(error)setMsg({type:'error',text:error.message});
        setLoading(false);
      };

      return<div className="min-h-screen bg-gray-900 flex items-center justify-center p-4"><div className="w-full max-w-md"><div className="text-center mb-8"><div className="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-2xl mb-4"><Icon name="GraduationCap" size={32} className="text-white"/></div><h1 className="text-2xl font-bold text-white">Course Builder Pro</h1><p className="text-gray-400 mt-1">Plateforme de formation</p></div><Card className="p-6">{msg&&<Alert type={msg.type}>{msg.text}</Alert>}<form onSubmit={handleSubmit} className="space-y-4 mt-4"><Input label="Email" type="email" icon="Mail" value={email} onChange={e=>setEmail(e.target.value)} required/><Input label="Mot de passe" type="password" icon="Lock" value={password} onChange={e=>setPassword(e.target.value)} required/><Button type="submit" className="w-full" loading={loading}>Se connecter</Button></form></Card><p className="text-center text-gray-500 text-xs mt-4">v{APP_VERSION}</p></div></div>;
    }

    // ============ APP LAYOUT ============
    function AppLayout({children}){
      const{profile,center,signOut,isSuperAdmin,isCenterAdmin,isLearner,can}=useAuth();
      const[page,setPage]=useState('dashboard');
      const[sidebarOpen,setSidebarOpen]=useState(false);
      const[notifications,setNotifications]=useState([]);
      const[showNotif,setShowNotif]=useState(false);

      useEffect(()=>{
        if(!profile)return;
        const loadNotif=async()=>{
          const{data}=await supabase.from('notifications').select('*').eq('user_id',profile.id).order('created_at',{ascending:false}).limit(10);
          setNotifications(data||[]);
        };
        loadNotif();
        const channel=supabase.channel('notif').on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`user_id=eq.${profile.id}`},payload=>{setNotifications(prev=>[payload.new,...prev].slice(0,10));}).subscribe();
        return()=>supabase.removeChannel(channel);
      },[profile?.id]);

      const unreadCount=notifications.filter(n=>!n.is_read).length;
      const markAsRead=async(id)=>{await supabase.from('notifications').update({is_read:true}).eq('id',id);setNotifications(prev=>prev.map(n=>n.id===id?{...n,is_read:true}:n));};

      // Menu basé sur le rôle
      const menu=[];
      if(isSuperAdmin){
        menu.push({id:'dashboard',label:'Tableau de bord',icon:'LayoutDashboard'});
        menu.push({id:'library',label:'Bibliothèque',icon:'Library'});
        menu.push({id:'centers',label:'Centres',icon:'Building2'});
        menu.push({id:'users',label:'Utilisateurs',icon:'Users'});
      }else if(isCenterAdmin){
        menu.push({id:'dashboard',label:'Tableau de bord',icon:'LayoutDashboard'});
        menu.push({id:'courses',label:'Cours',icon:'BookOpen'});
        menu.push({id:'paths',label:'Parcours',icon:'Map'});
        menu.push({id:'quizzes',label:'Quiz',icon:'HelpCircle'});
        menu.push({id:'enrollments',label:'Inscriptions',icon:'UserPlus'});
        menu.push({id:'learners',label:'Apprenants',icon:'Users'});
        menu.push({id:'analytics',label:'Statistiques',icon:'BarChart3'});
      }else if(isLearner){
        menu.push({id:'my-courses',label:'Mes cours',icon:'BookOpen'});
        menu.push({id:'my-paths',label:'Mes parcours',icon:'Map'});
        menu.push({id:'my-badges',label:'Mes badges',icon:'Trophy'});
        menu.push({id:'my-certificates',label:'Certificats',icon:'Award'});
        menu.push({id:'leaderboard',label:'Classement',icon:'Medal'});
      }

      const Sidebar=()=><aside className={`fixed inset-y-0 left-0 z-40 w-64 bg-gray-800 border-r border-gray-700 transform transition-transform lg:translate-x-0 ${sidebarOpen?'translate-x-0':'-translate-x-full'}`}>
        <div className="flex items-center gap-3 p-4 border-b border-gray-700">
          <div className="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center"><Icon name="GraduationCap" size={24}/></div>
          <div><h1 className="font-bold text-white">Course Builder</h1><p className="text-xs text-gray-400">v{APP_VERSION}</p></div>
        </div>
        <nav className="p-4 space-y-1">
          {menu.map(m=><button key={m.id} onClick={()=>{setPage(m.id);setSidebarOpen(false);}} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-left transition-all ${page===m.id?'bg-indigo-600 text-white':'text-gray-400 hover:bg-gray-700 hover:text-white'}`}><Icon name={m.icon} size={20}/>{m.label}</button>)}
        </nav>
        <div className="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-700">
          <div className="flex items-center gap-3 mb-3">
            <div className={`w-10 h-10 rounded-full ${ROLE_COLORS[profile?.role]} flex items-center justify-center text-white font-medium`}>{profile?.first_name?.[0]}{profile?.last_name?.[0]}</div>
            <div className="flex-1 min-w-0"><p className="font-medium text-white truncate">{profile?.first_name} {profile?.last_name}</p><p className="text-xs text-gray-400 truncate">{center?.name||ROLE_LABELS[profile?.role]}</p></div>
          </div>
          <Button variant="ghost" icon="LogOut" className="w-full justify-start" onClick={signOut}>Déconnexion</Button>
        </div>
      </aside>;

      return<div className="min-h-screen bg-gray-900 text-white">
        <Sidebar/>
        {sidebarOpen&&<div className="fixed inset-0 bg-black/50 z-30 lg:hidden" onClick={()=>setSidebarOpen(false)}/>}
        <div className="lg:ml-64">
          <header className="sticky top-0 z-20 bg-gray-800 border-b border-gray-700 px-4 py-3 flex items-center justify-between">
            <button className="lg:hidden p-2 hover:bg-gray-700 rounded-lg" onClick={()=>setSidebarOpen(true)}><Icon name="Menu" size={24}/></button>
            <div className="flex-1"/>
            <div className="relative">
              <button onClick={()=>setShowNotif(!showNotif)} className="p-2 hover:bg-gray-700 rounded-lg relative">
                <Icon name="Bell" size={20}/>
                {unreadCount>0&&<span className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full text-xs flex items-center justify-center">{unreadCount}</span>}
              </button>
              {showNotif&&<div className="absolute right-0 mt-2 w-80 bg-gray-800 border border-gray-700 rounded-xl shadow-xl">
                <div className="p-3 border-b border-gray-700 font-medium">Notifications</div>
                <div className="max-h-80 overflow-y-auto">
                  {notifications.length===0?<p className="p-4 text-gray-500 text-center">Aucune notification</p>:notifications.map(n=><div key={n.id} onClick={()=>{markAsRead(n.id);if(n.link)setPage(n.link);setShowNotif(false);}} className={`p-3 border-b border-gray-700 cursor-pointer hover:bg-gray-750 ${!n.is_read?'bg-indigo-500/10':''}`}><p className="font-medium text-sm">{n.title}</p><p className="text-xs text-gray-400">{n.message}</p></div>)}
                </div>
              </div>}
            </div>
          </header>
          <main className="p-4 lg:p-6">
            {isSuperAdmin&&<>
              {page==='dashboard'&&<SuperAdminDashboard/>}
              {page==='library'&&<LibraryPage/>}
              {page==='centers'&&<CentersPage/>}
              {page==='users'&&<UsersPage/>}
            </>}
            {isCenterAdmin&&<>
              {page==='dashboard'&&<CenterDashboard/>}
              {page==='courses'&&<CenterCoursesPage/>}
              {page==='paths'&&<CenterPathsPage/>}
              {page==='quizzes'&&<CenterQuizzesPage/>}
              {page==='enrollments'&&<CenterEnrollmentsPage/>}
              {page==='learners'&&<CenterLearnersPage/>}
              {page==='analytics'&&<CenterAnalyticsPage/>}
            </>}
            {isLearner&&<>
              {page==='my-courses'&&<LearnerCoursesPage/>}
              {page==='my-paths'&&<LearnerPathsPage/>}
              {page==='my-badges'&&<LearnerBadgesPage/>}
              {page==='my-certificates'&&<LearnerCertificatesPage/>}
              {page==='leaderboard'&&<LearnerLeaderboardPage/>}
            </>}
          </main>
        </div>
      </div>;
    }

    // ============ SUPER ADMIN PAGES ============
    
    // Dashboard Super Admin
    function SuperAdminDashboard(){
      const[stats,setStats]=useState({centers:0,users:0,videos:0,scorm:0});
      const[loading,setLoading]=useState(true);

      useEffect(()=>{
        const load=async()=>{
          const[{count:centers},{count:users},{count:videos},{count:scorm}]=await Promise.all([
            supabase.from('centers').select('*',{count:'exact',head:true}),
            supabase.from('profiles').select('*',{count:'exact',head:true}),
            supabase.from('library_videos').select('*',{count:'exact',head:true}),
            supabase.from('library_scorm_modules').select('*',{count:'exact',head:true})
          ]);
          setStats({centers:centers||0,users:users||0,videos:videos||0,scorm:scorm||0});
          setLoading(false);
        };
        load();
      },[]);

      if(loading)return<Loading/>;

      const cards=[
        {label:'Centres',value:stats.centers,icon:'Building2',color:'text-purple-400'},
        {label:'Utilisateurs',value:stats.users,icon:'Users',color:'text-blue-400'},
        {label:'Vidéos (Bibliothèque)',value:stats.videos,icon:'Film',color:'text-green-400'},
        {label:'Modules SCORM',value:stats.scorm,icon:'Package',color:'text-orange-400'}
      ];

      return<div>
        <h1 className="text-2xl font-bold mb-6">Tableau de bord Super Admin</h1>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
          {cards.map(c=><Card key={c.label} className="p-4"><div className="flex items-center gap-3"><div className={c.color}><Icon name={c.icon} size={24}/></div><div><p className="text-gray-400 text-sm">{c.label}</p><p className="text-2xl font-bold">{c.value}</p></div></div></Card>)}
        </div>
      </div>;
    }

    // Bibliothèque (Vidéos + SCORM)
    function LibraryPage(){
      const{profile}=useAuth();
      const[tab,setTab]=useState('videos');
      const[videos,setVideos]=useState([]);
      const[scorm,setScorm]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(null);
      const[form,setForm]=useState({title:'',vimeo_id:'',description:'',category:'',duration:''});
      const[scormForm,setScormForm]=useState({title:'',description:'',module_type:'scorm2004',entry_point:'index.html',category:''});
      const[saving,setSaving]=useState(false);

      const load=useCallback(async()=>{
        const[{data:v},{data:s}]=await Promise.all([
          supabase.from('library_videos').select('*').order('created_at',{ascending:false}),
          supabase.from('library_scorm_modules').select('*').order('created_at',{ascending:false})
        ]);
        setVideos(v||[]);setScorm(s||[]);setLoading(false);
      },[]);
      useEffect(()=>{load();},[load]);

      const saveVideo=async()=>{
        setSaving(true);
        const payload={...form,created_by:profile?.id,is_active:true};
        if(modal==='edit-video'){
          await supabase.from('library_videos').update(payload).eq('id',form.id);
        }else{
          await supabase.from('library_videos').insert(payload);
        }
        await load();setModal(null);setSaving(false);
      };

      const saveScorm=async()=>{
        setSaving(true);
        const payload={...scormForm,created_by:profile?.id,is_active:true};
        if(modal==='edit-scorm'){
          await supabase.from('library_scorm_modules').update(payload).eq('id',scormForm.id);
        }else{
          await supabase.from('library_scorm_modules').insert(payload);
        }
        await load();setModal(null);setSaving(false);
      };

      const deleteVideo=async(id)=>{if(!confirm('Supprimer cette vidéo ?'))return;await supabase.from('library_videos').delete().eq('id',id);load();};

    // Dashboard Centre
    function CenterDashboard(){
      const{center}=useAuth();
      const[stats,setStats]=useState({learners:0,courses:0,enrollments:0,completed:0});
      const[loading,setLoading]=useState(true);

      useEffect(()=>{
        if(!center?.id)return;
        const load=async()=>{
          const[{count:learners},{count:courses},{count:enrollments},{count:completed}]=await Promise.all([
            supabase.from('profiles').select('*',{count:'exact',head:true}).eq('center_id',center.id).eq('role','learner'),
            supabase.from('center_courses').select('*',{count:'exact',head:true}).eq('center_id',center.id),
            supabase.from('center_enrollments').select('*',{count:'exact',head:true}).eq('center_id',center.id),
            supabase.from('center_enrollments').select('*',{count:'exact',head:true}).eq('center_id',center.id).eq('status','completed')
          ]);
          setStats({learners:learners||0,courses:courses||0,enrollments:enrollments||0,completed:completed||0});
          setLoading(false);
        };
        load();
      },[center?.id]);

      if(loading)return<Loading/>;

      const completionRate=stats.enrollments>0?Math.round((stats.completed/stats.enrollments)*100):0;
      const cards=[
        {label:'Apprenants',value:stats.learners,icon:'Users',color:'text-blue-400'},
        {label:'Cours',value:stats.courses,icon:'BookOpen',color:'text-green-400'},
        {label:'Inscriptions',value:stats.enrollments,icon:'UserPlus',color:'text-purple-400'},
        {label:'Complétés',value:stats.completed,icon:'CheckCircle',color:'text-emerald-400'}
      ];

      return<div>
        <h1 className="text-2xl font-bold mb-2">Tableau de bord</h1>
        <p className="text-gray-400 mb-6">{center?.name}</p>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          {cards.map(c=><Card key={c.label} className="p-4"><div className="flex items-center gap-3"><div className={c.color}><Icon name={c.icon} size={24}/></div><div><p className="text-gray-400 text-sm">{c.label}</p><p className="text-2xl font-bold">{c.value}</p></div></div></Card>)}
        </div>
        <Card className="p-6">
          <div className="flex items-center justify-between mb-4"><h2 className="text-lg font-semibold">Taux de complétion</h2><span className="text-3xl font-bold text-indigo-400">{completionRate}%</span></div>
          <ProgressBar percent={completionRate}/>
        </Card>
      </div>;
    }

    function CenterCoursesPage(){

        setSaving(true);

          await supabase.from('center_courses').update(payload).eq('id',editing.id);

        setSelectedCourse(course);

        setModal('videos');

        await supabase.from('center_course_videos').insert({center_course_id:selectedCourse.id,library_video_id:videoId,position:courseVideos.length});

        setCourseVideos(data||[]);load();
      };

      const removeVideoFromCourse=async(id)=>{
        await supabase.from('center_course_videos').delete().eq('id',id);
        setCourseVideos(courseVideos.filter(cv=>cv.id!==id));load();
      };

      const difficultyLabels={beginner:'Débutant',intermediate:'Intermédiaire',advanced:'Avancé'};

              <Button variant="ghost" size="sm" icon="Film" onClick={()=>openVideosModal(c)}>Vidéos</Button>
              <Button variant="ghost" size="sm" icon={c.is_published?'EyeOff':'Eye'} onClick={()=>togglePublish(c)}/>
              <Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setForm({title:c.title,description:c.description||'',difficulty:c.difficulty});setEditing(c);setModal('course');}}/>
              <Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(c.id)}/>
            </div>
          </Card>)}

        {/* Modal Cours */}
        <Modal isOpen={modal==='course'} onClose={()=>{setModal(null);setEditing(null);}} title={editing?'Modifier le cours':'Créer un cours'}>
          <div className="space-y-4">

            <div><label className="block text-sm font-medium text-gray-300 mb-1">Description</label><textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={3} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/></div>
            <div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(null)}>Annuler</Button><Button onClick={handleSave} loading={saving} disabled={!form.title}>Enregistrer</Button></div>
          </div>

        {/* Modal Vidéos du cours */}
        <Modal isOpen={modal==='videos'} onClose={()=>setModal(null)} title={`Vidéos: ${selectedCourse?.title}`} size="lg">
          <div className="space-y-4">
            <div className="space-y-2 max-h-64 overflow-y-auto">

    // Mes Cours (Apprenant)
    function LearnerCoursesPage(){
      const{user,center}=useAuth();
      const[enrollments,setEnrollments]=useState([]);
      const[loading,setLoading]=useState(true);
      const[selectedEnrollment,setSelectedEnrollment]=useState(null);
      const[courseVideos,setCourseVideos]=useState([]);
      const[currentVideo,setCurrentVideo]=useState(null);
      const[videoProgress,setVideoProgress]=useState({});
      const playerRef=useRef(null);

      useEffect(()=>{
        const load=async()=>{
          const{data}=await supabase.from('center_enrollments').select('*,center_courses(*)').eq('learner_id',user.id).not('center_course_id','is',null).order('created_at',{ascending:false});
          setEnrollments(data||[]);setLoading(false);
        };
        load();
      },[user.id]);

      const openCourse=async(enrollment)=>{
        setSelectedEnrollment(enrollment);
        const{data:videos}=await supabase.from('center_course_videos').select('*,library_videos(*)').eq('center_course_id',enrollment.center_course_id).order('position');
        setCourseVideos(videos||[]);
        const{data:progress}=await supabase.from('center_video_progress').select('*').eq('enrollment_id',enrollment.id);
        const progressMap={};
        (progress||[]).forEach(p=>{progressMap[p.library_video_id]=p;});
        setVideoProgress(progressMap);
        if(videos?.length>0)setCurrentVideo(videos[0]);
      };

      const selectVideo=(cv)=>{setCurrentVideo(cv);};

      const markComplete=async(cv)=>{
        await supabase.from('center_video_progress').upsert({enrollment_id:selectedEnrollment.id,library_video_id:cv.library_video_id,is_completed:true,completed_at:new Date().toISOString()},{onConflict:'enrollment_id,library_video_id'});
        setVideoProgress({...videoProgress,[cv.library_video_id]:{...videoProgress[cv.library_video_id],is_completed:true}});
        // Mettre à jour progression
        const completed=Object.values({...videoProgress,[cv.library_video_id]:{is_completed:true}}).filter(p=>p.is_completed).length;
        const percent=Math.round((completed/courseVideos.length)*100);
        await supabase.from('center_enrollments').update({progress_percent:percent,status:percent===100?'completed':percent>0?'in_progress':'not_started'}).eq('id',selectedEnrollment.id);
        setSelectedEnrollment({...selectedEnrollment,progress_percent:percent});
      };

      const statusColors={not_started:'gray',in_progress:'blue',completed:'green'};
      const statusLabels={not_started:'Non commencé',in_progress:'En cours',completed:'Terminé'};

      if(loading)return<Loading/>;

      if(selectedEnrollment){
        return<div>
          <Button variant="ghost" icon="ArrowLeft" onClick={()=>{setSelectedEnrollment(null);setCurrentVideo(null);}} className="mb-4">Retour</Button>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2">
              <Card className="overflow-hidden">
                <div className="aspect-video bg-black">{currentVideo&&<iframe src={`https://player.vimeo.com/video/${currentVideo.library_videos?.vimeo_id}?autoplay=0`} className="w-full h-full" frameBorder="0" allow="autoplay; fullscreen" allowFullScreen/>}</div>
                <div className="p-4">
                  <h2 className="text-xl font-semibold">{currentVideo?.library_videos?.title}</h2>
                  {currentVideo&&!videoProgress[currentVideo.library_video_id]?.is_completed&&<Button className="mt-3" icon="CheckCircle" onClick={()=>markComplete(currentVideo)}>Marquer comme vu</Button>}
                </div>
              </Card>
            </div>
            <div>
              <Card className="p-4">
                <div className="flex items-center justify-between mb-4"><h3 className="font-semibold">Contenu</h3><span className="text-sm text-gray-400">{selectedEnrollment.progress_percent}%</span></div>
                <ProgressBar percent={selectedEnrollment.progress_percent} className="mb-4"/>
                <div className="space-y-2">
                  {courseVideos.map((cv,i)=>{
                    const isComplete=videoProgress[cv.library_video_id]?.is_completed;
                    const isCurrent=currentVideo?.id===cv.id;
                    return<button key={cv.id} onClick={()=>selectVideo(cv)} className={`w-full flex items-center gap-3 p-3 rounded-lg text-left transition-all ${isCurrent?'bg-indigo-600':'hover:bg-gray-700'}`}>
                      <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs ${isComplete?'bg-green-500':'bg-gray-600'}`}>{isComplete?<Icon name="Check" size={14}/>:i+1}</span>
                      <span className="flex-1 truncate text-sm">{cv.library_videos?.title}</span>
                    </button>;
                  })}
                </div>
              </Card>
            </div>
          </div>
        </div>;
      }

      return<div>
        <h1 className="text-2xl font-bold mb-6">Mes cours</h1>
        {enrollments.length===0?<Empty icon="BookOpen" title="Aucun cours" desc="Vous n'êtes inscrit à aucun cours"/>:
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          {enrollments.map(e=><Card key={e.id} className="overflow-hidden cursor-pointer hover:ring-2 hover:ring-indigo-500" onClick={()=>openCourse(e)}>
            <div className="h-32 bg-gradient-to-br from-indigo-600 to-purple-700 flex items-center justify-center"><Icon name="BookOpen" size={48} className="text-white/80"/></div>
            <div className="p-4">
              <h3 className="font-semibold">{e.center_courses?.title}</h3>
              <Badge color={statusColors[e.status]} className="mt-2">{statusLabels[e.status]}</Badge>
              <ProgressBar percent={e.progress_percent} size="sm" className="mt-3"/>
              <p className="text-xs text-gray-400 mt-2">{e.progress_percent}% complété</p>
            </div>
          </Card>)}
        </div>}
      </div>;
    }

          <h2 className="text-lg font-semibold mb-4">Badges obtenus ({earned.length})</h2>
          {earned.length===0?<p className="text-gray-500">Aucun badge obtenu</p>:
          <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            {earned.map(e=><div key={e.id} className="text-center"><div className={`w-16 h-16 mx-auto rounded-full ${colorClasses[e.center_badges?.color]||'bg-gray-600'} flex items-center justify-center mb-2`}><Icon name={e.center_badges?.icon||'Award'} size={32} className="text-white"/></div><p className="font-medium text-sm">{e.center_badges?.name}</p><p className="text-xs text-gray-400">+{e.center_badges?.points} pts</p></div>)}
          </div>}
        </div>

        <div>
          <h2 className="text-lg font-semibold mb-4">Badges à débloquer</h2>
          <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            {available.filter(b=>!earnedIds.includes(b.id)).map(b=><div key={b.id} className="text-center opacity-40"><div className="w-16 h-16 mx-auto rounded-full bg-gray-700 flex items-center justify-center mb-2"><Icon name={b.icon||'Award'} size={32} className="text-gray-500"/></div><p className="font-medium text-sm">{b.name}</p><p className="text-xs text-gray-500">+{b.points} pts</p></div>)}
          </div>
        </div>
      </div>;
    }

    // Mes Certificats
    function LearnerCertificatesPage(){
      const{user}=useAuth();
      const[certificates,setCertificates]=useState([]);
      const[loading,setLoading]=useState(true);

      useEffect(()=>{
        const load=async()=>{
          const{data}=await supabase.from('center_certificates').select('*').eq('learner_id',user.id).order('issued_at',{ascending:false});
          setCertificates(data||[]);setLoading(false);
        };
        load();
      },[user.id]);

      if(loading)return<Loading/>;

      return<div>
        <h1 className="text-2xl font-bold mb-6">Mes certificats</h1>
        {certificates.length===0?<Empty icon="Award" title="Aucun certificat" desc="Terminez un cours pour obtenir un certificat"/>:
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          {certificates.map(c=><Card key={c.id} className="p-4">
            <div className="flex items-center gap-3 mb-3"><div className="w-12 h-12 bg-yellow-500/20 rounded-full flex items-center justify-center"><Icon name="Award" size={24} className="text-yellow-400"/></div><div><h3 className="font-semibold">{c.course_title||c.path_title}</h3><p className="text-sm text-gray-400">{c.certificate_number}</p></div></div>
            <p className="text-sm text-gray-400">Délivré le {new Date(c.issued_at).toLocaleDateString('fr-FR')}</p>
          </Card>)}
        </div>}
      </div>;
    }

    // Classement
    function LearnerLeaderboardPage(){
      const{user,center}=useAuth();
      const[leaderboard,setLeaderboard]=useState([]);
      const[loading,setLoading]=useState(true);

      useEffect(()=>{
        if(!center?.id)return;
        const load=async()=>{
          const{data:profiles}=await supabase.from('profiles').select('id,first_name,last_name').eq('center_id',center.id).eq('role','learner');
          const{data:points}=await supabase.from('center_learner_points').select('learner_id,points').eq('center_id',center.id);
          
          const pointsMap={};
          (points||[]).forEach(p=>{pointsMap[p.learner_id]=(pointsMap[p.learner_id]||0)+p.points;});
          
          const ranked=(profiles||[]).map(p=>({...p,total_points:pointsMap[p.id]||0})).sort((a,b)=>b.total_points-a.total_points).map((p,i)=>({...p,rank:i+1}));
          setLeaderboard(ranked.slice(0,20));
          setLoading(false);
        };
        load();
      },[center?.id]);

      if(loading)return<Loading/>;

      const myRank=leaderboard.find(l=>l.id===user.id);

      return<div>
        <h1 className="text-2xl font-bold mb-6">Classement</h1>
        {myRank&&<Card className="p-4 mb-6 bg-indigo-600/20 border-indigo-500"><div className="flex items-center gap-4"><div className="w-12 h-12 bg-indigo-600 rounded-full flex items-center justify-center text-xl font-bold">#{myRank.rank}</div><div className="flex-1"><p className="font-semibold">Votre position</p><p className="text-sm text-gray-400">{myRank.total_points} points</p></div></div></Card>}
        <Card><div className="divide-y divide-gray-700">{leaderboard.map((l,i)=><div key={l.id} className={`flex items-center gap-4 p-4 ${l.id===user.id?'bg-indigo-600/10':''}`}>
          <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold ${i===0?'bg-yellow-500':i===1?'bg-gray-400':i===2?'bg-orange-600':'bg-gray-700'}`}>{i<3?<Icon name={i===0?'Crown':'Medal'} size={20}/>:l.rank}</div>
          <div className="flex-1"><p className="font-medium">{l.first_name} {l.last_name}</p></div>
          <div className="text-right"><p className="font-bold text-indigo-400">{l.total_points}</p><p className="text-xs text-gray-500">points</p></div>
        </div>)}</div></Card>
      </div>;
    }

    // ============ APP ============
    function App(){
      const{user,loading}=useAuth();
      if(loading)return<Loading text="Chargement..."/>;
      return user?<AppLayout/>:<LoginPage/>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AuthProvider><App/></AuthProvider>);
  </script>
</body>
</html>
