          <Card className="p-4"><h3 className="font-semibold mb-3">Quiz ({quizzes.length})</h3><div className="space-y-2 max-h-60 overflow-y-auto">{quizzes.map(q=><div key={q.id} className="flex items-center gap-3 p-2 bg-gray-700/50 rounded"><input type="checkbox" checked={q.is_lms_content||false} onChange={()=>toggleLmsContent('quizzes',q.id,q.is_lms_content)} disabled={saving} className="w-5 h-5"/><span className="flex-1">{q.title}</span>{q.is_lms_content&&<span className="px-2 py-0.5 bg-cyan-500/20 text-cyan-400 rounded text-xs">LMS</span>}</div>)}</div></Card>
          <Card className="p-4"><h3 className="font-semibold mb-3">Cours ({courses.length})</h3><div className="space-y-2 max-h-60 overflow-y-auto">{courses.map(c=><div key={c.id} className="flex items-center gap-3 p-2 bg-gray-700/50 rounded"><input type="checkbox" checked={c.is_lms_content||false} onChange={()=>toggleLmsContent('playlists',c.id,c.is_lms_content)} disabled={saving} className="w-5 h-5"/><span className="flex-1">{c.title}</span>{c.is_lms_content&&<><span className="px-2 py-0.5 bg-green-500/20 text-green-400 rounded text-xs">LMS</span><button onClick={()=>toggleLocked('playlists',c.id,c.is_locked)} className={`px-2 py-0.5 rounded text-xs ${c.is_locked?'bg-red-500/20 text-red-400':'bg-gray-600 text-gray-400'}`}>{c.is_locked?'🔒':'🔓'}</button></>}</div>)}</div></Card>
        </div>}
        
        {activeTab==='packs'&&<div className="space-y-4">
          <div className="flex justify-end"><Button icon="Plus" onClick={()=>openPackModal()}>Créer un pack</Button></div>

    // ==================== LICENCES ====================
    function LicensesPage(){
      const{isSuperAdmin,profile,center}=useAuth();
      const[loading,setLoading]=useState(true);
      const[licenses,setLicenses]=useState([]);
      const[requests,setRequests]=useState([]);
      const[packs,setPacks]=useState([]);
      const[centers,setCenters]=useState([]);
      const[activeTab,setActiveTab]=useState(isSuperAdmin?'licenses':'my-licenses');
      const[licenseModal,setLicenseModal]=useState(false);
      const[editingLicense,setEditingLicense]=useState(null);
      const[licenseForm,setLicenseForm]=useState({center_id:'',pack_id:'',start_date:'',end_date:'',max_learners:'',notes:''});
      const[saving,setSaving]=useState(false);
      const[requestModal,setRequestModal]=useState(false);
      const[requestForm,setRequestForm]=useState({pack_id:'',requested_duration_months:12,requested_max_learners:'',request_message:''});
      
      const load=useCallback(async()=>{
        try{
          const{data:pk}=await supabase.from('content_packs').select('*').eq('is_active',true);setPacks(pk||[]);
          if(isSuperAdmin){
            const{data:lic}=await supabase.from('center_licenses').select('*,centers(name),content_packs(name,code)').order('created_at',{ascending:false});setLicenses(lic||[]);
            const{data:req}=await supabase.from('license_requests').select('*,centers(name),content_packs(name),profiles!requested_by(first_name,last_name)').order('created_at',{ascending:false});setRequests(req||[]);
            const{data:ct}=await supabase.from('centers').select('id,name');setCenters(ct||[]);
          }else if(center?.id){
            const{data:lic}=await supabase.from('center_licenses').select('*,content_packs(name,code,description)').eq('center_id',center.id);setLicenses(lic||[]);
            const{data:req}=await supabase.from('license_requests').select('*,content_packs(name)').eq('center_id',center.id);setRequests(req||[]);
          }
        }catch(err){console.error(err);}
        setLoading(false);
      },[isSuperAdmin,center?.id]);
      useEffect(()=>{load();},[load]);
      
      const getStatus=lic=>{
        if(lic.status==='suspended')return{label:'Suspendu',color:'red'};
        const today=new Date(),end=new Date(lic.end_date),start=new Date(lic.start_date);
        if(end<today)return{label:'Expiré',color:'red'};
        if(start>today)return{label:'À venir',color:'yellow'};
        const days=Math.ceil((end-today)/(1000*60*60*24));
        if(days<=7)return{label:`${days}j`,color:'orange'};
        if(days<=30)return{label:`${days}j`,color:'yellow'};
        return{label:'Actif',color:'green'};
      };
      
      const openLicenseModal=(lic=null)=>{
        if(lic){setEditingLicense(lic);setLicenseForm({center_id:lic.center_id,pack_id:lic.pack_id||'',start_date:lic.start_date,end_date:lic.end_date,max_learners:lic.max_learners||'',notes:lic.notes||''});}
        else{setEditingLicense(null);const t=new Date().toISOString().split('T')[0],y=new Date(Date.now()+365*24*60*60*1000).toISOString().split('T')[0];setLicenseForm({center_id:'',pack_id:'',start_date:t,end_date:y,max_learners:'',notes:''});}
        setLicenseModal(true);
      };
      
      const saveLicense=async()=>{
        if(!licenseForm.center_id||!licenseForm.start_date||!licenseForm.end_date){alert('Champs requis');return;}
        setSaving(true);
        try{
          const payload={center_id:licenseForm.center_id,pack_id:licenseForm.pack_id||null,license_type:licenseForm.pack_id?'bundle':'full_catalog',start_date:licenseForm.start_date,end_date:licenseForm.end_date,max_learners:licenseForm.max_learners?parseInt(licenseForm.max_learners):null,notes:licenseForm.notes||null,status:'active'};
          if(editingLicense)await supabase.from('center_licenses').update(payload).eq('id',editingLicense.id);
          else{payload.created_by=profile?.id;await supabase.from('center_licenses').insert(payload);}
          await load();setLicenseModal(false);
        }catch(err){alert('Erreur: '+err.message);}
        setSaving(false);
      };
      
      const deleteLicense=async id=>{if(!confirm('Supprimer ?'))return;await supabase.from('center_licenses').delete().eq('id',id);load();};
      const toggleStatus=async lic=>{await supabase.from('center_licenses').update({status:lic.status==='active'?'suspended':'active'}).eq('id',lic.id);load();};
      
      const submitRequest=async()=>{
        if(!requestForm.pack_id){alert('Pack requis');return;}
        setSaving(true);
        try{
          await supabase.from('license_requests').insert({center_id:center.id,pack_id:requestForm.pack_id,requested_by:profile.id,requested_duration_months:requestForm.requested_duration_months,requested_max_learners:requestForm.requested_max_learners?parseInt(requestForm.requested_max_learners):null,request_message:requestForm.request_message});
          await load();setRequestModal(false);setRequestForm({pack_id:'',requested_duration_months:12,requested_max_learners:'',request_message:''});alert('Demande envoyée !');
        }catch(err){alert('Erreur: '+err.message);}
        setSaving(false);
      };
      
      const processRequest=async(req,ok)=>{
        setSaving(true);
        try{
          if(ok){const s=new Date().toISOString().split('T')[0],e=new Date(Date.now()+req.requested_duration_months*30*24*60*60*1000).toISOString().split('T')[0];await supabase.from('center_licenses').insert({center_id:req.center_id,pack_id:req.pack_id,license_type:'bundle',start_date:s,end_date:e,max_learners:req.requested_max_learners,status:'active',created_by:profile.id});}
          await supabase.from('license_requests').update({status:ok?'approved':'rejected',processed_by:profile.id,processed_at:new Date().toISOString()}).eq('id',req.id);
          await load();
        }catch(err){alert('Erreur: '+err.message);}
        setSaving(false);
      };
      
      if(loading)return<Loading/>;
      
      return<div>
        <div className="flex items-center justify-between mb-6">
          <div><h1 className="text-2xl font-bold">Licences</h1><p className="text-sm text-gray-400">{isSuperAdmin?'Gestion des licences':'Vos licences'}</p></div>
          {isSuperAdmin?<Button icon="Plus" onClick={()=>openLicenseModal()}>Attribuer</Button>:<Button icon="Send" onClick={()=>setRequestModal(true)}>Demander</Button>}
        </div>
        
        {isSuperAdmin?<>
          <Tabs tabs={[{id:'licenses',label:`Licences (${licenses.length})`,icon:'Key'},{id:'requests',label:`Demandes (${requests.filter(r=>r.status==='pending').length})`,icon:'Inbox'}]} active={activeTab} onChange={setActiveTab}/>
          {activeTab==='licenses'&&<Card><table className="w-full"><thead className="bg-gray-750"><tr><th className="text-left p-4">Centre</th><th className="text-left p-4">Pack</th><th className="text-left p-4">Période</th><th className="text-center p-4">Max</th><th className="text-center p-4">Statut</th><th className="text-right p-4"></th></tr></thead><tbody className="divide-y divide-gray-700">{licenses.map(l=>{const st=getStatus(l);return<tr key={l.id}><td className="p-4">{l.centers?.name}</td><td className="p-4">{l.content_packs?.name||<span className="text-purple-400">Catalogue</span>}</td><td className="p-4 text-sm">{new Date(l.start_date).toLocaleDateString()} → {new Date(l.end_date).toLocaleDateString()}</td><td className="p-4 text-center">{l.max_learners||'∞'}</td><td className="p-4 text-center"><span className={`px-2 py-1 rounded text-xs bg-${st.color}-500/20 text-${st.color}-400`}>{st.label}</span></td><td className="p-4 text-right"><Button size="sm" variant="ghost" icon="Edit2" onClick={()=>openLicenseModal(l)}/><Button size="sm" variant="ghost" icon={l.status==='active'?'Pause':'Play'} onClick={()=>toggleStatus(l)}/><Button size="sm" variant="ghost" icon="Trash2" className="text-red-400" onClick={()=>deleteLicense(l.id)}/></td></tr>;})}</tbody></table></Card>}
          {activeTab==='requests'&&<Card>{requests.filter(r=>r.status==='pending').length===0?<Empty icon="Inbox" title="Aucune demande"/>:<div className="divide-y divide-gray-700">{requests.filter(r=>r.status==='pending').map(r=><div key={r.id} className="p-4 flex items-center gap-4"><div className="flex-1"><p className="font-medium">{r.centers?.name}</p><p className="text-sm text-gray-400">{r.content_packs?.name} • {r.requested_duration_months}m • {r.requested_max_learners||'∞'}</p></div><Button size="sm" variant="secondary" onClick={()=>processRequest(r,false)}>Refuser</Button><Button size="sm" onClick={()=>processRequest(r,true)}>Approuver</Button></div>)}</div>}</Card>}
        </>:<>
          <Tabs tabs={[{id:'my-licenses',label:`Mes licences (${licenses.length})`,icon:'Key'},{id:'my-requests',label:`Demandes (${requests.length})`,icon:'Send'}]} active={activeTab} onChange={setActiveTab}/>
          {activeTab==='my-licenses'&&(licenses.length===0?<Empty icon="Key" title="Aucune licence"/>:<div className="grid grid-cols-2 gap-4">{licenses.map(l=>{const st=getStatus(l);return<Card key={l.id} className="p-4"><div className="flex justify-between mb-2"><h3 className="font-semibold">{l.content_packs?.name||'Catalogue'}</h3><span className={`px-2 py-1 rounded text-xs bg-${st.color}-500/20 text-${st.color}-400`}>{st.label}</span></div><p className="text-sm text-gray-500">📅 {new Date(l.start_date).toLocaleDateString()} → {new Date(l.end_date).toLocaleDateString()}</p><p className="text-sm text-gray-500">👥 {l.max_learners?`Max ${l.max_learners}`:'Illimité'}</p></Card>;})}</div>)}
          {activeTab==='my-requests'&&(requests.length===0?<Empty icon="Send" title="Aucune demande"/>:<Card><div className="divide-y divide-gray-700">{requests.map(r=><div key={r.id} className="p-4 flex justify-between"><div><p className="font-medium">{r.content_packs?.name}</p><p className="text-xs text-gray-500">{new Date(r.created_at).toLocaleDateString()}</p></div><span className={`px-2 py-1 rounded text-xs ${r.status==='pending'?'bg-yellow-500/20 text-yellow-400':r.status==='approved'?'bg-green-500/20 text-green-400':'bg-red-500/20 text-red-400'}`}>{r.status==='pending'?'En attente':r.status==='approved'?'Approuvé':'Refusé'}</span></div>)}</div></Card>)}
        </>}
        
        <Modal isOpen={licenseModal} onClose={()=>setLicenseModal(false)} title={editingLicense?'Modifier':'Attribuer'} size="md">
          <div className="space-y-4">
            <Select label="Centre *" value={licenseForm.center_id} onChange={e=>setLicenseForm({...licenseForm,center_id:e.target.value})} options={[{value:'',label:'Sélectionner...'},...centers.map(c=>({value:c.id,label:c.name}))]}/>
            <Select label="Pack" value={licenseForm.pack_id} onChange={e=>setLicenseForm({...licenseForm,pack_id:e.target.value})} options={[{value:'',label:'Catalogue complet'},...packs.filter(p=>p.pack_type!=='full_catalog').map(p=>({value:p.id,label:p.name}))]}/>

    // Permissions Page
    function PermissionsPage(){
      const{can}=useAuth();
      const[roles,setRoles]=useState([]);
      const[loading,setLoading]=useState(true);
      const[saving,setSaving]=useState(false);

      const load=useCallback(async()=>{
        try{
          const{data,error}=await supabase.from('role_permissions').select('*').order('role');
          
          // Liste des rôles attendus (sans super_admin)
          const expectedRoles=['center_admin','trainer','learner'];
          const existingRoles=(data||[]).map(r=>r.role);
          
          // Créer les rôles manquants
          const missingRoles=expectedRoles.filter(r=>!existingRoles.includes(r));
          if(missingRoles.length>0){
            for(const role of missingRoles){
              await supabase.from('role_permissions').insert({
                role:role,
                permissions:DEFAULT_PERMISSIONS[role]||{}
              });
            }
          }
          
          // Recharger après insertion
          if(missingRoles.length>0){
            const{data:updated}=await supabase.from('role_permissions').select('*').order('role');
            setRoles(updated||[]);
          }else{
            setRoles(data||[]);
          }
        }catch(err){
          console.error('Erreur chargement permissions:',err);
          // Fallback: utiliser les défauts localement
          setRoles([
            {role:'center_admin',permissions:DEFAULT_PERMISSIONS.center_admin},
            {role:'trainer',permissions:DEFAULT_PERMISSIONS.trainer},
            {role:'learner',permissions:DEFAULT_PERMISSIONS.learner}
          ]);
        }
        setLoading(false);
      },[]);
      useEffect(()=>{load();},[load]);

      const togglePermission=async(role,permission)=>{
        setSaving(true);
        const roleData=roles.find(r=>r.role===role);
        if(!roleData){setSaving(false);return;}
        const newPermissions={...(roleData.permissions||{}),[permission]:!(roleData.permissions||{})[permission]};
        try{
          await supabase.from('role_permissions').update({permissions:newPermissions}).eq('role',role);
          setRoles(roles.map(r=>r.role===role?{...r,permissions:newPermissions}:r));
        }catch(err){
          console.error('Erreur toggle:',err);
          alert('Erreur: '+err.message);
        }
        setSaving(false);
      };
      
      const resetToDefaults=async(role)=>{
        if(!confirm(`Réinitialiser les permissions de ${ROLE_LABELS[role]} aux valeurs par défaut ?`))return;
        setSaving(true);
        const defaultPerms=DEFAULT_PERMISSIONS[role]||{};
        try{
          await supabase.from('role_permissions').update({permissions:defaultPerms}).eq('role',role);
          setRoles(roles.map(r=>r.role===role?{...r,permissions:defaultPerms}:r));
        }catch(err){
          console.error('Erreur reset:',err);
        }
        setSaving(false);
      };

      if(!can('manage_permissions'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      // Toujours afficher les 3 rôles, même si pas en base
      const displayRoles=['center_admin','trainer','learner'].map(role=>{
        const found=roles.find(r=>r.role===role);
        return found||{role,permissions:DEFAULT_PERMISSIONS[role]||{}};
      });

      return<div>
        <div className="flex items-center justify-between mb-6">
          <h1 className="text-2xl font-bold">Gestion des permissions</h1>
          <div className="flex gap-2">
            {displayRoles.map(r=>(
              <Button key={r.role} size="sm" variant="ghost" onClick={()=>resetToDefaults(r.role)}>
                Réinit. {ROLE_LABELS[r.role]}
              </Button>
            ))}
          </div>
        </div>
        
        <Card>
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead className="bg-gray-750 sticky top-0">
                <tr>
                  <th className="text-left p-4 font-medium text-gray-400 w-1/2">Permission</th>
                  {displayRoles.map(r=><th key={r.role} className="text-center p-4 font-medium"><RoleBadge role={r.role}/></th>)}
                </tr>
              </thead>
              <tbody>
                {Object.entries(PERMISSION_GROUPS).map(([groupKey,group])=>(
                  <React.Fragment key={groupKey}>
                    <tr className="bg-gray-800/50">
                      <td colSpan={displayRoles.length+1} className="p-3 font-semibold text-gray-300">{group.label}</td>
                    </tr>
                    {Object.entries(group.permissions).map(([perm,label])=>(
                      <tr key={perm} className="border-b border-gray-700/50 hover:bg-gray-700/30">
                        <td className="p-3 pl-6 text-sm">{label}</td>
                        {displayRoles.map(r=>(
                          <td key={r.role} className="p-3 text-center">
                            <input 
                              type="checkbox" 
                              checked={r.permissions?.[perm]||false} 
                              onChange={()=>togglePermission(r.role,perm)}
                              disabled={saving}
                              className="w-5 h-5 rounded bg-gray-700 border-gray-600 text-indigo-600 focus:ring-indigo-500 cursor-pointer disabled:opacity-50"
                            />
                          </td>
                        ))}
                      </tr>
                    ))}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          </div>
        </Card>
        
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
          <Alert type="info">
            <p className="font-medium mb-1">Super Admin</p>
            <p className="text-sm">Accès total à toutes les fonctionnalités, tous centres confondus.</p>
          </Alert>
          <Alert type="warning">
            <p className="font-medium mb-1">Admin Centre</p>
            <p className="text-sm">Limité à son propre centre. Peut créer apprenants et formateurs.</p>
          </Alert>
          <Alert type="success">
            <p className="font-medium mb-1">Formateur</p>
            <p className="text-sm">Accès en lecture aux contenus. Peut gérer ses cours assignés (Phase 2).</p>
          </Alert>
        </div>
      </div>;
    }

    // Lecteur SCORM avec API SCORM 1.2 et 2004
    function ScormPlayer({module,enrollmentId,onComplete,onClose}){
      const{user}=useAuth();
      const iframeRef=useRef(null);
      const[loading,setLoading]=useState(true);
      const[error,setError]=useState(null);
      const[status,setStatus]=useState('not attempted');
      const[score,setScore]=useState(null);
      const[initialDataLoaded,setInitialDataLoaded]=useState(false);
      const[savedCmiData,setSavedCmiData]=useState(null);
      
      // Exposer lms_origin sur window pour que layer2.js puisse le trouver
      useEffect(() => {
        const origin = window.location.origin;
        window.lms_origin = origin;
        window.LMS_ORIGIN = origin;
        console.log('Exposed lms_origin on window:', origin);
        
        return () => {
          // Cleanup optionnel
        };
      }, []);
      
      // Charger les données existantes AVANT d'initialiser l'API
      useEffect(()=>{
        const loadProgress=async()=>{
          console.log('SCORM: Loading existing progress for module', module.id, 'learner', user.id);
          // La contrainte unique est sur (module_id, learner_id)
          const{data,error}=await supabase.from('scorm_progress')
            .select('*')
            .eq('module_id',module.id)
            .eq('learner_id',user.id)
            .maybeSingle();
          
          if(error){
            console.error('SCORM: Error loading progress', error);
          }
          
          if(data){
            console.log('SCORM: Found existing progress', data);
            setSavedCmiData(data.cmi_data||{});
            setStatus(data.completion_status||'unknown');
            setScore(data.score_scaled);
          }else{
            console.log('SCORM: No existing progress found');
            setSavedCmiData({});
          }
          setInitialDataLoaded(true);
        };
        loadProgress();
      },[module.id,user.id]);
      
      // Initialiser l'API SCORM seulement après le chargement des données
      useEffect(()=>{
        if(!initialDataLoaded)return;
        
        console.log('SCORM: Initializing API with saved data', savedCmiData);
        
        // Créer l'API SCORM 1.2

          LMSInitialize:function(param){

          LMSCommit:function(param){
            console.log('SCORM 1.2: LMSCommit');
            // Sauvegarder dans Supabase
            const saveData=async()=>{
              try{
                const lessonStatus=SCORM12_API._data['cmi.core.lesson_status']||'not attempted';
                const scoreRaw=SCORM12_API._data['cmi.core.score.raw'];

                  .select('id')

                  .maybeSingle();
                
                if(selectError){
                  console.error('SCORM Select Error:', selectError);
                }
                
                const payload={
                  module_id:module.id,
                  learner_id:user.id,
                  enrollment_id:enrollmentId,
                  completion_status:lessonStatus,

                };
                
                let result;
                if(existing?.id){
                  console.log('SCORM: Updating existing record', existing.id);
                  result=await supabase.from('scorm_progress').update(payload).eq('id',existing.id);
                }else{
                  console.log('SCORM: Inserting new record');
                  result=await supabase.from('scorm_progress').insert(payload);
                }
                
                if(result.error){
                  console.error('SCORM Save Error:', result.error);
                }else{
                  console.log('SCORM Saved successfully');
                }
                
                if(lessonStatus==='completed'||lessonStatus==='passed'){
                  if(onComplete)onComplete();
                }
              }catch(err){
                console.error('SCORM Save Exception:', err);
              }
            };
            saveData();
            return 'true';
          },
          
          LMSGetLastError:function(){return this._lastError;},
          LMSGetErrorString:function(code){
            const errors={'0':'No Error','101':'General Exception','201':'Invalid argument error','301':'Not initialized','401':'Not implemented error'};
            return errors[code]||'Unknown Error';
          },
          LMSGetDiagnostic:function(code){return this.LMSGetErrorString(code);}
        };
        
        // Créer l'API SCORM 2004
        const SCORM2004_API={
          _initialized:false,
          _terminated:false,
          _lastError:'0',
          _data:{
            'cmi.learner_id':user.id,
            'cmi.learner_name':user.email||'Apprenant',

            'cmi.entry':savedCmiData?.['cmi.suspend_data']?'resume':'ab-initio',
            ...savedCmiData
          },
          
          Initialize:function(param){
            console.log('SCORM 2004: Initialize');
            if(this._initialized){this._lastError='103';return 'false';}
            this._initialized=true;
            this._lastError='0';
            setLoading(false);
            return 'true';
          },
          
          Terminate:function(param){
            console.log('SCORM 2004: Terminate');
            if(!this._initialized||this._terminated){this._lastError='113';return 'false';}
            this._terminated=true;
            this.Commit('');
            return 'true';
          },
          
          GetValue:function(element){
            console.log('SCORM 2004: GetValue',element);
            if(!this._initialized){this._lastError='122';return '';}
            this._lastError='0';
            return this._data[element]||'';
          },
          
          SetValue:function(element,value){
            console.log('SCORM 2004: SetValue',element,value);
            if(!this._initialized){this._lastError='132';return 'false';}
            this._data[element]=value;
            this._lastError='0';
            
            if(element==='cmi.completion_status'){setStatus(value);}
            if(element==='cmi.score.scaled'){setScore(parseFloat(value));}
            return 'true';
          },
          
          Commit:function(param){
            console.log('SCORM 2004: Commit');
            const saveData=async()=>{
              try{
                const completionStatus=SCORM2004_API._data['cmi.completion_status']||'unknown';
                const successStatus=SCORM2004_API._data['cmi.success_status']||'unknown';
                const scoreScaled=SCORM2004_API._data['cmi.score.scaled']?parseFloat(SCORM2004_API._data['cmi.score.scaled']):null;

                const location=SCORM2004_API._data['cmi.location']||null;

                console.log('SCORM 2004 Saving:', {moduleId:module.id, completionStatus, scoreScaled, learnerId:user.id});
                
                // La contrainte unique est sur (module_id, learner_id)
                const{data:existing,error:selectError}=await supabase.from('scorm_progress')
                  .select('id')
                  .eq('module_id',module.id)
                  .eq('learner_id',user.id)
                  .maybeSingle();
                
                if(selectError){
                  console.error('SCORM 2004 Select Error:', selectError);
                }
                
                const payload={
                  module_id:module.id,

                  completion_status:completionStatus,

                  score_max:SCORM2004_API._data['cmi.score.max']?parseFloat(SCORM2004_API._data['cmi.score.max']):null,
                  session_time:sessionTime,
                  total_time:totalTime,
                  location:location,
                  suspend_data:suspendData,
                  cmi_data:SCORM2004_API._data,
                  last_accessed_at:new Date().toISOString()
                };
                
                let result;
                if(existing?.id){
                  console.log('SCORM 2004: Updating existing record', existing.id);
                  result=await supabase.from('scorm_progress').update(payload).eq('id',existing.id);
                }else{
                  console.log('SCORM 2004: Inserting new record');
                  result=await supabase.from('scorm_progress').insert(payload);
                }
                
                if(result.error){
                  console.error('SCORM 2004 Save Error:', result.error);

                if(completionStatus==='completed'||successStatus==='passed'){

                console.error('SCORM 2004 Save Exception:', err);
              }
            };
            saveData();
            return 'true';
          },
          
          GetLastError:function(){return this._lastError;},
          GetErrorString:function(code){
            const errors={'0':'No Error','103':'Already Initialized','113':'Termination After Termination','122':'Retrieve Data Before Initialization','132':'Store Data Before Initialization'};
            return errors[code]||'Unknown Error';
          },
          GetDiagnostic:function(code){return this.GetErrorString(code);}
        };
        
        // Exposer les APIs globalement
        window.API=SCORM12_API;
        window.API_1484_11=SCORM2004_API;
        
        return()=>{
          // Cleanup
          delete window.API;
          delete window.API_1484_11;
        };
      },[module.id,enrollmentId,user.id,initialDataLoaded,savedCmiData,onComplete]);
      
      // L'URL du module SCORM via le loader hébergé sur GitHub Pages

        // Le loader est hébergé sur le même domaine
        // On ne passe PAS lms_origin dans l'URL pour éviter les doublons

        const loaderUrl = window.location.origin + '/scorm-loader.html?url=' + 
          encodeURIComponent(module.package_url);
        
        console.log('SCORM Loader URL:', loaderUrl);
        return loaderUrl;
      }, [module.package_url]);
      
      console.log('SCORM Player:', { scormUrl, module });
      
      const statusLabels={'not attempted':'Non commencé','incomplete':'En cours','completed':'Terminé','passed':'Réussi','failed':'Échoué'};
      const statusColors={'not attempted':'bg-gray-500','incomplete':'bg-yellow-500','completed':'bg-green-500','passed':'bg-green-500','failed':'bg-red-500'};
      
      // Fonction pour basculer en plein écran
      const toggleFullscreen=()=>{
        const container=iframeRef.current?.parentElement?.parentElement;
        if(!container)return;
        
        if(!document.fullscreenElement){
          // Entrer en plein écran
          if(container.requestFullscreen){
            container.requestFullscreen();
          }else if(container.webkitRequestFullscreen){
            container.webkitRequestFullscreen();
          }else if(container.mozRequestFullScreen){
            container.mozRequestFullScreen();
          }else if(container.msRequestFullscreen){
            container.msRequestFullscreen();
          }
        }else{
          // Sortir du plein écran
          if(document.exitFullscreen){
            document.exitFullscreen();
          }else if(document.webkitExitFullscreen){
            document.webkitExitFullscreen();
          }else if(document.mozCancelFullScreen){
            document.mozCancelFullScreen();
          }else if(document.msExitFullscreen){
            document.msExitFullscreen();
          }

              </div>

              <button onClick={toggleFullscreen} className="p-2 hover:bg-gray-700 rounded-lg" title="Plein écran">

              </button>

          {/* Contenu SCORM */}
          <div className="flex-1 relative">
