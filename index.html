      const answerImageRef=useRef(null);
      const[answerImageIdx,setAnswerImageIdx]=useState(null);
      const[showPreview,setShowPreview]=useState(false);
      
      const questionTypes=[
        {value:'single',label:'Choix unique',icon:'CheckCircle',color:'text-blue-400'},
        {value:'multiple',label:'Choix multiple',icon:'CheckSquare',color:'text-indigo-400'},
        {value:'true_false',label:'Vrai/Faux',icon:'ToggleLeft',color:'text-green-400'},
        {value:'fill_blank',label:'Texte à trous',icon:'Edit3',color:'text-yellow-400'},
        {value:'ordering',label:'Ordonnancement',icon:'List',color:'text-purple-400'},
        {value:'matching',label:'Appariement',icon:'GitMerge',color:'text-pink-400'},
        {value:'short_answer',label:'Réponse courte',icon:'MessageSquare',color:'text-cyan-400'},
        {value:'essay',label:'Rédaction',icon:'FileText',color:'text-orange-400'}
      ];
      
      const load=useCallback(async()=>{
        const[{data:q},{data:tags}]=await Promise.all([
          supabase.from('question_bank').select('*,question_bank_answers(*),content_categories(id,name,color),content_themes(id,name),content_sub_themes(id,name)').order('created_at',{ascending:false}),
          supabase.from('content_tags').select('*').order('name')
        ]);
        setQuestions(q||[]);
        setPredefinedTags(tags||[]);
        setLoading(false);
      },[]);
      
      useEffect(()=>{load();},[load]);
      
      const getTypeName=(type)=>questionTypes.find(t=>t.value===type)?.label||type;
      const getTypeColor=(type)=>questionTypes.find(t=>t.value===type)?.color||'text-gray-400';
      
      // ===== MEDIA UPLOAD =====
      const detectMediaType=(file)=>{
        if(!file)return 'file';
        if(file.type.startsWith('image/'))return 'image';
        if(file.type.startsWith('video/'))return 'video';
        if(file.type.startsWith('audio/'))return 'audio';
        return 'file';
      };
      
      const detectUrlMediaType=(url)=>{
        if(!url)return 'file';
        const lower=url.toLowerCase();
        if(lower.match(/\.(jpg|jpeg|png|gif|webp|svg|bmp)(\?|$)/))return 'image';
        if(lower.match(/\.(mp4|webm|ogg|mov|avi)(\?|$)/))return 'video';
        if(lower.match(/\.(mp3|wav|ogg|aac|m4a|flac)(\?|$)/))return 'audio';
        if(lower.includes('vimeo.com')||lower.includes('youtube.com')||lower.includes('youtu.be'))return 'video';
        return 'image';
      };
      
      const uploadMediaFile=async(file,target)=>{
        setUploading(true);
        try{
          const ext=file.name.split('.').pop();
          const path=`question-media/${Date.now()}_${Math.random().toString(36).substr(2,9)}.${ext}`;
          const{error}=await supabase.storage.from('video-resources').upload(path,file);
          if(error){
            // Fallback : essayer le bucket public
            const{error:err2}=await supabase.storage.from('public').upload(path,file);
            if(err2){alert('Erreur upload : '+err2.message);setUploading(false);return;}
            const{data:{publicUrl}}=supabase.storage.from('public').getPublicUrl(path);
            addMediaToTarget(target,{type:detectMediaType(file),url:publicUrl,name:file.name});
          }else{
            const{data:{publicUrl}}=supabase.storage.from('video-resources').getPublicUrl(path);
            addMediaToTarget(target,{type:detectMediaType(file),url:publicUrl,name:file.name});
          }
        }catch(e){
          console.error('Upload error:',e);
          alert('Erreur lors de l\'upload');
        }
        setUploading(false);
      };
      
      const addMediaToTarget=(target,mediaItem)=>{
        if(target==='question'){
          setForm(f=>({...f,media:[...f.media,mediaItem]}));
        }else if(target==='correction'){
          setForm(f=>({...f,correction_media:[...f.correction_media,mediaItem]}));
        }
      };
      
      const removeMedia=(target,idx)=>{
        if(target==='question'){
          setForm(f=>({...f,media:f.media.filter((_,i)=>i!==idx)}));
        }else{
          setForm(f=>({...f,correction_media:f.correction_media.filter((_,i)=>i!==idx)}));
        }
      };
      
      const addMediaUrl=(target,url)=>{
        if(!url)return;
        const type=detectUrlMediaType(url);
        addMediaToTarget(target,{type,url,name:url.split('/').pop()});
      };
      
      // Upload image pour une réponse
      const uploadAnswerImage=async(file,idx)=>{
        setUploading(true);
        try{
          const ext=file.name.split('.').pop();
          const path=`question-media/answer_${Date.now()}.${ext}`;
          const{error}=await supabase.storage.from('video-resources').upload(path,file);
          if(!error){
            const{data:{publicUrl}}=supabase.storage.from('video-resources').getPublicUrl(path);
            updateAnswer(idx,'image_url',publicUrl);
          }
        }catch(e){console.error(e);}
        setUploading(false);
      };
      
      // ===== RENDER MEDIA PREVIEW =====
      const renderMediaPreview=(item,size='md')=>{
        const sizeClass=size==='sm'?'w-16 h-16':size==='lg'?'w-full max-h-64':'w-24 h-24';
        if(item.type==='image')return<img src={item.url} alt={item.name||''} className={`${sizeClass} rounded-lg object-cover cursor-pointer`} onClick={()=>setPreviewMedia(item)}/>;
        if(item.type==='video'){
          // Detect Vimeo/YouTube
          const vimeoMatch=item.url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
          const ytMatch=item.url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/);
          if(vimeoMatch)return<div className={`${sizeClass} relative rounded-lg overflow-hidden bg-gray-900`}><iframe src={`https://player.vimeo.com/video/${vimeoMatch[1]}?background=1`} className="w-full h-full" allow="autoplay"/><div className="absolute inset-0 flex items-center justify-center pointer-events-none"><Icon name="Play" size={24} className="text-white/70"/></div></div>;
          if(ytMatch)return<div className={`${sizeClass} relative rounded-lg overflow-hidden bg-gray-900`}><img src={`https://img.youtube.com/vi/${ytMatch[1]}/mqdefault.jpg`} className="w-full h-full object-cover"/><div className="absolute inset-0 flex items-center justify-center pointer-events-none"><Icon name="Play" size={24} className="text-white/70"/></div></div>;
          return<div className={`${sizeClass} bg-gray-800 rounded-lg flex items-center justify-center cursor-pointer`} onClick={()=>setPreviewMedia(item)}><Icon name="Video" size={24} className="text-purple-400"/></div>;
        }
        if(item.type==='audio')return<div className={`${size==='sm'?'w-16':'w-full'} bg-gray-800 rounded-lg p-2`}><audio controls src={item.url} className="w-full h-8" style={{minWidth:'120px'}}/></div>;
        return<div className={`${sizeClass} bg-gray-800 rounded-lg flex items-center justify-center`}><Icon name="File" size={20} className="text-gray-400"/></div>;
      };
      
      // ===== MEDIA ZONE COMPONENT =====
      const MediaZone=({target,mediaList,label,fileRef})=>{
        const[urlInput,setUrlInput]=useState('');
        return<div className="bg-gray-800/50 border border-gray-700 rounded-lg p-4">
          <div className="flex items-center justify-between mb-3">
            <label className="text-sm font-medium text-gray-300 flex items-center gap-2">
              <Icon name={target==='question'?'Image':'BookOpen'} size={16}/>
              {label}
            </label>
            <div className="flex gap-2">
              <input ref={fileRef} type="file" accept="image/*,video/*,audio/*" className="hidden" onChange={e=>{if(e.target.files[0])uploadMediaFile(e.target.files[0],target);}}/>
              <Button variant="ghost" size="sm" icon="Upload" onClick={()=>fileRef.current?.click()} loading={uploading}>Upload</Button>
            </div>
          </div>
          
          {/* Médias existants */}
          {mediaList.length>0&&(
            <div className="flex flex-wrap gap-3 mb-3">
              {mediaList.map((m,i)=>(
                <div key={i} className="relative group">
                  {renderMediaPreview(m)}
                  <button onClick={()=>removeMedia(target,i)} className="absolute -top-2 -right-2 w-5 h-5 bg-red-500 rounded-full flex items-center justify-center text-white text-xs opacity-0 group-hover:opacity-100 transition-opacity">×</button>
                  <p className="text-xs text-gray-500 mt-1 truncate max-w-[96px]">{m.name}</p>
                </div>
              ))}
            </div>
          )}
          
          {/* Ajout par URL */}
          <div className="flex gap-2">
            <Input className="flex-1" value={urlInput} onChange={e=>setUrlInput(e.target.value)} placeholder="Ou coller une URL (image, vidéo Vimeo/YouTube, audio)..." icon="Link"/>
            <Button variant="ghost" size="sm" icon="Plus" onClick={()=>{if(urlInput.trim()){addMediaUrl(target,urlInput.trim());setUrlInput('');}}} disabled={!urlInput.trim()}>Ajouter</Button>
          </div>
          
          {mediaList.length===0&&<p className="text-xs text-gray-500 mt-2">Glissez ou uploadez des images, vidéos, fichiers audio • ou collez une URL</p>}
        </div>;
      };
      
      // ===== IMPORT/EXPORT EXCEL =====
      const downloadTemplate=()=>{
        const template=[{
          'Question':'Quelle est la capitale de la France ?',
          'Type':'single',
          'Catégorie':'Géographie','Thème':'Europe','Sous-thème':'Capitales',
          'Difficulté':'easy','Points':'1','Temps (sec)':'30',
          'Réponse 1':'Paris','Correct 1':'TRUE',
          'Réponse 2':'Lyon','Correct 2':'FALSE',
          'Réponse 3':'Marseille','Correct 3':'FALSE',
          'Réponse 4':'','Correct 4':'',
          'Feedback correct':'Bravo !','Feedback incorrect':'La bonne réponse était Paris.',
          'Image URL':'','Tags':'géo, culture'
        }];
        const ws=XLSX.utils.json_to_sheet(template);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Questions');
        const notice=[['=== NOTICE ==='],[''],['Types: single, multiple, true_false, fill_blank, ordering, matching, short_answer, essay'],['Difficultés: easy, medium, hard'],['Correct: TRUE ou FALSE'],['Temps: secondes (0=illimité)'],['Tags: séparés par virgules']];
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(notice),'Notice');
        XLSX.writeFile(wb,'template_questions_crpro.xlsx');
      };
      
      const exportToExcel=()=>{
        const data=questions.map(q=>{
          const answers=q.question_bank_answers||[];
          return{'Question':q.question_text||'','Type':q.question_type||'single','Catégorie':getCategoryName(q.category_id),'Thème':getThemeName(q.theme_id),'Sous-thème':getSubThemeName(q.sub_theme_id),'Difficulté':q.difficulty||'medium','Points':q.points||1,'Temps (sec)':q.time_limit||0,
          'Réponse 1':answers[0]?.answer_text||'','Correct 1':answers[0]?.is_correct?'TRUE':'FALSE',
          'Réponse 2':answers[1]?.answer_text||'','Correct 2':answers[1]?.is_correct?'TRUE':'FALSE',
          'Réponse 3':answers[2]?.answer_text||'','Correct 3':answers[2]?.is_correct?'TRUE':'FALSE',
          'Réponse 4':answers[3]?.answer_text||'','Correct 4':answers[3]?.is_correct?'TRUE':'FALSE',
          'Feedback correct':q.feedback_correct||'','Feedback incorrect':q.feedback_incorrect||'',
          'Médias':JSON.stringify(q.media||[]),'Tags':(q.tags||[]).join(', ')};
        });
        const ws=XLSX.utils.json_to_sheet(data);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Questions');
        XLSX.writeFile(wb,`questions_export_${new Date().toISOString().split('T')[0]}.xlsx`);
      };
      
      const handleImportFile=async(e)=>{
        const file=e.target.files[0];if(!file)return;
        const data=await file.arrayBuffer();
        const wb=XLSX.read(data);
        const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        setImportData(json);setImportModal(true);setImportResult(null);
      };
      
      const processImport=async()=>{
        setImportLoading(true);
        let success=0,errors=0,total=importData.filter(r=>r['Question']||r['question_text']).length;
        setImportResult({success:0,errors:0,total,phase:'import'});
        
        // Phase 1 : Pré-créer toutes les catégories/thèmes/sous-thèmes manquants
        const catCache={};const themeCache={};const subThemeCache={};
        for(const row of importData){
          const catName=row['Catégorie']||'';const themeName=row['Thème']||'';const subThemeName=row['Sous-thème']||'';
          if(catName&&!categories.find(c=>c.name.toLowerCase()===catName.toLowerCase())&&!catCache[catName.toLowerCase()]){
            const{data}=await supabase.from('content_categories').insert({name:catName,position:categories.length}).select().single();
            if(data){catCache[catName.toLowerCase()]=data;categories.push(data);}
          }
          if(themeName&&catName){
            const cat=categories.find(c=>c.name.toLowerCase()===catName.toLowerCase())||catCache[catName.toLowerCase()];
            if(cat&&!themes.find(t=>t.category_id===cat.id&&t.name.toLowerCase()===themeName.toLowerCase())&&!themeCache[`${cat.id}_${themeName.toLowerCase()}`]){
              const{data}=await supabase.from('content_themes').insert({name:themeName,category_id:cat.id,position:themes.length}).select().single();
              if(data){themeCache[`${cat.id}_${themeName.toLowerCase()}`]=data;themes.push(data);}
            }
          }
          if(subThemeName&&themeName&&catName){
            const cat=categories.find(c=>c.name.toLowerCase()===catName.toLowerCase())||catCache[catName.toLowerCase()];
            const theme=cat?(themes.find(t=>t.category_id===cat.id&&t.name.toLowerCase()===themeName.toLowerCase())||themeCache[`${cat.id}_${themeName.toLowerCase()}`]):null;
            if(theme&&!subThemes.find(st=>st.theme_id===theme.id&&st.name.toLowerCase()===subThemeName.toLowerCase())&&!subThemeCache[`${theme.id}_${subThemeName.toLowerCase()}`]){
              const{data}=await supabase.from('content_sub_themes').insert({name:subThemeName,theme_id:theme.id,position:subThemes.length}).select().single();
              if(data){subThemeCache[`${theme.id}_${subThemeName.toLowerCase()}`]=data;subThemes.push(data);}
            }
          }
        }
        
        // Phase 2 : Pré-créer les tags manquants dans content_tags
        const allTagNames=new Set();
        for(const row of importData){
          const tagsStr=row['Tags']||'';
          if(tagsStr)tagsStr.split(',').map(t=>t.trim()).filter(Boolean).forEach(t=>allTagNames.add(t));
        }
        const tagMap={};// nom lowercase → tag name
        for(const tagName of allTagNames){
          const existing=predefinedTags.find(t=>t.name.toLowerCase()===tagName.toLowerCase());
          if(existing){tagMap[tagName.toLowerCase()]=existing.name;}
          else{
            const{data}=await supabase.from('content_tags').insert({name:tagName}).select().single();
            if(data){tagMap[tagName.toLowerCase()]=data.name;predefinedTags.push(data);}
            else{tagMap[tagName.toLowerCase()]=tagName;}
          }
        }
        
        // Phase 3 : Import batch des questions (par lots de 50)
        const BATCH_SIZE=50;
        const validRows=importData.filter(r=>r['Question']||r['question_text']);
        
        for(let b=0;b<validRows.length;b+=BATCH_SIZE){
          const batch=validRows.slice(b,b+BATCH_SIZE);
          const questionPayloads=batch.map(row=>{
            const catName=row['Catégorie']||'';const themeName=row['Thème']||'';const subThemeName=row['Sous-thème']||'';
            const cat=categories.find(c=>c.name.toLowerCase()===catName.toLowerCase())||catCache[catName.toLowerCase()];
            const theme=cat?(themes.find(t=>t.category_id===cat.id&&t.name.toLowerCase()===themeName.toLowerCase())||themeCache[`${cat.id}_${themeName.toLowerCase()}`]):null;
            const subTheme=theme?(subThemes.find(st=>st.theme_id===theme.id&&st.name.toLowerCase()===subThemeName.toLowerCase())||subThemeCache[`${theme.id}_${subThemeName.toLowerCase()}`]):null;
            const tagsStr=row['Tags']||'';
            const tags=tagsStr?tagsStr.split(',').map(t=>t.trim()).filter(Boolean).map(t=>tagMap[t.toLowerCase()]||t):[];
            return{
              question_text:row['Question']||row['question_text'],
              question_type:row['Type']||'single',
              category_id:cat?.id||null,theme_id:theme?.id||null,sub_theme_id:subTheme?.id||null,
              difficulty:row['Difficulté']||'medium',
              points:parseInt(row['Points'])||1,
              time_limit:parseInt(row['Temps (sec)'])||0,
              feedback_correct:row['Feedback correct']||null,
              feedback_incorrect:row['Feedback incorrect']||null,
              media:row['Image URL']?[{type:'image',url:row['Image URL'],name:'image'}]:[],
              tags
            };
          });
          
          try{
            const{data:inserted,error}=await supabase.from('question_bank').insert(questionPayloads).select();
            if(error){console.error('Batch insert error:',error);errors+=batch.length;
              setImportResult({success,errors,total,phase:'import'});continue;}
            
            // Insérer les réponses pour chaque question du batch
            const allAnswers=[];
            (inserted||[]).forEach((q,idx)=>{
              const row=batch[idx];
              for(let i=1;i<=4;i++){
                const text=row[`Réponse ${i}`];
                if(text)allAnswers.push({question_id:q.id,answer_text:text,is_correct:String(row[`Correct ${i}`]).toUpperCase()==='TRUE',sort_order:i-1});
              }
            });
            if(allAnswers.length){
              const{error:ae}=await supabase.from('question_bank_answers').insert(allAnswers);
              if(ae)console.error('Answers batch error:',ae);
            }
            success+=inserted?.length||0;
          }catch(err){console.error('Batch error:',err);errors+=batch.length;}
          
          setImportResult({success,errors,total,phase:'import'});
        }
        
        setImportResult({success,errors,total,phase:'done'});
        setImportLoading(false);load();reloadTaxonomy();
      };
      
      // ===== SAVE =====
      const handleSave=async()=>{
        if(!form.question_text)return alert('Texte de la question requis');
        
        // Validations par type
        if(['single','multiple','true_false'].includes(form.question_type)){
          if(form.answers.filter(a=>a.text.trim()).length<2)return alert('Au moins 2 réponses requises');
          if(!form.answers.some(a=>a.is_correct))return alert('Au moins une réponse correcte requise');
        }
        if(form.question_type==='fill_blank'&&form.blank_answers.filter(a=>a.trim()).length===0)return alert('Au moins une réponse attendue pour les trous');
        if(form.question_type==='ordering'&&form.order_items.filter(a=>a.trim()).length<2)return alert('Au moins 2 éléments à ordonner');
        if(form.question_type==='matching'&&form.match_pairs.filter(p=>p.left.trim()&&p.right.trim()).length<2)return alert('Au moins 2 paires à associer');
        
        setSaving(true);
        const payload={
          question_text:form.question_text,
          question_type:form.question_type,
          category_id:form.category_id||null,
          theme_id:form.theme_id||null,
          sub_theme_id:form.sub_theme_id||null,
          difficulty:form.difficulty,
          points:form.points,
          time_limit:form.time_limit||0,
          feedback_correct:form.feedback_correct||null,
          feedback_incorrect:form.feedback_incorrect||null,
          explanation:form.explanation||null,
          // Stocker médias, réponses spécifiques dans un JSON
          media:form.media||[],
          correction_media:form.correction_media||[],
          // Données spécifiques au type
          type_data:JSON.stringify({
            blank_answers:form.blank_answers,
            order_items:form.order_items,
            match_pairs:form.match_pairs,
            accepted_answers:form.accepted_answers,
            word_limit:form.word_limit,
            rubric:form.rubric
          }),
          tags:form.tags||[]
        };
        
        let questionId=editing?.id;
        if(editing){
          await supabase.from('question_bank').update(payload).eq('id',editing.id);
          await supabase.from('question_bank_answers').delete().eq('question_id',editing.id);
        }else{
          const{data}=await supabase.from('question_bank').insert(payload).select().single();
          questionId=data?.id;
        }
        
        if(questionId&&['single','multiple','true_false'].includes(form.question_type)){
          const answers=form.answers.filter(a=>a.text.trim()).map((a,i)=>({question_id:questionId,answer_text:a.text,is_correct:a.is_correct,sort_order:i,image_url:a.image_url||null}));
          await supabase.from('question_bank_answers').insert(answers);
        }
        
        setModal(false);setEditing(null);
        setForm({...defaultForm});
        setSaving(false);load();
      };
      
      const handleDelete=async(id)=>{
        if(!confirm('Supprimer cette question ?'))return;
        await supabase.from('question_bank').delete().eq('id',id);
        load();
      };
      
      const openEdit=(q)=>{
        const typeData=q.type_data?JSON.parse(q.type_data):{};
        setEditing(q);
        setForm({
          question_text:q.question_text||'',
          question_type:q.question_type||'single',
          category_id:q.category_id||'',
          theme_id:q.theme_id||'',
          sub_theme_id:q.sub_theme_id||'',
          difficulty:q.difficulty||'medium',
          points:q.points||1,
          time_limit:q.time_limit||0,
          media:q.media||[],
          answers:(q.question_bank_answers||[]).length>0?(q.question_bank_answers||[]).map(a=>({text:a.answer_text,is_correct:a.is_correct,image_url:a.image_url||''})):[{text:'',is_correct:true,image_url:''},{text:'',is_correct:false,image_url:''}],
          blank_answers:typeData.blank_answers||[''],
          order_items:typeData.order_items||['',''],
          match_pairs:typeData.match_pairs||[{left:'',right:''}],
          accepted_answers:typeData.accepted_answers||[''],
          word_limit:typeData.word_limit||0,
          rubric:typeData.rubric||'',
          feedback_correct:q.feedback_correct||'',
          feedback_incorrect:q.feedback_incorrect||'',
          explanation:q.explanation||'',
          correction_media:q.correction_media||[],
          tags:q.tags||[]
        });
        setModal(true);
        setShowPreview(false);
      };
      
      const addAnswer=()=>setForm({...form,answers:[...form.answers,{text:'',is_correct:false,image_url:''}]});
      const removeAnswer=(idx)=>setForm({...form,answers:form.answers.filter((_,i)=>i!==idx)});
      const updateAnswer=(idx,field,value)=>{
        const answers=[...form.answers];
        answers[idx]={...answers[idx],[field]:value};
        if(field==='is_correct'&&value&&(form.question_type==='single'||form.question_type==='true_false')){
          answers.forEach((a,i)=>{if(i!==idx)a.is_correct=false;});
        }
        setForm({...form,answers});
      };
      
      const filtered=questions.filter(q=>{
        if(filterCategory&&q.category_id!==filterCategory)return false;
        if(filterTheme&&q.theme_id!==filterTheme)return false;
        if(filterSubTheme&&q.sub_theme_id!==filterSubTheme)return false;
        if(filterDifficulty!=='all'&&q.difficulty!==filterDifficulty)return false;
        if(filterType!=='all'&&q.question_type!==filterType)return false;
        if(filterTag&&!(q.tags||[]).some(t=>t.toLowerCase()===filterTag.toLowerCase()))return false;
        if(search){
          const s=search.toLowerCase();
          const inText=q.question_text?.toLowerCase().includes(s);
          const inCat=q.content_categories?.name?.toLowerCase().includes(s);
          const inTheme=q.content_themes?.name?.toLowerCase().includes(s);
          const inSubTheme=q.content_sub_themes?.name?.toLowerCase().includes(s);
          const inTags=(q.tags||[]).some(t=>t.toLowerCase().includes(s));
          const inFeedback=q.feedback_correct?.toLowerCase().includes(s)||q.feedback_incorrect?.toLowerCase().includes(s);
          const inExplanation=q.explanation?.toLowerCase().includes(s);
          if(!inText&&!inCat&&!inTheme&&!inSubTheme&&!inTags&&!inFeedback&&!inExplanation)return false;
        }
        return true;
      });
      
      if(loading)return<div className="flex items-center justify-center py-20"><Icon name="Loader2" size={32} className="animate-spin text-indigo-400"/></div>;
      
      return<div>
        <div className="flex flex-wrap items-center gap-3 mb-6">
          <Button icon="Plus" onClick={()=>{setEditing(null);setForm({...defaultForm});setShowPreview(false);setModal(true);}}>Ajouter une question</Button>
          <Button variant="secondary" icon="Download" onClick={downloadTemplate}>Template</Button>
          <label className="cursor-pointer">
            <span className="inline-flex items-center gap-2 px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium"><Icon name="Upload" size={16}/>Importer</span>
            <input ref={importFileRef} type="file" accept=".xlsx,.xls" className="hidden" onChange={handleImportFile}/>
          </label>
          <Button variant="secondary" icon="FileSpreadsheet" onClick={exportToExcel} disabled={questions.length===0}>Exporter</Button>
          <div className="flex-1"/>
          <Input icon="Search" placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)} className="w-64"/>
        </div>
        
        <div className="flex flex-wrap gap-2 mb-4">
          <Select value={filterCategory} onChange={e=>{setFilterCategory(e.target.value);setFilterTheme('');setFilterSubTheme('');}} options={[{value:'',label:'Toutes catégories'},...categories.map(c=>({value:c.id,label:c.name}))]}/>
          <Select value={filterTheme} onChange={e=>{setFilterTheme(e.target.value);setFilterSubTheme('');}} options={[{value:'',label:'Tous thèmes'},...(filterCategory?getThemesForCategory(filterCategory):themes).map(t=>({value:t.id,label:t.name}))]}/>
          <Select value={filterSubTheme} onChange={e=>setFilterSubTheme(e.target.value)} options={[{value:'',label:'Tous sous-thèmes'},...(filterTheme?getSubThemesForTheme(filterTheme):subThemes).map(st=>({value:st.id,label:st.name}))]}/>
          <Select value={filterDifficulty} onChange={e=>setFilterDifficulty(e.target.value)} options={[{value:'all',label:'Toutes difficultés'},{value:'easy',label:'Facile'},{value:'medium',label:'Moyen'},{value:'hard',label:'Difficile'}]}/>
          <Select value={filterType} onChange={e=>setFilterType(e.target.value)} options={[{value:'all',label:'Tous les types'},...questionTypes.map(t=>({value:t.value,label:t.label}))]}/>
          <Select value={filterTag} onChange={e=>setFilterTag(e.target.value)} options={[{value:'',label:'Tous les tags'},...predefinedTags.map(t=>({value:t.name,label:t.name}))]}/>
          {(filterCategory||filterTheme||filterSubTheme||filterDifficulty!=='all'||filterType!=='all'||filterTag)&&<button onClick={()=>{setFilterCategory('');setFilterTheme('');setFilterSubTheme('');setFilterDifficulty('all');setFilterType('all');setFilterTag('');}} className="px-3 py-1.5 text-xs bg-gray-700 hover:bg-gray-600 rounded-lg text-gray-300 flex items-center gap-1"><Icon name="X" size={14}/>Réinitialiser</button>}
        </div>
        
        <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-cyan-400">{questions.length}</p><p className="text-xs text-gray-400">Questions</p></Card>
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-green-400">{questions.filter(q=>q.difficulty==='easy').length}</p><p className="text-xs text-gray-400">Faciles</p></Card>
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-yellow-400">{questions.filter(q=>q.difficulty==='medium').length}</p><p className="text-xs text-gray-400">Moyennes</p></Card>
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-red-400">{questions.filter(q=>q.difficulty==='hard').length}</p><p className="text-xs text-gray-400">Difficiles</p></Card>
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-purple-400">{questions.filter(q=>(q.media||[]).length>0).length}</p><p className="text-xs text-gray-400">Avec média</p></Card>
        </div>
        
        {/* Liste des questions */}
        {filtered.length===0?<Empty icon="Database" title="Aucune question" desc="Ajoutez votre première question à la banque"/>:(
          <div className="space-y-3">
            {filtered.slice(0,50).map(q=>{
              const hasMedia=(q.media||[]).length>0;
              return(
              <Card key={q.id} className="p-4">
                <div className="flex items-start gap-4">
                  {/* Média preview dans la liste */}
                  {hasMedia?(
                    <div className="flex gap-1 shrink-0">
                      {(q.media||[]).slice(0,2).map((m,i)=>(
                        <div key={i}>{renderMediaPreview(m,'sm')}</div>
                      ))}
                      {(q.media||[]).length>2&&<div className="w-16 h-16 bg-gray-800 rounded-lg flex items-center justify-center text-xs text-gray-400">+{q.media.length-2}</div>}
                    </div>
                  ):(
                    <div className={`w-10 h-10 rounded-lg flex items-center justify-center shrink-0 ${q.difficulty==='easy'?'bg-green-500/20 text-green-400':q.difficulty==='hard'?'bg-red-500/20 text-red-400':'bg-yellow-500/20 text-yellow-400'}`}>
                      <Icon name="HelpCircle" size={20}/>
                    </div>
                  )}
                  <div className="flex-1 min-w-0">
                    <p className="font-medium">{q.question_text}</p>
                    <div className="flex flex-wrap gap-2 mt-2">
                      <span className={`px-2 py-0.5 bg-gray-700 rounded text-xs ${getTypeColor(q.question_type)}`}>{getTypeName(q.question_type)}</span>
                      {q.content_categories?.name&&<span className="px-2 py-0.5 rounded text-xs" style={{backgroundColor:(q.content_categories?.color||'#6366f1')+'30',color:q.content_categories?.color||'#6366f1'}}>{q.content_categories.name}</span>}
                      {q.content_themes?.name&&<span className="px-2 py-0.5 bg-purple-500/20 text-purple-300 rounded text-xs">{q.content_themes.name}</span>}
                      {q.content_sub_themes?.name&&<span className="px-2 py-0.5 bg-cyan-500/20 text-cyan-300 rounded text-xs">{q.content_sub_themes.name}</span>}
                      <span className="px-2 py-0.5 bg-gray-600 rounded text-xs">{q.points} pt{q.points>1?'s':''}</span>
                      {q.time_limit>0&&<span className="px-2 py-0.5 bg-orange-500/20 text-orange-300 rounded text-xs">⏱ {q.time_limit}s</span>}
                      {hasMedia&&<span className="px-2 py-0.5 bg-purple-500/20 text-purple-300 rounded text-xs">📎 {q.media.length} média{q.media.length>1?'s':''}</span>}
                    </div>
                    {q.tags&&q.tags.length>0&&<div className="flex flex-wrap gap-1 mt-1">{q.tags.slice(0,4).map(t=><span key={t} className="px-1.5 py-0.5 bg-gray-700 rounded text-xs text-gray-300">{t}</span>)}{q.tags.length>4&&<span className="text-xs text-gray-400">+{q.tags.length-4}</span>}</div>}
                    {['single','multiple','true_false'].includes(q.question_type)&&(
                      <div className="flex flex-wrap gap-1 mt-2">
                        {(q.question_bank_answers||[]).map((a,i)=>(
                          <span key={i} className={`px-2 py-0.5 rounded text-xs ${a.is_correct?'bg-green-500/20 text-green-400':'bg-gray-700 text-gray-400'}`}>{a.answer_text}</span>
                        ))}
                      </div>
                    )}
                  </div>
                  <div className="flex gap-2">
                    <Button variant="ghost" size="sm" icon="Edit2" onClick={()=>openEdit(q)}/>
                    <Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(q.id)}/>
                  </div>
                </div>
              </Card>);
            })}
            {filtered.length>50&&<p className="text-center text-gray-400 py-4">Affichage limité à 50 questions. Utilisez les filtres.</p>}
          </div>
        )}
        
        {/* ===== MODAL QUESTION ===== */}
        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);setShowPreview(false);}} title={editing?'Modifier la question':'Créer une question'} size="xl">
          
          {/* Onglets Édition / Aperçu */}
          <div className="flex gap-1 mb-4 bg-gray-900/50 p-1 rounded-lg">
            <button onClick={()=>setShowPreview(false)} className={`flex-1 flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition ${!showPreview?'bg-indigo-600 text-white':'text-gray-400 hover:text-white hover:bg-gray-700'}`}><Icon name="Edit3" size={16}/>Édition</button>
            <button onClick={()=>setShowPreview(true)} className={`flex-1 flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition ${showPreview?'bg-indigo-600 text-white':'text-gray-400 hover:text-white hover:bg-gray-700'}`}><Icon name="Eye" size={16}/>Aperçu apprenant</button>
          </div>
          
          {showPreview ? (
            /* ========== PREVIEW APPRENANT ========== */
            <div className="space-y-6">
              <div className="bg-gray-900 rounded-xl p-6 border border-gray-700">
                {/* Badges */}
                <div className="flex flex-wrap gap-2 mb-4">
                  <span className={`px-2 py-1 rounded text-xs font-medium ${form.difficulty==='easy'?'bg-green-500/20 text-green-400':form.difficulty==='hard'?'bg-red-500/20 text-red-400':'bg-yellow-500/20 text-yellow-400'}`}>{form.difficulty==='easy'?'🟢 Facile':form.difficulty==='hard'?'🔴 Difficile':'🟡 Moyen'}</span>
                  <span className="px-2 py-1 rounded text-xs bg-indigo-500/20 text-indigo-400">{form.points} pt{form.points>1?'s':''}</span>
                  {form.time_limit>0&&<span className="px-2 py-1 rounded text-xs bg-orange-500/20 text-orange-400">⏱ {form.time_limit}s</span>}
                  <span className={`px-2 py-1 rounded text-xs ${questionTypes.find(t=>t.value===form.question_type)?.color||'text-gray-400'} bg-gray-800`}>{getTypeName(form.question_type)}</span>
                </div>
                
                {/* Médias de la question */}
                {form.media.length>0&&(
                  <div className="flex flex-wrap gap-3 mb-4">
                    {form.media.map((m,i)=><div key={i}>{renderMediaPreview(m,'md')}</div>)}
                  </div>
                )}
                
                {/* Texte de la question */}
                <h3 className="text-lg font-semibold text-white mb-6 leading-relaxed">
                  {form.question_text||<span className="text-gray-500 italic">Aucun texte de question saisi...</span>}
                </h3>
                
                {/* Réponses selon le type */}
                {['single','multiple','true_false'].includes(form.question_type)&&(
                  <div className="space-y-3">
                    {form.answers.filter(a=>a.text.trim()).map((a,i)=>(
                      <div key={i} className="flex items-center gap-3 p-3 rounded-lg border border-gray-700 bg-gray-800/60 hover:border-gray-500 cursor-pointer transition">
                        <div className={`w-5 h-5 rounded-${form.question_type==='multiple'?'md':'full'} border-2 border-gray-500 flex items-center justify-center shrink-0`}>
                          {a.is_correct&&<div className={`w-2.5 h-2.5 rounded-${form.question_type==='multiple'?'sm':'full'} bg-indigo-500`}/>}
                        </div>
                        <div className="flex items-center gap-3 flex-1">
                          {a.image_url&&<img src={a.image_url} alt="" className="w-10 h-10 rounded object-cover"/>}
                          <span className="text-gray-200">{a.text}</span>
                        </div>
                      </div>
                    ))}
                    {form.answers.filter(a=>a.text.trim()).length===0&&<p className="text-gray-500 italic text-sm">Aucune réponse saisie...</p>}
                  </div>
                )}
                
                {form.question_type==='fill_blank'&&(
                  <div className="space-y-3">
                    <p className="text-sm text-gray-400 mb-2">Complétez les trous :</p>
                    {form.blank_answers.filter(a=>a.trim()).map((a,i)=>(
                      <div key={i} className="flex items-center gap-3">
                        <span className="text-xs text-gray-500 w-8">#{i+1}</span>
                        <div className="flex-1 px-4 py-2 bg-gray-800 border-b-2 border-dashed border-gray-500 rounded text-gray-500 text-sm">Réponse attendue : <span className="text-green-400 font-medium">{a}</span></div>
                      </div>
                    ))}
                  </div>
                )}
                
                {form.question_type==='ordering'&&(
                  <div className="space-y-2">
                    <p className="text-sm text-gray-400 mb-2">Remettez dans l'ordre :</p>
                    {form.order_items.filter(a=>a.trim()).sort(()=>Math.random()-0.5).map((item,i)=>(
                      <div key={i} className="flex items-center gap-3 p-3 rounded-lg border border-gray-700 bg-gray-800/60 cursor-grab">
                        <Icon name="GripVertical" size={16} className="text-gray-500"/>
                        <span className="text-gray-200">{item}</span>
                      </div>
                    ))}
                  </div>
                )}
                
                {form.question_type==='matching'&&(
                  <div className="grid grid-cols-2 gap-4">
                    <div className="space-y-2">
                      <p className="text-xs text-gray-500 uppercase tracking-wider mb-1">Éléments</p>
                      {form.match_pairs.filter(p=>p.left.trim()).map((p,i)=>(
                        <div key={i} className="p-3 rounded-lg border border-pink-500/30 bg-pink-500/5 text-gray-200">{p.left}</div>
                      ))}
                    </div>
                    <div className="space-y-2">
                      <p className="text-xs text-gray-500 uppercase tracking-wider mb-1">Correspondances</p>
                      {form.match_pairs.filter(p=>p.right.trim()).sort(()=>Math.random()-0.5).map((p,i)=>(
                        <div key={i} className="p-3 rounded-lg border border-cyan-500/30 bg-cyan-500/5 text-gray-200">{p.right}</div>
                      ))}
                    </div>
                  </div>
                )}
                
                {form.question_type==='short_answer'&&(
                  <div>
                    <input disabled className="w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg text-gray-400 cursor-not-allowed" placeholder="Saisissez votre réponse..."/>
                    <p className="text-xs text-gray-500 mt-2">Réponses acceptées : {form.accepted_answers.filter(a=>a.trim()).join(', ')||'—'}</p>
                  </div>
                )}
                
                {form.question_type==='essay'&&(
                  <div>
                    <textarea disabled rows={4} className="w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg text-gray-400 resize-none cursor-not-allowed" placeholder="Rédigez votre réponse..."/>
                    {form.word_limit>0&&<p className="text-xs text-gray-500 mt-1">Limite : {form.word_limit} mots</p>}
                  </div>
                )}
              </div>
              
              {/* Feedback preview */}
              {(form.feedback_correct||form.feedback_incorrect||form.explanation)&&(
                <div className="bg-gray-900 rounded-xl p-6 border border-gray-700">
                  <h4 className="text-sm font-semibold text-gray-300 mb-3 flex items-center gap-2"><Icon name="MessageCircle" size={16}/>Feedback (affiché après réponse)</h4>
                  {form.feedback_correct&&<div className="flex items-start gap-2 mb-2 p-3 rounded-lg bg-green-500/10 border border-green-500/20"><Icon name="Check" size={16} className="text-green-400 mt-0.5 shrink-0"/><span className="text-green-300 text-sm">{form.feedback_correct}</span></div>}
                  {form.feedback_incorrect&&<div className="flex items-start gap-2 mb-2 p-3 rounded-lg bg-red-500/10 border border-red-500/20"><Icon name="X" size={16} className="text-red-400 mt-0.5 shrink-0"/><span className="text-red-300 text-sm">{form.feedback_incorrect}</span></div>}
                  {form.explanation&&<div className="mt-3 p-3 rounded-lg bg-blue-500/10 border border-blue-500/20"><p className="text-xs text-blue-400 font-medium mb-1">Explication</p><p className="text-sm text-blue-200">{form.explanation}</p></div>}
                  {form.correction_media.length>0&&<div className="flex flex-wrap gap-3 mt-3">{form.correction_media.map((m,i)=><div key={i}>{renderMediaPreview(m)}</div>)}</div>}
                </div>
              )}
              
              {/* Boutons preview */}
              <div className="flex justify-between border-t border-gray-700 pt-4">
                <Button variant="secondary" icon="Edit3" onClick={()=>setShowPreview(false)}>Retour à l'édition</Button>
                <div className="flex gap-3">
                  <Button variant="secondary" onClick={()=>{setModal(false);setEditing(null);setShowPreview(false);}}>Annuler</Button>
                  <Button onClick={handleSave} loading={saving}>Enregistrer</Button>
                </div>
              </div>
            </div>
          ) : (
            /* ========== FORMULAIRE ÉDITION ========== */
            <div className="space-y-4">
            
            {/* 1. ZONE MÉDIAS QUESTION (en haut) */}
            <MediaZone target="question" mediaList={form.media} label="Médias de la question (images, vidéos, audio)" fileRef={mediaFileRef}/>
            
            {/* 2. TEXTE DE LA QUESTION */}
            <div>
              <label className="block text-sm font-medium text-gray-300 mb-1">Question *</label>
              <div className="relative">
                <textarea value={form.question_text} onChange={e=>setForm({...form,question_text:e.target.value})} rows={3} className="w-full px-4 py-2 pr-12 bg-gray-700 border border-gray-600 rounded-lg text-white" placeholder={form.question_type==='fill_blank'?'La capitale de la France est [___] et sa monnaie est l\'[___].':'Entrez votre question ici...'}/>
                <div className="absolute top-2 right-2"><SpeechButton onResult={t=>setForm(f=>({...f,question_text:f.question_text+(f.question_text?' ':'')+t}))}/></div>
              </div>
            </div>
            
            {/* 3. PARAMÈTRES */}
            <div className="grid grid-cols-4 gap-3">
              <Select label="Type *" value={form.question_type} onChange={e=>{
                const newType=e.target.value;
                let answers=form.answers;
                if(newType==='true_false')answers=[{text:'Vrai',is_correct:true,image_url:''},{text:'Faux',is_correct:false,image_url:''}];
                setForm({...form,question_type:newType,answers});
              }} options={questionTypes.map(t=>({value:t.value,label:t.label}))}/>
              <Select label="Difficulté" value={form.difficulty} onChange={e=>setForm({...form,difficulty:e.target.value})} options={[{value:'easy',label:'🟢 Facile'},{value:'medium',label:'🟡 Moyen'},{value:'hard',label:'🔴 Difficile'}]}/>
              <Input label="Points" type="number" min="1" value={form.points} onChange={e=>setForm({...form,points:parseInt(e.target.value)||1})}/>
              <Input label="Temps (sec)" type="number" min="0" value={form.time_limit} onChange={e=>setForm({...form,time_limit:parseInt(e.target.value)||0})} placeholder="0 = illimité"/>
            </div>
            
            {/* 4. TAXONOMIE */}
            <div className="grid grid-cols-3 gap-3">
              <Select label="Catégorie" value={form.category_id} onChange={e=>setForm({...form,category_id:e.target.value,theme_id:'',sub_theme_id:''})} options={[{value:'',label:'—'},...categories.map(c=>({value:c.id,label:c.name}))]}/>
              <Select label="Thème" value={form.theme_id} onChange={e=>setForm({...form,theme_id:e.target.value,sub_theme_id:''})} options={[{value:'',label:'—'},...getThemesForCategory(form.category_id).map(t=>({value:t.id,label:t.name}))]} disabled={!form.category_id}/>
              <Select label="Sous-thème" value={form.sub_theme_id} onChange={e=>setForm({...form,sub_theme_id:e.target.value})} options={[{value:'',label:'—'},...getSubThemesForTheme(form.theme_id).map(st=>({value:st.id,label:st.name}))]} disabled={!form.theme_id}/>
            </div>
            
            {/* TAGS */}
            <div>
              <label className="block text-sm font-medium text-gray-300 mb-1">Tags</label>
              <div className="min-h-[34px] p-2 bg-gray-700 border border-gray-600 rounded-lg flex flex-wrap gap-1">
                {form.tags.map(t=><span key={t} className="inline-flex items-center gap-1 px-2 py-0.5 bg-indigo-600/30 text-indigo-300 rounded text-xs">{t}<button type="button" onClick={()=>setForm({...form,tags:form.tags.filter(x=>x!==t)})} className="hover:text-white">×</button></span>)}
                {form.tags.length===0&&<span className="text-gray-500 text-xs">Aucun tag</span>}
              </div>
              {predefinedTags.length>0&&<div className="flex flex-wrap gap-1 mt-1">{predefinedTags.filter(t=>!form.tags.includes(t.name)).slice(0,12).map(t=><button key={t.id} type="button" onClick={()=>setForm({...form,tags:[...form.tags,t.name]})} className="px-2 py-0.5 rounded text-xs border border-gray-600 hover:border-indigo-500" style={{color:t.color||'#6366f1'}}>+ {t.name}</button>)}</div>}
            </div>
            
            {/* 5. RÉPONSES PAR TYPE */}
            <div className="border-t border-gray-700 pt-4">
              <h4 className="text-sm font-semibold text-gray-200 mb-3 flex items-center gap-2">
                <Icon name={questionTypes.find(t=>t.value===form.question_type)?.icon||'HelpCircle'} size={16}/>
                {getTypeName(form.question_type)} — Réponses
              </h4>
              
              {/* CHOIX UNIQUE / MULTIPLE / VRAI-FAUX */}
              {['single','multiple','true_false'].includes(form.question_type)&&(
                <div className="space-y-3">
                  {form.answers.map((a,i)=>(
                    <div key={i} className="flex items-start gap-2 bg-gray-800/50 rounded-lg p-3">
                      <input type={form.question_type==='multiple'?'checkbox':'radio'} checked={a.is_correct} onChange={e=>updateAnswer(i,'is_correct',e.target.checked)} className="w-4 h-4 mt-2.5"/>
                      <div className="flex-1 space-y-2">
                        <div className="flex gap-1 items-start">
                          <Input className="flex-1" value={a.text} onChange={e=>updateAnswer(i,'text',e.target.value)} placeholder={form.question_type==='true_false'?(i===0?'Vrai':'Faux'):`Réponse ${i+1}`}/>
                          <SpeechButton onResult={t=>{const arr=[...form.answers];arr[i]={...arr[i],text:arr[i].text+(arr[i].text?' ':'')+t};setForm({...form,answers:arr});}}/>
                        </div>
                        {/* Image de la réponse */}
                        <div className="flex items-center gap-2">
                          {a.image_url&&<img src={a.image_url} alt="" className="w-10 h-10 rounded object-cover"/>}
                          <Input className="flex-1" value={a.image_url||''} onChange={e=>updateAnswer(i,'image_url',e.target.value)} placeholder="URL image (optionnel)" icon="Image"/>
                          <input ref={i===answerImageIdx?answerImageRef:null} type="file" accept="image/*" className="hidden" onChange={e=>{if(e.target.files[0])uploadAnswerImage(e.target.files[0],i);}}/>
                          <button type="button" onClick={()=>{setAnswerImageIdx(i);setTimeout(()=>{const inp=document.querySelector(`input[type="file"][data-answer="${i}"]`);if(inp)inp.click();else{const el=document.createElement('input');el.type='file';el.accept='image/*';el.onchange=ev=>{if(ev.target.files[0])uploadAnswerImage(ev.target.files[0],i);};el.click();}},0);}} className="p-2 hover:bg-gray-600 rounded"><Icon name="Upload" size={14} className="text-gray-400"/></button>
                        </div>
                      </div>
                      {form.answers.length>2&&form.question_type!=='true_false'&&<button onClick={()=>removeAnswer(i)} className="p-2 hover:bg-red-500/20 rounded text-red-400 mt-1"><Icon name="X" size={16}/></button>}
                    </div>
                  ))}
                  {form.question_type!=='true_false'&&<Button variant="ghost" size="sm" icon="Plus" onClick={addAnswer}>Ajouter une réponse</Button>}
                </div>
              )}
              
              {/* TEXTE À TROUS */}
              {form.question_type==='fill_blank'&&(
                <div className="space-y-3">
                  <div className="bg-blue-500/10 border border-blue-500/30 rounded-lg p-3">
                    <p className="text-xs text-blue-400">💡 Utilisez <code className="bg-blue-500/20 px-1 rounded">[___]</code> dans la question pour marquer les trous. Indiquez ci-dessous les réponses attendues dans l'ordre.</p>
                  </div>
                  <label className="text-sm text-gray-300">Réponses attendues (dans l'ordre des trous) :</label>
                  {form.blank_answers.map((a,i)=>(
                    <div key={i} className="flex gap-2 items-center">
                      <span className="text-xs text-gray-500 w-8">#{i+1}</span>
                      <Input className="flex-1" value={a} onChange={e=>{const arr=[...form.blank_answers];arr[i]=e.target.value;setForm({...form,blank_answers:arr});}} placeholder={`Réponse trou ${i+1}`}/>
                      <SpeechButton onResult={t=>{const arr=[...form.blank_answers];arr[i]=arr[i]+(arr[i]?' ':'')+t;setForm({...form,blank_answers:arr});}}/>
                      {form.blank_answers.length>1&&<button onClick={()=>setForm({...form,blank_answers:form.blank_answers.filter((_,j)=>j!==i)})} className="p-2 hover:bg-red-500/20 rounded text-red-400"><Icon name="X" size={16}/></button>}
                    </div>
                  ))}
                  <Button variant="ghost" size="sm" icon="Plus" onClick={()=>setForm({...form,blank_answers:[...form.blank_answers,'']})}>Ajouter un trou</Button>
                </div>
              )}
              
              {/* ORDONNANCEMENT */}
              {form.question_type==='ordering'&&(
                <div className="space-y-3">
                  <div className="bg-purple-500/10 border border-purple-500/30 rounded-lg p-3">
                    <p className="text-xs text-purple-400">💡 Saisissez les éléments dans l'ordre correct. Ils seront mélangés pour l'apprenant.</p>
                  </div>
                  {form.order_items.map((item,i)=>(
                    <div key={i} className="flex gap-2 items-center">
                      <span className="w-8 h-8 bg-purple-500/20 rounded flex items-center justify-center text-xs font-bold text-purple-400">{i+1}</span>
                      <Input className="flex-1" value={item} onChange={e=>{const arr=[...form.order_items];arr[i]=e.target.value;setForm({...form,order_items:arr});}} placeholder={`Élément ${i+1}`}/>
                      <SpeechButton onResult={t=>{const arr=[...form.order_items];arr[i]=arr[i]+(arr[i]?' ':'')+t;setForm({...form,order_items:arr});}}/>
                      {form.order_items.length>2&&<button onClick={()=>setForm({...form,order_items:form.order_items.filter((_,j)=>j!==i)})} className="p-2 hover:bg-red-500/20 rounded text-red-400"><Icon name="X" size={16}/></button>}
                    </div>
                  ))}
                  <Button variant="ghost" size="sm" icon="Plus" onClick={()=>setForm({...form,order_items:[...form.order_items,'']})}>Ajouter un élément</Button>
                </div>
              )}
              
              {/* APPARIEMENT */}
              {form.question_type==='matching'&&(
                <div className="space-y-3">
                  <div className="bg-pink-500/10 border border-pink-500/30 rounded-lg p-3">
                    <p className="text-xs text-pink-400">💡 Définissez les paires à associer. L'apprenant devra relier chaque élément de gauche à son correspondant à droite.</p>
                  </div>
                  {form.match_pairs.map((pair,i)=>(
                    <div key={i} className="flex gap-2 items-center">
                      <div className="flex gap-1 items-center flex-1">
                        <Input className="flex-1" value={pair.left} onChange={e=>{const arr=[...form.match_pairs];arr[i]={...arr[i],left:e.target.value};setForm({...form,match_pairs:arr});}} placeholder="Élément gauche"/>
                        <SpeechButton onResult={t=>{const arr=[...form.match_pairs];arr[i]={...arr[i],left:arr[i].left+(arr[i].left?' ':'')+t};setForm({...form,match_pairs:arr});}}/>
                      </div>
                      <Icon name="ArrowRight" size={16} className="text-gray-500 shrink-0"/>
                      <div className="flex gap-1 items-center flex-1">
                        <Input className="flex-1" value={pair.right} onChange={e=>{const arr=[...form.match_pairs];arr[i]={...arr[i],right:e.target.value};setForm({...form,match_pairs:arr});}} placeholder="Élément droit"/>
                        <SpeechButton onResult={t=>{const arr=[...form.match_pairs];arr[i]={...arr[i],right:arr[i].right+(arr[i].right?' ':'')+t};setForm({...form,match_pairs:arr});}}/>
                      </div>
                      {form.match_pairs.length>1&&<button onClick={()=>setForm({...form,match_pairs:form.match_pairs.filter((_,j)=>j!==i)})} className="p-2 hover:bg-red-500/20 rounded text-red-400"><Icon name="X" size={16}/></button>}
                    </div>
                  ))}
                  <Button variant="ghost" size="sm" icon="Plus" onClick={()=>setForm({...form,match_pairs:[...form.match_pairs,{left:'',right:''}]})}>Ajouter une paire</Button>
                </div>
              )}
              
              {/* RÉPONSE COURTE */}
              {form.question_type==='short_answer'&&(
                <div className="space-y-3">
                  <div className="bg-cyan-500/10 border border-cyan-500/30 rounded-lg p-3">
                    <p className="text-xs text-cyan-400">💡 Indiquez les réponses acceptées. La vérification est insensible à la casse.</p>
                  </div>
                  <label className="text-sm text-gray-300">Réponses acceptées :</label>
                  {form.accepted_answers.map((a,i)=>(
                    <div key={i} className="flex gap-2 items-center">
                      <Input className="flex-1" value={a} onChange={e=>{const arr=[...form.accepted_answers];arr[i]=e.target.value;setForm({...form,accepted_answers:arr});}} placeholder={`Réponse acceptée ${i+1}`}/>
                      <SpeechButton onResult={t=>{const arr=[...form.accepted_answers];arr[i]=arr[i]+(arr[i]?' ':'')+t;setForm({...form,accepted_answers:arr});}}/>
                      {form.accepted_answers.length>1&&<button onClick={()=>setForm({...form,accepted_answers:form.accepted_answers.filter((_,j)=>j!==i)})} className="p-2 hover:bg-red-500/20 rounded text-red-400"><Icon name="X" size={16}/></button>}
                    </div>
                  ))}
                  <Button variant="ghost" size="sm" icon="Plus" onClick={()=>setForm({...form,accepted_answers:[...form.accepted_answers,'']})}>Ajouter une variante</Button>
                </div>
              )}
              
              {/* RÉDACTION */}
              {form.question_type==='essay'&&(
                <div className="space-y-3">
                  <div className="bg-orange-500/10 border border-orange-500/30 rounded-lg p-3">
                    <p className="text-xs text-orange-400">💡 Question ouverte à correction manuelle. Définissez un barème pour guider l'évaluation.</p>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <Input label="Limite de mots (0 = illimité)" type="number" min="0" value={form.word_limit} onChange={e=>setForm({...form,word_limit:parseInt(e.target.value)||0})}/>
                    <div/>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-300 mb-1">Barème / Critères d'évaluation</label>
                    <div className="relative">
                      <textarea value={form.rubric} onChange={e=>setForm({...form,rubric:e.target.value})} rows={3} className="w-full px-4 py-2 pr-12 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none" placeholder="Ex: 3 pts pour l'argumentation, 2 pts pour les exemples, 1 pt pour la conclusion..."/>
                      <div className="absolute top-2 right-2"><SpeechButton onResult={t=>setForm(f=>({...f,rubric:f.rubric+(f.rubric?' ':'')+t}))}/></div>
                    </div>
                  </div>
                </div>
              )}
            </div>
            
            {/* 6. FEEDBACK & CORRECTION */}
            <div className="border-t border-gray-700 pt-4">
              <h4 className="text-sm font-semibold text-gray-200 mb-3 flex items-center gap-2">
                <Icon name="MessageCircle" size={16}/>
                Feedback & Correction
              </h4>
              
              <div className="grid grid-cols-2 gap-3 mb-3">
                <div className="flex gap-1 items-end">
                  <Input className="flex-1" label="Feedback correct" value={form.feedback_correct} onChange={e=>setForm({...form,feedback_correct:e.target.value})} placeholder="Bravo ! Bonne réponse." icon="Check"/>
                  <SpeechButton onResult={t=>setForm(f=>({...f,feedback_correct:f.feedback_correct+(f.feedback_correct?' ':'')+t}))}/>
                </div>
                <div className="flex gap-1 items-end">
                  <Input className="flex-1" label="Feedback incorrect" value={form.feedback_incorrect} onChange={e=>setForm({...form,feedback_incorrect:e.target.value})} placeholder="Ce n'est pas la bonne réponse." icon="X"/>
                  <SpeechButton onResult={t=>setForm(f=>({...f,feedback_incorrect:f.feedback_incorrect+(f.feedback_incorrect?' ':'')+t}))}/>
                </div>
              </div>
              
              <div className="mb-3">
                <label className="block text-sm font-medium text-gray-300 mb-1">Explication détaillée (affichée après réponse)</label>
                <div className="relative">
                  <textarea value={form.explanation} onChange={e=>setForm({...form,explanation:e.target.value})} rows={3} className="w-full px-4 py-2 pr-12 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none" placeholder="Explication complète de la bonne réponse avec contexte, références, etc."/>
                  <div className="absolute top-2 right-2"><SpeechButton onResult={t=>setForm(f=>({...f,explanation:f.explanation+(f.explanation?' ':'')+t}))}/></div>
                </div>
              </div>
              
              {/* Zone médias correction */}
              <MediaZone target="correction" mediaList={form.correction_media} label="Médias de la correction (images, vidéos, audio explicatifs)" fileRef={correctionMediaRef}/>
            </div>
            
            {/* 7. BOUTONS */}
            <div className="flex justify-end gap-3 border-t border-gray-700 pt-4">
              <Button variant="secondary" onClick={()=>{setModal(false);setEditing(null);setShowPreview(false);}}>Annuler</Button>
              <Button variant="ghost" icon="Eye" onClick={()=>setShowPreview(true)}>Aperçu</Button>
              <Button onClick={handleSave} loading={saving}>Enregistrer</Button>
            </div>
          </div>
          )}
        </Modal>
        
        {/* Modal Import */}
        <Modal isOpen={importModal} onClose={()=>{setImportModal(false);setImportData([]);setImportResult(null);}} title="Importer des questions" size="lg">
          <div className="space-y-4">
            <div className="bg-gray-700/50 rounded-lg p-4">
              <p className="text-sm text-gray-400 mb-1">Colonnes : Question*, Type, Catégorie, Thème, Sous-thème, Difficulté, Points, Temps, Réponse 1-4, Correct 1-4, Feedbacks, Image URL, Tags</p>
              <p className="text-xs text-gray-500">💡 Les catégories/thèmes/sous-thèmes sont créés automatiquement.</p>
            </div>
            {importData.length>0&&(
              <div className="border border-gray-700 rounded-lg overflow-hidden">
                <div className="bg-gray-800 px-4 py-2 text-sm font-medium">{importData.length} question(s) détectée(s)</div>
                <div className="max-h-60 overflow-y-auto">
                  {importData.slice(0,10).map((row,i)=><div key={i} className="px-4 py-2 border-t border-gray-700 text-sm truncate"><span className="font-medium">{row['Question']||row['question_text']}</span></div>)}
                  {importData.length>10&&<div className="px-4 py-2 border-t border-gray-700 text-sm text-gray-400">... et {importData.length-10} autres</div>}
                </div>
              </div>
            )}
            {importResult&&<div className={`p-4 rounded-lg ${importResult.phase==='done'?(importResult.errors>0?'bg-yellow-500/20':'bg-green-500/20'):'bg-blue-500/20'}`}>
              {importResult.phase==='import'&&(<div><p className="font-medium text-blue-300 mb-2">⏳ Import en cours... {importResult.success}/{importResult.total}</p><div className="w-full bg-gray-700 rounded-full h-2"><div className="bg-blue-500 h-2 rounded-full progress-bar" style={{width:`${Math.round((importResult.success+importResult.errors)/Math.max(importResult.total,1)*100)}%`}}/></div></div>)}
              {importResult.phase==='done'&&(<div><p className="font-medium">✅ {importResult.success} question(s) importée(s){importResult.total>0&&` sur ${importResult.total}`}</p>{importResult.errors>0&&<p className="text-sm text-yellow-400 mt-1">⚠️ {importResult.errors} erreur(s)</p>}</div>)}
            </div>}
            <div className="flex justify-end gap-3">
              <Button variant="secondary" onClick={()=>{setImportModal(false);setImportData([]);setImportResult(null);}}>Fermer</Button>
              {!importResult&&<Button onClick={processImport} loading={importLoading} disabled={importData.length===0}>Importer {importData.length} question(s)</Button>}
            </div>
          </div>
        </Modal>
        
        {/* Preview Média */}
        <Modal isOpen={!!previewMedia} onClose={()=>setPreviewMedia(null)} title={`Aperçu — ${previewMedia?.name||'Média'}`} size="lg">
          {previewMedia&&(
            <div className="flex items-center justify-center">
              {previewMedia.type==='image'&&<img src={previewMedia.url} alt="" className="max-w-full max-h-[70vh] rounded-lg"/>}
              {previewMedia.type==='video'&&(()=>{
                const vm=previewMedia.url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
                const yt=previewMedia.url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/);
                if(vm)return<iframe src={`https://player.vimeo.com/video/${vm[1]}`} className="w-full h-[70vh] rounded-lg" allow="autoplay; fullscreen"/>;
                if(yt)return<iframe src={`https://www.youtube.com/embed/${yt[1]}`} className="w-full h-[70vh] rounded-lg" allow="autoplay; fullscreen"/>;
                return<video controls src={previewMedia.url} className="max-w-full max-h-[70vh] rounded-lg"/>;
              })()}
              {previewMedia.type==='audio'&&<audio controls src={previewMedia.url} className="w-full"/>}
            </div>
          )}
        </Modal>
      </div>;
    }
    
    function QuizManagementSection(){
      const{categories,themes,subThemes,getThemesForCategory,getSubThemesForTheme}=useTaxonomy();
      const[quizzes,setQuizzes]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({title:'',description:'',passing_score:70,time_limit:0,max_attempts:0,shuffle_questions:false,shuffle_answers:false,show_answers:true,show_feedback:true,category_id:'',theme_id:'',sub_theme_id:''});
      const[saving,setSaving]=useState(false);
      const[search,setSearch]=useState('');
      const[bankQuestions,setBankQuestions]=useState([]);
      const[quizQuestions,setQuizQuestions]=useState([]);
      const[addQuestionsModal,setAddQuestionsModal]=useState(null);
      const[selectedBankQuestions,setSelectedBankQuestions]=useState([]);
      
      const load=useCallback(async()=>{
        const[{data:q},{data:bank}]=await Promise.all([
          supabase.from('quizzes').select('*,content_categories(id,name,color),content_themes(id,name),content_sub_themes(id,name),quiz_questions(count)').eq('is_lms_content',true).order('created_at',{ascending:false}),
          supabase.from('question_bank').select('*,question_bank_answers(*)').order('created_at',{ascending:false})
        ]);
        setQuizzes(q||[]);
        setBankQuestions(bank||[]);
        setLoading(false);
      },[]);
      
      useEffect(()=>{load();},[load]);
      
      
      const handleSave=async()=>{
        if(!form.title)return alert('Titre requis');
        setSaving(true);
        
        const payload={
          title:form.title,
          description:form.description||null,
          passing_score:form.passing_score,
          time_limit:form.time_limit||0,
          max_attempts:form.max_attempts||0,
          shuffle_questions:form.shuffle_questions,
          shuffle_answers:form.shuffle_answers,
          show_answers:form.show_answers,
          show_feedback:form.show_feedback,
          category_id:form.category_id||null,
          theme_id:form.theme_id||null,
          sub_theme_id:form.sub_theme_id||null,
          is_lms_content:true
        };
        
        if(editing){
          await supabase.from('quizzes').update(payload).eq('id',editing.id);
        }else{
          await supabase.from('quizzes').insert(payload);
        }
        
        setModal(false);
        setEditing(null);
        setForm({title:'',description:'',passing_score:70,time_limit:0,max_attempts:0,shuffle_questions:false,shuffle_answers:false,show_answers:true,show_feedback:true,category_id:'',theme_id:'',sub_theme_id:''});
        setSaving(false);
        load();
      };
      
      const handleDelete=async(id)=>{
        if(!confirm('Supprimer ce quiz ?'))return;
        await supabase.from('quizzes').delete().eq('id',id);
        load();
      };
      
      const openEdit=(q)=>{
        setEditing(q);
        setForm({
          title:q.title||'',
          description:q.description||'',
          passing_score:q.passing_score||70,
          time_limit:q.time_limit||0,
          max_attempts:q.max_attempts||0,
          shuffle_questions:q.shuffle_questions||false,
          shuffle_answers:q.shuffle_answers||false,
          show_answers:q.show_answers!==false,
          show_feedback:q.show_feedback!==false,
          category_id:q.category_id||'',
          theme_id:q.theme_id||'',
          sub_theme_id:q.sub_theme_id||''
        });
        setModal(true);
      };
      
      const openAddQuestions=async(quiz)=>{
        const{data}=await supabase.from('quiz_questions').select('*,quiz_answers(*)').eq('quiz_id',quiz.id).order('sort_order');
        setQuizQuestions(data||[]);
        setSelectedBankQuestions([]);
        setAddQuestionsModal(quiz);
      };
      
      const addQuestionsFromBank=async()=>{
        if(!selectedBankQuestions.length)return;
        const maxOrder=(quizQuestions.length>0?Math.max(...quizQuestions.map(q=>q.sort_order||0)):0);
        
        for(let i=0;i<selectedBankQuestions.length;i++){
          const bq=bankQuestions.find(q=>q.id===selectedBankQuestions[i]);
          if(!bq)continue;
          
          const{data:qq}=await supabase.from('quiz_questions').insert({
            quiz_id:addQuestionsModal.id,
            question_text:bq.question_text,
            question_type:bq.question_type,
            points:bq.points||1,
            time_limit:bq.time_limit||0,
            sort_order:maxOrder+i+1,
            feedback_correct:bq.feedback_correct,
            feedback_incorrect:bq.feedback_incorrect
          }).select().single();
          
          if(qq&&bq.question_bank_answers){
            const answers=bq.question_bank_answers.map((a,j)=>({
              question_id:qq.id,
              answer_text:a.answer_text,
              is_correct:a.is_correct,
              sort_order:j
            }));
            await supabase.from('quiz_answers').insert(answers);
          }
        }
        
        setAddQuestionsModal(null);
        setSelectedBankQuestions([]);
        load();
      };
      
      const filtered=quizzes.filter(q=>{
        if(search){
          const s=search.toLowerCase();
          const inTitle=q.title?.toLowerCase().includes(s);
          const inDesc=q.description?.toLowerCase().includes(s);
          const inCat=q.content_categories?.name?.toLowerCase().includes(s);
          const inTheme=q.content_themes?.name?.toLowerCase().includes(s);
          const inSubTheme=q.content_sub_themes?.name?.toLowerCase().includes(s);
          const inTags=(q.tags||[]).some(t=>t.toLowerCase().includes(s));
          if(!inTitle&&!inDesc&&!inCat&&!inTheme&&!inSubTheme&&!inTags)return false;
        }
        return true;
      });
      
      if(loading)return<div className="flex items-center justify-center py-20"><Icon name="Loader2" size={32} className="animate-spin text-indigo-400"/></div>;
      
      return<div>
        <div className="flex flex-wrap items-center gap-3 mb-6">
          <Button icon="Plus" onClick={()=>{setEditing(null);setForm({title:'',description:'',passing_score:70,time_limit:0,max_attempts:0,shuffle_questions:false,shuffle_answers:false,show_answers:true,show_feedback:true,category_id:'',theme_id:'',sub_theme_id:''});setModal(true);}}>Créer un quiz</Button>
          <div className="flex-1"/>
          <Input icon="Search" placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)} className="w-64"/>
        </div>
        
        <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-pink-400">{quizzes.length}</p><p className="text-xs text-gray-400">Quiz</p></Card>
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-cyan-400">{bankQuestions.length}</p><p className="text-xs text-gray-400">Questions en banque</p></Card>
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-green-400">{quizzes.reduce((a,q)=>a+(q.quiz_questions?.[0]?.count||0),0)}</p><p className="text-xs text-gray-400">Questions assignées</p></Card>
        </div>
        
        {filtered.length===0?<Empty icon="HelpCircle" title="Aucun quiz" desc="Créez votre premier quiz"/>:(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {filtered.map(q=>(
              <Card key={q.id} className="p-4">
                <div className="flex items-start gap-3">
                  <div className="w-12 h-12 bg-pink-500/20 rounded-lg flex items-center justify-center shrink-0"><Icon name="HelpCircle" size={24} className="text-pink-400"/></div>
                  <div className="flex-1 min-w-0">
                    <h3 className="font-semibold truncate">{q.title}</h3>
                    <p className="text-xs text-gray-400">{q.quiz_questions?.[0]?.count||0} questions • Score min: {q.passing_score}%</p>
                    {q.content_categories?.name&&<span className="inline-block mt-1 px-2 py-0.5 rounded text-xs" style={{backgroundColor:(q.content_categories?.color||'#ec4899')+'30',color:q.content_categories?.color||'#ec4899'}}>{q.content_categories.name}</span>}
                  </div>
                </div>
                <div className="flex gap-2 mt-4">
                  <Button variant="ghost" size="sm" icon="Database" onClick={()=>openAddQuestions(q)}>Questions</Button>
                  <Button variant="ghost" size="sm" icon="Edit2" onClick={()=>openEdit(q)}>Modifier</Button>
                  <Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(q.id)}/>
                </div>
              </Card>
            ))}
          </div>
        )}
        
        {/* Modal Quiz */}
        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title={editing?'Modifier le quiz':'Créer un quiz'} size="lg">
          <div className="space-y-4">
            <Input label="Titre *" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/>
            <div className="grid grid-cols-3 gap-4">
              <Input label="Score minimum (%)" type="number" value={form.passing_score} onChange={e=>setForm({...form,passing_score:parseInt(e.target.value)||70})}/>
              <Input label="Temps limite (min)" type="number" value={form.time_limit} onChange={e=>setForm({...form,time_limit:parseInt(e.target.value)||0})} placeholder="0 = illimité"/>
              <Input label="Tentatives max" type="number" value={form.max_attempts} onChange={e=>setForm({...form,max_attempts:parseInt(e.target.value)||0})} placeholder="0 = illimité"/>
            </div>
            <div className="grid grid-cols-3 gap-4">
              <Select label="Catégorie" value={form.category_id} onChange={e=>setForm({...form,category_id:e.target.value,theme_id:'',sub_theme_id:''})} options={[{value:'',label:'Aucune'},...categories.map(c=>({value:c.id,label:c.name}))]}/>
              <Select label="Thème" value={form.theme_id} onChange={e=>setForm({...form,theme_id:e.target.value,sub_theme_id:''})} options={[{value:'',label:'Aucun'},...getThemesForCategory(form.category_id).map(t=>({value:t.id,label:t.name}))]} disabled={!form.category_id}/>
              <Select label="Sous-thème" value={form.sub_theme_id} onChange={e=>setForm({...form,sub_theme_id:e.target.value})} options={[{value:'',label:'Aucun'},...getSubThemesForTheme(form.theme_id).map(st=>({value:st.id,label:st.name}))]} disabled={!form.theme_id}/>
            </div>
            <div className="grid grid-cols-2 gap-4">
              <label className="flex items-center gap-2"><input type="checkbox" checked={form.shuffle_questions} onChange={e=>setForm({...form,shuffle_questions:e.target.checked})} className="rounded"/>Mélanger les questions</label>
              <label className="flex items-center gap-2"><input type="checkbox" checked={form.shuffle_answers} onChange={e=>setForm({...form,shuffle_answers:e.target.checked})} className="rounded"/>Mélanger les réponses</label>
              <label className="flex items-center gap-2"><input type="checkbox" checked={form.show_answers} onChange={e=>setForm({...form,show_answers:e.target.checked})} className="rounded"/>Afficher les réponses</label>
              <label className="flex items-center gap-2"><input type="checkbox" checked={form.show_feedback} onChange={e=>setForm({...form,show_feedback:e.target.checked})} className="rounded"/>Afficher le feedback</label>
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-300 mb-1">Description</label>
              <textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={2} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/>
            </div>
            <div className="flex justify-end gap-3">
              <Button variant="secondary" onClick={()=>{setModal(false);setEditing(null);}}>Annuler</Button>
              <Button onClick={handleSave} loading={saving}>Enregistrer</Button>
            </div>
          </div>
        </Modal>
        
        {/* Modal ajouter questions */}
        <Modal isOpen={!!addQuestionsModal} onClose={()=>setAddQuestionsModal(null)} title={`Ajouter des questions - ${addQuestionsModal?.title}`} size="xl">
          <div className="space-y-4">
            <p className="text-sm text-gray-400">Questions actuelles: {quizQuestions.length} • Sélectionnez des questions de la banque à ajouter</p>
            <div className="max-h-96 overflow-y-auto space-y-2">
              {bankQuestions.map(bq=>(
                <label key={bq.id} className={`flex items-center gap-3 p-3 rounded-lg cursor-pointer ${selectedBankQuestions.includes(bq.id)?'bg-indigo-600/20 border border-indigo-500':'bg-gray-700 hover:bg-gray-600'}`}>
                  <input type="checkbox" checked={selectedBankQuestions.includes(bq.id)} onChange={e=>{
                    if(e.target.checked)setSelectedBankQuestions([...selectedBankQuestions,bq.id]);
                    else setSelectedBankQuestions(selectedBankQuestions.filter(id=>id!==bq.id));
                  }} className="rounded"/>
                  <div className="flex-1 min-w-0">
                    <p className="font-medium truncate">{bq.question_text}</p>
                    <p className="text-xs text-gray-400">{bq.question_type} • {bq.difficulty} • {bq.points} pt{bq.points>1?'s':''}</p>

        setLoading(false);

      const openPackModal=(pack=null)=>{
        if(pack){

      const savePack=async()=>{
        setSaving(true);
