    // ============================================================
    // PAGE: Dashboard Admin (AdminDashboardPage)
    // ============================================================
    function AdminDashboardPage(){
      const{center,isSuperAdmin,profile,can,realRole}=useAuth();
      const[loading,setLoading]=useState(true);
      const[stats,setStats]=useState({});
      const[recentActivity,setRecentActivity]=useState([]);
      const[alerts,setAlerts]=useState([]);
      const[topLearners,setTopLearners]=useState([]);
      const[centers,setCenters]=useState([]);
      const[quickStats,setQuickStats]=useState({});
      
      const load=useCallback(async()=>{
        const now=new Date();
        const todayStr=now.toISOString().slice(0,10);
        const sevenDaysAgo=new Date(now-7*24*60*60*1000);
        const thirtyDaysAgo=new Date(now-30*24*60*60*1000);
        
        // ========== DONNÉES SELON LE RÔLE ==========
        
        // Charger les centres (Super Admin uniquement)
        let centersData=[];
        if(isSuperAdmin){
          const{data:c}=await supabase.from('centers').select('*');
          centersData=c||[];
          setCenters(centersData);
        }
        
        // Charger les apprenants
        let learnersQuery=supabase.from('profiles').select('id,first_name,last_name,email,created_at,center_id').eq('role','learner');
        if(!isSuperAdmin&&center?.id)learnersQuery=learnersQuery.eq('center_id',center.id);
        const{data:learners}=await learnersQuery;
        const learnerIds=(learners||[]).map(l=>l.id);
        
        // Charger les inscriptions
        let enrollmentsQuery=supabase.from('enrollments').select('*,playlists:playlist_id(title,center_id)');
        if(!isSuperAdmin&&center?.id&&learnerIds.length>0)enrollmentsQuery=enrollmentsQuery.in('learner_id',learnerIds);
        const{data:enrollments}=await enrollmentsQuery;
        const filteredEnrollments=(enrollments||[]).filter(e=>isSuperAdmin||learnerIds.includes(e.learner_id));
        
        // Charger la progression SCORM
        let scormQuery=supabase.from('scorm_progress').select('*');
        if(!isSuperAdmin&&learnerIds.length>0)scormQuery=scormQuery.in('learner_id',learnerIds);
        const{data:scormProgress}=await scormQuery;
        
        // Charger les quiz
        let quizQuery=supabase.from('quiz_attempts').select('*');
        if(!isSuperAdmin&&learnerIds.length>0)quizQuery=quizQuery.in('learner_id',learnerIds);
        const{data:quizAttempts}=await quizQuery;
        
        // Charger les cours
        let coursesQuery=supabase.from('playlists').select('id,title,is_published,is_lms_content');
        if(!isSuperAdmin&&center?.id)coursesQuery=coursesQuery.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        const{data:courses}=await coursesQuery;
        
        // ========== CALCUL DES STATS ==========
        
        const totalLearners=learners?.length||0;
        const newLearnersThisWeek=(learners||[]).filter(l=>new Date(l.created_at)>sevenDaysAgo).length;
        const activeLearners=[...new Set([
          ...filteredEnrollments.map(e=>e.learner_id),
          ...(scormProgress||[]).filter(s=>s.last_accessed_at&&new Date(s.last_accessed_at)>sevenDaysAgo).map(s=>s.learner_id)
        ])].length;
        
        const totalEnrollments=filteredEnrollments.length;
        const completedEnrollments=filteredEnrollments.filter(e=>e.status==='completed').length;
        const inProgressEnrollments=filteredEnrollments.filter(e=>e.status==='in_progress').length;
        const enrollmentsThisWeek=filteredEnrollments.filter(e=>new Date(e.created_at)>sevenDaysAgo).length;
        
        const totalScorm=(scormProgress||[]).length;
        const completedScorm=(scormProgress||[]).filter(s=>s.completion_status==='completed'||s.completion_status==='passed').length;
        const scormThisWeek=(scormProgress||[]).filter(s=>s.last_accessed_at&&new Date(s.last_accessed_at)>sevenDaysAgo).length;
        const avgScormScore=(scormProgress||[]).filter(s=>s.score_scaled).reduce((a,s)=>a+(s.score_scaled>1?s.score_scaled:s.score_scaled*100),0)/Math.max(1,(scormProgress||[]).filter(s=>s.score_scaled).length);
        
        const totalQuiz=(quizAttempts||[]).length;
        const passedQuiz=(quizAttempts||[]).filter(q=>q.passed).length;
        const quizThisWeek=(quizAttempts||[]).filter(q=>new Date(q.created_at)>sevenDaysAgo).length;
        const avgQuizScore=totalQuiz>0?(quizAttempts||[]).reduce((a,q)=>a+(q.score_percent||0),0)/totalQuiz:0;
        
        const totalCourses=(courses||[]).length;
        const publishedCourses=(courses||[]).filter(c=>c.is_published).length;
        
        // Taux de complétion global
        const completionRate=totalEnrollments>0?Math.round((completedEnrollments/totalEnrollments)*100):0;
        
        // Charger les données vidéo pour le calcul du temps
        let videoQuery=supabase.from('video_progress').select('learner_id,watch_time_seconds');
        if(!isSuperAdmin&&learnerIds.length>0)videoQuery=videoQuery.in('learner_id',learnerIds);
        const{data:videoData}=await videoQuery;
        
        // Temps total de formation = vidéos + SCORM + quiz
        const totalVideoTime=(videoData||[]).reduce((a,v)=>a+(v.watch_time_seconds||0),0);
        const totalScormTime=(scormProgress||[]).reduce((a,s)=>a+parseScormTime(s.total_time),0);
        const totalQuizTime=(quizAttempts||[]).reduce((a,q)=>a+(q.duration_seconds||0),0);
        const totalTime=totalVideoTime+totalScormTime+totalQuizTime;
        
        setStats({
          totalLearners,newLearnersThisWeek,activeLearners,
          totalEnrollments,completedEnrollments,inProgressEnrollments,enrollmentsThisWeek,
          totalScorm,completedScorm,scormThisWeek,avgScormScore,
          totalQuiz,passedQuiz,quizThisWeek,avgQuizScore,
          totalCourses,publishedCourses,
          completionRate,totalTime
        });
        
        // ========== ALERTES ==========
        
        const alertsList=[];
        
        // Apprenants inactifs
        const inactiveLearners=(learners||[]).filter(l=>{
          const hasEnrollment=filteredEnrollments.some(e=>e.learner_id===l.id);
          if(!hasEnrollment)return false;
          const lastActivity=(scormProgress||[]).filter(s=>s.learner_id===l.id).map(s=>s.last_accessed_at).sort().pop();
          return !lastActivity||new Date(lastActivity)<sevenDaysAgo;
        });
        if(inactiveLearners.length>0){
          alertsList.push({type:'warning',icon:'UserX',title:`${inactiveLearners.length} apprenant${inactiveLearners.length>1?'s':''} inactif${inactiveLearners.length>1?'s':''}`,desc:'Aucune activité depuis 7 jours',count:inactiveLearners.length});
        }
        
        // Apprenants en difficulté (score < 50%)
        const learnerScores={};
        (scormProgress||[]).forEach(s=>{
          if(s.score_scaled){
            if(!learnerScores[s.learner_id])learnerScores[s.learner_id]=[];
            learnerScores[s.learner_id].push(s.score_scaled>1?s.score_scaled:s.score_scaled*100);
          }
        });
        const strugglingLearners=Object.entries(learnerScores).filter(([id,scores])=>{
          const avg=scores.reduce((a,b)=>a+b,0)/scores.length;
          return avg<50;
        }).length;
        if(strugglingLearners>0){
          alertsList.push({type:'danger',icon:'AlertTriangle',title:`${strugglingLearners} apprenant${strugglingLearners>1?'s':''} en difficulté`,desc:'Score moyen < 50%',count:strugglingLearners});
        }
        
        // Nouvelles inscriptions
        if(enrollmentsThisWeek>0){
          alertsList.push({type:'info',icon:'UserPlus',title:`${enrollmentsThisWeek} nouvelle${enrollmentsThisWeek>1?'s':''} inscription${enrollmentsThisWeek>1?'s':''}`,desc:'Cette semaine',count:enrollmentsThisWeek});
        }
        
        // Cours presque terminés
        const almostDone=filteredEnrollments.filter(e=>(e.progress_percent||0)>=80&&e.status!=='completed').length;
        if(almostDone>0){
          alertsList.push({type:'success',icon:'TrendingUp',title:`${almostDone} formation${almostDone>1?'s':''} presque terminée${almostDone>1?'s':''}`,desc:'Progression > 80%',count:almostDone});
        }
        
        setAlerts(alertsList);
        
        // ========== TOP APPRENANTS ==========
        
        const learnerStats=(learners||[]).map(l=>{
          const lEnrollments=filteredEnrollments.filter(e=>e.learner_id===l.id);
          const lScorm=(scormProgress||[]).filter(s=>s.learner_id===l.id);
          const lQuiz=(quizAttempts||[]).filter(q=>q.learner_id===l.id);
          const completed=lEnrollments.filter(e=>e.status==='completed').length;
          const total=lEnrollments.length;
          const progress=total>0?Math.round((completed/total)*100):0;
          const scormDone=lScorm.filter(s=>s.completion_status==='completed'||s.completion_status==='passed').length;
          const quizPassed=lQuiz.filter(q=>q.passed).length;
          const lastActivity=[
            ...lEnrollments.map(e=>e.updated_at),
            ...lScorm.map(s=>s.last_accessed_at)
          ].filter(Boolean).sort((a,b)=>new Date(b)-new Date(a))[0];
          
          return{...l,completed,total,progress,scormDone,scormTotal:lScorm.length,quizPassed,quizTotal:lQuiz.length,lastActivity};
        }).filter(l=>l.total>0).sort((a,b)=>b.progress-a.progress);
        
        setTopLearners(learnerStats.slice(0,10));
        
        // ========== ACTIVITÉ RÉCENTE ==========
        
        const activities=[];
        
        // Inscriptions récentes
        filteredEnrollments.filter(e=>new Date(e.created_at)>sevenDaysAgo).forEach(e=>{
          const learner=(learners||[]).find(l=>l.id===e.learner_id);
          activities.push({
            type:'enrollment',
            icon:'UserPlus',
            color:'blue',
            title:`${learner?.first_name||'?'} ${learner?.last_name||'?'}`,
            desc:`inscrit à "${e.playlists?.title||'cours'}"`,
            date:e.created_at
          });
        });
        
        // Cours terminés récemment
        filteredEnrollments.filter(e=>e.status==='completed'&&e.updated_at&&new Date(e.updated_at)>sevenDaysAgo).forEach(e=>{
          const learner=(learners||[]).find(l=>l.id===e.learner_id);
          activities.push({
            type:'completion',
            icon:'CheckCircle',
            color:'green',
            title:`${learner?.first_name||'?'} ${learner?.last_name||'?'}`,
            desc:`a terminé "${e.playlists?.title||'cours'}"`,
            date:e.updated_at
          });
        });
        
        // SCORM réussis
        (scormProgress||[]).filter(s=>s.completion_status==='passed'&&s.last_accessed_at&&new Date(s.last_accessed_at)>sevenDaysAgo).forEach(s=>{
          const learner=(learners||[]).find(l=>l.id===s.learner_id);
          activities.push({
            type:'scorm',
            icon:'Package',
            color:'orange',
            title:`${learner?.first_name||'?'} ${learner?.last_name||'?'}`,
            desc:`SCORM réussi (${Math.round(s.score_scaled>1?s.score_scaled:s.score_scaled*100)}%)`,
            date:s.last_accessed_at
          });
        });
        
        setRecentActivity(activities.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,15));
        
        // ========== STATS PAR CENTRE (Super Admin) ==========
        
        if(isSuperAdmin&&centersData.length>0){
          const centerStats=centersData.map(c=>{
            const cLearners=(learners||[]).filter(l=>l.center_id===c.id).length;
            const cLearnerIds=(learners||[]).filter(l=>l.center_id===c.id).map(l=>l.id);
            const cEnrollments=filteredEnrollments.filter(e=>cLearnerIds.includes(e.learner_id)).length;
            const cCompleted=filteredEnrollments.filter(e=>cLearnerIds.includes(e.learner_id)&&e.status==='completed').length;
            return{...c,learners:cLearners,enrollments:cEnrollments,completed:cCompleted,rate:cEnrollments>0?Math.round((cCompleted/cEnrollments)*100):0};
          }).sort((a,b)=>b.learners-a.learners);
          setQuickStats({centerStats});
        }
        
        setLoading(false);
      },[isSuperAdmin,center?.id]);
      
      useEffect(()=>{load();},[load]);
      
      if(loading)return<Loading/>;
      
      const roleTitle=isSuperAdmin?'Super Administrateur':realRole==='center_admin'?'Administrateur Centre':'Formateur';
      const greeting=new Date().getHours()<12?'Bonjour':new Date().getHours()<18?'Bon après-midi':'Bonsoir';
      
      return<div className="space-y-6">
        {/* Header avec salutation */}
        <div className="flex items-center justify-between">
          <div>
            <h1 className="text-2xl font-bold">{greeting}{profile?.first_name?`, ${profile.first_name}`:''} 👋</h1>
            <p className="text-gray-400">{roleTitle}{center?.name?` • ${center.name}`:isSuperAdmin?' • Tous les centres':''}</p>
          </div>
          <div className="flex items-center gap-3">
            <Button variant="ghost" icon="RefreshCw" onClick={load}>Actualiser</Button>
            {isSuperAdmin&&<Button variant="secondary" icon="Building2" onClick={()=>window.location.hash='centers'}>Gérer les centres</Button>}
          </div>
        </div>
        
        {/* Alertes */}
        {alerts.length>0&&(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            {alerts.map((alert,i)=>(
              <Card key={i} className={`p-4 cursor-pointer hover:scale-[1.02] transition-transform border-l-4 ${
                alert.type==='danger'?'border-l-red-500 bg-red-500/5':
                alert.type==='warning'?'border-l-yellow-500 bg-yellow-500/5':
                alert.type==='success'?'border-l-green-500 bg-green-500/5':
                'border-l-blue-500 bg-blue-500/5'
              }`} onClick={()=>window.location.hash='scorm-tracking'}>
                <div className="flex items-center gap-3">
                  <div className={`w-12 h-12 rounded-xl flex items-center justify-center ${
                    alert.type==='danger'?'bg-red-500/20':
                    alert.type==='warning'?'bg-yellow-500/20':
                    alert.type==='success'?'bg-green-500/20':
                    'bg-blue-500/20'
                  }`}>
                    <Icon name={alert.icon} size={24} className={
                      alert.type==='danger'?'text-red-400':
                      alert.type==='warning'?'text-yellow-400':
                      alert.type==='success'?'text-green-400':
                      'text-blue-400'
                    }/>
                  </div>
                  <div>
                    <p className="font-semibold">{alert.title}</p>
                    <p className="text-xs text-gray-400">{alert.desc}</p>
                  </div>
                </div>
              </Card>
            ))}
          </div>
        )}
        
        {/* Stats principales */}
        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
          <Card className="p-4 text-center bg-gradient-to-br from-indigo-600/20 to-indigo-800/20 border-indigo-500/30">
            <Icon name="Users" size={28} className="mx-auto text-indigo-400 mb-2"/>
            <p className="text-3xl font-bold">{stats.totalLearners}</p>
            <p className="text-xs text-gray-400">Apprenants</p>
            {stats.newLearnersThisWeek>0&&<p className="text-xs text-green-400 mt-1">+{stats.newLearnersThisWeek} cette semaine</p>}
          </Card>
          
          <Card className="p-4 text-center">
            <Icon name="UserCheck" size={28} className="mx-auto text-green-400 mb-2"/>
            <p className="text-3xl font-bold">{stats.activeLearners}</p>
            <p className="text-xs text-gray-400">Actifs (7j)</p>
            <p className="text-xs text-gray-500">{stats.totalLearners>0?Math.round((stats.activeLearners/stats.totalLearners)*100):0}% du total</p>
          </Card>
          
          <Card className="p-4 text-center">
            <Icon name="BookOpen" size={28} className="mx-auto text-blue-400 mb-2"/>
            <p className="text-3xl font-bold">{stats.completedEnrollments}<span className="text-lg text-gray-500">/{stats.totalEnrollments}</span></p>
            <p className="text-xs text-gray-400">Cours terminés</p>
            {stats.enrollmentsThisWeek>0&&<p className="text-xs text-blue-400 mt-1">+{stats.enrollmentsThisWeek} inscriptions</p>}
          </Card>
          
          <Card className="p-4 text-center">
            <Icon name="Target" size={28} className="mx-auto text-purple-400 mb-2"/>
            <p className="text-3xl font-bold">{stats.completionRate}%</p>
            <p className="text-xs text-gray-400">Taux complétion</p>
            <div className="w-full bg-gray-700 rounded-full h-1.5 mt-2">
              <div className="bg-purple-500 rounded-full h-1.5" style={{width:`${stats.completionRate}%`}}/>
            </div>
          </Card>
          
          <Card className="p-4 text-center">
            <Icon name="Package" size={28} className="mx-auto text-orange-400 mb-2"/>
            <p className="text-3xl font-bold">{stats.completedScorm}<span className="text-lg text-gray-500">/{stats.totalScorm}</span></p>
            <p className="text-xs text-gray-400">SCORM réussis</p>
            {stats.avgScormScore>0&&<p className="text-xs text-orange-400 mt-1">Moy: {Math.round(stats.avgScormScore)}%</p>}
          </Card>
          
          <Card className="p-4 text-center">
            <Icon name="Clock" size={28} className="mx-auto text-cyan-400 mb-2"/>
            <p className="text-3xl font-bold">{formatDuration(stats.totalTime)}</p>
            <p className="text-xs text-gray-400">Temps formation</p>
          </Card>
        </div>
        
        {/* Super Admin: Stats par centre */}
        {isSuperAdmin&&quickStats.centerStats&&quickStats.centerStats.length>0&&(
          <Card className="p-6">
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-semibold flex items-center gap-2"><Icon name="Building2" size={20}/>Performance par centre</h3>
              <Button variant="ghost" size="sm" onClick={()=>window.location.hash='centers'}>Voir tous</Button>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full">
                <thead><tr className="text-left text-gray-400 text-sm">
                  <th className="pb-3">Centre</th>
                  <th className="pb-3 text-center">Apprenants</th>
                  <th className="pb-3 text-center">Inscriptions</th>
                  <th className="pb-3 text-center">Terminés</th>
                  <th className="pb-3">Taux</th>
                </tr></thead>
                <tbody className="divide-y divide-gray-700">
                  {quickStats.centerStats.slice(0,5).map(c=>(
                    <tr key={c.id} className="hover:bg-gray-800/50">
                      <td className="py-3 font-medium">{c.name}</td>
                      <td className="py-3 text-center">{c.learners}</td>
                      <td className="py-3 text-center">{c.enrollments}</td>
                      <td className="py-3 text-center text-green-400">{c.completed}</td>
                      <td className="py-3">
                        <div className="flex items-center gap-2">
                          <div className="w-20 bg-gray-700 rounded-full h-2">
                            <div className={`h-2 rounded-full ${c.rate>=70?'bg-green-500':c.rate>=40?'bg-yellow-500':'bg-red-500'}`} style={{width:`${c.rate}%`}}/>
                          </div>
                          <span className="text-sm">{c.rate}%</span>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>
        )}
        
        {/* 2 colonnes: Top apprenants + Activité récente */}
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
          {/* Top apprenants */}
          <Card className="p-6">
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-semibold flex items-center gap-2"><Icon name="Trophy" size={20} className="text-yellow-400"/>Top apprenants</h3>
              <Button variant="ghost" size="sm" onClick={()=>window.location.hash='scorm-tracking'}>Voir tous</Button>
            </div>
            <div className="space-y-3">
              {topLearners.length===0?<p className="text-gray-500 text-center py-4">Aucune donnée</p>:
              topLearners.slice(0,5).map((l,i)=>(
                <div key={l.id} className="flex items-center gap-3 p-3 bg-gray-800/50 rounded-lg hover:bg-gray-800 transition-colors">
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm ${
                    i===0?'bg-yellow-500 text-yellow-900':
                    i===1?'bg-gray-400 text-gray-900':
                    i===2?'bg-orange-600 text-orange-100':
                    'bg-gray-700'
                  }`}>{i+1}</div>
                  <div className="flex-1 min-w-0">
                    <p className="font-medium truncate">{l.first_name} {l.last_name}</p>
                    <p className="text-xs text-gray-400">{l.completed}/{l.total} cours • {l.scormDone} SCORM</p>
                  </div>
                  <div className="text-right">
                    <p className="font-bold text-lg">{l.progress}%</p>
                    <div className="w-16 bg-gray-700 rounded-full h-1.5">
                      <div className="bg-indigo-500 rounded-full h-1.5" style={{width:`${l.progress}%`}}/>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </Card>
          
          {/* Activité récente */}
          <Card className="p-6">
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-semibold flex items-center gap-2"><Icon name="Activity" size={20} className="text-blue-400"/>Activité récente</h3>
            </div>
            <div className="space-y-3 max-h-80 overflow-y-auto">
              {recentActivity.length===0?<p className="text-gray-500 text-center py-4">Aucune activité récente</p>:
              recentActivity.map((a,i)=>(
                <div key={i} className="flex items-start gap-3 p-2">
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${
                    a.color==='green'?'bg-green-500/20':
                    a.color==='orange'?'bg-orange-500/20':
                    a.color==='red'?'bg-red-500/20':
                    'bg-blue-500/20'
                  }`}>
                    <Icon name={a.icon} size={16} className={
                      a.color==='green'?'text-green-400':
                      a.color==='orange'?'text-orange-400':
                      a.color==='red'?'text-red-400':
                      'text-blue-400'
                    }/>
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm"><span className="font-medium">{a.title}</span> <span className="text-gray-400">{a.desc}</span></p>
                    <p className="text-xs text-gray-500">{a.date?new Date(a.date).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}</p>
                  </div>
                </div>
              ))}
            </div>
          </Card>
        </div>
      </div>;
    }

    // ============================================================
    // PAGE: Suivi SCORM (ScormTrackingPage)
    // ============================================================
    function ScormTrackingPage(){
      const{can,center,isSuperAdmin,profile}=useAuth();
      const[loading,setLoading]=useState(true);
      const[activeTab,setActiveTab]=useState('overview');
      const[filter,setFilter]=useState({learner:'all',course:'all',path:'all',search:''});
      const[selectedLearner,setSelectedLearner]=useState(null);
      const[resetting,setResetting]=useState(false);
      
      // Réinitialiser la progression d'un cours pour un apprenant (Super Admin)
      const resetCourseProgress=async(enrollment,learner)=>{
        const confirmMsg=`⚠️ RÉINITIALISER LA PROGRESSION ?\n\nApprenant: ${learner.first_name} ${learner.last_name}\nCours: ${enrollment.playlists?.title}\n\nCette action va remettre à zéro :\n- La progression du cours\n- Les données SCORM associées\n- Les tentatives de quiz\n- La progression vidéo\n\nCette action est irréversible.`;
        if(!confirm(confirmMsg))return;
        
        setResetting(true);
        try{
          await supabase.from('enrollments').update({
            progress_percent:0,status:'not_started',time_spent_seconds:0,completed_at:null,last_activity_at:null
          }).eq('id',enrollment.id);
          try{await supabase.from('scorm_tracking').delete().eq('learner_id',learner.id).eq('enrollment_id',enrollment.id);}catch(e){}
          try{await supabase.from('scorm_progress').delete().eq('learner_id',learner.id).eq('enrollment_id',enrollment.id);}catch(e){}
          try{await supabase.from('quiz_attempts').delete().eq('learner_id',learner.id).eq('enrollment_id',enrollment.id);}catch(e){}
          try{await supabase.from('video_progress').delete().eq('learner_id',learner.id).eq('enrollment_id',enrollment.id);}catch(e){}
          alert('✅ Progression du cours réinitialisée');
          await load();setSelectedLearner(null);
        }catch(err){alert('Erreur: '+err.message);}
        setResetting(false);
      };
      
      // Réinitialiser la progression d'un parcours pour un apprenant (Super Admin)
      const resetPathProgress=async(pathEnrollment,learner)=>{
        const confirmMsg=`⚠️ RÉINITIALISER LE PARCOURS ?\n\nApprenant: ${learner.first_name} ${learner.last_name}\nParcours: ${pathEnrollment.learning_paths?.title}\n\nCette action va remettre à zéro la progression.\n\nCette action est irréversible.`;
        if(!confirm(confirmMsg))return;
        setResetting(true);
        try{
          await supabase.from('path_enrollments').update({progress_percent:0,status:'not_started',completed_at:null}).eq('id',pathEnrollment.id);
          alert('✅ Progression du parcours réinitialisée');
          await load();setSelectedLearner(null);
        }catch(err){alert('Erreur: '+err.message);}
        setResetting(false);
      };
      
      // Réinitialiser TOUTES les données d'un apprenant (Super Admin)
      const resetAllLearnerProgress=async(learner)=>{
        const confirmMsg=`⚠️ ATTENTION - RÉINITIALISATION TOTALE !\n\nApprenant: ${learner.first_name} ${learner.last_name}\n\nCette action va supprimer TOUTES les données de formation.\nL'apprenant devra recommencer depuis le début.\n\nCette action est IRRÉVERSIBLE !`;
        if(!confirm(confirmMsg))return;
        if(!confirm('Êtes-vous vraiment sûr ?'))return;
        setResetting(true);
        try{
          const learnerId=learner.id;
          await supabase.from('enrollments').update({progress_percent:0,status:'not_started',time_spent_seconds:0,completed_at:null,last_activity_at:null}).eq('learner_id',learnerId);
          await supabase.from('path_enrollments').update({progress_percent:0,status:'not_started',completed_at:null}).eq('learner_id',learnerId);
          try{await supabase.from('scorm_tracking').delete().eq('learner_id',learnerId);}catch(e){}
          try{await supabase.from('scorm_progress').delete().eq('learner_id',learnerId);}catch(e){}
          try{await supabase.from('quiz_attempts').delete().eq('learner_id',learnerId);}catch(e){}
          try{await supabase.from('video_progress').delete().eq('learner_id',learnerId);}catch(e){}
          alert('✅ Toutes les données de formation ont été réinitialisées');
          await load();setSelectedLearner(null);
        }catch(err){alert('Erreur: '+err.message);}
        setResetting(false);
      };
      
      // Données
      const[learners,setLearners]=useState([]);
      const[courses,setCourses]=useState([]);
      const[paths,setPaths]=useState([]);
      const[enrollments,setEnrollments]=useState([]);
      const[pathEnrollments,setPathEnrollments]=useState([]);
      const[videoProgress,setVideoProgress]=useState([]);
      const[scormProgress,setScormProgress]=useState([]);
      const[quizAttempts,setQuizAttempts]=useState([]);
      const[modules,setModules]=useState([]);
      
      // Stats globales
      const[stats,setStats]=useState({
        totalLearners:0,activeLearners:0,
        totalEnrollments:0,completedEnrollments:0,
        totalPaths:0,completedPaths:0,
        totalScorm:0,completedScorm:0,passedScorm:0,avgScormScore:0,
        totalQuiz:0,passedQuiz:0,avgQuizScore:0,
        totalWatchTime:0,totalCourseTime:0,totalScormTime:0,totalQuizTime:0
      });

      const load=useCallback(async()=>{
        // Charger les apprenants (filtrés par centre)
        let ql=supabase.from('profiles').select('id,first_name,last_name,email,created_at').eq('role','learner');
        if(!isSuperAdmin&&center?.id)ql=ql.eq('center_id',center.id);
        const{data:lrn}=await ql;
        setLearners(lrn||[]);
        const learnerIds=(lrn||[]).map(l=>l.id);
        
        // Charger les cours (filtrés par centre + contenus LMS partagés)
        let qc=supabase.from('playlists').select('id,title,center_id,is_lms_content');
        if(!isSuperAdmin&&center?.id)qc=qc.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        const{data:crs}=await qc;
        setCourses(crs||[]);
        const courseIds=(crs||[]).map(c=>c.id);
        
        // Charger les parcours (filtrés par centre + contenus LMS partagés)
        let qp=supabase.from('learning_paths').select('id,title,center_id,is_lms_content');
        if(!isSuperAdmin&&center?.id)qp=qp.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        const{data:pth}=await qp;
        setPaths(pth||[]);
        
        // Charger les modules SCORM (filtrés par centre + contenus LMS partagés)
        let qm=supabase.from('scorm_modules').select('id,title,category,center_id,is_lms_content');
        if(!isSuperAdmin&&center?.id)qm=qm.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        const{data:mods}=await qm;
        setModules(mods||[]);
        
        // Charger les inscriptions aux cours
        let qe=supabase.from('enrollments').select('*,playlists:playlist_id(title)');
        if(!isSuperAdmin&&center?.id&&learnerIds.length>0){
          qe=qe.in('learner_id',learnerIds);
        }
        const{data:enr}=await qe;
        const filteredEnr=(enr||[]).filter(e=>learnerIds.includes(e.learner_id));
        setEnrollments(filteredEnr);
        
        // Charger les inscriptions aux parcours
        let qpe=supabase.from('path_enrollments').select('*,learning_paths(id,title)');
        if(learnerIds.length>0){
          qpe=qpe.in('learner_id',learnerIds);
        }
        const{data:pathEnr}=await qpe;
        const filteredPathEnr=(pathEnr||[]).filter(pe=>learnerIds.includes(pe.learner_id));
        setPathEnrollments(filteredPathEnr);
        
        // Charger la progression vidéo
        let qv=supabase.from('video_progress').select('*');
        if(learnerIds.length>0){
          qv=qv.in('learner_id',learnerIds);
        }
        const{data:vp}=await qv;
        setVideoProgress(vp||[]);
        
        // Charger la progression SCORM
        let qs=supabase.from('scorm_progress').select('*');
        if(learnerIds.length>0){
          qs=qs.in('learner_id',learnerIds);
        }
        const{data:sp}=await qs;
        setScormProgress(sp||[]);
        
        // Charger les tentatives de quiz
        let qq=supabase.from('quiz_attempts').select('*,quizzes(title,passing_score)');
        if(learnerIds.length>0){
          qq=qq.in('learner_id',learnerIds);
        }
        const{data:qa}=await qq;
        setQuizAttempts(qa||[]);
        
        // Calculer les stats
        const totalLearners=learnerIds.length;
        const activeLearners=[...new Set([
          ...filteredEnr.map(e=>e.learner_id),
          ...filteredPathEnr.map(pe=>pe.learner_id),
          ...(vp||[]).map(v=>v.learner_id),
          ...(sp||[]).map(s=>s.learner_id)
        ])].length;
        
        const totalEnrollments=filteredEnr.length;
        const completedEnrollments=filteredEnr.filter(e=>e.status==='completed').length;
        
        const totalPaths=filteredPathEnr.length;
        const completedPaths=filteredPathEnr.filter(pe=>pe.status==='completed'||pe.progress_percent===100).length;
        
        const totalScorm=(sp||[]).length;
        const completedScorm=(sp||[]).filter(s=>s.completion_status==='completed'||s.completion_status==='passed').length;
        const passedScorm=(sp||[]).filter(s=>s.completion_status==='passed'||s.success_status==='passed').length;
        const scormWithScore=(sp||[]).filter(s=>s.score_scaled!==null&&s.score_scaled!==undefined);
        const avgScormScore=scormWithScore.length>0?scormWithScore.reduce((a,s)=>{
          const score=s.score_scaled||0;
          return a+(score>1?score:score*100);
        },0)/scormWithScore.length:0;
        
        const totalQuiz=(qa||[]).length;
        const passedQuiz=(qa||[]).filter(q=>q.passed).length;
        const avgQuizScore=totalQuiz>0?(qa||[]).reduce((a,q)=>a+(q.score_percent||0),0)/totalQuiz:0;
        
        const totalWatchTime=(vp||[]).reduce((a,v)=>a+(v.watch_time_seconds||0),0);
        const totalScormTime=(sp||[]).reduce((a,s)=>a+parseScormTime(s.total_time),0);
        const totalQuizTime=(qa||[]).reduce((a,q)=>a+(q.duration_seconds||0),0);
        const totalCourseTime=totalWatchTime+totalScormTime+totalQuizTime;
        
        setStats({
          totalLearners,activeLearners,
          totalEnrollments,completedEnrollments,
          totalPaths,completedPaths,
          totalScorm,completedScorm,passedScorm,avgScormScore,
          totalQuiz,passedQuiz,avgQuizScore,
          totalWatchTime,totalCourseTime,totalScormTime,totalQuizTime
        });
        
        setLoading(false);
      },[isSuperAdmin,center?.id]);

      useEffect(()=>{load();},[load]);

      // Données par apprenant
      const learnerData=useMemo(()=>{
        return learners.map(l=>{
          const lEnrollments=enrollments.filter(e=>e.learner_id===l.id);
          const lPathEnrollments=pathEnrollments.filter(pe=>pe.learner_id===l.id);
          const lVideos=videoProgress.filter(v=>v.learner_id===l.id);
          const lScorm=scormProgress.filter(s=>s.learner_id===l.id);
          const lQuiz=quizAttempts.filter(q=>q.learner_id===l.id);
          
          const coursesCompleted=lEnrollments.filter(e=>e.status==='completed').length;
          const coursesTotal=lEnrollments.length;
          const courseProgress=coursesTotal>0?Math.round((coursesCompleted/coursesTotal)*100):0;
          
          const pathsCompleted=lPathEnrollments.filter(pe=>pe.status==='completed'||pe.progress_percent===100).length;
          const pathsTotal=lPathEnrollments.length;
          const pathProgress=pathsTotal>0?Math.round(lPathEnrollments.reduce((a,pe)=>a+(pe.progress_percent||0),0)/pathsTotal):0;
          
          const scormCompleted=lScorm.filter(s=>s.completion_status==='completed'||s.completion_status==='passed').length;
          const scormPassed=lScorm.filter(s=>s.completion_status==='passed'||s.success_status==='passed').length;
          const scormScores=lScorm.filter(s=>s.score_scaled!==null).map(s=>s.score_scaled>1?s.score_scaled:s.score_scaled*100);
          const avgScorm=scormScores.length>0?Math.round(scormScores.reduce((a,b)=>a+b,0)/scormScores.length):null;
          
          const quizPassed=lQuiz.filter(q=>q.passed).length;
          const quizScores=lQuiz.map(q=>q.score_percent||0);
          const avgQuiz=quizScores.length>0?Math.round(quizScores.reduce((a,b)=>a+b,0)/quizScores.length):null;
          
          // Temps réels (vidéos + SCORM + quiz)
          const watchTime=lVideos.reduce((a,v)=>a+(v.watch_time_seconds||0),0);
          const scormTime=lScorm.reduce((a,s)=>a+parseScormTime(s.total_time),0);
          const quizTime=lQuiz.reduce((a,q)=>a+(q.duration_seconds||0),0);
          const totalTime=watchTime+scormTime+quizTime;
          
          const lastActivity=[
            ...lEnrollments.map(e=>e.updated_at),
            ...lPathEnrollments.map(pe=>pe.updated_at),
            ...lVideos.map(v=>v.updated_at),
            ...lScorm.map(s=>s.last_accessed_at),
            ...lQuiz.map(q=>q.created_at)
          ].filter(Boolean).sort((a,b)=>new Date(b)-new Date(a))[0];
          
          return{
            ...l,
            coursesTotal,coursesCompleted,courseProgress,
            pathsTotal,pathsCompleted,pathProgress,
            scormTotal:lScorm.length,scormCompleted,scormPassed,avgScorm,
            quizTotal:lQuiz.length,quizPassed,avgQuiz,
            totalTime,watchTime,scormTime,quizTime,
            lastActivity,
            enrollments:lEnrollments,
            pathEnrollments:lPathEnrollments,
            scormProgress:lScorm,
            quizAttempts:lQuiz,
            videoProgress:lVideos
          };
        });
      },[learners,enrollments,pathEnrollments,videoProgress,scormProgress,quizAttempts]);

      // Filtrage
      const filteredLearners=useMemo(()=>{
        return learnerData.filter(l=>{
          if(filter.learner!=='all'&&l.id!==filter.learner)return false;
          if(filter.course!=='all'){
            const hasEnrollment=l.enrollments.some(e=>e.playlist_id===filter.course);
            if(!hasEnrollment)return false;
          }
          if(filter.path!=='all'){
            const hasPath=l.pathEnrollments.some(pe=>pe.path_id===filter.path);
            if(!hasPath)return false;
          }
          if(filter.search){
            const s=filter.search.toLowerCase();
            if(!`${l.first_name} ${l.last_name}`.toLowerCase().includes(s)&&
               !l.email?.toLowerCase().includes(s))return false;
          }
          return true;
        });
      },[learnerData,filter]);

      // Export Excel
      const exportExcel=()=>{
        const wb=XLSX.utils.book_new();
        
        // Feuille 1: Résumé par apprenant
        const summaryData=[['Apprenant','Email','Cours inscrits','Cours terminés','Parcours inscrits','Parcours terminés','Modules SCORM','SCORM réussis','Score SCORM','Quiz passés','Score Quiz','Temps total','Dernière activité']];
        filteredLearners.forEach(l=>{
          summaryData.push([
            l.first_name+' '+l.last_name,
            l.email||'',
            l.coursesTotal,
            l.coursesCompleted,
            l.pathsTotal,
            l.pathsCompleted,
            l.scormTotal,
            l.scormPassed,
            l.avgScorm!==null?l.avgScorm+'%':'',
            l.quizPassed+'/'+l.quizTotal,
            l.avgQuiz!==null?l.avgQuiz+'%':'',
            formatDuration(l.totalTime),
            l.lastActivity?new Date(l.lastActivity).toLocaleDateString('fr-FR'):''
          ]);
        });
        const ws1=XLSX.utils.aoa_to_sheet(summaryData);
        ws1['!cols']=[{wch:25},{wch:30},{wch:12},{wch:14},{wch:14},{wch:16},{wch:14},{wch:14},{wch:12},{wch:12},{wch:12},{wch:15},{wch:15}];
        XLSX.utils.book_append_sheet(wb,ws1,'Resume Apprenants');
        
        // Feuille 2: Détail des cours
        const coursesData=[['Apprenant','Email','Cours','Statut','Progression','Temps Vidéo','Temps SCORM','Temps Quiz','Temps Total','Date inscription']];
        enrollments.forEach(e=>{
          const l=learners.find(x=>x.id===e.learner_id);
          // Calculer le temps réel pour cette inscription
          const eVideoTime=videoProgress.filter(v=>v.enrollment_id===e.id).reduce((a,v)=>a+(v.watch_time_seconds||0),0);
          const eScormTime=scormProgress.filter(s=>s.enrollment_id===e.id||s.learner_id===e.learner_id).reduce((a,s)=>a+parseScormTime(s.total_time),0);
          const eQuizTime=quizAttempts.filter(q=>q.enrollment_id===e.id||q.learner_id===e.learner_id).reduce((a,q)=>a+(q.duration_seconds||0),0);
          const eTotalTime=eVideoTime+eScormTime+eQuizTime;
          coursesData.push([
            l?l.first_name+' '+l.last_name:'',
            l?.email||'',
            e.playlists?.title||'',
            e.status==='completed'?'Terminé':e.status==='in_progress'?'En cours':'Non commencé',
            (e.progress_percent||0)+'%',
            formatDuration(eVideoTime),
            formatDuration(eScormTime),
            formatDuration(eQuizTime),
            formatDuration(eTotalTime),
            e.created_at?new Date(e.created_at).toLocaleDateString('fr-FR'):''
          ]);
        });
        const ws2=XLSX.utils.aoa_to_sheet(coursesData);
        ws2['!cols']=[{wch:25},{wch:30},{wch:35},{wch:15},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:15}];
        XLSX.utils.book_append_sheet(wb,ws2,'Detail Cours');
        
        // Feuille 3: Parcours
        const pathsData=[['Apprenant','Email','Parcours','Statut','Progression','Temps Total','Date début']];
        pathEnrollments.forEach(pe=>{
          const l=learners.find(x=>x.id===pe.learner_id);
          // Récupérer les cours du parcours et calculer le temps
          const pathObj=paths.find(p=>p.id===pe.path_id);
          const pathCourseIds=(pathObj?.learning_path_courses||[]).map(lpc=>lpc.playlist_id);
          const pathCourseEnrs=enrollments.filter(e=>pathCourseIds.includes(e.playlist_id)&&e.learner_id===pe.learner_id);
          const pathEnrIds=pathCourseEnrs.map(e=>e.id);
          const peVideoTime=videoProgress.filter(v=>pathEnrIds.includes(v.enrollment_id)).reduce((a,v)=>a+(v.watch_time_seconds||0),0);
          const peScormTime=scormProgress.filter(s=>pathEnrIds.includes(s.enrollment_id)||s.learner_id===pe.learner_id).reduce((a,s)=>a+parseScormTime(s.total_time),0);
          const peQuizTime=quizAttempts.filter(q=>pathEnrIds.includes(q.enrollment_id)||q.learner_id===pe.learner_id).reduce((a,q)=>a+(q.duration_seconds||0),0);
          const peTotalTime=peVideoTime+peScormTime+peQuizTime;
          pathsData.push([
            l?l.first_name+' '+l.last_name:'',
            l?.email||'',
            pe.learning_paths?.title||'Parcours',
            pe.status==='completed'||pe.progress_percent===100?'Terminé':pe.progress_percent>0?'En cours':'Non commencé',
            (pe.progress_percent||0)+'%',
            formatDuration(peTotalTime),
            pe.started_at?new Date(pe.started_at).toLocaleDateString('fr-FR'):''
          ]);
        });
        const ws3=XLSX.utils.aoa_to_sheet(pathsData);
        ws3['!cols']=[{wch:25},{wch:30},{wch:35},{wch:15},{wch:12},{wch:15},{wch:15}];
        XLSX.utils.book_append_sheet(wb,ws3,'Parcours');
        
        // Feuille 4: SCORM
        const scormData=[['Apprenant','Email','Module','Statut','Succès','Score','Temps','Date']];
        scormProgress.forEach(s=>{
          const l=learners.find(x=>x.id===s.learner_id);
          const m=modules.find(x=>x.id===s.module_id);
          const score=s.score_scaled!==null?(s.score_scaled>1?s.score_scaled:Math.round(s.score_scaled*100)):null;
          scormData.push([
            l?l.first_name+' '+l.last_name:'',
            l?.email||'',
            m?.title||'Module '+s.module_id,
            SCORM_STATUS_LABELS[s.completion_status]||s.completion_status||'',
            s.success_status||'',
            score!==null?score+'%':'',
            formatDuration(parseScormTime(s.total_time)),
            s.last_accessed_at?new Date(s.last_accessed_at).toLocaleDateString('fr-FR'):''
          ]);
        });
        const ws4=XLSX.utils.aoa_to_sheet(scormData);
        ws4['!cols']=[{wch:25},{wch:30},{wch:35},{wch:15},{wch:12},{wch:10},{wch:12},{wch:12}];
        XLSX.utils.book_append_sheet(wb,ws4,'SCORM');
        
        // Feuille 5: Quiz
        const quizData=[['Apprenant','Email','Quiz','Score','Réussi','Date']];
        quizAttempts.forEach(q=>{
          const l=learners.find(x=>x.id===q.learner_id);
          quizData.push([
            l?l.first_name+' '+l.last_name:'',
            l?.email||'',
            q.quizzes?.title||'Quiz',
            (q.score_percent||0)+'%',
            q.passed?'Oui':'Non',
            q.created_at?new Date(q.created_at).toLocaleDateString('fr-FR'):''
          ]);
        });
        const ws5=XLSX.utils.aoa_to_sheet(quizData);
        ws5['!cols']=[{wch:25},{wch:30},{wch:35},{wch:10},{wch:10},{wch:12}];
        XLSX.utils.book_append_sheet(wb,ws5,'Quiz');
        
        // Feuille 6: Assiduité
        const assiduiteData=[['Apprenant','Email','Temps formation total','Temps vidéo','Temps SCORM','Temps Quiz','Nb cours','Nb parcours','Nb SCORM','Nb Quiz']];
        filteredLearners.forEach(l=>{
          assiduiteData.push([
            l.first_name+' '+l.last_name,
            l.email||'',
            formatDuration(l.totalTime),
            formatDuration(l.watchTime),
            formatDuration(l.scormTime),
            formatDuration(l.quizTime),
            l.coursesTotal,
            l.pathsTotal,
            l.scormTotal,
            l.quizTotal
          ]);
        });
        const ws6=XLSX.utils.aoa_to_sheet(assiduiteData);
        ws6['!cols']=[{wch:25},{wch:30},{wch:18},{wch:15},{wch:15},{wch:15},{wch:10},{wch:12},{wch:10},{wch:10}];
        XLSX.utils.book_append_sheet(wb,ws6,'Assiduite');
        
        // Télécharger
        const filename='suivi-formation-'+new Date().toISOString().slice(0,10)+'.xlsx';
        XLSX.writeFile(wb,filename);
      };

      // Ouvrir le détail d'un apprenant
      const openLearnerDetail=(learner)=>{
        setSelectedLearner(learner);
      };

      if(!can('view_analytics')&&!can('manage_enrollments')&&!can('view_learner_progress'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;
      
      // Calculer les alertes (calcul direct, pas de hook)
      const alerts=(()=>{
        const list=[];
        const now=new Date();
        const sevenDaysAgo=new Date(now-7*24*60*60*1000);
        const threeDaysAgo=new Date(now-3*24*60*60*1000);
        
        // Apprenants inactifs (>7 jours sans activité)
        const inactiveLearners=learnerData.filter(l=>{
          if(!l.lastActivity)return l.coursesTotal>0;
          return new Date(l.lastActivity)<sevenDaysAgo&&l.coursesCompleted<l.coursesTotal;
        });
        if(inactiveLearners.length>0){
          list.push({
            type:'warning',
            icon:'UserX',
            title:`${inactiveLearners.length} apprenant${inactiveLearners.length>1?'s':''} inactif${inactiveLearners.length>1?'s':''}`,
            desc:'Plus de 7 jours sans activité',
            action:()=>setFilter({...filter,search:''}),
            learners:inactiveLearners.slice(0,3)
          });
        }
        
        // Apprenants en difficulté (score SCORM < 50%)
        const strugglingLearners=learnerData.filter(l=>l.avgScorm!==null&&l.avgScorm<50&&l.scormTotal>0);
        if(strugglingLearners.length>0){
          list.push({
            type:'danger',
            icon:'AlertTriangle',
            title:`${strugglingLearners.length} apprenant${strugglingLearners.length>1?'s':''} en difficulté`,
            desc:'Score SCORM moyen < 50%',
            learners:strugglingLearners.slice(0,3)
          });
        }
        
        // Nouveaux apprenants cette semaine
        const newLearners=learnerData.filter(l=>{
          const enrolled=enrollments.find(e=>e.learner_id===l.id);
          return enrolled&&new Date(enrolled.created_at)>sevenDaysAgo;
        });
        if(newLearners.length>0){
          list.push({
            type:'info',
            icon:'UserPlus',
            title:`${newLearners.length} nouvelle${newLearners.length>1?'s':''} inscription${newLearners.length>1?'s':''}`,
            desc:'Cette semaine',
            learners:newLearners.slice(0,3)
          });
        }
        
        // Cours presque terminés (>80%)
        const almostDone=learnerData.filter(l=>l.courseProgress>=80&&l.courseProgress<100&&l.coursesTotal>0);
        if(almostDone.length>0){
          list.push({
            type:'success',
            icon:'TrendingUp',
            title:`${almostDone.length} apprenant${almostDone.length>1?'s':''} presque terminé${almostDone.length>1?'s':''}`,
            desc:'Progression > 80%',
            learners:almostDone.slice(0,3)
          });
        }
        
        return list;
      })();
      
      // Tendances (cette semaine vs semaine précédente) - calcul direct
      const trends=(()=>{
        const now=new Date();
        const thisWeekStart=new Date(now-7*24*60*60*1000);
        const lastWeekStart=new Date(now-14*24*60*60*1000);
        
        const thisWeekScorm=scormProgress.filter(s=>s.last_accessed_at&&new Date(s.last_accessed_at)>thisWeekStart).length;
        const lastWeekScorm=scormProgress.filter(s=>s.last_accessed_at&&new Date(s.last_accessed_at)>lastWeekStart&&new Date(s.last_accessed_at)<=thisWeekStart).length;
        
        const thisWeekQuiz=quizAttempts.filter(q=>new Date(q.created_at)>thisWeekStart).length;
        const lastWeekQuiz=quizAttempts.filter(q=>new Date(q.created_at)>lastWeekStart&&new Date(q.created_at)<=thisWeekStart).length;
        
        const thisWeekEnrollments=enrollments.filter(e=>new Date(e.created_at)>thisWeekStart).length;
        const lastWeekEnrollments=enrollments.filter(e=>new Date(e.created_at)>lastWeekStart&&new Date(e.created_at)<=thisWeekStart).length;
        
        // Calcul du changement: si semaine précédente = 0 et cette semaine > 0, afficher +100%
        const calcChange=(current,previous)=>{
          if(previous===0&&current===0)return 0;
          if(previous===0&&current>0)return 100;
          return Math.round(((current-previous)/previous)*100);
        };
        
        return{
          scorm:{current:thisWeekScorm,previous:lastWeekScorm,change:calcChange(thisWeekScorm,lastWeekScorm)},
          quiz:{current:thisWeekQuiz,previous:lastWeekQuiz,change:calcChange(thisWeekQuiz,lastWeekQuiz)},
          enrollments:{current:thisWeekEnrollments,previous:lastWeekEnrollments,change:calcChange(thisWeekEnrollments,lastWeekEnrollments)}
        };
      })();

      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4">

          <div className="flex gap-2">

                alert.type==='success'?'border-l-green-500 bg-green-500/5':
                'border-l-blue-500 bg-blue-500/5'
              }`}>
                <div className="flex items-start gap-3">
                  <div className={`w-10 h-10 rounded-lg flex items-center justify-center shrink-0 ${
                    alert.type==='danger'?'bg-red-500/20':
                    alert.type==='warning'?'bg-yellow-500/20':
                    alert.type==='success'?'bg-green-500/20':
                    'bg-blue-500/20'
                  }`}>
                    <Icon name={alert.icon} size={20} className={
                      alert.type==='danger'?'text-red-400':
                      alert.type==='warning'?'text-yellow-400':
                      alert.type==='success'?'text-green-400':
                      'text-blue-400'
                    }/>
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className="font-semibold text-sm">{alert.title}</p>
                    <p className="text-xs text-gray-400">{alert.desc}</p>
                    {alert.learners&&alert.learners.length>0&&(
                      <div className="flex flex-wrap gap-1 mt-2">
                        {alert.learners.map(l=>(
                          <span key={l.id} className="text-xs px-2 py-0.5 bg-gray-700 rounded-full truncate max-w-[120px]" title={l.first_name+' '+l.last_name}>
                            {l.first_name}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </Card>
            ))}
          </div>
        )}
        
        {/* Tendances de la semaine */}
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <Card className="p-4">
            <div className="flex items-center justify-between">
              <div>
                <p className="text-xs text-gray-400 uppercase">Activité SCORM</p>
                <p className="text-2xl font-bold">{trends.scorm.current}</p>
                <p className="text-xs text-gray-500">cette semaine</p>
              </div>
              <div className={`flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium ${
                trends.scorm.change>0?'bg-green-500/20 text-green-400':
                trends.scorm.change<0?'bg-red-500/20 text-red-400':
                'bg-gray-500/20 text-gray-400'
              }`}>
                <Icon name={trends.scorm.change>0?'TrendingUp':trends.scorm.change<0?'TrendingDown':'Minus'} size={14}/>
                {trends.scorm.change>0?'+':''}{trends.scorm.change}%
              </div>
            </div>
          </Card>
          <Card className="p-4">
            <div className="flex items-center justify-between">
              <div>
                <p className="text-xs text-gray-400 uppercase">Quiz passés</p>
                <p className="text-2xl font-bold">{trends.quiz.current}</p>
                <p className="text-xs text-gray-500">cette semaine</p>
              </div>
              <div className={`flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium ${
                trends.quiz.change>0?'bg-green-500/20 text-green-400':
                trends.quiz.change<0?'bg-red-500/20 text-red-400':
                'bg-gray-500/20 text-gray-400'
              }`}>
                <Icon name={trends.quiz.change>0?'TrendingUp':trends.quiz.change<0?'TrendingDown':'Minus'} size={14}/>
                {trends.quiz.change>0?'+':''}{trends.quiz.change}%
              </div>
            </div>
          </Card>
          <Card className="p-4">
            <div className="flex items-center justify-between">
              <div>
                <p className="text-xs text-gray-400 uppercase">Inscriptions</p>
                <p className="text-2xl font-bold">{trends.enrollments.current}</p>
                <p className="text-xs text-gray-500">cette semaine</p>
              </div>
              <div className={`flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium ${
                trends.enrollments.change>0?'bg-green-500/20 text-green-400':
                trends.enrollments.change<0?'bg-red-500/20 text-red-400':
                'bg-gray-500/20 text-gray-400'
              }`}>
                <Icon name={trends.enrollments.change>0?'TrendingUp':trends.enrollments.change<0?'TrendingDown':'Minus'} size={14}/>
                {trends.enrollments.change>0?'+':''}{trends.enrollments.change}%
              </div>

          </Card>
        </div>

        {/* Stats globales */}
        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-9 gap-4 mb-6">

            <Icon name="Users" size={24} className="mx-auto text-indigo-400 mb-2"/>
            <p className="text-2xl font-bold">{stats.activeLearners}<span className="text-base text-gray-500">/{stats.totalLearners}</span></p>
            <p className="text-xs text-gray-400">Apprenants actifs</p>
          </Card>
          <Card className="p-4 text-center">

          <Card className="p-4 text-center">
            <Icon name="Clock" size={24} className="mx-auto text-cyan-400 mb-2"/>
            <p className="text-2xl font-bold">{formatDuration(stats.totalCourseTime)}</p>

            <p className="text-xs text-gray-400">Temps vidéo</p>

          <Card className="p-4 text-center">
            <Icon name="Package" size={24} className="mx-auto text-orange-400 mb-2"/>
            <p className="text-2xl font-bold">{formatDuration(stats.totalScormTime)}</p>
            <p className="text-xs text-gray-400">Temps SCORM</p>
          </Card>
          <Card className="p-4 text-center">
            <Icon name="HelpCircle" size={24} className="mx-auto text-pink-400 mb-2"/>
            <p className="text-2xl font-bold">{formatDuration(stats.totalQuizTime)}</p>

            </Card>

              <h3 className="font-semibold mb-4">Activité récente</h3>
              <div className="space-y-3">
                {learnerData.filter(l=>l.lastActivity).sort((a,b)=>new Date(b.lastActivity)-new Date(a.lastActivity)).slice(0,5).map(l=>(
                  <div key={l.id} className="flex items-center gap-3 p-2 bg-gray-700/50 rounded-lg">
                    <div className="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center"><Icon name="User" size={18}/></div>
                    <div className="flex-1 min-w-0">
                      <p className="font-medium truncate">{l.first_name} {l.last_name}</p>
                      <p className="text-xs text-gray-400">{l.lastActivity?new Date(l.lastActivity).toLocaleString('fr-FR'):'-'}</p>
                    </div>
                    <span className="text-xs text-gray-500">{formatDuration(l.totalTime)}</span>
                  </div>
                ))}
              </div>
            </Card>
          </div>
        )}

        {/* Par apprenant */}
        {activeTab==='learners'&&(
          <Card>
            <div className="overflow-x-auto">
              <table className="w-full">
                <thead className="bg-gray-750"><tr>
                  <th className="text-left p-4 font-medium text-gray-400">Apprenant</th>
                  <th className="text-left p-4 font-medium text-gray-400">Cours</th>
                  <th className="text-left p-4 font-medium text-gray-400">Parcours</th>
                  <th className="text-left p-4 font-medium text-gray-400">SCORM</th>
                  <th className="text-left p-4 font-medium text-gray-400">Quiz</th>
                  <th className="text-left p-4 font-medium text-gray-400">Temps</th>
                  <th className="text-left p-4 font-medium text-gray-400">Dernière activité</th>

                </tr></thead>
                <tbody className="divide-y divide-gray-700">
                  {filteredLearners.length===0?<tr><td colSpan="8" className="p-8 text-center text-gray-500">Aucun apprenant</td></tr>:
                  filteredLearners.map(l=>(
                    <tr key={l.id} className="hover:bg-gray-750/50">
                      <td className="p-4">

                        <p className="text-sm text-gray-400">{l.email}</p>

                      <td className="p-4">
                        <div className="flex items-center gap-2">
                          <span className="font-medium">{l.coursesCompleted}/{l.coursesTotal}</span>
                          <div className="w-16"><ProgressBar percent={l.courseProgress} size="sm" showLabel={false}/></div>
                        </div>
                      </td>
                      <td className="p-4">
                        <div className="flex items-center gap-2">
                          <span className={l.pathsTotal>0?'font-medium':'text-gray-500'}>{l.pathsCompleted}/{l.pathsTotal}</span>

                      <td className="p-4 text-right"><Button variant="ghost" size="sm" icon="Eye" onClick={()=>openLearnerDetail(l)}>Détails</Button></td>

              const inProgress=cEnr.filter(e=>e.status==='in_progress').length;
              const avgProgress=cEnr.length>0?Math.round(cEnr.reduce((a,e)=>a+(e.progress_percent||0),0)/cEnr.length):0;

        {/* Quiz */}
        {activeTab==='quiz'&&(
          <Card>
            <div className="overflow-x-auto">
              <table className="w-full">

                <tbody className="divide-y divide-gray-700">
                  {quizAttempts.length===0?<tr><td colSpan="5" className="p-8 text-center text-gray-500">Aucune tentative de quiz</td></tr>:

          </Card>
        )}

        {/* Modal détail apprenant */}
        <Modal isOpen={!!selectedLearner} onClose={()=>setSelectedLearner(null)} title={selectedLearner?`${selectedLearner.first_name} ${selectedLearner.last_name}`:''} size="xl">
          {selectedLearner&&(
            <div className="space-y-6">
              {/* Stats résumé */}
              <div className="grid grid-cols-5 gap-4">
                <div className="text-center p-3 bg-gray-700/50 rounded-lg">
                  <p className="text-2xl font-bold text-indigo-400">{selectedLearner.coursesCompleted}/{selectedLearner.coursesTotal}</p>
                  <p className="text-xs text-gray-400">Cours</p>
