    function SessionsPage(){
      const{can,center,isSuperAdmin,profile}=useAuth();
      const[loading,setLoading]=useState(true);
      const[sessions,setSessions]=useState([]);
      const[courses,setCourses]=useState([]);
      const[paths,setPaths]=useState([]);
      const[learners,setLearners]=useState([]);
      const[trainers,setTrainers]=useState([]);
      const[centerLicenses,setCenterLicenses]=useState([]);
      const[allVideos,setAllVideos]=useState([]);
      const[allScorm,setAllScorm]=useState([]);
      const[allQuizzes,setAllQuizzes]=useState([]);
      const[filter,setFilter]=useState({status:'all',search:''});
      const[modal,setModal]=useState(null); // 'create', 'edit', 'participants', 'trainers', 'import', 'contents'
      const[selectedSession,setSelectedSession]=useState(null);
      const[importData,setImportData]=useState({sessionId:'',file:null,results:null,processing:false});
      const[form,setForm]=useState({
        name:'',description:'',code:'',
        license_id:'',
        content_type:'course',content_id:'',
        start_date:'',end_date:'',start_time:'',end_time:'',
        location:'',location_type:'online',max_participants:'',
        status:'planned',auto_enroll:true,certificate_enabled:true
      });
      // Multi-content for session_contents
      const[sessionContents,setSessionContents]=useState([]);
      const[licensePack,setLicensePack]=useState(null); // pack items for selected license
      const[saving,setSaving]=useState(false);
      const[contentPickerTab,setContentPickerTab]=useState('video');
      const[contentPickerSearch,setContentPickerSearch]=useState('');
      
      const load=useCallback(async()=>{
        // Charger les sessions avec fallback si les relations échouent
        let sessionsData=null;
        try{
          let qs=supabase.from('training_sessions').select(`
            *,
            session_trainers(id,trainer_id,role,profiles:trainer_id(first_name,last_name,email)),
            session_participants(id,learner_id,status,enrollment_id,profiles:learner_id(first_name,last_name,email))
          `).order('start_date',{ascending:false});
          if(!isSuperAdmin&&center?.id)qs=qs.eq('center_id',center.id);
          const{data,error}=await qs;
          if(error)throw error;
          sessionsData=data;
        }catch(e){
          console.warn('Nested session query failed, using fallback:',e);
          // Fallback: query without nested relations
          let qs2=supabase.from('training_sessions').select('*').order('start_date',{ascending:false});
          if(!isSuperAdmin&&center?.id)qs2=qs2.eq('center_id',center.id);
          const{data:fallback}=await qs2;
          sessionsData=fallback||[];
          // Load relations separately
          const sids=sessionsData.map(s=>s.id);
          if(sids.length>0){
            try{
              const{data:trainers}=await supabase.from('session_trainers').select('id,trainer_id,session_id,role,profiles:trainer_id(first_name,last_name,email)').in('session_id',sids);
              const{data:parts}=await supabase.from('session_participants').select('id,learner_id,session_id,status,enrollment_id,profiles:learner_id(first_name,last_name,email)').in('session_id',sids);
              sessionsData=sessionsData.map(s=>({
                ...s,
                session_trainers:(trainers||[]).filter(t=>t.session_id===s.id),
                session_participants:(parts||[]).filter(p=>p.session_id===s.id)
              }));
            }catch(e2){
              console.warn('Session relations load failed:',e2);
              sessionsData=sessionsData.map(s=>({...s,session_trainers:[],session_participants:[]}));
            }
          }
        }
        
        // Charger session_contents séparément (Phase 1 - table may not exist)
        const sessionIds=(sessionsData||[]).map(s=>s.id);
        let allSessionContents=[];
        if(sessionIds.length>0){
          try{
            const{data:scData,error:scErr}=await supabase.from('session_contents').select('*').in('session_id',sessionIds);
            if(!scErr)allSessionContents=scData||[];
          }catch(e){console.warn('session_contents table not available:',e);}
        }
        
        // Charger les licences liées
        const licenseIds=[...new Set((sessionsData||[]).map(s=>s.license_id).filter(Boolean))];
        let licensesMap={};
        if(licenseIds.length>0){
          const{data:licData}=await supabase.from('center_licenses').select('*,content_packs(name,code)').in('id',licenseIds);
          (licData||[]).forEach(l=>{licensesMap[l.id]=l;});
        }
        
        // Charger les cours
        let qc=supabase.from('playlists').select('id,title').eq('is_published',true);
        if(!isSuperAdmin&&center?.id)qc=qc.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        const{data:coursesData}=await qc;
        
        // Charger les parcours
        let qp=supabase.from('learning_paths').select('id,title').eq('is_published',true);
        if(!isSuperAdmin&&center?.id)qp=qp.eq('center_id',center.id);
        const{data:pathsData}=await qp;
        
        // Charger les apprenants
        let ql=supabase.from('profiles').select('id,first_name,last_name,email').eq('role','learner');
        if(!isSuperAdmin&&center?.id)ql=ql.eq('center_id',center.id);
        const{data:learnersData}=await ql;
        
        // Charger les formateurs
        let qt=supabase.from('profiles').select('id,first_name,last_name,email').in('role',['trainer','center_admin']);
        if(!isSuperAdmin&&center?.id)qt=qt.eq('center_id',center.id);
        const{data:trainersData}=await qt;
        
        // Charger les licences actives du centre
        const today=new Date().toISOString().split('T')[0];
        let qlc=supabase.from('center_licenses').select('*,content_packs(id,name,code,pack_type)').eq('status','active').lte('start_date',today).gte('end_date',today);
        if(!isSuperAdmin&&center?.id)qlc=qlc.eq('center_id',center.id);
        const{data:licData}=await qlc;
        setCenterLicenses(licData||[]);
        
        // Charger vidéos, SCORM, quiz pour multi-content
        const[{data:vids},{data:scorms},{data:qzs}]=await Promise.all([
          supabase.from('videos').select('id,title').eq('is_lms_content',true).order('title'),
          supabase.from('scorm_modules').select('id,title').eq('is_lms_content',true).order('title'),
          supabase.from('quizzes').select('id,title').eq('is_lms_content',true).order('title')
        ]);
        setAllVideos(vids||[]);
        setAllScorm(scorms||[]);
        setAllQuizzes(qzs||[]);
        
        // Enrichir les sessions avec les noms de contenu
        const enrichedSessions=(sessionsData||[]).map(s=>{
          const lic=s.license_id?licensesMap[s.license_id]:null;
          const sContents=allSessionContents.filter(sc=>sc.session_id===s.id);
          // Compter les apprenants actifs dans toutes les sessions de la même licence
          let licenseLearnersCount=0;
          if(s.license_id){
            const sameLicSessions=(sessionsData||[]).filter(ss=>ss.license_id===s.license_id);
            const uniqueLearners=new Set();
            sameLicSessions.forEach(ss=>(ss.session_participants||[]).forEach(p=>{if(p.status==='enrolled')uniqueLearners.add(p.learner_id);}));
            licenseLearnersCount=uniqueLearners.size;
          }
          return{
            ...s,
            session_contents:sContents,
            center_licenses:lic,
            content_title:s.content_type==='course'
              ?(coursesData||[]).find(c=>c.id===s.content_id)?.title
              :(pathsData||[]).find(p=>p.id===s.content_id)?.title,
            trainers_count:s.session_trainers?.length||0,
            participants_count:s.session_participants?.length||0,
            contents_count:sContents.length,
            license_name:lic?.content_packs?.name||null,
            license_max:lic?.max_learners||null,
            license_learners:licenseLearnersCount,
            license_end:lic?.end_date||null,
            license_status:lic?.status||null
          };
        });
        
        setSessions(enrichedSessions);
        setCourses(coursesData||[]);
        setPaths(pathsData||[]);
        setLearners(learnersData||[]);
        setTrainers(trainersData||[]);
        setLoading(false);
      },[isSuperAdmin,center?.id]);
      
      useEffect(()=>{load();},[load]);
      
      // Télécharger le template Excel
      const downloadTemplate=()=>{
        const template=[
          ['Prénom','Nom','Email','Téléphone (optionnel)'],
          ['Jean','Dupont','jean.dupont@email.com','0612345678'],
          ['Marie','Martin','marie.martin@email.com','']
        ];
        const ws=XLSX.utils.aoa_to_sheet(template);
        ws['!cols']=[{wch:15},{wch:15},{wch:30},{wch:18}];
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Apprenants');
        XLSX.writeFile(wb,'template-import-apprenants.xlsx');
      };
      
      // Traiter l'import Excel
      const processImport=async()=>{
        if(!importData.sessionId||!importData.file){
          alert('Veuillez sélectionner une session et un fichier');return;
        }
        
        setImportData(d=>({...d,processing:true,results:null}));
        
        try{
          // Lire le fichier Excel
          const data=await importData.file.arrayBuffer();
          const workbook=XLSX.read(data);
          const sheet=workbook.Sheets[workbook.SheetNames[0]];
          const rows=XLSX.utils.sheet_to_json(sheet,{header:1});
          
          // Ignorer l'en-tête
          const dataRows=rows.slice(1).filter(row=>row[0]&&row[1]&&row[2]);
          
          if(dataRows.length===0){
            alert('Aucune donnée valide trouvée dans le fichier');
            setImportData(d=>({...d,processing:false}));
            return;
          }
          
          // Récupérer la session pour le center_id
          const session=sessions.find(s=>s.id===importData.sessionId);
          if(!session){
            alert('Session non trouvée');
            setImportData(d=>({...d,processing:false}));
            return;
          }
          
          const results={
            total:dataRows.length,
            created:[],
            existing:[],
            errors:[]
          };
          
          for(const row of dataRows){
            const firstName=(row[0]||'').toString().trim();
            const lastName=(row[1]||'').toString().trim();
            const email=(row[2]||'').toString().toLowerCase().trim();
            const phone=(row[3]||'').toString().trim();
            
            if(!firstName||!lastName||!email){
              results.errors.push({email:email||'(vide)',error:'Données incomplètes'});
              continue;
            }
            
            // Vérifier si l'email existe déjà
            const{data:existingProfile}=await supabase.from('profiles').select('id').eq('email',email).single();
            
            if(existingProfile){
              // Apprenant existant - juste l'inscrire à la session
              const{error:participantErr}=await supabase.from('session_participants').upsert({
                session_id:importData.sessionId,
                learner_id:existingProfile.id,
                status:'enrolled',
                enrolled_by:profile?.id
              },{onConflict:'session_id,learner_id'});
              
              if(participantErr){
                results.errors.push({email,error:'Erreur inscription: '+participantErr.message});
              }else{
                results.existing.push({email,name:`${firstName} ${lastName}`});
              }
            }else{
              // Nouvel apprenant - créer le compte
              const tempPassword=generatePassword();
              
              const{data:authData,error:authErr}=await supabase.auth.signUp({
                email,
                password:tempPassword,
                options:{
                  data:{
                    first_name:firstName,
                    last_name:lastName,
                    role:'learner',
                    center_id:session.center_id
                  }
                }
              });
              
              if(authErr){
                results.errors.push({email,error:authErr.message});
                continue;
              }
              
              if(authData.user){
                // Créer le profil
                await supabase.from('profiles').upsert({
                  id:authData.user.id,
                  email,
                  first_name:firstName,
                  last_name:lastName,
                  phone:phone||null,
                  role:'learner',
                  center_id:session.center_id
                });
                
                // Inscrire à la session (le trigger créera l'enrollment)
                await supabase.from('session_participants').insert({
                  session_id:importData.sessionId,
                  learner_id:authData.user.id,
                  status:'enrolled',
                  enrolled_by:profile?.id
                });
                
                results.created.push({
                  email,
                  name:`${firstName} ${lastName}`,
                  password:tempPassword
                });
              }
            }
          }
          
          setImportData(d=>({...d,processing:false,results}));
          load(); // Recharger les données
          
        }catch(err){
          alert('Erreur lors de l\'import: '+err.message);
          setImportData(d=>({...d,processing:false}));
        }
      };
      
      // Exporter les résultats d'import (avec mots de passe)
      const exportImportResults=()=>{
        if(!importData.results)return;
        
        const data=[['Statut','Nom','Email','Mot de passe temporaire']];
        
        importData.results.created.forEach(r=>{
          data.push(['✅ Créé',r.name,r.email,r.password]);
        });
        importData.results.existing.forEach(r=>{
          data.push(['ℹ️ Existant (inscrit)',r.name,r.email,'(compte existant)']);
        });
        importData.results.errors.forEach(r=>{
          data.push(['❌ Erreur','-',r.email,r.error]);
        });
        
        const ws=XLSX.utils.aoa_to_sheet(data);
        ws['!cols']=[{wch:20},{wch:25},{wch:30},{wch:25}];
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Résultats');
        XLSX.writeFile(wb,`import-resultats-${new Date().toISOString().slice(0,10)}.xlsx`);
      };
      
      // Filtrer les sessions
      const filteredSessions=sessions.filter(s=>{
        if(filter.status!=='all'&&s.status!==filter.status)return false;
        if(filter.search){
          const search=filter.search.toLowerCase();
          if(!s.name?.toLowerCase().includes(search)&&
             !s.code?.toLowerCase().includes(search)&&
             !s.content_title?.toLowerCase().includes(search))return false;
        }
        return true;
      });
      
      // Charger les items du pack d'une licence
      const loadPackItems=useCallback(async(licenseId)=>{
        if(!licenseId){setLicensePack(null);return;}
        const lic=centerLicenses.find(l=>l.id===licenseId);
        if(!lic)return;
        
        // Full catalog (any type)
        if(lic.content_packs?.pack_type==='full_catalog'||(lic.license_type==='full_catalog')||(lic.license_type==='resource_volume'&&lic.full_catalog===true)){
          setLicensePack({type:'full_catalog',items:[]});
          return;
        }
        
        // Resource volume license → query license_resources
        if(lic.license_type==='resource_volume'){
          try{
            const{data:resources}=await supabase.from('license_resources').select('content_type,content_id').eq('license_id',lic.id);
            setLicensePack({type:'volume',items:(resources||[]).map(r=>({content_type:r.content_type,content_id:r.content_id})),count:resources?.length||0});
          }catch(e){
            console.warn('license_resources not available:',e);
            setLicensePack({type:'volume',items:[],count:0});
          }
          return;
        }
        
        // Content pack license → query content_pack_items
        if(lic.pack_id){
          const{data:items}=await supabase.from('content_pack_items').select('content_type,content_id').eq('pack_id',lic.pack_id);
          setLicensePack({type:'bundle',items:items||[],packName:lic.content_packs?.name});
          return;
        }
        
        // No pack, no volume → full catalog by default
        setLicensePack({type:'full_catalog',items:[]});
      },[centerLicenses]);
      
      // Vérifier si un contenu est dans le pack de la licence sélectionnée
      const isInLicensePack=(type,id)=>{
        if(!licensePack)return true; // no license = no filter
        if(licensePack.type==='full_catalog')return true;
        // Both bundle and volume use same items array format
        return licensePack.items.some(i=>i.content_type===type&&i.content_id===id);
      };
      
      // Toggle contenu dans sessionContents
      const toggleSessionContent=(type,id,title)=>{
        setSessionContents(prev=>{
          const idx=prev.findIndex(c=>c.content_type===type&&c.content_id===id);
          if(idx>=0)return prev.filter((_,i)=>i!==idx);
          return[...prev,{content_type:type,content_id:id,title,sort_order:prev.length,is_required:true}];
        });
      };
      
      const isContentSelected=(type,id)=>sessionContents.some(c=>c.content_type===type&&c.content_id===id);
      
      // Créer/Modifier une session
      const saveSession=async()=>{
        if(!form.name||!form.start_date){
          alert('Veuillez remplir le nom et la date de début');return;
        }
        // Vérifier qu'il y a au moins un contenu (ancien ou nouveau mode)
        if(!form.license_id&&!form.content_id&&sessionContents.length===0){
          alert('Veuillez sélectionner au moins un contenu');return;
        }
        
        setSaving(true);
        try{
        // Build core data (columns that always exist)
        const coreData={
          name:form.name,
          description:form.description||null,
          start_date:form.start_date,
          end_date:form.end_date||null,
          status:form.status,
          center_id:center?.id||null
        };
        
        // Extended columns (Phase 1 migration) - try to include
        const extData={
          code:form.code||null,
          content_type:form.license_id?null:(form.content_type||null),
          content_id:form.license_id?null:(form.content_id||null),
          license_id:form.license_id||null,
          start_time:form.start_time||null,
          end_time:form.end_time||null,
          location:form.location||null,
          location_type:form.location_type,
          max_participants:form.max_participants?parseInt(form.max_participants):null,
          auto_enroll:form.auto_enroll,
          certificate_enabled:form.certificate_enabled
        };
        
        let sessionId;
        if(selectedSession){
          // UPDATE existing session
          const{error:fullErr}=await supabase.from('training_sessions').update({...coreData,...extData}).eq('id',selectedSession.id);
          if(fullErr){
            console.warn('Full update failed, trying core only:',fullErr);
            const{error:coreErr}=await supabase.from('training_sessions').update(coreData).eq('id',selectedSession.id);
            if(coreErr)throw new Error('Erreur mise à jour: '+coreErr.message);
          }
          sessionId=selectedSession.id;
        }else{
          // INSERT new session
          const fullData={...coreData,...extData,created_by:profile?.id};
          const{data:newSession,error:insErr}=await supabase.from('training_sessions').insert(fullData).select('id').single();
          if(insErr){
            console.warn('Full insert failed ('+insErr.message+'), trying core only');
            const{data:ns2,error:coreErr}=await supabase.from('training_sessions').insert({...coreData,created_by:profile?.id}).select('id').single();
            if(coreErr)throw new Error('Erreur création session: '+coreErr.message);
            if(!ns2?.id)throw new Error('Session créée mais impossible de récupérer l\'ID. Vérifiez les permissions RLS.');
            sessionId=ns2.id;
            // Try to add extended data via update (in case insert was blocked but update works)
            if(form.license_id){
              await supabase.from('training_sessions').update({license_id:form.license_id}).eq('id',sessionId).then(()=>{}).catch(()=>{});
            }
          }else{
            if(!newSession?.id)throw new Error('Session créée mais ID non retourné. Vérifiez les policies RLS sur training_sessions (SELECT après INSERT).');
            sessionId=newSession.id;
          }
        }
        
        if(!sessionId){
          throw new Error('Impossible de déterminer l\'ID de la session. La session n\'a peut-être pas été créée.');
        }
        
        // Sauvegarder session_contents si multi-content mode
        if(sessionContents.length>0){
          try{
            // Supprimer les anciens
            await supabase.from('session_contents').delete().eq('session_id',sessionId);
            // Insérer les nouveaux
            const items=sessionContents.map((c,i)=>({
              session_id:sessionId,
              content_type:c.content_type,
              content_id:c.content_id,
              sort_order:i,
              is_required:c.is_required!==false,
              added_by:profile?.id
            }));
            const{error:scErr}=await supabase.from('session_contents').insert(items);
            if(scErr)console.warn('session_contents save warning:',scErr.message);
          }catch(e){console.warn('session_contents save failed (table may not exist):',e);}
        }
        
        alert('✅ Session '+(selectedSession?'modifiée':'créée')+' avec succès');
        setModal(null);
        setSelectedSession(null);
        resetForm();
        load();
        }catch(e){
          console.error('saveSession error:',e);
          alert('❌ '+e.message);
        }
        setSaving(false);
      };
      
      const resetForm=()=>{
        setForm({
          name:'',description:'',code:'',
          license_id:'',
          content_type:'course',content_id:'',
          start_date:'',end_date:'',start_time:'',end_time:'',
          location:'',location_type:'online',max_participants:'',
          status:'planned',auto_enroll:true,certificate_enabled:true
        });
        setSessionContents([]);
        setLicensePack(null);
      };
      
      const openEdit=(session)=>{
        setSelectedSession(session);
        setForm({
          name:session.name||'',
          description:session.description||'',
          code:session.code||'',
          license_id:session.license_id||'',
          content_type:session.content_type||'course',
          content_id:session.content_id||'',
          start_date:session.start_date||'',
          end_date:session.end_date||'',
          start_time:session.start_time||'',
          end_time:session.end_time||'',
          location:session.location||'',
          location_type:session.location_type||'online',
          max_participants:session.max_participants||'',
          status:session.status||'planned',
          auto_enroll:session.auto_enroll!==false,
          certificate_enabled:session.certificate_enabled!==false
        });
        // Load existing session_contents
        const existingContents=(session.session_contents||[]).map(sc=>{
          let title='';
          if(sc.content_type==='course')title=(courses.find(c=>c.id===sc.content_id)||{}).title||'Cours';
          else if(sc.content_type==='path')title=(paths.find(p=>p.id===sc.content_id)||{}).title||'Parcours';
          else if(sc.content_type==='video')title=(allVideos.find(v=>v.id===sc.content_id)||{}).title||'Vidéo';
          else if(sc.content_type==='scorm')title=(allScorm.find(s=>s.id===sc.content_id)||{}).title||'SCORM';
          else if(sc.content_type==='quiz')title=(allQuizzes.find(q=>q.id===sc.content_id)||{}).title||'Quiz';
          return{...sc,title};
        });
        setSessionContents(existingContents);
        if(session.license_id)loadPackItems(session.license_id);
        setModal('edit');
      };
      
      const deleteSession=async(session)=>{
        if(!confirm(`Supprimer la session "${session.name}" ?\n\nLes inscriptions au contenu seront conservées.`))return;
        await supabase.from('training_sessions').delete().eq('id',session.id);
        load();
      };
      
      // Gestion des participants
      const[participantSearch,setParticipantSearch]=useState('');
      const[selectedParticipants,setSelectedParticipants]=useState([]);
      
      const openParticipants=(session)=>{
        setSelectedSession(session);
        setSelectedParticipants(session.session_participants?.map(p=>p.learner_id)||[]);
        setParticipantSearch('');
        setModal('participants');
      };
      
      const toggleParticipant=(learnerId)=>{
        if(selectedParticipants.includes(learnerId)){
          setSelectedParticipants(selectedParticipants.filter(id=>id!==learnerId));
        }else{
          setSelectedParticipants([...selectedParticipants,learnerId]);
        }
      };
      
      const saveParticipants=async()=>{
        const currentIds=selectedSession.session_participants?.map(p=>p.learner_id)||[];
        const toAdd=selectedParticipants.filter(id=>!currentIds.includes(id));
        const toRemove=currentIds.filter(id=>!selectedParticipants.includes(id));
        
        // Ajouter les nouveaux
        if(toAdd.length>0){
          await supabase.from('session_participants').insert(
            toAdd.map(learner_id=>({
              session_id:selectedSession.id,
              learner_id,
              enrolled_by:profile?.id
            }))
          );
        }
        
        // Supprimer les retirés
        if(toRemove.length>0){
          await supabase.from('session_participants')
            .delete()
            .eq('session_id',selectedSession.id)
            .in('learner_id',toRemove);
        }
        
        setModal(null);
        load();
      };
      
      // Gestion des formateurs
      const[selectedTrainers,setSelectedTrainers]=useState([]);
      
      const openTrainers=(session)=>{
        setSelectedSession(session);
        setSelectedTrainers(session.session_trainers?.map(t=>({id:t.trainer_id,role:t.role}))||[]);
        setModal('trainers');
      };
      
      const toggleTrainer=(trainerId)=>{
        const existing=selectedTrainers.find(t=>t.id===trainerId);
        if(existing){
          setSelectedTrainers(selectedTrainers.filter(t=>t.id!==trainerId));
        }else{
          setSelectedTrainers([...selectedTrainers,{id:trainerId,role:'trainer'}]);
        }
      };
      
      const setTrainerRole=(trainerId,role)=>{
        setSelectedTrainers(selectedTrainers.map(t=>t.id===trainerId?{...t,role}:t));
      };
      
      const saveTrainers=async()=>{
        // Supprimer tous les anciens
        await supabase.from('session_trainers').delete().eq('session_id',selectedSession.id);
        
        // Ajouter les nouveaux
        if(selectedTrainers.length>0){
          await supabase.from('session_trainers').insert(
            selectedTrainers.map(t=>({
              session_id:selectedSession.id,
              trainer_id:t.id,
              role:t.role,
              assigned_by:profile?.id
            }))
          );
        }
        
        setModal(null);
        load();
      };
      
      // Statuts avec couleurs
      const statusConfig={
        draft:{label:'Brouillon',color:'gray'},
        planned:{label:'Planifiée',color:'blue'},
        open:{label:'Inscriptions ouvertes',color:'cyan'},
        in_progress:{label:'En cours',color:'yellow'},
        completed:{label:'Terminée',color:'green'},
        cancelled:{label:'Annulée',color:'red'}
      };
      
      const locationTypes={
        online:{label:'En ligne',icon:'Globe'},
        onsite:{label:'Présentiel',icon:'MapPin'},
        hybrid:{label:'Hybride',icon:'Layers'}
      };
      
      if(!can('manage_sessions')&&!can('view_sessions'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading text="Chargement des sessions..."/>;
      
      const canManageSess=can('manage_sessions');
      const canAssignTrainersP=can('assign_trainers');
      const canManageParticipants=can('manage_session_participants');
      
      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4">
          <div>
            <h1 className="text-2xl font-bold flex items-center gap-2">
              <Icon name="Calendar" size={28}/>Sessions de formation
            </h1>
            <p className="text-sm text-gray-400">{sessions.length} session{sessions.length>1?'s':''}</p>
          </div>
          <div className="flex gap-2">
            <Button variant="ghost" icon="RefreshCw" onClick={load}>Actualiser</Button>
            {canManageSess&&<Button variant="secondary" icon="Download" onClick={downloadTemplate}>Template Excel</Button>}
            {canManageSess&&<Button variant="secondary" icon="Upload" onClick={()=>setModal('import')}>Importer</Button>}
            {canManageSess&&<Button icon="Plus" onClick={()=>{resetForm();setSelectedSession(null);setModal('create');}}>
              Nouvelle session
            </Button>}
          </div>
        </div>
        
        {/* Filtres */}
        <Card className="p-4 mb-6">
          <div className="flex flex-wrap gap-4 items-center">
            <div className="flex-1 min-w-[200px]">
              <Input 
                placeholder="Rechercher une session..." 
                value={filter.search} 
                onChange={e=>setFilter({...filter,search:e.target.value})}
                icon="Search"
              />
            </div>
            <select 
              className="px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-sm"
              value={filter.status}
              onChange={e=>setFilter({...filter,status:e.target.value})}
            >
              <option value="all">Tous les statuts</option>
              {Object.entries(statusConfig).map(([k,v])=>(
                <option key={k} value={k}>{v.label}</option>
              ))}
            </select>
          </div>
        </Card>
        
        {/* Liste des sessions */}
        {filteredSessions.length===0?(
          <Card className="p-12 text-center">
            <Icon name="Calendar" size={48} className="mx-auto text-gray-600 mb-4"/>
            <h3 className="text-lg font-semibold mb-2">Aucune session</h3>
            <p className="text-gray-400 mb-4">Créez votre première session de formation</p>
            <Button icon="Plus" onClick={()=>{resetForm();setModal('create');}}>Créer une session</Button>
          </Card>
        ):(
          <div className="grid gap-4">
            {filteredSessions.map(session=>(
              <Card key={session.id} className="p-4">
                <div className="flex items-start gap-4">
                  {/* Icône type */}
                  <div className={`w-12 h-12 rounded-xl flex items-center justify-center shrink-0 ${
                    session.license_id?'bg-amber-500/20':session.content_type==='course'?'bg-indigo-500/20':'bg-purple-500/20'
                  }`}>
                    <Icon 
                      name={session.license_id?'Key':session.content_type==='course'?'BookOpen':'Route'} 
                      size={24} 
                      className={session.license_id?'text-amber-400':session.content_type==='course'?'text-indigo-400':'text-purple-400'}
                    />
                  </div>
                  
                  {/* Infos principales */}
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                      <h3 className="font-semibold text-lg">{session.name}</h3>
                      {session.code&&(
                        <span 
                          className="text-xs px-2 py-0.5 bg-indigo-500/20 text-indigo-300 rounded font-mono cursor-pointer hover:bg-indigo-500/30 transition flex items-center gap-1"
                          onClick={(e)=>{e.stopPropagation();navigator.clipboard.writeText(session.code);alert('Code copié: '+session.code);}}
                          title="Cliquer pour copier le code d'inscription"
                        >
                          <Icon name="KeyRound" size={12}/>{session.code}
                        </span>
                      )}
                      <span className={`text-xs px-2 py-0.5 rounded bg-${statusConfig[session.status]?.color||'gray'}-500/20 text-${statusConfig[session.status]?.color||'gray'}-400`}>
                        {statusConfig[session.status]?.label||session.status}
                      </span>
                    </div>
                    
                    {/* License info */}
                    {session.license_name&&(
                      <div className="flex items-center gap-2 mt-1">
                        <span className="text-xs px-2 py-0.5 bg-amber-500/20 text-amber-400 rounded flex items-center gap-1">
                          <Icon name="Key" size={10}/>Licence: {session.license_name}
                        </span>
                        {session.contents_count>0&&(
                          <span className="text-xs px-2 py-0.5 bg-indigo-500/20 text-indigo-400 rounded">
                            {session.contents_count} contenu{session.contents_count>1?'s':''}
                          </span>
                        )}
                        {session.license_end&&(()=>{
                          const days=Math.ceil((new Date(session.license_end)-new Date())/(1000*60*60*24));
                          if(days<=0)return<span className="text-xs px-2 py-0.5 bg-red-500/20 text-red-400 rounded">Licence expirée</span>;
                          if(days<=30)return<span className="text-xs px-2 py-0.5 bg-orange-500/20 text-orange-400 rounded">Expire dans {days}j</span>;
                          return null;
                        })()}
                      </div>
                    )}
                    
                    {!session.license_name&&session.content_title&&(
                      <p className="text-sm text-gray-400 mt-1">
                        {session.content_type==='course'?'📚 Cours':'🛤️ Parcours'}: {session.content_title}
                      </p>
                    )}
                    
                    <div className="flex flex-wrap gap-4 mt-2 text-sm">
                      <span className="flex items-center gap-1 text-gray-400">
                        <Icon name="Calendar" size={14}/>
                        {new Date(session.start_date).toLocaleDateString('fr-FR')}
                        {session.end_date&&session.end_date!==session.start_date&&` → ${new Date(session.end_date).toLocaleDateString('fr-FR')}`}
                      </span>
                      {session.start_time&&(
                        <span className="flex items-center gap-1 text-gray-400">
                          <Icon name="Clock" size={14}/>
                          {session.start_time.slice(0,5)}{session.end_time&&` - ${session.end_time.slice(0,5)}`}
                        </span>
                      )}
                      <span className="flex items-center gap-1 text-gray-400">
                        <Icon name={locationTypes[session.location_type]?.icon||'Globe'} size={14}/>
                        {locationTypes[session.location_type]?.label||'En ligne'}
                        {session.location&&` • ${session.location}`}
                      </span>
                    </div>
                    
                    {/* Barre de consommation licence */}
                    {session.license_max&&session.license_id&&(
                      <div className="mt-2">
                        <div className="flex items-center gap-2 text-xs text-gray-400 mb-1">
                          <span>Places licence: {session.license_learners}/{session.license_max}</span>
                          <span className={session.license_learners>=session.license_max?'text-red-400':session.license_learners>=session.license_max*0.8?'text-orange-400':'text-green-400'}>
                            ({Math.round(session.license_learners/session.license_max*100)}%)
                          </span>
                        </div>
                        <div className="h-1.5 bg-gray-700 rounded-full overflow-hidden">
                          <div className={`h-full rounded-full transition-all ${
                            session.license_learners>=session.license_max?'bg-red-500':
                            session.license_learners>=session.license_max*0.8?'bg-orange-500':'bg-green-500'
                          }`} style={{width:Math.min(100,session.license_learners/session.license_max*100)+'%'}}/>
                        </div>
                      </div>
                    )}
                  </div>
                  
                  {/* Stats */}
                  <div className="flex gap-4 items-center shrink-0">
                    <div 
                      className="text-center cursor-pointer hover:bg-gray-700/50 p-2 rounded-lg transition"
                      onClick={()=>openTrainers(session)}
                      title="Gérer les formateurs"
                    >
                      <p className="text-xl font-bold text-cyan-400">{session.trainers_count}</p>
                      <p className="text-xs text-gray-500">Formateur{session.trainers_count>1?'s':''}</p>
                    </div>
                    <div 
                      className="text-center cursor-pointer hover:bg-gray-700/50 p-2 rounded-lg transition"
                      onClick={()=>openParticipants(session)}
                      title="Gérer les participants"
                    >
                      <p className="text-xl font-bold text-green-400">{session.participants_count}</p>
                      <p className="text-xs text-gray-500">Participant{session.participants_count>1?'s':''}</p>
                    </div>
                    {session.contents_count>0&&(
                      <div 
                        className="text-center cursor-pointer hover:bg-gray-700/50 p-2 rounded-lg transition"
                        onClick={()=>{setSelectedSession(session);setModal('view-contents');}}
                        title="Voir les contenus"
                      >
                        <p className="text-xl font-bold text-amber-400">{session.contents_count}</p>
                        <p className="text-xs text-gray-500">Contenu{session.contents_count>1?'s':''}</p>
                      </div>
                    )}
                  </div>
                  
                  {/* Actions */}
                  <div className="flex gap-1 shrink-0">
                    {canManageParticipants&&<Button variant="ghost" size="sm" icon="Users" onClick={()=>openParticipants(session)} title="Participants"/>}
                    {canAssignTrainersP&&<Button variant="ghost" size="sm" icon="UserCheck" onClick={()=>openTrainers(session)} title="Formateurs"/>}
                    {canManageSess&&<Button variant="ghost" size="sm" icon="Edit" onClick={()=>openEdit(session)} title="Modifier"/>}
                    {canManageSess&&<Button variant="ghost" size="sm" icon="Trash2" onClick={()=>deleteSession(session)} className="text-red-400 hover:text-red-300" title="Supprimer"/>}
                  </div>
                </div>
                
                {/* Formateurs assignés */}
                {session.session_trainers?.length>0&&(
                  <div className="mt-3 pt-3 border-t border-gray-700">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="text-xs text-gray-500">Formateurs:</span>
                      {session.session_trainers.map(t=>(
                        <span key={t.id} className="text-xs px-2 py-1 bg-cyan-500/20 text-cyan-400 rounded-full">
                          {t.profiles?.first_name} {t.profiles?.last_name}
                          {t.role==='lead'&&' ★'}
                        </span>
                      ))}
                    </div>
                  </div>
                )}
              </Card>
            ))}
          </div>
        )}
        
        {/* Modal Créer/Modifier */}
        <Modal isOpen={modal==='create'||modal==='edit'} onClose={()=>{setModal(null);setSelectedSession(null);}} title={selectedSession?'Modifier la session':'Nouvelle session'} size="xl">
          <div className="space-y-4">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <Input label="Nom de la session *" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Ex: Formation Permis C - Mars 2026"/>
              <div>
                <label className="block text-sm font-medium mb-1">Code d'inscription</label>
                <div className="flex gap-2">
                  <input 
                    type="text" 
                    value={form.code} 
                    onChange={e=>setForm({...form,code:e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g,'')})}
                    className="flex-1 px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg font-mono uppercase"
                    placeholder="CODE123"
                    maxLength={20}
                  />
                  <Button 
                    type="button" 
                    variant="secondary" 
                    icon="Shuffle"
                    onClick={()=>{
                      const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                      let code='';
                      for(let i=0;i<8;i++)code+=chars[Math.floor(Math.random()*chars.length)];
                      setForm({...form,code});
                    }}
                    title="Générer un code"
                  />
                </div>
                <p className="text-xs text-gray-500 mt-1">Les apprenants utiliseront ce code pour s'inscrire directement à cette session</p>
              </div>
            </div>
            
            {/* LICENCE */}
            {centerLicenses.length>0&&(
              <div className="p-4 bg-amber-500/5 border border-amber-500/20 rounded-lg">
                <label className="block text-sm font-medium mb-2 flex items-center gap-2">
                  <Icon name="Key" size={16} className="text-amber-400"/>Lier à une licence (optionnel)
                </label>
                <select className="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg" value={form.license_id} onChange={e=>{
                  const licId=e.target.value;
                  setForm({...form,license_id:licId});
                  loadPackItems(licId);
                  if(licId){
                    const lic=centerLicenses.find(l=>l.id===licId);
                    if(lic){
                      // Auto-fill dates from license if empty
                      if(!form.start_date)setForm(f=>({...f,license_id:licId,start_date:lic.start_date,end_date:lic.end_date}));
                      if(lic.max_learners&&!form.max_participants)setForm(f=>({...f,max_participants:String(lic.max_learners)}));
                    }
                  }
                }}>
                  <option value="">Aucune licence (contenu libre)</option>
                  {centerLicenses.map(l=>{
                    const days=Math.ceil((new Date(l.end_date)-new Date())/(1000*60*60*24));
                    const isVol=l.license_type==='resource_volume';
                    const label=isVol
                      ?(l.full_catalog?'Licence volume — Tous les supports':`Licence volume — ${l.max_resources||'∞'} supports`)
                      :(l.content_packs?.name||(l.license_type==='full_catalog'?'Catalogue complet':'Licence'));
                    return<option key={l.id} value={l.id}>
                      {label} — {new Date(l.start_date).toLocaleDateString()} → {new Date(l.end_date).toLocaleDateString()} ({days}j) {!isVol&&l.max_learners?`• Max ${l.max_learners}`:''}
                    </option>;
                  })}
                </select>
                {form.license_id&&(()=>{
                  const lic=centerLicenses.find(l=>l.id===form.license_id);
                  if(!lic)return null;
                  const isVol=lic.license_type==='resource_volume';
                  return<div className="mt-2 flex items-center gap-3 text-xs text-gray-400">
                    <span>📅 {new Date(lic.start_date).toLocaleDateString()} → {new Date(lic.end_date).toLocaleDateString()}</span>
                    {isVol
                      ?<span className="text-amber-400">{lic.full_catalog?'Tous les supports':`${lic.max_resources||'∞'} supports autorisés`}</span>
                      :<><span>👥 {lic.max_learners?`Max ${lic.max_learners} apprenants`:'Illimité'}</span><span className="text-amber-400">{lic.content_packs?.name||'Catalogue complet'}</span></>
                    }
                  </div>;
                })()}
              </div>
            )}
            
            {/* CONTENU: Mode classique (sans licence) OU multi-contenu (avec licence) */}
            {!form.license_id?(
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium mb-1">Type de contenu *</label>
                  <select className="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg" value={form.content_type} onChange={e=>setForm({...form,content_type:e.target.value,content_id:''})}>
                    <option value="course">📚 Cours</option>
                    <option value="path">🛤️ Parcours</option>
                  </select>
                </div>
                <div>
                  <label className="block text-sm font-medium mb-1">{form.content_type==='course'?'Cours':'Parcours'} *</label>
                  <select className="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg" value={form.content_id} onChange={e=>setForm({...form,content_id:e.target.value})}>
                    <option value="">Sélectionner...</option>
                    {(form.content_type==='course'?courses:paths).map(c=>(
                      <option key={c.id} value={c.id}>{c.title}</option>
                    ))}
                  </select>
                </div>
              </div>
            ):(
              <div>
                <div className="flex items-center justify-between mb-2">
                  <label className="text-sm font-medium flex items-center gap-2">
                    <Icon name="Package" size={16} className="text-indigo-400"/>Contenus de la session ({sessionContents.length} sélectionné{sessionContents.length>1?'s':''})
                  </label>
                  <Button size="sm" variant="secondary" icon="Plus" onClick={()=>setModal('contents')}>Ajouter des contenus</Button>
                </div>
                {sessionContents.length===0?(
                  <div className="p-4 border border-dashed border-gray-600 rounded-lg text-center text-gray-500 text-sm cursor-pointer hover:border-indigo-500 hover:text-indigo-400 transition" onClick={()=>setModal('contents')}>
                    <Icon name="Plus" size={24} className="mx-auto mb-2"/>
                    Cliquez pour ajouter des contenus depuis votre licence
                  </div>
                ):(
                  <div className="space-y-1 max-h-40 overflow-y-auto">
                    {sessionContents.map((sc,idx)=>{
                      const icons={video:'📹',scorm:'📦',quiz:'❓',course:'📚',path:'🛤️'};
                      return<div key={idx} className="flex items-center gap-2 p-2 bg-gray-700/50 rounded-lg">
                        <span>{icons[sc.content_type]||'📄'}</span>
                        <span className="flex-1 text-sm truncate">{sc.title}</span>
                        <span className="text-xs text-gray-500">{sc.content_type}</span>
                        <label className="flex items-center gap-1 text-xs cursor-pointer">
                          <input type="checkbox" checked={sc.is_required!==false} onChange={e=>{
                            setSessionContents(prev=>prev.map((c,i)=>i===idx?{...c,is_required:e.target.checked}:c));
                          }} className="w-3 h-3"/>
                          Obligatoire
                        </label>
                        <button onClick={()=>setSessionContents(prev=>prev.filter((_,i)=>i!==idx))} className="text-red-400 hover:text-red-300 p-1">
                          <Icon name="X" size={14}/>
                        </button>
                      </div>;
                    })}
                  </div>
                )}
              </div>
            )}
            
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <Input label="Date début *" type="date" value={form.start_date} onChange={e=>setForm({...form,start_date:e.target.value})}/>
              <Input label="Date fin" type="date" value={form.end_date} onChange={e=>setForm({...form,end_date:e.target.value})}/>
              <Input label="Heure début" type="time" value={form.start_time} onChange={e=>setForm({...form,start_time:e.target.value})}/>
              <Input label="Heure fin" type="time" value={form.end_time} onChange={e=>setForm({...form,end_time:e.target.value})}/>
            </div>
            
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label className="block text-sm font-medium mb-1">Modalité</label>
                <select className="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg" value={form.location_type} onChange={e=>setForm({...form,location_type:e.target.value})}>
                  <option value="online">🌐 En ligne</option>
                  <option value="onsite">📍 Présentiel</option>
                  <option value="hybrid">🔀 Hybride</option>
                </select>
              </div>
              <Input label="Lieu (si présentiel)" value={form.location} onChange={e=>setForm({...form,location:e.target.value})} placeholder="Ex: Salle A, Paris"/>
              <Input label="Nb max participants" type="number" value={form.max_participants} onChange={e=>setForm({...form,max_participants:e.target.value})} placeholder="Illimité"/>
            </div>
            
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label className="block text-sm font-medium mb-1">Statut</label>
                <select className="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg" value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>
                  {Object.entries(statusConfig).map(([k,v])=>(
                    <option key={k} value={k}>{v.label}</option>
                  ))}
                </select>
              </div>
              <div className="flex items-center gap-4 col-span-2">
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" checked={form.auto_enroll} onChange={e=>setForm({...form,auto_enroll:e.target.checked})} className="w-4 h-4 rounded"/>
                  <span className="text-sm">Inscription auto au contenu</span>
                </label>
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" checked={form.certificate_enabled} onChange={e=>setForm({...form,certificate_enabled:e.target.checked})} className="w-4 h-4 rounded"/>
                  <span className="text-sm">Certificat activé</span>
                </label>
              </div>
            </div>
            
            <div>
              <label className="block text-sm font-medium mb-1">Description</label>
              <textarea className="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg h-20" value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="Description de la session..."/>
            </div>
          </div>
          
          <div className="flex justify-end gap-2 mt-6">
            <Button variant="secondary" onClick={()=>{setModal(null);setSelectedSession(null);}}>Annuler</Button>
            <Button icon="Save" onClick={saveSession} loading={saving}>{selectedSession?'Enregistrer':'Créer la session'}</Button>
          </div>
        </Modal>
        
        {/* Modal Multi-Content Picker */}
        <Modal isOpen={modal==='contents'} onClose={()=>setModal(selectedSession?'edit':'create')} title="Sélectionner les contenus" size="xl">
          {(()=>{
            const contentTypes=[
              {key:'video',label:'Vidéos',icon:'📹',items:allVideos},
              {key:'scorm',label:'SCORM',icon:'📦',items:allScorm},
              {key:'quiz',label:'Quiz',icon:'❓',items:allQuizzes},
              {key:'course',label:'Cours',icon:'📚',items:courses},
              {key:'path',label:'Parcours',icon:'🛤️',items:paths}
            ];
            return<div className="space-y-4">
              <Input placeholder="Rechercher un contenu..." value={contentPickerSearch} onChange={e=>setContentPickerSearch(e.target.value)} icon="Search"/>
              
              <div className="flex gap-1 flex-wrap">
                {contentTypes.map(ct=>{
                  const availCount=ct.items.filter(i=>isInLicensePack(ct.key,i.id)).length;
                  const selCount=sessionContents.filter(sc=>sc.content_type===ct.key).length;
                  return<button key={ct.key} onClick={()=>setContentPickerTab(ct.key)} className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${contentPickerTab===ct.key?'bg-indigo-500 text-white':'bg-gray-700 text-gray-400 hover:bg-gray-600'}`}>
                    {ct.icon} {ct.label} ({selCount}/{availCount})
                  </button>;
                })}
              </div>
              
              <div className="max-h-80 overflow-y-auto space-y-1">
                {(()=>{
                  const ct=contentTypes.find(c=>c.key===contentPickerTab);
                  if(!ct)return null;
                  const filtered=ct.items.filter(i=>{
                    if(!isInLicensePack(ct.key,i.id))return false;
                    if(contentPickerSearch&&!i.title?.toLowerCase().includes(contentPickerSearch.toLowerCase()))return false;
                    return true;
                  });
                  if(filtered.length===0)return<div className="text-center py-8 text-gray-500">Aucun contenu disponible dans cette catégorie</div>;
                  return filtered.map(item=>{
                    const selected=isContentSelected(ct.key,item.id);
                    return<label key={item.id} className={`flex items-center gap-3 p-3 rounded-lg cursor-pointer transition ${selected?'bg-indigo-500/20 border border-indigo-500/50':'bg-gray-700/50 hover:bg-gray-700'}`}>
                      <input type="checkbox" checked={selected} onChange={()=>toggleSessionContent(ct.key,item.id,item.title)} className="w-4 h-4 rounded"/>
                      <span className="text-lg">{ct.icon}</span>
                      <span className="flex-1 text-sm">{item.title}</span>
                      {selected&&<Icon name="Check" size={16} className="text-indigo-400"/>}
                    </label>;
                  });
                })()}
              </div>
              
              <div className="flex items-center justify-between pt-2 border-t border-gray-700">
                <span className="text-sm text-gray-400">{sessionContents.length} contenu{sessionContents.length>1?'s':''} sélectionné{sessionContents.length>1?'s':''}</span>
                <Button onClick={()=>setModal(selectedSession?'edit':'create')}>Valider</Button>
              </div>
            </div>;
          })()}
        </Modal>
        
        {/* Modal View Contents (read-only) */}
        <Modal isOpen={modal==='view-contents'} onClose={()=>setModal(null)} title={`Contenus — ${selectedSession?.name}`} size="md">
          <div className="space-y-2">
            {(selectedSession?.session_contents||[]).length===0?(
              <p className="text-gray-500 text-center py-4">Aucun contenu assigné via session_contents</p>
            ):(
              (selectedSession?.session_contents||[]).map((sc,i)=>{
                const icons={video:'📹',scorm:'📦',quiz:'❓',course:'📚',path:'🛤️'};
                let title=sc.content_id;
                if(sc.content_type==='video')title=(allVideos.find(v=>v.id===sc.content_id)||{}).title||sc.content_id;
                else if(sc.content_type==='scorm')title=(allScorm.find(s=>s.id===sc.content_id)||{}).title||sc.content_id;
                else if(sc.content_type==='quiz')title=(allQuizzes.find(q=>q.id===sc.content_id)||{}).title||sc.content_id;
                else if(sc.content_type==='course')title=(courses.find(c=>c.id===sc.content_id)||{}).title||sc.content_id;
                else if(sc.content_type==='path')title=(paths.find(p=>p.id===sc.content_id)||{}).title||sc.content_id;
                return<div key={i} className="flex items-center gap-3 p-3 bg-gray-700/50 rounded-lg">
                  <span className="text-lg">{icons[sc.content_type]||'📄'}</span>
                  <div className="flex-1">
                    <p className="text-sm font-medium">{title}</p>
                    <p className="text-xs text-gray-500">{sc.content_type} {sc.is_required?'• Obligatoire':'• Optionnel'}</p>
                  </div>
                </div>;
              })
            )}
          </div>
          <div className="flex justify-end mt-4">
            <Button variant="secondary" onClick={()=>setModal(null)}>Fermer</Button>
          </div>
        </Modal>
        
        {/* Modal Participants */}
        <Modal isOpen={modal==='participants'} onClose={()=>setModal(null)} title={`Participants - ${selectedSession?.name}`} size="lg">
          <div className="space-y-4">
            <Input 
              placeholder="Rechercher un apprenant..." 
              value={participantSearch} 
              onChange={e=>setParticipantSearch(e.target.value)}
              icon="Search"
            />
            
            <div className="max-h-96 overflow-y-auto space-y-1">
              {learners
                .filter(l=>{
                  if(!participantSearch)return true;
                  const search=participantSearch.toLowerCase();
                  return l.first_name?.toLowerCase().includes(search)||
                         l.last_name?.toLowerCase().includes(search)||
                         l.email?.toLowerCase().includes(search);
                })
                .map(learner=>(
                  <label key={learner.id} className={`flex items-center gap-3 p-3 rounded-lg cursor-pointer transition ${selectedParticipants.includes(learner.id)?'bg-green-500/20 border border-green-500/50':'bg-gray-700/50 hover:bg-gray-700'}`}>
                    <input

    function CentersPage(){
      const{can}=useAuth();
      const[centers,setCenters]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({name:'',slug:'',description:'',registration_code:''});
      const[saving,setSaving]=useState(false);
      const[copiedCode,setCopiedCode]=useState(null);

      // Générer un slug à partir du nom
      const generateSlug=(name)=>name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
      
      // Générer un code d'inscription aléatoire (6 caractères)
      const generateCode=()=>{
        const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // Sans O/0/1/I pour éviter confusion
        let code='';
        for(let i=0;i<6;i++)code+=chars.charAt(Math.floor(Math.random()*chars.length));
        return code;
      };
      
      // Copier le code dans le presse-papier
      const copyCode=(code)=>{
        navigator.clipboard.writeText(code);
        setCopiedCode(code);
        setTimeout(()=>setCopiedCode(null),2000);
      };

      const load=useCallback(async()=>{const{data}=await supabase.from('centers').select('*').order('name');setCenters(data||[]);setLoading(false);},[]);
      useEffect(()=>{load();},[load]);

      const handleSave=async()=>{
        if(!form.name.trim()){alert('Le nom est requis');return;}
        setSaving(true);
        const slug=form.slug||generateSlug(form.name);
        const registration_code=form.registration_code||generateCode();
        const payload={name:form.name.trim(),slug,description:form.description,registration_code};
        try{
          if(editing){
            const{error}=await supabase.from('centers').update(payload).eq('id',editing.id);
            if(error)throw error;
          }else{
            const{error}=await supabase.from('centers').insert(payload);
            if(error)throw error;
          }
          await load();setModal(false);setForm({name:'',slug:'',description:'',registration_code:''});setEditing(null);
        }catch(err){
          if(err.code==='23505')alert('❌ Un centre avec ce nom ou ce code existe déjà');
          else alert('Erreur: '+err.message);
        }
        setSaving(false);
      };
      const handleDelete=async id=>{if(!confirm('Supprimer ce centre ? Les utilisateurs associés perdront leur accès.'))return;await supabase.from('centers').delete().eq('id',id);load();};
      
      // Ouvrir le modal pour nouveau centre avec code généré
      const openNewModal=()=>{
        setForm({name:'',slug:'',description:'',registration_code:generateCode()});
        setEditing(null);
        setModal(true);
      };

      if(!can('manage_centers'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;
      return<div>
        <div className="flex items-center justify-between mb-6">
          <div>
            <h1 className="text-2xl font-bold">Centres</h1>
            <p className="text-sm text-gray-400">Gérez vos centres de formation et leurs codes d'inscription</p>
          </div>
          <Button icon="Plus" onClick={openNewModal}>Nouveau centre</Button>
        </div>
        
        {/* Info sur les codes */}
        <Alert type="info" className="mb-6">
          <p className="font-medium">💡 Code d'inscription</p>
          <p className="text-sm">Partagez le code avec vos apprenants. Ils pourront s'inscrire eux-mêmes sur la page de connexion en utilisant ce code.</p>
        </Alert>
        
        {centers.length===0?<Empty icon="Building2" title="Aucun centre" desc="Créez votre premier centre de formation"/>:
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{centers.map(c=><Card key={c.id} className="p-4">
          <div className="flex items-center gap-3 mb-4">
            <div className="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center"><Icon name="Building2" size={24}/></div>
            <div className="flex-1 min-w-0">
              <h3 className="font-semibold truncate">{c.name}</h3>
              <p className="text-sm text-gray-400">/{c.slug}</p>
            </div>
          </div>
          
          {/* Code d'inscription */}
          <div className="bg-gray-700/50 rounded-lg p-3 mb-4">
            <p className="text-xs text-gray-400 mb-1">Code d'inscription</p>
            <div className="flex items-center justify-between">
              <span className="font-mono text-lg font-bold text-indigo-400 tracking-wider">{c.registration_code||'—'}</span>
              {c.registration_code&&<button onClick={()=>copyCode(c.registration_code)} className="p-1.5 hover:bg-gray-600 rounded" title="Copier le code">
                <Icon name={copiedCode===c.registration_code?"Check":"Copy"} size={16} className={copiedCode===c.registration_code?"text-green-400":"text-gray-400"}/>
              </button>}
            </div>
          </div>
          
          {c.description&&<p className="text-sm text-gray-400 mb-4 line-clamp-2">{c.description}</p>}
          
          <div className="flex gap-2">
            <Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(c);setForm({name:c.name,slug:c.slug,description:c.description||'',registration_code:c.registration_code||''});setModal(true);}}>Modifier</Button>
            <Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(c.id)}>Supprimer</Button>
          </div>
        </Card>)}</div>}
        
        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title={editing?'Modifier le centre':'Nouveau centre'}>
          <div className="space-y-4">
            <Input label="Nom du centre *" value={form.name} onChange={e=>{setForm({...form,name:e.target.value,slug:generateSlug(e.target.value)});}} placeholder="Ex: Auto-École Centrale"/>
            
            <div>
              <label className="block text-sm font-medium text-gray-300 mb-1">Code d'inscription</label>
              <div className="flex gap-2">
                <input value={form.registration_code} onChange={e=>setForm({...form,registration_code:e.target.value.toUpperCase()})} className="flex-1 px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white font-mono tracking-wider" placeholder="XXXXXX" maxLength={10}/>
                <Button variant="secondary" icon="RefreshCw" onClick={()=>setForm({...form,registration_code:generateCode()})} title="Générer un nouveau code"/>
              </div>
              <p className="text-xs text-gray-500 mt-1">Ce code permet aux apprenants de s'inscrire directement</p>
            </div>
            
            <div>
              <label className="block text-sm font-medium text-gray-300 mb-1">Slug (URL)</label>
              <div className="flex items-center gap-2">
                <span className="text-gray-500">/</span>
                <input value={form.slug} onChange={e=>setForm({...form,slug:e.target.value.toLowerCase().replace(/[^a-z0-9-]/g,'-')})} className="flex-1 px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white" placeholder="auto-ecole-centrale"/>
              </div>
              <p className="text-xs text-gray-500 mt-1">Généré automatiquement à partir du nom</p>
            </div>
            
            <div>
              <label className="block text-sm font-medium text-gray-300 mb-1">Description</label>
              <textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={3} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none" placeholder="Description optionnelle..."/>
            </div>
            
            <div className="flex justify-end gap-3 pt-2">
              <Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button>
              <Button onClick={handleSave} loading={saving} disabled={!form.name.trim()}>Enregistrer</Button>
            </div>
          </div>
        </Modal>
      </div>;
    }
