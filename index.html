<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Course Builder Pro</title>
  <meta name="description" content="Plateforme de création et diffusion de cours vidéo multi-centres">
  <meta name="theme-color" content="#1f2937">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{gray:{750:'#2d3748',850:'#1a1f2e'}}}}}</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- SheetJS pour Excel -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#111827}
    .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
    @keyframes spin{to{transform:rotate(360deg)}}.animate-spin{animation:spin 1s linear infinite}
    @keyframes fade-in{from{opacity:0}to{opacity:1}}.animate-fade-in{animation:fade-in .2s ease-out}
    @keyframes slide-in{from{transform:translateX(100%)}to{transform:translateX(0)}}.animate-slide-in{animation:slide-in .2s ease-out}
    input,textarea,select,button{font-family:inherit}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const{useState,useEffect,useRef,useCallback,createContext,useContext}=React;

    // ============ CONFIGURATION - MODIFIER CES VALEURS ============
    const SUPABASE_URL='https://ludepnnsvwvpfbdxweam.supabase.co';
    const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1ZGVwbm5zdnd2cGZiZHh3ZWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNjI4NjgsImV4cCI6MjA4NDYzODg2OH0.SYTPY5l4XwxOK19_p_Dlx3be29i_sxMQD3JLYgqjL2g';
    // ===============================================================

    const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

    const ROLES={SUPER_ADMIN:'super_admin',CENTER_ADMIN:'center_admin',DESIGNER:'designer',TRAINER:'trainer',LEARNER:'learner'};
    const ROLE_LABELS={super_admin:'Super Admin',center_admin:'Admin Centre',designer:'Concepteur',trainer:'Formateur',learner:'Apprenant'};
    const ROLE_COLORS={super_admin:'bg-red-500',center_admin:'bg-purple-500',designer:'bg-blue-500',trainer:'bg-green-500',learner:'bg-gray-500'};
    const PERMISSIONS={
      super_admin:{manageCenters:true,manageUsers:true,manageVideos:true,managePlaylists:true,publish:true,enroll:true,viewProgress:true},
      center_admin:{manageCenters:false,manageUsers:true,manageVideos:true,managePlaylists:true,publish:true,enroll:true,viewProgress:true},
      designer:{manageCenters:false,manageUsers:false,manageVideos:true,managePlaylists:true,publish:false,enroll:false,viewProgress:false},
      trainer:{manageCenters:false,manageUsers:false,manageVideos:false,managePlaylists:false,publish:true,enroll:true,viewProgress:true},
      learner:{manageCenters:false,manageUsers:false,manageVideos:false,managePlaylists:false,publish:false,enroll:false,viewProgress:false}
    };
    const can=(role,perm)=>PERMISSIONS[role]?.[perm]||false;

    // Auth Context
    const AuthContext=createContext(null);
    function AuthProvider({children}){
      const[user,setUser]=useState(null);
      const[profile,setProfile]=useState(null);
      const[center,setCenter]=useState(null);
      const[loading,setLoading]=useState(true);

      useEffect(()=>{
        supabase.auth.getSession().then(({data:{session}})=>{
          if(session?.user){setUser(session.user);loadProfile(session.user.id);}
          else setLoading(false);
        });
        const{data:{subscription}}=supabase.auth.onAuthStateChange(async(event,session)=>{
          if(event==='SIGNED_IN'&&session?.user){setUser(session.user);await loadProfile(session.user.id);}
          else if(event==='SIGNED_OUT'){setUser(null);setProfile(null);setCenter(null);}
        });
        return()=>subscription.unsubscribe();
      },[]);

      const loadProfile=async(userId)=>{
        try{
          const{data}=await supabase.from('profiles').select('*,centers(*)').eq('id',userId).single();
          setProfile(data);setCenter(data?.centers);
        }catch(e){console.error(e);}
        finally{setLoading(false);}
      };

      const signIn=async(email,password)=>{
        const{error}=await supabase.auth.signInWithPassword({email,password});
        return{success:!error,error:error?.message};
      };
      const signUp=async(email,password,meta={})=>{
        const{data,error}=await supabase.auth.signUp({email,password,options:{data:meta}});
        return{success:!error,error:error?.message,needsConfirm:!data.session};
      };
      const signOut=async()=>{await supabase.auth.signOut();setUser(null);setProfile(null);setCenter(null);};

      return<AuthContext.Provider value={{user,profile,center,loading,signIn,signUp,signOut,isAuth:!!user,isSuperAdmin:profile?.role==='super_admin',role:profile?.role||'learner',can:(p)=>can(profile?.role,p),reload:()=>user&&loadProfile(user.id)}}>{children}</AuthContext.Provider>;
    }
    const useAuth=()=>useContext(AuthContext);

    // Icon
    const Icon=({name,size=20,className=''})=>{
      const ref=useRef(null);
      useEffect(()=>{if(ref.current&&lucide.icons[name]){ref.current.innerHTML='';const i=lucide.createElement(lucide.icons[name]);i.setAttribute('width',size);i.setAttribute('height',size);ref.current.appendChild(i);}},[name,size]);
      return<span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{width:size,height:size}}/>;
    };

    // UI Components
    const Button=({children,variant='primary',size='md',icon,loading,disabled,className='',...props})=>{
      const v={primary:'bg-indigo-600 hover:bg-indigo-700',secondary:'bg-gray-700 hover:bg-gray-600',success:'bg-green-600 hover:bg-green-700',danger:'bg-red-600 hover:bg-red-700',ghost:'hover:bg-gray-700'};
      const s={sm:'px-3 py-1.5 text-sm',md:'px-4 py-2',lg:'px-6 py-3'};
      return<button className={`inline-flex items-center justify-center gap-2 rounded-lg font-medium text-white transition disabled:opacity-50 ${v[variant]} ${s[size]} ${className}`} disabled={disabled||loading} {...props}>{loading?<Icon name="Loader2" size={16} className="animate-spin"/>:icon&&<Icon name={icon} size={16}/>}{children}</button>;
    };
    const Input=({label,error,icon,className='',...props})=><div className={className}>{label&&<label className="block text-sm font-medium text-gray-300 mb-1">{label}</label>}<div className="relative">{icon&&<div className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><Icon name={icon} size={18}/></div>}<input className={`w-full px-4 py-2.5 bg-gray-700 border rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 ${icon?'pl-10':''} ${error?'border-red-500':'border-gray-600'}`} {...props}/></div>{error&&<p className="text-red-400 text-sm mt-1">{error}</p>}</div>;
    const Select=({label,options,className='',...props})=><div className={className}>{label&&<label className="block text-sm font-medium text-gray-300 mb-1">{label}</label>}<select className="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 rounded-lg text-white" {...props}>{options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select></div>;
    const Modal=({isOpen,onClose,title,children,size='md'})=>{if(!isOpen)return null;const s={sm:'max-w-md',md:'max-w-lg',lg:'max-w-2xl',xl:'max-w-4xl'};return<div className="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in"><div className="absolute inset-0 bg-black/70" onClick={onClose}/><div className={`relative bg-gray-800 rounded-xl w-full ${s[size]} max-h-[90vh] overflow-auto`}><div className="sticky top-0 bg-gray-800 p-4 border-b border-gray-700 flex items-center justify-between z-10"><h2 className="text-lg font-semibold">{title}</h2><button onClick={onClose} className="p-2 hover:bg-gray-700 rounded-lg"><Icon name="X" size={20}/></button></div><div className="p-4">{children}</div></div></div>;};
    const Card=({children,className='',...props})=><div className={`bg-gray-800 rounded-xl border border-gray-700 ${className}`} {...props}>{children}</div>;
    const RoleBadge=({role})=><span className={`inline-flex px-2 py-1 rounded-full text-xs font-medium ${ROLE_COLORS[role]} text-white`}>{ROLE_LABELS[role]}</span>;
    const Loading=({text})=><div className="flex flex-col items-center justify-center p-8"><div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"/>{text&&<p className="text-gray-400 mt-4">{text}</p>}</div>;
    const Empty=({icon,title,desc,action})=><div className="flex flex-col items-center justify-center p-8 text-center"><div className="text-gray-500 mb-4"><Icon name={icon} size={48}/></div><h3 className="text-lg font-medium text-gray-300">{title}</h3>{desc&&<p className="text-gray-500 mt-1">{desc}</p>}{action&&<div className="mt-4">{action}</div>}</div>;

    // Login Page
    function LoginPage(){
      const{signIn,signUp}=useAuth();
      const[mode,setMode]=useState('login');
      const[email,setEmail]=useState('');
      const[password,setPassword]=useState('');
      const[firstName,setFirstName]=useState('');
      const[lastName,setLastName]=useState('');
      const[loading,setLoading]=useState(false);
      const[msg,setMsg]=useState(null);

      const handleSubmit=async e=>{
        e.preventDefault();setLoading(true);setMsg(null);
        if(mode==='login'){const r=await signIn(email,password);if(!r.success)setMsg({type:'error',text:r.error});}
        else{const r=await signUp(email,password,{first_name:firstName,last_name:lastName});if(r.success){if(r.needsConfirm)setMsg({type:'success',text:'Vérifiez votre email.'});}else setMsg({type:'error',text:r.error});}
        setLoading(false);
      };

      return<div className="min-h-screen bg-gray-900 flex items-center justify-center p-4"><div className="w-full max-w-md"><div className="text-center mb-8"><div className="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-2xl mb-4"><Icon name="GraduationCap" size={32} className="text-white"/></div><h1 className="text-2xl font-bold text-white">Course Builder Pro</h1><p className="text-gray-400 mt-1">Plateforme de formation vidéo</p></div><Card className="p-6"><div className="flex mb-6 bg-gray-700 rounded-lg p-1"><button onClick={()=>setMode('login')} className={`flex-1 py-2 rounded-md text-sm font-medium ${mode==='login'?'bg-indigo-600 text-white':'text-gray-400'}`}>Connexion</button><button onClick={()=>setMode('register')} className={`flex-1 py-2 rounded-md text-sm font-medium ${mode==='register'?'bg-indigo-600 text-white':'text-gray-400'}`}>Inscription</button></div>{msg&&<div className={`p-3 rounded-lg mb-4 text-sm ${msg.type==='error'?'bg-red-500/20 text-red-300':'bg-green-500/20 text-green-300'}`}>{msg.text}</div>}<form onSubmit={handleSubmit} className="space-y-4">{mode==='register'&&<div className="grid grid-cols-2 gap-4"><Input label="Prénom" value={firstName} onChange={e=>setFirstName(e.target.value)} required/><Input label="Nom" value={lastName} onChange={e=>setLastName(e.target.value)} required/></div>}<Input label="Email" type="email" icon="Mail" value={email} onChange={e=>setEmail(e.target.value)} required/><Input label="Mot de passe" type="password" icon="Lock" value={password} onChange={e=>setPassword(e.target.value)} required minLength={6}/><Button type="submit" className="w-full" loading={loading}>{mode==='login'?'Se connecter':"S'inscrire"}</Button></form></Card></div></div>;
    }

    // App Layout
    function AppLayout(){
      const{profile,signOut,center,can,isSuperAdmin}=useAuth();
      const[sidebarOpen,setSidebarOpen]=useState(window.innerWidth>=1024);
      const[page,setPage]=useState('dashboard');
      const[isMobile]=useState(window.innerWidth<1024);

      const menu=[
        {id:'dashboard',label:'Tableau de bord',icon:'LayoutDashboard',roles:['super_admin','center_admin','designer','trainer','learner']},
        {id:'centers',label:'Centres',icon:'Building2',roles:['super_admin']},
        {id:'users',label:'Utilisateurs',icon:'Users',roles:['super_admin','center_admin']},
        {id:'videos',label:'Bibliothèque',icon:'Film',roles:['super_admin','center_admin','designer']},
        {id:'playlists',label:'Cours',icon:'BookOpen',roles:['super_admin','center_admin','designer','trainer']},
        {id:'enrollments',label:'Inscriptions',icon:'UserPlus',roles:['super_admin','center_admin','trainer']},
        {id:'my-courses',label:'Mes cours',icon:'GraduationCap',roles:['learner']},
        {id:'progress',label:'Progression',icon:'BarChart3',roles:['super_admin','center_admin','trainer']}
      ].filter(i=>i.roles.includes(profile?.role));

      return<div className="min-h-screen bg-gray-900 text-white flex">
        <aside className={`fixed lg:static inset-y-0 left-0 z-40 w-64 bg-gray-800 border-r border-gray-700 transform transition-transform ${sidebarOpen?'translate-x-0':'-translate-x-full lg:translate-x-0'}`}>
          <div className="h-full flex flex-col">
            <div className="p-4 border-b border-gray-700"><div className="flex items-center gap-3"><div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center"><Icon name="GraduationCap" size={24}/></div><div className="flex-1 min-w-0"><h1 className="font-bold truncate">Course Builder</h1>{center&&<p className="text-xs text-gray-400 truncate">{center.name}</p>}</div></div></div>
            <nav className="flex-1 overflow-y-auto p-3 space-y-1">{menu.map(item=><button key={item.id} onClick={()=>{setPage(item.id);if(isMobile)setSidebarOpen(false);}} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left transition ${page===item.id?'bg-indigo-600':'text-gray-300 hover:bg-gray-700'}`}><Icon name={item.icon} size={20}/><span>{item.label}</span></button>)}</nav>
            <div className="p-4 border-t border-gray-700"><div className="flex items-center gap-3 mb-3"><div className="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center"><Icon name="User" size={20}/></div><div className="flex-1 min-w-0"><p className="font-medium truncate">{profile?.first_name} {profile?.last_name}</p><RoleBadge role={profile?.role}/></div></div><Button variant="ghost" className="w-full" icon="LogOut" onClick={signOut}>Déconnexion</Button></div>
          </div>
        </aside>
        {sidebarOpen&&isMobile&&<div className="fixed inset-0 bg-black/50 z-30" onClick={()=>setSidebarOpen(false)}/>}
        <main className="flex-1 min-h-screen">
          <header className="lg:hidden bg-gray-800 border-b border-gray-700 p-4 flex items-center gap-4"><button onClick={()=>setSidebarOpen(true)} className="p-2 hover:bg-gray-700 rounded-lg"><Icon name="Menu" size={24}/></button><h1 className="font-semibold">{menu.find(i=>i.id===page)?.label}</h1></header>
          <div className="p-4 lg:p-6">
            {page==='dashboard'&&<DashboardPage/>}
            {page==='centers'&&<CentersPage/>}
            {page==='users'&&<UsersPage/>}
            {page==='videos'&&<VideosPage/>}
            {page==='playlists'&&<PlaylistsPage/>}
            {page==='enrollments'&&<EnrollmentsPage/>}
            {page==='my-courses'&&<MyCoursesPage/>}
            {page==='progress'&&<ProgressPage/>}
          </div>
        </main>
      </div>;
    }

    // Dashboard
    function DashboardPage(){
      const{profile,isSuperAdmin}=useAuth();
      const[stats,setStats]=useState(null);
      const[loading,setLoading]=useState(true);

      useEffect(()=>{
        (async()=>{
          const{data}=await supabase.rpc('get_dashboard_stats');
          setStats(data);setLoading(false);
        })();
      },[]);

      if(loading)return<Loading text="Chargement..."/>;

      const cards=[
        {label:'Utilisateurs',value:stats?.total_users||0,icon:'Users',color:'text-blue-400'},
        {label:'Vidéos',value:stats?.total_videos||0,icon:'Film',color:'text-purple-400'},
        {label:'Cours',value:stats?.total_playlists||0,icon:'BookOpen',color:'text-green-400'},
        {label:'Inscriptions',value:stats?.total_enrollments||0,icon:'UserPlus',color:'text-yellow-400'}
      ];
      if(isSuperAdmin)cards.unshift({label:'Centres',value:stats?.total_centers||0,icon:'Building2',color:'text-red-400'});

      return<div><h1 className="text-2xl font-bold mb-6">Tableau de bord</h1><div className="grid grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-4">{cards.map(c=><Card key={c.label} className="p-4"><div className="flex items-center gap-3"><div className={c.color}><Icon name={c.icon} size={24}/></div><div><p className="text-gray-400 text-sm">{c.label}</p><p className="text-2xl font-bold">{c.value}</p></div></div></Card>)}</div></div>;
    }

    // Centers (Super Admin)
    function CentersPage(){
      const{isSuperAdmin}=useAuth();
      const[centers,setCenters]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({name:'',slug:'',description:''});

      useEffect(()=>{loadCenters();},[]);
      const loadCenters=async()=>{const{data}=await supabase.from('centers').select('*').order('name');setCenters(data||[]);setLoading(false);};

      const handleSave=async()=>{
        const payload={name:form.name,slug:form.slug.toLowerCase().replace(/[^a-z0-9-]/g,'-'),description:form.description};
        if(editing)await supabase.from('centers').update(payload).eq('id',editing.id);
        else await supabase.from('centers').insert(payload);
        loadCenters();setModal(false);setForm({name:'',slug:'',description:''});setEditing(null);
      };

      const handleDelete=async id=>{if(!confirm('Supprimer ?'))return;await supabase.from('centers').delete().eq('id',id);loadCenters();};

      if(!isSuperAdmin)return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6"><h1 className="text-2xl font-bold">Centres</h1><Button icon="Plus" onClick={()=>setModal(true)}>Nouveau</Button></div>
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{centers.map(c=><Card key={c.id} className="p-4"><div className="flex items-center gap-3 mb-3"><div className="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center"><Icon name="Building2" size={24}/></div><div><h3 className="font-semibold">{c.name}</h3><p className="text-sm text-gray-400">/{c.slug}</p></div></div><div className="flex gap-2"><Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(c);setForm({name:c.name,slug:c.slug,description:c.description||''});setModal(true);}}>Modifier</Button><Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(c.id)}>Supprimer</Button></div></Card>)}</div>
        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title={editing?'Modifier':'Nouveau centre'}><div className="space-y-4"><Input label="Nom" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/><Input label="Slug" value={form.slug} onChange={e=>setForm({...form,slug:e.target.value})}/><div><label className="block text-sm font-medium text-gray-300 mb-1">Description</label><textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={3} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/></div><div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button><Button onClick={handleSave}>Enregistrer</Button></div></div></Modal>
      </div>;
    }

    // Users
    function UsersPage(){
      const{profile,center,isSuperAdmin,can}=useAuth();
      const[users,setUsers]=useState([]);
      const[centers,setCenters]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[importModal,setImportModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[search,setSearch]=useState('');
      const[form,setForm]=useState({email:'',first_name:'',last_name:'',role:'learner',center_id:''});
      const[importData,setImportData]=useState([]);
      const[importLoading,setImportLoading]=useState(false);
      const[importResult,setImportResult]=useState(null);
      const fileInputRef=useRef(null);

      useEffect(()=>{loadData();},[]);
      const loadData=async()=>{
        let q=supabase.from('profiles').select('*,centers(name)').order('created_at',{ascending:false});
        if(!isSuperAdmin)q=q.eq('center_id',center?.id);
        const{data:u}=await q;setUsers(u||[]);
        if(isSuperAdmin){const{data:c}=await supabase.from('centers').select('id,name');setCenters(c||[]);}
        setLoading(false);
      };

      const handleSave=async()=>{
        if(editing){
          await supabase.from('profiles').update({first_name:form.first_name,last_name:form.last_name,role:form.role,center_id:form.center_id||null}).eq('id',editing.id);
          loadData();setModal(false);setEditing(null);
        }
      };

      // Générer mot de passe aléatoire
      const generatePassword=()=>{
        const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%';
        let pwd='';for(let i=0;i<10;i++)pwd+=chars.charAt(Math.floor(Math.random()*chars.length));
        return pwd;
      };

      // Import Excel
      const handleFileSelect=async(e)=>{
        const file=e.target.files[0];
        if(!file)return;
        try{
          const data=await file.arrayBuffer();
          const workbook=XLSX.read(data);
          const sheetName=workbook.SheetNames[0];
          const sheet=workbook.Sheets[sheetName];
          const jsonData=XLSX.utils.sheet_to_json(sheet);
          
          const mappedData=jsonData.map((row,index)=>{
            const role=String(row['Rôle']||row['Role']||row['role']||'').toLowerCase();
            const validRoles=['learner','trainer','designer','center_admin'];
            return{
              _index:index+1,
              email:row['Email']||row['email']||'',
              first_name:row['Prénom']||row['Prenom']||row['first_name']||'',
              last_name:row['Nom']||row['last_name']||'',
              role:validRoles.includes(role)?role:'learner',
              password:row['Mot de passe temporaire']||row['Password']||row['password']||'',
              center_name:row['Centre (super_admin uniquement)']||row['Centre']||row['center']||'',
              _valid:!!(row['Email']||row['email'])&&!!(row['Prénom']||row['Prenom']||row['first_name'])&&!!(row['Nom']||row['last_name'])
            };
          });
          setImportData(mappedData);
          setImportResult(null);
        }catch(err){
          alert('Erreur de lecture: '+err.message);
        }
        e.target.value='';
      };

      const handleImport=async()=>{
        const validData=importData.filter(d=>d._valid);
        if(validData.length===0){alert('Aucune donnée valide');return;}
        
        setImportLoading(true);
        let created=0,updated=0,errors=0;
        const results=[];

        for(const item of validData){
          const password=item.password||generatePassword();
          let targetCenterId=center?.id;
          
          // Super admin peut choisir le centre
          if(isSuperAdmin&&item.center_name){
            const foundCenter=centers.find(c=>c.name.toLowerCase()===item.center_name.toLowerCase());
            if(foundCenter)targetCenterId=foundCenter.id;
          }

          // Vérifier si l'email existe déjà
          const{data:existingProfile}=await supabase.from('profiles').select('id').eq('email',item.email).single();
          
          if(existingProfile){
            // Mise à jour du profil existant
            const{error}=await supabase.from('profiles').update({
              first_name:item.first_name,
              last_name:item.last_name,
              role:item.role,
              center_id:targetCenterId
            }).eq('id',existingProfile.id);
            if(error){errors++;results.push({email:item.email,status:'error',message:error.message});}
            else{updated++;results.push({email:item.email,status:'updated'});}
          }else{
            // Créer nouveau compte
            const{data:authData,error:authError}=await supabase.auth.signUp({
              email:item.email,
              password:password,
              options:{data:{first_name:item.first_name,last_name:item.last_name}}
            });
            
            if(authError){
              errors++;
              results.push({email:item.email,status:'error',message:authError.message});
            }else if(authData.user){
              // Mettre à jour le profil avec le bon rôle et centre
              await supabase.from('profiles').update({
                first_name:item.first_name,
                last_name:item.last_name,
                role:item.role,
                center_id:targetCenterId
              }).eq('id',authData.user.id);
              created++;
              results.push({email:item.email,status:'created',password:password});
            }
          }
        }
        
        setImportLoading(false);
        setImportResult({created,updated,errors,results});
        loadData();
      };

      const downloadTemplate=()=>{
        const template=[
          {'Email':'jean.dupont@email.com','Prénom':'Jean','Nom':'Dupont','Rôle':'learner','Mot de passe temporaire':'','Centre (super_admin uniquement)':''},
          {'Email':'marie.martin@email.com','Prénom':'Marie','Nom':'Martin','Rôle':'trainer','Mot de passe temporaire':'','Centre (super_admin uniquement)':''}
        ];
        const ws=XLSX.utils.json_to_sheet(template);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Utilisateurs');
        XLSX.writeFile(wb,'template_import_utilisateurs.xlsx');
      };

      const exportResults=()=>{
        if(!importResult?.results)return;
        const data=importResult.results.map(r=>({
          'Email':r.email,
          'Statut':r.status==='created'?'Créé':r.status==='updated'?'Mis à jour':'Erreur',
          'Mot de passe':r.password||'',
          'Message':r.message||''
        }));
        const ws=XLSX.utils.json_to_sheet(data);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Résultats');
        XLSX.writeFile(wb,'resultat_import_utilisateurs.xlsx');
      };

      const filtered=users.filter(u=>{
        if(!search)return true;
        const s=search.toLowerCase();
        return u.email?.toLowerCase().includes(s)||u.first_name?.toLowerCase().includes(s)||u.last_name?.toLowerCase().includes(s);
      });

      if(!can('manageUsers'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4">
          <h1 className="text-2xl font-bold">Utilisateurs</h1>
          <Button variant="secondary" icon="Upload" onClick={()=>setImportModal(true)}>Importer</Button>
        </div>
        <Card className="p-4 mb-6"><Input icon="Search" placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)}/></Card>
        <Card><div className="overflow-x-auto"><table className="w-full"><thead className="bg-gray-750"><tr><th className="text-left p-4 font-medium text-gray-400">Utilisateur</th><th className="text-left p-4 font-medium text-gray-400">Rôle</th>{isSuperAdmin&&<th className="text-left p-4 font-medium text-gray-400">Centre</th>}<th className="text-right p-4"></th></tr></thead><tbody className="divide-y divide-gray-700">{filtered.map(u=><tr key={u.id} className="hover:bg-gray-750/50"><td className="p-4"><div className="flex items-center gap-3"><div className="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center"><Icon name="User" size={18}/></div><div><p className="font-medium">{u.first_name} {u.last_name}</p><p className="text-sm text-gray-400">{u.email}</p></div></div></td><td className="p-4"><RoleBadge role={u.role}/></td>{isSuperAdmin&&<td className="p-4 text-gray-400">{u.centers?.name||'-'}</td>}<td className="p-4 text-right"><Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(u);setForm({email:u.email,first_name:u.first_name||'',last_name:u.last_name||'',role:u.role,center_id:u.center_id||''});setModal(true);}}/></td></tr>)}</tbody></table></div></Card>
        
        {/* Modal Modifier */}
        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title="Modifier"><div className="space-y-4"><Input label="Email" value={form.email} disabled/><div className="grid grid-cols-2 gap-4"><Input label="Prénom" value={form.first_name} onChange={e=>setForm({...form,first_name:e.target.value})}/><Input label="Nom" value={form.last_name} onChange={e=>setForm({...form,last_name:e.target.value})}/></div><Select label="Rôle" value={form.role} onChange={e=>setForm({...form,role:e.target.value})} options={Object.entries(ROLE_LABELS).filter(([r])=>isSuperAdmin||r!=='super_admin').map(([v,l])=>({value:v,label:l}))}/>{isSuperAdmin&&<Select label="Centre" value={form.center_id} onChange={e=>setForm({...form,center_id:e.target.value})} options={[{value:'',label:'Aucun'},...centers.map(c=>({value:c.id,label:c.name}))]}/>}<div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button><Button onClick={handleSave}>Enregistrer</Button></div></div></Modal>

        {/* Modal Import */}
        <Modal isOpen={importModal} onClose={()=>{setImportModal(false);setImportData([]);setImportResult(null);}} title="Importer des utilisateurs" size="lg">
          <div className="space-y-4">
            <div className="bg-gray-700/50 rounded-lg p-4">
              <h3 className="font-medium mb-2 flex items-center gap-2"><Icon name="Info" size={18}/>Format du fichier</h3>
              <p className="text-sm text-gray-400 mb-3">Colonnes : Email, Prénom, Nom, Rôle, Mot de passe (optionnel){isSuperAdmin&&', Centre (optionnel)'}</p>
              <p className="text-sm text-gray-400 mb-3">Rôles valides : learner, trainer, designer, center_admin</p>
              <Button variant="ghost" size="sm" icon="Download" onClick={downloadTemplate}>Télécharger le template</Button>
            </div>

            <div className="border-2 border-dashed border-gray-600 rounded-lg p-8 text-center">
              <input type="file" ref={fileInputRef} onChange={handleFileSelect} accept=".xlsx,.xls,.csv" className="hidden"/>
              <Icon name="Users" size={48} className="mx-auto text-gray-500 mb-4"/>
              <p className="text-gray-400 mb-4">Glissez un fichier Excel ou</p>
              <Button variant="secondary" onClick={()=>fileInputRef.current?.click()}>Parcourir</Button>
            </div>

            {importData.length>0&&!importResult&&(
              <div>
                <h3 className="font-medium mb-2">Aperçu ({importData.filter(d=>d._valid).length} utilisateurs valides)</h3>
                <div className="max-h-60 overflow-y-auto bg-gray-700/50 rounded-lg">
                  <table className="w-full text-sm">
                    <thead className="bg-gray-700 sticky top-0">
                      <tr>
                        <th className="p-2 text-left">Email</th>
                        <th className="p-2 text-left">Nom</th>
                        <th className="p-2 text-left">Rôle</th>
                        <th className="p-2 text-left">Statut</th>
                      </tr>
                    </thead>
                    <tbody>
                      {importData.map((row,i)=>(
                        <tr key={i} className={row._valid?'':'bg-red-900/20'}>
                          <td className="p-2">{row.email||'-'}</td>
                          <td className="p-2">{row.first_name} {row.last_name}</td>
                          <td className="p-2"><RoleBadge role={row.role}/></td>
                          <td className="p-2">{row._valid?<span className="text-green-400">✓</span>:<span className="text-red-400">✗ Incomplet</span>}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {importResult&&(
              <div className="space-y-3">
                <div className={`p-4 rounded-lg ${importResult.errors>0?'bg-yellow-500/20':'bg-green-500/20'}`}>
                  <p className="font-medium">
                    {importResult.created>0&&<span className="text-green-400">✅ {importResult.created} créé(s)</span>}
                    {importResult.created>0&&importResult.updated>0&&<span> | </span>}
                    {importResult.updated>0&&<span className="text-blue-400">🔄 {importResult.updated} mis à jour</span>}
                    {importResult.errors>0&&<span className="text-yellow-400"> | ⚠️ {importResult.errors} erreur(s)</span>}
                  </p>
                </div>
                {importResult.results?.some(r=>r.password)&&(
                  <div className="bg-indigo-500/20 p-4 rounded-lg">
                    <p className="text-sm text-indigo-300 mb-2">⚠️ Des mots de passe temporaires ont été générés. Exportez les résultats pour les récupérer.</p>
                    <Button variant="secondary" size="sm" icon="Download" onClick={exportResults}>Exporter les résultats</Button>
                  </div>
                )}
              </div>
            )}

            <div className="flex justify-end gap-3">
              <Button variant="secondary" onClick={()=>{setImportModal(false);setImportData([]);setImportResult(null);}}>Fermer</Button>
              {importData.length>0&&!importResult&&(
                <Button icon="Upload" onClick={handleImport} loading={importLoading} disabled={importData.filter(d=>d._valid).length===0}>
                  Importer {importData.filter(d=>d._valid).length} utilisateur(s)
                </Button>
              )}
            </div>
          </div>
        </Modal>
      </div>;
    }

    // Videos avec Import Excel/CSV
    function VideosPage(){
      const{center,isSuperAdmin,profile}=useAuth();
      const[videos,setVideos]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[importModal,setImportModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[search,setSearch]=useState('');
      const[form,setForm]=useState({title:'',vimeo_id:'',duration:'',category:'',description:'',sort_order:'',tags:'',specificities:'',theme:'',creation_date:'',thumbnail_url:''});
      const[importData,setImportData]=useState([]);
      const[importLoading,setImportLoading]=useState(false);
      const[importResult,setImportResult]=useState(null);
      const fileInputRef=useRef(null);

      useEffect(()=>{loadVideos();},[]);
      const loadVideos=async()=>{
        let q=supabase.from('videos').select('*').order('created_at',{ascending:false});
        if(!isSuperAdmin&&center?.id)q=q.eq('center_id',center.id);
        const{data}=await q;setVideos(data||[]);setLoading(false);
      };

      const handleSave=async()=>{
        const vimeoMatch=form.vimeo_id.match(/vimeo\.com\/(\d+)/)||form.vimeo_id.match(/^(\d+)$/);
        const vimeoId=vimeoMatch?vimeoMatch[1]:form.vimeo_id;
        const tagsArray=form.tags?form.tags.split(',').map(t=>t.trim()).filter(t=>t):null;
        const payload={
          title:form.title,
          vimeo_id:vimeoId,
          duration:form.duration||null,
          category:form.category||null,
          description:form.description||null,
          sort_order:form.sort_order?parseInt(form.sort_order):null,
          tags:tagsArray,
          specificities:form.specificities||null,
          theme:form.theme||null,
          creation_date:form.creation_date||null,
          thumbnail_url:form.thumbnail_url||null,
          center_id:center?.id,
          created_by:profile?.id
        };
        if(editing)await supabase.from('videos').update(payload).eq('id',editing.id);
        else await supabase.from('videos').insert(payload);
        loadVideos();setModal(false);resetForm();
      };

      const handleDelete=async id=>{if(!confirm('Supprimer ?'))return;await supabase.from('videos').delete().eq('id',id);loadVideos();};
      const resetForm=()=>{setForm({title:'',vimeo_id:'',duration:'',category:'',description:'',sort_order:'',tags:'',specificities:'',theme:'',creation_date:'',thumbnail_url:''});setEditing(null);};

      // Import Excel/CSV
      const handleFileSelect=async(e)=>{
        const file=e.target.files[0];
        if(!file)return;
        
        try{
          const data=await file.arrayBuffer();
          const workbook=XLSX.read(data);
          const sheetName=workbook.SheetNames[0];
          const sheet=workbook.Sheets[sheetName];
          const jsonData=XLSX.utils.sheet_to_json(sheet);
          
          // Mapper les colonnes (anciennes + nouvelles)
          const mappedData=jsonData.map((row,index)=>({
            _index:index+1,
            title:row['Titre']||row['title']||row['Title']||'',
            vimeo_id:String(row['ID Vimeo']||row['vimeo_id']||row['Vimeo ID']||row['VimeoID']||''),
            duration:row['Durée']||row['duration']||row['Duration']||'',
            category:row['Catégorie']||row['category']||row['Category']||'',
            description:row['Description']||row['description']||'',
            // Nouvelles colonnes
            sort_order:row['Ordre (numéro pour trier)']||row['Ordre']||row['sort_order']||row['order']||null,
            tags:row['Tags (mots-clés séparés par virgules)']||row['Tags']||row['tags']||'',
            specificities:row['Spécificités']||row['Spécificités ']||row['specificities']||'',
            theme:row['Thème']||row['theme']||row['Theme']||'',
            creation_date:row['Date de création']||row['creation_date']||row['Date']||null,
            thumbnail_url:row['Miniature URL (image personnalisée)']||row['Miniature URL']||row['thumbnail_url']||row['Thumbnail']||'',
            _valid:!!(row['Titre']||row['title']||row['Title'])&&!!(row['ID Vimeo']||row['vimeo_id']||row['Vimeo ID']||row['VimeoID'])
          }));
          
          setImportData(mappedData);
          setImportResult(null);
        }catch(err){
          alert('Erreur de lecture du fichier: '+err.message);
        }
        
        e.target.value='';
      };

      const handleImport=async()=>{
        const validData=importData.filter(d=>d._valid);
        if(validData.length===0){
          alert('Aucune donnée valide à importer');
          return;
        }
        
        setImportLoading(true);
        let created=0,updated=0,errors=0;
        
        for(const item of validData){
          const vimeoMatch=item.vimeo_id.match(/vimeo\.com\/(\d+)/)||item.vimeo_id.match(/^(\d+)$/);
          const vimeoId=vimeoMatch?vimeoMatch[1]:item.vimeo_id;
          
          // Préparer les tags comme array
          const tagsArray=item.tags?item.tags.split(',').map(t=>t.trim()).filter(t=>t):[];
          
          // Préparer la date
          let creationDate=null;
          if(item.creation_date){
            const d=new Date(item.creation_date);
            if(!isNaN(d))creationDate=d.toISOString().split('T')[0];
          }
          
          // Données communes pour insert/update
          const videoData={
            title:item.title,
            duration:item.duration||null,
            category:item.category||null,
            description:item.description||null,
            sort_order:item.sort_order?parseInt(item.sort_order):null,
            tags:tagsArray.length>0?tagsArray:null,
            specificities:item.specificities||null,
            theme:item.theme||null,
            creation_date:creationDate,
            thumbnail_url:item.thumbnail_url||null
          };
          
          // Vérifier si la vidéo existe déjà (par ID Vimeo)
          const{data:existing}=await supabase.from('videos').select('id').eq('vimeo_id',vimeoId).eq('center_id',center?.id).single();
          
          if(existing){
            // Mise à jour
            const{error}=await supabase.from('videos').update(videoData).eq('id',existing.id);
            if(error){console.error('Update error:',error);errors++;}
            else updated++;
          }else{
            // Création
            const{error}=await supabase.from('videos').insert({
              ...videoData,
              vimeo_id:vimeoId,
              center_id:center?.id,
              created_by:profile?.id
            });
            if(error){console.error('Insert error:',error);errors++;}
            else created++;
          }
        }
        
        setImportLoading(false);
        setImportResult({created,updated,errors});
        loadVideos();
      };

      const downloadTemplate=()=>{
        const template=[
          {
            'Titre':'Introduction au cours',
            'ID Vimeo':'123456789',
            'Durée':'5:30',
            'Ordre (numéro pour trier)':1,
            'Tags (mots-clés séparés par virgules)':'introduction, bases',
            'Catégorie':'Introduction',
            'Spécificités':'Vidéo courte',
            'Thème':'Fondamentaux',
            'Date de création':'2024-01-15',
            'Miniature URL (image personnalisée)':'',
            'Description':'Vidéo de présentation du cours'
          },
          {
            'Titre':'Chapitre 1 - Les bases',
            'ID Vimeo':'234567890',
            'Durée':'12:45',
            'Ordre (numéro pour trier)':2,
            'Tags (mots-clés séparés par virgules)':'chapitre 1, théorie',
            'Catégorie':'Chapitre 1',
            'Spécificités':'Théorie approfondie',
            'Thème':'Fondamentaux',
            'Date de création':'2024-01-20',
            'Miniature URL (image personnalisée)':'',
            'Description':'Première partie sur les fondamentaux'
          }
        ];
        const ws=XLSX.utils.json_to_sheet(template);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Videos');
        XLSX.writeFile(wb,'template_import_videos.xlsx');
      };

      const filtered=videos.filter(v=>!search||v.title?.toLowerCase().includes(search.toLowerCase())||v.category?.toLowerCase().includes(search.toLowerCase()));

      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4">
          <h1 className="text-2xl font-bold">Bibliothèque vidéo</h1>
          <div className="flex gap-2">
            <Button variant="secondary" icon="Upload" onClick={()=>setImportModal(true)}>Importer</Button>
            <Button icon="Plus" onClick={()=>{resetForm();setModal(true);}}>Ajouter</Button>
          </div>
        </div>
        <Card className="p-4 mb-6"><Input icon="Search" placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)}/></Card>
        {filtered.length===0?<Empty icon="Film" title="Aucune vidéo" action={<Button icon="Plus" onClick={()=>setModal(true)}>Ajouter une vidéo</Button>}/>:
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{filtered.map(v=><Card key={v.id} className="overflow-hidden"><div className="aspect-video bg-gray-900 relative">{v.thumbnail_url?<img src={v.thumbnail_url} className="w-full h-full object-cover"/>:<iframe src={`https://player.vimeo.com/video/${v.vimeo_id}?background=1`} className="w-full h-full" allow="autoplay"/>}<div className="absolute bottom-2 right-2 px-2 py-1 bg-black/70 rounded text-xs">{v.duration||'--:--'}</div>{v.sort_order&&<div className="absolute top-2 left-2 w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center text-xs font-bold">{v.sort_order}</div>}</div><div className="p-4"><h3 className="font-semibold truncate">{v.title}</h3><div className="flex flex-wrap gap-1 mt-2">{v.category&&<span className="px-2 py-1 bg-gray-700 rounded text-xs">{v.category}</span>}{v.theme&&<span className="px-2 py-1 bg-indigo-600/30 text-indigo-300 rounded text-xs">{v.theme}</span>}</div>{v.tags&&v.tags.length>0&&<div className="flex flex-wrap gap-1 mt-2">{v.tags.slice(0,3).map((tag,i)=><span key={i} className="px-2 py-0.5 bg-gray-600/50 rounded text-xs text-gray-300">#{tag}</span>)}{v.tags.length>3&&<span className="text-xs text-gray-500">+{v.tags.length-3}</span>}</div>}<div className="flex gap-2 mt-3"><Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(v);setForm({title:v.title,vimeo_id:v.vimeo_id,duration:v.duration||'',category:v.category||'',description:v.description||'',sort_order:v.sort_order||'',tags:v.tags?v.tags.join(', '):'',specificities:v.specificities||'',theme:v.theme||'',creation_date:v.creation_date||'',thumbnail_url:v.thumbnail_url||''});setModal(true);}}>Modifier</Button><Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(v.id)}>Supprimer</Button></div></div></Card>)}</div>}
        
        {/* Modal Ajouter/Modifier */}
        <Modal isOpen={modal} onClose={()=>{setModal(false);resetForm();}} title={editing?'Modifier':'Ajouter une vidéo'} size="lg"><div className="space-y-4"><div className="grid grid-cols-1 md:grid-cols-2 gap-4"><Input label="Titre *" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} required/><Input label="URL ou ID Vimeo *" value={form.vimeo_id} onChange={e=>setForm({...form,vimeo_id:e.target.value})} placeholder="123456789" required/></div><div className="grid grid-cols-3 gap-4"><Input label="Durée" value={form.duration} onChange={e=>setForm({...form,duration:e.target.value})} placeholder="5:30"/><Input label="Ordre" type="number" value={form.sort_order} onChange={e=>setForm({...form,sort_order:e.target.value})} placeholder="1"/><Input label="Date création" type="date" value={form.creation_date} onChange={e=>setForm({...form,creation_date:e.target.value})}/></div><div className="grid grid-cols-2 gap-4"><Input label="Catégorie" value={form.category} onChange={e=>setForm({...form,category:e.target.value})} placeholder="Chapitre 1"/><Input label="Thème" value={form.theme} onChange={e=>setForm({...form,theme:e.target.value})} placeholder="Fondamentaux"/></div><Input label="Tags (séparés par virgules)" value={form.tags} onChange={e=>setForm({...form,tags:e.target.value})} placeholder="introduction, bases, théorie"/><Input label="Spécificités" value={form.specificities} onChange={e=>setForm({...form,specificities:e.target.value})} placeholder="Caractéristiques particulières"/><Input label="Miniature URL" value={form.thumbnail_url} onChange={e=>setForm({...form,thumbnail_url:e.target.value})} placeholder="https://..."/><div><label className="block text-sm font-medium text-gray-300 mb-1">Description</label><textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={3} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/></div><div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>{setModal(false);resetForm();}}>Annuler</Button><Button onClick={handleSave}>Enregistrer</Button></div></div></Modal>

        {/* Modal Import */}
        <Modal isOpen={importModal} onClose={()=>{setImportModal(false);setImportData([]);setImportResult(null);}} title="Importer des vidéos" size="lg">
          <div className="space-y-4">
            <div className="bg-gray-700/50 rounded-lg p-4">
              <h3 className="font-medium mb-2 flex items-center gap-2"><Icon name="Info" size={18}/>Format du fichier</h3>
              <p className="text-sm text-gray-400 mb-3">Le fichier Excel ou CSV doit contenir les colonnes suivantes :</p>
              <div className="bg-gray-800 rounded p-2 text-sm font-mono">
                Titre | ID Vimeo | Durée | Catégorie | Description
              </div>
              <Button variant="ghost" size="sm" icon="Download" className="mt-3" onClick={downloadTemplate}>
                Télécharger le template
              </Button>
            </div>

            <div className="border-2 border-dashed border-gray-600 rounded-lg p-8 text-center">
              <input type="file" ref={fileInputRef} onChange={handleFileSelect} accept=".xlsx,.xls,.csv" className="hidden"/>
              <Icon name="FileSpreadsheet" size={48} className="mx-auto text-gray-500 mb-4"/>
              <p className="text-gray-400 mb-4">Glissez un fichier Excel/CSV ou</p>
              <Button variant="secondary" onClick={()=>fileInputRef.current?.click()}>Parcourir</Button>
            </div>

            {importData.length>0&&(
              <div>
                <h3 className="font-medium mb-2">Aperçu ({importData.filter(d=>d._valid).length} vidéos valides)</h3>
                <div className="max-h-60 overflow-y-auto bg-gray-700/50 rounded-lg">
                  <table className="w-full text-sm">
                    <thead className="bg-gray-700 sticky top-0">
                      <tr>
                        <th className="p-2 text-left">#</th>
                        <th className="p-2 text-left">Titre</th>
                        <th className="p-2 text-left">ID Vimeo</th>
                        <th className="p-2 text-left">Durée</th>
                        <th className="p-2 text-left">Statut</th>
                      </tr>
                    </thead>
                    <tbody>
                      {importData.map((row,i)=>(
                        <tr key={i} className={row._valid?'':'bg-red-900/20'}>
                          <td className="p-2">{row._index}</td>
                          <td className="p-2 truncate max-w-[200px]">{row.title||'-'}</td>
                          <td className="p-2">{row.vimeo_id||'-'}</td>
                          <td className="p-2">{row.duration||'-'}</td>
                          <td className="p-2">{row._valid?<span className="text-green-400">✓</span>:<span className="text-red-400">✗ Incomplet</span>}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {importResult&&(
              <div className={`p-4 rounded-lg ${importResult.errors>0?'bg-yellow-500/20':'bg-green-500/20'}`}>
                <p className="font-medium">
                  {importResult.created>0&&<span className="text-green-400">✅ {importResult.created} créée(s)</span>}
                  {importResult.created>0&&importResult.updated>0&&<span> | </span>}
                  {importResult.updated>0&&<span className="text-blue-400">🔄 {importResult.updated} mise(s) à jour</span>}
                  {importResult.errors>0&&<span className="text-yellow-400"> | ⚠️ {importResult.errors} erreur(s)</span>}
                </p>
              </div>
            )}

            <div className="flex justify-end gap-3">
              <Button variant="secondary" onClick={()=>{setImportModal(false);setImportData([]);setImportResult(null);}}>Fermer</Button>
              {importData.length>0&&!importResult&&(
                <Button icon="Upload" onClick={handleImport} loading={importLoading} disabled={importData.filter(d=>d._valid).length===0}>
                  Importer {importData.filter(d=>d._valid).length} vidéo(s)
                </Button>
              )}
            </div>
          </div>
        </Modal>
      </div>;
    }

    // Playlists
    function PlaylistsPage(){
      const{center,isSuperAdmin,can,profile}=useAuth();
      const[playlists,setPlaylists]=useState([]);
      const[videos,setVideos]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({title:'',description:''});
      const[editVideosModal,setEditVideosModal]=useState(null);
      const[playlistVideos,setPlaylistVideos]=useState([]);

      useEffect(()=>{loadData();},[]);
      const loadData=async()=>{
        let q=supabase.from('playlists').select('*,playlist_videos(count)').order('created_at',{ascending:false});
        if(!isSuperAdmin&&center?.id)q=q.eq('center_id',center.id);
        const{data:p}=await q;setPlaylists(p||[]);
        
        let qv=supabase.from('videos').select('*').eq('status','active');
        if(!isSuperAdmin&&center?.id)qv=qv.eq('center_id',center.id);
        const{data:v}=await qv;setVideos(v||[]);
        setLoading(false);
      };

      const handleSave=async()=>{
        const payload={title:form.title,description:form.description,center_id:center?.id,created_by:profile?.id};
        if(editing)await supabase.from('playlists').update(payload).eq('id',editing.id);
        else await supabase.from('playlists').insert(payload);
        loadData();setModal(false);setForm({title:'',description:''});setEditing(null);
      };

      const handleDelete=async id=>{if(!confirm('Supprimer ?'))return;await supabase.from('playlists').delete().eq('id',id);loadData();};

      const openEditVideos=async(playlist)=>{
        const{data}=await supabase.from('playlist_videos').select('*,videos(*)').eq('playlist_id',playlist.id).order('position');
        setPlaylistVideos(data||[]);setEditVideosModal(playlist);
      };

      const addVideoToPlaylist=async(videoId)=>{
        const pos=playlistVideos.length;
        const{data}=await supabase.from('playlist_videos').insert({playlist_id:editVideosModal.id,video_id:videoId,position:pos}).select('*,videos(*)').single();
        if(data)setPlaylistVideos([...playlistVideos,data]);
      };

      const removeVideoFromPlaylist=async(pvId)=>{
        await supabase.from('playlist_videos').delete().eq('id',pvId);
        setPlaylistVideos(playlistVideos.filter(pv=>pv.id!==pvId));
      };

      const togglePublish=async(playlist)=>{
        await supabase.from('playlists').update({is_published:!playlist.is_published,published_at:!playlist.is_published?new Date().toISOString():null}).eq('id',playlist.id);
        loadData();
      };

      const getShareUrl=(playlist)=>`${location.origin}${location.pathname}#/learn/${playlist.share_id}`;
      const copyShare=async(playlist)=>{try{await navigator.clipboard.writeText(getShareUrl(playlist));alert('Lien copié !');}catch{prompt('Copiez:',getShareUrl(playlist));}};

      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6"><h1 className="text-2xl font-bold">Cours</h1>{can('managePlaylists')&&<Button icon="Plus" onClick={()=>{setForm({title:'',description:''});setEditing(null);setModal(true);}}>Créer</Button>}</div>
        {playlists.length===0?<Empty icon="BookOpen" title="Aucun cours"/>:
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{playlists.map(p=><Card key={p.id} className="p-4"><div className="flex items-start justify-between mb-3"><div><h3 className="font-semibold">{p.title}</h3><p className="text-sm text-gray-400 mt-1">{p.playlist_videos?.[0]?.count||0} vidéos</p></div><span className={`px-2 py-1 rounded text-xs ${p.is_published?'bg-green-500/20 text-green-400':'bg-gray-500/20 text-gray-400'}`}>{p.is_published?'Publié':'Brouillon'}</span></div><div className="flex flex-wrap gap-2">{can('managePlaylists')&&<><Button variant="ghost" size="sm" icon="Film" onClick={()=>openEditVideos(p)}>Vidéos</Button><Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(p);setForm({title:p.title,description:p.description||''});setModal(true);}}>Modifier</Button></>}{can('publish')&&<Button variant="ghost" size="sm" icon={p.is_published?'EyeOff':'Eye'} onClick={()=>togglePublish(p)}>{p.is_published?'Dépublier':'Publier'}</Button>}{p.is_published&&<Button variant="ghost" size="sm" icon="Share2" onClick={()=>copyShare(p)}>Partager</Button>}{can('managePlaylists')&&<Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(p.id)}/>}</div></Card>)}</div>}
        
        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title={editing?'Modifier':'Créer un cours'}><div className="space-y-4"><Input label="Titre" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} required/><div><label className="block text-sm font-medium text-gray-300 mb-1">Description</label><textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={3} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/></div><div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button><Button onClick={handleSave}>Enregistrer</Button></div></div></Modal>

        <Modal isOpen={!!editVideosModal} onClose={()=>setEditVideosModal(null)} title={`Vidéos: ${editVideosModal?.title}`} size="lg">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div><h4 className="font-medium mb-3">Vidéos du cours ({playlistVideos.length})</h4><div className="space-y-2 max-h-96 overflow-y-auto">{playlistVideos.map((pv,i)=><div key={pv.id} className="flex items-center gap-3 p-3 bg-gray-700 rounded-lg"><span className="w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center text-xs font-bold">{i+1}</span><div className="flex-1 min-w-0"><p className="font-medium truncate text-sm">{pv.videos?.title}</p><p className="text-xs text-gray-400">{pv.videos?.duration}</p></div><button onClick={()=>removeVideoFromPlaylist(pv.id)} className="p-1 hover:bg-red-600 rounded"><Icon name="X" size={16}/></button></div>)}{playlistVideos.length===0&&<p className="text-gray-500 text-sm text-center py-4">Aucune vidéo</p>}</div></div>
            <div><h4 className="font-medium mb-3">Ajouter des vidéos</h4><div className="space-y-2 max-h-96 overflow-y-auto">{videos.filter(v=>!playlistVideos.find(pv=>pv.video_id===v.id)).map(v=><div key={v.id} className="flex items-center gap-3 p-3 bg-gray-700/50 rounded-lg hover:bg-gray-700 cursor-pointer" onClick={()=>addVideoToPlaylist(v.id)}><Icon name="Plus" size={16} className="text-indigo-400"/><div className="flex-1 min-w-0"><p className="font-medium truncate text-sm">{v.title}</p><p className="text-xs text-gray-400">{v.duration}</p></div></div>)}{videos.filter(v=>!playlistVideos.find(pv=>pv.video_id===v.id)).length===0&&<p className="text-gray-500 text-sm text-center py-4">Toutes les vidéos ont été ajoutées</p>}</div></div>
          </div>
        </Modal>
      </div>;
    }

    // Enrollments
    function EnrollmentsPage(){
      const{center,isSuperAdmin,profile}=useAuth();
      const[enrollments,setEnrollments]=useState([]);
      const[playlists,setPlaylists]=useState([]);
      const[learners,setLearners]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[form,setForm]=useState({playlist_id:'',learner_id:''});

      useEffect(()=>{loadData();},[]);
      const loadData=async()=>{
        let qe=supabase.from('enrollments').select('*,playlists(title),profiles!enrollments_learner_id_fkey(first_name,last_name,email)').order('created_at',{ascending:false});
        let qp=supabase.from('playlists').select('id,title').eq('is_published',true);
        let ql=supabase.from('profiles').select('id,first_name,last_name,email').eq('role','learner');
        
        if(!isSuperAdmin&&center?.id){
          qp=qp.eq('center_id',center.id);
          ql=ql.eq('center_id',center.id);
        }

        const[{data:e},{data:p},{data:l}]=await Promise.all([qe,qp,ql]);
        setEnrollments(e||[]);setPlaylists(p||[]);setLearners(l||[]);setLoading(false);
      };

      const handleEnroll=async()=>{
        await supabase.from('enrollments').insert({playlist_id:form.playlist_id,learner_id:form.learner_id,enrolled_by:profile?.id});
        loadData();setModal(false);setForm({playlist_id:'',learner_id:''});
      };

      const handleUnenroll=async id=>{if(!confirm('Désinscrire ?'))return;await supabase.from('enrollments').delete().eq('id',id);loadData();};

      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6"><h1 className="text-2xl font-bold">Inscriptions</h1><Button icon="UserPlus" onClick={()=>setModal(true)}>Inscrire</Button></div>
        {enrollments.length===0?<Empty icon="UserPlus" title="Aucune inscription"/>:
        <Card><div className="overflow-x-auto"><table className="w-full"><thead className="bg-gray-750"><tr><th className="text-left p-4 font-medium text-gray-400">Apprenant</th><th className="text-left p-4 font-medium text-gray-400">Cours</th><th className="text-left p-4 font-medium text-gray-400">Date</th><th className="text-left p-4 font-medium text-gray-400">Statut</th><th className="text-right p-4"></th></tr></thead><tbody className="divide-y divide-gray-700">{enrollments.map(e=><tr key={e.id}><td className="p-4"><p className="font-medium">{e.profiles?.first_name} {e.profiles?.last_name}</p><p className="text-sm text-gray-400">{e.profiles?.email}</p></td><td className="p-4">{e.playlists?.title}</td><td className="p-4 text-gray-400">{new Date(e.created_at).toLocaleDateString('fr-FR')}</td><td className="p-4"><span className={`px-2 py-1 rounded text-xs ${e.completed_at?'bg-green-500/20 text-green-400':'bg-blue-500/20 text-blue-400'}`}>{e.completed_at?'Terminé':'En cours'}</span></td><td className="p-4 text-right"><Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleUnenroll(e.id)}/></td></tr>)}</tbody></table></div></Card>}
        
        <Modal isOpen={modal} onClose={()=>setModal(false)} title="Inscrire un apprenant"><div className="space-y-4"><Select label="Cours" value={form.playlist_id} onChange={e=>setForm({...form,playlist_id:e.target.value})} options={[{value:'',label:'Sélectionner...'},...playlists.map(p=>({value:p.id,label:p.title}))]}/><Select label="Apprenant" value={form.learner_id} onChange={e=>setForm({...form,learner_id:e.target.value})} options={[{value:'',label:'Sélectionner...'},...learners.map(l=>({value:l.id,label:`${l.first_name} ${l.last_name} (${l.email})`}))]}/><div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button><Button onClick={handleEnroll} disabled={!form.playlist_id||!form.learner_id}>Inscrire</Button></div></div></Modal>
      </div>;
    }

    // My Courses (Learner)
    function MyCoursesPage(){
      const{user}=useAuth();
      const[enrollments,setEnrollments]=useState([]);
      const[loading,setLoading]=useState(true);
      const[selectedCourse,setSelectedCourse]=useState(null);
      const[courseData,setCourseData]=useState(null);
      const[currentVideo,setCurrentVideo]=useState(0);

      useEffect(()=>{loadEnrollments();},[]);
      const loadEnrollments=async()=>{
        const{data}=await supabase.from('enrollments').select('*,playlists(*)').eq('learner_id',user.id).eq('status','active');
        setEnrollments(data||[]);setLoading(false);
      };

      const openCourse=async(enrollment)=>{
        const{data}=await supabase.rpc('get_learner_progress',{p_playlist_id:enrollment.playlist_id});
        setCourseData(data);setSelectedCourse(enrollment);setCurrentVideo(0);
      };

      const markWatched=async(pvId)=>{
        await supabase.rpc('mark_video_watched',{p_playlist_video_id:pvId});
        openCourse(selectedCourse);
      };

      if(loading)return<Loading/>;

      if(selectedCourse&&courseData){
        const videos=courseData.videos||[];
        const cv=videos[currentVideo];
        const progress=courseData.stats;

        return<div>
          <button onClick={()=>{setSelectedCourse(null);setCourseData(null);}} className="flex items-center gap-2 text-gray-400 hover:text-white mb-4"><Icon name="ArrowLeft" size={20}/>Retour</button>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2">
              <div className="aspect-video bg-black rounded-xl overflow-hidden mb-4"><iframe src={`https://player.vimeo.com/video/${cv?.video_id}?autoplay=0`} className="w-full h-full" allowFullScreen/></div>
              <div className="flex items-start justify-between gap-4 mb-4"><div><span className="px-2 py-1 bg-indigo-600 rounded text-xs font-medium">{currentVideo+1}/{videos.length}</span><h2 className="text-xl font-bold mt-2">{cv?.title}</h2><p className="text-gray-400">{cv?.duration}</p></div><Button variant={cv?.is_completed?'success':'secondary'} icon={cv?.is_completed?'CheckCircle':'Circle'} onClick={()=>markWatched(cv?.playlist_video_id)}>{cv?.is_completed?'Terminé':'Marquer comme vu'}</Button></div>
              {cv?.trainer_note&&<Card className="p-4 mb-4 border-yellow-600/30 bg-yellow-900/10"><div className="flex items-start gap-3"><Icon name="FileText" size={20} className="text-yellow-400"/><div><h4 className="font-medium text-yellow-400 mb-1">Note du formateur</h4><p className="text-yellow-200 text-sm">{cv.trainer_note}</p></div></div></Card>}
              <div className="flex gap-3"><Button variant="secondary" icon="ChevronLeft" onClick={()=>setCurrentVideo(Math.max(0,currentVideo-1))} disabled={currentVideo===0}>Précédent</Button><Button icon="ChevronRight" onClick={()=>setCurrentVideo(Math.min(videos.length-1,currentVideo+1))} disabled={currentVideo===videos.length-1}>Suivant</Button></div>
            </div>
            <div><Card className="p-4"><h3 className="font-semibold mb-4">Contenu du cours</h3><div className="mb-4"><div className="flex items-center justify-between text-sm mb-1"><span className="text-gray-400">Progression</span><span>{progress?.percent||0}%</span></div><div className="w-full bg-gray-700 rounded-full h-2"><div className="bg-green-500 h-full rounded-full transition-all" style={{width:`${progress?.percent||0}%`}}/></div></div><div className="space-y-2 max-h-96 overflow-y-auto">{videos.map((v,i)=><div key={v.playlist_video_id} onClick={()=>setCurrentVideo(i)} className={`flex items-center gap-3 p-3 rounded-lg cursor-pointer transition ${i===currentVideo?'bg-indigo-600':'hover:bg-gray-700'}`}><div className="flex-shrink-0">{v.is_completed?<Icon name="CheckCircle" size={18} className="text-green-400"/>:i===currentVideo?<Icon name="Play" size={18} className="text-indigo-400"/>:<Icon name="Circle" size={18} className="text-gray-500"/>}</div><div className="flex-1 min-w-0"><p className="text-sm font-medium truncate">{v.title}</p><p className="text-xs text-gray-400">{v.duration}</p></div></div>)}</div></Card></div>
          </div>
        </div>;
      }

      return<div>
        <h1 className="text-2xl font-bold mb-6">Mes cours</h1>
        {enrollments.length===0?<Empty icon="GraduationCap" title="Aucun cours" desc="Vous n'êtes inscrit à aucun cours"/>:
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{enrollments.map(e=><Card key={e.id} className="p-4 cursor-pointer hover:border-indigo-500 transition" onClick={()=>openCourse(e)}><div className="flex items-center gap-3 mb-3"><div className="w-12 h-12 bg-indigo-600/20 rounded-xl flex items-center justify-center"><Icon name="BookOpen" size={24} className="text-indigo-400"/></div><div className="flex-1"><h3 className="font-semibold">{e.playlists?.title}</h3><p className="text-sm text-gray-400">{e.completed_at?'Terminé':'En cours'}</p></div></div><Button className="w-full">Continuer</Button></Card>)}</div>}
      </div>;
    }

    // Progress
    function ProgressPage(){
      return<Empty icon="BarChart3" title="Statistiques de progression" desc="Consultez la progression des apprenants"/>;
    }

    // App
    function App(){
      const{isAuth,loading}=useAuth();
      if(loading)return<div className="min-h-screen bg-gray-900 flex items-center justify-center"><Loading text="Chargement..."/></div>;
      if(!isAuth)return<LoginPage/>;
      return<AppLayout/>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AuthProvider><App/></AuthProvider>);
  </script>
</body>
</html>
