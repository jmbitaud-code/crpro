            ...lScorm.map(s=>s.last_accessed_at),
            ...lQuiz.map(q=>q.created_at)
          ].filter(Boolean).sort((a,b)=>new Date(b)-new Date(a))[0];
          
          return{
            ...l,
            coursesTotal,coursesCompleted,courseProgress,
            pathsTotal,pathsCompleted,pathProgress,
            scormTotal:lScorm.length,scormCompleted,scormPassed,avgScorm,
            quizTotal:lQuiz.length,quizPassed,avgQuiz,
            totalTime,watchTime,scormTime,pathTime,
            lastActivity,
            enrollments:lEnrollments,
            pathEnrollments:lPathEnrollments,
            scormProgress:lScorm,
            quizAttempts:lQuiz,
            videoProgress:lVideos
          };
        });
      },[learners,enrollments,pathEnrollments,videoProgress,scormProgress,quizAttempts]);

      // Filtrage
      const filteredLearners=useMemo(()=>{
        return learnerData.filter(l=>{
          if(filter.learner!=='all'&&l.id!==filter.learner)return false;
          if(filter.course!=='all'){
            const hasEnrollment=l.enrollments.some(e=>e.playlist_id===filter.course);
            if(!hasEnrollment)return false;
          }
          if(filter.path!=='all'){
            const hasPath=l.pathEnrollments.some(pe=>pe.path_id===filter.path);
            if(!hasPath)return false;
          }
          if(filter.search){
            const s=filter.search.toLowerCase();
            if(!`${l.first_name} ${l.last_name}`.toLowerCase().includes(s)&&
               !l.email?.toLowerCase().includes(s))return false;
          }
          return true;
        });
      },[learnerData,filter]);

      // Export Excel
      const exportExcel=()=>{
        const wb=XLSX.utils.book_new();
        
        // Feuille 1: Résumé par apprenant
        const summaryData=[['Apprenant','Email','Cours inscrits','Cours terminés','Parcours inscrits','Parcours terminés','Modules SCORM','SCORM réussis','Score SCORM','Quiz passés','Score Quiz','Temps total','Dernière activité']];
        filteredLearners.forEach(l=>{
          summaryData.push([
            l.first_name+' '+l.last_name,
            l.email||'',
            l.coursesTotal,
            l.coursesCompleted,
            l.pathsTotal,
            l.pathsCompleted,
            l.scormTotal,
            l.scormPassed,
            l.avgScorm!==null?l.avgScorm+'%':'',
            l.quizPassed+'/'+l.quizTotal,
            l.avgQuiz!==null?l.avgQuiz+'%':'',
            formatDuration(l.totalTime),
            l.lastActivity?new Date(l.lastActivity).toLocaleDateString('fr-FR'):''
          ]);
        });
        const ws1=XLSX.utils.aoa_to_sheet(summaryData);
        ws1['!cols']=[{wch:25},{wch:30},{wch:12},{wch:14},{wch:14},{wch:16},{wch:14},{wch:14},{wch:12},{wch:12},{wch:12},{wch:15},{wch:15}];
        XLSX.utils.book_append_sheet(wb,ws1,'Resume Apprenants');
        
        // Feuille 2: Détail des cours
        const coursesData=[['Apprenant','Email','Cours','Statut','Progression','Temps passé','Date inscription']];
        enrollments.forEach(e=>{
          const l=learners.find(x=>x.id===e.learner_id);
          coursesData.push([
            l?l.first_name+' '+l.last_name:'',
            l?.email||'',
            e.playlists?.title||'',
            e.status==='completed'?'Terminé':e.status==='in_progress'?'En cours':'Non commencé',
            (e.progress_percent||0)+'%',
            formatDuration(e.time_spent_seconds||0),
            e.created_at?new Date(e.created_at).toLocaleDateString('fr-FR'):''
          ]);
        });
        const ws2=XLSX.utils.aoa_to_sheet(coursesData);
        ws2['!cols']=[{wch:25},{wch:30},{wch:35},{wch:15},{wch:12},{wch:15},{wch:15}];
        XLSX.utils.book_append_sheet(wb,ws2,'Detail Cours');
        
        // Feuille 3: Parcours
        const pathsData=[['Apprenant','Email','Parcours','Statut','Progression','Temps passé','Date début']];
        pathEnrollments.forEach(pe=>{
          const l=learners.find(x=>x.id===pe.learner_id);
          pathsData.push([
            l?l.first_name+' '+l.last_name:'',
            l?.email||'',
            pe.learning_paths?.title||'Parcours',
            pe.status==='completed'||pe.progress_percent===100?'Terminé':pe.progress_percent>0?'En cours':'Non commencé',
            (pe.progress_percent||0)+'%',
            formatDuration(pe.time_spent_seconds||0),
            pe.started_at?new Date(pe.started_at).toLocaleDateString('fr-FR'):''
          ]);
        });
        const ws3=XLSX.utils.aoa_to_sheet(pathsData);
        ws3['!cols']=[{wch:25},{wch:30},{wch:35},{wch:15},{wch:12},{wch:15},{wch:15}];
        XLSX.utils.book_append_sheet(wb,ws3,'Parcours');
        
        // Feuille 4: SCORM
        const scormData=[['Apprenant','Email','Module','Statut','Succès','Score','Temps','Date']];
        scormProgress.forEach(s=>{
          const l=learners.find(x=>x.id===s.learner_id);
          const m=modules.find(x=>x.id===s.module_id);
          const score=s.score_scaled!==null?(s.score_scaled>1?s.score_scaled:Math.round(s.score_scaled*100)):null;
          scormData.push([
            l?l.first_name+' '+l.last_name:'',
            l?.email||'',
            m?.title||'Module '+s.module_id,
            SCORM_STATUS_LABELS[s.completion_status]||s.completion_status||'',
            s.success_status||'',
            score!==null?score+'%':'',
            formatDuration(parseScormTime(s.total_time)),
            s.last_accessed_at?new Date(s.last_accessed_at).toLocaleDateString('fr-FR'):''
          ]);
        });
        const ws4=XLSX.utils.aoa_to_sheet(scormData);
        ws4['!cols']=[{wch:25},{wch:30},{wch:35},{wch:15},{wch:12},{wch:10},{wch:12},{wch:12}];
        XLSX.utils.book_append_sheet(wb,ws4,'SCORM');
        
        // Feuille 5: Quiz
        const quizData=[['Apprenant','Email','Quiz','Score','Réussi','Date']];
        quizAttempts.forEach(q=>{
          const l=learners.find(x=>x.id===q.learner_id);
          quizData.push([
            l?l.first_name+' '+l.last_name:'',
            l?.email||'',
            q.quizzes?.title||'Quiz',
            (q.score_percent||0)+'%',
            q.passed?'Oui':'Non',
            q.created_at?new Date(q.created_at).toLocaleDateString('fr-FR'):''
          ]);
        });
        const ws5=XLSX.utils.aoa_to_sheet(quizData);
        ws5['!cols']=[{wch:25},{wch:30},{wch:35},{wch:10},{wch:10},{wch:12}];
        XLSX.utils.book_append_sheet(wb,ws5,'Quiz');
        
        // Feuille 6: Assiduité
        const assiduiteData=[['Apprenant','Email','Temps formation total','Temps vidéo','Temps SCORM','Temps parcours','Nb cours','Nb parcours','Nb SCORM','Nb Quiz']];
        filteredLearners.forEach(l=>{
          assiduiteData.push([
            l.first_name+' '+l.last_name,
            l.email||'',
            formatDuration(l.totalTime),
            formatDuration(l.watchTime),
            formatDuration(l.scormTime),
            formatDuration(l.pathTime),
            l.coursesTotal,
            l.pathsTotal,
            l.scormTotal,
            l.quizTotal
          ]);
        });
        const ws6=XLSX.utils.aoa_to_sheet(assiduiteData);
        ws6['!cols']=[{wch:25},{wch:30},{wch:18},{wch:15},{wch:15},{wch:15},{wch:10},{wch:12},{wch:10},{wch:10}];
        XLSX.utils.book_append_sheet(wb,ws6,'Assiduite');
        
        // Télécharger
        const filename='suivi-formation-'+new Date().toISOString().slice(0,10)+'.xlsx';
        XLSX.writeFile(wb,filename);
      };

      // Ouvrir le détail d'un apprenant
      const openLearnerDetail=(learner)=>{
        setSelectedLearner(learner);
      };

      if(!can('view_analytics')&&!can('manage_enrollments'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;
      
      // Calculer les alertes (calcul direct, pas de hook)
      const alerts=(()=>{
        const list=[];
        const now=new Date();
        const sevenDaysAgo=new Date(now-7*24*60*60*1000);
        const threeDaysAgo=new Date(now-3*24*60*60*1000);
        
        // Apprenants inactifs (>7 jours sans activité)
        const inactiveLearners=learnerData.filter(l=>{
          if(!l.lastActivity)return l.coursesTotal>0;
          return new Date(l.lastActivity)<sevenDaysAgo&&l.coursesCompleted<l.coursesTotal;
        });
        if(inactiveLearners.length>0){
          list.push({
            type:'warning',
            icon:'UserX',
            title:`${inactiveLearners.length} apprenant${inactiveLearners.length>1?'s':''} inactif${inactiveLearners.length>1?'s':''}`,
            desc:'Plus de 7 jours sans activité',
            action:()=>setFilter({...filter,search:''}),
            learners:inactiveLearners.slice(0,3)
          });
        }
        
        // Apprenants en difficulté (score SCORM < 50%)
        const strugglingLearners=learnerData.filter(l=>l.avgScorm!==null&&l.avgScorm<50&&l.scormTotal>0);
        if(strugglingLearners.length>0){
          list.push({
            type:'danger',
            icon:'AlertTriangle',
            title:`${strugglingLearners.length} apprenant${strugglingLearners.length>1?'s':''} en difficulté`,
            desc:'Score SCORM moyen < 50%',
            learners:strugglingLearners.slice(0,3)
          });
        }
        
        // Nouveaux apprenants cette semaine
        const newLearners=learnerData.filter(l=>{
          const enrolled=enrollments.find(e=>e.learner_id===l.id);
          return enrolled&&new Date(enrolled.created_at)>sevenDaysAgo;
        });
        if(newLearners.length>0){
          list.push({
            type:'info',
            icon:'UserPlus',
            title:`${newLearners.length} nouvelle${newLearners.length>1?'s':''} inscription${newLearners.length>1?'s':''}`,
            desc:'Cette semaine',
            learners:newLearners.slice(0,3)
          });
        }
        
        // Cours presque terminés (>80%)
        const almostDone=learnerData.filter(l=>l.courseProgress>=80&&l.courseProgress<100&&l.coursesTotal>0);
        if(almostDone.length>0){
          list.push({
            type:'success',
            icon:'TrendingUp',
            title:`${almostDone.length} apprenant${almostDone.length>1?'s':''} presque terminé${almostDone.length>1?'s':''}`,
            desc:'Progression > 80%',
            learners:almostDone.slice(0,3)
          });
        }
        
        return list;
      })();
      
      // Tendances (cette semaine vs semaine précédente) - calcul direct
      const trends=(()=>{
        const now=new Date();
        const thisWeekStart=new Date(now-7*24*60*60*1000);
        const lastWeekStart=new Date(now-14*24*60*60*1000);
        
        const thisWeekScorm=scormProgress.filter(s=>s.last_accessed_at&&new Date(s.last_accessed_at)>thisWeekStart).length;
        const lastWeekScorm=scormProgress.filter(s=>s.last_accessed_at&&new Date(s.last_accessed_at)>lastWeekStart&&new Date(s.last_accessed_at)<=thisWeekStart).length;
        
        const thisWeekQuiz=quizAttempts.filter(q=>new Date(q.created_at)>thisWeekStart).length;
        const lastWeekQuiz=quizAttempts.filter(q=>new Date(q.created_at)>lastWeekStart&&new Date(q.created_at)<=thisWeekStart).length;
        
        const thisWeekEnrollments=enrollments.filter(e=>new Date(e.created_at)>thisWeekStart).length;
        const lastWeekEnrollments=enrollments.filter(e=>new Date(e.created_at)>lastWeekStart&&new Date(e.created_at)<=thisWeekStart).length;
        
        return{
          scorm:{current:thisWeekScorm,previous:lastWeekScorm,change:lastWeekScorm>0?Math.round(((thisWeekScorm-lastWeekScorm)/lastWeekScorm)*100):0},
          quiz:{current:thisWeekQuiz,previous:lastWeekQuiz,change:lastWeekQuiz>0?Math.round(((thisWeekQuiz-lastWeekQuiz)/lastWeekQuiz)*100):0},
          enrollments:{current:thisWeekEnrollments,previous:lastWeekEnrollments,change:lastWeekEnrollments>0?Math.round(((thisWeekEnrollments-lastWeekEnrollments)/lastWeekEnrollments)*100):0}
        };
      })();

      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4">
          <div>
            <h1 className="text-2xl font-bold">📊 Suivi de formation</h1>
            <p className="text-sm text-gray-400">{stats.totalLearners} apprenant{stats.totalLearners>1?'s':''} • {stats.totalEnrollments} inscription{stats.totalEnrollments>1?'s':''}</p>
          </div>
          <div className="flex gap-2">
            <Button variant="ghost" icon="RefreshCw" onClick={load}>Actualiser</Button>
            <Button variant="secondary" icon="Download" onClick={exportExcel}>Exporter Excel</Button>
          </div>
        </div>
        
        {/* Section Alertes */}
        {alerts.length>0&&(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            {alerts.map((alert,i)=>(
              <Card key={i} className={`p-4 border-l-4 ${
                alert.type==='danger'?'border-l-red-500 bg-red-500/5':
                alert.type==='warning'?'border-l-yellow-500 bg-yellow-500/5':
                alert.type==='success'?'border-l-green-500 bg-green-500/5':
                'border-l-blue-500 bg-blue-500/5'
              }`}>
                <div className="flex items-start gap-3">
                  <div className={`w-10 h-10 rounded-lg flex items-center justify-center shrink-0 ${
                    alert.type==='danger'?'bg-red-500/20':
                    alert.type==='warning'?'bg-yellow-500/20':
                    alert.type==='success'?'bg-green-500/20':
                    'bg-blue-500/20'
                  }`}>
                    <Icon name={alert.icon} size={20} className={
                      alert.type==='danger'?'text-red-400':
                      alert.type==='warning'?'text-yellow-400':
                      alert.type==='success'?'text-green-400':
                      'text-blue-400'
                    }/>
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className="font-semibold text-sm">{alert.title}</p>
                    <p className="text-xs text-gray-400">{alert.desc}</p>
                    {alert.learners&&alert.learners.length>0&&(
                      <div className="flex flex-wrap gap-1 mt-2">
                        {alert.learners.map(l=>(
                          <span key={l.id} className="text-xs px-2 py-0.5 bg-gray-700 rounded-full truncate max-w-[120px]" title={l.first_name+' '+l.last_name}>
                            {l.first_name}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </Card>
            ))}
          </div>
        )}
        
        {/* Tendances de la semaine */}
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <Card className="p-4">
            <div className="flex items-center justify-between">
              <div>
                <p className="text-xs text-gray-400 uppercase">Activité SCORM</p>
                <p className="text-2xl font-bold">{trends.scorm.current}</p>
                <p className="text-xs text-gray-500">cette semaine</p>
              </div>
              <div className={`flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium ${
                trends.scorm.change>0?'bg-green-500/20 text-green-400':
                trends.scorm.change<0?'bg-red-500/20 text-red-400':
                'bg-gray-500/20 text-gray-400'
              }`}>
                <Icon name={trends.scorm.change>0?'TrendingUp':trends.scorm.change<0?'TrendingDown':'Minus'} size={14}/>
                {trends.scorm.change>0?'+':''}{trends.scorm.change}%
              </div>
            </div>
          </Card>
          <Card className="p-4">
            <div className="flex items-center justify-between">
              <div>
                <p className="text-xs text-gray-400 uppercase">Quiz passés</p>
                <p className="text-2xl font-bold">{trends.quiz.current}</p>
                <p className="text-xs text-gray-500">cette semaine</p>
              </div>
              <div className={`flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium ${
                trends.quiz.change>0?'bg-green-500/20 text-green-400':
                trends.quiz.change<0?'bg-red-500/20 text-red-400':
                'bg-gray-500/20 text-gray-400'
              }`}>
                <Icon name={trends.quiz.change>0?'TrendingUp':trends.quiz.change<0?'TrendingDown':'Minus'} size={14}/>
                {trends.quiz.change>0?'+':''}{trends.quiz.change}%
              </div>
            </div>
          </Card>
          <Card className="p-4">
            <div className="flex items-center justify-between">
              <div>
                <p className="text-xs text-gray-400 uppercase">Inscriptions</p>
                <p className="text-2xl font-bold">{trends.enrollments.current}</p>
                <p className="text-xs text-gray-500">cette semaine</p>
              </div>
              <div className={`flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium ${
                trends.enrollments.change>0?'bg-green-500/20 text-green-400':
                trends.enrollments.change<0?'bg-red-500/20 text-red-400':
                'bg-gray-500/20 text-gray-400'
              }`}>
                <Icon name={trends.enrollments.change>0?'TrendingUp':trends.enrollments.change<0?'TrendingDown':'Minus'} size={14}/>
                {trends.enrollments.change>0?'+':''}{trends.enrollments.change}%
              </div>
            </div>
          </Card>
        </div>

        {/* Stats globales */}
        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4 mb-6">
          <Card className="p-4 text-center">
            <Icon name="Users" size={24} className="mx-auto text-indigo-400 mb-2"/>
            <p className="text-2xl font-bold">{stats.activeLearners}<span className="text-base text-gray-500">/{stats.totalLearners}</span></p>
            <p className="text-xs text-gray-400">Apprenants actifs</p>
          </Card>
          <Card className="p-4 text-center">
            <Icon name="BookOpen" size={24} className="mx-auto text-blue-400 mb-2"/>
            <p className="text-2xl font-bold">{stats.completedEnrollments}<span className="text-base text-gray-500">/{stats.totalEnrollments}</span></p>
            <p className="text-xs text-gray-400">Cours terminés</p>
          </Card>
          <Card className="p-4 text-center">
            <Icon name="Route" size={24} className="mx-auto text-purple-400 mb-2"/>
            <p className="text-2xl font-bold">{stats.completedPaths}<span className="text-base text-gray-500">/{stats.totalPaths}</span></p>
            <p className="text-xs text-gray-400">Parcours terminés</p>
          </Card>
          <Card className="p-4 text-center">
            <Icon name="Package" size={24} className="mx-auto text-orange-400 mb-2"/>
            <p className="text-2xl font-bold">{stats.passedScorm}<span className="text-base text-gray-500">/{stats.totalScorm}</span></p>
            <p className="text-xs text-gray-400">SCORM réussis</p>
            {stats.avgScormScore>0&&<p className="text-xs text-green-400">Moy: {Math.round(stats.avgScormScore)}%</p>}
          </Card>
          <Card className="p-4 text-center">
            <Icon name="HelpCircle" size={24} className="mx-auto text-pink-400 mb-2"/>
            <p className="text-2xl font-bold">{stats.passedQuiz}<span className="text-base text-gray-500">/{stats.totalQuiz}</span></p>
            <p className="text-xs text-gray-400">Quiz réussis</p>
            {stats.avgQuizScore>0&&<p className="text-xs text-green-400">Moy: {Math.round(stats.avgQuizScore)}%</p>}
          </Card>
          <Card className="p-4 text-center">
            <Icon name="Clock" size={24} className="mx-auto text-cyan-400 mb-2"/>
            <p className="text-2xl font-bold">{formatDuration(stats.totalCourseTime)}</p>
            <p className="text-xs text-gray-400">Temps total</p>
          </Card>
          <Card className="p-4 text-center">
            <Icon name="Play" size={24} className="mx-auto text-green-400 mb-2"/>
            <p className="text-2xl font-bold">{formatDuration(stats.totalWatchTime)}</p>
            <p className="text-xs text-gray-400">Temps vidéo</p>
          </Card>
        </div>

        {/* Onglets */}
        <Tabs tabs={[
          {id:'overview',label:'Vue d\'ensemble',icon:'LayoutDashboard'},
          {id:'learners',label:'Par apprenant',icon:'Users'},
          {id:'courses',label:'Par cours',icon:'BookOpen'},
          {id:'paths',label:'Parcours',icon:'Route'},
          {id:'scorm',label:'SCORM',icon:'Package'},
          {id:'quiz',label:'Quiz',icon:'HelpCircle'}
        ]} active={activeTab} onChange={setActiveTab}/>

        {/* Filtres */}
        <Card className="p-4 mb-6">
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <Input icon="Search" placeholder="Rechercher un apprenant..." value={filter.search} onChange={e=>setFilter({...filter,search:e.target.value})}/>
            <Select value={filter.learner} onChange={e=>setFilter({...filter,learner:e.target.value})} options={[{value:'all',label:'Tous les apprenants'},...learners.map(l=>({value:l.id,label:l.first_name+' '+l.last_name}))]}/>
            <Select value={filter.course} onChange={e=>setFilter({...filter,course:e.target.value})} options={[{value:'all',label:'Tous les cours'},...courses.map(c=>({value:c.id,label:c.title}))]}/>
            <Select value={filter.path} onChange={e=>setFilter({...filter,path:e.target.value})} options={[{value:'all',label:'Tous les parcours'},...paths.map(p=>({value:p.id,label:p.title}))]}/>
          </div>
        </Card>

        {/* Vue d'ensemble */}
        {activeTab==='overview'&&(
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <Card className="p-6">
              <h3 className="font-semibold mb-4">Top apprenants</h3>
              <div className="space-y-3">
                {learnerData.sort((a,b)=>b.courseProgress-a.courseProgress).slice(0,5).map((l,i)=>(
                  <div key={l.id} className="flex items-center gap-3">
                    <span className="w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center text-xs font-bold">{i+1}</span>
                    <div className="flex-1 min-w-0">
                      <p className="font-medium truncate">{l.first_name} {l.last_name}</p>
                      <div className="flex items-center gap-2">
                        <div className="flex-1"><ProgressBar percent={l.courseProgress} size="sm" showLabel={false}/></div>
                        <span className="text-sm text-gray-400">{l.courseProgress}%</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </Card>
            <Card className="p-6">
              <h3 className="font-semibold mb-4">Activité récente</h3>
              <div className="space-y-3">
                {learnerData.filter(l=>l.lastActivity).sort((a,b)=>new Date(b.lastActivity)-new Date(a.lastActivity)).slice(0,5).map(l=>(
                  <div key={l.id} className="flex items-center gap-3 p-2 bg-gray-700/50 rounded-lg">
                    <div className="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center"><Icon name="User" size={18}/></div>
                    <div className="flex-1 min-w-0">
                      <p className="font-medium truncate">{l.first_name} {l.last_name}</p>
                      <p className="text-xs text-gray-400">{l.lastActivity?new Date(l.lastActivity).toLocaleString('fr-FR'):'-'}</p>
                    </div>
                    <span className="text-xs text-gray-500">{formatDuration(l.totalTime)}</span>
                  </div>
                ))}
              </div>
            </Card>
          </div>

    function AnalyticsPage(){
      const{can,center,isSuperAdmin}=useAuth();
      const[data,setData]=useState({enrollments:[],courses:[],summary:{},learnerStats:[]});
      const[loading,setLoading]=useState(true);
      const[filter,setFilter]=useState({course:'all',period:'all'});
      const[selectedLearner,setSelectedLearner]=useState(null);
      const progressChartRef=useRef(null);
      const statusChartRef=useRef(null);
      const courseChartRef=useRef(null);
      const chartsRef=useRef({});

      // Fonction pour formater le temps
      const formatTime=(seconds)=>{
        if(!seconds||seconds===0)return'-';
        const h=Math.floor(seconds/3600);
        const m=Math.floor((seconds%3600)/60);
        const s=seconds%60;
        if(h>0)return `${h}h ${m}min`;
        if(m>0)return `${m}min ${s}s`;
        return `${s}s`;
      };

      const load=useCallback(async()=>{
        // D'abord charger les apprenants du centre pour filtrer correctement
        let learnerQuery=supabase.from('profiles').select('id').eq('role','learner');
        if(!isSuperAdmin&&center?.id)learnerQuery=learnerQuery.eq('center_id',center.id);
        const{data:learnerProfiles}=await learnerQuery;
        const centerLearnerIds=(learnerProfiles||[]).map(l=>l.id);
        
        // Charger les inscriptions des apprenants du centre
        let q=supabase.from('enrollments').select(`
          *,
          playlists:playlist_id(id,title,center_id,is_lms_content),
          profiles:learner_id(id,first_name,last_name,email,center_id)
        `);
        if(!isSuperAdmin&&center?.id&&centerLearnerIds.length>0){
          q=q.in('learner_id',centerLearnerIds);
        }
        const{data:enrollments}=await q;
        
        // Filtrer côté client: garder les inscriptions aux cours du centre OU aux cours LMS partagés
        const filteredEnrollments=(!isSuperAdmin&&center?.id)
          ?(enrollments||[]).filter(e=>e.playlists?.center_id===center.id||e.playlists?.is_lms_content===true)
          :(enrollments||[]);
        
        // Charger les cours (centre + LMS partagés)
        let qc=supabase.from('playlists').select('id,title,is_published,center_id,is_lms_content');
        if(!isSuperAdmin&&center?.id)qc=qc.or(`center_id.eq.${center.id},is_lms_content.eq.true`);
        const{data:courses}=await qc;
        
        // Charger les sessions de cours pour le temps total
        let qs=supabase.from('course_sessions').select('*');
        if(!isSuperAdmin&&center?.id){
          // Filtrer par les enrollments du centre
          const enrollmentIds=(filteredEnrollments||[]).filter(e=>e.playlists).map(e=>e.id);
          if(enrollmentIds.length>0)qs=qs.in('enrollment_id',enrollmentIds);
        }
        const{data:sessions}=await qs;
        
        // Charger les scores SCORM
        const learnerIds=[...new Set((filteredEnrollments||[]).map(e=>e.learner_id).filter(Boolean))];
        let scormData=[];
        if(learnerIds.length>0){
          const{data:sp}=await supabase.from('scorm_progress').select('*').in('learner_id',learnerIds);
          scormData=sp||[];
        }
        
        // Charger les tentatives de quiz
        let quizData=[];
        if(learnerIds.length>0){
          const{data:qa}=await supabase.from('quiz_attempts').select('*').in('learner_id',learnerIds);
          quizData=qa||[];
        }

        // Calculer les statistiques par apprenant
        const learnerStats=learnerIds.map(learnerId=>{
          const learnerEnrollments=(filteredEnrollments||[]).filter(e=>e.learner_id===learnerId);
          const profile=learnerEnrollments[0]?.profiles;
          const totalTime=learnerEnrollments.reduce((a,e)=>a+(e.time_spent_seconds||0),0);
          const completedCourses=learnerEnrollments.filter(e=>e.status==='completed').length;
          const learnerScorm=scormData.filter(s=>s.learner_id===learnerId);
          const learnerQuiz=quizData.filter(q=>q.learner_id===learnerId);
          const avgScormScore=learnerScorm.length>0?learnerScorm.reduce((a,s)=>a+(s.score_scaled||0)*100,0)/learnerScorm.length:null;
          const avgQuizScore=learnerQuiz.length>0?learnerQuiz.reduce((a,q)=>a+(q.score_percent||0),0)/learnerQuiz.length:null;
          const lastActivity=learnerEnrollments.reduce((latest,e)=>{
            const d=new Date(e.updated_at);
            return d>latest?d:latest;
          },new Date(0));
          
          return{
            id:learnerId,
            name:profile?`${profile.first_name} ${profile.last_name}`:'Inconnu',
            email:profile?.email||'',
            totalCourses:learnerEnrollments.length,
            completedCourses,
            totalTime,
            avgProgress:learnerEnrollments.length>0?Math.round(learnerEnrollments.reduce((a,e)=>a+(e.progress_percent||0),0)/learnerEnrollments.length):0,
            avgScormScore,
            avgQuizScore,
            lastActivity:lastActivity.getTime()>0?lastActivity:null,
            enrollments:learnerEnrollments
          };
        }).sort((a,b)=>b.totalTime-a.totalTime);

        // Calculer les statistiques globales
        const validEnrollments=(filteredEnrollments||[]).filter(e=>e.playlists&&e.profiles);
        const totalTimeAll=validEnrollments.reduce((a,e)=>a+(e.time_spent_seconds||0),0);
        const summary={
          total:validEnrollments.length,
          notStarted:validEnrollments.filter(e=>e.status==='not_started').length,
          inProgress:validEnrollments.filter(e=>e.status==='in_progress').length,
          completed:validEnrollments.filter(e=>e.status==='completed').length,
          avgProgress:validEnrollments.length?Math.round(validEnrollments.reduce((a,e)=>a+(e.progress_percent||0),0)/validEnrollments.length):0,
          totalTime:totalTimeAll,
          avgTimePerCourse:validEnrollments.length>0?Math.round(totalTimeAll/validEnrollments.length):0,
          learnersCount:learnerIds.length
        };

        setData({enrollments:validEnrollments,courses:courses||[],summary,learnerStats});
        setLoading(false);
      },[isSuperAdmin,center?.id]);

      useEffect(()=>{load();},[load]);

      // Créer les graphiques
      useEffect(()=>{
        if(loading||!data.enrollments.length)return;

        // Détruire les anciens graphiques
        Object.values(chartsRef.current).forEach(chart=>chart?.destroy());
        chartsRef.current={};

        // Graphique de statut (Doughnut)
        if(statusChartRef.current){
          const ctx=statusChartRef.current.getContext('2d');
          chartsRef.current.status=new Chart(ctx,{
            type:'doughnut',
            data:{
              labels:['Non commencé','En cours','Terminé'],
              datasets:[{
                data:[data.summary.notStarted,data.summary.inProgress,data.summary.completed],
                backgroundColor:['#6b7280','#eab308','#22c55e'],
                borderWidth:0
              }]
            },
            options:{
              responsive:true,
              maintainAspectRatio:false,
              plugins:{legend:{position:'bottom',labels:{color:'#9ca3af'}}}
            }
          });
        }

        // Graphique par cours (Bar)
        if(courseChartRef.current){
          const courseStats=data.courses.map(c=>{
            const courseEnrollments=data.enrollments.filter(e=>e.playlist_id===c.id);
            return{
              title:c.title,
              count:courseEnrollments.length,
              avgProgress:courseEnrollments.length?Math.round(courseEnrollments.reduce((a,e)=>a+(e.progress_percent||0),0)/courseEnrollments.length):0

          chartsRef.current.course=new Chart(ctx,{
            type:'bar',
            data:{

              scales:{

                y:{ticks:{color:'#9ca3af'},grid:{color:'#374151'}}
              },

            }
          });
        }

        // Graphique de progression (Line)
        if(progressChartRef.current){

          const progressData=[
            data.enrollments.filter(e=>(e.progress_percent||0)<=25).length,

            data.enrollments.filter(e=>(e.progress_percent||0)>50&&(e.progress_percent||0)<=75).length,

                y:{ticks:{color:'#9ca3af'},grid:{color:'#374151'}}
              },
              plugins:{legend:{display:false}}
            }
          });
        }

        return()=>{
          Object.values(chartsRef.current).forEach(chart=>chart?.destroy());
        };
      },[loading,data]);

      // Filtrer les données
      const filteredEnrollments=data.enrollments.filter(e=>{

          <Card className="p-4"><div className="text-gray-400 text-sm flex items-center gap-1"><Icon name="Clock" size={14}/>Temps total</div><div className="text-2xl font-bold text-blue-500">{formatTime(data.summary.totalTime)}</div></Card>
          <Card className="p-4"><div className="text-gray-400 text-sm flex items-center gap-1"><Icon name="Clock" size={14}/>Temps moy./cours</div><div className="text-2xl font-bold text-blue-400">{formatTime(data.summary.avgTimePerCourse)}</div></Card>

        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">

                    <td className="p-4 text-gray-400">{l.lastActivity?new Date(l.lastActivity).toLocaleDateString('fr-FR'):'-'}</td>

        <Card>

        </Modal>

    // Centers
    function CentersPage(){
      const{can}=useAuth();
      const[centers,setCenters]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({name:'',slug:'',description:'',registration_code:''});
      const[saving,setSaving]=useState(false);
      const[copiedCode,setCopiedCode]=useState(null);

      // Générer un slug à partir du nom
      const generateSlug=(name)=>name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
      
      // Générer un code d'inscription aléatoire (6 caractères)
      const generateCode=()=>{
        const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // Sans O/0/1/I pour éviter confusion
        let code='';
        for(let i=0;i<6;i++)code+=chars.charAt(Math.floor(Math.random()*chars.length));
        return code;
      };
      
      // Copier le code dans le presse-papier
      const copyCode=(code)=>{
        navigator.clipboard.writeText(code);
        setCopiedCode(code);
        setTimeout(()=>setCopiedCode(null),2000);
      };

      const load=useCallback(async()=>{const{data}=await supabase.from('centers').select('*').order('name');setCenters(data||[]);setLoading(false);},[]);
      useEffect(()=>{load();},[load]);

      const handleSave=async()=>{
        if(!form.name.trim()){alert('Le nom est requis');return;}
        setSaving(true);
        const slug=form.slug||generateSlug(form.name);
        const registration_code=form.registration_code||generateCode();
        const payload={name:form.name.trim(),slug,description:form.description,registration_code};
        try{
          if(editing){
            const{error}=await supabase.from('centers').update(payload).eq('id',editing.id);
            if(error)throw error;
          }else{
            const{error}=await supabase.from('centers').insert(payload);
            if(error)throw error;
          }
          await load();setModal(false);setForm({name:'',slug:'',description:'',registration_code:''});setEditing(null);
        }catch(err){
          if(err.code==='23505')alert('❌ Un centre avec ce nom ou ce code existe déjà');
          else alert('Erreur: '+err.message);
        }
        setSaving(false);
      };
      const handleDelete=async id=>{if(!confirm('Supprimer ce centre ? Les utilisateurs associés perdront leur accès.'))return;await supabase.from('centers').delete().eq('id',id);load();};
      
      // Ouvrir le modal pour nouveau centre avec code généré
      const openNewModal=()=>{
        setForm({name:'',slug:'',description:'',registration_code:generateCode()});
        setEditing(null);
        setModal(true);
      };

      if(!can('manage_centers'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;
      return<div>
        <div className="flex items-center justify-between mb-6">
          <div>
            <h1 className="text-2xl font-bold">Centres</h1>
            <p className="text-sm text-gray-400">Gérez vos centres de formation et leurs codes d'inscription</p>
          </div>
          <Button icon="Plus" onClick={openNewModal}>Nouveau centre</Button>
        </div>
        
        {/* Info sur les codes */}
        <Alert type="info" className="mb-6">
          <p className="font-medium">💡 Code d'inscription</p>
          <p className="text-sm">Partagez le code avec vos apprenants. Ils pourront s'inscrire eux-mêmes sur la page de connexion en utilisant ce code.</p>
        </Alert>
        
        {centers.length===0?<Empty icon="Building2" title="Aucun centre" desc="Créez votre premier centre de formation"/>:
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{centers.map(c=><Card key={c.id} className="p-4">
          <div className="flex items-center gap-3 mb-4">
            <div className="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center"><Icon name="Building2" size={24}/></div>
            <div className="flex-1 min-w-0">
              <h3 className="font-semibold truncate">{c.name}</h3>
              <p className="text-sm text-gray-400">/{c.slug}</p>
            </div>
          </div>
          
          {/* Code d'inscription */}
          <div className="bg-gray-700/50 rounded-lg p-3 mb-4">
            <p className="text-xs text-gray-400 mb-1">Code d'inscription</p>
            <div className="flex items-center justify-between">
              <span className="font-mono text-lg font-bold text-indigo-400 tracking-wider">{c.registration_code||'—'}</span>
              {c.registration_code&&<button onClick={()=>copyCode(c.registration_code)} className="p-1.5 hover:bg-gray-600 rounded" title="Copier le code">
                <Icon name={copiedCode===c.registration_code?"Check":"Copy"} size={16} className={copiedCode===c.registration_code?"text-green-400":"text-gray-400"}/>
              </button>}
            </div>
          </div>
          
          {c.description&&<p className="text-sm text-gray-400 mb-4 line-clamp-2">{c.description}</p>}
          
          <div className="flex gap-2">
            <Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(c);setForm({name:c.name,slug:c.slug,description:c.description||'',registration_code:c.registration_code||''});setModal(true);}}>Modifier</Button>
            <Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(c.id)}>Supprimer</Button>
          </div>
        </Card>)}</div>}
        
        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title={editing?'Modifier le centre':'Nouveau centre'}>
          <div className="space-y-4">
            <Input label="Nom du centre *" value={form.name} onChange={e=>{setForm({...form,name:e.target.value,slug:generateSlug(e.target.value)});}} placeholder="Ex: Auto-École Centrale"/>
            
            <div>
              <label className="block text-sm font-medium text-gray-300 mb-1">Code d'inscription</label>
              <div className="flex gap-2">
                <input value={form.registration_code} onChange={e=>setForm({...form,registration_code:e.target.value.toUpperCase()})} className="flex-1 px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white font-mono tracking-wider" placeholder="XXXXXX" maxLength={10}/>
                <Button variant="secondary" icon="RefreshCw" onClick={()=>setForm({...form,registration_code:generateCode()})} title="Générer un nouveau code"/>
              </div>
              <p className="text-xs text-gray-500 mt-1">Ce code permet aux apprenants de s'inscrire directement</p>
            </div>
            
            <div>
              <label className="block text-sm font-medium text-gray-300 mb-1">Slug (URL)</label>
              <div className="flex items-center gap-2">
                <span className="text-gray-500">/</span>
                <input value={form.slug} onChange={e=>setForm({...form,slug:e.target.value.toLowerCase().replace(/[^a-z0-9-]/g,'-')})} className="flex-1 px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white" placeholder="auto-ecole-centrale"/>
              </div>
              <p className="text-xs text-gray-500 mt-1">Généré automatiquement à partir du nom</p>
            </div>
            
            <div>
              <label className="block text-sm font-medium text-gray-300 mb-1">Description</label>
              <textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={3} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none" placeholder="Description optionnelle..."/>
            </div>
            
            <div className="flex justify-end gap-3 pt-2">
              <Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button>
              <Button onClick={handleSave} loading={saving} disabled={!form.name.trim()}>Enregistrer</Button>
            </div>
          </div>
        </Modal>
      </div>;
    }

    // Users
    function UsersPage(){
      const{profile,center,isSuperAdmin,realRole,can,canAssignRole}=useAuth();
      const[users,setUsers]=useState([]);
      const[centers,setCenters]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[createModal,setCreateModal]=useState(false);
      const[importModal,setImportModal]=useState(false);
      const[deleteModal,setDeleteModal]=useState(null);
      const[bulkDeleteModal,setBulkDeleteModal]=useState(false);
      const[deleting,setDeleting]=useState(false);
      const[editing,setEditing]=useState(null);
      const[search,setSearch]=useState('');
      const[filterRole,setFilterRole]=useState('');
      const[filterCenter,setFilterCenter]=useState('');
      const[sortBy,setSortBy]=useState('created_at');
      const[sortDir,setSortDir]=useState('desc');
      const[selectedUsers,setSelectedUsers]=useState([]);
      const[form,setForm]=useState({email:'',first_name:'',last_name:'',role:'learner',center_id:''});
      const[createForm,setCreateForm]=useState({email:'',password:'',first_name:'',last_name:'',role:'learner',center_id:''});
      const[saving,setSaving]=useState(false);
      const[creating,setCreating]=useState(false);
      const[createResult,setCreateResult]=useState(null);
      const[importData,setImportData]=useState([]);
      const[importLoading,setImportLoading]=useState(false);
      const[importResult,setImportResult]=useState(null);
      const fileInputRef=useRef(null);
      
      // Rôles que l'utilisateur courant peut assigner
      const assignableRoles=Object.entries(ROLE_LABELS).filter(([r])=>{
        if(isSuperAdmin)return true;
        return canAssignRole(r);
      });

      const load=useCallback(async()=>{
        let q=supabase.from('profiles').select('*,centers(name)').order('created_at',{ascending:false});
        // Filtrage par centre pour non-super-admin
        if(!isSuperAdmin&&center?.id)q=q.eq('center_id',center.id);
        const{data:u}=await q;setUsers(u||[]);
        const{data:c}=await supabase.from('centers').select('id,name');setCenters(c||[]);
        setLoading(false);
        setSelectedUsers([]);
      },[isSuperAdmin,center?.id]);
      
      useEffect(()=>{load();},[load]);

      const generatePassword=()=>{
        const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!@#$%';
        let pwd='';for(let i=0;i<12;i++)pwd+=chars.charAt(Math.floor(Math.random()*chars.length));
        return pwd;
      };

      // Suppression par lot
      const handleBulkDelete=async()=>{
        if(!selectedUsers.length||!can('delete_users'))return;
        setDeleting(true);
        try{
          for(const userId of selectedUsers){
            await supabase.from('enrollments').delete().eq('learner_id',userId);
            await supabase.from('video_progress').delete().eq('learner_id',userId);
            await supabase.from('scorm_progress').delete().eq('learner_id',userId);
            await supabase.from('quiz_attempts').delete().eq('learner_id',userId);
            await supabase.from('learner_badges').delete().eq('learner_id',userId);
            await supabase.from('learner_points').delete().eq('learner_id',userId);
            await supabase.from('learner_notes').delete().eq('learner_id',userId);
            await supabase.from('notifications').delete().eq('user_id',userId);
            await supabase.from('certificates').delete().eq('learner_id',userId);
            await supabase.from('profiles').delete().eq('id',userId);
          }
          await load();
          setBulkDeleteModal(false);
        }catch(err){
          console.error('Erreur suppression:',err);
          alert('Erreur lors de la suppression: '+err.message);
        }
        setDeleting(false);
      };

      // Sélection
      const toggleSelect=(userId)=>{
        setSelectedUsers(prev=>prev.includes(userId)?prev.filter(id=>id!==userId):[...prev,userId]);
      };
      const toggleSelectAll=(filteredUsers)=>{
        const selectableUsers=filteredUsers.filter(u=>u.id!==profile?.id&&u.role!=='super_admin');
        const allSelected=selectableUsers.every(u=>selectedUsers.includes(u.id));
        if(allSelected){
          setSelectedUsers([]);
        }else{
          setSelectedUsers(selectableUsers.map(u=>u.id));
        }
      };

      // Tri
      const handleSort=(field)=>{
        if(sortBy===field){
          setSortDir(prev=>prev==='asc'?'desc':'asc');
        }else{
          setSortBy(field);
          setSortDir('asc');
        }
      };

      const handleCreate=async()=>{
        if(!createForm.email||!createForm.first_name||!createForm.last_name){
          alert('Veuillez remplir tous les champs obligatoires');return;
        }
        // Valider le rôle selon les permissions
        const allowedRoles=isSuperAdmin?['learner','trainer','center_admin','super_admin']:['learner','trainer'];
        const finalRole=allowedRoles.includes(createForm.role)?createForm.role:'learner';
        
        setCreating(true);setCreateResult(null);
        try{
          const password=createForm.password||generatePassword();
          const targetCenterId=isSuperAdmin?(createForm.center_id||center?.id):center?.id;
          
          // Créer l'utilisateur via l'API Supabase Auth
          const{data:authData,error:authError}=await supabase.auth.signUp({
            email:createForm.email.toLowerCase().trim(),
            password:password,
            options:{data:{first_name:createForm.first_name,last_name:createForm.last_name}}
          });
          
          if(authError)throw authError;
          if(!authData.user)throw new Error('Erreur lors de la création du compte');
          
          // Mettre à jour le profil avec le rôle et le centre
          const{error:profileError}=await supabase.from('profiles').update({
            first_name:createForm.first_name,
            last_name:createForm.last_name,
            role:finalRole,
            center_id:targetCenterId||null
          }).eq('id',authData.user.id);
          
          if(profileError)console.error('Erreur profil:',profileError);
          
          setCreateResult({success:true,email:createForm.email,password:password});
          await load();
        }catch(err){
          console.error('Erreur création:',err);
          setCreateResult({success:false,error:err.message});
        }
        setCreating(false);
      };

      const resetCreateForm=()=>{
        setCreateForm({email:'',password:'',first_name:'',last_name:'',role:'learner',center_id:center?.id||''});
        setCreateResult(null);
      };

      const handleSave=async()=>{
        if(!editing)return;
        // Protection: un non-super_admin ne peut pas modifier un super_admin
        if(!isSuperAdmin&&editing.role==='super_admin'){
          alert('Vous n\'avez pas la permission de modifier ce profil.');
          setModal(false);setEditing(null);
          return;
        }
        // Protection: un non-super_admin ne peut pas promouvoir quelqu'un en super_admin
        if(!isSuperAdmin&&form.role==='super_admin'){
          alert('Vous n\'avez pas la permission d\'attribuer ce rôle.');
          return;
        }
        setSaving(true);
        await supabase.from('profiles').update({first_name:form.first_name,last_name:form.last_name,role:form.role,center_id:form.center_id||null}).eq('id',editing.id);
        await load();setModal(false);setEditing(null);setSaving(false);
      };

      const handleDelete=async()=>{
        if(!deleteModal)return;
        setDeleting(true);
        try{
          // Supprimer les données liées
          await supabase.from('enrollments').delete().eq('learner_id',deleteModal.id);
          await supabase.from('video_progress').delete().eq('learner_id',deleteModal.id);
          await supabase.from('scorm_progress').delete().eq('learner_id',deleteModal.id);
          await supabase.from('quiz_attempts').delete().eq('learner_id',deleteModal.id);
          await supabase.from('learner_badges').delete().eq('learner_id',deleteModal.id);
          await supabase.from('learner_points').delete().eq('learner_id',deleteModal.id);
          await supabase.from('learner_notes').delete().eq('learner_id',deleteModal.id);
          await supabase.from('notifications').delete().eq('user_id',deleteModal.id);
          await supabase.from('certificates').delete().eq('learner_id',deleteModal.id);
          
          // Supprimer le profil
          await supabase.from('profiles').delete().eq('id',deleteModal.id);
          
          // Supprimer l'utilisateur auth (nécessite une fonction Edge ou admin API)
          // Note: Cela nécessite les droits admin Supabase
          // Pour l'instant on garde le user auth mais sans profil
          
          await load();
          setDeleteModal(null);
        }catch(err){
          console.error('Erreur suppression:',err);
          alert('Erreur lors de la suppression: '+err.message);
        }
        setDeleting(false);
      };

      const handleFileSelect=async(e)=>{
        const file=e.target.files[0];if(!file)return;
        try{
          const data=await file.arrayBuffer();
          const workbook=XLSX.read(data);
          const sheet=workbook.Sheets[workbook.SheetNames[0]];
          const jsonData=XLSX.utils.sheet_to_json(sheet);
          // Rôles autorisés selon le type d'admin
          const allowedRoles=isSuperAdmin?['learner','trainer','center_admin','super_admin']:['learner','trainer'];
          const mapped=jsonData.map((row,i)=>{
            let role=String(row['Rôle']||row['Role']||row['role']||'learner').toLowerCase();
            // Si le rôle n'est pas autorisé pour cet admin, forcer à 'learner'
            if(!allowedRoles.includes(role))role='learner';
            return{
              _index:i+1,
              email:String(row['Email']||row['email']||'').toLowerCase().trim(),
              first_name:row['Prénom']||row['Prenom']||row['first_name']||'',
              last_name:row['Nom']||row['last_name']||'',
              role:role,
              password:row['Mot de passe']||row['Password']||row['password']||'',
              center_name:row['Centre']||row['center']||'',
              _valid:!!(row['Email']||row['email'])&&!!(row['Prénom']||row['Prenom']||row['first_name'])&&!!(row['Nom']||row['last_name']),
              _roleForced:!allowedRoles.includes(String(row['Rôle']||row['Role']||row['role']||'learner').toLowerCase())
            };
          });
          setImportData(mapped);setImportResult(null);
        }catch(err){alert('Erreur: '+err.message);}
        e.target.value='';
      };

      const handleImport=async()=>{
        const validData=importData.filter(d=>d._valid);
        if(!validData.length){alert('Aucune donnée valide');return;}
        
        setImportLoading(true);
        try{
          const usersToCreate=validData.map(item=>{
            let targetCenterId=center?.id;
            if(isSuperAdmin&&item.center_name){
              const found=centers.find(c=>c.name.toLowerCase()===item.center_name.toLowerCase());
              if(found)targetCenterId=found.id;
            }
            return{email:item.email,password:item.password||'',first_name:item.first_name,last_name:item.last_name,role:item.role,center_id:targetCenterId};
          });

          const{data:{session}}=await supabase.auth.getSession();
          const response=await fetch(`${SUPABASE_URL}/functions/v1/create-users`,{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token}`},
            body:JSON.stringify({users:usersToCreate})
          });

          const result=await response.json();
          
          if(result.success){
            setImportResult({created:result.created||0,updated:result.updated||0,errors:result.errors||0,results:result.results||[]});
            await load();
          }else{
            setImportResult({created:0,updated:0,errors:validData.length,errorMessage:result.error});
          }
        }catch(err){
          setImportResult({created:0,updated:0,errors:validData.length,errorMessage:err.message});
        }
        setImportLoading(false);
      };

      const downloadTemplate=()=>{
        const template=[{'Email':'paul@email.com','Prénom':'Paul','Nom':'Moreau','Rôle':'learner','Mot de passe':'','Centre':''}];
        const ws=XLSX.utils.json_to_sheet(template);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Utilisateurs');
        XLSX.writeFile(wb,'template_utilisateurs.xlsx');
      };

      const exportResults=()=>{
        if(!importResult?.results)return;
        const data=importResult.results.map(r=>({'Email':r.email,'Statut':r.status==='created'?'Créé':r.status==='updated'?'Mis à jour':'Erreur','Mot de passe':r.password||'','Message':r.message||''}));
        const ws=XLSX.utils.json_to_sheet(data);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Résultats');
        XLSX.writeFile(wb,'resultat_import.xlsx');
      };

      const filtered=useMemo(()=>{
        let result=[...users];
        // Recherche
        if(search){
          const s=search.toLowerCase();
          result=result.filter(u=>u.email?.toLowerCase().includes(s)||u.first_name?.toLowerCase().includes(s)||u.last_name?.toLowerCase().includes(s));
        }
        // Filtre par rôle
        if(filterRole){
          result=result.filter(u=>u.role===filterRole);
        }
        // Filtre par centre
        if(filterCenter){
          result=result.filter(u=>u.center_id===filterCenter);
        }
        // Tri
        result.sort((a,b)=>{
          let valA,valB;
          switch(sortBy){
            case 'name':valA=`${a.first_name} ${a.last_name}`.toLowerCase();valB=`${b.first_name} ${b.last_name}`.toLowerCase();break;
            case 'email':valA=a.email?.toLowerCase()||'';valB=b.email?.toLowerCase()||'';break;
            case 'role':valA=a.role||'';valB=b.role||'';break;
            case 'center':valA=a.centers?.name?.toLowerCase()||'';valB=b.centers?.name?.toLowerCase()||'';break;
            default:valA=a.created_at||'';valB=b.created_at||'';
          }
          if(valA<valB)return sortDir==='asc'?-1:1;
          if(valA>valB)return sortDir==='asc'?1:-1;
          return 0;
        });
        return result;
      },[users,search,filterRole,filterCenter,sortBy,sortDir]);

      const selectableUsers=filtered.filter(u=>u.id!==profile?.id&&u.role!=='super_admin');
      const allSelected=selectableUsers.length>0&&selectableUsers.every(u=>selectedUsers.includes(u.id));

      if(!can('create_users')&&!can('edit_users')&&!can('delete_users'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4">
          <div>
            <h1 className="text-2xl font-bold">Utilisateurs</h1>
            <p className="text-sm text-gray-400">{users.length} utilisateur{users.length>1?'s':''}{!isSuperAdmin&&center?' - '+center.name:''}</p>
          </div>
          <div className="flex gap-2">
            {selectedUsers.length>0&&(
              <Button variant="secondary" icon="Trash2" className="text-red-400 border-red-500/50 hover:bg-red-500/10" onClick={()=>setBulkDeleteModal(true)}>
                Supprimer ({selectedUsers.length})
              </Button>
            )}
            <Button icon="UserPlus" onClick={()=>{resetCreateForm();setCreateModal(true);}}>Ajouter</Button>
            <Button variant="secondary" icon="Upload" onClick={()=>setImportModal(true)}>Importer</Button>
          </div>
        </div>
        
        {/* Filtres */}
        <Card className="p-4 mb-6">
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <Input icon="Search" placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)}/>
            <Select value={filterRole} onChange={e=>setFilterRole(e.target.value)} options={[
              {value:'',label:'Tous les rôles'},
              {value:'learner',label:'Apprenants'},
              {value:'trainer',label:'Formateurs'},
              {value:'center_admin',label:'Admins de centre'},
              {value:'super_admin',label:'Super Admins'}
            ]}/>
            {isSuperAdmin&&<Select value={filterCenter} onChange={e=>setFilterCenter(e.target.value)} options={[
              {value:'',label:'Tous les centres'},
              ...centers.map(c=>({value:c.id,label:c.name}))
            ]}/>}
            <Select value={`${sortBy}-${sortDir}`} onChange={e=>{const[field,dir]=e.target.value.split('-');setSortBy(field);setSortDir(dir);}} options={[
              {value:'created_at-desc',label:'Plus récents'},
              {value:'created_at-asc',label:'Plus anciens'},
              {value:'name-asc',label:'Nom A-Z'},
              {value:'name-desc',label:'Nom Z-A'},
              {value:'email-asc',label:'Email A-Z'},
              {value:'role-asc',label:'Rôle A-Z'}
            ]}/>
          </div>
        </Card>
        
        {/* Tableau */}
        <Card>
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead className="bg-gray-750">
                <tr>
                  <th className="p-4 w-12">
                    <input type="checkbox" checked={allSelected} onChange={()=>toggleSelectAll(filtered)} className="w-4 h-4 rounded bg-gray-700 border-gray-600 text-indigo-600 focus:ring-indigo-500"/>
                  </th>
                  <th className="text-left p-4 font-medium text-gray-400 cursor-pointer hover:text-white" onClick={()=>handleSort('name')}>
                    <div className="flex items-center gap-1">Utilisateur {sortBy==='name'&&<Icon name={sortDir==='asc'?'ChevronUp':'ChevronDown'} size={14}/>}</div>
                  </th>
                  <th className="text-left p-4 font-medium text-gray-400 cursor-pointer hover:text-white" onClick={()=>handleSort('role')}>
                    <div className="flex items-center gap-1">Rôle {sortBy==='role'&&<Icon name={sortDir==='asc'?'ChevronUp':'ChevronDown'} size={14}/>}</div>
                  </th>
                  {isSuperAdmin&&<th className="text-left p-4 font-medium text-gray-400 cursor-pointer hover:text-white" onClick={()=>handleSort('center')}>
                    <div className="flex items-center gap-1">Centre {sortBy==='center'&&<Icon name={sortDir==='asc'?'ChevronUp':'ChevronDown'} size={14}/>}</div>
                  </th>}
                  <th className="text-left p-4 font-medium text-gray-400 cursor-pointer hover:text-white" onClick={()=>handleSort('created_at')}>
                    <div className="flex items-center gap-1">Créé le {sortBy==='created_at'&&<Icon name={sortDir==='asc'?'ChevronUp':'ChevronDown'} size={14}/>}</div>
                  </th>
                  <th className="text-right p-4"></th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-700">
                {filtered.length===0?(
                  <tr><td colSpan={isSuperAdmin?6:5} className="p-8 text-center text-gray-500">Aucun utilisateur trouvé</td></tr>
                ):filtered.map(u=>(
                  <tr key={u.id} className={`hover:bg-gray-750/50 ${selectedUsers.includes(u.id)?'bg-indigo-500/10':''}`}>
                    <td className="p-4">
                      {u.id!==profile?.id&&u.role!=='super_admin'?(
                        <input type="checkbox" checked={selectedUsers.includes(u.id)} onChange={()=>toggleSelect(u.id)} className="w-4 h-4 rounded bg-gray-700 border-gray-600 text-indigo-600 focus:ring-indigo-500"/>
                      ):<span className="w-4 h-4 block"></span>}
                    </td>
                    <td className="p-4">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center"><Icon name="User" size={18}/></div>
                        <div>
                          <p className="font-medium">{u.first_name} {u.last_name}</p>
                          <p className="text-sm text-gray-400">{u.email}</p>
                        </div>
                      </div>
                    </td>
                    <td className="p-4"><RoleBadge role={u.role}/></td>
                    {isSuperAdmin&&<td className="p-4 text-gray-400">{u.centers?.name||'-'}</td>}
                    <td className="p-4 text-gray-400 text-sm">{u.created_at?new Date(u.created_at).toLocaleDateString('fr-FR'):'-'}</td>
                    <td className="p-4 text-right">
                      <div className="flex justify-end gap-1">
                        {/* Seul le super_admin peut éditer un autre super_admin */}
                        {(isSuperAdmin||u.role!=='super_admin')&&<Button variant="ghost" size="sm" icon="Edit2" onClick={()=>{setEditing(u);setForm({email:u.email,first_name:u.first_name||'',last_name:u.last_name||'',role:u.role,center_id:u.center_id||''});setModal(true);}}/>}
                        {u.id!==profile?.id&&u.role!=='super_admin'&&<Button variant="ghost" size="sm" icon="Trash2" className="text-red-400 hover:text-red-300 hover:bg-red-500/10" onClick={()=>setDeleteModal(u)}/>}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>

'    GetLastError: function() { return "0"; },\n' +

'    GetDiagnostic: function(c) { return "No Error"; }\n' +
'  };\n' +
'  console.log("[SCORM Bridge] APIs initialized");\n' +

'})();\n' +
'<\/script>';
                
                // Vérifier si c'est un SCORM Codes Rousseau
                const isCodesRousseau = content.includes('layer2.js') || content.includes('data-source');
                
                // Injecter le bridge dans TOUS les fichiers HTML (y compris Codes Rousseau)
                // Le bridge doit être défini AVANT que layer2.js s'exécute
                if(content.includes('<head>')){
                  content = content.replace('<head>', '<head>' + scormBridgeScript);
                } else if(content.includes('<HEAD>')){
                  content = content.replace('<HEAD>', '<HEAD>' + scormBridgeScript);
                } else if(content.includes('<html>')){
                  content = content.replace('<html>', '<html><head>' + scormBridgeScript + '</head>');
                } else if(content.includes('<HTML>')){
                  content = content.replace('<HTML>', '<HTML><HEAD>' + scormBridgeScript + '</HEAD>');
                } else {
                  // Ajouter au début
                  content = scormBridgeScript + content;
                }
                
                // Pour Codes Rousseau : ajouter aussi les modifications lms_origin
                if(isCodesRousseau){
                  console.log('Codes Rousseau detected, adding lms_origin for:', relativePath);
                  content = content.replace(

                    "window.lms_origin = '" + lmsOrigin + "'; window.LMS_ORIGIN = '" + lmsOrigin + "'; var url = 'https://lms.codesrousseau.fr"
                  );
                  content = content.replace(
                    /layer2\.js\?cacherev=/g,
                    'layer2.js?lms_origin=' + encodeURIComponent(lmsOrigin) + '&cacherev='
                  );
                }
              }
              filesToUpload.push({name: relativePath, content: content, type: mimeType, isText: true});
            } else {
              // Fichiers binaires (images, audio, vidéo, fonts)
              content = await zipEntry.async('arraybuffer');
              filesToUpload.push({name: relativePath, content: content, type: mimeType, isText: false});
            }
          }
          
          console.log('SCORM files to upload:', filesToUpload.length);
          setScormUploadProgress(`${filesToUpload.length} fichiers détectés...`);
          
          // Parser le manifest XML
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(manifest, 'text/xml');
          
          // Extraire le titre
          const titleEl = xmlDoc.querySelector('title langstring') || xmlDoc.querySelector('title');
          const title = titleEl?.textContent?.trim() || file.name.replace('.zip','');
          
          // Extraire le point d'entrée depuis le manifest (si pas déjà détecté pour Codes Rousseau)
          if(entryPoint === 'index.html'){
            // Chercher dans les resources du manifest
            const resources = xmlDoc.querySelectorAll('resource');
            for(const res of resources){
              const href = res.getAttribute('href');
              const scormType = res.getAttribute('adlcp:scormtype') || res.getAttributeNS('http://www.adlnet.org/xsd/adlcp_rootv1p2', 'scormtype');
              // Priorité aux ressources de type SCO avec un href HTML
              if(href && href.endsWith('.html')){
                entryPoint = href.split('/').pop(); // Garder juste le nom du fichier
                console.log('Entry point detected from manifest:', entryPoint);
                break;
              }
            }
            // Fallback: chercher les fichiers HTML courants
            if(entryPoint === 'index.html'){
              const commonEntryPoints = ['story.html', 'index_lms.html', 'launch.html', 'player.html'];
              const htmlFiles = filesToUpload.filter(f => f.name.endsWith('.html')).map(f => f.name);
              for(const common of commonEntryPoints){
                if(htmlFiles.includes(common)){
                  entryPoint = common;
                  console.log('Entry point fallback:', entryPoint);
                  break;
                }
              }
            }
          }
          
          // Générer un slug unique
          const slug = title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+/g,'-').substring(0,50) + '-' + Date.now();

          const schemaVersion = xmlDoc.querySelector('schemaversion')?.textContent || '';
          let moduleType = 'scorm12';

          // Extraire l'URL distante

            console.log('Uploading SCORM files:', filesToUpload.length, 'files');
            setScormUploadProgress(`Préparation de ${filesToUpload.length} fichiers...`);
            
            let uploadedCount = 0;
            let errorCount = 0;
            
            for(const f of filesToUpload){
              const filePath = slug + '/' + f.name;
              const blob = new Blob([f.content], {type: f.type});
              const result = await supabase.storage.from('scorm-dispatch').upload(filePath, blob, {
                contentType: f.type,
                upsert: true
              });
              if(result.error){
                console.error('Upload error:', f.name, result.error);
                errorCount++;

                  alert('Le bucket "scorm-dispatch" n\'existe pas. Créez-le dans Supabase Storage.');

              } else {
                uploadedCount++;
                // Mettre à jour la progression tous les 10 fichiers ou à la fin
                if(uploadedCount % 10 === 0 || uploadedCount === filesToUpload.length){
                  setScormUploadProgress(`Upload: ${uploadedCount}/${filesToUpload.length} fichiers...`);
                }
              }
            }
            
            console.log('Upload complete:', uploadedCount, 'uploaded,', errorCount, 'errors');
            setScormUploadProgress('');
            
            const urlResult = supabase.storage.from('scorm-dispatch').getPublicUrl(slug + '/' + entryPoint);
            packageUrl = urlResult.data?.publicUrl || '';

          // Mettre à jour le formulaire
