                            <p key={a.id} className={`text-sm ${a.is_correct?'text-green-400':'text-gray-400'}`}>
                              {a.is_correct?'✓':'○'} {a.answer_text}
                            </p>
                          ))}
                        </div>
                      </div>
                      <button onClick={()=>deleteQuestion(q.id)} className="p-1 hover:bg-red-600 rounded"><Icon name="Trash2" size={16}/></button>
                    </div>
                  </div>
                ))}
                {questions.length===0&&<p className="text-gray-500 text-center py-4">Aucune question</p>}
              </div>
            </div>

            {/* Formulaire nouvelle question */}
            <div className="p-4 bg-gray-700/50 rounded-lg space-y-4">
              <h4 className="font-medium">Ajouter une question</h4>
              <div><label className="block text-sm font-medium text-gray-300 mb-1">Question *</label><textarea value={newQuestion.question_text} onChange={e=>setNewQuestion({...newQuestion,question_text:e.target.value})} rows={2} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none" placeholder="Entrez votre question..."/></div>
              <Select label="Type" value={newQuestion.question_type} onChange={e=>setNewQuestion({...newQuestion,question_type:e.target.value})} options={[{value:'single',label:'Choix unique'},{value:'multiple',label:'Choix multiple'}]}/>
              <div>
                <label className="block text-sm font-medium text-gray-300 mb-2">Réponses (cochez la/les bonne(s))</label>
                <div className="space-y-2">
                  {newQuestion.answers.map((a,i)=>(
                    <div key={i} className="flex items-center gap-2">
                      <input type={newQuestion.question_type==='single'?'radio':'checkbox'} checked={a.is_correct} onChange={()=>updateAnswer(i,'is_correct',!a.is_correct)} className="w-5 h-5"/>
                      <Input className="flex-1" placeholder={`Réponse ${i+1}`} value={a.text} onChange={e=>updateAnswer(i,'text',e.target.value)}/>
                    </div>
                  ))}
                </div>
                {newQuestion.answers.length<6&&<Button variant="ghost" size="sm" icon="Plus" onClick={addAnswerOption} className="mt-2">Ajouter une option</Button>}
              </div>
              <Button icon="Plus" onClick={addQuestion} disabled={!newQuestion.question_text.trim()||newQuestion.answers.filter(a=>a.text.trim()).length<2}>Ajouter la question</Button>
            </div>
          </div>
        </Modal>
      </div>;
    }

    // Enrollments avec inscription en masse
    function EnrollmentsPage(){
      const{center,isSuperAdmin,profile,can}=useAuth();
      const[enrollments,setEnrollments]=useState([]);
      const[playlists,setPlaylists]=useState([]);
      const[learners,setLearners]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[bulkModal,setBulkModal]=useState(false);
      const[form,setForm]=useState({playlist_id:'',learner_id:''});
      const[bulkForm,setBulkForm]=useState({playlist_id:'',selectedLearners:[]});
      const[saving,setSaving]=useState(false);

      const load=useCallback(async()=>{
        const{data:e}=await supabase.from('enrollments').select('*,playlists:playlist_id(title),profiles:learner_id(first_name,last_name,email)').order('created_at',{ascending:false});
        setEnrollments(e||[]);
        // Admin peut inscrire à tous les cours (même brouillons)
        let qp=supabase.from('playlists').select('id,title,is_published').order('title');
        let ql=supabase.from('profiles').select('id,first_name,last_name,email').eq('role','learner');
        if(!isSuperAdmin&&center?.id){qp=qp.eq('center_id',center.id);ql=ql.eq('center_id',center.id);}
        const[{data:p},{data:l}]=await Promise.all([qp,ql]);
        setPlaylists(p||[]);setLearners(l||[]);setLoading(false);
      },[isSuperAdmin,center?.id]);
      useEffect(()=>{load();},[load]);

      const handleEnroll=async()=>{
        setSaving(true);
        await supabase.from('enrollments').insert({playlist_id:form.playlist_id,learner_id:form.learner_id,enrolled_by:profile?.id});
        await load();setModal(false);setForm({playlist_id:'',learner_id:''});setSaving(false);
      };
      
      const handleBulkEnroll=async()=>{
        setSaving(true);
        const inserts=bulkForm.selectedLearners.map(learnerId=>({playlist_id:bulkForm.playlist_id,learner_id:learnerId,enrolled_by:profile?.id}));
        await supabase.from('enrollments').upsert(inserts,{onConflict:'playlist_id,learner_id'});
        await load();setBulkModal(false);setBulkForm({playlist_id:'',selectedLearners:[]});setSaving(false);
      };
      
      const handleUnenroll=async id=>{if(!confirm('Désinscrire ?'))return;await supabase.from('enrollments').delete().eq('id',id);load();};
      
      const toggleLearner=(learnerId)=>{
        setBulkForm(prev=>({
          ...prev,
          selectedLearners:prev.selectedLearners.includes(learnerId)?prev.selectedLearners.filter(id=>id!==learnerId):[...prev.selectedLearners,learnerId]
        }));
      };
      
      const selectAll=()=>{
        const enrolledIds=enrollments.filter(e=>e.playlist_id===bulkForm.playlist_id).map(e=>e.learner_id);
        const available=learners.filter(l=>!enrolledIds.includes(l.id));
        setBulkForm(prev=>({...prev,selectedLearners:available.map(l=>l.id)}));
      };

      if(!can('manage_enrollments'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;
      
      return<div>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-4"><h1 className="text-2xl font-bold">Inscriptions</h1><div className="flex gap-2"><Button variant="secondary" icon="Users" onClick={()=>setBulkModal(true)}>Inscription en masse</Button><Button icon="UserPlus" onClick={()=>setModal(true)}>Inscrire</Button></div></div>
        {enrollments.length===0?<Empty icon="UserPlus" title="Aucune inscription"/>:<Card><div className="overflow-x-auto"><table className="w-full"><thead className="bg-gray-750"><tr><th className="text-left p-4 font-medium text-gray-400">Apprenant</th><th className="text-left p-4 font-medium text-gray-400">Cours</th><th className="text-left p-4 font-medium text-gray-400">Progression</th><th className="text-left p-4 font-medium text-gray-400">Temps</th><th className="text-left p-4 font-medium text-gray-400">Statut</th><th className="text-left p-4 font-medium text-gray-400">Date</th><th className="text-right p-4"></th></tr></thead><tbody className="divide-y divide-gray-700">{enrollments.map(e=>{const formatT=(s)=>{if(!s)return'-';const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);return h>0?`${h}h ${m}min`:`${m}min`;};return<tr key={e.id}><td className="p-4"><p className="font-medium">{e.profiles?.first_name} {e.profiles?.last_name}</p><p className="text-sm text-gray-400">{e.profiles?.email}</p></td><td className="p-4">{e.playlists?.title||'—'}</td><td className="p-4"><ProgressBar percent={e.progress_percent||0} size="sm" showLabel={true}/></td><td className="p-4 text-blue-400">{formatT(e.time_spent_seconds)}</td><td className="p-4"><span className={`px-2 py-1 rounded text-xs ${e.status==='completed'?'bg-green-500/20 text-green-400':e.status==='in_progress'?'bg-yellow-500/20 text-yellow-400':'bg-gray-500/20 text-gray-400'}`}>{e.status==='not_started'?'Non commencé':e.status==='in_progress'?'En cours':'Terminé'}</span></td><td className="p-4 text-gray-400">{new Date(e.created_at).toLocaleDateString('fr-FR')}</td><td className="p-4 text-right"><Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleUnenroll(e.id)}/></td></tr>})}</tbody></table></div></Card>}
        
        <Modal isOpen={modal} onClose={()=>setModal(false)} title="Inscrire"><div className="space-y-4"><Select label="Cours" value={form.playlist_id} onChange={e=>setForm({...form,playlist_id:e.target.value})} options={[{value:'',label:'Sélectionner...'},...playlists.map(p=>({value:p.id,label:`${p.title}${p.is_published?'':' (brouillon)'}`}))]}/><Select label="Apprenant" value={form.learner_id} onChange={e=>setForm({...form,learner_id:e.target.value})} options={[{value:'',label:'Sélectionner...'},...learners.map(l=>({value:l.id,label:`${l.first_name} ${l.last_name}`}))]}/><div className="flex justify-end gap-3"><Button variant="secondary" onClick={()=>setModal(false)}>Annuler</Button><Button onClick={handleEnroll} loading={saving} disabled={!form.playlist_id||!form.learner_id}>Inscrire</Button></div></div></Modal>
        
        <Modal isOpen={bulkModal} onClose={()=>setBulkModal(false)} title="Inscription en masse" size="lg">
          <div className="space-y-4">
            <Select label="Cours" value={bulkForm.playlist_id} onChange={e=>setBulkForm({...bulkForm,playlist_id:e.target.value,selectedLearners:[]})} options={[{value:'',label:'Sélectionner un cours...'},...playlists.map(p=>({value:p.id,label:`${p.title}${p.is_published?'':' (brouillon)'}`}))]}/>
            
            {bulkForm.playlist_id&&(
              <div>
                <div className="flex items-center justify-between mb-3">
                  <h4 className="font-medium">Apprenants disponibles</h4>
                  <Button variant="ghost" size="sm" onClick={selectAll}>Tout sélectionner</Button>
                </div>

    // Permissions Page
    function PermissionsPage(){
      const{can}=useAuth();
      const[roles,setRoles]=useState([]);
      const[loading,setLoading]=useState(true);
      const[saving,setSaving]=useState(false);

      const load=useCallback(async()=>{
        const{data}=await supabase.from('role_permissions').select('*').order('role');
        setRoles(data||[]);
        setLoading(false);
      },[]);
      useEffect(()=>{load();},[load]);

      const togglePermission=async(role,permission)=>{
        setSaving(true);
        const roleData=roles.find(r=>r.role===role);
        if(!roleData)return;
        const newPermissions={...roleData.permissions,[permission]:!roleData.permissions[permission]};
        await supabase.from('role_permissions').update({permissions:newPermissions}).eq('role',role);
        setRoles(roles.map(r=>r.role===role?{...r,permissions:newPermissions}:r));
        setSaving(false);
      };

      if(!can('manage_permissions'))return<Empty icon="Lock" title="Accès refusé"/>;
      if(loading)return<Loading/>;

      return<div>
        <h1 className="text-2xl font-bold mb-6">Gestion des permissions</h1>
        <Card>
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead className="bg-gray-750">
                <tr>
                  <th className="text-left p-4 font-medium text-gray-400">Permission</th>
                  {roles.filter(r=>r.role!=='super_admin').map(r=><th key={r.role} className="text-center p-4 font-medium"><RoleBadge role={r.role}/></th>)}
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-700">
                {Object.entries(PERMISSION_LABELS).map(([perm,label])=>(
                  <tr key={perm}>
                    <td className="p-4 font-medium">{label}</td>
                    {roles.filter(r=>r.role!=='super_admin').map(r=>(
                      <td key={r.role} className="p-4 text-center">
                        <input 
                          type="checkbox" 
                          checked={r.permissions[perm]||false} 
                          onChange={()=>togglePermission(r.role,perm)}
                          disabled={saving||r.role==='super_admin'}
                          className="w-5 h-5 rounded bg-gray-700 border-gray-600 text-indigo-600 focus:ring-indigo-500 cursor-pointer disabled:opacity-50"
                        />
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>
        <Alert type="info" className="mt-4"><p><Icon name="Info" size={16} className="inline mr-2"/>Les permissions du Super Admin ne peuvent pas être modifiées.</p></Alert>
      </div>;
    }

    // Lecteur SCORM avec API SCORM 1.2 et 2004
    function ScormPlayer({module,enrollmentId,onComplete,onClose}){
      const{user}=useAuth();
      const iframeRef=useRef(null);
      const[loading,setLoading]=useState(true);
      const[error,setError]=useState(null);
      const[status,setStatus]=useState('not attempted');
      const[score,setScore]=useState(null);
      const[initialDataLoaded,setInitialDataLoaded]=useState(false);
      const[savedCmiData,setSavedCmiData]=useState(null);
      
      // Exposer lms_origin sur window pour que layer2.js puisse le trouver
      useEffect(() => {
        const origin = window.location.origin;
        window.lms_origin = origin;
        window.LMS_ORIGIN = origin;
        console.log('Exposed lms_origin on window:', origin);
        
        return () => {
          // Cleanup optionnel
        };
      }, []);
      
      // Charger les données existantes AVANT d'initialiser l'API
      useEffect(()=>{
        const loadProgress=async()=>{
          console.log('SCORM: Loading existing progress for module', module.id, 'learner', user.id);
          // La contrainte unique est sur (module_id, learner_id)
          const{data,error}=await supabase.from('scorm_progress')
            .select('*')
            .eq('module_id',module.id)
            .eq('learner_id',user.id)
            .maybeSingle();
          
          if(error){
            console.error('SCORM: Error loading progress', error);
          }
          
          if(data){
            console.log('SCORM: Found existing progress', data);
            setSavedCmiData(data.cmi_data||{});
            setStatus(data.completion_status||'unknown');
            setScore(data.score_scaled);
          }else{
            console.log('SCORM: No existing progress found');
            setSavedCmiData({});
          }
          setInitialDataLoaded(true);
        };
        loadProgress();
      },[module.id,user.id]);
      
      // Initialiser l'API SCORM seulement après le chargement des données
      useEffect(()=>{
        if(!initialDataLoaded)return;
        
        console.log('SCORM: Initializing API with saved data', savedCmiData);
        
        // Créer l'API SCORM 1.2
        const SCORM12_API={
          _initialized:false,
          _finished:false,
          _lastError:'0',
          _data:{
            'cmi.core.student_id':user.id,
            'cmi.core.student_name':user.email||'Apprenant',
            'cmi.core.lesson_status':savedCmiData?.['cmi.core.lesson_status']||'not attempted',
            'cmi.core.lesson_location':savedCmiData?.['cmi.core.lesson_location']||'',
            'cmi.core.score.raw':savedCmiData?.['cmi.core.score.raw']||'',
            'cmi.core.score.min':savedCmiData?.['cmi.core.score.min']||'0',
            'cmi.core.score.max':savedCmiData?.['cmi.core.score.max']||'100',
            'cmi.suspend_data':savedCmiData?.['cmi.suspend_data']||'',
            'cmi.core.session_time':'00:00:00',
            'cmi.core.total_time':savedCmiData?.['cmi.core.total_time']||'00:00:00',
            'cmi.core.entry':savedCmiData?.['cmi.suspend_data']?'resume':'',
            ...savedCmiData
          },
          
          LMSInitialize:function(param){
            console.log('SCORM 1.2: LMSInitialize');
            if(this._initialized){this._lastError='101';return 'false';}
            this._initialized=true;
            this._lastError='0';
            setLoading(false);
            return 'true';
          },
          
          LMSFinish:function(param){
            console.log('SCORM 1.2: LMSFinish');
            if(!this._initialized){this._lastError='301';return 'false';}
            this._finished=true;
            this.LMSCommit('');
            return 'true';
          },
          
          LMSGetValue:function(element){
            console.log('SCORM 1.2: LMSGetValue',element);
            if(!this._initialized){this._lastError='301';return '';}
            this._lastError='0';
            return this._data[element]||'';
          },
          
          LMSSetValue:function(element,value){
            console.log('SCORM 1.2: LMSSetValue',element,value);
            if(!this._initialized){this._lastError='301';return 'false';}
            this._data[element]=value;
            this._lastError='0';
            
            // Mettre à jour le statut
            if(element==='cmi.core.lesson_status'){
              setStatus(value);
            }
            if(element==='cmi.core.score.raw'){
              setScore(parseFloat(value)/100);
            }
            return 'true';
          },
          
          LMSCommit:function(param){
            console.log('SCORM 1.2: LMSCommit');
            // Sauvegarder dans Supabase
            const saveData=async()=>{
              try{
                const lessonStatus=SCORM12_API._data['cmi.core.lesson_status']||'not attempted';
                const scoreRaw=SCORM12_API._data['cmi.core.score.raw'];
                const scoreScaled=scoreRaw?parseFloat(scoreRaw)/100:null;
                const sessionTime=SCORM12_API._data['cmi.core.session_time']||null;
                const totalTime=SCORM12_API._data['cmi.core.total_time']||null;
                const location=SCORM12_API._data['cmi.core.lesson_location']||null;
                const suspendData=SCORM12_API._data['cmi.suspend_data']||null;
                
                console.log('SCORM Saving:', {moduleId:module.id, lessonStatus, scoreScaled, learnerId:user.id});
                
                // La contrainte unique est sur (module_id, learner_id)
                const{data:existing,error:selectError}=await supabase.from('scorm_progress')
                  .select('id')
                  .eq('module_id',module.id)
                  .eq('learner_id',user.id)
                  .maybeSingle();
                
                if(selectError){
                  console.error('SCORM Select Error:', selectError);
                }
                
                const payload={
                  module_id:module.id,
                  learner_id:user.id,
                  enrollment_id:enrollmentId,
                  completion_status:lessonStatus,
                  success_status:lessonStatus==='passed'?'passed':lessonStatus==='failed'?'failed':'unknown',
                  score_scaled:scoreScaled,
                  score_raw:scoreRaw?parseFloat(scoreRaw):null,
                  score_min:SCORM12_API._data['cmi.core.score.min']?parseFloat(SCORM12_API._data['cmi.core.score.min']):null,
                  score_max:SCORM12_API._data['cmi.core.score.max']?parseFloat(SCORM12_API._data['cmi.core.score.max']):null,
                  session_time:sessionTime,
                  total_time:totalTime,
                  location:location,
                  suspend_data:suspendData,
                  cmi_data:SCORM12_API._data,
                  last_accessed_at:new Date().toISOString()
                };
                
                let result;
                if(existing?.id){
                  console.log('SCORM: Updating existing record', existing.id);
                  result=await supabase.from('scorm_progress').update(payload).eq('id',existing.id);
                }else{
                  console.log('SCORM: Inserting new record');
                  result=await supabase.from('scorm_progress').insert(payload);
                }
                
                if(result.error){
                  console.error('SCORM Save Error:', result.error);
                }else{
                  console.log('SCORM Saved successfully');
                }
                
                if(lessonStatus==='completed'||lessonStatus==='passed'){
                  if(onComplete)onComplete();
                }
              }catch(err){
                console.error('SCORM Save Exception:', err);
              }
            };
            saveData();
            return 'true';
          },
          
          LMSGetLastError:function(){return this._lastError;},
          LMSGetErrorString:function(code){
            const errors={'0':'No Error','101':'General Exception','201':'Invalid argument error','301':'Not initialized','401':'Not implemented error'};
            return errors[code]||'Unknown Error';
          },
          LMSGetDiagnostic:function(code){return this.LMSGetErrorString(code);}
        };
        
        // Créer l'API SCORM 2004
        const SCORM2004_API={
          _initialized:false,
          _terminated:false,
          _lastError:'0',
          _data:{
            'cmi.learner_id':user.id,
            'cmi.learner_name':user.email||'Apprenant',
            'cmi.completion_status':savedCmiData?.['cmi.completion_status']||'not attempted',
            'cmi.success_status':savedCmiData?.['cmi.success_status']||'unknown',
            'cmi.location':savedCmiData?.['cmi.location']||'',
            'cmi.score.scaled':savedCmiData?.['cmi.score.scaled']||'',
            'cmi.score.raw':savedCmiData?.['cmi.score.raw']||'',
            'cmi.score.min':savedCmiData?.['cmi.score.min']||'0',
            'cmi.score.max':savedCmiData?.['cmi.score.max']||'100',
            'cmi.suspend_data':savedCmiData?.['cmi.suspend_data']||'',
            'cmi.session_time':'PT0H0M0S',
            'cmi.total_time':savedCmiData?.['cmi.total_time']||'PT0H0M0S',
            'cmi.entry':savedCmiData?.['cmi.suspend_data']?'resume':'ab-initio',
            ...savedCmiData
          },
          
          Initialize:function(param){
            console.log('SCORM 2004: Initialize');
            if(this._initialized){this._lastError='103';return 'false';}
            this._initialized=true;
            this._lastError='0';
            setLoading(false);
            return 'true';
          },
          
          Terminate:function(param){
            console.log('SCORM 2004: Terminate');
            if(!this._initialized||this._terminated){this._lastError='113';return 'false';}
            this._terminated=true;
            this.Commit('');
            return 'true';
          },
          
          GetValue:function(element){
            console.log('SCORM 2004: GetValue',element);
            if(!this._initialized){this._lastError='122';return '';}
            this._lastError='0';
            return this._data[element]||'';
          },
          
          SetValue:function(element,value){
            console.log('SCORM 2004: SetValue',element,value);
            if(!this._initialized){this._lastError='132';return 'false';}
            this._data[element]=value;
            this._lastError='0';
            
            if(element==='cmi.completion_status'){setStatus(value);}
            if(element==='cmi.score.scaled'){setScore(parseFloat(value));}
            return 'true';
          },
          
          Commit:function(param){
            console.log('SCORM 2004: Commit');
            const saveData=async()=>{
              try{
                const completionStatus=SCORM2004_API._data['cmi.completion_status']||'unknown';
                const successStatus=SCORM2004_API._data['cmi.success_status']||'unknown';
                const scoreScaled=SCORM2004_API._data['cmi.score.scaled']?parseFloat(SCORM2004_API._data['cmi.score.scaled']):null;
                const scoreRaw=SCORM2004_API._data['cmi.score.raw'];
                const sessionTime=SCORM2004_API._data['cmi.session_time']||null;
                const totalTime=SCORM2004_API._data['cmi.total_time']||null;
                const location=SCORM2004_API._data['cmi.location']||null;
                const suspendData=SCORM2004_API._data['cmi.suspend_data']||null;
                
                console.log('SCORM 2004 Saving:', {moduleId:module.id, completionStatus, scoreScaled, learnerId:user.id});
                
                // La contrainte unique est sur (module_id, learner_id)
                const{data:existing,error:selectError}=await supabase.from('scorm_progress')
                  .select('id')
                  .eq('module_id',module.id)
                  .eq('learner_id',user.id)
                  .maybeSingle();
                
                if(selectError){
                  console.error('SCORM 2004 Select Error:', selectError);
                }
                
                const payload={
                  module_id:module.id,
                  learner_id:user.id,
                  enrollment_id:enrollmentId,
                  completion_status:completionStatus,
                  success_status:successStatus,
                  score_scaled:scoreScaled,
                  score_raw:scoreRaw?parseFloat(scoreRaw):null,
                  score_min:SCORM2004_API._data['cmi.score.min']?parseFloat(SCORM2004_API._data['cmi.score.min']):null,
                  score_max:SCORM2004_API._data['cmi.score.max']?parseFloat(SCORM2004_API._data['cmi.score.max']):null,
                  session_time:sessionTime,
                  total_time:totalTime,
                  location:location,
                  suspend_data:suspendData,
                  cmi_data:SCORM2004_API._data,
                  last_accessed_at:new Date().toISOString()
                };
                
                let result;
                if(existing?.id){
                  console.log('SCORM 2004: Updating existing record', existing.id);
                  result=await supabase.from('scorm_progress').update(payload).eq('id',existing.id);
                }else{
                  console.log('SCORM 2004: Inserting new record');
                  result=await supabase.from('scorm_progress').insert(payload);
                }
                
                if(result.error){
                  console.error('SCORM 2004 Save Error:', result.error);
                }else{
                  console.log('SCORM 2004 Saved successfully');
                }
                
                if(completionStatus==='completed'||successStatus==='passed'){
                  if(onComplete)onComplete();
                }
              }catch(err){
                console.error('SCORM 2004 Save Exception:', err);
              }
            };
            saveData();
            return 'true';
          },
          
          GetLastError:function(){return this._lastError;},
          GetErrorString:function(code){
            const errors={'0':'No Error','103':'Already Initialized','113':'Termination After Termination','122':'Retrieve Data Before Initialization','132':'Store Data Before Initialization'};
            return errors[code]||'Unknown Error';
          },
          GetDiagnostic:function(code){return this.GetErrorString(code);}
        };
        
        // Exposer les APIs globalement
        window.API=SCORM12_API;
        window.API_1484_11=SCORM2004_API;
        
        return()=>{
          // Cleanup
          delete window.API;
          delete window.API_1484_11;
        };
      },[module.id,enrollmentId,user.id,initialDataLoaded,savedCmiData,onComplete]);
      
      // L'URL du module SCORM via le loader hébergé sur GitHub Pages
      const scormUrl = useMemo(() => {
        if (!module.package_url) return null;
        
        // Le loader est hébergé sur le même domaine

      useEffect(()=>{
        if(selectedCourse){
          // Démarrer une nouvelle session
          const startTime=new Date();
          const sessionId=`session_${Date.now()}`;
          courseSessionRef.current={startTime,sessionId,enrollmentId:selectedCourse.id};
          console.log('⏱️ Course session started:', sessionId);
          
          // Créer la session en base
          supabase.from('course_sessions').insert({
            enrollment_id:selectedCourse.id,
            learner_id:user.id,
            started_at:startTime.toISOString()
          }).select().single().then(({data})=>{
            if(data)courseSessionRef.current.dbSessionId=data.id;
          });
          
          // Sauvegarder périodiquement (toutes les 30 secondes)
          const interval=setInterval(()=>{
            const elapsed=Math.floor((Date.now()-courseSessionRef.current.startTime)/1000);
            console.log('⏱️ Course time elapsed:', elapsed, 'seconds');
          },30000);
          
          return()=>{
            clearInterval(interval);
            // Fin de session
            const endTime=new Date();
            const duration=Math.floor((endTime-courseSessionRef.current.startTime)/1000);
            console.log('⏱️ Course session ended, duration:', duration, 'seconds');
            
            // Mettre à jour la session en base
            if(courseSessionRef.current.dbSessionId){
              supabase.from('course_sessions').update({
                ended_at:endTime.toISOString(),
                duration_seconds:duration
              }).eq('id',courseSessionRef.current.dbSessionId);
            }
            
            // Mettre à jour le temps total sur l'enrollment
            if(courseSessionRef.current.enrollmentId&&duration>0){
              supabase.from('enrollments').select('time_spent_seconds').eq('id',courseSessionRef.current.enrollmentId).single().then(({data})=>{
                const currentTime=data?.time_spent_seconds||0;
                supabase.from('enrollments').update({time_spent_seconds:currentTime+duration}).eq('id',courseSessionRef.current.enrollmentId);
              });
            }
          };
        }
      },[selectedCourse?.id,user.id]);

      const load=useCallback(async()=>{
        const{data}=await supabase.from('enrollments').select('*,playlists:playlist_id(*)').eq('learner_id',user.id);
