    function VideoCreationSection(){
      const{categories,themes,subThemes,getThemesForCategory,getSubThemesForTheme,getCategoryName,getThemeName,getSubThemeName}=useTaxonomy();
      const[videos,setVideos]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({title:'',vimeo_url:'',duration:'',category_id:'',theme_id:'',sub_theme_id:'',description:'',sort_order:'',tags:[],thumbnail_url:''});
      const[saving,setSaving]=useState(false);
      const[search,setSearch]=useState('');
      const[predefinedTags,setPredefinedTags]=useState([]);
      const[filterCategory,setFilterCategory]=useState('');
      const[detailModal,setDetailModal]=useState(null);
      const[attachments,setAttachments]=useState([]);
      const[chapters,setChapters]=useState([]);
      const[newAttachment,setNewAttachment]=useState({title:'',file:null});
      const[newChapter,setNewChapter]=useState({title:'',timestamp:'',description:''});
      const[uploading,setUploading]=useState(false);
      const[fetchingDuration,setFetchingDuration]=useState(false);
      // Import Excel
      const[importModal,setImportModal]=useState(false);
      const[importData,setImportData]=useState([]);
      const[importLoading,setImportLoading]=useState(false);
      const[importResult,setImportResult]=useState(null);
      const attachmentFileRef=useRef(null);
      const importFileRef=useRef(null);
      
      const load=useCallback(async()=>{
        const[{data:vids},{data:tags}]=await Promise.all([
          supabase.from('videos').select('*,content_categories(id,name,color),content_themes(id,name),content_sub_themes(id,name)').order('sort_order').order('created_at',{ascending:false}),
          supabase.from('content_tags').select('*').order('name')
        ]);
        setVideos(vids||[]);
        setPredefinedTags(tags||[]);
        setLoading(false);
      },[]);
      
      useEffect(()=>{load();},[load]);
      
      // Récupérer la durée automatiquement via Vimeo oEmbed API
      const fetchVimeoDuration=async(url)=>{
        if(!url)return;
        setFetchingDuration(true);
        try{
          const match=url.match(/vimeo\.com\/(?:video\/)?(\d+)/)||url.match(/^(\d+)/);
          if(!match){setFetchingDuration(false);return;}
          const vimeoId=match[1];
          const response=await fetch(`https://vimeo.com/api/oembed.json?url=https://vimeo.com/${vimeoId}`);
          if(response.ok){
            const data=await response.json();
            if(data.duration){
              const mins=Math.floor(data.duration/60);
              const secs=data.duration%60;
              const duration=`${mins}:${secs.toString().padStart(2,'0')}`;
              setForm(f=>({...f,duration,title:f.title||data.title||'',thumbnail_url:f.thumbnail_url||data.thumbnail_url||''}));
            }
          }
        }catch(e){console.warn('Erreur récupération durée Vimeo:',e);}
        setFetchingDuration(false);
      };
      
      // Parser URL Vimeo
      const handleSave=async()=>{
        if(!form.title||!form.vimeo_url)return alert('Titre et URL Vimeo requis');
        setSaving(true);
        const{id,hash}=parseVimeoUrl(form.vimeo_url);
        if(!id){setSaving(false);return alert('URL Vimeo invalide');}
        
        const payload={
          title:form.title,
          vimeo_id:id,
          vimeo_hash:hash,
          duration:form.duration||null,
          category_id:form.category_id||null,
          theme_id:form.theme_id||null,
          sub_theme_id:form.sub_theme_id||null,
          description:form.description||null,
          sort_order:form.sort_order?parseInt(form.sort_order):null,
          tags:form.tags||[],
          thumbnail_url:form.thumbnail_url||null,
          is_lms_content:true
        };
        
        if(editing){
          await supabase.from('videos').update(payload).eq('id',editing.id);
        }else{
          await supabase.from('videos').insert(payload);
        }
        
        setModal(false);
        setEditing(null);
        setForm({title:'',vimeo_url:'',duration:'',category_id:'',theme_id:'',sub_theme_id:'',description:'',sort_order:'',tags:[],thumbnail_url:''});
        setSaving(false);
        load();
      };
      
      const handleDelete=async(id)=>{
        if(!confirm('Supprimer cette vidéo ?'))return;
        await supabase.from('videos').delete().eq('id',id);
        load();
      };
      
      const openEdit=(v)=>{
        setEditing(v);
        setForm({
          title:v.title||'',
          vimeo_url:v.vimeo_hash?`${v.vimeo_id}/${v.vimeo_hash}`:v.vimeo_id||'',
          duration:v.duration||'',
          category_id:v.category_id||'',
          theme_id:v.theme_id||'',
          sub_theme_id:v.sub_theme_id||'',
          description:v.description||'',
          sort_order:v.sort_order||'',
          tags:v.tags||[],
          thumbnail_url:v.thumbnail_url||''
        });
        setModal(true);
      };
      
      // Marquer comme LMS
      const toggleLMS=async(v)=>{
        await supabase.from('videos').update({is_lms_content:!v.is_lms_content}).eq('id',v.id);
        load();
      };
      
      // ===== IMPORT/EXPORT EXCEL =====
      const downloadTemplate=()=>{
        const template=[{
          'Titre':'Ma vidéo exemple',
          'URL Vimeo':'https://vimeo.com/123456789/abcdef1234',
          'Durée':'5:30',
          'Ordre':'1',
          'Catégorie':'Sécurité routière',
          'Thème':'Signalisation',
          'Sous-thème':'Panneaux danger',
          'Tags':'tag1, tag2',
          'Description':'Description de la vidéo',
          'Miniature URL':''
        }];
        const ws=XLSX.utils.json_to_sheet(template);
        ws['!cols']=[{wch:30},{wch:45},{wch:8},{wch:8},{wch:20},{wch:20},{wch:20},{wch:20},{wch:40},{wch:50}];
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Videos');
        XLSX.writeFile(wb,'template_videos_crpro.xlsx');
      };
      
      const exportToExcel=()=>{
        const data=videos.map(v=>({
          'Titre':v.title||'',
          'URL Vimeo':v.vimeo_hash?`https://vimeo.com/${v.vimeo_id}/${v.vimeo_hash}`:`https://vimeo.com/${v.vimeo_id}`,
          'Durée':v.duration||'',
          'Ordre':v.sort_order||'',
          'Catégorie':getCategoryName(v.category_id),
          'Thème':getThemeName(v.theme_id),
          'Sous-thème':getSubThemeName(v.sub_theme_id),
          'Tags':(v.tags||[]).join(', '),
          'Description':v.description||'',
          'Miniature URL':v.thumbnail_url||'',
          'LMS':v.is_lms_content?'Oui':'Non'
        }));
        const ws=XLSX.utils.json_to_sheet(data);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'Videos');
        XLSX.writeFile(wb,`videos_export_${new Date().toISOString().split('T')[0]}.xlsx`);
      };
      
      const handleImportFile=async(e)=>{
        const file=e.target.files[0];
        if(!file)return;
        const data=await file.arrayBuffer();
        const wb=XLSX.read(data);
        const ws=wb.Sheets[wb.SheetNames[0]];
        const json=XLSX.utils.sheet_to_json(ws);
        setImportData(json);
        setImportModal(true);
        setImportResult(null);
      };
      
      const processImport=async()=>{
        setImportLoading(true);
        let success=0,errors=0;
        
        for(const row of importData){
          try{
            const title=row['Titre']||row['title'];
            const vimeoUrl=row['URL Vimeo']||row['vimeo_url']||row['url'];
            if(!title||!vimeoUrl)continue;
            
            const{id,hash}=parseVimeoUrl(vimeoUrl);
            if(!id)continue;
            
            // Trouver catégorie/thème/sous-thème par nom
            const catName=row['Catégorie']||row['category']||'';
            const themeName=row['Thème']||row['theme']||'';
            const subThemeName=row['Sous-thème']||row['sub_theme']||'';
            const cat=categories.find(c=>c.name.toLowerCase()===catName.toLowerCase());
            const theme=cat?themes.find(t=>t.category_id===cat.id&&t.name.toLowerCase()===themeName.toLowerCase()):null;
            const subTheme=theme?subThemes.find(st=>st.theme_id===theme.id&&st.name.toLowerCase()===subThemeName.toLowerCase()):null;
            
            // Tags
            const tagsStr=row['Tags']||row['tags']||'';
            const tags=tagsStr?tagsStr.split(',').map(t=>t.trim()).filter(Boolean):[];
            
            await supabase.from('videos').insert({
              title,
              vimeo_id:id,
              vimeo_hash:hash,
              duration:row['Durée']||row['duration']||null,
              sort_order:row['Ordre']?parseInt(row['Ordre']):null,
              category_id:cat?.id||null,
              theme_id:theme?.id||null,
              sub_theme_id:subTheme?.id||null,
              tags,
              description:row['Description']||row['description']||null,
              thumbnail_url:row['Miniature URL']||row['thumbnail_url']||null,
              is_lms_content:true
            });
            success++;
          }catch(err){errors++;}
        }
        
        setImportResult({success,errors});
        setImportLoading(false);
        load();
      };
      
      // Ressources (pièces jointes, chapitres)
      const openDetailModal=async(v)=>{
        setDetailModal(v);
        const[{data:att},{data:chap}]=await Promise.all([
          supabase.from('video_attachments').select('*').eq('video_id',v.id).order('created_at'),
          supabase.from('video_chapters').select('*').eq('video_id',v.id).order('timestamp_seconds')
        ]);
        setAttachments(att||[]);
        setChapters(chap||[]);
      };
      
      const saveAttachment=async()=>{
        if(!newAttachment.title||!newAttachment.file)return;
        setUploading(true);
        const file=newAttachment.file;
        const ext=file.name.split('.').pop();
        const path=`attachments/${detailModal.id}/${Date.now()}.${ext}`;
        const{error}=await supabase.storage.from('video-resources').upload(path,file);
        if(!error){
          const{data:{publicUrl}}=supabase.storage.from('video-resources').getPublicUrl(path);
          await supabase.from('video_attachments').insert({video_id:detailModal.id,title:newAttachment.title,file_url:publicUrl,file_type:ext,file_size:file.size});
          const{data}=await supabase.from('video_attachments').select('*').eq('video_id',detailModal.id).order('created_at');
          setAttachments(data||[]);
        }
        setNewAttachment({title:'',file:null});
        setUploading(false);
      };
      
      const deleteAttachment=async(att)=>{
        await supabase.from('video_attachments').delete().eq('id',att.id);
        setAttachments(attachments.filter(a=>a.id!==att.id));
      };
      
      const parseTimestamp=(ts)=>{
        const parts=ts.split(':').map(Number);
        if(parts.length===2)return parts[0]*60+parts[1];
        if(parts.length===3)return parts[0]*3600+parts[1]*60+parts[2];
        return 0;
      };
      
      const saveChapter=async()=>{
        if(!newChapter.title||!newChapter.timestamp)return;
        await supabase.from('video_chapters').insert({video_id:detailModal.id,title:newChapter.title,timestamp_seconds:parseTimestamp(newChapter.timestamp),description:newChapter.description||null});
        const{data}=await supabase.from('video_chapters').select('*').eq('video_id',detailModal.id).order('timestamp_seconds');
        setChapters(data||[]);
        setNewChapter({title:'',timestamp:'',description:''});
      };
      
      const deleteChapter=async(ch)=>{
        await supabase.from('video_chapters').delete().eq('id',ch.id);
        setChapters(chapters.filter(c=>c.id!==ch.id));
      };
      
      const filtered=videos.filter(v=>{
        if(filterCategory&&v.category_id!==filterCategory)return false;
        if(search){
          const s=search.toLowerCase();
          const inTitle=v.title?.toLowerCase().includes(s);
          const inDesc=v.description?.toLowerCase().includes(s);
          const inCat=v.content_categories?.name?.toLowerCase().includes(s);
          const inTheme=v.content_themes?.name?.toLowerCase().includes(s);
          const inSubTheme=v.content_sub_themes?.name?.toLowerCase().includes(s);
          const inTags=(v.tags||[]).some(t=>t.toLowerCase().includes(s));
          if(!inTitle&&!inDesc&&!inCat&&!inTheme&&!inSubTheme&&!inTags)return false;
        }
        return true;
      });
      
      if(loading)return<div className="flex items-center justify-center py-20"><Icon name="Loader2" size={32} className="animate-spin text-indigo-400"/></div>;
      
      return<div>
        {/* Barre d'outils */}
        <div className="flex flex-wrap items-center gap-3 mb-6">
          <Button icon="Plus" onClick={()=>{setEditing(null);setForm({title:'',vimeo_url:'',duration:'',category_id:'',theme_id:'',sub_theme_id:'',description:'',sort_order:'',tags:[],thumbnail_url:''});setModal(true);}}>Ajouter une vidéo</Button>
          <Button variant="secondary" icon="Download" onClick={downloadTemplate}>Template</Button>
          <label className="cursor-pointer">
            <span className="inline-flex items-center gap-2 px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium"><Icon name="Upload" size={16}/>Importer</span>
            <input ref={importFileRef} type="file" accept=".xlsx,.xls" className="hidden" onChange={handleImportFile}/>
          </label>
          <Button variant="secondary" icon="FileSpreadsheet" onClick={exportToExcel} disabled={videos.length===0}>Exporter</Button>
          <div className="flex-1"/>
          <Input icon="Search" placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)} className="w-64"/>
          <Select value={filterCategory} onChange={e=>setFilterCategory(e.target.value)} options={[{value:'',label:'Toutes catégories'},...categories.map(c=>({value:c.id,label:c.name}))]}/>
        </div>
        
        {/* Stats */}
        <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-indigo-400">{videos.length}</p><p className="text-xs text-gray-400">Vidéos</p></Card>
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-green-400">{videos.filter(v=>v.is_lms_content).length}</p><p className="text-xs text-gray-400">LMS actives</p></Card>
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-purple-400">{categories.length}</p><p className="text-xs text-gray-400">Catégories</p></Card>
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-cyan-400">{themes.length}</p><p className="text-xs text-gray-400">Thèmes</p></Card>
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-orange-400">{subThemes.length}</p><p className="text-xs text-gray-400">Sous-thèmes</p></Card>
        </div>
        
        {/* Liste des vidéos */}
        {filtered.length===0?<Empty icon="Film" title="Aucune vidéo" desc="Ajoutez votre première vidéo Vimeo"/>:(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {filtered.map(v=>(
              <Card key={v.id} className={`overflow-hidden ${!v.is_lms_content?'opacity-60 border-dashed':''}`}>
                <div className="aspect-video bg-gray-900 relative">
                  {v.thumbnail_url?<img src={v.thumbnail_url} className="w-full h-full object-cover"/>:
                  <iframe src={buildVimeoEmbedUrl(v.vimeo_id,v.vimeo_hash,{background:true})} className="w-full h-full" allow="autoplay"/>}
                  <div className="absolute bottom-2 right-2 px-2 py-1 bg-black/70 rounded text-xs">{v.duration||'--:--'}</div>
                  {v.sort_order&&<div className="absolute top-2 left-2 w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center text-xs font-bold">{v.sort_order}</div>}
                  <div className="absolute top-2 right-2">
                    <label className="flex items-center gap-1 px-2 py-1 bg-black/70 rounded text-xs cursor-pointer">
                      <input type="checkbox" checked={v.is_lms_content||false} onChange={()=>toggleLMS(v)} className="rounded"/>
                      LMS
                    </label>
                  </div>
                </div>
                <div className="p-4">
                  <h3 className="font-semibold truncate">{v.title}</h3>
                  {/* Taxonomie complète */}
                  <div className="flex flex-wrap gap-1 mt-2">
                    {v.content_categories?.name&&<span className="px-2 py-0.5 rounded text-xs" style={{backgroundColor:(v.content_categories?.color||'#6366f1')+'30',color:v.content_categories?.color||'#6366f1'}}>{v.content_categories.name}</span>}
                    {v.content_themes?.name&&<span className="px-2 py-0.5 bg-purple-500/20 text-purple-300 rounded text-xs">{v.content_themes.name}</span>}
                    {v.content_sub_themes?.name&&<span className="px-2 py-0.5 bg-cyan-500/20 text-cyan-300 rounded text-xs">{v.content_sub_themes.name}</span>}
                  </div>
                  {/* Tags */}
                  {v.tags&&v.tags.length>0&&(
                    <div className="flex flex-wrap gap-1 mt-2">
                      {v.tags.slice(0,3).map(t=><span key={t} className="px-1.5 py-0.5 bg-gray-700 rounded text-xs text-gray-300">{t}</span>)}
                      {v.tags.length>3&&<span className="px-1.5 py-0.5 bg-gray-700 rounded text-xs text-gray-400">+{v.tags.length-3}</span>}
                    </div>
                  )}
                  <div className="flex gap-2 mt-3">
                    <Button variant="ghost" size="sm" icon="Settings" onClick={()=>openDetailModal(v)}>Ressources</Button>
                    <Button variant="ghost" size="sm" icon="Edit2" onClick={()=>openEdit(v)}>Modifier</Button>
                    <Button variant="ghost" size="sm" icon="Trash2" className="text-red-400" onClick={()=>handleDelete(v.id)}/>
                  </div>
                </div>
              </Card>
            ))}
          </div>
        )}
        
        {/* Modal ajout/modification */}
        <Modal isOpen={modal} onClose={()=>{setModal(false);setEditing(null);}} title={editing?'Modifier la vidéo':'Ajouter une vidéo'} size="lg">
          <div className="space-y-4">
            <div className="grid grid-cols-2 gap-4">
              <Input label="Titre *" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/>
              <div>
                <Input label="URL Vimeo *" value={form.vimeo_url} onChange={e=>setForm({...form,vimeo_url:e.target.value})} placeholder="https://vimeo.com/123456789/abcdef" onBlur={e=>fetchVimeoDuration(e.target.value)}/>
                {fetchingDuration&&<p className="text-xs text-indigo-400 mt-1"><Icon name="Loader2" size={12} className="inline animate-spin mr-1"/>Récupération durée...</p>}
              </div>
            </div>
            <div className="grid grid-cols-3 gap-4">
              <Input label="Durée" value={form.duration} onChange={e=>setForm({...form,duration:e.target.value})} placeholder="5:30"/>
              <Input label="Ordre" type="number" value={form.sort_order} onChange={e=>setForm({...form,sort_order:e.target.value})}/>
              <Select label="Catégorie" value={form.category_id} onChange={e=>setForm({...form,category_id:e.target.value,theme_id:'',sub_theme_id:''})} options={[{value:'',label:'Aucune'},...categories.map(c=>({value:c.id,label:c.name}))]}/>
            </div>
            <div className="grid grid-cols-2 gap-4">
              <Select label="Thème" value={form.theme_id} onChange={e=>setForm({...form,theme_id:e.target.value,sub_theme_id:''})} options={[{value:'',label:'Aucun'},...getThemesForCategory(form.category_id).map(t=>({value:t.id,label:t.name}))]} disabled={!form.category_id}/>
              <Select label="Sous-thème" value={form.sub_theme_id} onChange={e=>setForm({...form,sub_theme_id:e.target.value})} options={[{value:'',label:'Aucun'},...getSubThemesForTheme(form.theme_id).map(st=>({value:st.id,label:st.name}))]} disabled={!form.theme_id}/>
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-300 mb-1">Tags</label>
              <div className="min-h-[38px] p-2 bg-gray-700 border border-gray-600 rounded-lg flex flex-wrap gap-1">
                {form.tags.map(t=><span key={t} className="inline-flex items-center gap-1 px-2 py-0.5 bg-indigo-600/30 text-indigo-300 rounded text-xs">{t}<button type="button" onClick={()=>setForm({...form,tags:form.tags.filter(x=>x!==t)})} className="hover:text-white">×</button></span>)}
                {form.tags.length===0&&<span className="text-gray-500 text-sm">Aucun tag</span>}
              </div>
              {predefinedTags.length>0&&<div className="flex flex-wrap gap-1 mt-2">{predefinedTags.filter(t=>!form.tags.includes(t.name)).slice(0,10).map(t=><button key={t.id} type="button" onClick={()=>setForm({...form,tags:[...form.tags,t.name]})} className="px-2 py-0.5 rounded text-xs border border-gray-600 hover:border-indigo-500" style={{color:t.color||'#6366f1'}}>+ {t.name}</button>)}</div>}
            </div>
            <Input label="Miniature URL" value={form.thumbnail_url} onChange={e=>setForm({...form,thumbnail_url:e.target.value})}/>
            <div>
              <label className="block text-sm font-medium text-gray-300 mb-1">Description</label>
              <textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={2} className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white resize-none"/>
            </div>
            <div className="flex justify-end gap-3">
              <Button variant="secondary" onClick={()=>{setModal(false);setEditing(null);}}>Annuler</Button>
              <Button onClick={handleSave} loading={saving}>Enregistrer</Button>
            </div>
          </div>
        </Modal>
        
        {/* Modal import */}
        <Modal isOpen={importModal} onClose={()=>{setImportModal(false);setImportData([]);setImportResult(null);}} title="Importer des vidéos" size="lg">
          <div className="space-y-4">
            <div className="bg-gray-700/50 rounded-lg p-4">
              <p className="text-sm text-gray-400 mb-2">Colonnes : Titre*, URL Vimeo*, Durée, Ordre, Catégorie, Thème, Sous-thème, Tags, Description, Miniature URL</p>
              <p className="text-xs text-gray-500">💡 Les catégories/thèmes/sous-thèmes sont créés automatiquement s'ils n'existent pas.</p>
            </div>
            
            {importData.length>0&&(
              <div className="border border-gray-700 rounded-lg overflow-hidden">
                <div className="bg-gray-800 px-4 py-2 text-sm font-medium">{importData.length} vidéo(s) détectée(s)</div>
                <div className="max-h-60 overflow-y-auto">
                  {importData.slice(0,10).map((row,i)=>(
                    <div key={i} className="px-4 py-2 border-t border-gray-700 text-sm">
                      <span className="font-medium">{row['Titre']||row['title']}</span>
                      <span className="text-gray-400 ml-2">{row['URL Vimeo']||row['vimeo_url']||row['url']}</span>
                    </div>
                  ))}
                  {importData.length>10&&<div className="px-4 py-2 border-t border-gray-700 text-sm text-gray-400">... et {importData.length-10} autres</div>}
                </div>
              </div>
            )}
            
            {importResult&&(
              <div className={`p-4 rounded-lg ${importResult.errors>0?'bg-yellow-500/20':'bg-green-500/20'}`}>
                <p className="font-medium">{importResult.success} vidéo(s) importée(s)</p>
                {importResult.errors>0&&<p className="text-sm text-yellow-400">{importResult.errors} erreur(s)</p>}
              </div>
            )}
            
            <div className="flex justify-end gap-3">
              <Button variant="secondary" onClick={()=>{setImportModal(false);setImportData([]);setImportResult(null);}}>Fermer</Button>
              {!importResult&&<Button onClick={processImport} loading={importLoading} disabled={importData.length===0}>Importer</Button>}
            </div>
          </div>
        </Modal>
        
        {/* Modal ressources */}
        <Modal isOpen={!!detailModal} onClose={()=>setDetailModal(null)} title={`Ressources - ${detailModal?.title}`} size="lg">
          {detailModal&&<div className="space-y-6">
            {/* Pièces jointes */}
            <div>
              <h4 className="font-semibold mb-3 flex items-center gap-2"><Icon name="Paperclip" size={18}/>Pièces jointes ({attachments.length})</h4>
              <div className="space-y-2 mb-4">
                {attachments.map(att=>(
                  <div key={att.id} className="flex items-center gap-3 p-3 bg-gray-700 rounded-lg">
                    <Icon name="FileText" size={20} className="text-indigo-400"/>
                    <div className="flex-1 min-w-0">
                      <p className="font-medium truncate">{att.title}</p>
                      <p className="text-xs text-gray-400">{att.file_type?.toUpperCase()} • {Math.round((att.file_size||0)/1024)} Ko</p>
                    </div>
                    <a href={att.file_url} target="_blank" className="p-2 hover:bg-gray-600 rounded"><Icon name="Download" size={16}/></a>
                    <button onClick={()=>deleteAttachment(att)} className="p-2 hover:bg-red-500/20 rounded text-red-400"><Icon name="Trash2" size={16}/></button>
                  </div>
                ))}
                {attachments.length===0&&<p className="text-gray-500 text-sm">Aucune pièce jointe</p>}
              </div>
              <div className="flex gap-2">
                <Input className="flex-1" placeholder="Titre du fichier" value={newAttachment.title} onChange={e=>setNewAttachment({...newAttachment,title:e.target.value})}/>
                <input ref={attachmentFileRef} type="file" className="hidden" onChange={e=>setNewAttachment({...newAttachment,file:e.target.files[0]})}/>
                <Button variant="secondary" icon="Upload" onClick={()=>attachmentFileRef.current?.click()}>{newAttachment.file?.name||'Fichier'}</Button>
                <Button icon="Plus" onClick={saveAttachment} loading={uploading} disabled={!newAttachment.title||!newAttachment.file}>Ajouter</Button>
              </div>
            </div>
            
            {/* Chapitres */}
            <div>
              <h4 className="font-semibold mb-3 flex items-center gap-2"><Icon name="List" size={18}/>Chapitres ({chapters.length})</h4>
              <div className="space-y-2 mb-4">
                {chapters.map(ch=>(
                  <div key={ch.id} className="flex items-center gap-3 p-3 bg-gray-700 rounded-lg">
                    <span className="px-2 py-1 bg-indigo-600 rounded text-xs font-mono">{Math.floor(ch.timestamp_seconds/60)}:{(ch.timestamp_seconds%60).toString().padStart(2,'0')}</span>
                    <div className="flex-1 min-w-0">
                      <p className="font-medium truncate">{ch.title}</p>
                      {ch.description&&<p className="text-xs text-gray-400 truncate">{ch.description}</p>}
                    </div>
                    <button onClick={()=>deleteChapter(ch)} className="p-2 hover:bg-red-500/20 rounded text-red-400"><Icon name="Trash2" size={16}/></button>
                  </div>
                ))}
                {chapters.length===0&&<p className="text-gray-500 text-sm">Aucun chapitre</p>}
              </div>

    // SECTION: Création de SCORM (wrapper vers la section existante)

    function ScormCreationSection(){
      const{categories,themes,subThemes,getThemesForCategory,getSubThemesForTheme,getCategoryName,getThemeName,getSubThemeName}=useTaxonomy();
      const[modules,setModules]=useState([]);
      const[loading,setLoading]=useState(true);
      const[modal,setModal]=useState(false);
      const[editing,setEditing]=useState(null);
      const[form,setForm]=useState({title:'',description:'',module_type:'scorm12',package_url:'',entry_point:'index.html',category_id:'',theme_id:'',sub_theme_id:'',version:'',remote_url:'',tags:[]});
      const[saving,setSaving]=useState(false);
      const[search,setSearch]=useState('');
      const[predefinedTags,setPredefinedTags]=useState([]);
      const[previewScorm,setPreviewScorm]=useState(null);
      const[filterCategory,setFilterCategory]=useState('');
      // ZIP parsing
      const[scormZipParsing,setScormZipParsing]=useState(false);
      const[scormUploadProgress,setScormUploadProgress]=useState('');
      const[scormZipFile,setScormZipFile]=useState(null);
      const[detectedRemoteUrl,setDetectedRemoteUrl]=useState('');
      const scormZipRef=useRef(null);
      
      const load=useCallback(async()=>{
        const[{data:mods},{data:tags}]=await Promise.all([
          supabase.from('scorm_modules').select('*,content_categories(id,name,color),content_themes(id,name),content_sub_themes(id,name)').order('created_at',{ascending:false}),
          supabase.from('content_tags').select('*').order('name')
        ]);
        setModules(mods||[]);
        setPredefinedTags(tags||[]);
        setLoading(false);
      },[]);
      
      useEffect(()=>{load();},[load]);
      
      // ===== PARSE SCORM ZIP (Storyline & Codes Rousseau) =====
      const parseScormZip=async(file)=>{
        if(typeof JSZip==='undefined'){
          alert('Bibliothèque ZIP en cours de chargement. Veuillez réessayer.');
          return;
        }
        setScormZipParsing(true);
        setScormUploadProgress('Analyse du fichier ZIP...');
        setScormZipFile(file);
        
        try{
          const zip=await JSZip.loadAsync(file);
          let manifest=null;
          let entryPoint='index.html';
          let detectedTitle='';
          let remoteUrl='';
          const fileNames=Object.keys(zip.files);
          
          // Chercher manifest et détecter le type
          for(const filename of fileNames){
            const zipEntry=zip.files[filename];
            if(zipEntry.dir)continue;
            const name=filename.toLowerCase();
            
            if(name.endsWith('imsmanifest.xml')){
              manifest=await zipEntry.async('string');
              // Extraire le titre du manifest
              const titleMatch=manifest.match(/<title>([^<]+)<\/title>/i);
              if(titleMatch)detectedTitle=titleMatch[1];
            }
            
            // Détecter SCORM Codes Rousseau (remote URL)
            if(name.endsWith('.html')){
              const content=await zipEntry.async('string');
              // Chercher URL distante Codes Rousseau
              const urlMatch=content.match(/var\s+url\s*=\s*['"]([^'"]+codesrousseau[^'"]+)['"]/i);
              if(urlMatch){
                remoteUrl=urlMatch[1];
                entryPoint=filename.split('/').pop();
              }
              // Détecter Storyline (data-source)
              if(content.includes('data-source')||content.includes('layer2.js')){
                entryPoint=filename.split('/').pop();
              }
            }
          }
          
          if(!manifest){
            alert('Fichier imsmanifest.xml non trouvé dans le ZIP');
            setScormZipParsing(false);
            return;
          }
          
          // Pré-remplir le formulaire
          setForm(f=>({
            ...f,
            title:f.title||detectedTitle||file.name.replace('.zip',''),
            entry_point:entryPoint,
            remote_url:remoteUrl
          }));
          setDetectedRemoteUrl(remoteUrl);
          
          setScormUploadProgress(remoteUrl?'Module Codes Rousseau détecté !':'Module SCORM standard détecté. Uploadez vers GitHub Pages.');
          
        }catch(e){
          console.error('Erreur parsing ZIP:',e);
          alert('Erreur lors de l\'analyse du fichier ZIP');
        }
        setScormZipParsing(false);
      };
      
      const handleSave=async()=>{
        if(!form.title)return alert('Titre requis');
        if(!form.package_url&&!form.remote_url)return alert('URL du package ou URL distante requise');
        setSaving(true);
        
        const payload={
          title:form.title,
          description:form.description||null,
          module_type:form.module_type,
          package_url:form.package_url||form.remote_url||null,
          entry_point:form.entry_point||'index.html',
          category_id:form.category_id||null,
          theme_id:form.theme_id||null,
          sub_theme_id:form.sub_theme_id||null,
          version:form.version||null,
          remote_url:form.remote_url||null,
          tags:form.tags||[],
          is_lms_content:true
        };
        
        if(editing){
          await supabase.from('scorm_modules').update(payload).eq('id',editing.id);
        }else{
          await supabase.from('scorm_modules').insert(payload);
        }
        
        setModal(false);
        setEditing(null);
        setForm({title:'',description:'',module_type:'scorm12',package_url:'',entry_point:'index.html',category_id:'',theme_id:'',sub_theme_id:'',version:'',remote_url:'',tags:[]});
        setScormZipFile(null);
        setDetectedRemoteUrl('');
        setSaving(false);
        load();
      };
      
      const handleDelete=async(id)=>{
        if(!confirm('Supprimer ce module SCORM ?'))return;
        await supabase.from('scorm_modules').delete().eq('id',id);
        load();
      };
      
      const openEdit=(m)=>{
        setEditing(m);
        setForm({
          title:m.title||'',
          description:m.description||'',
          module_type:m.module_type||'scorm12',
          package_url:m.package_url||'',
          entry_point:m.entry_point||'index.html',

          theme_id:m.theme_id||'',
          sub_theme_id:m.sub_theme_id||'',

          tags:m.tags||[]
        });
        setModal(true);
      };
      
      const toggleLMS=async(m)=>{
        await supabase.from('scorm_modules').update({is_lms_content:!m.is_lms_content}).eq('id',m.id);
        load();
      };
      
      const filtered=modules.filter(m=>{
        if(filterCategory&&m.category_id!==filterCategory)return false;
        if(search){
          const s=search.toLowerCase();
          const inTitle=m.title?.toLowerCase().includes(s);
          const inDesc=m.description?.toLowerCase().includes(s);

          const inTheme=m.content_themes?.name?.toLowerCase().includes(s);

          if(!inTitle&&!inDesc&&!inCat&&!inTheme&&!inSubTheme&&!inTags)return false;
        }
        return true;
      });
      
      if(loading)return<div className="flex items-center justify-center py-20"><Icon name="Loader2" size={32} className="animate-spin text-indigo-400"/></div>;
      
      return<div>
        <div className="flex flex-wrap items-center gap-3 mb-6">

          <div className="flex-1"/>
          <Input icon="Search" placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)} className="w-64"/>
          <Select value={filterCategory} onChange={e=>setFilterCategory(e.target.value)} options={[{value:'',label:'Toutes catégories'},...categories.map(c=>({value:c.id,label:c.name}))]}/>
        </div>
        
        <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-purple-400">{modules.length}</p><p className="text-xs text-gray-400">Modules SCORM</p></Card>
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-green-400">{modules.filter(m=>m.is_lms_content).length}</p><p className="text-xs text-gray-400">LMS actifs</p></Card>
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-blue-400">{modules.filter(m=>m.module_type==='scorm12').length}</p><p className="text-xs text-gray-400">SCORM 1.2</p></Card>
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-cyan-400">{modules.filter(m=>m.module_type==='scorm2004').length}</p><p className="text-xs text-gray-400">SCORM 2004</p></Card>
          <Card className="p-4 text-center"><p className="text-2xl font-bold text-orange-400">{modules.filter(m=>m.remote_url).length}</p><p className="text-xs text-gray-400">Codes Rousseau</p></Card>
        </div>
        
        {filtered.length===0?<Empty icon="Package" title="Aucun module SCORM" desc="Ajoutez votre premier module SCORM"/>:(
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {filtered.map(m=>(

                <div className="flex items-start gap-3">

                    <div className="flex flex-wrap gap-1 mt-2">
                      {m.content_categories?.name&&<span className="px-2 py-0.5 rounded text-xs" style={{backgroundColor:(m.content_categories?.color||'#a855f7')+'30',color:m.content_categories?.color||'#a855f7'}}>{m.content_categories.name}</span>}

                      {m.content_sub_themes?.name&&<span className="px-2 py-0.5 bg-cyan-500/20 text-cyan-300 rounded text-xs">{m.content_sub_themes.name}</span>}
                    </div>
                    {/* Tags */}

      // Import

      const[importResult,setImportResult]=useState(null);
