<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCORM Loader</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f5f5f5; }
    #scorm-frame { width: 100%; height: 100%; border: none; display: block; }
    #loading { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; font-family: Arial, sans-serif; color: #666;
    }
    .spinner {
      width: 40px; height: 40px; margin: 0 auto 15px;
      border: 3px solid #e0e0e0; border-top-color: #3498db;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Chargement du module...</div>
  </div>
  
  <iframe id="scorm-frame" style="display:none;"></iframe>
  
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var scormUrl = params.get('url');
      var scormType = params.get('type') || 'standard';
      
      if (!scormUrl) {
        document.getElementById('loading-text').textContent = 'Erreur: URL manquante';
        return;
      }
      
      console.log('[SCORM Loader] Loading:', scormUrl);
      console.log('[SCORM Loader] Type:', scormType === 'cr' ? 'Codes Rousseau' : 'Standard (Articulate, etc.)');
      
      var frame = document.getElementById('scorm-frame');
      var loading = document.getElementById('loading');
      
      // ========== SCORM API Bridge via postMessage ==========
      // Get API from parent (CRPro)
      var parentAPI = null;
      var parentAPI_1484_11 = null;
      
      try {
        if (window.parent && window.parent.API) {
          parentAPI = window.parent.API;
          console.log('[SCORM Loader] Parent API found (SCORM 1.2)');
        }
        if (window.parent && window.parent.API_1484_11) {
          parentAPI_1484_11 = window.parent.API_1484_11;
          console.log('[SCORM Loader] Parent API found (SCORM 2004)');
        }
      } catch(e) {
        console.warn('[SCORM Loader] Cannot access parent API:', e);
      }
      
      // Also expose on this window for direct iframe access
      if (parentAPI) window.API = parentAPI;
      if (parentAPI_1484_11) window.API_1484_11 = parentAPI_1484_11;
      
      console.log('[SCORM Loader] Parent API found:', !!parentAPI, !!parentAPI_1484_11);
      
      // Listen for postMessage from cross-origin iframe (Worker)
      window.addEventListener('message', function(event) {
        // Security: only accept messages from our Worker
        if (!event.origin.includes('workers.dev')) {
          return;
        }
        
        var data = event.data;
        if (!data || !data.type || !data.type.startsWith('SCORM_')) {
          return;
        }
        
        console.log('[SCORM Bridge] Received:', data.type, data.method);
        
        var result = '';
        var api = null;
        
        // Determine which API to use
        if (data.type === 'SCORM_12_CALL' && parentAPI) {
          api = parentAPI;
        } else if (data.type === 'SCORM_2004_CALL' && parentAPI_1484_11) {
          api = parentAPI_1484_11;
        }
        
        if (api && typeof api[data.method] === 'function') {
          try {
            if (data.args && data.args.length > 0) {
              result = api[data.method].apply(api, data.args);
            } else {
              result = api[data.method]();
            }
            console.log('[SCORM Bridge] Result:', data.method, '->', result);
          } catch(e) {
            console.error('[SCORM Bridge] Error calling', data.method, e);
            result = '';
          }
        } else {
          console.warn('[SCORM Bridge] API or method not found:', data.type, data.method);
        }
        
        // Send response back to iframe
        if (event.source) {
          event.source.postMessage({
            type: data.type + '_RESPONSE',
            id: data.id,
            result: result
          }, '*');
        }
      });
      
      // ========== Load Content ==========
      
      function showContent() {
        loading.style.display = 'none';
        frame.style.display = 'block';
      }
      
      frame.onload = function() {
        console.log('[SCORM Loader] Frame loaded');
        showContent();
        
        // Notify parent that content is ready
        try {
          if (window.parent && window.parent.postMessage) {
            window.parent.postMessage({ type: 'SCORM_CONTENT_READY' }, '*');
          }
        } catch(e) {}
      };
      
      // Codes Rousseau: direct loading (same bucket, works fine)
      if (scormType === 'cr') {
        console.log('[SCORM Loader] Mode CR: Direct loading');
        frame.src = scormUrl;
        return;
      }
      
      // Standard SCORM (Articulate, etc.): use Cloudflare Workers Proxy
      console.log('[SCORM Loader] Mode Standard: Cloudflare Workers Proxy');
      
      // Determine mode: preview (no recording) or course (with recording)
      var scormMode = params.get('mode') || 'preview'; // 'preview' or 'course'
      console.log('[SCORM Loader] SCORM Mode:', scormMode);
      
      var proxyBaseUrl = 'https://scorm-proxy.jean-marc-bitaud.workers.dev';
      var proxyUrl = proxyBaseUrl + '?url=' + encodeURIComponent(scormUrl) + '&mode=' + scormMode;
      
      console.log('[SCORM Loader] Proxy URL:', proxyUrl);
      
      frame.src = proxyUrl;
      
    })();
  </script>
</body>
</html>
