<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCORM Loader - CRPro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    iframe { width: 100%; height: 100%; border: none; }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #a5b4fc;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #374151;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Chargement du module...</div>
  </div>
  
  <iframe id="scorm-frame" style="display:none;" allow="fullscreen"></iframe>
  
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const scormUrl = params.get('url');
      
      if (!scormUrl) {
        document.getElementById('loading').innerHTML = '<div style="color:#f87171;">Erreur: URL non spécifiée</div>';
        return;
      }
      
      console.log('[SCORM Loader] Loading:', scormUrl);
      
      // ========================================
      // EXPOSER window.API comme proxy vers le parent
      // Pour les SCORM Codes Rousseau (layer2.js)
      // ========================================
      
      // Vérifier si le parent a une API SCORM
      var parentAPI = null;
      var parentAPI2004 = null;
      try {
        parentAPI = window.parent.API;
        parentAPI2004 = window.parent.API_1484_11;
        console.log('[SCORM Loader] Parent API found:', !!parentAPI, !!parentAPI2004);
      } catch (e) {
        console.warn('[SCORM Loader] Cannot access parent API (cross-origin?)');
      }
      
      // Créer des proxies vers l'API parente
      if (parentAPI) {
        window.API = {
          LMSInitialize: function(p) { return parentAPI.LMSInitialize(p); },
          LMSFinish: function(p) { return parentAPI.LMSFinish(p); },
          LMSGetValue: function(e) { return parentAPI.LMSGetValue(e); },
          LMSSetValue: function(e, v) { return parentAPI.LMSSetValue(e, v); },
          LMSCommit: function(p) { return parentAPI.LMSCommit(p); },
          LMSGetLastError: function() { return parentAPI.LMSGetLastError(); },
          LMSGetErrorString: function(c) { return parentAPI.LMSGetErrorString(c); },
          LMSGetDiagnostic: function(c) { return parentAPI.LMSGetDiagnostic(c); }
        };
        console.log('[SCORM Loader] window.API proxy created');
      }
      
      if (parentAPI2004) {
        window.API_1484_11 = {
          Initialize: function(p) { return parentAPI2004.Initialize(p); },
          Terminate: function(p) { return parentAPI2004.Terminate(p); },
          GetValue: function(e) { return parentAPI2004.GetValue(e); },
          SetValue: function(e, v) { return parentAPI2004.SetValue(e, v); },
          Commit: function(p) { return parentAPI2004.Commit(p); },
          GetLastError: function() { return parentAPI2004.GetLastError(); },
          GetErrorString: function(c) { return parentAPI2004.GetErrorString(c); },
          GetDiagnostic: function(c) { return parentAPI2004.GetDiagnostic(c); }
        };
        console.log('[SCORM Loader] window.API_1484_11 proxy created');
      }
      
      // ========================================
      // RELAYER les messages postMessage
      // Pour les SCORM Articulate (avec bridge injecté)
      // ========================================
      
      window.addEventListener('message', function(event) {
        var data = event.data;
        if (!data || !data.type) return;
        
        var frame = document.getElementById('scorm-frame');
        
        // Messages venant de l'iframe SCORM -> relayer vers le parent (CRPro)
        if (data.type === 'scorm_api_call' || data.type === 'scorm_content_ready') {
          console.log('[SCORM Loader] Relaying to parent:', data.type, data.method);
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(data, '*');
          }
        }
        
        // Réponses venant du parent (CRPro) -> relayer vers l'iframe SCORM
        if (data.type === 'scorm_api_response') {
          console.log('[SCORM Loader] Relaying to iframe:', data.type, data.callId);
          if (frame && frame.contentWindow) {
            frame.contentWindow.postMessage(data, '*');
          }
        }
      });
      
      // ========================================
      // CHARGER le contenu SCORM dans l'iframe
      // ========================================
      
      var frame = document.getElementById('scorm-frame');
      
      frame.onload = function() {
        console.log('[SCORM Loader] Frame loaded');
        document.getElementById('loading').style.display = 'none';
        frame.style.display = 'block';
        
        // Notifier le parent que le contenu est prêt
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'scorm_content_ready' }, '*');
        }
      };
      
      frame.onerror = function(e) {
        console.error('[SCORM Loader] Frame error:', e);
        document.getElementById('loading').innerHTML = '<div style="color:#f87171;">Erreur de chargement</div>';
      };
      
      frame.src = scormUrl;
      
    })();
  </script>
</body>
</html>
