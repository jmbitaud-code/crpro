<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCORM Loader</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, iframe { width: 100%; height: 100%; border: none; overflow: hidden; }
  </style>
</head>
<body>
  <script>
    // Récupérer les paramètres de l'URL
    const params = new URLSearchParams(window.location.search);
    const scormUrl = params.get('url');
    const lmsOrigin = params.get('lms_origin') || window.location.origin;
    
    if (!scormUrl) {
      document.body.innerHTML = '<h1 style="color:red;padding:20px;">Erreur: URL SCORM manquante</h1>';
    } else {
      // Définir lms_origin globalement
      window.lms_origin = lmsOrigin;
      window.LMS_ORIGIN = lmsOrigin;
      
      // Charger le contenu SCORM et l'injecter
      fetch(scormUrl)
        .then(r => r.text())
        .then(html => {
          // Injecter lms_origin dans le HTML
          const scriptTag = '<script>window.lms_origin="' + lmsOrigin + '";window.LMS_ORIGIN="' + lmsOrigin + '";<\/script>';
          
          // Modifier l'URL de layer2.js pour inclure lms_origin
          html = html.replace(
            /layer2\.js\?cacherev=/g,
            'layer2.js?lms_origin=' + encodeURIComponent(lmsOrigin) + '&cacherev='
          );
          
          // Modifier data-clientid
          html = html.replace('data-clientid=""', 'data-clientid="' + lmsOrigin + '"');
          
          // Injecter le script après <head>
          html = html.replace('<head>', '<head>' + scriptTag);
          
          // Écrire le HTML modifié dans le document
          document.open();
          document.write(html);
          document.close();
        })
        .catch(err => {
          document.body.innerHTML = '<h1 style="color:red;padding:20px;">Erreur: ' + err.message + '</h1>';
        });
    }
  </script>
</body>
</html>
