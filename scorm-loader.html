<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCORM Loader - CRPro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    iframe { width: 100%; height: 100%; border: none; }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #a5b4fc;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #374151;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Chargement du module...</div>
  </div>
  
  <iframe id="scorm-frame" style="display:none;"></iframe>
  
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var scormUrl = params.get('url');
      var scormType = params.get('type') || 'standard'; // 'cr' pour Codes Rousseau, 'standard' pour les autres
      
      if (!scormUrl) {
        document.getElementById('loading').innerHTML = '<div class="error">Erreur: URL non spécifiée</div>';
        return;
      }
      
      console.log('[SCORM Loader] Loading:', scormUrl);
      console.log('[SCORM Loader] Type:', scormType === 'cr' ? 'Codes Rousseau' : 'Standard (Articulate, etc.)');
      
      // Extraire l'URL de base pour les ressources relatives
      var baseUrl = scormUrl.substring(0, scormUrl.lastIndexOf('/') + 1);
      
      // ========================================
      // CRÉER LES PROXIES API vers le parent
      // ========================================
      var parentAPI = null;
      var parentAPI2004 = null;
      try {
        parentAPI = window.parent.API;
        parentAPI2004 = window.parent.API_1484_11;
        console.log('[SCORM Loader] Parent API found:', !!parentAPI, !!parentAPI2004);
      } catch (e) {
        console.warn('[SCORM Loader] Cannot access parent API');
      }
      
      if (parentAPI) {
        window.API = {
          LMSInitialize: function(p) { return parentAPI.LMSInitialize(p); },
          LMSFinish: function(p) { return parentAPI.LMSFinish(p); },
          LMSGetValue: function(e) { return parentAPI.LMSGetValue(e); },
          LMSSetValue: function(e, v) { return parentAPI.LMSSetValue(e, v); },
          LMSCommit: function(p) { return parentAPI.LMSCommit(p); },
          LMSGetLastError: function() { return parentAPI.LMSGetLastError(); },
          LMSGetErrorString: function(c) { return parentAPI.LMSGetErrorString(c); },
          LMSGetDiagnostic: function(c) { return parentAPI.LMSGetDiagnostic(c); }
        };
        console.log('[SCORM Loader] window.API proxy created');
      }
      
      if (parentAPI2004) {
        window.API_1484_11 = {
          Initialize: function(p) { return parentAPI2004.Initialize(p); },
          Terminate: function(p) { return parentAPI2004.Terminate(p); },
          GetValue: function(e) { return parentAPI2004.GetValue(e); },
          SetValue: function(e, v) { return parentAPI2004.SetValue(e, v); },
          Commit: function(p) { return parentAPI2004.Commit(p); },
          GetLastError: function() { return parentAPI2004.GetLastError(); },
          GetErrorString: function(c) { return parentAPI2004.GetErrorString(c); },
          GetDiagnostic: function(c) { return parentAPI2004.GetDiagnostic(c); }
        };
        console.log('[SCORM Loader] window.API_1484_11 proxy created');
      }
      
      // ========================================
      // RELAYER les messages postMessage
      // ========================================
      window.addEventListener('message', function(event) {
        var data = event.data;
        if (!data || !data.type) return;
        
        var frame = document.getElementById('scorm-frame');
        
        if (data.type === 'scorm_api_call' || data.type === 'scorm_content_ready') {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(data, '*');
          }
        }
        
        if (data.type === 'scorm_api_response') {
          if (frame && frame.contentWindow) {
            frame.contentWindow.postMessage(data, '*');
          }
        }
      });
      
      var frame = document.getElementById('scorm-frame');
      
      // ========================================
      // CODES ROUSSEAU : Chargement direct (iframe.src)
      // layer2.js a besoin d'accéder à window.parent.API directement
      // ========================================
      if (scormType === 'cr') {
        console.log('[SCORM Loader] Mode Codes Rousseau: chargement direct');
        
        frame.onload = function() {
          console.log('[SCORM Loader] Frame loaded (direct)');
          document.getElementById('loading').style.display = 'none';
          frame.style.display = 'block';
          
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'scorm_content_ready' }, '*');
          }
        };
        
        frame.onerror = function(e) {
          console.error('[SCORM Loader] Frame error:', e);
          document.getElementById('loading').innerHTML = '<div class="error">Erreur de chargement</div>';
        };
        
        frame.src = scormUrl;
        return;
      }
      
      // ========================================
      // STANDARD (Articulate, etc.) : Fetch + réécriture URLs + srcdoc
      // Contourne le sandboxing de Supabase Storage
      // ========================================
      console.log('[SCORM Loader] Mode Standard: fetch + rewrite URLs + srcdoc');
      document.getElementById('loading-text').textContent = 'Téléchargement...';
      
      fetch(scormUrl)
        .then(function(response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.text();
        })
        .then(function(html) {
          console.log('[SCORM Loader] HTML fetched, length:', html.length);
          document.getElementById('loading-text').textContent = 'Préparation...';
          
          // Fonction pour convertir une URL relative en absolue
          function toAbsoluteUrl(relativeUrl) {
            if (!relativeUrl) return relativeUrl;
            // Déjà absolue ?
            if (relativeUrl.match(/^(https?:\/\/|data:|blob:|javascript:|#)/i)) {
              return relativeUrl;
            }
            // URL relative
            if (relativeUrl.startsWith('/')) {
              // Relative à la racine du domaine
              var urlObj = new URL(baseUrl);
              return urlObj.origin + relativeUrl;
            }
            // Relative au dossier courant
            return baseUrl + relativeUrl;
          }
          
          // Réécrire toutes les URLs relatives en absolues
          // src="..." et href="..."
          html = html.replace(/(src|href)\s*=\s*["']([^"']+)["']/gi, function(match, attr, url) {
            var absUrl = toAbsoluteUrl(url);
            return attr + '="' + absUrl + '"';
          });
          
          // url(...) dans les styles inline
          html = html.replace(/url\s*\(\s*["']?([^"')]+)["']?\s*\)/gi, function(match, url) {
            var absUrl = toAbsoluteUrl(url);
            return 'url("' + absUrl + '")';
          });
          
          console.log('[SCORM Loader] URLs rewritten with base:', baseUrl);
          
          // Injecter le script d'API SCORM au début du <head>
          var apiScript = '<script>\n' +
            'window.API = window.parent.API;\n' +
            'window.API_1484_11 = window.parent.API_1484_11;\n' +
            'console.log("[SCORM Content] APIs inherited from parent");\n' +
            '<\/script>\n';
          
          // Modifier le HTML
          if (html.indexOf('<head>') !== -1) {
            html = html.replace('<head>', '<head>\n' + apiScript);
          } else if (html.indexOf('<HEAD>') !== -1) {
            html = html.replace('<HEAD>', '<HEAD>\n' + apiScript);
          } else {
            html = apiScript + '\n' + html;
          }
          
          frame.onload = function() {
            console.log('[SCORM Loader] Frame loaded (srcdoc)');
            document.getElementById('loading').style.display = 'none';
            frame.style.display = 'block';
            
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'scorm_content_ready' }, '*');
            }
          };
          
          // Utiliser srcdoc avec le HTML modifié
          frame.srcdoc = html;
        })
        .catch(function(error) {
          console.error('[SCORM Loader] Error:', error);
          document.getElementById('loading').innerHTML = '<div class="error">Erreur: ' + error.message + '</div>';
        });
      
    })();
  </script>
</body>
</html>
